<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script defer src="https://umami.lucius-website.xyz/script.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
<script defer src="https://umami.lucius-website.xyz/recorder.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
<title>Game Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🎮 Game Arcade</h1>
<p class="sub">Pick a game to play in your browser</p>
<div class="grid" id="games"></div>
<script>
// Add new games here
const games = [
  { name: "Flappy Bird", emoji: "🐤", url: "games/flappybird.html", desc: "Tap to flap through the pipes." },
  { name: "Tetris", emoji: "🧱", url: "games/tetris.html", desc: "Stack blocks and clear lines." },
  { name: "Top-down Racer", emoji: "🏎️", url: "games/racer.html", desc: "Race 3 laps against the clock." },
  { name: "Snake", emoji: "🐍", url: "games/snake.html", desc: "Eat apples and grow without biting yourself." },
  { name: "2048", emoji: "🔢", url: "games/2048.html", desc: "Slide and merge tiles to reach 2048." },
  { name: "Breakout", emoji: "🏓", url: "games/breakout.html", desc: "Smash neon bricks across 5 levels." },
  { name: "Memory Match", emoji: "🧠", url: "games/memory.html", desc: "Flip cards and find all the pairs." },
  { name: "Blackjack", emoji: "🃏", url: "games/blackjack.html", desc: "Beat the dealer to 21 – place your bets!" },
  { name: "Roulette", emoji: "🎡", url: "games/roulette.html", desc: "Setze auf Zahlen, Farben oder Dutzende am Roulettetisch." },
  { name: "3D Marble Blast", emoji: "🔮", url: "games/marble.html", desc: "Echte 3D Physik-Murmelbahn: Steuere die Glaskugel über Rampen, Boost-Pads und sammle Juwelen!" },
  { name: "3D City Tycoon", emoji: "🏙️", url: "games/tycoon.html", desc: "Build your dream 3D metropolis! Interactive rocket launches, emergency services, city policies, dynamic weather, ocean sailboats, and cinematic drone tours." },
  { name: "Wall Street Trader", emoji: "📈", url: "games/stocks.html", desc: "Live stock trading simulator with real-time charts, limit orders, short selling, news catalysts, dividends & margin loans." },
  { name: "Seed Maze", emoji: "🧭", url: "games/maze.html", desc: "Enter any seed to explore and solve reproducible procedural labyrinths." },
];
document.getElementById("games").innerHTML = games.map(g => `
  <a class="card" href="${g.url}">
    <div class="emoji">${g.emoji}</div>
    <h2>${g.name}</h2><p>${g.desc}</p>
  </a>`).join("");
</script>
</body>
</html>
