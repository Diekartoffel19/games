// Catalog of School & Learning Tools
const school = [
  {
    id: 'noten',
    name: 'Notenrechner Pro & Zeugnis-Planer',
    emoji: '📊',
    tag: 'grades',
    badge: 'Noten / Gewichtung & Schnitt',

  {

  }
];

let currentTab = 'games';

function renderHub() {
  document.documentElement.lang = 'de';
  updateSoundBtn();
  renderCategoryTabs();
  updateTabView();
}
function applyLang() {
  renderHub();
}

function switchMainTab(tab) {
  if (currentTab === tab) return;
  currentTab = tab;
  if (history.replaceState) {
    history.replaceState(null, '', '#' + tab);
  } else {
    window.location.hash = tab;
  }
  updateTabView();
}

function updateTabView() {
  const isGames = currentTab === 'games';
  const isTools = currentTab === 'tools';
  const isSchool = currentTab === 'school';
  
  const tabBtnGames = document.getElementById("tabBtnGames");
  const tabBtnTools = document.getElementById("tabBtnTools");
  const tabBtnSchool = document.getElementById("tabBtnSchool");
  if (tabBtnGames) tabBtnGames.classList.toggle("active", isGames);
  if (tabBtnTools) tabBtnTools.classList.toggle("active", isTools);
  if (tabBtnSchool) tabBtnSchool.classList.toggle("active", isSchool);

  const gamesSection = document.getElementById("gamesSection");
  const toolsSection = document.getElementById("toolsSection");
  const schoolSection = document.getElementById("schoolSection");
  if (gamesSection) gamesSection.style.display = isGames ? "block" : "none";
  if (toolsSection) toolsSection.style.display = isTools ? "block" : "none";
  if (schoolSection) schoolSection.style.display = isSchool ? "block" : "none";

  const catTabs = document.getElementById("categoryTabs");
  if (catTabs) catTabs.style.display = isGames ? "flex" : "none";

  const headerActions = document.getElementById("headerActions");
  if (headerActions) headerActions.style.display = isGames ? "flex" : "none";

  const hubSubtitle = document.getElementById("hubSubtitle");
  if (hubSubtitle) {
    if (isGames) {
      hubSubtitle.textContent = t("subGames");
    } else if (isTools) {
      hubSubtitle.textContent = t("subTools");
    } else if (isSchool) {
      hubSubtitle.textContent = t("subSchool");
    }
  }

  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    if (isGames) searchInput.placeholder = t("phGames");
    else if (isTools) searchInput.placeholder = t("phTools");
    else if (isSchool) searchInput.placeholder = t("phSchool");
  }

  const footerText = document.getElementById("footerText");
  if (footerText) {
    if (isGames) {
      footerText.textContent = t("footGames");
    } else if (isTools) {
      footerText.textContent = t("footTools");
    } else if (isSchool) {
      footerText.textContent = t("footSchool");
    }
  }

  applyFilter();
}

function playRandomGame() {
  window.location.href = games[Math.floor(Math.random() * games.length)].url;
}

function renderCategoryTabs() {
  const container = document.getElementById("categoryTabs");
  if (!container) return;
  container.innerHTML = CATEGORIES.map(cat => {
    const count = cat.id === 'all'
      ? games.length
      : games.filter(g => g.tag === cat.id || g.category === cat.id).length;
    const isActive = cat.id === currentCategory ? ' active' : '';
    return `<button class="tab-btn${isActive}" data-cat="${cat.id}" data-category="${cat.id}" data-tag="${cat.id}" onclick="selectCategory('${cat.id}')">${cat.name} (${count})</button>`;
  }).join("");
}

function selectCategory(catId) {
  currentCategory = catId;
  renderCategoryTabs();
  applyFilter();
}

function filterGames() {
  applyFilter();
}

function applyFilter() {
  const searchInput = document.getElementById("searchInput");
  const query = searchInput ? (searchInput.value || '').trim().toLowerCase() : '';
  const terms = query.split(/\s+/).filter(Boolean);

  if (currentTab === 'games') {
    const filtered = games.filter(g => {
      const matchesCategory = currentCategory === 'all' || g.tag === currentCategory || g.category === currentCategory;
      const hay = `${g.name || ''} ${g.desc || ''} ${g.id || ''}`.toLowerCase();
      const matchesQuery = terms.length === 0 || terms.every(term => hay.includes(term));
      return matchesCategory && matchesQuery;
    });
    renderGameCards(filtered);
  } else if (currentTab === 'tools') {
    const filteredTools = tools.filter(t => {
      const hay = `${t.name || ''} ${t.desc || ''} ${t.badge || ''} ${t.id || ''}`.toLowerCase();
      return terms.length === 0 || terms.every(term => hay.includes(term));
    });
    renderToolCards(filteredTools);
  } else if (currentTab === 'school') {
    const filteredSchool = school.filter(s => {
      const hay = `${s.name || ''} ${s.desc || ''} ${s.badge || ''} ${s.id || ''}`.toLowerCase();
      return terms.length === 0 || terms.every(term => hay.includes(term));
    });
    renderSchoolCards(filteredSchool);
  }
}

function renderGameCards(list = games) {
  const grid = document.getElementById("games");
  if (!grid) return;
  if (!list || list.length === 0) {
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;padding:48px 16px;color:#8b929e;font-size:1.05rem;">' + t("noGames") + '</div>';
    return;
  }
  grid.innerHTML = list.map(g => {
    let scoreBadge = '';
    if (window.ArcadeCore && g.id) {
      const s = ArcadeCore.getScore(g.id);
      if (s !== null && s !== undefined && s !== 0) {
        scoreBadge = `<div class="score-badge">🏆 ${t("record")}: ${ArcadeCore.formatNumber(s)}</div>`;
      }
    }
    return `
      <a class="card" href="${g.url}" data-id="${g.id}" data-tag="${g.tag || ''}" data-category="${g.category || ''}">
        ${g.isNew ? '<span class="new-badge">NEU</span>' : ''}
        <div class="emoji">${g.emoji}</div>
        <h2>${g.name}</h2>
        <p>${g.desc}</p>
        ${scoreBadge}
      </a>`;
  }).join("");
}

function renderToolCards(list = tools) {
  const grid = document.getElementById("tools");
  if (!grid) return;
  if (!list || list.length === 0) {
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;padding:48px 16px;color:#8b929e;font-size:1.05rem;">' + t("noTools") + '</div>';
    return;
  }
  grid.innerHTML = list.map(t => {
    return `
      <a class="card" href="${t.url}" data-id="${t.id}" data-tag="${t.tag || ''}">
        <div class="tool-header-row">
          <div class="emoji">${t.emoji}</div>
          <span class="tool-tag">${t.badge}</span>
        </div>
        <h2>${t.name}</h2>
        <p>${t.desc}</p>
      </a>`;
  }).join("");
}

function renderSchoolCards(list = school) {
  const grid = document.getElementById("school");
  if (!grid) return;
  if (!list || list.length === 0) {
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;padding:48px 16px;color:#8b929e;font-size:1.05rem;">' + t("noSchool") + '</div>';
    return;
  }
  grid.innerHTML = list.map(item => {
    return `
      <a class="card" href="${item.url}" data-id="${item.id}" data-tag="${item.tag || ''}">
        <div class="tool-header-row">
          <div class="emoji">${item.emoji}</div>
          <span class="tool-tag">${item.badge}</span>
        </div>
        <h2>${item.name}</h2>
        <p>${item.desc}</p>
      </a>`;
  }).join("");
}

// Global exports for tests
window.CATEGORIES = CATEGORIES;
window.games = games;
window.tools = tools;
window.school = school;
window.switchMainTab = switchMainTab;
window.selectCategory = selectCategory;
window.filterGames = filterGames;
window.applyFilter = applyFilter;
window.renderGameCards = renderGameCards;
window.renderToolCards = renderToolCards;
window.renderSchoolCards = renderSchoolCards;
window.renderCategoryTabs = renderCategoryTabs;

// Listen for browser navigation (back/forward)
window.addEventListener('hashchange', () => {
  const hash = window.location.hash.replace('#', '').toLowerCase();
  if (hash === 'tools' || hash === 'games' || hash === 'school' || hash === 'schule') {
    const target = hash === 'schule' ? 'school' : hash;
    if (currentTab !== target) {
      currentTab = target;
      updateTabView();
    }
  }
});

// Initial hash check
const initialHash = window.location.hash.replace('#', '').toLowerCase();
if (initialHash === 'tools') {
  currentTab = 'tools';
} else if (initialHash === 'school' || initialHash === 'schule') {
  currentTab = 'school';
}

// Initial render
const gCountEl = document.getElementById("gamesCount");
if (gCountEl) gCountEl.textContent = games.length;
const tCountEl = document.getElementById("toolsCount");
if (tCountEl) tCountEl.textContent = tools.length;
const sCountEl = document.getElementById("schoolCount");
if (sCountEl) sCountEl.textContent = school.length;

renderHub();
</script>
