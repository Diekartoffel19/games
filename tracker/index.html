<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
<style>
  :root {
    --bg: #0b0f17; --panel: #131a26; --line: #243045; --text: #e6edf7; --muted: #8a99b3;
    --accent: #4fd1c5; --warn: #f6ad55; --good: #68d391; --bad: #fc8181;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: 360px 1fr; gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  label { display: block; color: var(--muted); font-size: 12px; margin: 6px 0 2px; }
  input, select, button { font: inherit; color: var(--text); background: #0e1420; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input, select { width: 100%; }
  button { cursor: pointer; background: #1b2638; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #062420; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chips button { font-size: 12px; padding: 3px 8px; }
  #map { height: 460px; border-radius: 10px; border: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .stat { background: #0e1420; border-radius: 8px; padding: 8px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .stat .v { font-size: 17px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.pass { cursor: pointer; }
  tr.pass:hover, tr.pass.sel { background: #1a2436; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; }
  .vis { background: #2f4a2a; color: var(--good); }
  .nvis { background: #2a2f3a; color: var(--muted); }
  .muted { color: var(--muted); }
  .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #results button { display: block; width: 100%; text-align: left; margin-top: 4px; font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: start; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .tablewrap { overflow-x: auto; }
  #msg { color: var(--warn); font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>🛰️ Satellite Tracker</h1>
  <span class="clock" id="clock"></span>
</header>
<main>
  <aside>
    <div class="panel">
      <h2>Your position</h2>
      <div class="row">
        <div><label>Latitude</label><input id="lat" type="text" inputmode="decimal" autocomplete="off" value="47.3769"></div>
        <div><label>Longitude</label><input id="lon" type="text" inputmode="decimal" autocomplete="off" value="8.5417"></div>
      </div>
      <label>Altitude (m)</label><input id="alt" type="text" inputmode="decimal" autocomplete="off" value="400">
      <div class="row" style="margin-top:8px">
        <button id="geo">📍 Use my location</button>
      </div>
      <label>Search place</label>
      <div class="row"><input id="place" placeholder="e.g. Bern"><button id="placeBtn" style="flex:0">Go</button></div>
      <div class="muted" style="font-size:12px;margin-top:6px">Tip: click the map to set your position.</div>
    </div>

    <div class="panel">
      <h2>Satellite</h2>
      <label>Name or NORAD ID</label>
      <div class="row"><input id="satq" placeholder="ISS, NOAA 19, 25544…"><button id="satBtn" style="flex:0">Find</button></div>
      <div class="chips" id="presets"></div>
      <div id="results"></div>
      <div id="msg"></div>
    </div>

    <div class="panel">
      <h2>Pass settings</h2>
      <div class="row">
        <div><label>Min elevation (°)</label><input id="minEl" type="text" inputmode="decimal" autocomplete="off" value="10"></div>
        <div><label>Days ahead</label><input id="days" type="text" inputmode="numeric" autocomplete="off" value="3"></div>
      </div>
      <label><input type="checkbox" id="visOnly" style="width:auto"> Only visible passes (naked eye)</label>
      <label><input type="checkbox" id="notify" style="width:auto"> Notify me 5 min before next pass</label>
      <button class="primary" id="calc" style="width:100%;margin-top:8px">Calculate passes</button>
    </div>
  </aside>

  <section>
    <div class="panel">
      <h2 id="satTitle">No satellite loaded</h2>
      <div class="stats" id="stats"></div>
    </div>
    <div class="panel">
      <h2>Next pass</h2>
      <div class="big" id="countdown">—</div>
      <div class="muted" id="nextInfo"></div>
    </div>
    <div id="map"></div>
    <div class="panel" style="margin-top:12px">
      <h2>Upcoming passes</h2>
      <div class="grid2">
        <div>
          <svg id="sky" viewBox="0 0 200 200" width="100%"></svg>
          <div class="muted" id="skyInfo" style="font-size:12px">Click a pass to see its sky path.</div>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Date</th><th>Rise</th><th>Max</th><th>Set</th><th>Max el</th><th>Dur</th><th></th><th></th></tr></thead>
            <tbody id="passes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const S = satellite, D2R = Math.PI / 180, R2D = 180 / Math.PI, RE = 6371;
const $ = id => document.getElementById(id);

const PRESETS = [
  ["ISS", 25544], ["Tiangong", 48274], ["Hubble", 20580], ["NOAA 15", 25338],
  ["NOAA 18", 28654], ["NOAA 19", 33591], ["Meteor-M2 3", 57166], ["Terra", 25994], ["Landsat 9", 49260]
];

let current = null;   // { name, satrec, tle }
let passes = [];
let notifiedFor = null;

// ---------- storage helpers ----------
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

// ---------- number inputs (accept "47,5" as well as "47.5") ----------
function num(id, fallback = NaN) { const v = parseFloat($(id).value.trim().replace(",", ".")); return isFinite(v) ? v : fallback; }
const wrapLon = lon => ((lon + 180) % 360 + 360) % 360 - 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- observer ----------
let obsLat = 47.3769, obsLon = 8.5417;
function observer() {
  return { latitude: obsLat * D2R, longitude: obsLon * D2R, height: num("alt", 0) / 1000 };
}
function setObserver(lat, lon) {
  if (!isFinite(lat) || !isFinite(lon)) { $("lat").value = obsLat.toFixed(4); $("lon").value = obsLon.toFixed(4); return; }
  obsLat = clamp(lat, -90, 90); obsLon = wrapLon(lon);
  $("lat").value = obsLat.toFixed(4); $("lon").value = obsLon.toFixed(4);
  saveObs(); obsMarker.setLatLng([obsLat, obsLon]);
  if (current) computePasses();
}
function saveObs() { save("st-obs", { lat: $("lat").value, lon: $("lon").value, alt: $("alt").value }); }

// ---------- TLE fetching ----------
function parseTle(text) {
  const lines = text.trim().split(/\r?\n/).map(l => l.trim());
  const out = [];
  for (let i = 0; i + 2 < lines.length; ) {
    if (lines[i + 1]?.startsWith("1 ") && lines[i + 2]?.startsWith("2 ")) { out.push({ name: lines[i], l1: lines[i + 1], l2: lines[i + 2] }); i += 3; }
    else i++;
  }
  return out;
}
async function fetchTle(query) {
  const isId = /^\d+$/.test(query);
  const key = "st-tle-" + query.toLowerCase();
  const cached = load(key, null);
  if (cached && Date.now() - cached.t < 2 * 3600e3) return cached.list;
  const url = "https://celestrak.org/NORAD/elements/gp.php?" + (isId ? "CATNR=" : "NAME=") + encodeURIComponent(query) + "&FORMAT=tle";
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  const list = parseTle(text);
  if (list.length) save(key, { t: Date.now(), list });
  return list;
}
async function findSat(query) {
  query = query.trim(); if (!query) return;
  $("msg").textContent = "Loading…"; $("results").innerHTML = "";
  try {
    const list = await fetchTle(query);
    if (!list.length) { $("msg").textContent = "No satellite found."; return; }
    $("msg").textContent = "";
    if (list.length === 1) return selectSat(list[0]);
    list.slice(0, 15).forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.name + " (" + t.l1.slice(2, 7).trim() + ")";
      b.onclick = () => { $("results").innerHTML = ""; selectSat(t); };
      $("results").appendChild(b);
    });
  } catch (e) { $("msg").textContent = "Fetch failed: " + e.message; }
}
function selectSat(t) {
  current = { name: t.name, tle: t, satrec: S.twoline2satrec(t.l1, t.l2) };
  save("st-sat", t);
  $("satTitle").textContent = t.name + " · NORAD " + t.l1.slice(2, 7).trim();
  drawTrack(); computePasses();
}

// ---------- math ----------
function look(satrec, date, obs) {
  const pv = S.propagate(satrec, date);
  if (!pv.position) return null;
  const gmst = S.gstime(date);
  const ecf = S.eciToEcf(pv.position, gmst);
  const la = S.ecfToLookAngles(obs, ecf);
  const gd = S.eciToGeodetic(pv.position, gmst);
  return {
    az: (la.azimuth * R2D + 360) % 360, el: la.elevation * R2D, range: la.rangeSat,
    lat: S.degreesLat(gd.latitude), lon: S.degreesLong(gd.longitude), alt: gd.height,
    pos: pv.position, vel: pv.velocity, gmst
  };
}
function sunEci(date) {
  const n = date.getTime() / 86400000 + 2440587.5 - 2451545;
  const L = (280.460 + 0.9856474 * n) * D2R, g = (357.528 + 0.9856003 * n) * D2R;
  const lam = L + (1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R;
  const eps = (23.439 - 0.0000004 * n) * D2R;
  const r = (1.00014 - 0.01671 * Math.cos(g) - 0.00014 * Math.cos(2 * g)) * 149597870;
  return { x: r * Math.cos(lam), y: r * Math.cos(eps) * Math.sin(lam), z: r * Math.sin(eps) * Math.sin(lam) };
}
function sunElevation(date, obs) {
  const ecf = S.eciToEcf(sunEci(date), S.gstime(date));
  return S.ecfToLookAngles(obs, ecf).elevation * R2D;
}
function sunlit(pos, date) {
  const s = sunEci(date), m = Math.hypot(s.x, s.y, s.z);
  const u = { x: s.x / m, y: s.y / m, z: s.z / m };
  const d = pos.x * u.x + pos.y * u.y + pos.z * u.z;
  if (d > 0) return true;
  return Math.hypot(pos.x - d * u.x, pos.y - d * u.y, pos.z - d * u.z) > RE;
}

// ---------- pass prediction ----------
function computePasses() {
  if (!current) return;
  const obs = observer(), minEl = clamp(num("minEl", 0), 0, 89), days = clamp(Math.round(num("days", 3)), 1, 10);
  const visOnly = $("visOnly").checked;
  const start = Date.now(), end = start + days * 86400e3, step = 20e3;
  const elAt = t => { const l = look(current.satrec, new Date(t), obs); return l ? l.el : -90; };
  const refine = (a, b) => { // find crossing of el=0 between a and b
    for (let i = 0; i < 20; i++) { const m = (a + b) / 2; (elAt(a) < 0) === (elAt(m) < 0) ? a = m : b = m; }
    return (a + b) / 2;
  };
  const out = [];
  let prev = elAt(start), cur = null;
  if (prev >= 0) cur = { aos: start, path: [], maxEl: -90 };
  for (let t = start + step; t <= end; t += step) {
    const l = look(current.satrec, new Date(t), obs);
    const el = l ? l.el : -90;
    if (el >= 0 && prev < 0) cur = { aos: refine(t - step, t), path: [], maxEl: -90 };
    if (cur && el >= 0) {
      cur.path.push({ az: l.az, el, t });
      if (el > cur.maxEl) { cur.maxEl = el; cur.tca = t; cur.maxAz = l.az; cur.vis = sunlit(l.pos, new Date(t)) && sunElevation(new Date(t), obs) < -6; }
      if (!cur.vis && sunlit(l.pos, new Date(t)) && sunElevation(new Date(t), obs) < -6 && el >= 10) cur.vis = true;
    }
    if (el < 0 && prev >= 0 && cur) {
      cur.los = refine(t - step, t);
      const a = look(current.satrec, new Date(cur.aos), obs), b = look(current.satrec, new Date(cur.los), obs);
      cur.aosAz = a ? a.az : 0; cur.losAz = b ? b.az : 0;
      if (cur.maxEl >= minEl && (!visOnly || cur.vis)) out.push(cur);
      cur = null;
    }
    prev = el;
  }
  passes = out;
  renderPasses();
}

// ---------- rendering ----------
const fmtT = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtD = t => new Date(t).toLocaleDateString([], { weekday: "short", day: "2-digit", month: "2-digit" });
const compass = az => ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(az / 22.5) % 16];
const dur = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s"; };

function renderPasses() {
  const tb = $("passes"); tb.innerHTML = "";
  if (!passes.length) { tb.innerHTML = '<tr><td colspan="8" class="muted">No passes found in this window.</td></tr>'; return; }
  passes.forEach((p, i) => {
    const tr = document.createElement("tr"); tr.className = "pass";
    tr.innerHTML = `<td>${fmtD(p.aos)}</td><td>${fmtT(p.aos)}<br><span class="muted">${compass(p.aosAz)}</span></td>
      <td>${fmtT(p.tca)}<br><span class="muted">${compass(p.maxAz)}</span></td>
      <td>${fmtT(p.los)}<br><span class="muted">${compass(p.losAz)}</span></td>
      <td>${p.maxEl.toFixed(0)}°</td><td>${dur(p.los - p.aos)}</td>
      <td><span class="badge ${p.vis ? "vis" : "nvis"}">${p.vis ? "visible" : "not visible"}</span></td>
      <td><button title="Add to calendar">📅</button></td>`;
    tr.onclick = e => {
      if (e.target.tagName === "BUTTON") return downloadIcs(p);
      document.querySelectorAll("tr.pass").forEach(r => r.classList.remove("sel"));
      tr.classList.add("sel"); drawSky(p);
    };
    tb.appendChild(tr);
    if (i === 0) { tr.classList.add("sel"); drawSky(p); }
  });
}

function drawSky(p) {
  const pt = (az, el) => { const r = 90 * (90 - Math.max(0, el)) / 90; return [100 + r * Math.sin(az * D2R), 100 - r * Math.cos(az * D2R)]; };
  let svg = "";
  [90, 60, 30].forEach(r => svg += `<circle cx="100" cy="100" r="${r}" fill="none" stroke="#243045"/>`);
  svg += `<line x1="10" y1="100" x2="190" y2="100" stroke="#243045"/><line x1="100" y1="10" x2="100" y2="190" stroke="#243045"/>`;
  [["N",100,8],["E",195,103],["S",100,198],["W",5,103]].forEach(([t,x,y]) => svg += `<text x="${x}" y="${y}" fill="#8a99b3" font-size="9" text-anchor="middle">${t}</text>`);
  svg += `<text x="104" y="40" fill="#5a6a85" font-size="7">30°</text><text x="104" y="70" fill="#5a6a85" font-size="7">60°</text>`;
  if (p) {
    const pts = [pt(p.aosAz, 0), ...p.path.map(q => pt(q.az, q.el)), pt(p.losAz, 0)];
    svg += `<polyline points="${pts.map(q => q.join(",")).join(" ")}" fill="none" stroke="${p.vis ? "#68d391" : "#4fd1c5"}" stroke-width="2"/>`;
    const [sx, sy] = pts[0], [ex, ey] = pts[pts.length - 1], [mx, my] = pt(p.maxAz, p.maxEl);
    svg += `<circle cx="${sx}" cy="${sy}" r="3" fill="#68d391"/><circle cx="${ex}" cy="${ey}" r="3" fill="#fc8181"/><circle cx="${mx}" cy="${my}" r="3" fill="#f6ad55"/>`;
    $("skyInfo").innerHTML = `Rise ${compass(p.aosAz)} (${p.aosAz.toFixed(0)}°) · max ${p.maxEl.toFixed(0)}° ${compass(p.maxAz)} · set ${compass(p.losAz)} (${p.losAz.toFixed(0)}°)<br>
      <span style="color:#68d391">●</span> rise <span style="color:#f6ad55">●</span> max <span style="color:#fc8181">●</span> set`;
  }
  $("sky").innerHTML = svg;
}

function downloadIcs(p) {
  const f = t => new Date(t).toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SatTracker//EN","BEGIN:VEVENT",
    "UID:" + p.aos + "@sattracker", "DTSTAMP:" + f(Date.now()), "DTSTART:" + f(p.aos), "DTEND:" + f(p.los),
    "SUMMARY:" + current.name + " pass (max " + p.maxEl.toFixed(0) + "°)",
    "DESCRIPTION:Rise " + compass(p.aosAz) + "\\, max " + p.maxEl.toFixed(0) + "° " + compass(p.maxAz) + "\\, set " + compass(p.losAz) + (p.vis ? "\\, visible" : ""),
    "BEGIN:VALARM","TRIGGER:-PT5M","ACTION:DISPLAY","DESCRIPTION:Satellite pass soon","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = current.name.replace(/\W+/g, "_") + "_pass.ics"; a.click();
}

// ---------- map ----------
const map = L.map("map", { worldCopyJump: true }).setView([obsLat, obsLon], 2);
const satLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles © Esri", maxZoom: 12
}).addTo(map);
const osmLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap", maxZoom: 12
});
L.control.layers({ "Satellit": satLayer, "Karte (OSM)": osmLayer }).addTo(map);
const obsMarker = L.circleMarker([0, 0], { radius: 6, color: "#f6ad55", fillOpacity: 1 }).addTo(map).bindTooltip("You");
const satMarker = L.marker([0, 0], { icon: L.divIcon({ html: "🛰️", className: "", iconSize: [24, 24], iconAnchor: [12, 12] }) });
const footprint = L.circle([0, 0], { radius: 1, color: "#4fd1c5", weight: 1, fillOpacity: 0.08 });
const trackLayer = L.layerGroup().addTo(map);
const terminator = L.polygon([], { stroke: false, fillColor: "#000", fillOpacity: 0.35, interactive: false }).addTo(map);
map.on("click", e => setObserver(e.latlng.lat, e.latlng.lng));

function splitLine(pts) {
  const segs = [[]];
  pts.forEach((p, i) => { if (i && Math.abs(p[1] - pts[i - 1][1]) > 180) segs.push([]); segs[segs.length - 1].push(p); });
  return segs;
}
function drawTrack() {
  trackLayer.clearLayers();
  if (!current) return;
  const now = Date.now(), past = [], fut = [];
  for (let m = -45; m <= 90; m += 1) {
    const pv = S.propagate(current.satrec, new Date(now + m * 60e3));
    if (!pv.position) continue;
    const gd = S.eciToGeodetic(pv.position, S.gstime(new Date(now + m * 60e3)));
    (m <= 0 ? past : fut).push([S.degreesLat(gd.latitude), S.degreesLong(gd.longitude)]);
  }
  splitLine(past).forEach(s => L.polyline(s, { color: "#8a99b3", weight: 1.5, dashArray: "4 4" }).addTo(trackLayer));
  splitLine(fut).forEach(s => L.polyline(s, { color: "#4fd1c5", weight: 2 }).addTo(trackLayer));
}
function drawTerminator() {
  // subsolar point, then night-side polygon
  const now = new Date(), s = sunEci(now);
  const gd = S.eciToGeodetic(s, S.gstime(now));
  const sLat = Math.atan2(s.z, Math.hypot(s.x, s.y)), sLon = gd.longitude;
  const pts = [];
  for (let lon = -180; lon <= 180; lon += 2) {
    const lat = Math.atan(-Math.cos(lon * D2R - sLon) / Math.tan(sLat)) * R2D;
    pts.push([lat, lon]);
  }
  const pole = sLat > 0 ? -90 : 90;
  terminator.setLatLngs([[pole, -180], ...pts, [pole, 180]]);
}

// ---------- live loop ----------
function stat(k, v) { return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
function tick() {
  const now = new Date();
  $("clock").textContent = now.toLocaleString() + " · UTC " + now.toISOString().slice(11, 19);
  if (!current) return;
  const obs = observer(), l = look(current.satrec, now, obs), l2 = look(current.satrec, new Date(+now + 1000), obs);
  if (!l || !l2) { $("stats").innerHTML = '<span class="muted">TLE propagation failed (decayed or stale TLE).</span>'; return; }
  const speed = Math.hypot(l.vel.x, l.vel.y, l.vel.z), rr = l2.range - l.range;
  const lit = sunlit(l.pos, now), sunEl = sunElevation(now, obs);
  const epochDays = (now - new Date(Date.UTC((y => y < 57 ? 2000 + y : 1900 + y)(+current.tle.l1.slice(18, 20)), 0, 1)) ) / 86400e3 - (+current.tle.l1.slice(20, 32) - 1);
  $("stats").innerHTML =
    stat("Azimuth", l.az.toFixed(1) + "° " + compass(l.az)) +
    stat("Elevation", `<span style="color:${l.el > 0 ? "var(--good)" : "inherit"}">${l.el.toFixed(1)}°</span>`) +
    stat("Range", l.range.toFixed(0) + " km") +
    stat("Range rate", (rr >= 0 ? "+" : "") + rr.toFixed(2) + " km/s") +
    stat("Altitude", l.alt.toFixed(0) + " km") +
    stat("Speed", speed.toFixed(2) + " km/s") +
    stat("Sub-point", l.lat.toFixed(2) + ", " + l.lon.toFixed(2)) +
    stat("Sunlight", lit ? "☀️ sunlit" : "🌑 eclipse") +
    stat("Sun at you", sunEl.toFixed(0) + "°") +
    stat("Doppler 145.8 MHz", (-rr / 299792.458 * 145.8e6 / 1000).toFixed(2) + " kHz") +
    stat("Period", (2 * Math.PI / current.satrec.no).toFixed(1) + " min") +
    stat("TLE age", epochDays.toFixed(1) + " days");
  satMarker.setLatLng([l.lat, l.lon]).addTo(map).unbindTooltip().bindTooltip(current.name);
  footprint.setLatLng([l.lat, l.lon]).setRadius(RE * Math.acos(RE / (RE + l.alt)) * 1000).addTo(map);

  // countdown
  passes = passes.filter(p => p.los > +now);
  const next = passes[0];
  if (!next) { $("countdown").textContent = "—"; $("nextInfo").textContent = "No pass in window."; return; }
  if (next.aos <= +now) {
    $("countdown").innerHTML = '<span style="color:var(--good)">Overhead now!</span>';
    $("nextInfo").textContent = `Look ${compass(l.az)} at ${l.el.toFixed(0)}° elevation · sets in ${dur(next.los - now)}`;
  } else {
    const s = Math.floor((next.aos - now) / 1000);
    $("countdown").textContent = `${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, "0")}m ${String(s % 60).padStart(2, "0")}s`;
    $("nextInfo").textContent = `Rises ${fmtD(next.aos)} ${fmtT(next.aos)} in the ${compass(next.aosAz)}, max ${next.maxEl.toFixed(0)}°${next.vis ? " · visible to the eye" : ""}`;
    if ($("notify").checked && next.aos - now < 5 * 60e3 && notifiedFor !== next.aos && "Notification" in window && Notification.permission === "granted") {
      notifiedFor = next.aos;
      new Notification(current.name + " rises in 5 minutes", { body: `From ${compass(next.aosAz)}, max ${next.maxEl.toFixed(0)}°` });
    }
  }
}

// ---------- wiring ----------
PRESETS.forEach(([n, id]) => {
  const b = document.createElement("button"); b.textContent = n;
  b.onclick = () => findSat(String(id)); $("presets").appendChild(b);
});
$("satBtn").onclick = () => findSat($("satq").value);
$("satq").onkeydown = e => e.key === "Enter" && findSat($("satq").value);
$("calc").onclick = computePasses;
["minEl", "days", "visOnly"].forEach(id => $(id).onchange = computePasses);
["lat", "lon"].forEach(id => {
  $(id).onchange = () => setObserver(num("lat"), num("lon"));
  $(id).onkeydown = e => e.key === "Enter" && $(id).blur();
});
$("alt").onchange = () => { $("alt").value = String(Math.round(num("alt", 0))); saveObs(); if (current) computePasses(); };
["minEl", "days"].forEach(id => $(id).onkeydown = e => e.key === "Enter" && computePasses());
$("geo").onclick = () => {
  if (!navigator.geolocation) return alert("Geolocation not supported");
  navigator.geolocation.getCurrentPosition(p => {
    if (p.coords.altitude != null) $("alt").value = Math.round(p.coords.altitude);
    setObserver(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 4);
  }, e => alert("Location error: " + e.message));
};
async function searchPlace() {
  const q = $("place").value.trim(); if (!q) return;
  try {
    const r = await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q))).json();
    if (!r.length) return alert("Place not found");
    setObserver(+r[0].lat, +r[0].lon); map.setView([+r[0].lat, +r[0].lon], 5);
  } catch (e) { alert("Search failed: " + e.message); }
}
$("placeBtn").onclick = searchPlace;
$("place").onkeydown = e => e.key === "Enter" && searchPlace();
$("notify").onchange = () => { if ($("notify").checked && "Notification" in window) Notification.requestPermission(); };

const o = load("st-obs", null);
if (o) $("alt").value = o.alt ?? "400";
const oLat = o ? parseFloat(String(o.lat).replace(",", ".")) : obsLat, oLon = o ? parseFloat(String(o.lon).replace(",", ".")) : obsLon;
if (isFinite(oLat) && isFinite(oLon)) { obsLat = clamp(oLat, -90, 90); obsLon = wrapLon(oLon); }
$("lat").value = obsLat.toFixed(4); $("lon").value = obsLon.toFixed(4);
obsMarker.setLatLng([obsLat, obsLon]);
map.setView([obsLat, obsLon], 3);
drawSky(null); drawTerminator();
const savedSat = load("st-sat", null);
try { savedSat ? selectSat(savedSat) : findSat("25544"); } catch { findSat("25544"); }
setInterval(tick, 1000); tick();
setInterval(() => { drawTrack(); drawTerminator(); }, 60e3);
</script>
