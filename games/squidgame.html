/* =========================================================================
   AUTHENTIC SQUID GAME WEB AUDIO SYNTHESIZER
   ========================================================================= */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioCtx = new AudioCtx();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Background Music Sequencer: "Pink Soldiers" Theme & Rain Ambience
let musicTimer = null;
let musicStep = 0;
function startMusic() {
  if (!musicEnabled) return;
  initAudio();
  if (musicTimer) clearInterval(musicTimer);
  musicStep = 0;
  musicTimer = setInterval(stepMusic, 220);
}

function stopMusic() {
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = null;
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  document.getElementById('musicBtn').textContent = musicEnabled ? '🎵' : '🔇';
  if (musicEnabled) startMusic();
  else stopMusic();
}

// Iconic Pink Soldiers / Way Back Then sequence
function stepMusic() {
  if (!musicEnabled || !soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;

  // Bass groove (Dum dum dum dum)
  const bassNotes = [110, 0, 110, 110, 110, 0, 123.47, 98]; // A2, B2, G2
  const note = bassNotes[musicStep % bassNotes.length];
  if (note > 0) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(note, now);
      gain.gain.setValueAtTime(0.045, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    } catch(e) {}
  }

  // Flute melody on round 5 or menu
  if (currentState === STATE.MENU || currentState === STATE.GAME_5) {
    const fluteNotes = [0, 440, 0, 493.88, 523.25, 0, 440, 0, 392, 0, 440, 0];
    const fNote = fluteNotes[musicStep % fluteNotes.length];
    if (fNote > 0) {
      try {
        const fOsc = audioCtx.createOscillator();
        const fGain = audioCtx.createGain();
        fOsc.type = 'sine';
        fOsc.frequency.setValueAtTime(fNote, now);
        fGain.gain.setValueAtTime(0.04, now);
        fGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
        fOsc.connect(fGain);
        fGain.connect(audioCtx.destination);
        fOsc.start(now);
        fOsc.stop(now + 0.28);
      } catch(e) {}
    }
  }

  musicStep++;
}

// Sound effects generator
const Sfx = {
  playTone(freq, dur, type = 'sine', vol = 0.15) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  },

  // Eerie doll singing tune: "Mu-gung-hwa kko-chi pi-eot-seum-ni-da" (무궁화 꽃이 피었습니다)
  singDollWord(step, speedMultiplier = 1) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    const melody = [
      392, 392, 440, 440, 392, 392, 329.6,
      392, 392, 329.6, 293.7, 261.6
    ];
    const freq = melody[step % melody.length];
    const dur = 0.26 / speedMultiplier;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const formant = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      formant.type = 'bandpass';
      formant.frequency.setValueAtTime(900, now);
      formant.Q.setValueAtTime(4.0, now);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(formant);
      formant.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + dur);
    } catch(e) {}
  },

  sniperShot() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const bufSize = Math.floor(audioCtx.sampleRate * 0.4);
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.12));
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2400, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + 0.38);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + 0.3);
      oscGain.gain.setValueAtTime(0.45, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } catch(e) {}
  },

  buzzer() {
    this.playTone(130, 0.45, 'sawtooth', 0.35);
  },

  chime() {
    if (!soundEnabled) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.35, 'sine', 0.18), i * 85);
    });
  },

  crack() {
    this.playTone(180, 0.08, 'sawtooth', 0.35);
  },

  lighterClick() {
    this.playTone(1400, 0.04, 'square', 0.2);
    setTimeout(() => this.playTone(600, 0.08, 'sawtooth', 0.15), 40);
  },

  lighterBurn() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(280 + Math.random() * 80, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch(e) {}
  },

  glassShatter() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          this.playTone(1800 + Math.random() * 2600, 0.14, 'triangle', 0.18);
        }, i * 28);
      }
    } catch (e) {}
  },

  hit() {
    this.playTone(110, 0.12, 'sawtooth', 0.3);
  },

  thunder() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const bufSize = Math.floor(audioCtx.sampleRate * 0.8);
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.35));
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(350, now);
      filter.frequency.exponentialRampToValueAtTime(60, now + 0.8);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    } catch(e) {}
  }
};

/* =========================================================================
   PARTICLES & BLOOD DECALS
   ========================================================================= */
class Particle {
  constructor(x, y, vx, vy, color, size, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.size = size;
    this.maxLife = life;
    this.life = life;
  }
  update(dt) {
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    this.vy += 0.18 * dt * 60;
    this.life -= dt;
  }
  draw(c) {
    if (this.life <= 0) return;
    c.save();
    c.globalAlpha = Math.max(0, this.life / this.maxLife);
    c.fillStyle = this.color;
    c.beginPath();
    c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

function spawnMoneyParticles(x, y, count = 28) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;
    particles.push(new Particle(
      x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed - 3,
      Math.random() > 0.3 ? '#fbbf24' : '#f59e0b',
      3 + Math.random() * 4,
      1.2 + Math.random() * 0.8
    ));
  }
}

function spawnShatterParticles(x, y, count = 35) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 9;

      Math.sin(angle) * speed,
      '#a5f3fc',
      2 + Math.random() * 4,
      0.8 + Math.random() * 0.6
    ));
  }
}

function spawnEliminationParticles(x, y) {

      2.5 + Math.random() * 3,
      0.8 + Math.random() * 0.5
    ));
  }
}

  phraseCount: 0,
  fakeout: false,
  scanTimer: 0,
  grace: 0,

  laserTarget: null,
  competitors: [],
  eliminatedCount: 0,

  init() {
    this.playerX = 640;
    this.playerY = 660;
    this.playerVx = 0;
    this.playerVy = 0;
    this.isMoving = false;
    this.isSprinting = false;
    this.reachedFinish = false;
    this.timer = 50.0;

    this.dollHeadAngle = 0;
    this.dollPhase = 'singing';
    this.syllableStep = 0;
    this.syllableTimer = 0;
    this.singSpeed = 1.0;
    this.phraseCount = 0;
    this.fakeout = false;
    this.scanTimer = 0;
    this.grace = 0;
    this.laserTarget = null;
    this.eliminatedCount = 0;
    bloodDecals = [];

    this.competitors = [];
    const specialIds = [1, 67, 199, 218, 101, 212];
    for (let i = 0; i < 38; i++) {
      const id = i < specialIds.length ? specialIds[i] : 100 + i;
      this.competitors.push({
        id,
        x: 140 + Math.random() * 1000,
        y: 600 + Math.random() * 80,
        speed: 2.2 + Math.random() * 1.8,
        alive: true,
        finished: false,
        reactionDelay: 0.12 + Math.random() * 0.32,
        moving: false
      });
    }
  },

  update(dt) {
    if (this.timer > 0 && !this.reachedFinish) {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.timer = 0;
        this.eliminatePlayer("Time is up! The snipers fired in sync.");
        return;
      }
    }

    this.isSprinting = keys['ShiftLeft'] || keys['ShiftRight'] || touchExtraActive;
    const speed = this.isSprinting ? 5.2 : 3.2;

    const wantsForward = keys['Space'] || keys['KeyW'] || keys['ArrowUp'] || mouse.down || touchActive;
    const sideInput = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);

    if (wantsForward && !this.reachedFinish) {
      this.playerVy = -speed;
    } else {
      this.playerVy *= 0.6;
    }

    if (sideInput !== 0 && !this.reachedFinish) {
      this.playerVx = sideInput * 2.8;
    } else {
      this.playerVx *= 0.6;
    }

    this.playerX = Math.max(90, Math.min(1190, this.playerX + this.playerVx * dt * 60));
    this.playerY += this.playerVy * dt * 60;

    this.isMoving = Math.hypot(this.playerVx, this.playerVy) > 0.45;

    if (this.playerY <= 170 && !this.reachedFinish) {
      this.playerY = 170;
      this.reachedFinish = true;
      Sfx.chime();
      addFloatText(this.playerX, 140, 'GOAL REACHED! SAFE!', '#10b981', 34);
      scheduleAdvance(1500);
    }

    if (this.dollPhase === 'singing') {
      this.dollHeadAngle = 0;
      this.syllableTimer += dt;
      const rush = this.syllableStep >= 9 ? 1.6 : 1.0;
      const interval = 0.28 / (this.singSpeed * rush);

      if (this.syllableTimer >= interval) {
        this.syllableTimer = 0;
        Sfx.singDollWord(this.syllableStep, this.singSpeed * rush);
        this.syllableStep++;
        if (this.syllableStep >= 12) {
          this.syllableStep = 0;
          this.phraseCount++;
          this.dollPhase = 'turning_to_red';
          this.fakeout = this.phraseCount >= 2 && Math.random() < 0.28;
          this.singSpeed = 1.0 + Math.random() * 0.65 + Math.min(0.8, this.phraseCount * 0.12);
        }
      }
    } else if (this.dollPhase === 'turning_to_red') {
      this.dollHeadAngle += dt * 13;
      if (this.fakeout && this.dollHeadAngle >= Math.PI * 0.45) {
        this.fakeout = false;
        this.dollPhase = 'turning_to_green';
      } else if (this.dollHeadAngle >= Math.PI) {
        this.dollHeadAngle = Math.PI;
        this.dollPhase = 'scanning';
        this.scanTimer = 2.0 + Math.random() * 1.5;
        this.grace = 0.12;
        this.competitors.forEach(ai => { ai.reactionDelay = 0.1 + Math.random() * 0.35; });
        Sfx.buzzer();
      }
    } else if (this.dollPhase === 'scanning') {
      this.dollHeadAngle = Math.PI;
      this.scanTimer -= dt;
      this.grace -= dt;

      if (this.isMoving && !this.reachedFinish && this.grace <= 0) {
        this.laserTarget = { x: this.playerX, y: this.playerY };
        this.eliminatePlayer("MOVEMENT DETECTED! Scanner alarm triggered.");
        return;
      }

      this.competitors.forEach(ai => {
        if (ai.alive && !ai.finished && ai.moving) {
          ai.reactionDelay -= dt;
          if (ai.reactionDelay < 0) {
            ai.alive = false;
            ai.moving = false;
            this.eliminatedCount++;
            survivors = Math.max(2, survivors - 10);
            updateHud();
            Sfx.sniperShot();
            shake = 8;
            spawnEliminationParticles(ai.x, ai.y);
            addFloatText(ai.x, ai.y - 36, `#${ai.id} ✕`, '#ef4444', 18);
          }
        }
      });

      if (this.scanTimer <= 0) {
        this.dollPhase = 'turning_to_green';
      }
    } else if (this.dollPhase === 'turning_to_green') {
      this.dollHeadAngle -= dt * 10;
      if (this.dollHeadAngle <= 0) {
        this.dollHeadAngle = 0;
        this.dollPhase = 'singing';
      }
    }

    this.competitors.forEach(ai => {
      if (!ai.alive || ai.finished) return;
      if (this.dollPhase === 'singing') {
        ai.moving = true;
        ai.y -= ai.speed * dt * 60;
        if (ai.y <= 170) {
          ai.y = 170;
          ai.finished = true;
          ai.moving = false;
        }
      } else if (this.dollPhase === 'turning_to_red' || this.dollPhase === 'scanning') {
        if (Math.random() < 0.05) ai.moving = false;
      } else {
        ai.moving = false;
      }
    });
  },

  eliminatePlayer(reason) {
    Sfx.sniperShot();
    shake = 20;
    spawnEliminationParticles(this.playerX, this.playerY);
    triggerGameOver(reason);
  },

  draw(c) {
    c.fillStyle = '#c89968';
    c.fillRect(0, 0, 1280, 720);

    c.fillStyle = '#60a5fa';
    c.fillRect(0, 0, 1280, 120);

    c.fillStyle = 'rgba(255, 255, 255, 0.65)';
    [200, 500, 800, 1100].forEach((cx) => {
      c.beginPath();
      c.arc(cx, 40, 24, 0, Math.PI * 2);
      c.arc(cx + 25, 35, 30, 0, Math.PI * 2);
      c.arc(cx + 50, 40, 22, 0, Math.PI * 2);
      c.fill();
    });

    bloodDecals.forEach(b => {
      c.fillStyle = 'rgba(153, 27, 27, 0.75)';
      c.beginPath();
      c.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      c.fill();
    });

    c.fillStyle = '#5c2b0c';
    c.fillRect(626, 60, 28, 75);
    c.fillStyle = '#166534';
    c.beginPath();
    c.arc(640, 55, 68, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = '#ef4444';
    c.lineWidth = 6;
    c.setLineDash([16, 12]);
    c.beginPath();
    c.moveTo(60, 170);
    c.lineTo(1220, 170);
    c.stroke();
    c.setLineDash([]);

    c.fillStyle = 'rgba(239, 68, 68, 0.45)';
    c.font = '900 22px system-ui';
    c.textAlign = 'center';
    c.fillText('FINISH LINE (SAFE ZONE)', 640, 160);

    drawSniperTower(c, 80, 130, 'circle');
    drawSniperTower(c, 1200, 130, 'triangle');

    this.drawDoll(c, 640, 125);

    this.competitors.forEach(ai => {
      if (!ai.alive) {
        c.save();
        c.fillStyle = '#064e3b';
        c.fillRect(ai.x - 14, ai.y - 4, 28, 8);
        c.fillStyle = '#0f172a';
        c.beginPath();
        c.arc(ai.x - 14, ai.y, 5, 0, Math.PI * 2);
        c.fill();
        c.restore();
      } else {
        drawTracksuitPlayer(c, ai.x, ai.y, ai.id, false, ai.moving);
      }
    });

    drawTracksuitPlayer(c, this.playerX, this.playerY, 456, true, this.isMoving);

    if (this.dollPhase === 'scanning') {
      c.save();
      c.fillStyle = 'rgba(239, 68, 68, 0.12)';
      c.fillRect(0, 120, 1280, 600);

      const laserY = 170 + Math.sin(Date.now() * 0.007) * 220 + 220;
      c.strokeStyle = 'rgba(255, 16, 96, 0.7)';
      c.lineWidth = 3;
      c.shadowColor = '#ff1060';
      c.shadowBlur = 14;
      c.beginPath();
      c.moveTo(0, laserY);
      c.lineTo(1280, laserY);
      c.stroke();
      c.restore();
    }

    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.92)';
    c.strokeStyle = this.dollPhase === 'scanning' ? '#ef4444' : '#10b981';
    c.lineWidth = 3;
    c.beginPath();
    c.roundRect(470, 18, 340, 72, 14);
    c.fill();
    c.stroke();

    c.textAlign = 'center';
    c.font = '900 24px system-ui';
    c.fillStyle = this.dollPhase === 'scanning' ? '#ef4444' : '#10b981';
    c.fillText(this.dollPhase === 'scanning' ? '🛑 RED LIGHT!' : '🟢 GREEN LIGHT!', 640, 50);

    c.font = '700 14px system-ui';
    c.fillStyle = '#e2e8f0';
    c.fillText(`TIME LEFT: ${Math.ceil(this.timer)}s | [SPACE/W] RUN · [SHIFT] SPRINT`, 640, 74);
    c.restore();

    const progress = Math.min(1, (660 - this.playerY) / 490);
    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.85)';
    c.fillRect(24, 200, 16, 440);
    c.fillStyle = '#10b981';
    c.fillRect(24, 200 + 440 * (1 - progress), 16, 440 * progress);
    c.strokeStyle = '#fff';
    c.lineWidth = 1.5;
    c.strokeRect(24, 200, 16, 440);
    c.restore();
  },

  drawDoll(c, x, y) {
    c.save();
    c.translate(x, y);

    c.fillStyle = '#ea580c';
    c.beginPath();
    c.moveTo(-22, 10);
    c.lineTo(22, 10);
    c.lineTo(34, 56);
    c.lineTo(-34, 56);
    c.closePath();
    c.fill();

    c.fillStyle = '#fde047';
    c.beginPath();
    c.arc(0, 10, 13, 0, Math.PI);
    c.fill();

    const facingFront = this.dollHeadAngle > Math.PI * 0.5;
    c.fillStyle = '#fed7aa';
    c.beginPath();
    c.arc(0, -15, 24, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = '#0f172a';
    if (!facingFront) {
      c.beginPath();
      c.arc(0, -17, 25, Math.PI, Math.PI * 2);
      c.fill();
      c.fillRect(-34, -15, 10, 26);
      c.fillRect(24, -15, 10, 26);
      c.fillStyle = '#ff1060';
      c.fillRect(-34, -15, 10, 4);
      c.fillRect(24, -15, 10, 4);
    } else {
      c.fillRect(-22, -38, 44, 14);
      c.fillRect(-34, -15, 10, 26);
      c.fillRect(24, -15, 10, 26);

      c.fillStyle = this.dollPhase === 'scanning' ? '#ef4444' : '#1e293b';
      c.shadowColor = '#ff1060';
      c.shadowBlur = this.dollPhase === 'scanning' ? 12 : 0;
      c.beginPath();
      c.arc(-8, -14, 4, 0, Math.PI * 2);
      c.arc(8, -14, 4, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 0;

      c.fillStyle = '#f472b6';
      c.beginPath();
      c.arc(-14, -6, 5, 0, Math.PI * 2);
      c.arc(14, -6, 5, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = '#991b1b';
      c.lineWidth = 2;
      c.beginPath();
      c.arc(0, -4, 6, 0, Math.PI);
      c.stroke();
    }

    c.restore();
  }
};

function drawSniperTower(c, x, y, symbol) {
  c.save();
  c.translate(x, y);
  c.fillStyle = '#334155';
  c.fillRect(-15, 0, 30, 80);
  c.fillStyle = '#1e293b';
  c.fillRect(-24, -8, 48, 12);
  drawGuard(c, 0, -20, symbol);
  c.restore();
}

/* =========================================================================
   GAME 2: DALGONA HONEYCOMB (HONEYCOMB CANDY) + LIGHTER ITEM
   ========================================================================= */
const SHAPE_NAMES = { circle: 'CIRCLE', triangle: 'TRIANGLE', star: 'STAR', umbrella: 'UMBRELLA' };
const SHAPE_DIFFICULTY = { circle: '★☆☆☆', triangle: '★★☆☆', star: '★★★☆', umbrella: '★★★★' };
const SHAPE_ORDER = ['circle', 'triangle', 'star', 'umbrella'];

const Game2 = {
  selectedShape: 'star',
  cookieRadius: 210,
  stress: 0,
  cutProgress: 0,
  shapePoints: [],
  needleX: 640,
  needleY: 360,
  isCarving: false,
  isLicking: false,
  isLighter: false,
  lighterFuel: 100,
  cracked: false,
  done: false,
  timer: 60.0,

  init(shape = 'star') {
    this.selectedShape = shape;
    this.stress = 0;
    this.cutProgress = 0;
    this.needleX = 640;
    this.needleY = 240;
    this.isCarving = false;
    this.isLicking = false;
    this.isLighter = false;
    this.lighterFuel = 100;
    this.cracked = false;
    this.done = false;
    this.timer = { circle: 45, triangle: 50, star: 60, umbrella: 75 }[shape] || 60;
    this.generateShapePath();
  },

  generateShapePath() {
    this.shapePoints = [];
    const cx = 640, cy = 360;
    const r = 110;

    if (this.selectedShape === 'triangle') {
      for (let i = 0; i <= 60; i++) {
        const seg = Math.floor(i / 20) % 3;
        const t = (i % 20) / 20;
        const a1 = (seg * 2 * Math.PI) / 3 - Math.PI / 2;
        const a2 = ((seg + 1) * 2 * Math.PI) / 3 - Math.PI / 2;
        this.shapePoints.push({
          x: (cx + Math.cos(a1) * r) * (1 - t) + (cx + Math.cos(a2) * r) * t,
          y: (cy + Math.sin(a1) * r) * (1 - t) + (cy + Math.sin(a2) * r) * t,
          cut: false
        });
      }
    } else if (this.selectedShape === 'circle') {
      for (let i = 0; i <= 72; i++) {
        const a = (i / 72) * Math.PI * 2;
        this.shapePoints.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, cut: false });
      }
    } else if (this.selectedShape === 'star') {
      const points = 5, innerR = 48, totalSteps = 80;
      for (let i = 0; i <= totalSteps; i++) {
        const t = i / totalSteps;
        const step = t * points * 2;
        const idx = Math.floor(step);
        const subT = step - idx;
        const a1 = (idx * Math.PI) / points - Math.PI / 2;
        const a2 = ((idx + 1) * Math.PI) / points - Math.PI / 2;
        const r1 = idx % 2 === 0 ? r : innerR;
        const r2 = (idx + 1) % 2 === 0 ? r : innerR;
        this.shapePoints.push({
          x: (cx + Math.cos(a1) * r1) * (1 - subT) + (cx + Math.cos(a2) * r2) * subT,
          y: (cy + Math.sin(a1) * r1) * (1 - subT) + (cy + Math.sin(a2) * r2) * subT,
          cut: false
        });
      }
    } else if (this.selectedShape === 'umbrella') {
      for (let i = 0; i <= 40; i++) {
        const a = Math.PI + (i / 40) * Math.PI;
        this.shapePoints.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, cut: false });
      }
      for (let i = 0; i <= 30; i++) {
        const x = cx + r - (i / 30) * (2 * r);
        const y = cy + Math.sin((i / 30) * Math.PI * 4) * 12;
        this.shapePoints.push({ x, y, cut: false });
      }
      for (let i = 0; i <= 20; i++) {
        this.shapePoints.push({ x: cx, y: cy + (i / 20) * 80, cut: false });
      }
    }
  },

  update(dt) {
    if (this.cracked || this.done) return;

    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 0;
      this.crackCookie("Time is up! The cookie was not freed in time.");
      return;
    }

    const follow = 1 - Math.pow(0.0005, dt);
    this.needleX += (mouse.x - this.needleX) * follow;
    this.needleY += (mouse.y - this.needleY) * follow;

    this.isLighter = (keys['KeyF'] || touchExtraActive) && this.lighterFuel > 0;
    if (this.isLighter) {
      this.lighterFuel = Math.max(0, this.lighterFuel - dt * 25);
      Sfx.lighterBurn();
    }

    this.isLicking = (keys['KeyL'] || keys['KeyE'] || touchSpecialActive) && !this.isLighter;
    if (this.isLicking) {
      this.stress = Math.max(0, this.stress - dt * 45);
      if (Math.random() < 0.2) Sfx.playTone(320, 0.05, 'sine', 0.08);
    } else {
      this.stress = Math.max(0, this.stress - dt * 7);
    }

    this.isCarving = (mouse.down || touchActive || touchActionActive) && !this.isLicking;
    if (this.isCarving) {
      const radiusCheck = this.isLighter ? 28 : 18;

      this.shapePoints.forEach(pt => {
        if (!pt.cut) {
          const dist = Math.hypot(this.needleX - pt.x, this.needleY - pt.y);
          if (dist < radiusCheck) {
            pt.cut = true;
            if (!this.isLighter) {
              this.stress += 2.2;
              if (Math.random() < 0.15) Sfx.playTone(600 + Math.random() * 400, 0.03, 'square', 0.08);
            }
          }
        }
      });

      const nearest = Math.min(...this.shapePoints.map(pt => Math.hypot(this.needleX - pt.x, this.needleY - pt.y)));
      if (nearest > 28 && !this.isLighter) {
        this.stress += dt * 30;
      }
      if (this.stress > 80) shake = Math.max(shake, 2);

      if (this.stress >= 100) {
        this.crackCookie("TOO MUCH PRESSURE! The Dalgona cookie broke in two!");
        return;
      }
    }

    const cutCount = this.shapePoints.filter(p => p.cut).length;
    this.cutProgress = Math.round((cutCount / this.shapePoints.length) * 100);

    if (this.cutProgress >= 96) {
      this.done = true;
      Sfx.chime();
      spawnMoneyParticles(640, 360, 40);
      addFloatText(640, 300, 'PERFECTLY FREED!', '#fbbf24', 40);
      survivors = Math.max(2, Math.floor(survivors * 0.65));
      updateHud();
      scheduleAdvance(1600);
    }
  },

  crackCookie(reason) {
    this.cracked = true;
    shake = 16;
    Sfx.crack();
    spawnShatterParticles(640, 360, 40);
    triggerGameOver(reason);
  },

  draw(c) {
    c.fillStyle = '#1e222b';
    c.fillRect(0, 0, 1280, 720);

    c.save();
    c.fillStyle = '#64748b';
    c.beginPath();
    c.arc(640, 360, 245, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#94a3b8';
    c.lineWidth = 12;
    c.stroke();

    const gradient = c.createRadialGradient(640, 360, 40, 640, 360, this.cookieRadius);
    gradient.addColorStop(0, '#f59e0b');
    gradient.addColorStop(0.7, '#d97706');
    gradient.addColorStop(1, '#92400e');
    c.fillStyle = gradient;
    c.beginPath();
    c.arc(640, 360, this.cookieRadius, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = '#451a03';
    c.lineWidth = 5;
    c.beginPath();
    for (let i = 0; i < this.shapePoints.length; i++) {
      const pt = this.shapePoints[i];
      if (i === 0) c.moveTo(pt.x, pt.y);
      else c.lineTo(pt.x, pt.y);
    }
    c.stroke();

    this.shapePoints.forEach(pt => {
      if (pt.cut) {
        c.fillStyle = '#fef08a';
        c.beginPath();
        c.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        c.fill();
      }
    });

    if (this.stress > 40 && !this.cracked) {
      c.strokeStyle = `rgba(69, 26, 3, ${Math.min(0.9, (this.stress - 30) / 70)})`;
      c.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = i * 1.57;
        c.beginPath();
        c.moveTo(640 + Math.cos(a) * 200, 360 + Math.sin(a) * 200);
        c.lineTo(640 + Math.cos(a) * 140, 360 + Math.sin(a) * 140);
        c.stroke();
      }
    }

    if (this.isLicking) {
      c.fillStyle = 'rgba(255, 255, 255, 0.4)';
      c.beginPath();
      c.arc(this.needleX, this.needleY, 35, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#f43f5e';
      c.font = 'bold 18px system-ui';
      c.fillText('👅 LICKING...', this.needleX, this.needleY - 35);
    }

    if (this.isLighter) {
      c.fillStyle = 'rgba(245, 158, 11, 0.7)';
      c.beginPath();
      c.arc(this.needleX, this.needleY, 18, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ef4444';
      c.font = 'bold 18px system-ui';
      c.fillText('🔥 HOT NEEDLE (MELTING)', this.needleX, this.needleY - 35);
    }

    c.save();
    c.translate(this.needleX, this.needleY);
    c.fillStyle = this.isLighter ? '#ef4444' : '#e2e8f0';
    c.strokeStyle = '#94a3b8';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(15, -45);
    c.lineTo(20, -42);
    c.lineTo(4, 0);
    c.closePath();
    c.fill();
    c.stroke();
    c.restore();

    c.restore();

    this.drawDalgonaHud(c);
  },

  drawDalgonaHud(c) {
    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.92)';
    c.strokeStyle = 'rgba(255, 16, 96, 0.4)';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(360, 16, 560, 102, 12);
    c.fill();
    c.stroke();

    c.textAlign = 'left';
    c.font = 'bold 16px system-ui';
    c.fillStyle = '#f1f5f9';
    c.fillText(`DALGONA: ${SHAPE_NAMES[this.selectedShape]} (${SHAPE_DIFFICULTY[this.selectedShape]}) · ${Math.ceil(this.timer)}s`, 380, 44);

    c.textAlign = 'right';
    c.fillStyle = '#fbbf24';
    c.fillText(`PROGRESS: ${this.cutProgress}%`, 900, 44);

    c.fillStyle = '#334155';
    c.beginPath();
    c.roundRect(380, 56, 520, 14, 7);
    c.fill();

    const stressColor = this.stress > 75 ? '#ef4444' : this.stress > 45 ? '#f59e0b' : '#10b981';
    c.fillStyle = stressColor;
    c.beginPath();
    c.roundRect(380, 56, (this.stress / 100) * 520, 14, 7);
    c.fill();

    c.textAlign = 'center';
    c.font = '700 12px system-ui';
    c.fillStyle = '#cbd5e1';
    c.fillText(`TENSION: ${Math.round(this.stress)}% | [L] LICK | [F] LIGHTER (GAS: ${Math.round(this.lighterFuel)}%)`, 640, 96);
    c.restore();
  }
};

/* =========================================================================
   GAME 3: TUG OF WAR OVER THE ABYSS (TUG OF WAR)
   ========================================================================= */
const Game3 = {
  ropePosition: 0,
  leanTimer: 3.5,
  comboCount: 0,
  tacticPhase: 'lean',
  stumbleCooldown: 0,
  targetSweetSpot: 0.5,
  rhythmMarker: 0,
  rhythmSpeed: 1.4,
  timer: 40.0,
  done: false,

  init() {
    this.ropePosition = 0;
    this.leanTimer = 3.5;
    this.comboCount = 0;
    this.tacticPhase = 'lean';
    this.stumbleCooldown = 0;
    this.rhythmMarker = 0;
    this.rhythmSpeed = 1.4;
    this.timer = 40.0;
    this.done = false;
  },

  sweetSpot() {
    return Math.max(0.06, 0.14 - this.comboCount * 0.012);
  },

  update(dt) {
    if (this.done) return;
    this.timer -= dt;
    this.stumbleCooldown = Math.max(0, this.stumbleCooldown - dt);

    if (this.timer <= 0) {
      if (this.ropePosition > 0) this.winTug();
      else triggerGameOver("Time is up! The opposing team kept the upper hand.");
      return;
    }

    this.rhythmMarker += this.rhythmSpeed * dt;
    if (this.rhythmMarker > 1.0) {
      this.rhythmMarker = 1.0;
      this.rhythmSpeed = -Math.abs(this.rhythmSpeed);
    } else if (this.rhythmMarker < 0) {
      this.rhythmMarker = 0;
      this.rhythmSpeed = Math.abs(this.rhythmSpeed);
    }

    if (this.tacticPhase === 'lean') {
      this.leanTimer -= dt;
      this.ropePosition += (Math.random() - 0.48) * 0.2;
      if (this.leanTimer <= 0) {
        this.tacticPhase = 'rhythm';
        Sfx.chime();
      }
    } else {
      const fatigue = 1 + (40 - this.timer) / 40;
      const heave = Math.sin(Date.now() * 0.0013) > 0.85 ? 0.35 : 0;
      const enemyPull = (0.28 + Math.sin(Date.now() * 0.004) * 0.15 + heave) * fatigue * dt * 60;
      this.ropePosition -= enemyPull;
    }

    if ((keys['KeyS'] || touchExtraActive) && this.stumbleCooldown <= 0 && this.tacticPhase === 'rhythm') {
      keys['KeyS'] = false;
      touchExtraActive = false;
      this.triggerStumbleTactic();
    }

    if (keys['Space'] || mouse.clickDown || touchActionActive) {
      keys['Space'] = false;
      mouse.clickDown = false;
      touchActionActive = false;
      this.registerPull();
    }

    if (this.ropePosition <= -95) {
      Sfx.buzzer();
      shake = 18;
      triggerGameOver("Your team was pulled into the deep abyss!");
    } else if (this.ropePosition >= 95) {
      this.winTug();
    }
  },

  triggerStumbleTactic() {
    this.stumbleCooldown = 8.0;
    this.ropePosition += 18;
    shake = 10;
    Sfx.hit();
    addFloatText(640, 360, '3 STEPS FORWARD! OPPONENT STUMBLES!', '#38bdf8', 30);
  },

  registerPull() {
    if (this.tacticPhase === 'lean') {
      this.ropePosition -= 3;
      addFloatText(640, 400, 'LEAN FIRST!', '#ef4444', 24);
      return;
    }
    const distToCenter = Math.abs(this.rhythmMarker - 0.5);
    const zone = this.sweetSpot();
    if (distToCenter < zone) {
      this.comboCount++;
      const power = 7 + this.comboCount * 1.5;
      this.ropePosition += power;
      shake = Math.max(shake, 4);
      addFloatText(640, 400, `PERFECT x${this.comboCount}`, '#10b981', 28);
      Sfx.playTone(440 + this.comboCount * 40, 0.1, 'triangle', 0.25);
    } else if (distToCenter < zone * 2) {
      this.ropePosition += 3.5;
      addFloatText(640, 400, 'GOOD', '#fbbf24', 22);
      Sfx.playTone(330, 0.08, 'sine', 0.18);
    } else {
      this.ropePosition -= 4.0;
      this.comboCount = 0;
      addFloatText(640, 400, 'MISS!', '#ef4444', 26);
      Sfx.playTone(140, 0.12, 'sawtooth', 0.2);
    }
  },

  winTug() {
    if (this.done) return;
    this.done = true;
    Sfx.chime();
    spawnMoneyParticles(640, 360, 50);
    survivors = Math.max(2, Math.floor(survivors / 2));
    updateHud();
    scheduleAdvance(1500);
  },

  draw(c) {
    c.fillStyle = '#090d16';
    c.fillRect(0, 0, 1280, 720);

    c.fillStyle = '#020617';
    c.fillRect(440, 300, 400, 420);

    c.fillStyle = '#475569';
    c.fillRect(0, 420, 460, 300);
    c.fillRect(820, 420, 460, 300);
    c.fillStyle = '#f59e0b';
    c.fillRect(440, 420, 20, 300);
    c.fillRect(820, 420, 20, 300);

    c.fillStyle = '#94a3b8';
    c.fillRect(635, 180, 10, 180);
    c.fillStyle = '#e2e8f0';
    c.beginPath();
    c.moveTo(620, 360);
    c.lineTo(660, 360);
    c.lineTo(640, 400);
    c.closePath();
    c.fill();

    const ropeShift = (this.ropePosition / 100) * 160;
    c.strokeStyle = '#d97706';
    c.lineWidth = 14;
    c.beginPath();
    c.moveTo(120, 460);
    c.lineTo(1160, 460);
    c.stroke();

    c.fillStyle = '#ef4444';
    c.fillRect(640 + ropeShift - 8, 435, 16, 25);

    const team1 = [456, 1, 218, 199, 67];
    for (let i = 0; i < 5; i++) {
      const px = 380 - i * 65 + (this.ropePosition * 0.4);
      drawTracksuitPlayer(c, px, 435, team1[i], i === 0, true);
    }

    for (let i = 0; i < 5; i++) {
      const ex = 900 + i * 65 + (this.ropePosition * 0.4);
      drawTracksuitPlayer(c, ex, 435, 200 + i, false, true);
    }

    this.drawTugHud(c);
  },

  drawTugHud(c) {
    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.92)';
    c.strokeStyle = '#f59e0b';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(380, 24, 520, 115, 14);
    c.fill();
    c.stroke();

    c.textAlign = 'center';
    c.font = 'bold 20px system-ui';
    c.fillStyle = '#fbbf24';
    if (this.tacticPhase === 'lean') {
      c.fillText(`🛡️ GRANDPA TACTIC 1: LEAN! (${this.leanTimer.toFixed(1)}s)`, 640, 56);
    } else {
      c.fillText(`⚡ PULL! COMBO: ${this.comboCount}x | [S] TRIP TACTIC`, 640, 56);
    }

    c.fillStyle = '#1e293b';
    c.beginPath();
    c.roundRect(430, 74, 420, 24, 12);
    c.fill();

    const zw = this.sweetSpot() * 420;
    c.fillStyle = 'rgba(251, 191, 36, 0.35)';
    c.fillRect(640 - zw * 2, 74, zw * 4, 24);
    c.fillStyle = '#10b981';
    c.fillRect(640 - zw, 74, zw * 2, 24);

    const markerX = 430 + this.rhythmMarker * 420;
    c.fillStyle = '#ff1060';
    c.beginPath();
    c.arc(markerX, 86, 14, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#fff';
    c.lineWidth = 3;
    c.stroke();

    c.font = '700 12px system-ui';
    c.fillStyle = '#cbd5e1';
    c.fillText('PRESS [SPACE / TOUCH] WHEN THE DOT IS IN THE GREEN ZONE!', 640, 122);
    c.restore();
  }
};

/* =========================================================================
   GAME 4: THE GLASS BRIDGE (GLASS STEPPING STONES)
   ========================================================================= */
const Game4 = {
  totalSteps: 12,
  playerStep: 0,
  bridge: [],
  marblesLeft: 3,
  glintInspected: false,
  timer: 60.0,
  phase: 'npc',
  npcTimer: 1.0,
  npcs: [],
  done: false,

  init() {
    this.totalSteps = 12;
    this.playerStep = 0;
    this.marblesLeft = 3;
    this.glintInspected = false;
    this.timer = 60.0;
    this.bridge = [];
    this.done = false;
    this.jumpAnim = 0;

    for (let i = 0; i < this.totalSteps; i++) {
      this.bridge.push({
        safe: Math.random() > 0.5 ? 'left' : 'right',
        brokenLeft: false,
        brokenRight: false,
        revealed: false,
        testedSound: null
      });
    }

    this.phase = 'npc';
    this.npcTimer = 1.0;
    this.npcs = [101, 212, 67].map(id => ({ id, step: 0 }));
  },

  leadNpc() {
    return this.npcs[0];
  },

  updateNpcs(dt) {
    if (keys['Space'] || mouse.clickDown || touchActionActive) {
      keys['Space'] = false;
      mouse.clickDown = false;
      touchActionActive = false;
      this.phase = 'player';
      addFloatText(640, 300, 'YOUR TURN!', '#00d287', 32);
      return;
    }
    this.npcTimer -= dt;
    if (this.npcTimer > 0) return;
    this.npcTimer = 0.9 + Math.random() * 0.5;

    const npc = this.leadNpc();
    const tile = this.bridge[npc.step];
    const side = tile.revealed ? tile.safe : (Math.random() < 0.5 ? 'left' : 'right');

    if (side === tile.safe) {
      tile.revealed = true;
      npc.step++;
      Sfx.playTone(480, 0.08, 'triangle', 0.15);
      if (npc.step >= this.totalSteps) {
        this.npcs.shift();
        addFloatText(640, 260, `#${npc.id} HAT ES GESCHAFFT`, '#10b981', 22);
      }
    } else {
      if (side === 'left') tile.brokenLeft = true;
      else tile.brokenRight = true;
      tile.revealed = true;
      Sfx.glassShatter();
      shake = 10;
      spawnShatterParticles(side === 'left' ? 525 : 755, 450, 30);
      addFloatText(640, 260, `#${npc.id} HAS FALLEN`, '#ef4444', 22);
      survivors = Math.max(2, survivors - 1);
      updateHud();
      this.npcs.shift();
      if (this.npcs.length) this.npcs[0].step = Math.max(this.npcs[0].step, npc.step);
    }
    if (!this.npcs.length) {
      this.phase = 'player';
      addFloatText(640, 300, 'YOUR TURN!', '#00d287', 32);
    }
  },

  update(dt) {
    if (this.done) return;
    this.jumpAnim = Math.max(0, this.jumpAnim - dt * 4);
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 0;
      triggerGameOver("Time is up! The bridge lights have gone out.");
      return;
    }

    if (this.phase === 'npc') {
      this.updateNpcs(dt);
      return;
    }

    if (keys['KeyQ'] || keys['ArrowLeft']) {
      keys['KeyQ'] = false;
      keys['ArrowLeft'] = false;
      this.stepOn('left');
    } else if (keys['KeyE'] || keys['ArrowRight']) {
      keys['KeyE'] = false;
      keys['ArrowRight'] = false;
      this.stepOn('right');
    }

    if (keys['KeyM'] || touchSpecialActive) {
      keys['KeyM'] = false;
      touchSpecialActive = false;
      this.throwMarble();
    }

    this.glintInspected = keys['KeyV'] || touchExtraActive;
  },

  throwMarble() {
    if (this.phase !== 'player' || this.done) return;
    if (this.marblesLeft <= 0 || this.playerStep >= this.totalSteps) return;
    const nextTile = this.bridge[this.playerStep];
    if (nextTile.testedSound || nextTile.revealed) return;

    this.marblesLeft--;
    if (nextTile.safe === 'left') {
      Sfx.playTone(320, 0.25, 'sine', 0.35);
      nextTile.testedSound = 'LEFT SOUNDS DULLER (SAFE!)';
    } else {
      Sfx.playTone(1600, 0.15, 'triangle', 0.35);
      nextTile.testedSound = 'RIGHT SOUNDS DULLER (SAFE!)';
    }
  },

  stepOn(side) {
    if (this.playerStep >= this.totalSteps) return;
    const tile = this.bridge[this.playerStep];

    if (tile.safe === side) {
      Sfx.playTone(480, 0.1, 'triangle', 0.2);
      tile.revealed = true;
      this.playerStep++;
      this.jumpAnim = 1;
      if (this.playerStep >= this.totalSteps) {
        this.done = true;
        Sfx.chime();
        spawnMoneyParticles(640, 360, 60);
        survivors = 2;
        updateHud();
        scheduleAdvance(1400);
      }
    } else {
      if (side === 'left') tile.brokenLeft = true;
      else tile.brokenRight = true;

      Sfx.glassShatter();
      shake = 18;
      spawnShatterParticles(side === 'left' ? 510 : 770, 360, 45);
      triggerGameOver("The normal glass shattered! You plunged into the depths.");
    }
  },

  draw(c) {
    c.fillStyle = '#070a13';
    c.fillRect(0, 0, 1280, 720);

    c.strokeStyle = 'rgba(255, 16, 96, 0.35)';
    c.lineWidth = 4;
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      c.arc(640, 200 + i * 80, 280 - i * 30, Math.PI, 0);
      c.stroke();
    }

    c.fillStyle = 'rgba(245, 158, 11, 0.15)';
    c.fillRect(400, 20, 480, 60);
    c.fillStyle = '#fbbf24';
    c.font = 'bold 14px system-ui';
    c.textAlign = 'center';
    c.fillText('👑 VIP BOX: GOLDEN ANIMAL MASKS WATCH THE BRIDGE', 640, 55);

    c.strokeStyle = '#334155';
    c.lineWidth = 10;
    c.beginPath();
    c.moveTo(420, 0);
    c.lineTo(420, 720);
    c.moveTo(860, 0);
    c.lineTo(860, 720);
    c.stroke();

    const lead = this.phase === 'npc' ? this.leadNpc() : null;
    const viewStep = lead ? lead.step : this.playerStep;
    const startIdx = Math.max(0, viewStep - 1);
    const endIdx = Math.min(this.totalSteps, startIdx + 5);

    for (let i = startIdx; i < endIdx; i++) {
      const rowY = 560 - (i - viewStep + 1) * 110;
      const tile = this.bridge[i];

      const glintLeft = this.glintInspected && i === this.playerStep && tile.safe === 'left';
      const glintRight = this.glintInspected && i === this.playerStep && tile.safe === 'right';

      if (!tile.brokenLeft) {
        c.fillStyle = glintLeft ? 'rgba(56, 189, 248, 0.45)' : 'rgba(165, 243, 252, 0.22)';
        c.strokeStyle = glintLeft ? '#38bdf8' : 'rgba(165, 243, 252, 0.65)';
        c.lineWidth = glintLeft ? 4 : 2.5;
        c.beginPath();
        c.roundRect(450, rowY, 150, 80, 8);
        c.fill();
        c.stroke();

        c.fillStyle = '#94a3b8';
        c.font = 'bold 15px system-ui';
        c.textAlign = 'center';
        c.fillText(`TIER ${i + 1} [Q]`, 525, rowY + 45);
      }

      if (!tile.brokenRight) {
        c.fillStyle = glintRight ? 'rgba(56, 189, 248, 0.45)' : 'rgba(165, 243, 252, 0.22)';
        c.strokeStyle = glintRight ? '#38bdf8' : 'rgba(165, 243, 252, 0.65)';
        c.lineWidth = glintRight ? 4 : 2.5;
        c.beginPath();
        c.roundRect(680, rowY, 150, 80, 8);
        c.fill();
        c.stroke();

        c.fillStyle = '#94a3b8';
        c.font = 'bold 15px system-ui';
        c.textAlign = 'center';
        c.fillText(`TIER ${i + 1} [E]`, 755, rowY + 45);
      }
    }

    const playerY = 560 - Math.sin(this.jumpAnim * Math.PI) * 30;
    if (lead) {
      drawTracksuitPlayer(c, 640, 560, lead.id, false, false);
      c.fillStyle = '#e2e8f0';
      c.font = 'bold 16px system-ui';
      c.textAlign = 'center';
      c.fillText(`Player #${lead.id} is jumping... (${this.npcs.length} still ahead of you) · [SPACE] = GO YOURSELF`, 640, 660);
    } else {
      drawTracksuitPlayer(c, 640, playerY, 456, true, false);
    }

    if (!lead && this.bridge[this.playerStep]?.testedSound) {
      c.fillStyle = '#fbbf24';
      c.font = 'bold 18px system-ui';
      c.textAlign = 'center';
      c.fillText(`🔮 MARBLE ECHO: ${this.bridge[this.playerStep].testedSound}`, 640, 210);
    }

    this.drawBridgeHud(c);
  },

  drawBridgeHud(c) {
    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.92)';
    c.strokeStyle = 'rgba(255, 16, 96, 0.4)';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(340, 86, 600, 95, 12);
    c.fill();
    c.stroke();

    c.textAlign = 'center';
    c.font = 'bold 20px system-ui';
    c.fillStyle = '#f1f5f9';
    c.fillText(`GLASS BRIDGE: STEP ${this.playerStep} / ${this.totalSteps}`, 640, 114);

    c.font = '700 13px system-ui';
    c.fillStyle = '#38bdf8';
    c.fillText(`[M] THROW MARBLE (${this.marblesLeft} left) · [V] GLAZIER EYE SHINE TEST`, 640, 140);
    c.fillText(`[Q / ←] LEFT | [E / →] RIGHT | TIME LEFT: ${Math.ceil(this.timer)}s`, 640, 162);
    c.restore();
  }
};

/* =========================================================================
   GAME 5: THE SQUID GAME (FINAL BATTLE IN THE RAIN)
   ========================================================================= */
const Game5 = {
  heroX: 640,
  heroY: 580,
  heroHp: 100,
  heroStamina: 100,
  bossX: 640,
  bossY: 260,
  bossHp: 120,
  bossAttackTimer: 1.5,
  bossState: 'idle',
  heroRollTimer: 0,
  done: false,
  timer: 70.0,

  init() {
    this.heroX = 640;
    this.heroY = 580;
    this.heroHp = 100;
    this.heroStamina = 100;
    this.bossX = 640;
    this.bossY = 260;
    this.bossHp = 120;
    this.bossAttackTimer = 1.5;
    this.bossState = 'idle';
    this.heroRollTimer = 0;
    this.done = false;
    this.timer = 70.0;

    rainDrops = [];
    for (let i = 0; i < 90; i++) {
      rainDrops.push({
        x: Math.random() * 1280,
        y: Math.random() * 720,
        speed: 16 + Math.random() * 12,
        len: 12 + Math.random() * 10
      });
    }
  },

  update(dt) {
    if (this.done) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      triggerGameOver("Time is up! The rain has flooded the squid arena.");
      return;
    }

    if (Math.random() < 0.008) {
      lightningAlpha = 0.8;
      Sfx.thunder();
    }
    lightningAlpha = Math.max(0, lightningAlpha - dt * 2.5);

    this.heroStamina = Math.min(100, this.heroStamina + dt * 24);

    const dx = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
    const dy = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);
    const moving = dx !== 0 || dy !== 0;

    if (this.heroRollTimer > 0) {
      this.heroRollTimer -= dt;
    } else if (moving) {
      const spd = 4.2;
      this.heroX = Math.max(340, Math.min(940, this.heroX + dx * spd * dt * 60));
      this.heroY = Math.max(160, Math.min(650, this.heroY + dy * spd * dt * 60));
    }

    if ((keys['KeyC'] || touchExtraActive) && this.heroRollTimer <= 0 && this.heroStamina >= 25) {
      keys['KeyC'] = false;
      touchExtraActive = false;
      this.heroRollTimer = 0.35;
      this.heroStamina -= 25;
      this.heroY -= 40;
      Sfx.playTone(300, 0.08, 'sine', 0.2);
    }

    if ((keys['Space'] || mouse.clickDown || touchActionActive) && this.heroStamina >= 15) {
      keys['Space'] = false;
      mouse.clickDown = false;
      touchActionActive = false;
      this.heroStamina -= 15;
      this.performStrike();
    }

    this.updateBoss(dt);

    if (this.heroY <= 190 && this.bossHp <= 60) {
      this.winFinalGame("HEAD REACHED! You won the Squid Game!");
    } else if (this.bossHp <= 0) {
      this.winFinalGame("SANG-WOO DEFEATED! You are the last survivor!");
    }
  },

  performStrike() {
    const dist = Math.hypot(this.heroX - this.bossX, this.heroY - this.bossY);
    if (dist < 70) {
      this.bossHp -= 18;
      this.bossX += (this.bossX - this.heroX) * 0.4;
      this.bossY += (this.bossY - this.heroY) * 0.4;
      shake = 8;
      Sfx.hit();
      spawnEliminationParticles(this.bossX, this.bossY);
      addFloatText(this.bossX, this.bossY - 40, '-18 HIT!', '#fbbf24', 28);
    } else {
      Sfx.playTone(220, 0.08, 'triangle', 0.15);
    }
  },

  updateBoss(dt) {
    const dist = Math.hypot(this.heroX - this.bossX, this.heroY - this.bossY);
    this.bossAttackTimer -= dt;

    const angle = Math.atan2(this.heroY - this.bossY, this.heroX - this.bossX);
    if (dist > 60) {
      this.bossX += Math.cos(angle) * 2.4 * dt * 60;
      this.bossY += Math.sin(angle) * 2.4 * dt * 60;
    }

    if (this.bossAttackTimer <= 0) {
      this.bossAttackTimer = 2.2 + Math.random() * 1.2;
      if (dist < 75 && this.heroRollTimer <= 0) {
        this.heroHp -= 20;
        shake = 12;
        Sfx.hit();
        spawnEliminationParticles(this.heroX, this.heroY);
        addFloatText(this.heroX, this.heroY - 40, '-20 STRIKE!', '#ef4444', 28);

        if (this.heroHp <= 0) {
          triggerGameOver("Sang-woo overpowered you in the mud.");
        }
      }
    }
  },

  winFinalGame(reason) {
    if (this.done) return;
    this.done = true;
    Sfx.chime();
    spawnMoneyParticles(640, 360, 90);
    survivors = 1;
    updateHud();
    scheduleAdvance(1600, () => {
      currentState = STATE.VICTORY;
      if (window.ArcadeCore) ArcadeCore.saveScore('squidgame', 45600000000);
    });
  },

  draw(c) {
    c.fillStyle = '#261c14';
    c.fillRect(0, 0, 1280, 720);

    c.save();
    c.strokeStyle = '#e2e8f0';
    c.lineWidth = 6;

    c.beginPath();
    c.arc(640, 190, 70, 0, Math.PI * 2);
    c.stroke();
    c.fillStyle = 'rgba(255, 16, 96, 0.15)';
    c.fill();

    c.strokeRect(615, 260, 50, 40);
    c.strokeRect(440, 300, 400, 250);

    c.beginPath();
    c.moveTo(640, 550);
    c.lineTo(440, 670);
    c.lineTo(840, 670);
    c.closePath();
    c.stroke();

  attempts++;

/* =========================================================================
   MAIN GAME LOOP
   ========================================================================= */
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  ctx.clearRect(0, 0, 1280, 720);

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake = Math.max(0, shake - dt * 38);
  }

  if (currentState === STATE.MENU) {
    drawMenu(ctx);
  } else if (currentState === STATE.LEVEL_SELECT) {
    drawLevelSelect(ctx);
  } else if (currentState === STATE.INTRO) {
    updateIntro(dt);
    drawIntro(ctx);
  } else if (currentState === STATE.GAME_1) {
    Game1.update(dt);
    Game1.draw(ctx);
  } else if (currentState === STATE.GAME_2) {
    Game2.update(dt);
    Game2.draw(ctx);
  } else if (currentState === STATE.GAME_3) {
    Game3.update(dt);
    Game3.draw(ctx);
  } else if (currentState === STATE.GAME_4) {
    Game4.update(dt);
    Game4.draw(ctx);
  } else if (currentState === STATE.GAME_5) {
    Game5.update(dt);
    Game5.draw(ctx);
  } else if (currentState === STATE.GAME_OVER) {
    ROUNDS[currentRound].game.draw(ctx);
    drawGameOver(ctx);
  } else if (currentState === STATE.VICTORY) {
    drawVictory(ctx);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.life -= dt;
    f.y -= 40 * dt;
    if (f.life <= 0) { floatTexts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, (f.life / f.maxLife) * 1.5);
    ctx.font = `900 ${f.size}px system-ui`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

/* =========================================================================
   INPUT & CLICKS
   ========================================================================= */
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  initAudio();
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    if (currentState === STATE.MENU || currentState === STATE.VICTORY) {
      startTournament();
    } else if (currentState === STATE.GAME_OVER) {
      retryRound();
    }
  } else if (e.code === 'KeyN' && currentState === STATE.GAME_OVER) {
    startTournament();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function handlePointerDown(x, y) {
  if (currentState === STATE.MENU) {
    if (x >= 330 && x <= 630 && y >= 430 && y <= 495) {
      startTournament();
    } else if (x >= 650 && x <= 950 && y >= 430 && y <= 495) {
      currentState = STATE.LEVEL_SELECT;
    }
  } else if (currentState === STATE.LEVEL_SELECT) {
    for (let i = 1; i <= 5; i++) {
      const bx = 160 + (i - 1) * 195;
      if (x >= bx && x <= bx + 175 && y >= 200 && y <= 500) {
        startFreePlay(i);
        return;
      }
    }
    if (x >= 520 && x <= 760 && y >= 570 && y <= 620) {
      currentState = STATE.MENU;
    }
  } else if (currentState === STATE.VICTORY) {
    if (x >= 500 && x <= 780 && y >= 470 && y <= 525) {
      startTournament();
    }
  } else if (currentState === STATE.GAME_OVER) {
    if (y >= 440 && y <= 495) {
      if (x >= 350 && x <= 630) retryRound();
      else if (x >= 650 && x <= 930) currentState = STATE.MENU;
    }
  } else if (currentState === STATE.INTRO && currentRound === 2) {
    const s = shapeButtonAt(x, y);
    if (s) Game2.init(s);
  } else if (currentState === STATE.GAME_4 && Game4.phase === 'player' && y > 200) {
    if (x >= 450 && x <= 600) Game4.stepOn('left');
    else if (x >= 680 && x <= 830) Game4.stepOn('right');
  }
}

canvas.addEventListener('mousemove', (e) => {
  const coords = getCanvasCoords(e.clientX, e.clientY);
  mouse.x = coords.x;
  mouse.y = coords.y;
});

canvas.addEventListener('mousedown', (e) => {
  initAudio();
  const coords = getCanvasCoords(e.clientX, e.clientY);
  mouse.x = coords.x;
  mouse.y = coords.y;
  mouse.down = true;
  mouse.clickDown = true;
  handlePointerDown(coords.x, coords.y);
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  if (e.touches.length > 0) {
    const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    mouse.x = coords.x;
    mouse.y = coords.y;
    mouse.down = true;
    touchActive = true;
    handlePointerDown(coords.x, coords.y);
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    mouse.x = coords.x;
    mouse.y = coords.y;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  mouse.down = false;
  touchActive = false;
}, { passive: false });

    else if (currentState === STATE.GAME_OVER) retryRound();
  }, { passive: false });

  actionBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchActionActive = false;
    touchActive = false;
  }, { passive: false });

  specialBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    touchSpecialActive = true;
    if (currentState === STATE.GAME_4) Game4.throwMarble();
  }, { passive: false });

  specialBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchSpecialActive = false;
  }, { passive: false });

  extraBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    touchExtraActive = true;
    if (currentState === STATE.GAME_2) Sfx.lighterClick();
  }, { passive: false });

  extraBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchExtraActive = false;
  }, { passive: false });
}

// Start audio & loop
startMusic();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
