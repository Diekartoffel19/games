<script>
/**
 * Squid Survival: 45.6 Milliarden Won Spiele
 * 4 Authentische Minispiele inspiriert von der weltweit bekannten Netflix-Serie:
 * 1. Rotes Licht, Grünes Licht (Die Riesenpuppe mit koreanischem Gesang & Scharfschützen)
 * 2. Dalgona Zuckerwabe (Nadel-Präzision & Gi-hun Leck-Modus)
 * 3. Tauziehen am Abgrund (10v10 Rhythmus & Hebelgesetz)
 * 4. Die Glasbrücke (Gehärtetes vs. Normales Glas, Murmel-Klangtest)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// State Management
const STATE = {
  MENU: 'menu',
  INTRO: 'intro',
  GAME_1: 'red_light',
  GAME_2: 'dalgona',
  GAME_3: 'tug_of_war',
  GAME_4: 'glass_bridge',
  GAME_OVER: 'game_over',
  VICTORY: 'victory'
};

let currentState = STATE.MENU;
let survivors = 456;
let totalPrize = 0; // In Won (up to 45,600,000,000)
let soundEnabled = true;
let campaignMode = true; // Playing full tournament

// Round flow: one pending transition at a time, checkpoint per round
let transitioning = false;
let transitionTimer = null;
let currentRound = 1;
let roundSnapshot = { survivors: 456 };
let attempts = 0;
let introTimer = 0;
let shake = 0;
let floatTexts = [];

function scheduleAdvance(delay, fn = advanceToNextGame) {
  if (transitioning) return;
  transitioning = true;
  transitionTimer = setTimeout(() => {
    transitioning = false;
    transitionTimer = null;
    fn();
  }, delay);
}

function cancelTransition() {
  if (transitionTimer) clearTimeout(transitionTimer);
  transitionTimer = null;
  transitioning = false;
}

function addFloatText(x, y, text, color = '#fbbf24', size = 28) {
  floatTexts.push({ x, y, text, color, size, life: 1.1, maxLife: 1.1 });
}

function clearInput() {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  mouse.clickDown = false;
  touchActive = false;
  touchActionActive = false;
  touchLickActive = false;
  touchSpecialActive = false;
}

// Input handling
const keys = {};
let mouse = { x: 0, y: 0, down: false, clickX: 0, clickY: 0 };
let touchActive = false;

// Audio Context & Custom Squid Game Synth
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioCtx = new AudioCtx();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Sound effects generator
const Sfx = {
  playTone(freq, dur, type = 'sine', vol = 0.15) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  },

  // Eerie doll singing tune: "Mu-gung-hwa kko-chi pi-eot-seum-ni-da"
  // Notes: G4, G4, A4, A4, G4, G4, E4 / G4, G4, E4, D4, C4
  singDollWord(step, speedMultiplier = 1) {
    if (!soundEnabled) return;
    const melody = [
      392, 392, 440, 440, 392, 392, 329.6,
      392, 392, 329.6, 293.7, 261.6
    ];
    const freq = melody[step % melody.length];
    const dur = (0.28 / speedMultiplier);
    this.playTone(freq, dur, 'triangle', 0.22);
  },

  sniperShot() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      // Loud gunshot noise burst
      const bufferSize = audioCtx.sampleRate * 0.35;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1800, now);
      filter.frequency.exponentialRampToValueAtTime(80, now + 0.35);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      // Low thump
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      oscGain.gain.setValueAtTime(0.4, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } catch(e) {}
  },

  buzzer() {
    this.playTone(130, 0.45, 'sawtooth', 0.35);
  },

  chime() {
    if (!soundEnabled) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.4, 'sine', 0.18), i * 90);
    });
  },

  crack() {
    this.playTone(180, 0.08, 'sawtooth', 0.3);
  },

  glassShatter() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          this.playTone(1800 + Math.random() * 2500, 0.15, 'triangle', 0.15);
        }, i * 30);
      }
    } catch (e) {}
  },

  coinDrop() {
    this.playTone(987.77, 0.08, 'sine', 0.12);
  },

  heartbeat() {
    this.playTone(55, 0.15, 'sine', 0.3);
  }
};

// Toggle Sound
function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  if (window.ArcadeCore) {
    if (ArcadeCore.isMuted() === soundEnabled) ArcadeCore.toggleMute();
  }
}

function confirmRestart() {
  if (confirm("Spiel neustarten und zu den Vorhöfen zurückkehren?")) {
    startTournament();
  }
}

// Particle System
class Particle {
  constructor(x, y, vx, vy, color, size, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.size = size;
    this.maxLife = life;
    this.life = life;
  }
  update(dt) {
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    this.vy += 0.18 * dt * 60; // gravity
    this.life -= dt;
  }
  draw(c) {
    if (this.life <= 0) return;
    c.save();
    c.globalAlpha = Math.max(0, this.life / this.maxLife);
    c.fillStyle = this.color;
    c.beginPath();
    c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}
let particles = [];

function spawnMoneyParticles(x, y, count = 25) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;
    particles.push(new Particle(
      x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed - 3,
      Math.random() > 0.3 ? '#fbbf24' : '#f59e0b',
      3 + Math.random() * 4,
      1.2 + Math.random() * 0.8
    ));
  }
}

function spawnShatterParticles(x, y, count = 30) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 8;
    particles.push(new Particle(
      x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      '#a5f3fc',
      2 + Math.random() * 4,
      0.8 + Math.random() * 0.6
    ));
  }
}

function spawnEliminationParticles(x, y) {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push(new Particle(
      x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed - 2,
      '#ef4444',
      2 + Math.random() * 3,
      0.7 + Math.random() * 0.5
    ));
  }
}

/* =========================================================================
   GAME 1: ROTES LICHT, GRÜNES LICHT (RED LIGHT, GREEN LIGHT)
   ========================================================================= */
const Game1 = {
  playerX: 640,
  playerY: 660,
  playerSpeed: 3.2,
  isMoving: false,
  reachedFinish: false,
  timer: 55.0,
  
  // Doll State
  dollHeadAngle: 0, // 0 = looking away (Green), Math.PI = facing players (Red)
  dollPhase: 'singing', // 'singing', 'turning_to_red', 'scanning', 'turning_to_green'
  singProgress: 0,
  singSpeed: 1.0,
  syllableStep: 0,
  syllableTimer: 0,
  scanTimer: 0,
  laserTarget: null,
  
  // 36 Other AI Competitors in Green Tracksuits
  competitors: [],
  eliminatedCount: 0,

  init() {
    this.playerX = 640;
    this.playerY = 660;
    this.reachedFinish = false;
    this.timer = 50.0;
    this.dollHeadAngle = 0;
    this.dollPhase = 'singing';
    this.singProgress = 0;
    this.singSpeed = 1.0;
    this.syllableStep = 0;
    this.syllableTimer = 0;
    this.scanTimer = 0;
    this.laserTarget = null;
    this.eliminatedCount = 0;
    this.grace = 0;
    this.fakeout = false;
    this.phraseCount = 0;

    this.competitors = [];
    for (let i = 0; i < 35; i++) {
      this.competitors.push({
        id: 100 + i,
        x: 180 + Math.random() * 920,
        y: 600 + Math.random() * 80,
        speed: 2.2 + Math.random() * 1.8,
        alive: true,
        finished: false,
        reactionDelay: 0.1 + Math.random() * 0.35, // Some AI freeze late & die!
        hesitation: Math.random() * 0.5,
        moving: false
      });
    }
  },

  update(dt) {
    if (this.timer > 0 && !this.reachedFinish) {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.timer = 0;
        this.eliminatePlayer("Zeit abgelaufen! Scharfschützen eröffneten das Feuer.");
        return;
      }
    }

    // Controls: Space, W, Up Arrow, Click, or Touch
    const wantsToMove = keys['Space'] || keys['KeyW'] || keys['ArrowUp'] || mouse.down || touchActive;
    this.isMoving = false;

    if (wantsToMove && !this.reachedFinish) {
      this.playerY -= this.playerSpeed * dt * 60;
      this.isMoving = true;
      if (this.playerY <= 170) {
        this.playerY = 170;
        this.reachedFinish = true;
        Sfx.chime();
        addFloatText(this.playerX, 140, 'SICHER!', '#10b981', 34);
        scheduleAdvance(1400);
      }
    }
    // Sidestep to avoid crowds (does not count as moving forward, but still visible to the doll)
    if (!this.reachedFinish) {
      const side = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
      if (side !== 0) {
        this.playerX = Math.max(80, Math.min(1200, this.playerX + side * 2.6 * dt * 60));
        this.isMoving = true;
      }
    }

    // Doll behavior loop
    if (this.dollPhase === 'singing') {
      this.dollHeadAngle = 0;
      this.syllableTimer += dt;
      // Last syllables rush, so the turn is hard to predict
      const rush = this.syllableStep >= 9 ? 1.6 : 1;
      const interval = 0.28 / (this.singSpeed * rush);
      if (this.syllableTimer >= interval) {
        this.syllableTimer = 0;
        Sfx.singDollWord(this.syllableStep, this.singSpeed * rush);
        this.syllableStep++;
        if (this.syllableStep >= 12) {
          // Finished phrase! Turn around to scan!
          this.syllableStep = 0;
          this.phraseCount++;
          this.dollPhase = 'turning_to_red';
          // Later phrases: faster singing and occasional fake-out half-turns
          this.fakeout = this.phraseCount >= 2 && Math.random() < 0.25;
          this.singSpeed = 1.0 + Math.random() * 0.6 + Math.min(0.8, this.phraseCount * 0.12);
        }
      }
    } else if (this.dollPhase === 'turning_to_red') {
      this.dollHeadAngle += dt * 12;
      if (this.fakeout && this.dollHeadAngle >= Math.PI * 0.45) {
        this.fakeout = false;
        this.dollPhase = 'turning_to_green';
      } else if (this.dollHeadAngle >= Math.PI) {
        this.dollHeadAngle = Math.PI;
        this.dollPhase = 'scanning';
        this.scanTimer = 1.8 + Math.random() * 1.6;
        this.grace = 0.12; // tiny reaction window
        this.competitors.forEach(ai => { ai.reactionDelay = 0.1 + Math.random() * 0.35; });
        Sfx.buzzer();
      }
    } else if (this.dollPhase === 'scanning') {
      this.dollHeadAngle = Math.PI;
      this.scanTimer -= dt;
      this.grace -= dt;

      // Scanning check! If player is moving -> ELIMINATE!
      if (this.isMoving && !this.reachedFinish && this.grace <= 0) {
        this.eliminatePlayer("Bewegung registriert! Der Laserscanner hat dich erfasst.");
        return;
      }

      // Check AI competitors
      this.competitors.forEach(ai => {
        if (ai.alive && !ai.finished && ai.moving) {
          ai.reactionDelay -= dt;
          if (ai.reactionDelay < 0) {
            // Caught moving!
            ai.alive = false;
            ai.moving = false;
            this.eliminatedCount++;
            survivors = Math.max(2, survivors - 10);
            updateHud();
            Sfx.sniperShot();
            shake = 8;
            spawnEliminationParticles(ai.x, ai.y);
            addFloatText(ai.x, ai.y - 40, `#${ai.id} ✕`, '#ef4444', 18);
          }
        }
      });

      if (this.scanTimer <= 0) {
        this.dollPhase = 'turning_to_green';
      }
    } else if (this.dollPhase === 'turning_to_green') {
      this.dollHeadAngle -= dt * 10;
      if (this.dollHeadAngle <= 0) {
        this.dollHeadAngle = 0;
        this.dollPhase = 'singing';
      }
    }

    // AI competitors movement logic
    this.competitors.forEach(ai => {
      if (!ai.alive || ai.finished) return;
      if (this.dollPhase === 'singing') {
        ai.moving = true;
        ai.y -= ai.speed * dt * 60;
        if (ai.y <= 170) {
          ai.y = 170;
          ai.finished = true;
          ai.moving = false;
        }
      } else if (this.dollPhase === 'turning_to_red' || this.dollPhase === 'scanning') {
        if (Math.random() < 0.04) {
          ai.moving = false;
        }
      } else {
        ai.moving = false;
      }

    // Top Game Status HUD

    c.fillStyle = 'rgba(15, 23, 42, 0.9)';

    c.beginPath();
    c.roundRect(490, 20, 300, 70, 14);

    c.stroke();

    c.textAlign = 'center';
    c.font = '900 24px system-ui';

    c.fillText(this.dollPhase === 'scanning' ? '🛑 ROTES LICHT!' : '🟢 GRÜNES LICHT!', 640, 52);

    c.fillStyle = '#e2e8f0';
    c.fillText(`RESTZEIT: ${Math.ceil(this.timer)}s | [SPACE] RENNEN · [A/D] AUSWEICHEN`, 640, 76);
    c.restore();

    // Distance meter on the left edge
    const progress = Math.min(1, (660 - this.playerY) / 490);
    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.8)';
    c.fillRect(24, 200, 14, 440);
    c.fillStyle = '#10b981';
    c.fillRect(24, 200 + 440 * (1 - progress), 14, 440 * progress);
    c.restore();

    // Low time warning
    if (this.timer < 10 && !this.reachedFinish && Math.floor(this.timer * 4) % 2 === 0) {
      c.save();
      c.strokeStyle = 'rgba(239, 68, 68, 0.6)';
      c.lineWidth = 16;
      c.strokeRect(0, 0, 1280, 720);
      c.restore();

  },

  drawDoll(c, x, y) {
    c.save();
    c.translate(x, y);

    // Yellow shirt & orange pinafore dress
    c.fillStyle = '#ea580c';
    c.beginPath();
    c.moveTo(-22, 10);
    c.lineTo(22, 10);
    c.lineTo(32, 55);
    c.lineTo(-32, 55);
    c.closePath();

    // Yellow collar
    c.fillStyle = '#fde047';
    c.beginPath();
    c.arc(0, 10, 12, 0, Math.PI);

    // Head
    const facingFront = this.dollHeadAngle > Math.PI * 0.5;
    c.fillStyle = '#fed7aa'; // Skin tone
    c.beginPath();
    c.arc(0, -15, 24, 0, Math.PI * 2);
    c.fill();

    // Hair (Two black pigtails)
    c.fillStyle = '#0f172a';
    if (!facingFront) {
      // Back of head: neat black hair parted
      c.beginPath();
      c.arc(0, -17, 25, Math.PI, Math.PI * 2);
      c.fill();
      // Pigtails left and right
      c.fillRect(-34, -15, 10, 26);
      c.fillRect(24, -15, 10, 26);
      // Pink hair ties
      c.fillStyle = '#ff1060';
      c.fillRect(-34, -15, 10, 4);
      c.fillRect(24, -15, 10, 4);
    } else {
      // Creepy front face!
      // Hair fringe
      c.fillRect(-22, -38, 44, 14);
      c.fillRect(-34, -15, 10, 26);
      c.fillRect(24, -15, 10, 26);

      // Red laser eyes
      c.fillStyle = this.dollPhase === 'scanning' ? '#ef4444' : '#1e293b';
      c.beginPath();
      c.arc(-8, -14, 4, 0, Math.PI * 2);
      c.arc(8, -14, 4, 0, Math.PI * 2);
      c.fill();

      // Cheeks
      c.fillStyle = '#f472b6';
      c.beginPath();
      c.arc(-14, -6, 5, 0, Math.PI * 2);
      c.arc(14, -6, 5, 0, Math.PI * 2);

      // Doll smile
      c.strokeStyle = '#991b1b';
      c.lineWidth = 2;

      c.arc(0, -4, 6, 0, Math.PI);
      c.stroke();
    }

    c.restore();
  }
};

/* =========================================================================
   GAME 2: DALGONA ZUCKERWABE (HONEYCOMB CANDY)
   ========================================================================= */
const SHAPE_NAMES = { circle: 'KREIS', triangle: 'DREIECK', star: 'STERN', umbrella: 'SCHIRM' };
const SHAPE_ORDER = ['circle', 'triangle', 'star', 'umbrella'];

const Game2 = {
  selectedShape: 'star', // 'triangle', 'circle', 'star', 'umbrella'
  cookieRadius: 210,
  stress: 0, // 0 to 100. If >= 100 -> CRACK!
  cutProgress: 0, // 0 to 100%
  shapePoints: [],
  cutPoints: [],
  needleX: 640,
  needleY: 360,
  isCarving: false,
  isLicking: false,
  lickTimer: 0,
  cracked: false,
  timer: 60.0,

  init(shape = 'star') {
    this.selectedShape = shape;
    this.stress = 0;
    this.cutProgress = 0;
    this.cutPoints = [];
    this.needleX = 640;
    this.needleY = 240;
    this.isCarving = false;
    this.isLicking = false;
    this.lickTimer = 0;
    this.cracked = false;
    this.done = false;
    // Harder shapes get more time
    this.timer = { circle: 45, triangle: 50, star: 60, umbrella: 70 }[shape] || 50;
    this.generateShapePath();
  },

  generateShapePath() {
    this.shapePoints = [];
    const cx = 640, cy = 360;
    const r = 110;

    if (this.selectedShape === 'triangle') {
      const sides = 3;
      for (let i = 0; i <= 60; i++) {
        const seg = Math.floor(i / 20) % 3;
        const t = (i % 20) / 20;
        const a1 = (seg * 2 * Math.PI) / 3 - Math.PI / 2;
        const a2 = ((seg + 1) * 2 * Math.PI) / 3 - Math.PI / 2;
        const x1 = cx + Math.cos(a1) * r;
        const y1 = cy + Math.sin(a1) * r;
        const x2 = cx + Math.cos(a2) * r;
        const y2 = cy + Math.sin(a2) * r;
        this.shapePoints.push({ x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t, cut: false });
      }
    } else if (this.selectedShape === 'circle') {
      for (let i = 0; i <= 72; i++) {
        const angle = (i / 72) * Math.PI * 2;
        this.shapePoints.push({
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r,
          cut: false
        });
      }
    } else if (this.selectedShape === 'star') {
      const points = 5;
      const innerR = 48;
      const totalSteps = 80;
      for (let i = 0; i <= totalSteps; i++) {
        const t = i / totalSteps;
        const step = t * points * 2;
        const idx = Math.floor(step);
        const subT = step - idx;
        const a1 = (idx * Math.PI) / points - Math.PI / 2;
        const a2 = ((idx + 1) * Math.PI) / points - Math.PI / 2;
        const r1 = idx % 2 === 0 ? r : innerR;
        const r2 = (idx + 1) % 2 === 0 ? r : innerR;
        const x1 = cx + Math.cos(a1) * r1;
        const y1 = cy + Math.sin(a1) * r1;
        const x2 = cx + Math.cos(a2) * r2;
        const y2 = cy + Math.sin(a2) * r2;
        this.shapePoints.push({ x: x1 + (x2 - x1) * subT, y: y1 + (y2 - y1) * subT, cut: false });
      }
    } else if (this.selectedShape === 'umbrella') {
      // Umbrella dome + handle
      for (let i = 0; i <= 40; i++) {
        const a = Math.PI + (i / 40) * Math.PI;
        this.shapePoints.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, cut: false });
      }
      // Umbrella bottom scalloped fringe
      for (let i = 0; i <= 30; i++) {
        const x = cx + r - (i / 30) * (2 * r);
        const y = cy + Math.sin((i / 30) * Math.PI * 4) * 12;
        this.shapePoints.push({ x, y, cut: false });
      }
      // Handle
      for (let i = 0; i <= 20; i++) {
        this.shapePoints.push({ x: cx, y: cy + (i / 20) * 80, cut: false });
      }
    }
  },

  update(dt) {
    if (this.cracked || this.done) return;

    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 0;
      this.crackCookie("Zeit abgelaufen! Der Keks wurde nicht rechtzeitig befreit.");
      return;
    }

    // Needle follows the cursor (hover to aim, hold to carve)
    const follow = 1 - Math.pow(0.0005, dt);
    this.needleX += (mouse.x - this.needleX) * follow;
    this.needleY += (mouse.y - this.needleY) * follow;

    // Licking mechanic: Hold 'L', or Space, or Touch Lick
    this.isLicking = keys['KeyL'] || keys['KeyE'] || touchLickActive;
    if (this.isLicking) {
      this.lickTimer += dt;
      // Licking rapidly cools down stress and dissolves sugar!
      this.stress = Math.max(0, this.stress - dt * 45);
      if (Math.random() < 0.2) Sfx.playTone(320, 0.05, 'sine', 0.08);
    } else {
      // Stress naturally decays slowly
      this.stress = Math.max(0, this.stress - dt * 8);
    }

    // Carving mechanic: Hold Left Click / Touch on candy
    this.isCarving = (mouse.down || touchActive) && !this.isLicking;
    if (this.isCarving) {
      // Check proximity to uncaught shape points
      let hitAny = false;
      this.shapePoints.forEach(pt => {
        if (!pt.cut) {
          const dist = Math.hypot(this.needleX - pt.x, this.needleY - pt.y);
          if (dist < 18) {
            pt.cut = true;
            hitAny = true;
            // Carving stress builds up!
            this.stress += 2.4;
            if (Math.random() < 0.15) Sfx.playTone(600 + Math.random() * 400, 0.03, 'square', 0.08);
          }
        }
      });

      // Moving needle too fast while pressing adds penalty stress
      const cursorDist = Math.hypot(mouse.x - this.needleX, mouse.y - this.needleY);
      if (cursorDist > 30) {
        this.stress += 1.2;
      }

      // Pressing off the groove scratches the candy
      const nearest = Math.min(...this.shapePoints.map(pt => Math.hypot(this.needleX - pt.x, this.needleY - pt.y)));
      if (nearest > 28) {
        this.stress += dt * 30;
        if (Math.random() < 0.1) Sfx.playTone(200, 0.04, 'square', 0.06);
      }
      if (this.stress > 80) shake = Math.max(shake, 2);

      if (this.stress >= 100) {
        this.crackCookie("ZU VIEL DRUCK! Der Dalgona Keks ist in zwei Teile zerbrochen!");
        return;
      }
    }

    // Check completion %
    const cutCount = this.shapePoints.filter(p => p.cut).length;
    this.cutProgress = Math.round((cutCount / this.shapePoints.length) * 100);

    if (this.cutProgress >= 96) {
      // Cookie successfully cut!
      this.done = true;
      Sfx.chime();
      spawnMoneyParticles(640, 360, 40);
      addFloatText(640, 300, 'AUSGESTOCHEN!', '#fbbf24', 40);
      survivors = Math.max(2, Math.floor(survivors * 0.6));
      updateHud();
      scheduleAdvance(1600);
    }
  },

  crackCookie(reason) {
    this.cracked = true;
    shake = 14;
    Sfx.crack();
    spawnShatterParticles(640, 360, 35);
    triggerGameOver(reason);
  },

  draw(c) {
    // Background: Korean metal tin table
    c.fillStyle = '#1e222b';
    c.fillRect(0, 0, 1280, 720);

    // Round Tin can tray
    c.save();
    c.fillStyle = '#64748b';
    c.beginPath();
    c.arc(640, 360, 245, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#94a3b8';
    c.lineWidth = 12;
    c.stroke();

    // Dalgona Honeycomb Cookie (Golden brown cooked sugar)
    const gradient = c.createRadialGradient(640, 360, 40, 640, 360, this.cookieRadius);
    gradient.addColorStop(0, '#f59e0b');
    gradient.addColorStop(0.7, '#d97706');
    gradient.addColorStop(1, '#92400e');
    c.fillStyle = gradient;
    c.beginPath();
    c.arc(640, 360, this.cookieRadius, 0, Math.PI * 2);
    c.fill();

    // Sugar texture bubbles
    c.fillStyle = 'rgba(251, 191, 36, 0.4)';
    for (let i = 0; i < 40; i++) {
      const bx = 640 + Math.cos(i * 1.7) * (i * 4.5);
      const by = 360 + Math.sin(i * 1.7) * (i * 4.5);
      c.beginPath();
      c.arc(bx, by, 3 + (i % 4), 0, Math.PI * 2);
      c.fill();
    }

    // Draw the Stamped Outline Groove
    c.strokeStyle = '#451a03';
    c.lineWidth = 5;
    c.beginPath();
    for (let i = 0; i < this.shapePoints.length; i++) {
      const pt = this.shapePoints[i];
      if (i === 0) c.moveTo(pt.x, pt.y);
      else c.lineTo(pt.x, pt.y);
    }
    c.stroke();

    // Highlight Carved grooves (Golden glow / cracks)
    this.shapePoints.forEach(pt => {
      if (pt.cut) {
        c.fillStyle = '#fef08a';
        c.shadowColor = '#fbbf24';
        c.shadowBlur = 8;
        c.beginPath();
        c.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        c.fill();
        c.shadowBlur = 0;
      }
    });

    // Hairline cracks grow with stress
    if (this.stress > 40 && !this.cracked) {
      const n = Math.floor((this.stress - 40) / 10) + 1;
      c.strokeStyle = `rgba(69, 26, 3, ${Math.min(0.9, (this.stress - 30) / 70)})`;
      c.lineWidth = 2;
      for (let i = 0; i < n; i++) {
        const a = i * 2.39;
        let x = 640 + Math.cos(a) * 205, y = 360 + Math.sin(a) * 205;
        c.beginPath();
        c.moveTo(x, y);
        const len = 30 + (this.stress - 40) * 1.2;
        for (let s = 1; s <= 4; s++) {
          x -= Math.cos(a + Math.sin(i * 7 + s) * 0.5) * len / 4;
          y -= Math.sin(a + Math.sin(i * 7 + s) * 0.5) * len / 4;
          c.lineTo(x, y);
        }
        c.stroke();
      }
    }

    // Licking saliva shine effect
    if (this.isLicking) {
      c.fillStyle = 'rgba(255, 255, 255, 0.35)';
      c.beginPath();
      c.arc(this.needleX, this.needleY, 35, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#f43f5e';
      c.font = 'bold 18px system-ui';
      c.fillText('👅 LECKEN...', this.needleX, this.needleY - 35);
    }

    // Metal Needle Tool
    c.save();
    c.translate(this.needleX, this.needleY);
    c.fillStyle = '#e2e8f0';
    c.strokeStyle = '#94a3b8';
    c.lineWidth = 2;
    // Needle tip pointing to target
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(15, -45);
    c.lineTo(20, -42);
    c.lineTo(4, 0);
    c.closePath();
    c.fill();
    c.stroke();
    c.restore();

    // Cracked cookie visual
    if (this.cracked) {
      c.strokeStyle = '#7f1d1d';
      c.lineWidth = 8;
      c.beginPath();
      c.moveTo(430, 360);
      c.lineTo(640, 360);
      c.lineTo(850, 370);
      c.stroke();
    }
    c.restore();

    // HUD: Stress Bar & Progress Bar
    this.drawDalgonaHud(c);
  },

  drawDalgonaHud(c) {
    c.save();
    // Top Bar Box
    c.fillStyle = 'rgba(15, 23, 42, 0.9)';
    c.strokeStyle = 'rgba(255, 16, 96, 0.4)';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(390, 20, 500, 95, 12);
    c.fill();
    c.stroke();

    c.textAlign = 'left';
    c.font = 'bold 16px system-ui';
    c.fillStyle = '#f1f5f9';
    c.fillText(`DALGONA: ${SHAPE_NAMES[this.selectedShape]} · ${Math.ceil(this.timer)}s`, 410, 48);

    c.textAlign = 'right';
    c.fillStyle = '#fbbf24';
    c.fillText(`FORTSCHRITT: ${this.cutProgress}%`, 870, 48);

    // Stress Meter Bar
    c.fillStyle = '#334155';
    c.beginPath();
    c.roundRect(410, 60, 460, 16, 8);
    c.fill();

    const stressColor = this.stress > 75 ? '#ef4444' : this.stress > 45 ? '#f59e0b' : '#10b981';
    c.fillStyle = stressColor;
    c.beginPath();
    c.roundRect(410, 60, (this.stress / 100) * 460, 16, 8);
    c.fill();

    c.textAlign = 'center';
    c.font = '700 13px system-ui';
    c.fillStyle = '#cbd5e1';
    c.fillText(`SPANNUNG: ${Math.round(this.stress)}% | [L / TASTE] = LECKEN UM SPANNUNG ZU SENKEN`, 640, 102);
    c.restore();
  }
};

/* =========================================================================
   GAME 3: TAUZIEHEN AM ABGRUND (TUG OF WAR)
   ========================================================================= */
const Game3 = {
  ropePosition: 0, // -100 (Player falls) to +100 (Enemy falls)
  playerStrength: 0,
  enemyStrength: 0,
  oldManBonus: false,
  leanTimer: 0,
  comboCount: 0,
  tacticPhase: 'lean', // 'lean', 'rhythm', 'pull'
  targetSweetSpot: 0.5,
  rhythmMarker: 0,
  rhythmSpeed: 1.4,
  timer: 45.0,

  init() {
    this.ropePosition = 0;
    this.playerStrength = 0;
    this.enemyStrength = 1.0;
    this.oldManBonus = false;
    this.leanTimer = 3.5;
    this.comboCount = 0;
    this.tacticPhase = 'lean';
    this.targetSweetSpot = 0.5;
    this.rhythmMarker = 0;
    this.rhythmSpeed = 1.4;
    this.timer = 40.0;
    this.done = false;
  },

  sweetSpot() {
    // Zone shrinks as combo grows: higher reward, higher risk
    return Math.max(0.06, 0.14 - this.comboCount * 0.012);
  },

  update(dt) {
    if (this.done) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      if (this.ropePosition > 0) {
        this.winTug();
      } else {
        triggerGameOver("Zeit abgelaufen! Das gegnerische Team hat die Oberhand behalten.");
      }
      return;
    }

    // Rhythm slider sweeps back and forth
    this.rhythmMarker += this.rhythmSpeed * dt;
    if (this.rhythmMarker > 1.0) {
      this.rhythmMarker = 1.0;
      this.rhythmSpeed = -Math.abs(this.rhythmSpeed);
    } else if (this.rhythmMarker < 0) {
      this.rhythmMarker = 0;
      this.rhythmSpeed = Math.abs(this.rhythmSpeed);
    }

    // Phase 1: Old Man Lean tactic (Hold position for 3.5 seconds)
    if (this.tacticPhase === 'lean') {
      this.leanTimer -= dt;
      // During lean, rope stays centered even if enemy pulls hard
      this.ropePosition += (Math.random() - 0.48) * 0.2;
      if (this.leanTimer <= 0) {
        this.tacticPhase = 'rhythm';
        Sfx.chime();
      }
    } else {
      // Enemy pulls towards negative, harder as time runs out, with sudden heaves
      const fatigue = 1 + (40 - this.timer) / 40;
      const heave = Math.sin(Date.now() * 0.0013) > 0.85 ? 0.35 : 0;
      const enemyPull = (0.28 + Math.sin(Date.now() * 0.004) * 0.15 + heave) * fatigue * dt * 60;
      this.ropePosition -= enemyPull;
    }

    // Check pull input
    if (keys['Space'] || mouse.clickDown || touchActionActive) {
      keys['Space'] = false;
      mouse.clickDown = false;
      touchActionActive = false;
      this.registerPull();
    }

    // Fall check
    if (this.ropePosition <= -95) {
      Sfx.buzzer();
      shake = 16;
      triggerGameOver("Dein Team wurde in den tiefen Abgrund gezogen!");
    } else if (this.ropePosition >= 95) {
      this.winTug();
    }
  },

  registerPull() {
    // Check timing on rhythm bar
    if (this.tacticPhase === 'lean') {
      // Pulling during the lean breaks formation
      this.ropePosition -= 3;
      addFloatText(640, 400, 'WARTEN!', '#ef4444', 24);
      return;
    }
    const distToCenter = Math.abs(this.rhythmMarker - 0.5);
    const zone = this.sweetSpot();
    if (distToCenter < zone) {
      // PERFECT PULL!
      this.comboCount++;
      const power = 7 + this.comboCount * 1.5;
      this.ropePosition += power;
      shake = Math.max(shake, 4);
      addFloatText(640, 400, `PERFEKT x${this.comboCount}`, '#10b981', 28);
      Sfx.playTone(440 + this.comboCount * 40, 0.1, 'triangle', 0.25);
    } else if (distToCenter < zone * 2) {
      // Good pull
      this.ropePosition += 3.5;
      addFloatText(640, 400, 'GUT', '#fbbf24', 22);
      Sfx.playTone(330, 0.08, 'sine', 0.18);
    } else {
      // Miss! Stumble penalty
      this.ropePosition -= 4.0;
      this.comboCount = 0;
      addFloatText(640, 400, 'PATZER!', '#ef4444', 26);

/* =========================================================================
   GAME 4: DIE GLASBRÜCKE (GLASS STEPPING STONES)
   ========================================================================= */
const Game4 = {
  totalSteps: 12,
  playerStep: 0,
  bridge: [], // array of { safe: 'left' | 'right', brokenLeft: bool, brokenRight: bool }
  marblesLeft: 3,
  timer: 60.0,
  playerChoice: null,

  init() {
    this.totalSteps = 12;
    this.playerStep = 0;
    this.marblesLeft = 3;
    this.timer = 60.0;
    this.bridge = [];
    this.done = false;
    this.jumpAnim = 0;

    for (let i = 0; i < this.totalSteps; i++) {
      this.bridge.push({
        safe: Math.random() > 0.5 ? 'left' : 'right',
        brokenLeft: false,
        brokenRight: false,
        revealed: false,
        testedSound: null
      });
    }

    // Players ahead of 456 go first and reveal tiles (or die trying). Costs time.
    this.phase = 'npc';
    this.npcTimer = 1.0;
    this.npcs = [101, 212, 67].map(id => ({ id, step: 0 }));
  },

  leadNpc() {
    return this.npcs[0];
  },

  updateNpcs(dt) {
    // [SPACE] = stop waiting and go yourself
    if (keys['Space'] || mouse.clickDown || touchActionActive) {
      keys['Space'] = false;
      mouse.clickDown = false;
      touchActionActive = false;
      this.phase = 'player';
      addFloatText(640, 300, 'DU BIST DRAN!', '#00d287', 32);
      return;
    }
    this.npcTimer -= dt;
    if (this.npcTimer > 0) return;
    this.npcTimer = 0.9 + Math.random() * 0.5;

    const npc = this.leadNpc();
    const tile = this.bridge[npc.step];
    // Revealed tiles are walked safely, unknown ones are a coin toss
    const side = tile.revealed ? tile.safe : (Math.random() < 0.5 ? 'left' : 'right');
    if (side === tile.safe) {
      tile.revealed = true;
      npc.step++;
      Sfx.playTone(480, 0.08, 'triangle', 0.15);
      if (npc.step >= this.totalSteps) {
        // NPC made it across: no more info to gain
        this.npcs.shift();
        addFloatText(640, 260, `#${npc.id} HAT ES GESCHAFFT`, '#10b981', 22);
      }
    } else {
      if (side === 'left') tile.brokenLeft = true;
      else tile.brokenRight = true;
      tile.revealed = true;
      Sfx.glassShatter();
      shake = 10;
      spawnShatterParticles(side === 'left' ? 525 : 755, 450, 30);
      addFloatText(640, 260, `#${npc.id} IST GESTÜRZT`, '#ef4444', 22);
      survivors = Math.max(2, survivors - 1);
      updateHud();
      this.npcs.shift();
      // Next NPC catches up over the known tiles
      if (this.npcs.length) this.npcs[0].step = Math.max(this.npcs[0].step, npc.step);
    }
    if (!this.npcs.length) {
      this.phase = 'player';
      addFloatText(640, 300, 'DU BIST DRAN!', '#00d287', 32);
    }
  },

  update(dt) {
    if (this.done) return;
    this.jumpAnim = Math.max(0, this.jumpAnim - dt * 4);
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 0;
      triggerGameOver("Zeit abgelaufen! Die Lichter der Brücke sind erloschen.");
      return;
    }

    if (this.phase === 'npc') {
      this.updateNpcs(dt);
      return;
    }

    // Jump Left [Q / ArrowLeft] or Jump Right [E / ArrowRight]
    if (keys['KeyQ'] || keys['ArrowLeft']) {
      keys['KeyQ'] = false;
      keys['ArrowLeft'] = false;
      this.stepOn('left');
    } else if (keys['KeyE'] || keys['ArrowRight']) {
      keys['KeyE'] = false;
      keys['ArrowRight'] = false;
      this.stepOn('right');
    }

    // Throw marble sound check [M / Touch Special]
    if (keys['KeyM'] || touchSpecialActive) {
      keys['KeyM'] = false;
      touchSpecialActive = false;
      this.throwMarble();
    }
  },

  throwMarble() {
    if (this.phase !== 'player' || this.done) return;
    if (this.marblesLeft <= 0 || this.playerStep >= this.totalSteps) return;
    if (this.bridge[this.playerStep].testedSound || this.bridge[this.playerStep].revealed) return;
    this.marblesLeft--;
    const nextTile = this.bridge[this.playerStep];
    // Sound test
    if (nextTile.safe === 'left') {
      Sfx.playTone(320, 0.25, 'sine', 0.35); // Dull thud: Tempered left!
      nextTile.testedSound = 'LINKS KLINGT DUMPFER (SICHER!)';
    } else {
      Sfx.playTone(1600, 0.15, 'triangle', 0.35); // Sharp ring: Brittle left!
      nextTile.testedSound = 'RECHTS KLINGT DUMPFER (SICHER!)';
    }
  },

  stepOn(side) {
    if (this.playerStep >= this.totalSteps) return;
    const tile = this.bridge[this.playerStep];

    if (tile.safe === side) {
      // Safe glass! Holds weight!
      Sfx.playTone(480, 0.1, 'triangle', 0.2);
      tile.revealed = true;
      this.playerStep++;
      this.jumpAnim = 1;
      if (this.playerStep >= this.totalSteps) {
        // VICTORY! Completed the Squid Game!
        this.done = true;
        Sfx.chime();
        spawnMoneyParticles(640, 360, 80);
        survivors = 1;
        updateHud();
        scheduleAdvance(1200, () => {
          currentState = STATE.VICTORY;
          if (window.ArcadeCore) ArcadeCore.saveScore('squidgame', totalPrize);
        });
      }
    } else {
      // Normal brittle glass -> SHATTERS!
      if (side === 'left') tile.brokenLeft = true;
      else tile.brokenRight = true;

      Sfx.glassShatter();
      shake = 18;
      spawnShatterParticles(side === 'left' ? 510 : 770, 360, 45);
      triggerGameOver("Das Glas ist zersprungen! Du bist in die Tiefe gestürzt.");
    }
  },

  draw(c) {
    // Cirque du Soleil style Circus Dark Background with Pink Neon Arches
    c.fillStyle = '#070a13';
    c.fillRect(0, 0, 1280, 720);

    // Neon Arches
    c.strokeStyle = 'rgba(255, 16, 96, 0.35)';
    c.lineWidth = 4;
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      c.arc(640, 200 + i * 80, 280 - i * 30, Math.PI, 0);
      c.stroke();
    }

    // Bridge Beams
    c.strokeStyle = '#334155';
    c.lineWidth = 10;
    c.beginPath();
    c.moveTo(420, 0);
    c.lineTo(420, 720);
    c.moveTo(860, 0);
    c.lineTo(860, 720);
    c.stroke();

    // Render Visible Glass Tiles (Current step and upcoming steps)
    const lead = this.phase === 'npc' ? this.leadNpc() : null;
    const viewStep = lead ? lead.step : this.playerStep;
    const startIdx = Math.max(0, viewStep - 1);
    const endIdx = Math.min(this.totalSteps, startIdx + 5);

    for (let i = startIdx; i < endIdx; i++) {
      const rowY = 560 - (i - viewStep + 1) * 110;
      const tile = this.bridge[i];

      // Known-safe glass glows green
      if (tile.revealed) {
        c.save();
        c.fillStyle = 'rgba(16, 185, 129, 0.28)';
        c.shadowColor = '#10b981';
        c.shadowBlur = 18;
        c.beginPath();
        c.roundRect(tile.safe === 'left' ? 450 : 680, rowY, 150, 80, 8);
        c.fill();
        c.restore();
      }

      // Left Glass Plate
      if (!tile.brokenLeft) {
        c.fillStyle = 'rgba(165, 243, 252, 0.22)';
        c.strokeStyle = 'rgba(165, 243, 252, 0.65)';
        c.lineWidth = 3;
        c.beginPath();
        c.roundRect(450, rowY, 150, 80, 8);
        c.fill();
        c.stroke();

        c.fillStyle = '#94a3b8';
        c.font = 'bold 15px system-ui';
        c.textAlign = 'center';
        c.fillText(`STUFE ${i + 1} [Q]`, 525, rowY + 45);
      }

      // Right Glass Plate
      if (!tile.brokenRight) {
        c.fillStyle = 'rgba(165, 243, 252, 0.22)';
        c.strokeStyle = 'rgba(165, 243, 252, 0.65)';
        c.lineWidth = 3;
        c.beginPath();
        c.roundRect(680, rowY, 150, 80, 8);
        c.fill();
        c.stroke();

        c.fillStyle = '#94a3b8';
        c.font = 'bold 15px system-ui';
        c.textAlign = 'center';
        c.fillText(`STUFE ${i + 1} [E]`, 755, rowY + 45);
      }
    }

    // Draw Player standing on current tile
    const playerY = 560 - Math.sin(this.jumpAnim * Math.PI) * 30;
    if (lead) {
      drawTracksuitPlayer(c, 640, 560, lead.id, false, false);
      c.fillStyle = '#e2e8f0';
      c.font = 'bold 16px system-ui';
      c.textAlign = 'center';
      c.fillText(`Spieler #${lead.id} springt... (noch ${this.npcs.length} vor dir) · [SPACE] = SELBST LOSGEHEN`, 640, 660);
    } else {
      drawTracksuitPlayer(c, 640, playerY, 456, true, false);
    }

    // Marble test clue if active
    if (!lead && this.bridge[this.playerStep]?.testedSound) {
      c.fillStyle = '#fbbf24';
      c.font = 'bold 18px system-ui';
      c.textAlign = 'center';
      c.fillText(`🔮 MURMEL-ECHO: ${this.bridge[this.playerStep].testedSound}`, 640, 220);
    }

    // Glass Bridge HUD
    this.drawBridgeHud(c);
  },

  drawBridgeHud(c) {
    c.save();
    c.fillStyle = 'rgba(15, 23, 42, 0.92)';
    c.strokeStyle = 'rgba(255, 16, 96, 0.4)';
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(360, 20, 560, 95, 12);
    c.fill();
    c.stroke();

    c.textAlign = 'center';
    c.font = 'bold 20px system-ui';
    c.fillStyle = '#f1f5f9';
    c.fillText(`GLASBRÜCKE: SCHRITT ${this.playerStep} / ${this.totalSteps}`, 640, 50);

    c.font = '700 14px system-ui';
    c.fillStyle = '#38bdf8';
    c.fillText(`MURMELN: ${this.marblesLeft}x [M] | [Q/←] LINKS | [E/→] RECHTS | oder Glas antippen`, 640, 75);
    c.fillText(`RESTZEIT: ${Math.ceil(this.timer)} SEKUNDEN`, 640, 98);
    c.restore();
  }
};

function updateHud() {
  // Every eliminated player adds ₩100M to the pot; the last survivor takes all 45.6B
  totalPrize = survivors <= 1 ? 45600000000 : (456 - survivors) * 100000000;
  document.getElementById('survivorCount').textContent = `${survivors} / 456`;
  document.getElementById('prizeAmount').textContent = `₩ ${window.ArcadeCore ? ArcadeCore.formatNumber(totalPrize) : totalPrize.toLocaleString()}`;
}

const ROUNDS = {
  1: { state: STATE.GAME_1, game: Game1, title: 'ROTES LICHT, GRÜNES LICHT',
       hint: 'Halte [SPACE] zum Rennen. Sobald die Puppe sich umdreht: SOFORT STOPPEN. Achtung, sie täuscht manchmal an!' },
  2: { state: STATE.GAME_2, game: Game2, title: 'DALGONA ZUCKERWABE',
       hint: 'Wähle eine Form [1-4]. Maus gedrückt halten und langsam die Rille nachfahren. [L] lecken senkt die Spannung.' },
  3: { state: STATE.GAME_3, game: Game3, title: 'TAUZIEHEN AM ABGRUND',

       hint: 'Andere springen vor dir und decken Felder auf, aber die Zeit läuft. [SPACE] = selbst losgehen. [M] Murmel testet ein Feld.' }
};

function startRound(n) {
  cancelTransition();
  currentRound = n;
  roundSnapshot = { survivors };
  const r = ROUNDS[n];
  if (n === 2) r.game.init(Game2.selectedShape);
  else r.game.init();
  currentState = STATE.INTRO;
  introTimer = n === 2 ? 5.0 : 3.0;
  clearInput();
}

function startTournament() {
  survivors = 456;
  attempts = 0;
  particles = [];
  floatTexts = [];
  updateHud();
  startRound(1);
}

function retryRound() {
  attempts++;
  survivors = roundSnapshot.survivors;
  updateHud();
  particles = [];
  floatTexts = [];
  startRound(currentRound);
}

function advanceToNextGame() {
  if (currentRound < 4) startRound(currentRound + 1);
}

function triggerGameOver(reason) {
  if (currentState === STATE.GAME_OVER) return;
  cancelTransition();
  currentState = STATE.GAME_OVER;
  gameOverReason = reason;
  clearInput();
  if (window.ArcadeCore) ArcadeCore.saveScore('squidgame', totalPrize);
}

function updateIntro(dt) {
  // Round 2 shape choice: keys 1-4
  if (currentRound === 2) {
    SHAPE_ORDER.forEach((s, i) => {
      if (keys['Digit' + (i + 1)]) {
        keys['Digit' + (i + 1)] = false;
        Game2.init(s);
      }
    });
  }
  introTimer -= dt;
  if (introTimer <= 0) {
    currentState = ROUNDS[currentRound].state;
    clearInput();
  }
}

  c.fillStyle = '#00d287';
  c.fillText('4 TÖDLICHE KINDERSPIELE • 456 SPIELER • 1 GEWINNER', 640, 375);

  // Start Button Box
  const btnX = 460, btnY = 440, btnW = 360, btnH = 65;
  c.fillStyle = '#ff1060';
  c.shadowColor = 'rgba(255, 16, 96, 0.6)';
  c.shadowBlur = 20;
  c.beginPath();
  c.roundRect(btnX, btnY, btnW, btnH, 14);
  c.fill();
  c.shadowBlur = 0;

  c.fillStyle = '#ffffff';
  c.font = '900 24px system-ui';
  c.fillText('▶ TURNIER STARTEN', 640, 482);

  // Game Selector Options
  c.font = '600 15px system-ui';
  c.fillStyle = '#94a3b8';
  c.fillText('RUNDE 1: ROTES LICHT  •  RUNDE 2: DALGONA  •  RUNDE 3: TAUZIEHEN  •  RUNDE 4: GLASBRÜCKE', 640, 560);
  c.fillText('Klicke auf den Button oder drücke [LEERTASTE] zum Starten', 640, 595);
}

function drawGameOver(c) {
  c.fillStyle = 'rgba(0, 0, 0, 0.88)';
  c.fillRect(0, 0, 1280, 720);

  c.textAlign = 'center';
  c.font = '900 56px system-ui';
  c.fillStyle = '#ef4444';
  c.fillText('ELIMINIERT', 640, 280);

  c.font = '700 20px system-ui';
  c.fillStyle = '#e2e8f0';
  c.fillText(gameOverReason, 640, 340);

  c.font = '600 18px system-ui';
  c.fillStyle = '#fbbf24';
  c.fillText(`Runde ${currentRound} / 4 · Topf: ₩ ${totalPrize.toLocaleString('de-DE')}`, 640, 390);

  // Retry round / new tournament buttons
  c.fillStyle = '#ff1060';
  c.beginPath();
  c.roundRect(350, 440, 280, 55, 12);
  c.fill();
  c.fillStyle = 'rgba(30, 41, 59, 0.95)';
  c.strokeStyle = '#94a3b8';
  c.lineWidth = 2;
  c.beginPath();
  c.roundRect(650, 440, 280, 55, 12);
  c.fill();
  c.stroke();

  c.fillStyle = '#fff';
  c.font = '900 20px system-ui';
  c.fillText('RUNDE WIEDERHOLEN', 490, 475);
  c.fillText('NEUES TURNIER', 790, 475);

  c.font = '600 14px system-ui';
  c.fillStyle = '#94a3b8';
  c.fillText('[SPACE] Runde wiederholen · [N] Neues Turnier', 640, 530);
}

function gameOverClick(x, y) {
  if (y < 440 || y > 495) return;
  if (x >= 350 && x <= 630) retryRound();
  else if (x >= 650 && x <= 930) startTournament();
}

function drawVictory(c) {
  c.fillStyle = 'rgba(7, 9, 14, 0.95)';
  c.fillRect(0, 0, 1280, 720);

  c.textAlign = 'center';
  c.font = '900 54px system-ui';
  c.fillStyle = '#fbbf24';
  c.fillText('🎉 DU HAST ÜBERLEBT! 🎉', 640, 240);

  c.font = '900 32px system-ui';
  c.fillStyle = '#00d287';
  c.fillText('₩ 45.600.000.000 GEWONNEN!', 640, 310);

  c.font = '600 20px system-ui';
  c.fillStyle = '#e2e8f0';
  c.fillText('Du hast alle 4 Prüfungen des Tintenfisch-Spiels gemeistert.', 640, 370);
  c.fillText(attempts === 0 ? 'Ohne einen einzigen Fehlversuch. Legendär.' : `Benötigte Wiederholungen: ${attempts}`, 640, 405);

  c.fillStyle = '#ff1060';
  c.beginPath();
  c.roundRect(500, 470, 280, 55, 12);
  c.fill();

  c.fillStyle = '#fff';
  c.font = '900 20px system-ui';
  c.fillText('NEUES SPIEL', 640, 505);
}

/* =========================================================================
   MAIN GAME LOOP
   ========================================================================= */

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  // Clear Canvas
  ctx.clearRect(0, 0, 1280, 720);

  // Screen shake
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake = Math.max(0, shake - dt * 40);
  }

  // Update & Render according to active state
  if (currentState === STATE.MENU) {
    drawMenu(ctx);
  } else if (currentState === STATE.INTRO) {
    updateIntro(dt);
    drawIntro(ctx);
  } else if (currentState === STATE.GAME_1) {
    Game1.update(dt);
    Game1.draw(ctx);
  } else if (currentState === STATE.GAME_2) {
    Game2.update(dt);
    Game2.draw(ctx);
  } else if (currentState === STATE.GAME_3) {
    Game3.update(dt);
    Game3.draw(ctx);
  } else if (currentState === STATE.GAME_4) {
    Game4.update(dt);
    Game4.draw(ctx);
  } else if (currentState === STATE.GAME_OVER) {
    ROUNDS[currentRound].game.draw(ctx);
    drawGameOver(ctx);
  } else if (currentState === STATE.VICTORY) {
    drawVictory(ctx);
  }

  // Update & Draw Global Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Floating feedback text
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.life -= dt;
    f.y -= 40 * dt;
    if (f.life <= 0) { floatTexts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life / f.maxLife * 1.5);
    ctx.font = `900 ${f.size}px system-ui`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
  ctx.restore();

  requestAnimationFrame(gameLoop);
}

/* =========================================================================
   INPUT LISTENERS
   ========================================================================= */

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  initAudio();
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    if (currentState === STATE.MENU || currentState === STATE.VICTORY) {
      startTournament();
    } else if (currentState === STATE.GAME_OVER) {
      retryRound();
    }
  } else if (e.code === 'KeyN' && currentState === STATE.GAME_OVER) {
    startTournament();
  }
});

// Click/tap handling shared by mouse and touch
function handlePointerDown(x, y) {
  if (currentState === STATE.MENU || currentState === STATE.VICTORY) {
    startTournament();
  } else if (currentState === STATE.GAME_OVER) {
    gameOverClick(x, y);
  } else if (currentState === STATE.INTRO && currentRound === 2) {
    const s = shapeButtonAt(x, y);
    if (s) Game2.init(s);
  } else if (currentState === STATE.GAME_4 && Game4.phase === 'player' && y > 200) {
    // Tap a glass panel to jump on it
    if (x >= 450 && x <= 600) Game4.stepOn('left');
    else if (x >= 680 && x <= 830) Game4.stepOn('right');
  }
}

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousemove', (e) => {
  const coords = getCanvasCoords(e.clientX, e.clientY);
  mouse.x = coords.x;
  mouse.y = coords.y;
});

canvas.addEventListener('mousedown', (e) => {
  initAudio();
  const coords = getCanvasCoords(e.clientX, e.clientY);
  mouse.x = coords.x;
  mouse.y = coords.y;
  mouse.down = true;
  mouse.clickDown = true;
  handlePointerDown(coords.x, coords.y);
});

canvas.addEventListener('mouseup', () => {
  mouse.down = false;
});

// Touch controls handling
let touchActionActive = false;
let touchLickActive = false;
let touchSpecialActive = false;

const actionBtn = document.getElementById('touchActionBtn');
const specialBtn = document.getElementById('touchSpecialBtn');

if (actionBtn && specialBtn) {
  actionBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    touchActive = true;
    touchActionActive = true;
    if (currentState === STATE.MENU || currentState === STATE.VICTORY) {
      startTournament();
    } else if (currentState === STATE.GAME_OVER) {
      retryRound();
    }
  }, { passive: false });

  actionBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchActive = false;
    touchActionActive = false;
  }, { passive: false });

  specialBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    touchLickActive = true;
    touchSpecialActive = true;
    if (currentState === STATE.GAME_4) {
      Game4.throwMarble();
    }
  }, { passive: false });

  specialBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchLickActive = false;
    touchSpecialActive = false;
  }, { passive: false });
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  if (e.touches.length > 0) {
    const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    mouse.x = coords.x;
    mouse.y = coords.y;
    mouse.down = true;
    touchActive = true;
    handlePointerDown(coords.x, coords.y);
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    mouse.x = coords.x;
    mouse.y = coords.y;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  mouse.down = false;
  touchActive = false;
}, { passive: false });

// Start game loop
requestAnimationFrame(gameLoop);
</script>
