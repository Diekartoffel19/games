      g.fillStyle = '#fbbf24'; g.font = `800 ${14 / cam.z}px system-ui`;
      g.fillText(`${Math.round(obliquity())}°`, hx - 120, hy - 110);
      g.beginPath(); g.arc(hx, hy, 9, 0, 7); g.strokeStyle = '#ef4444'; g.lineWidth = 3 / cam.z; g.stroke();
      g.restore();
    }

    function drawProjectile(g, p) {
      const d = p.def, ang = Math.atan2(p.dy, p.dx);
      if (p.state === 'jet') return drawJet(g, p);
      if (p.jetFly) return drawJetSpray(g, p);
      g.save(); g.translate(p.x, p.y); g.rotate(ang + (p.spin || 0));
      const D = Math.max(d.d * 1000, 16);
      let Ld = d.kind === 'rod' ? Math.max(p.L * 1000, 4) : d.len;
      if (p.state === 'hesh') { g.restore(); return drawPat(g, p); }
      const metal = (c1, c2) => { const gr = g.createLinearGradient(0, -D / 2, 0, D / 2); gr.addColorStop(0, c1); gr.addColorStop(.45, c2); gr.addColorStop(1, '#1e293b'); return gr; };

      switch (d.id) {
        case 'apfsds': {
          g.fillStyle = metal('#f1f5f9', '#94a3b8'); g.beginPath(); g.moveTo(0, 0); g.lineTo(-D * 1.2, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D * 1.2, D * .5); g.closePath(); g.fill();
          g.fillStyle = '#334155'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-D * 1.2, -D * .5); g.lineTo(-D * 1.2, D * .5); g.fill();
          g.fillStyle = '#cbd5e1'; [-1, 1].forEach(s => { g.beginPath(); g.moveTo(-Ld, 0); g.lineTo(-Ld - D * 1.4, s * D * 1.5); g.lineTo(-Ld + D * .6, s * D * .5); g.fill(); });
          break; }
        case 'railgun': {
          const gl = g.createRadialGradient(-Ld / 2, 0, 2, -Ld / 2, 0, Ld * .8); gl.addColorStop(0, 'rgba(255,255,255,.9)'); gl.addColorStop(.3, 'rgba(56,189,248,.5)'); gl.addColorStop(1, 'rgba(56,189,248,0)');
          g.fillStyle = gl; g.beginPath(); g.ellipse(-Ld / 2, 0, Ld * .85, D * 2.6, 0, 0, 7); g.fill();
          g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-D, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D, D * .5); g.fill();
          g.strokeStyle = '#7dd3fc'; g.lineWidth = 2; g.beginPath(); let x = 0; g.moveTo(-D, 0); for (let i = 0; i < 8; i++) { x -= Ld / 8; g.lineTo(x, rnd(-D * 1.8, D * 1.8)); } g.stroke(); break; }
        case 'heat': {
          g.fillStyle = '#d4d4d8'; g.fillRect(0, -2, 90, 4); g.fillRect(70, -D * .22, 20, D * .44);
          const bg = metal('#78813a', '#4d5a24'); g.fillStyle = bg; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-D * .1 - 20, -D * .5, -D * 1.4, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D * 1.4, D * .5); g.quadraticCurveTo(-D * .1 - 20, D * .5, 0, 0); g.fill();
          g.fillStyle = '#facc15'; g.fillRect(-D * 2.6, -D * .5, 14, D); g.fillStyle = '#a3a3a3'; [-1, 1].forEach(s => { g.beginPath(); g.moveTo(-Ld, 0); g.lineTo(-Ld - 30, s * D * .95); g.lineTo(-Ld + 50, s * D * .5); g.fill(); }); break; }
        case 'tandem': {
          g.fillStyle = '#38bdf8'; g.fillRect(20, -3, 110, 6); g.fillStyle = '#ef4444'; g.fillRect(100, -8, 25, 16);
          const bg = metal('#94a3b8', '#334155'); g.fillStyle = bg; g.beginPath(); g.moveTo(0, 0); g.lineTo(-D * 1.5, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D * 1.5, D * .5); g.closePath(); g.fill();
          g.fillStyle = '#f59e0b'; g.fillRect(-D * 1.8, -D * .5, 16, D); g.fillRect(-D * 3.4, -D * .5, 16, D); break; }
        case 'bunker': {
          const bg = metal('#1e293b', '#0f172a'); g.fillStyle = bg; g.beginPath(); g.moveTo(0, 0); g.lineTo(-D * 1.8, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D * 1.8, D * .5); g.closePath(); g.fill();
          g.strokeStyle = '#f59e0b'; g.lineWidth = 3; for (let i = 1; i <= 4; i++) { g.beginPath(); g.moveTo(-D * 1.8 - i * 35, -D * .5); g.lineTo(-D * 1.8 - i * 35, D * .5); g.stroke(); }
          g.fillStyle = '#e11d48'; g.beginPath(); g.arc(-Ld + 20, 0, 6, 0, 7); g.fill(); break; }
        case 'plasma': {
          const gl = g.createRadialGradient(-Ld / 2, 0, 4, -Ld / 2, 0, Ld * .7); gl.addColorStop(0, '#ffffff'); gl.addColorStop(.3, '#c084fc'); gl.addColorStop(1, 'rgba(192,132,252,0)');
          g.fillStyle = gl; g.beginPath(); g.ellipse(-Ld / 2, 0, Ld * .75, D * 2.8, 0, 0, 7); g.fill();
          g.fillStyle = '#e879f9'; g.beginPath(); g.ellipse(-Ld / 2, 0, Ld * .5, D * 1.2, 0, 0, 7); g.fill(); break; }
        case 'nuke': {
          const bg = metal('#4d6b1f', '#2d4013'); g.fillStyle = bg; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-D * .6, -D * .5, -D * 1.8, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D * 1.8, D * .5); g.closePath(); g.fill();
          g.fillStyle = '#facc15'; g.fillRect(-D * 2.4, -D * .5, 20, D);
          g.fillStyle = '#000'; g.beginPath(); g.arc(-D * 2.4 + 10, 0, 6, 0, 7); g.fill(); break; }
        case 'aphe': case 'hesh': {
          const col = d.id === 'aphe' ? ['#cbd5e1', '#64748b'] : ['#facc15', '#a16207'];
          g.fillStyle = metal(col[0], col[1]); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-D * .5, -D * .5, -D * 1.6, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, D * .5); g.lineTo(-D * 1.6, D * .5); g.quadraticCurveTo(-D * .5, D * .5, 0, 0); g.fill();
          g.fillStyle = d.id === 'aphe' ? '#b45309' : '#dc2626'; g.fillRect(-Ld + 50, -D * .55, 26, D * 1.1); g.fillStyle = '#ef4444'; g.beginPath(); g.arc(-4, 0, D * .16, 0, 7); g.fill(); break; }
        case 'anvil': {
          g.fillStyle = metal('#6b7280', '#374151'); g.beginPath(); g.moveTo(0, -D * .12); g.lineTo(-Ld * .2, -D * .2); g.lineTo(-Ld * .35, -D * .5); g.lineTo(-Ld, -D * .5); g.lineTo(-Ld, -D * .3); g.lineTo(-Ld * .75, -D * .1); g.lineTo(-Ld * .72, D * .2); g.lineTo(-Ld * .9, D * .5); g.lineTo(-Ld * .3, D * .5); g.lineTo(-Ld * .35, D * .2); g.lineTo(-Ld * .2, 0); g.closePath(); g.fill(); g.strokeStyle = '#111827'; g.lineWidth = 3; g.stroke(); break; }
        case 'nokia': {
          g.fillStyle = '#1e3a8a'; roundRect(g, -Ld, -D / 2, Ld, D, 12); g.fill(); g.strokeStyle = '#93c5fd'; g.lineWidth = 3; g.stroke();
          g.fillStyle = '#a3e635'; g.fillRect(-Ld + 20, -D * .32, Ld * .38, D * .64); g.fillStyle = '#365314'; g.fillRect(-Ld + 26, -D * .24, Ld * .26, 8);
          g.fillStyle = '#bfdbfe'; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { g.beginPath(); g.arc(-Ld * .42 + j * 17, -D * .25 + i * 16, 4, 0, 7); g.fill(); } break; }
        case 'baguette': {
          const bg = g.createLinearGradient(0, -D / 2, 0, D / 2); bg.addColorStop(0, '#f5c27a'); bg.addColorStop(1, '#a8661e'); g.fillStyle = bg;
          g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-8, -D * .55, -60, -D * .5); g.lineTo(-Ld + 50, -D * .5); g.quadraticCurveTo(-Ld, -D * .5, -Ld, 0); g.quadraticCurveTo(-Ld, D * .5, -Ld + 50, D * .5); g.lineTo(-60, D * .5); g.quadraticCurveTo(-8, D * .55, 0, 0); g.fill();
          g.strokeStyle = '#7c4a14'; g.lineWidth = 3; for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(-70 - i * 62, -D * .35); g.lineTo(-100 - i * 62, D * .1); g.stroke(); } break; }
        case 'duck': {
          g.fillStyle = '#facc15'; g.beginPath(); g.ellipse(-Ld * .5, D * .1, Ld * .5, D * .38, 0, 0, 7); g.fill(); g.beginPath(); g.arc(-Ld * .12, -D * .3, D * .28, 0, 7); g.fill();
          g.fillStyle = '#fb923c'; g.beginPath(); g.moveTo(-Ld * .12 + D * .22, -D * .32); g.lineTo(-Ld * .12 + D * .55, -D * .26); g.lineTo(-Ld * .12 + D * .22, -D * .18); g.fill();
          g.fillStyle = '#111'; g.beginPath(); g.arc(-Ld * .12 + 6, -D * .36, 4, 0, 7); g.fill(); break; }
        case 'melon': {
          const mg = g.createRadialGradient(-Ld * .4, -D * .15, 8, -Ld * .5, 0, D * .6); mg.addColorStop(0, '#4ade80'); mg.addColorStop(1, '#166534'); g.fillStyle = mg;
          g.beginPath(); g.ellipse(-Ld * .5, 0, Ld * .52, D * .5, 0, 0, 7); g.fill(); g.strokeStyle = '#14532d'; g.lineWidth = 3; for (let i = -2; i <= 2; i++) { g.beginPath(); g.ellipse(-Ld * .5, 0, Ld * .5, D * .5 * (1 - Math.abs(i) * .12), 0, 0, 7); g.stroke(); } break; }
      }
      g.restore();

      if (p.trail.length > 2 && !p.exited) {
        g.save(); g.lineCap = 'round'; const t = p.trail;
        for (let i = 1; i < t.length; i++) {
          g.strokeStyle = d.plasma ? `rgba(192,132,252,${i / t.length * .45})` : `rgba(180,225,255,${i / t.length * .22})`;
          g.lineWidth = D * .4 * i / t.length;
          g.beginPath(); g.moveTo(t[i - 1][0], t[i - 1][1]); g.lineTo(t[i][0], t[i][1]); g.stroke();
        }
        g.restore();
      }
    }

    function drawPat(g, p) {
      g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.dy, p.dx));
      g.fillStyle = '#facc15'; g.beginPath(); g.ellipse(-8, 0, 12 + (.5 - Math.max(0, p.timer)) * 30, 62, 0, 0, 7); g.fill(); g.restore();
    }
    function drawJet(g, p) {
      const [wx, wy] = [p.x, p.y], [sx, sy] = toWorld(-S.T / 2, p.jetLy);
      g.save(); g.lineCap = 'round';
      g.strokeStyle = p.def.plasma ? 'rgba(232,121,249,.95)' : 'rgba(255,240,170,.95)';
      g.lineWidth = p.def.plasma ? 9 : 7;
      g.shadowColor = p.def.plasma ? '#c084fc' : '#fb923c';
      g.shadowBlur = 24; g.beginPath(); g.moveTo(sx, sy); g.lineTo(wx, wy); g.stroke(); g.restore();
    }
    function drawJetSpray(g, p) {
      g.save(); g.lineCap = 'round'; const a = Math.atan2(p.dy, p.dx), len = clamp(p.jet.budget * 1.2, 20, 260);
      g.strokeStyle = p.def.plasma ? 'rgba(232,121,249,.9)' : 'rgba(255,230,150,.9)';
      g.lineWidth = p.def.plasma ? 8 : 6;
      g.shadowColor = p.def.plasma ? '#c084fc' : '#fb923c';
      g.shadowBlur = 20; g.beginPath(); g.moveTo(p.x - Math.cos(a) * len, p.y - Math.sin(a) * len); g.lineTo(p.x, p.y); g.stroke(); g.restore();
    }

    function renderPip() {
      if (!pipCtx || !pipCanvas || W <= 960) return;
      const pw = pipCanvas.width, ph = pipCanvas.height;
      pipCtx.clearRect(0, 0, pw, ph);
      pipCtx.fillStyle = '#050811';
      pipCtx.fillRect(0, 0, pw, ph);

      pipCtx.save();
      const zoom = 2.4;
      pipCtx.translate(pw / 2, ph / 2);
      pipCtx.scale(zoom, zoom);
      pipCtx.translate(-pipFocus.x, -pipFocus.y);

      drawBackdrop(pipCtx);
      mods.forEach(m => drawModule(pipCtx, m));
      drawSlab(pipCtx);
      if (proj && (proj.state !== 'done' || (proj.outcome === 'rStuck' && !proj.exited))) {
        drawProjectile(pipCtx, proj);
      }
      for (const pl of plugs) {
        pipCtx.save(); pipCtx.translate(pl.x, pl.y); pipCtx.rotate(pl.rot);
        pipCtx.fillStyle = '#475569'; pipCtx.fillRect(-pl.r, -pl.r, pl.r * 2, pl.r * 2);
        pipCtx.restore();
      }
      for (const f of fx) {
        if (f.type === 'spall' || f.type === 'spark') {
          pipCtx.fillStyle = f.col;
          pipCtx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3);
        }
      }
      pipCtx.restore();

      // Tactical Crosshair overlay on PIP
      pipCtx.strokeStyle = 'rgba(56,189,248,.6)';
      pipCtx.lineWidth = 1;
      pipCtx.beginPath();
      pipCtx.moveTo(pw / 2 - 14, ph / 2); pipCtx.lineTo(pw / 2 + 14, ph / 2);
      pipCtx.moveTo(pw / 2, ph / 2 - 14); pipCtx.lineTo(pw / 2, ph / 2 + 14);
      pipCtx.stroke();
      pipCtx.strokeRect(10, 10, pw - 20, ph - 20);

      pipCtx.fillStyle = '#38bdf8';
      pipCtx.font = '700 9px monospace';
      pipCtx.fillText('SLO-MO IMPACT CAM', 14, 22);
      pipCtx.fillText(`X:${Math.round(pipFocus.x)} Y:${Math.round(pipFocus.y)}`, 14, ph - 16);
    }

    let perfT = 0;
    function render() {
      ctx.setTransform(Math.min(2, window.devicePixelRatio || 1), 0, 0, Math.min(2, window.devicePixelRatio || 1), 0, 0);
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0b1222'); bg.addColorStop(1, '#05070d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      let curCamX = cam.x, curCamY = cam.y;
      if (cam.follow && proj && proj.state !== 'done') {
        curCamX = W / 2 - proj.x * cam.z;
        curCamY = H / 2 - proj.y * cam.z;
      }

      ctx.save();
      ctx.translate(curCamX + (shake ? rnd(-shake, shake) : 0), curCamY + (shake ? rnd(-shake, shake) : 0));
      ctx.scale(cam.z, cam.z);

      drawBackdrop(ctx);
      mods.forEach(m => drawModule(ctx, m));
      drawSlab(ctx);
      drawGun(ctx);
      drawAim(ctx);

      // Replay or live drawing
      if (replayIdx >= 0 && replayFrames[replayIdx]) {
        const rf = replayFrames[replayIdx];
        if (rf.trail && rf.trail.length > 1) {
          ctx.save(); ctx.lineCap = 'round';
          for (let i = 1; i < rf.trail.length; i++) {
            ctx.strokeStyle = `rgba(56,189,248,${i / rf.trail.length * 0.4})`;
            ctx.lineWidth = 5; ctx.beginPath();
            ctx.moveTo(rf.trail[i - 1][0], rf.trail[i - 1][1]);
            ctx.lineTo(rf.trail[i][0], rf.trail[i][1]);
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(rf.px, rf.py, 7, 0, 7); ctx.fill();
        for (const f of rf.fx) {
          ctx.fillStyle = f.col;
          ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
        }
      } else {
        if (proj && (proj.state !== 'done' || (proj.outcome === 'rStuck' && !proj.exited))) {
          drawProjectile(ctx, proj);
        }
      }

      // Plugs
      plugs.forEach(pl => {
        ctx.save(); ctx.translate(pl.x, pl.y); ctx.rotate(pl.rot);
        ctx.fillStyle = '#475569'; ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5;
        roundRect(ctx, -pl.r, -pl.r * 0.7, pl.r * 2, pl.r * 1.4, 3);
        ctx.fill(); ctx.stroke(); ctx.restore();
      });

      // Petals
      petals.forEach(p => {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#9ca3af'; ctx.fillRect(-40, -8, 80, 16); ctx.restore();
      });

      // Stress waves (Shockwave mode & normal impacts)
      for (const sw of stressWaves) {
        const k = sw.life / sw.max0;
        ctx.strokeStyle = view === 'stress' ? `rgba(239,68,68,${k * 0.85})` : `rgba(255,255,255,${k * 0.4})`;
        ctx.lineWidth = 4 / cam.z;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, 7); ctx.stroke();
        if (view === 'stress') {
          ctx.strokeStyle = `rgba(56,189,248,${k * 0.7})`;
          ctx.lineWidth = 2 / cam.z;
          ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r * 0.75, 0, 7); ctx.stroke();
        }
      }

      // Particles FX
      for (const f of fx) {
        const k = f.life / f.max;
        if (f.type === 'smoke') { ctx.globalAlpha = k * .55; ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
        else if (f.type === 'fire') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
        else if (f.type === 'spall') { ctx.strokeStyle = `rgba(253,186,116,${k})`; ctx.lineWidth = f.r; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * .018, f.y - f.vy * .018); ctx.stroke(); }
        else { ctx.globalAlpha = Math.min(1, k * 1.6); ctx.fillStyle = f.col; if (f.type === 'spark') { ctx.fillRect(f.x - f.r / 2, f.y - f.r / 2, f.r, f.r); } else { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
      }

      rings.forEach(r => { ctx.strokeStyle = `rgba(${r.col},${Math.max(0, r.life / r.max0)})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); });
      ctx.font = `800 ${16 / cam.z}px system-ui`;
      labels.forEach(l => { ctx.globalAlpha = clamp(l.life, 0, 1); ctx.fillStyle = l.col; ctx.fillText(l.text, l.x - 50, l.y); ctx.globalAlpha = 1; });
      ctx.restore();

      if (flash > .3) { ctx.fillStyle = `rgba(255,255,255,${(flash - .3) * .22})`; ctx.fillRect(0, 0, W, H); }
      if (nukeFlash > 0.05) { ctx.fillStyle = `rgba(255,255,255,${nukeFlash * 0.9})`; ctx.fillRect(0, 0, W, H); }
      if (view === 'xray') { ctx.fillStyle = 'rgba(0,40,70,.1)'; ctx.fillRect(0, 0, W, H); }
      if (view === 'stress') { ctx.fillStyle = 'rgba(30,10,60,.12)'; ctx.fillRect(0, 0, W, H); }

      renderPip();
    }

    /* ------------------------------------------------------------- HUD / UI */
    function updateHud() {
      const p = proj;
      const v = p ? p.v : cfg.vel * velMult() * Math.exp(-sel.proj.drag * cfg.range);
      $('telVel').textContent = Math.round(v) + ' m/s';
      let ke = .5 * sel.proj.m * v * v;
      if (p && p.def.kind === 'rod') ke = .5 * Math.PI * (p.def.d / 2) ** 2 * Math.max(p.L, 0) * p.def.rho * v * v;
      $('telKe').textContent = (ke / 1e6).toFixed(2) + ' MJ';
      const ob = obliquity();
      $('telAng').textContent = Math.round(ob) + '°';
      $('telLos').textContent = Math.round(S.T / Math.max(.05, Math.cos(Math.min(ob, 84) * D2R))) + ' mm';
      $('telPen').textContent = Math.round(maxDepth) + ' mm';
      $('telTemp').textContent = Math.round(peakTemp) + ' °C';
      if ($('telCred')) $('telCred').textContent = '$' + credits;
    }

    function renderMission() {
      if (activeChal) {
        $('mission').innerHTML = `<div class="sec-title" style="margin-bottom:4px;color:#fbbf24;"><span>${tr(activeChal.n)}</span><span style="color:#94a3b8">${shots}/${activeChal.maxShots} ${T('shots')}</span></div>` +
          `<div style="font-size:.68rem;color:#cbd5e1;margin-bottom:6px;">${tr(activeChal.d)}</div>` +
          `<div class="m-score"><span>Reward: +$${activeChal.reward}</span><button class="pill-btn" id="btnCancelChal" style="font-size:.6rem">Abort</button></div>`;
        const cb = $('btnCancelChal');
        if (cb) cb.onclick = () => { activeChal = null; repair(true); };
        return;
      }
      const rows = [['perf', 'mPerf', 100], ['crew', 'mCrew', 200], ['engine', 'mEngine', 150], ['fire', 'mFire', 100], ['ammo', 'mAmmo', 300]];
      $('mission').innerHTML = `<div class="sec-title" style="margin-bottom:4px"><span>${T('mission')}</span><span style="color:#94a3b8">${T('shots')}: ${shots}</span></div>` +
        rows.map(r => `<div class="m-row ${mission[r[0]] ? 'done' : ''}"><span>${mission[r[0]] ? '✔' : '○'} ${T(r[1])}</span><b>+${r[2]}</b></div>`).join('') +
        `<div class="m-score"><span>${T('score')}: ${score}</span><span>${T('best')}: ${best}</span></div>`;
    }

    function renderChallenges() {
      const el = $('challengeList');
      if (!el) return;
      el.innerHTML = CHALLENGES.map(c => {
        const isDone = chalDone[c.id];
        const isActive = activeChal && activeChal.id === c.id;
        return `<div class="chal-card ${isDone ? 'done' : ''} ${isActive ? 'active' : ''}" data-cid="${c.id}">
          <div>
            <div style="display:flex;justify-content:space-between;font-weight:800;color:${isDone ? '#4ade80' : '#fbbf24'};font-size:.76rem;">
              <span>${tr(c.n)}</span><span>${isDone ? 'COMPLETED' : '+$' + c.reward}</span>
            </div>
            <div style="font-size:.68rem;color:#94a3b8;margin-top:3px;">${tr(c.d)}</div>
          </div>
          <div style="font-size:.64rem;color:#cbd5e1;font-weight:700;">Max Shots: ${c.maxShots} | ${isDone ? 'Replay' : 'Start'} ➔</div>
        </div>`;
      }).join('');
    }

    function renderUpgrades() {
      const el = $('upgradeList');
      if (!el) return;
      el.innerHTML = UPGRADES.map(u => {
        const cur = upg[u.id] || 0;
        const maxed = cur >= u.max;
        const cost = u.cost * (cur + 1);
        return `<div class="upg-row">
          <div style="flex:1">
            <div style="font-weight:800;font-size:.82rem;color:#f1f5f9;">${tr(u.n)}</div>
            <div style="font-size:.68rem;color:#94a3b8;">${tr(u.d)}</div>
            <div class="upg-bars">${Array.from({ length: u.max }).map((_, i) => `<div class="upg-pip ${i < cur ? 'on' : ''}"></div>`).join('')}</div>
          </div>
          <button class="btn-hud ${maxed ? '' : 'gold'}" data-uid="${u.id}" ${maxed || credits < cost ? 'disabled style="opacity:0.4"' : ''}>
            ${maxed ? 'MAXED' : `$${cost}`}
          </button>
        </div>`;
      }).join('');
    }

    function startChallenge(id) {
      const c = CHALLENGES.find(x => x.id === id);
      if (!c) return;
      activeChal = c;
      selectTarget(c.t);
      selectProjectile(c.p);
      applyZone(c.zone);
      repair(true);
      $('challengeModal').classList.remove('open');
      toast(tr(c.n), `Goal: ${c.maxShots} shot(s)`, '#fbbf24');
      renderMission();
    }

    function buyUpgrade(id) {
      const u = UPGRADES.find(x => x.id === id);
      if (!u) return;
      const cur = upg[u.id] || 0;
      if (cur >= u.max) return;
      const cost = u.cost * (cur + 1);
      if (credits < cost) return;
      credits -= cost;
      upg[u.id] = cur + 1;
      try {
        localStorage.setItem('ballistics_credits', credits);
        localStorage.setItem('ballistics_upg', JSON.stringify(upg));
      } catch (e) {}
      snd('win');
      renderUpgrades();
      updateHud();
      updatePenEstimator();
    }

    function renderProjectiles() {
      $('projGrid').innerHTML = PROJ.map(p => `<button class="item-btn ${p === sel.proj ? 'active' : ''}" data-p="${p.id}"><span>${p.e} ${tr(p.n)}</span><span class="it-sub">${tr(p.s)}</span></button>`).join('');
      $('projMassLbl').textContent = sel.proj.m + ' kg';
    }
    function renderTargets() {
      $('targetList').innerHTML = TARGETS.map(t => {
        const mm = (t.id === 'custom' ? customLayers : t.layers).reduce((a, l) => a + l[1], 0);
        return `<button class="target-btn ${t === sel.target ? 'active' : ''}" data-t="${t.id}"><span>${t.e} ${tr(t.n)}</span><span class="tb-mm">${mm} mm</span></button>`;
      }).join('');
      renderZones();
    }
    function renderZones() {
      $('zonePills').innerHTML = sel.target.zones.map((z, i) => `<button class="pill-btn ${z.weak ? 'weak' : ''}" data-z="${i}">${z.weak ? '⚠ ' : ''}${tr(z.n)} ${z.rot}°</button>`).join('');
    }
    function syncLabels() {
      const effectiveV0 = cfg.vel * velMult();
      $('lblVel').textContent = `${cfg.vel} m/s ${upg.vel ? '(+' + upg.vel * 8 + '%)' : ''} (Mach ${(effectiveV0 / 343).toFixed(1)})`;
      $('lblRange').textContent = `${cfg.range} m → ${Math.round(effectiveV0 * Math.exp(-sel.proj.drag * cfg.range))} m/s`;
      $('lblElev').textContent = `${cfg.elev > 0 ? '+' : ''}${cfg.elev}°`;
      $('lblPlate').textContent = `${cfg.plate > 0 ? '+' : ''}${cfg.plate}°`;
      $('lblHit').textContent = `${cfg.hit > 0 ? '+' : ''}${cfg.hit} mm`;
    }

    function selectProjectile(id) {
      sel.proj = PROJ.find(p => p.id === id); cfg.vel = sel.proj.v0; $('rngVel').value = cfg.vel;
      renderProjectiles(); syncLabels(); updateHud(); updatePenEstimator();
    }
    function selectTarget(id) {
      sel.target = TARGETS.find(t => t.id === id); cfg.tm = 1; applyZone(0, true); renderTargets();
    }
    function applyZone(i, skipRender) {
      const z = sel.target.zones[i]; cfg.plate = z.rot; cfg.tm = z.tm; $('rngPlate').value = z.rot; repair(true); syncLabels(); if (!skipRender) renderZones();
    }

    function repair(silent) {
      buildSlab(); buildModules();
      fx = []; rings = []; stressWaves = []; heat = []; labels = []; petals = []; plugs = [];
      blowout = null; proj = null; maxDepth = 0; peakTemp = 20;
      mission = {}; shots = 0; score = 0;
      replayFrames = []; replayIdx = -1;
      const wrap = $('replayWrap'); if (wrap) wrap.classList.remove('show');
      const rep = $('shotReport'); if (rep) rep.classList.remove('show');
      renderMission(); updateHud(); updatePenEstimator();
      if (!silent) toast(T('trgReset'), '', '#4ade80');
    }

    function setView(v) { view = v; document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === v)); }

    /* layer editor */
    function renderEditor() {
      $('layerEditorRows').innerHTML = customLayers.map((l, i) => `<div class="layer-edit-row"><span style="color:#94a3b8;font-weight:800">${i + 1}</span>
        <select data-li="${i}" data-f="m">${Object.keys(MAT).map(k => `<option value="${k}" ${k === l[0] ? 'selected' : ''}>${tr(MAT[k].n)}</option>`).join('')}</select>
        <input type="number" min="10" max="400" step="5" value="${l[1]}" data-li="${i}" data-f="t"><button class="btn-hud" data-del="${i}" style="padding:4px 8px">✖</button></div>`).join('');
    }

    function bind() {
      $('projGrid').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) selectProjectile(b.dataset.p); });
      $('targetList').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) selectTarget(b.dataset.t); });
      $('zonePills').addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (b) applyZone(+b.dataset.z); });
      $('rngVel').oninput = e => { cfg.vel = +e.target.value; syncLabels(); updateHud(); updatePenEstimator(); };
      $('rngRange').oninput = e => { cfg.range = +e.target.value; syncLabels(); updateHud(); updatePenEstimator(); };
      $('rngElev').oninput = e => { cfg.elev = +e.target.value; syncLabels(); updateHud(); updatePenEstimator(); };
      $('rngPlate').oninput = e => { cfg.plate = +e.target.value; S.rot = cfg.plate * D2R; buildModules(); syncLabels(); updateHud(); updatePenEstimator(); };
      $('rngHit').oninput = e => { cfg.hit = +e.target.value; syncLabels(); };

      $('btnMoveTrg').onclick = () => {
        cfg.moveTrg = !cfg.moveTrg;
        $('btnMoveTrg').textContent = T(cfg.moveTrg ? 'moveOn' : 'moveOff');
        $('btnMoveTrg').classList.toggle('active', cfg.moveTrg);
      };

      $('btnFollow').onclick = () => {
        cam.follow = !cam.follow;
        $('btnFollow').classList.toggle('active', cam.follow);
      };

      $('btnChallenges').onclick = () => { renderChallenges(); $('challengeModal').classList.add('open'); };
      $('btnChalClose').onclick = () => $('challengeModal').classList.remove('open');
      $('btnSandboxMode').onclick = () => { activeChal = null; $('challengeModal').classList.remove('open'); repair(false); };
      $('challengeList').addEventListener('click', e => {
        const c = e.target.closest('[data-cid]');
        if (c) startChallenge(c.dataset.cid);
      });

      $('btnUpgrades').onclick = () => { renderUpgrades(); $('upgradeModal').classList.add('open'); };
      $('btnUpgClose').onclick = () => $('upgradeModal').classList.remove('open');
      $('upgradeList').addEventListener('click', e => {
        const u = e.target.closest('[data-uid]');
        if (u) buyUpgrade(u.dataset.uid);
      });

      // Replay controls
      $('rngReplay').oninput = e => scrubReplay(+e.target.value);
      $('btnRepPrev').onclick = () => scrubReplay(replayIdx - 1);
      $('btnRepNext').onclick = () => scrubReplay(replayIdx + 1);
      $('btnRepLive').onclick = exitReplay;

      $('btnFire').onclick = fire;
      $('btnRepair').onclick = () => repair(false);
      document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
      $('speedGroup').addEventListener('click', e => {
        const b = e.target.closest('[data-spd]');
        if (!b) return;
        speed = +b.dataset.spd;
        document.querySelectorAll('[data-spd]').forEach(x => x.classList.toggle('active', x === b));
      });
      $('btnAuto').onclick = () => { autoSlow = !autoSlow; $('btnAuto').classList.toggle('active', autoSlow); $('btnAuto').textContent = T(autoSlow ? 'auto' : 'autoOff'); };
      $('btnSound').onclick = () => { if (window.ArcadeCore) { ArcadeCore.toggleMute(); $('btnSound').textContent = ArcadeCore.isMuted() ? '🔇' : '🔊'; } };
      $('btnTogglePanel').onclick = () => $('sidePanel').classList.toggle('collapsed');
      $('btnEdit').onclick = () => { if (sel.target.id !== 'custom') selectTarget('custom'); renderEditor(); $('layerModal').classList.add('open'); };
      $('btnEdClose').onclick = () => $('layerModal').classList.remove('open');
      $('btnEdAdd').onclick = () => { if (customLayers.length < 9) { customLayers.push(['rha', 50]); renderEditor(); } };
      $('btnEdApply').onclick = () => { $('layerModal').classList.remove('open'); applyZone(0); renderTargets(); };
      $('layerEditorRows').addEventListener('input', e => { const i = +e.target.dataset.li; if (e.target.dataset.f === 'm') customLayers[i][0] = e.target.value; else customLayers[i][1] = clamp(+e.target.value || 10, 10, 400); });
      $('layerEditorRows').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (b && customLayers.length > 1) { customLayers.splice(+b.dataset.del, 1); renderEditor(); } });

      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') { if (e.code !== 'Space') return; e.target.blur(); }
        if (e.code === 'Space') { e.preventDefault(); fire(); }
        else if (e.key === 'r' || e.key === 'R') repair(false);
        else if (e.key === 'c' || e.key === 'C') { renderChallenges(); $('challengeModal').classList.toggle('open'); }
        else if (e.key === 'u' || e.key === 'U') { renderUpgrades(); $('upgradeModal').classList.toggle('open'); }
        else if (e.key === 'f' || e.key === 'F') { cam.follow = !cam.follow; $('btnFollow').classList.toggle('active', cam.follow); }
        else if (e.key === '1') setView('cut');
        else if (e.key === '2') setView('thermal');
        else if (e.key === '3') setView('xray');
        else if (e.key === '4') setView('stress');
      });

      let drag = false;
      let pan = false;
      let lastX = 0, lastY = 0;

      const aim = e => {
        const r = canvas.getBoundingClientRect();
        const [lx, ly] = toLocal((e.clientX - r.left - cam.x) / cam.z, (e.clientY - r.top - cam.y) / cam.z);
        cfg.hit = clamp(Math.round(ly / 5) * 5, -300, 300);
        $('rngHit').value = cfg.hit;
        syncLabels();
      };

      canvas.addEventListener('pointerdown', e => {
        if (e.button === 1 || e.shiftKey) {
          pan = true;
          lastX = e.clientX;
          lastY = e.clientY;
          return;
        }
        drag = true;
        aim(e);
      });

      window.addEventListener('pointermove', e => {
        if (pan) {
          const dx = e.clientX - lastX, dy = e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          cam.userX = (cam.userX || 0) + dx;
          cam.userY = (cam.userY || 0) + dy;
          cam.x = cam.baseX + cam.userX;
          cam.y = cam.baseY + cam.userY;
          return;
        }
        if (drag) aim(e);
      });

      window.addEventListener('pointerup', () => { drag = false; pan = false; });
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.87;
        cam.userZ = clamp((cam.userZ || 1) * factor, 0.4, 3.5);
        cam.z = cam.baseZ * cam.userZ;
      }, { passive: false });

      window.addEventListener('resize', resize);
    }

    /* ------------------------------------------------------------- loop */
    let last = performance.now();
    function loop(now) {
      const real = Math.min(.05, (now - last) / 1000); last = now; perfT += real;
      try { update(real); render(); } catch (err) { console.error(err); }
      requestAnimationFrame(loop);
    }

    // boot
    renderProjectiles(); renderTargets(); resize(); bind();
    applyZone(0, true); renderZones(); syncLabels(); renderMission();
    updateHud(); updatePenEstimator();
    $('btnAuto').textContent = T('auto');
    requestAnimationFrame(loop);

    // test hook: #test=<projectile id>,<ms of real time to simulate>
    const th = location.hash.match(/test=([a-z0-9]+),?(\d+)?,?(-?\d+)?,?(\d+)?/);
    if (th) {
      selectProjectile(th[1]);
      if (th[3] !== undefined) { cfg.plate = +th[3]; $('rngPlate').value = cfg.plate; S.rot = cfg.plate * D2R; buildModules(); }
      if (th[4]) { cfg.range = +th[4]; }
      fire(); const ms = +(th[2] || 3000); const fixed = .016;
      for (let t = 0; t < ms / 1000; t += fixed) { update(fixed); }
    }
  })();
  </script>
</body>
</html>
