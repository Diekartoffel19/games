<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Panzer-Querschnitt: Slow-Mo Ballistik-Labor</title>
  <meta name="description" content="Schieße APFSDS-Pfeile, Hohlladungen, HESH, Railguns oder ein Nokia 3310 auf realistische Mehrschicht-Panzerung. Kippe die Platte, beobachte Abpraller, Erosion und Splitter in Zeitlupe und schalte Besatzung, Munitionslager und Motor aus.">
  <link rel="stylesheet" href="../../style.css">
  <link rel="icon" type="image/x-icon" href="../../src/favicon.ico">
  <script defer src="https://umami.rwpxe.com/script.js" data-website-id="cb5d0067-4455-44c8-a10b-fe5432756eea"></script>
  <script src="../../src/arcade-core.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070b14; color: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
    #simCanvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .hud-top { position: fixed; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 20; gap: 8px; flex-wrap: wrap; }
    .hud-left, .hud-right { display: flex; align-items: center; gap: 5px; pointer-events: auto; flex-wrap: wrap; }
    .btn-hud { background: rgba(15,23,42,.92); border: 1px solid rgba(148,163,184,.28); color: #f1f5f9; padding: 6px 11px; border-radius: 9px;
      font-weight: 700; font-size: .78rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all .15s; font-family: inherit; }
    .btn-hud:hover { background: rgba(30,41,59,.98); border-color: #38bdf8; }
    .btn-hud.active { background: #0369a1; border-color: #38bdf8; color: #fff; box-shadow: 0 0 12px rgba(56,189,248,.35); }
    .btn-hud.gold { border-color: #f59e0b; color: #fde68a; background: rgba(120,53,15,.45); }
    .btn-hud.gold:hover { background: rgba(146,64,14,.65); border-color: #fbbf24; }
    .telemetry-bar { display: flex; gap: 11px; background: rgba(10,15,29,.92); border: 1px solid rgba(56,189,248,.25); padding: 5px 11px; border-radius: 10px; pointer-events: auto; flex-wrap: wrap; }
    .t-box { display: flex; flex-direction: column; min-width: 58px; }
    .t-lbl { font-size: .58rem; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; font-weight: 700; }
    .t-val { font-size: .86rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .cyan { color: #38bdf8; } .amber { color: #fbbf24; } .red { color: #fb7185; } .green { color: #4ade80; } .purple { color: #c084fc; }
    .side-panel { position: fixed; top: 54px; left: 10px; bottom: 76px; width: 292px; background: rgba(10,15,28,.94); border: 1px solid rgba(148,163,184,.22);
      border-radius: 14px; padding: 9px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; z-index: 20; scrollbar-width: thin; scrollbar-color: #334155 transparent; transition: transform .2s; }
    .panel-section { background: rgba(15,23,42,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px 9px; }
    .sec-title { font-size: .67rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .grid-items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .item-btn { background: rgba(30,41,59,.75); border: 1px solid rgba(148,163,184,.2); border-radius: 7px; padding: 5px 6px; color: #e2e8f0; font-size: .7rem; font-weight: 700;
      cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 1px; transition: all .12s; font-family: inherit; position: relative; }
    .item-btn:hover { background: rgba(51,65,85,.9); border-color: #64748b; }
    .item-btn.active { background: rgba(14,116,144,.45); border-color: #38bdf8; box-shadow: inset 0 0 10px rgba(56,189,248,.25); color: #fff; }
    .item-btn .it-sub { font-size: .59rem; color: #94a3b8; font-weight: 600; }
    .target-list { display: flex; flex-direction: column; gap: 4px; }
    .target-btn { background: rgba(30,41,59,.75); border: 1px solid rgba(148,163,184,.2); border-radius: 7px; padding: 5px 8px; color: #e2e8f0; font-size: .72rem; font-weight: 700;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all .12s; font-family: inherit; text-align: left; }
    .target-btn:hover { background: rgba(51,65,85,.9); }
    .target-btn.active { background: rgba(180,83,9,.4); border-color: #f59e0b; color: #fff; }
    .tb-mm { font-size: .62rem; background: rgba(0,0,0,.4); padding: 2px 6px; border-radius: 4px; color: #fbbf24; white-space: nowrap; }
    .slider-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 7px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-head { display: flex; justify-content: space-between; font-size: .7rem; font-weight: 700; color: #cbd5e1; gap: 6px; }
    .slider-head span:last-child { color: #38bdf8; font-variant-numeric: tabular-nums; text-align: right; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; height: 5px; cursor: pointer; }
    .preset-pills { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
    .pill-btn { background: rgba(15,23,42,.9); border: 1px solid rgba(148,163,184,.25); color: #94a3b8; font-size: .62rem; font-weight: 700; padding: 3px 6px; border-radius: 5px; cursor: pointer; font-family: inherit; }
    .pill-btn:hover, .pill-btn.active { color: #fff; border-color: #38bdf8; }
    .pill-btn.weak { border-color: #f59e0b; color: #fbbf24; }
    .pen-calc { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(2,6,23,.65); border: 1px solid rgba(148,163,184,.18); font-size: .68rem; }
    .pen-calc-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 4px; }
    .pen-bar-wrap { height: 6px; background: #1e293b; border-radius: 4px; overflow: hidden; position: relative; }
    .pen-bar-fill { height: 100%; transition: width .15s, background .15s; }
    .pen-badge { padding: 1px 6px; border-radius: 4px; font-size: .6rem; font-weight: 900; text-transform: uppercase; }
    .bottom-bar { position: fixed; bottom: 10px; left: calc(50% + 146px); transform: translateX(-50%); display: flex; align-items: center; gap: 7px; background: rgba(10,15,28,.95);
      border: 1px solid rgba(148,163,184,.25); padding: 7px 12px; border-radius: 14px; z-index: 25; max-width: calc(100vw - 310px); flex-wrap: wrap; justify-content: center; }
    .fire-btn { background: linear-gradient(135deg,#ef4444,#dc2626); border: 1px solid #fca5a5; color: #fff; font-weight: 900; font-size: .88rem; padding: 8px 18px; border-radius: 10px; cursor: pointer;
      letter-spacing: .04em; box-shadow: 0 0 18px rgba(239,68,68,.45); transition: transform .1s; font-family: inherit; }
    .fire-btn:hover { transform: scale(1.03); } .fire-btn:active { transform: scale(.97); }
    .speed-group { display: flex; gap: 2px; align-items: center; background: rgba(15,23,42,.9); padding: 3px; border-radius: 9px; border: 1px solid rgba(255,255,255,.08); }
    .spd-btn { background: transparent; border: 1px solid transparent; color: #94a3b8; font-size: .71rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; }
    .spd-btn:hover { color: #fff; background: rgba(255,255,255,.06); }
    .spd-btn.active { background: #0369a1; color: #fff; border-color: #38bdf8; }
    .replay-wrap { display: none; align-items: center; gap: 5px; background: rgba(15,23,42,.95); border: 1px solid rgba(56,189,248,.35); padding: 3px 8px; border-radius: 9px; font-size: .7rem; font-weight: 700; color: #38bdf8; }
    .replay-wrap.show { display: flex; }
    .replay-wrap input[type="range"] { width: 95px; }
    .right-col { position: fixed; top: 54px; right: 10px; width: 224px; display: flex; flex-direction: column; gap: 8px; z-index: 18; pointer-events: auto; }
    #mission { background: rgba(10,15,28,.92); border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 9px 10px; font-size: .72rem; }
    #mission .m-row { display: flex; justify-content: space-between; gap: 6px; padding: 2.5px 0; color: #94a3b8; font-weight: 700; }
    #mission .m-row.done { color: #4ade80; }
    #mission .m-row b { font-variant-numeric: tabular-nums; }
    #mission .m-score { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.1); display: flex; justify-content: space-between; font-weight: 800; color: #fbbf24; }
    #pipBox { background: rgba(10,15,28,.94); border: 1px solid rgba(56,189,248,.35); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
    #pipCanvas { width: 100%; height: 128px; border-radius: 8px; background: #050811; display: block; border: 1px solid rgba(255,255,255,.08); }
    #shotReport { background: rgba(10,15,28,.92); border: 1px solid rgba(148,163,184,.2); border-radius: 12px; padding: 8px 10px; font-size: .68rem; display: none; }
    #shotReport.show { display: block; }
    .sr-row { display: flex; justify-content: space-between; padding: 2px 0; color: #cbd5e1; }
    .sr-row b { color: #38bdf8; font-variant-numeric: tabular-nums; }
    #toast { position: fixed; top: 96px; left: calc(50% + 34px); transform: translateX(-50%); z-index: 30; pointer-events: none; text-align: center; opacity: 0; transition: opacity .25s; }
    #toast.show { opacity: 1; }
    #toast .t-main { font-size: 1.55rem; font-weight: 900; letter-spacing: .05em; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
    #toast .t-sub { font-size: .84rem; color: #e2e8f0; font-weight: 700; margin-top: 2px; text-shadow: 0 1px 8px #000; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(2,6,23,.82); z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { background: #0f172a; border: 1px solid #38bdf8; border-radius: 16px; width: 100%; max-width: 580px; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.75); max-height: 90vh; overflow-y: auto; }
    .layer-edit-row { display: grid; grid-template-columns: 22px 1fr 96px 32px; gap: 8px; align-items: center; background: #1e293b; padding: 7px 9px; border-radius: 8px; margin-bottom: 6px; }
    .layer-edit-row select, .layer-edit-row input { background: #0f172a; color: #f1f5f9; border: 1px solid #475569; border-radius: 6px; padding: 5px 7px; font-size: .78rem; font-weight: 700; font-family: inherit; width: 100%; }
    .chal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chal-card { background: #1e293b; border: 1px solid rgba(148,163,184,.25); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; cursor: pointer; transition: all .15s; }
    .chal-card:hover { border-color: #38bdf8; transform: translateY(-1px); }
    .chal-card.done { border-color: #4ade80; background: rgba(20,83,45,.25); }
    .chal-card.active { border-color: #fbbf24; box-shadow: 0 0 12px rgba(251,191,36,.25); }
    .upg-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid rgba(148,163,184,.2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; gap: 10px; }
    .upg-bars { display: flex; gap: 3px; margin-top: 4px; }
    .upg-pip { width: 18px; height: 5px; border-radius: 3px; background: #334155; }
    .upg-pip.on { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
    .toggle-panel-btn { display: none; }
    @media (max-width: 960px) {
      .side-panel { width: 255px; top: 52px; bottom: 68px; }
      .side-panel.collapsed { transform: translateX(-275px); }
      .toggle-panel-btn { display: inline-flex; }
      .bottom-bar { left: 50%; max-width: 98vw; }
      #toast { left: 50%; }
      .right-col { top: auto; bottom: 74px; right: 6px; width: 185px; }
      #pipBox { display: none; }
      .chal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="simCanvas"></canvas>

  <div class="hud-top">
    <div class="hud-left">
      <a href="../../index.html" class="btn-hud" data-i="hub"></a>
      <button class="btn-hud toggle-panel-btn" id="btnTogglePanel" data-i="panel"></button>
      <button class="btn-hud active" data-view="cut" data-i="viewCut"></button>
      <button class="btn-hud" data-view="thermal" data-i="viewThermal"></button>
      <button class="btn-hud" data-view="xray" data-i="viewXray"></button>
      <button class="btn-hud" data-view="stress" data-i="viewStress"></button>
    </div>
    <div class="telemetry-bar">
      <div class="t-box"><span class="t-lbl" data-i="tVel"></span><span class="t-val cyan" id="telVel">0 m/s</span></div>
      <div class="t-box"><span class="t-lbl" data-i="tKe"></span><span class="t-val amber" id="telKe">0.00 MJ</span></div>
      <div class="t-box"><span class="t-lbl" data-i="tAng"></span><span class="t-val" id="telAng">0°</span></div>
      <div class="t-box"><span class="t-lbl" data-i="tLos"></span><span class="t-val" id="telLos">0 mm</span></div>
      <div class="t-box"><span class="t-lbl" data-i="tDepth"></span><span class="t-val green" id="telPen">0 mm</span></div>
      <div class="t-box"><span class="t-lbl" data-i="tTemp"></span><span class="t-val red" id="telTemp">20 °C</span></div>
      <div class="t-box"><span class="t-lbl" data-i="tCred"></span><span class="t-val purple" id="telCred">$0</span></div>
    </div>
    <div class="hud-right">
      <button class="btn-hud gold" id="btnChallenges" data-i="btnChal"></button>
      <button class="btn-hud" id="btnUpgrades" data-i="btnUpg"></button>
      <button class="btn-hud" id="btnFollow" title="Follow Projectile">🎥</button>
      <button class="btn-hud" id="btnSound">🔊</button>
    </div>
  </div>

  <aside class="side-panel" id="sidePanel">
    <div class="panel-section">
      <div class="sec-title"><span data-i="secAmmo"></span><span id="projMassLbl" style="color:#fbbf24"></span></div>
      <div class="grid-items" id="projGrid"></div>
    </div>
    <div class="panel-section">
      <div class="sec-title"><span data-i="secShot"></span><button class="pill-btn" id="btnMoveTrg" data-i="moveOff"></button></div>
      <div class="slider-row"><div class="slider-head"><span data-i="sVel"></span><span id="lblVel"></span></div>
        <input type="range" id="rngVel" min="100" max="4500" step="10" value="1750"></div>
      <div class="slider-row"><div class="slider-head"><span data-i="sRange"></span><span id="lblRange"></span></div>
        <input type="range" id="rngRange" min="50" max="4000" step="50" value="1000"></div>
      <div class="slider-row"><div class="slider-head"><span data-i="sElev"></span><span id="lblElev"></span></div>
        <input type="range" id="rngElev" min="-15" max="15" step="1" value="0"></div>
      <div class="pen-calc">
        <div class="pen-calc-top"><span id="penCalcText">Est. Pen: 0 mm</span><span class="pen-badge" id="penBadge">--</span></div>
        <div class="pen-bar-wrap"><div class="pen-bar-fill" id="penBarFill" style="width:50%;background:#38bdf8"></div></div>
      </div>
    </div>
    <div class="panel-section">
      <div class="sec-title"><span data-i="secPlate"></span></div>
      <div class="slider-row"><div class="slider-head"><span data-i="sPlate"></span><span id="lblPlate"></span></div>
        <input type="range" id="rngPlate" min="-75" max="75" step="1" value="0">
        <div class="preset-pills" id="zonePills"></div></div>
      <div class="slider-row"><div class="slider-head"><span data-i="sHit"></span><span id="lblHit"></span></div>
        <input type="range" id="rngHit" min="-300" max="300" step="5" value="0"></div>
    </div>
    <div class="panel-section">
      <div class="sec-title"><span data-i="secTarget"></span><button class="pill-btn" id="btnEdit" data-i="edit"></button></div>
      <div class="target-list" id="targetList"></div>
    </div>
  </aside>

  <div class="right-col">
    <div id="mission"></div>
    <div id="pipBox">
      <div class="sec-title" style="margin-bottom:2px"><span data-i="pipTitle"></span><span id="pipZoomLbl" style="color:#94a3b8">2.5×</span></div>
      <canvas id="pipCanvas" width="210" height="128"></canvas>
    </div>
    <div id="shotReport"></div>
  </div>

  <div id="toast"><div class="t-main" id="toastMain"></div><div class="t-sub" id="toastSub"></div></div>

  <div class="bottom-bar">
    <button class="fire-btn" id="btnFire" data-i="fire"></button>
    <button class="btn-hud" id="btnRepair" data-i="repair"></button>
    <div class="speed-group" id="speedGroup">
      <button class="spd-btn" data-spd="0">⏸</button>
      <button class="spd-btn" data-spd="0.05">0.05×</button>
      <button class="spd-btn" data-spd="0.15">0.15×</button>
      <button class="spd-btn" data-spd="0.4">0.4×</button>
      <button class="spd-btn active" data-spd="1">1×</button>
      <button class="spd-btn" data-spd="3">3×</button>
    </div>
    <button class="btn-hud active" id="btnAuto" data-i="auto"></button>
    <div class="replay-wrap" id="replayWrap">
      <span>⏪</span>
      <button class="spd-btn" id="btnRepPrev">◀</button>
      <input type="range" id="rngReplay" min="0" max="0" value="0">
      <button class="spd-btn" id="btnRepNext">▶</button>
      <button class="spd-btn" id="btnRepLive" style="color:#4ade80">LIVE</button>
    </div>
  </div>

  <div class="modal-backdrop" id="layerModal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1.05rem;color:#38bdf8;" data-i="edTitle"></h3>
        <button class="btn-hud" id="btnEdClose" data-i="close"></button>
      </div>
      <p style="font-size:.78rem;color:#94a3b8;margin:0 0 12px;" data-i="edHelp"></p>
      <div id="layerEditorRows"></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;gap:8px;">
        <button class="btn-hud" id="btnEdAdd" data-i="add"></button>
        <button class="fire-btn" style="padding:7px 16px;font-size:.82rem;" id="btnEdApply" data-i="apply"></button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="challengeModal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1.05rem;color:#fbbf24;" data-i="chalTitle"></h3>
        <div style="display:flex;gap:6px;">
          <button class="btn-hud" id="btnSandboxMode" data-i="sandboxBtn"></button>
          <button class="btn-hud" id="btnChalClose" data-i="close"></button>
        </div>
      </div>
      <p style="font-size:.76rem;color:#94a3b8;margin:0 0 10px;" data-i="chalHelp"></p>
      <div class="chal-grid" id="challengeList"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="upgradeModal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1.05rem;color:#c084fc;" data-i="upgTitle"></h3>
        <button class="btn-hud" id="btnUpgClose" data-i="close"></button>
      </div>
      <p style="font-size:.76rem;color:#94a3b8;margin:0 0 12px;" data-i="upgHelp"></p>
      <div id="upgradeList"></div>
    </div>
  </div>

    function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
    function shade(c, f) { const [r, g, b] = hex(c); const m = f < 0 ? 0 : 255, p = Math.abs(f); return `rgb(${Math.round(r + (m - r) * p)},${Math.round(g + (m - g) * p)},${Math.round(b + (m - b) * p)})`; }

    const penMult = () => 1 + (upg.pen || 0) * 0.10;
    const spallMult = () => 1 + (upg.spall || 0) * 0.15;
    const velMult = () => 1 + (upg.vel || 0) * 0.08;
    function addCredits(n) {
      credits += n;
      try { localStorage.setItem('ballistics_credits', credits); } catch (e) {}
      if ($('telCred')) $('telCred').textContent = '$' + credits;
    }

    /* ----------------------------------------------------------- slab build */
    function targetLayers() { return sel.target.id === 'custom' ? customLayers : sel.target.layers; }

    function paintLayer(g, x, w, h, m, rng) {
      const grd = g.createLinearGradient(x, 0, x + w, 0);
      grd.addColorStop(0, m.hi); grd.addColorStop(.18, m.c); grd.addColorStop(.82, m.c); grd.addColorStop(1, shade(m.c, -.3));
      g.fillStyle = grd; g.fillRect(x, 0, w, h);
      g.save(); g.beginPath(); g.rect(x, 0, w, h); g.clip();
      switch (m.pat) {
        case 'steel':
          for (let i = 0; i < h / 2; i++) { g.fillStyle = rng() < .5 ? `rgba(255,255,255,${rng() * .07})` : `rgba(0,0,0,${rng() * .12})`; g.fillRect(x, rng() * h, w, 1 + rng()); }
          break;
        case 'era':
          for (let y = 0; y < h; y += 52) {
            g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x, y, w, 3);
            g.fillStyle = 'rgba(250,204,21,.75)'; g.fillRect(x + w * .3, y + 10, w * .4, 30);
            g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + w * .3, y + 24, w * .4, 2);
          }
          break;
        case 'nera':
          g.lineWidth = 4;
          for (let y = -w; y < h + w; y += 22) {
            g.strokeStyle = '#0f172a'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y + w * .7); g.stroke();
            g.strokeStyle = '#94a3b8'; g.beginPath(); g.moveTo(x, y + 5); g.lineTo(x + w, y + 5 + w * .7); g.stroke();
          }
          break;
        case 'air':
          g.fillStyle = 'rgba(2,6,23,.85)'; g.fillRect(x + 2, 2, Math.max(1, w - 4), h - 4);
          g.strokeStyle = 'rgba(148,163,184,.25)'; g.lineWidth = 2;
          for (let y = 40; y < h; y += 110) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y + 20); g.lineTo(x, y + 40); g.stroke(); }
          break;
        case 'ceramic':
          for (let y = 0; y < h; y += 26) for (let xx = x; xx < x + w; xx += 26) {
            g.fillStyle = `rgba(${150 + rng() * 80 | 0},${200 + rng() * 55 | 0},${215 + rng() * 40 | 0},${.55 + rng() * .4})`;
            g.fillRect(xx + 1, y + 1, 24, 24);
            g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(xx + 2, y + 2, 10, 2);
          }
          break;
        case 'mesh':
          g.strokeStyle = 'rgba(160,150,255,.3)'; g.lineWidth = 1; g.beginPath();
          for (let k = -h; k < h + w; k += 9) { g.moveTo(x + k, 0); g.lineTo(x + k + h, h); g.moveTo(x + k + h, 0); g.lineTo(x + k, h); }
          g.stroke();
          break;
        case 'kevlar':
          g.lineWidth = 2; for (let k = -h; k < h + w; k += 7) {
            g.strokeStyle = 'rgba(255,214,90,.35)'; g.beginPath(); g.moveTo(x + k, 0); g.lineTo(x + k + h, h); g.stroke();
            g.strokeStyle = 'rgba(80,45,0,.4)'; g.beginPath(); g.moveTo(x + k + h, 0); g.lineTo(x + k, h); g.stroke();
          }
          break;
        case 'concrete':
          for (let i = 0; i < w * h / 70; i++) { g.fillStyle = rng() < .5 ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.2)'; g.fillRect(x + rng() * w, rng() * h, 2 + rng() * 5, 2 + rng() * 4); }
          for (let y = 30; y < h; y += 60) { g.fillStyle = '#3b3733'; g.fillRect(x, y - 1, w, 2); g.fillStyle = '#c0b49b'; for (let xx = x + 40; xx < x + w; xx += 90) { g.beginPath(); g.arc(xx, y, 4, 0, 7); g.fill(); } }
          break;
        case 'glass':
          g.fillStyle = 'rgba(255,255,255,.18)'; for (let k = -h; k < w; k += 38) { g.beginPath(); g.moveTo(x + k, h); g.lineTo(x + k + 12, h); g.lineTo(x + k + 12 + h, 0); g.lineTo(x + k + h, 0); g.fill(); }
          break;
        case 'wood':
          g.strokeStyle = 'rgba(40,18,0,.35)'; g.lineWidth = 1;
          for (let y = 0; y < h; y += 5) { g.beginPath(); g.moveTo(x, y); for (let xx = 0; xx <= w; xx += 4) g.lineTo(x + xx, y + Math.sin(xx * .3 + y * .1) * 1.5); g.stroke(); }
          break;
        case 'fluid':
          g.strokeStyle = 'rgba(200,240,255,.3)'; g.lineWidth = 2;
          for (let y = 8; y < h; y += 18) { g.beginPath(); for (let xx = 0; xx <= w; xx += 3) g.lineTo(x + xx, y + Math.sin(xx * .25 + y) * 3); g.stroke(); }
          break;
      }
      g.restore();
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x + w - 1, 0, 1, h); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x, 0, 1, h);
    }

    function buildSlab() {
      const defs = targetLayers();
      const layers = []; let acc = 0;
      defs.forEach(([k, mm], i) => {
        const mmv = Math.max(6, Math.round(mm * cfg.tm));
        layers.push({ key: k, m: MAT[k], mm: mmv, x0: acc, x1: acc + mmv, era: false, i });
        acc += mmv;
      });
      const T = acc;
      const tex = document.createElement('canvas'); tex.width = T; tex.height = SLAB_H;
      const g = tex.getContext('2d');
      const rng = mulberry(7 + sel.target.id.length * 131 + T);
      layers.forEach(l => paintLayer(g, l.x0, l.mm, SLAB_H, l.m, rng));
      g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 2; g.strokeRect(1, 1, T - 2, SLAB_H - 2);
      const live = document.createElement('canvas'); live.width = T; live.height = SLAB_H;
      live.getContext('2d').drawImage(tex, 0, 0);
      const cols = Math.ceil(T / CELL), rows = Math.ceil(SLAB_H / CELL);
      S = { T, rot: cfg.plate * D2R, layers, tex, live, g: live.getContext('2d'), cols, rows, dmg: new Float32Array(cols * rows) };
    }

    const layerAt = lx => { const x = lx + S.T / 2; for (const l of S.layers) if (x < l.x1) return l; return S.layers[S.layers.length - 1]; };
    const dmgAt = (lx, ly) => { const ix = ((lx + S.T / 2) / CELL) | 0, iy = ((ly + SLAB_H / 2) / CELL) | 0; return (ix < 0 || iy < 0 || ix >= S.cols || iy >= S.rows) ? 0 : S.dmg[iy * S.cols + ix]; };
    function addDmg(lx, ly, r, v) {
      const cx = (lx + S.T / 2) / CELL, cy = (ly + SLAB_H / 2) / CELL, rr = r / CELL;
      for (let y = Math.max(0, Math.floor(cy - rr)); y <= Math.min(S.rows - 1, Math.ceil(cy + rr)); y++)
        for (let x = Math.max(0, Math.floor(cx - rr)); x <= Math.min(S.cols - 1, Math.ceil(cx + rr)); x++)
          if ((x - cx) ** 2 + (y - cy) ** 2 <= rr * rr) { const i = y * S.cols + x; if (S.dmg[i] < v) S.dmg[i] = v; }
    }
    function carve(lx, ly, r) {
      const g = S.g; g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(lx + S.T / 2, ly + SLAB_H / 2, r, 0, 7); g.fill(); g.restore();
      addDmg(lx, ly, r, 1);
    }
    function crack(lx, ly, ang, len, w = 1.2) {
      const g = S.g; g.save(); g.strokeStyle = 'rgba(0,0,0,.65)'; g.lineWidth = w; g.beginPath();
      let x = lx + S.T / 2, y = ly + SLAB_H / 2; g.moveTo(x, y);
      for (let i = 0; i < len; i += 6) { ang += rnd(-.35, .35); x += Math.cos(ang) * 6; y += Math.sin(ang) * 6; g.lineTo(x, y); }
      g.stroke(); g.restore();
      addDmg(lx, ly, 6, .45);
    }

    /* ----------------------------------------------------------- transforms */
    const toLocal = (x, y) => { const c = Math.cos(S.rot), s = Math.sin(S.rot); return [x * c + y * s, -x * s + y * c]; };
    const toWorld = (lx, ly) => { const c = Math.cos(S.rot), s = Math.sin(S.rot); return [lx * c - ly * s, lx * s + ly * c]; };
    const shotDir = () => { const a = cfg.elev * D2R; return [Math.cos(a), -Math.sin(a)]; };
    function obliquity() { const d = shotDir(); const [dx] = rotVec(d[0], d[1]); return Math.acos(clamp(dx, -1, 1)) / D2R; }
    function rotVec(x, y) { const c = Math.cos(S.rot), s = Math.sin(S.rot); return [x * c + y * s, -x * s + y * c]; }
    function slabBox() { const c = Math.abs(Math.cos(S.rot)), s = Math.abs(Math.sin(S.rot)); return { w: S.T * c + SLAB_H * s, h: S.T * s + SLAB_H * c }; }
    const interiorX = () => slabBox().w / 2 + 50;
    function hitPoint() { return toWorld(-S.T / 2, cfg.hit); }

    /* ---------------------------------------------------------- interior */
    function buildModules() {
      const x0 = interiorX(), b = slabBox(), cy = 0, ht = sel.target.hull;
      const base = (id, w, h, hp, x, y) => ({ id, x: x0 + x, y: cy + y, w, h, hp, max: hp, dead: false, hit: 0, burn: false });
      const top = Math.min(-b.h / 2 + 90, -150);
      mods = [
        base('crew', 190, 250, 100, 40, Math.min(top + 40, -170)),
        base('ammo', 250, 170, 100, 270, 70),
        base('fuel', 210, 120, 80, 290, top + 20),
        base('engine', 280, 330, 220, 590, -150)
      ];
      if (ht === 'bunker') mods[3].id = 'engine';
      mods.forEach(m => { m.name = T(m.id === 'engine' ? 'engine' : m.id); });
    }
    const modAt = (x, y) => mods.find(m => x >= m.x && x <= m.x + m.w && y >= m.y && y <= m.y + m.h);

    /* ---------------------------------------------------------- effects */
    function spark(x, y, ang, spd, life, col, type = 'spark', r = 2) {
      if (fx.length > 1800) return;
      fx.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life, max: life, col, type, r });
    }
    function burst(x, y, dirAng, spread, n, spd, cols, types) {
      for (let i = 0; i < n; i++) { const a = dirAng + rnd(-spread, spread); spark(x, y, a, rnd(.2, 1) * spd, rnd(.3, 1.1), cols[(Math.random() * cols.length) | 0], types || 'spark', rnd(1.5, 4)); }
    }
    function smoke(x, y, n, size = 18, col = 'rgba(120,130,145,.35)') {
      for (let i = 0; i < n; i++) fx.push({ x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-60, 60), vy: rnd(-120, -20), life: rnd(1.4, 2.8), max: 2.8, col, type: 'smoke', r: size * rnd(.6, 1.3) });
    }
    function ring(x, y, max, col = '255,200,120', life = .5) { rings.push({ x, y, r: 6, max, life, max0: life, col }); }
    function label(text, x, y, col = '#fbbf24') { labels.push({ text, x, y, life: 1.6, col }); }
    function toast(main, sub = '', col = '#fff') {
      $('toastMain').textContent = main; $('toastMain').style.color = col; $('toastSub').textContent = sub;
      $('toast').classList.add('show'); toastTimer = 2.8;
    }
    function snd(kind) {
      if (!window.ArcadeCore || ArcadeCore.isMuted()) return;
      try {
        if (kind === 'fire') ArcadeCore.explosion();
        else if (kind === 'hit') ArcadeCore.hit();
        else if (kind === 'boom') ArcadeCore.explosion();
        else if (kind === 'ping') ArcadeCore.playTone(1700, .12, 'triangle', .1);
        else if (kind === 'squeak') ArcadeCore.playTone(1200, .18, 'sine', .15);
        else if (kind === 'crack') ArcadeCore.playTone(900, .05, 'square', .06);
        else if (kind === 'nokia') [659, 587, 370, 415].forEach((f, i) => setTimeout(() => ArcadeCore.playTone(f, .09, 'square', .1), i * 90));
        else if (kind === 'win') ArcadeCore.powerup();
      } catch (e) {}
    }

    /* ------------------------------------------------------------ physics */
    const lossFactor = () => 1;
    function solveTate(v, rp, yp, rt, Rt) {
      const f = u => .5 * rp * (v - u) ** 2 + yp - .5 * rt * u * u - Rt;
      if (f(0) <= 0) return 0;
      if (f(v) >= 0) return v;
      let lo = 0, hi = v;
      for (let i = 0; i < 28; i++) { const mid = (lo + hi) / 2; if (f(mid) > 0) lo = mid; else hi = mid; }
      return (lo + hi) / 2;
    }

    function estimatePenetration() {
      const p = sel.proj;
      const vImp = cfg.vel * velMult() * Math.exp(-p.drag * cfg.range);
      let est = 0;
      if (p.kind === 'rod') {
        const u = solveTate(vImp, p.rho, p.yp, 7850, 4.5e9);
        const L = p.L || 0.5;
        est = u > 0 ? (L * u / Math.max(1, vImp - u)) * 1000 * penMult() : 50;
      } else if (p.kind === 'jet') {
        est = (p.jet || 700) * penMult();
        if (p.plasma) est *= 1.15;
      } else if (p.kind === 'hesh') {
        est = 240 * penMult();
      } else {
        est = (p.m * (vImp / 800) * (p.deepFuse ? 1.4 : 1.0) * 45) * penMult();
      }
      return Math.round(est);
    }

    function updatePenEstimator() {
      const est = estimatePenetration();
      const ob = obliquity();
      const cosOb = Math.cos(Math.min(ob, 84) * D2R);
      const los = Math.round(S.T / Math.max(0.05, cosOb));
      const textEl = $('penCalcText');
      const badgeEl = $('penBadge');
      const fillEl = $('penBarFill');
      if (!textEl || !badgeEl || !fillEl) return;

      const ratio = est / Math.max(1, los);
      const isRico = ob > sel.proj.rico;
      textEl.textContent = `${est} mm vs ${los} mm LOS`;

      if (isRico) {
        badgeEl.textContent = T('penRico');
        badgeEl.style.background = '#e11d48';
        badgeEl.style.color = '#fff';
        fillEl.style.width = '20%';
        fillEl.style.background = '#e11d48';
      } else if (ratio >= 1.15) {
        badgeEl.textContent = T('penSure');
        badgeEl.style.background = '#15803d';
        badgeEl.style.color = '#fff';
        fillEl.style.width = Math.min(100, Math.round(ratio * 50)) + '%';
        fillEl.style.background = '#22c55e';
      } else if (ratio >= 0.85) {
        badgeEl.textContent = T('penMarg');
        badgeEl.style.background = '#b45309';
        badgeEl.style.color = '#fff';
        fillEl.style.width = Math.min(100, Math.round(ratio * 50)) + '%';
        fillEl.style.background = '#fbbf24';
      } else {
        badgeEl.textContent = T('penNo');
        badgeEl.style.background = '#475569';
        badgeEl.style.color = '#cbd5e1';
        fillEl.style.width = Math.min(100, Math.round(ratio * 50)) + '%';
        fillEl.style.background = '#ef4444';
      }
    }

    function shockwave(x, y, power = 1) {
      stressWaves.push({ x, y, r: 5, max: 280 * power, life: 0.6, max0: 0.6, power });
    }

    function fire() {
      if (replayIdx >= 0) exitReplay();
      if (proj && proj.state !== 'done') return;
      if (blowout) { blowout = null; }
      const p = sel.proj, d = shotDir();
      const [hx, hy] = hitPoint();
      const dist = 1050;
      const effectiveV0 = cfg.vel * velMult();
      const vImp = effectiveV0 * Math.exp(-p.drag * cfg.range);
      proj = {
        def: p, x: hx - d[0] * dist, y: hy - d[1] * dist, dx: d[0], dy: d[1], v: vImp, v0: vImp,
        L: p.L || 0, mush: 1, state: 'fly', trail: [], depth: 0, spin: 0, outcome: '', timer: 0,
        jet: p.kind === 'jet' ? { budget: (p.jet || 700) * penMult(), len: 0 } : null, exited: false, away: false, travelled: 0, mass: p.m, heatT: 60
      };
      p.boomed = false; shots++; peakTemp = 60; maxDepth = 0; recoil = 1; flash = .9; shake = 4;
      mass0 = p.m; lastSpallCount = 0;
      replayFrames = [];
      const ang = Math.atan2(d[1], d[0]);
      for (let i = 0; i < 28; i++) spark(proj.x, proj.y, ang + rnd(-.45, .45), rnd(300, 1400), rnd(.3, .7), Math.random() < .5 ? '#fde68a' : '#fb923c');
      smoke(proj.x, proj.y, 10, 22);
      if (p.kind === 'rod') for (let i = 0; i < 3; i++) { const pa = ang + (i - 1) * 1.1 + Math.PI / 2 * (i === 1 ? 1 : 0); petals.push({ x: proj.x, y: proj.y, vx: Math.cos(ang + (i - 1) * .55) * 900, vy: Math.sin(ang + (i - 1) * .55) * 900 + (i - 1) * 300, rot: rnd(6), vr: rnd(-6, 6), life: 1.4 }); }
      snd('fire');
      updateHud();
    }
    let mass0 = 1;

    function impact(p) {
      const d = p.def, [dxl, dyl] = rotVec(p.dx, p.dy);
      const ang = Math.acos(clamp(dxl, -1, 1)) / D2R;
      const [wx, wy] = [p.x, p.y];
      const first = S.layers[0];
      p.angle = ang;
      p.impactLy = rotVec(p.x, p.y)[1];
      p.state = 'pen';
      pipFocus = { x: wx, y: wy };
      shake = Math.max(shake, 6); flash = .4;
      shockwave(wx, wy, 1.2);
      burst(wx, wy, Math.atan2(-p.dy, -p.dx) + 0, 1.1, 24, 950, ['#fde68a', '#f97316', '#e5e7eb']);
      ring(wx, wy, 75, '255,220,150', .35);

      if (d.nuke) { nukeDetonate(p); return; }
      if (d.kind === 'bounce') { return bounce(p, dxl, dyl, .55, 'rBounce'); }
      if (d.kind === 'splat') { splat(p, wx, wy); return; }

      let crit = d.rico;
      if (d.kind === 'rod' && p.v > 1500) crit += 4;
      if (first.key === 'fhs') crit -= 3;
      if (first.key === 'concrete' || first.key === 'wood') crit += 6;
      if (d.plasma) crit += 8;

      if (ang > crit + rnd(-3, 3)) {
        snd('ping');
        return bounce(p, dxl, dyl, .45, d.kind === 'jet' ? 'rDud' : 'rRico');
      }
      snd('hit');

      if (d.tandem && first.m.pat === 'era' && !first.era) {
        first.era = true;
        label(T('preEra'), wx, wy - 50, '#38bdf8');
        ring(wx, wy, 80, '255,180,60', .4);
        burst(wx, wy, Math.atan2(-p.dy, -p.dx), 1.2, 28, 1100, ['#fde047', '#fb923c']);
        carve(-S.T / 2 + first.mm / 2, p.impactLy, 30);
        snd('boom');
      }

      if (d.kind === 'hesh') { p.state = 'hesh'; p.timer = .45; p.v = 0; return; }
      if (d.kind === 'jet') { p.state = 'jet'; detonateHeat(p); return; }
      if (first.m.pat === 'era' && !first.era) triggerEra(p, first);
      if (first.m.pat === 'nera') triggerNera(p, first);
      if (d.indestructible) snd('nokia');
    }

    function triggerNera(p, l) {
      const [lx, ly] = rotVec(p.x, p.y);
      const [wx, wy] = [p.x, p.y];
      ring(wx, wy, 60, '148,163,184', .3);
      burst(wx, wy, Math.atan2(-p.dy, -p.dx), 0.8, 12, 600, ['#94a3b8', '#cbd5e1']);
      label(T('nera'), wx, wy - 40, '#94a3b8');
      if (p.def.kind === 'rod') { p.v *= 0.94; p.L *= 0.95; }
      else if (p.jet) { p.jet.budget *= 0.88; }
    }

    function nukeDetonate(p) {
      p.state = 'done';
      p.outcome = 'rNuke';
      nukeFlash = 1.0;
      shake = 32;
      const cx = p.x, cy = p.y;
      shockwave(cx, cy, 3.5);
      ring(cx, cy, 750, '255,255,220', 1.2);
      ring(cx, cy, 500, '255,180,50', 1.5);
      burst(cx, cy, 0, Math.PI, 220, 2800, ['#ffffff', '#fde047', '#fb923c', '#ef4444', '#c084fc']);
      smoke(cx, cy, 35, 60, 'rgba(30,30,35,.75)');
      snd('boom');
      toast(T('rNuke'), '155mm TACTICAL YIELD', '#fde047');
      const [lx, ly] = rotVec(cx, cy);
      carve(lx, ly, 180);
      for (let i = 0; i < 24; i++) crack(lx, ly + rnd(-120, 120), rnd(7), rnd(80, 240), 3);
      heatAdd(lx, ly, { v: 6000, def: { d: 0.1 } });
      mods.forEach(m => damage(m, 250, m.x + m.w / 2, m.y + m.h / 2, 'blast'));
      blowout = { x: 0, y: 0, vy: -1400, vx: 260, rot: 0, vr: 2.8, t: 0 };
      finish(p);
    }

    function bounce(p, dxl, dyl, keep, outKey) {
      let nx = -dxl, ny = dyl; const n = Math.hypot(nx, ny) || 1; nx /= n; ny /= n;
      const [wx, wy] = toWorld(nx, ny);
      p.dx = wx; p.dy = wy; p.v *= keep; p.state = 'fly'; p.away = true; p.outcome = outKey; p.depth = 0;
      burst(p.x, p.y, Math.atan2(wy, wx), .6, 18, 700, ['#fef08a', '#fff']);
      label(T(outKey), p.x, p.y - 40, '#38bdf8'); toast(T(outKey), '', '#38bdf8');
      if (p.def.kind === 'bounce') snd('squeak');
      const [lx, ly] = rotVec(p.x, p.y);
      for (let i = 0; i < 4; i++) crack(-S.T / 2, ly + rnd(-6, 6), rnd(-.9, .9), rnd(10, 26));
    }

    function splat(p, x, y) {
      for (let i = 0; i < 70; i++) spark(x, y, Math.atan2(-p.dy, -p.dx) + rnd(-1.4, 1.4), rnd(100, 1100), rnd(.5, 1.5), Math.random() < .6 ? '#ef4444' : '#22c55e', 'frag', rnd(2, 6));
      smoke(x, y, 6, 30, 'rgba(239,68,68,.25)');
      p.state = 'done'; p.outcome = 'rSplat'; toast(T('rSplat'), '', '#f87171'); snd('hit');
    }

    function triggerEra(p, l) {
      l.era = true;
      const [lx, ly] = rotVec(p.x, p.y);
      const [wx, wy] = [p.x, p.y];
      ring(wx, wy, 110, '255,160,60', .55); burst(wx, wy, Math.atan2(-p.dy, -p.dx), 1.4, 40, 1500, ['#fde047', '#fb923c', '#fff']);
      smoke(wx, wy, 8, 28); shake = 9; flash = .6;
      carve(-S.T / 2 + l.mm / 2, ly, 34); label(T('era'), wx, wy - 60, '#facc15'); snd('boom');
      if (p.def.kind === 'rod') { p.L *= .72; p.v *= .97; }
      else if (p.jet) p.jet.budget *= .35;
      else p.v *= .8;
    }

    function detonateHeat(p) {
      const first = S.layers[0];
      ring(p.x, p.y, 140, '255,210,90', .6); burst(p.x, p.y, Math.atan2(-p.dy, -p.dx), 1.3, 36, 1400, ['#fef08a', '#fb923c']);
      smoke(p.x, p.y, 6, 26); shake = 8; flash = .7; snd('boom');
      if (first.m.pat === 'era' && !first.era && !p.def.tandem) triggerEra(p, first);
      p.jetLx = -S.T / 2; p.jetLy = rotVec(p.x, p.y)[1]; p.jetDepth = 0; p.v = p.def.plasma ? 9800 : 8000;
      const d = p.def; p.dxl = rotVec(p.dx, p.dy);
    }

    function advance(dtP) {
      const p = proj; if (!p || p.state === 'done') return;
      let left = dtP, guard = 0;
      while (left > 1e-12 && p.state !== 'done' && guard++ < 600) {
        if (p.state === 'fly') left = stepFly(p, left);
        else if (p.state === 'pen') left = stepPen(p, left);
        else if (p.state === 'jet') left = stepJet(p, left);
        else if (p.state === 'hesh') { left = 0; }
        else break;
      }
    }

    function stepFly(p, left) {
      const ds = p.v * left * 1000;
      if (p.v < 5) { finish(p); return 0; }
      let step = ds;
      if (!p.away && !p.exited) {
        const [lx] = rotVec(p.x, p.y), [dxl] = rotVec(p.dx, p.dy);
        const dist = dxl > 1e-4 ? (-S.T / 2 - lx) / dxl : Infinity;
        if (dist <= ds) {
          p.x += p.dx * dist; p.y += p.dy * dist; p.trail.push([p.x, p.y]);
          const used = dist / (p.v * 1000); impact(p); return left - Math.max(used, 1e-9);
        }
      } else {
        step = Math.min(ds, 6);
        const sub = p.v * 1000;
        p.x += p.dx * step; p.y += p.dy * step; p.travelled += step;
        pipFocus = { x: p.x, y: p.y };
        const m = p.exited ? modAt(p.x, p.y) : null;
        if (m && !m.dead) hitModule(p, m, p.x, p.y);
        const fuseDist = p.def.deepFuse ? 580 : 380;
        if (p.exited && p.def.fuse && !p.def.boomed && p.travelled > fuseDist) { boomShell(p); }
        if (Math.abs(p.x) > 3200 || Math.abs(p.y) > 2200 || p.x > interiorX() + 1100) { finish(p); return 0; }
        if (p.v < 40) { finish(p); return 0; }
        p.trail.push([p.x, p.y]); if (p.trail.length > 40) p.trail.shift();
        return left - step / sub;
      }
      p.x += p.dx * step; p.y += p.dy * step;
      p.trail.push([p.x, p.y]); if (p.trail.length > 40) p.trail.shift();
      return 0;
    }

    function stepPen(p, left) {
      const d = p.def, [dxl, dyl] = rotVec(p.dx, p.dy);
      let [lx, ly] = rotVec(p.x, p.y);
      const l = layerAt(lx), m = l.m, dm = dmgAt(lx, ly);
      if (m.pat === 'era' && !l.era && !d.tandem) triggerEra(p, l);
      if (m.pat === 'nera') triggerNera(p, l);

      const stepMM = 1.5; let dt;
      const soft = 1 - .85 * dm;
      let rc;
      if (d.kind === 'rod') {
        const u = solveTate(p.v, d.rho, d.yp * penMult(), m.rho, m.rt * soft);
        if (u < 8) { p.outcome = 'rStuck'; p.state = 'done'; endPen(p); return 0; }
        dt = Math.min(stepMM / 1000 / u, left);
        const ds = u * dt * 1000;
        const wear = (1 + Math.max(0, p.angle - 50) / 35) / penMult();
        p.L -= (p.v - u) * dt * wear;
        p.v = Math.max(0, p.v - (d.yp / (d.rho * Math.max(p.L, .02))) * dt);
        move(p, ds, dxl, dyl);
        rc = d.d * 650 * (1 + .35 * m.brittle);
        if (p.L <= .012) { p.outcome = 'rStuck'; endPen(p); p.state = 'done'; return 0; }
      } else {
        if (p.v < 25) { p.outcome = 'rStuck'; p.state = 'done'; endPen(p); return 0; }
        dt = Math.min(stepMM / 1000 / p.v, left);
        const A = Math.PI * (d.d / 2) ** 2 * p.mush;
        const Rs = .36 * m.rt * soft, dyn = .5 * m.rho * d.N * p.v * p.v;
        const F = (A * (Rs + dyn)) / penMult();
        p.v = Math.max(0, p.v - (F / d.m) * dt);
        move(p, p.v * dt * 1000 + .01, dxl, dyl);
        if (!d.indestructible && Rs + dyn > d.yld * penMult()) {
          p.mush += .9 * stepMM / (d.d * 1000);
          if (p.mush > (d.deepFuse ? 3.4 : 2.6)) { shatterProjectile(p); return 0; }
        }
        rc = d.d * 500 * Math.min(p.mush, 2);
      }
      [lx, ly] = rotVec(p.x, p.y);
      pipFocus = { x: p.x, y: p.y };
      carve(lx, ly, rc);
      if (m.brittle > .3) addDmg(lx, ly, rc * (1 + 2.2 * m.brittle), .5);
      if (Math.random() < .1 + m.brittle * .12) crack(lx, ly, Math.atan2(dyl, dxl) + rnd(-1.4, 1.4), rnd(14, 50) * (.5 + m.brittle));
      heatAdd(lx, ly, p);
      if (Math.random() < .5) spark(p.x, p.y, Math.atan2(-p.dy, -p.dx) + rnd(-1.2, 1.2), rnd(200, 900), rnd(.25, .6), Math.random() < .5 ? '#fde68a' : '#fb923c');
      maxDepth = Math.max(maxDepth, (lx + S.T / 2) / Math.max(.05, dxl));
      p.depth = lx + S.T / 2;
      if (lx >= S.T / 2) { exitSlab(p, l, lx, ly); }
      return left - dt;
    }

    function move(p, ds, dxl, dyl) { p.x += p.dx * ds; p.y += p.dy * ds; p.trail.push([p.x, p.y]); if (p.trail.length > 40) p.trail.shift(); }

    function heatAdd(lx, ly, p) {
      const T0 = Math.min(p.def && p.def.plasma ? 7500 : 4500, 500 + p.v * 1.6);
      peakTemp = Math.max(peakTemp, T0);
      const last = heat[heat.length - 1];
      if (last && Math.hypot(last.lx - lx, last.ly - ly) < 3) return;
      heat.push({ lx, ly, t: T0, r: 12 + (p.def ? p.def.d * 400 : 15) });
      if (heat.length > 700) heat.shift();
    }

    function stepJet(p, left) {
      const d = p.def, jet = p.jet;
      const [dxl, dyl] = rotVec(p.dx, p.dy);
      let lx = p.jetLx, ly = p.jetLy;
      const stepMM = 1.5, dt = Math.min(stepMM / 1000 / 8000, left);
      const l = layerAt(lx), dm = dmgAt(lx, ly);
      if (l.m.pat === 'era' && !l.era && !d.tandem) triggerEra(p, l);
      if (l.m.pat === 'nera') triggerNera(p, l);

      let effCost = l.m.ce * (1 - .85 * dm) * (1 + Math.max(0, p.angle - 55) / 40);
      if (d.plasma) effCost *= 0.65;
      if (l.key === 'air') effCost *= 1.35; // air gap destabilizes jet

      jet.budget -= stepMM * effCost;
      lx += dxl * stepMM; ly += dyl * stepMM; p.jetLx = lx; p.jetLy = ly; p.jetDepth += stepMM;
      const [wx, wy] = toWorld(lx, ly); p.x = wx; p.y = wy; p.trail.push([wx, wy]); if (p.trail.length > 40) p.trail.shift();
      pipFocus = { x: wx, y: wy };
      carve(lx, ly, 6 + p.jetDepth * .018 + (d.plasma ? 6 : 0));
      addDmg(lx, ly, 10, .5);
      heatAdd(lx, ly, { v: d.plasma ? 4200 : 2600, def: { d: d.plasma ? .04 : .02, plasma: d.plasma } });
      maxDepth = Math.max(maxDepth, p.jetDepth);
      p.v = (d.plasma ? 9800 : 8000) * clamp(jet.budget / (d.jet || 700), 0, 1) + 300;
      if (jet.budget <= 0) { p.outcome = 'rJet'; p.state = 'done'; endPen(p); return 0; }
      if (lx >= S.T / 2) { p.state = 'jetout'; exitSlab(p, layerAt(lx), lx, ly); p.state = 'fly'; p.exited = true; p.jetFly = true; p.v = 4000; p.mass = .6; }
      return left - dt;
    }

    function exitSlab(p, l, lx, ly) {
      p.exited = true; p.state = 'fly'; p.exitX = p.x; p.exitY = p.y;
      const kin = .5 * (p.def.kind === 'jet' ? .8 : (p.def.kind === 'rod' ? Math.PI * (p.def.d / 2) ** 2 * p.L * p.def.rho : p.def.m)) * p.v * p.v;
      const rear = S.layers[S.layers.length - 1];
      const sp = rear.m.spall;
      const n = Math.min(90, Math.floor((8 + kin / 60000 * (.4 + sp)) * (rear.key === 'kevlar' ? .25 : 1) * spallMult()));
      lastSpallCount = n;
      const ang = Math.atan2(p.dy, p.dx);
      shockwave(p.x, p.y, 1.4);
      burst(p.x, p.y, ang, .5, 26, 1800, ['#fef08a', '#fb923c', '#f87171']);

      // Armor plug ejection
      const plugRadius = Math.max(8, (p.def.d || 0.03) * 350);
      plugs.push({
        x: p.x, y: p.y,
        vx: Math.cos(ang + rnd(-0.2, 0.2)) * Math.min(1600, p.v * 0.45),
        vy: Math.sin(ang + rnd(-0.2, 0.2)) * Math.min(1600, p.v * 0.45),
        r: plugRadius, rot: 0, vr: rnd(-8, 8), life: 2.2, dmg: 40 * spallMult()
      });

      for (let i = 0; i < n; i++) fx.push({
        x: p.x, y: p.y,
        vx: Math.cos(ang + rnd(-.55, .55)) * rnd(500, 2600),
        vy: Math.sin(ang + rnd(-.55, .55)) * rnd(500, 2600),
        life: 1.6, max: 1.6, col: p.def.plasma ? '#c084fc' : '#fdba74',
        type: 'spall', r: rnd(1.5, 3.4), dmg: (5 + rnd(14)) * spallMult()
      });
      ring(p.x, p.y, 90, '255,150,70', .5); smoke(p.x, p.y, 5, 24);
      if (n > 12) toast(T('rSpall'), `${n} ${T('srSpall')}`, '#fdba74');
      snd('boom'); shake = Math.max(shake, 7);
      if (p.def.kind === 'jet') p.jetFly = true;
      if (!p.outcome) p.outcome = 'rPerf';
      p.resid = p.v;
    }

    function shatterProjectile(p) {
      const ang = Math.atan2(-p.dy, -p.dx);
      for (let i = 0; i < 40; i++) spark(p.x, p.y, ang + rnd(-1.6, 1.6), rnd(200, 1300), rnd(.5, 1.4), p.def.id === 'baguette' ? '#fcd9a0' : '#cbd5e1', 'frag', rnd(1.5, 4));
      if (p.def.id === 'baguette') smoke(p.x, p.y, 6, 20, 'rgba(250,230,190,.35)');
      p.outcome = 'rShatter'; p.state = 'done'; toast(T('rShatter'), '', '#fbbf24'); snd('crack'); endPen(p);
    }

    function boomShell(p) {
      p.def.boomed = true;
      const mult = p.def.deepFuse ? 1.4 : 1.0;
      blast(p.x, p.y, 380 * mult, 100 * mult * spallMult(), 'rBoom');
      p.outcome = 'rBoom'; p.state = 'done';
    }

    function hitModule(p, m, x, y) {
      const d = p.def;
      let dmg;
      if (p.jetFly) dmg = clamp(p.jet.budget / 3, 10, 100);
      else if (d.kind === 'rod') dmg = clamp(30 + .5 * Math.PI * (d.d / 2) ** 2 * Math.max(p.L, .05) * d.rho * p.v * p.v / 20000, 30, 100);
      else dmg = clamp(25 + .5 * d.m * p.v * p.v / 12000, 25, 100);
      dmg *= spallMult();
      damage(m, dmg, x, y, p.jetFly ? 'jet' : 'kin');
      p.v *= p.jetFly ? .55 : .72;
      if (d.kind === 'rod') p.L *= .75;
      if (p.jetFly) p.jet.budget *= .55;
      burst(x, y, Math.atan2(p.dy, p.dx), .8, 14, 600, ['#fb923c', '#fde68a']);
      if (p.v < 80 || (p.jetFly && p.jet.budget < 6)) finish(p);
    }

    function damage(m, dmg, x, y, kind) {
      if (m.dead) return;
      m.hp -= dmg; m.hit = 1;
      ring(x, y, 50, '255,120,80', .35);
      if (m.id === 'ammo' && !m.cooked && (dmg > 38 || m.hp <= 0 || (kind === 'jet' && dmg > 14))) { cookOff(m); }
      if (m.id === 'fuel' && !m.burn && dmg > 20) { m.burn = true; if (!mission.fire) done('fire', T('fireOn')); }
      if (m.hp <= 0) kill(m);
    }

    function kill(m) {
      m.dead = true; m.hp = 0;
      if (m.id === 'crew') { done('crew', T('crewKia')); }
      if (m.id === 'engine') { done('engine', T('engDead')); m.burn = true; }
      if (m.id === 'fuel') { m.burn = true; }
    }

    function cookOff(m) {
      m.cooked = true; m.dead = true; m.hp = 0; m.burn = true;
      const cx = m.x + m.w / 2, cy = m.y + m.h / 2;
      blast(cx, cy, 520, 120, 'rBoom', true);
      done('ammo', T('cook'));
      mods.forEach(o => { if (o !== m && !o.dead) { const dd = Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy); damage(o, clamp(110 - dd / 4, 25, 100), o.x + o.w / 2, o.y + o.h / 2, 'blast'); } });
      if (sel.target.hull === 'tank') blowout = { x: 0, y: 0, vy: -900, vx: 120, rot: 0, vr: rnd(-1.5, 1.5), t: 0 };
      shake = 20; flash = 1;
    }

    function blast(x, y, radius, dmg, key, big) {
      ring(x, y, radius, '255,190,80', .8); ring(x, y, radius * .6, '255,255,200', .5);
      shockwave(x, y, big ? 2.2 : 1.4);
      burst(x, y, 0, Math.PI, big ? 120 : 60, big ? 2200 : 1500, ['#fde047', '#fb923c', '#ef4444', '#fff'], 'spark');
      smoke(x, y, big ? 20 : 10, 38); shake = Math.max(shake, 14); flash = Math.max(flash, .8); snd('boom');
      for (let i = 0; i < (big ? 40 : 22); i++) fx.push({ x, y, vx: rnd(-1800, 1800), vy: rnd(-1800, 1800), life: 1.4, max: 1.4, col: '#fdba74', type: 'spall', r: rnd(2, 4), dmg: 12 + rnd(20) });
      if (!big) mods.forEach(m => { if (!m.dead) { const dd = Math.hypot(m.x + m.w / 2 - x, m.y + m.h / 2 - y); if (dd < radius + 120) damage(m, clamp(dmg * (1.3 - dd / (radius + 120)), 10, 100), m.x + m.w / 2, m.y + m.h / 2, 'blast'); } });
    }

    function done(key, text) {
      if (mission[key]) return;
      mission[key] = true;
      const pts = { perf: 100, crew: 200, engine: 150, fire: 100, ammo: 300 }[key] || 0;
      score += pts;
      addCredits(Math.round(pts / 2));
      if (score > best) { best = score; try { localStorage.setItem('ballistics_best', best); ArcadeCore.saveScore && ArcadeCore.saveScore('ballistics_best', best); } catch (e) {} }
      if (text) { toast(text, '+' + pts + ' (+$' + Math.round(pts / 2) + ')', '#4ade80'); snd('win'); }
      if (['perf', 'crew', 'engine', 'fire', 'ammo'].every(k => mission[k])) {
        const bonus = Math.max(0, (8 - shots) * 50);
        score += bonus;
        addCredits(bonus);
        toast(T('allDone'), '+' + bonus, '#fbbf24');
      }
      renderMission();
    }

    function endPen(p) {
      p.state = 'done';
      if (!p.outcome) p.outcome = 'rStuck';
      finish(p, true);
    }

    function showShotReport(p) {
      const rep = $('shotReport');
      if (!rep) return;
      rep.classList.add('show');
      const v = Math.round(p.v0 || p.v);
      const pen = Math.round(maxDepth);
      const sp = lastSpallCount;
      const plug = plugs.length > 0 ? '✔' : '✖';
      rep.innerHTML = `<div class="sec-title" style="margin-bottom:4px;color:#38bdf8;"><span>${T('srTitle')}</span><span>${T(p.outcome || 'rPerf')}</span></div>` +
        `<div class="sr-row"><span>${T('srImp')}</span><b>${v} m/s</b></div>` +
        `<div class="sr-row"><span>${T('srPen')}</span><b>${pen} mm</b></div>` +
        `<div class="sr-row"><span>${T('srSpall')}</span><b>${sp}</b></div>` +
        `<div class="sr-row"><span>${T('srPlug')}</span><b>${plug}</b></div>`;
    }

    function checkActiveChallenge() {
      if (!activeChal) return;
      const won = activeChal.check(mission, mods);
      if (won) {
        addCredits(activeChal.reward);
        chalDone[activeChal.id] = true;
        try { localStorage.setItem('ballistics_chal', JSON.stringify(chalDone)); } catch (e) {}
        toast(T('chalWin'), `+$${activeChal.reward}`, '#fbbf24');
        snd('win');
        activeChal = null;
        renderChallenges();
        renderMission();
      } else if (shots >= activeChal.maxShots) {
        toast(T('chalFail'), '', '#ef4444');
      }
    }

    function finish(p, fromPen) {
      if (p.fin) return; p.fin = true; p.state = 'done';
      const out = p.outcome || (p.exited ? 'rPerf' : 'rStuck');
      if (out === 'rPerf' || p.exited) {
        done('perf', T('rPerf'));
        toast(T('rPerf'), `${T('subPerf')}: ${Math.round(p.resid || p.v)} ${T('vel')}`, '#fb7185');
      } else if (out === 'rStuck') toast(T('rStuck'), `${T('subStuck')} ${Math.round(maxDepth)} ${T('mm')}`, '#fbbf24');
      else if (out === 'rJet') toast(T('rJet'), `${Math.round(maxDepth)} ${T('mm')}`, '#fbbf24');
      if (p.def.id === 'nokia' && !p.away) label(T('rPhone'), p.x, p.y - 30, '#93c5fd');
      if (p.def.kind === 'blunt' && p.def.fuse && !p.def.boomed) {
        if (!p.exited) { blast(p.x, p.y, 280, 60, 'rBoom'); const [lx, ly] = rotVec(p.x, p.y); carve(lx, ly, 46); for (let i = 0; i < 8; i++) crack(lx, ly, rnd(7), rnd(30, 80)); }
      }
      showShotReport(p);
      checkActiveChallenge();
      if (replayFrames.length > 5) {
        const wrap = $('replayWrap');
        if (wrap) {
          wrap.classList.add('show');
          $('rngReplay').max = replayFrames.length - 1;
          $('rngReplay').value = replayFrames.length - 1;
        }
      }
    }

    function heshDetonate(p) {
      const [lx0, ly0] = rotVec(p.x, p.y);
      let rha = 0; S.layers.forEach(l => { rha += l.mm * l.m.ke; });
      const norm = rha * Math.cos(p.angle * D2R);
      const power = clamp((1.15 - norm / 330) * penMult(), 0, 1.2);
      ring(p.x, p.y, 160, '255,210,90', .7); burst(p.x, p.y, Math.atan2(-p.dy, -p.dx), 1.3, 40, 1300, ['#fef08a', '#fb923c']); smoke(p.x, p.y, 10, 30);
      shake = 12; flash = .8; snd('boom');
      shockwave(p.x, p.y, 1.8);
      for (let i = 0; i < 14; i++) crack(-S.T / 2, ly0 + rnd(-60, 60), rnd(-1.3, 1.3), rnd(40, 160) * (.5 + power), 1.6);
      for (let i = 0; i < 26; i++) addDmg(rnd(-S.T / 2, S.T / 2), ly0 + rnd(-90, 90), rnd(8, 20), clamp(power * .9, .2, .8));
      p.state = 'done'; p.outcome = 'rBoom';
      if (power > .12) {
        const [bx, by] = toWorld(S.T / 2, ly0), ang = Math.atan2(p.dy, p.dx);
        const n = Math.floor((6 + 44 * power) * spallMult());
        lastSpallCount = n;
        for (let i = 0; i < n; i++) fx.push({ x: bx, y: by, vx: Math.cos(ang + rnd(-.7, .7)) * rnd(500, 2400), vy: Math.sin(ang + rnd(-.7, .7)) * rnd(500, 2400), life: 1.8, max: 1.8, col: '#fdba74', type: 'spall', r: rnd(2, 4), dmg: (5 + rnd(14) * power) * spallMult() });
        carve(S.T / 2 - 14, ly0, 38 * power + 10);
        toast(T('rSpall'), `${n} ${T('srSpall')}`, '#fdba74'); mission.perf || done('perf', T('rPerf'));
      } else toast(T('rBoom'), '', '#fbbf24');
      finish(p);
    }

    /* ------------------------------------------------------------- update */
    let frameTimer = 0;
    function recordReplayFrame() {
      if (!proj) return;
      if (replayFrames.length > 250) replayFrames.shift();
      replayFrames.push({
        px: proj.x, py: proj.y, pstate: proj.state, pv: proj.v,
        trail: proj.trail.slice(),
        depth: maxDepth, temp: peakTemp,
        fx: fx.map(f => ({ x: f.x, y: f.y, r: f.r, col: f.col, type: f.type })),
        plugs: plugs.map(p => ({ x: p.x, y: p.y, r: p.r, rot: p.rot })),
        mods: mods.map(m => ({ id: m.id, hp: m.hp, dead: m.dead, burn: m.burn })),
        focus: { x: pipFocus.x, y: pipFocus.y }

    }

    function exitReplay() {
      replayIdx = -1;
      const wrap = $('replayWrap');
      if (wrap) wrap.classList.remove('show');
    }

    function scrubReplay(idx) {
      if (!replayFrames.length) return;
      replayIdx = clamp(idx, 0, replayFrames.length - 1);
      $('rngReplay').value = replayIdx;

    function update(real) {
      if (cfg.moveTrg && (!proj || proj.state === 'done')) {
        const osc = Math.sin(perfT * 1.8) * 16;
        S.rot = (cfg.plate + osc) * D2R;
        buildModules();
        syncLabels();
      }

      if (replayIdx >= 0) {
        // Paused in replay scrub
        return;
      }

      const slowBase = speed;
      let timeK = slowBase;
      let fxK = slowBase;
      if (proj && proj.state !== 'done' && autoSlow) {
        const [lx] = rotVec(proj.x, proj.y);
        const near = lx > -S.T / 2 - 90 && !proj.away && (!proj.exited || proj.travelled < 700);
        if (!near && !proj.exited) timeK = slowBase * 5;
        else if (near) timeK = slowBase * .55;
      }
      const dtP = real * timeK * DIL, dtF = real * fxK;
      if (proj && proj.state !== 'done') {
        frameTimer += real;
        if (frameTimer >= 0.02) {
          frameTimer = 0;
          recordReplayFrame();
        }
        if (proj.state === 'hesh') { proj.timer -= real * slowBase; if (proj.timer <= 0) heshDetonate(proj); }
        else advance(dtP);
      }
      updateFx(dtF);
      if (proj && proj.state === 'done' && !proj.reported) {
        proj.reported = true;
        recordReplayFrame();
      }
      if (toastTimer > 0) { toastTimer -= real; if (toastTimer <= 0) $('toast').classList.remove('show'); }
      recoil = Math.max(0, recoil - real * 1.6);
      flash = Math.max(0, flash - real * 2.6);
      nukeFlash = Math.max(0, nukeFlash - real * 0.9);
      shake = Math.max(0, shake - real * 18);
      heat.forEach(h => { h.t = Math.max(20, h.t - 220 * dtF); });
      while (heat.length && heat[0].t <= 25) heat.shift();
      if (blowout) {
        blowout.t += dtF;
        blowout.vy += 900 * dtF;
        blowout.x += blowout.vx * dtF;
        blowout.y += blowout.vy * dtF;
        blowout.rot += blowout.vr * dtF;
        if (blowout.y > 400) { blowout.y = 400; blowout.vy = 0; blowout.vx *= .8; }
      }
      mods.forEach(m => {
        m.hit = Math.max(0, m.hit - dtF * 2);
        if (m.burn && Math.random() < 1.6 * dtF * 30) fx.push({ x: m.x + rnd(m.w), y: m.y + m.h * rnd(.2, .9), vx: rnd(-30, 30), vy: rnd(-260, -80), life: rnd(.7, 1.5), max: 1.5, col: Math.random() < .5 ? '#fb923c' : '#fde047', type: 'fire', r: rnd(8, 20) });
        if (m.burn && Math.random() < .5 * dtF * 30) smoke(m.x + m.w / 2, m.y, 1, 26, 'rgba(40,45,55,.5)');
      });
      peakTemp = Math.max(20, peakTemp - 60 * dtF);
      updateHud();
      updatePenEstimator();
    }

    function updateFx(dt) {
      for (let i = fx.length - 1; i >= 0; i--) {
        const f = fx[i]; f.life -= dt; if (f.life <= 0) { fx.splice(i, 1); continue; }
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.type === 'frag' || f.type === 'spark') { f.vy += 700 * dt; f.vx *= 1 - .6 * dt; }
        else if (f.type === 'smoke') { f.r += 22 * dt; f.vx *= 1 - .8 * dt; f.vy *= 1 - .5 * dt; }
        else if (f.type === 'fire') { f.r *= 1 - .6 * dt; }
        else if (f.type === 'spall') {
          const m = modAt(f.x, f.y);
          if (m && !m.dead) {
            damage(m, f.dmg, f.x, f.y, 'frag');
            f.life = 0;
            for (let k = 0; k < 3; k++) spark(f.x, f.y, rnd(7), rnd(100, 500), .3, '#fb923c');
          }
        }
      }
      for (let i = plugs.length - 1; i >= 0; i--) {
        const pl = plugs[i]; pl.life -= dt; if (pl.life <= 0) { plugs.splice(i, 1); continue; }
        pl.x += pl.vx * dt; pl.y += pl.vy * dt; pl.vy += 650 * dt; pl.rot += pl.vr * dt;
        const m = modAt(pl.x, pl.y);
        if (m && !m.dead) {
          damage(m, pl.dmg, pl.x, pl.y, 'plug');
          pl.life = 0;
          burst(pl.x, pl.y, 0, Math.PI, 14, 500, ['#cbd5e1', '#fb923c']);
        }
      }
      for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 7); if (r.life <= 0) rings.splice(i, 1); }
      for (let i = stressWaves.length - 1; i >= 0; i--) { const sw = stressWaves[i]; sw.life -= dt; sw.r += (sw.max - sw.r) * Math.min(1, dt * 8); if (sw.life <= 0) stressWaves.splice(i, 1); }
      for (let i = labels.length - 1; i >= 0; i--) { const l = labels[i]; l.life -= dt; l.y -= 22 * dt; if (l.life <= 0) labels.splice(i, 1); }
      for (let i = petals.length - 1; i >= 0; i--) { const p = petals[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.rot += p.vr * dt; if (p.life <= 0) petals.splice(i, 1); }
    }
