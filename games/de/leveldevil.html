/**
 * LEVEL DEVIL (UNEPT ORIGINAL EDITION)
 * Authentische Level-Struktur nach den echten Welten:
 * 1. Pits (Böden brechen weg, fallen abwärts, Löcher tun sich auf)
 * 2. Spikes (Versteckte Stacheln schießen hoch, Decken-Spikes stürzen ab)
 * 3. Push / Ceiling Crushers (Wände & Decken pressen zu)
 * 4. Escaping Doors (Türen bekommen Beine, weichen aus, fallen weg)
 * 5. Controls (Umgekehrte Tasten Links/Rechts)
 * 6. Springs (Sprungfedern & katapultierte Flugkurven)
 * 7. Screen Wraps (Durch den linken/rechten Bildschirmrand warpen)
 * 8. Gravity (Schwerkraft-Umkehrung an die Decke)
 */

// --- Audio Synthesizer (Web Audio API) ---
class SoundController {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  jump() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(520, t + 0.11);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.11);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.11);
    } catch(e) {}
  }

  splat() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(35, t + 0.16);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.16);
    } catch(e) {}
  }

  trapSnap() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(680, t);
      osc.frequency.setValueAtTime(140, t + 0.04);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.09);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.09);
    } catch(e) {}
  }

  trollBuzzer() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.setValueAtTime(110, t + 0.14);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.28);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.28);
    } catch(e) {}
  }

  win() {
    if (!this.enabled || !this.ctx) return;
    try {
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, i) => {
        const t = this.ctx.currentTime + i * 0.08;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.18);
      });
    } catch(e) {}
  }

  whoosh() {
    if (!this.enabled || !this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(700, t + 0.14);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.14);
    } catch(e) {}
  }
}

        player.gravityMultiplier = -1;
        player.vy = -7;
        sounds.whoosh();
        shake(6);
        flashScreen();
        updateDevilBubble("😈 Decke ist jetzt der Boden! Direkt ins gelbe Portal spazieren!");
      }
    }
  },

  // 18. THE DEVIL GAUNTLET: Das große Finale (Kombination aller Original-Mechaniken)
  {
    world: "Final",
    title: "18. Finale: Der Höllen-Spießrutenlauf",
    subtitle: "Pits, Spikes, weglaufende Tür & Schwerkraft in einem!",
    hint: "Meistere die Fallen der Reihe nach: Ködern, springen, Tür stellen!",
    spawn: { x: 50, y: 380 },
    door: { x: 710, y: 200, w: 34, h: 54, state: 0, running: false, vx: 0, legAngle: 0 },
    platforms: [
      { x: 0, y: 420, w: 180, h: 80, type: "solid" },
      // Drop pit trap
      { x: 180, y: 420, w: 100, h: 80, type: "solid", isTrap: true, triggered: false, dy: 0 },
      { x: 320, y: 360, w: 100, h: 18, type: "solid" },
      { x: 470, y: 310, w: 100, h: 18, type: "solid" },
      { x: 620, y: 256, w: 180, h: 30, type: "solid" }
    ],
    spikes: [
      { x: 180, y: 470, w: 440, h: 20, active: true }
    ],
    init(lvl) {
      lvl.platforms[1].triggered = false;
      lvl.platforms[1].dy = 0;
      lvl.platforms[1].y = 420;
      lvl.door.x = 710;
      lvl.door.y = 200;
      lvl.door.running = false;
      lvl.door.vx = 0;
    },
    update(lvl) {
      const p = lvl.platforms[1];
      if (!p.triggered && player.x > 140) {
        p.triggered = true;
        sounds.trapSnap();
        shake(4);
      }
      if (p.triggered && p.dy < 90) {
        p.dy += 6;
        p.y = 420 + p.dy;
      }

      // Escaping door at the end!
      const d = lvl.door;
      if (!d.running && player.x > 540) {
        d.running = true;
        sounds.whoosh();
        updateDevilBubble("😈 Fast geschafft! Aber die Tür will nicht aufgeben!");
      }
      if (d.running) {
        d.legAngle += 0.35;
        if (d.x < 740) d.x += 1.2;
      }
    }
  }
];

// --- Level Loading & Resetting ---
let deathTimeout = null;

function loadLevel(idx) {
  clearTimeout(deathTimeout);
  if (idx < 0) idx = 0;
  if (idx >= LEVELS.length) {
    showFinalVictory();
    return;
  }
  currentLevelIdx = idx;
  levelData = LEVELS[idx];
  deathsThisLevel = 0;

  ghostCorpses = [];

  document.getElementById("hudLvl").textContent = `${idx + 1} / ${LEVELS.length}`;
  document.getElementById("hudDeaths").textContent = savedProgress.totalDeaths;
  updateDevilBubble(`😈 <strong>${levelData.title}</strong>: ${levelData.subtitle}`);

  resetPlayer(false);
  if (levelData.init) levelData.init(levelData);

  gameState = "PLAYING";
  document.getElementById("uiOverlay").classList.add("hidden");
  document.getElementById("levelGrid").classList.add("hidden");
}

function resetPlayer(isDeath = true) {
  clearTimeout(deathTimeout);
  player.x = levelData.spawn.x;
  player.y = levelData.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.dead = false;
  player.squashX = 1;
  player.squashY = 1;
  player.gravityMultiplier = 1;
  player.invertedControls = false;
  player.facing = 1;
  player.coyoteTimer = 0;
  player.jumpBuffer = 0;

  if (isDeath) {
    deathsThisLevel++;
    savedProgress.totalDeaths++;
    document.getElementById("hudDeaths").textContent = savedProgress.totalDeaths;
    saveGameState();
    
    const randomRoast = ROASTS[Math.floor(Math.random() * ROASTS.length)];
    updateDevilBubble(`😈 ${randomRoast}`);
  }

  if (levelData.init) levelData.init(levelData);
}

function killPlayer(customMsg = null) {
  if (player.dead) return;
  player.dead = true;
  sounds.splat();
  shake(10);
  flashScreen();

  // Burst into black geometric fragments like original
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5.5;
    particles.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 4 + Math.random() * 5,
      color: i < 2 ? "#ffffff" : "#181818",
      isEye: i === 0 || i === 1,
      rot: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.3,
      alpha: 1
    });
  }

  if (customMsg) {
    updateDevilBubble(`😈 ${customMsg}`);
  }

  deathTimeout = setTimeout(() => {
    resetPlayer(true);
  }, 280);
}

function completeLevel() {
  if (gameState !== "PLAYING") return;
  gameState = "LEVEL_CLEAR";
  sounds.win();
  flashScreen();

  for (let i = 0; i < 50; i++) {
    confetti.push({
      x: player.x + 10,
      y: player.y,
      vx: (Math.random() - 0.5) * 9,
      vy: -4 - Math.random() * 7,
      size: 5 + Math.random() * 5,
      color: ["#ffcc00", "#181818", "#ff3344", "#2ed573", "#ffa502"][Math.floor(Math.random() * 5)],
      rot: Math.random() * 6,
      vRot: (Math.random() - 0.5) * 0.2
    });
  }

  savedProgress.clearedLevels[currentLevelIdx] = true;
  if (currentLevelIdx + 2 > savedProgress.unlockedLevel) {
    savedProgress.unlockedLevel = currentLevelIdx + 2;
  }
  saveGameState();

  const overlay = document.getElementById("uiOverlay");
  const title = document.getElementById("overlayTitle");
  const sub = document.getElementById("overlaySub");
  const btnNext = document.getElementById("btnNext");
  const btnRetry = document.getElementById("btnRetry");
  const levelGrid = document.getElementById("levelGrid");

  levelGrid.classList.add("hidden");
  title.textContent = `LEVEL ${currentLevelIdx + 1} GESCHAFFT!`;
  sub.textContent = deathsThisLevel === 0 
    ? "Perfekt! Beim ersten Versuch das Tor erreicht!" 
    : `Geschafft nach ${deathsThisLevel} Versuchen. Das Tor steht offen!`;

  btnNext.textContent = currentLevelIdx + 1 >= LEVELS.length ? "Zum Abspann 🏆" : "Nächstes Level ➔";
  btnNext.onclick = () => {
    loadLevel(currentLevelIdx + 1);
  };

  btnRetry.textContent = "Nochmal ↺";
  btnRetry.onclick = () => {
    loadLevel(currentLevelIdx);
  };

  overlay.classList.remove("hidden");
}

function showFinalVictory() {
  gameState = "FINAL_VICTORY";
  sounds.win();

  const overlay = document.getElementById("uiOverlay");
  const title = document.getElementById("overlayTitle");
  const sub = document.getElementById("overlaySub");
  const btnNext = document.getElementById("btnNext");
  const levelGrid = document.getElementById("levelGrid");

  levelGrid.classList.add("hidden");
  title.textContent = "👑 ALLE LEVEL GESCHAFFT!";
  sub.innerHTML = `Du hast alle 18 Original-Level von Level Devil bezwungen!<br>Gesamt-Tode: <strong style="color:#e84118">${savedProgress.totalDeaths}</strong>.<br>Du kennst nun jeden fiesen Trick!`;

  btnNext.textContent = "Erneut Spielen ↺";
  btnNext.onclick = () => {
    loadLevel(0);
  };

  document.getElementById("btnRetry").textContent = "Level-Menü 📋";
  document.getElementById("btnRetry").onclick = showLevelMenu;

  overlay.classList.remove("hidden");
}

function showLevelMenu() {
  gameState = "MENU";
  const overlay = document.getElementById("uiOverlay");
  const title = document.getElementById("overlayTitle");
  const sub = document.getElementById("overlaySub");
  const btnNext = document.getElementById("btnNext");
  const btnRetry = document.getElementById("btnRetry");
  const levelGrid = document.getElementById("levelGrid");

  title.textContent = "📋 LEVEL-AUSWAHL";
  sub.textContent = "Wähle eine der Original-Herausforderungen:";

  levelGrid.innerHTML = "";
  levelGrid.classList.remove("hidden");

  LEVELS.forEach((lvl, i) => {
    const isUnlocked = i < savedProgress.unlockedLevel || savedProgress.clearedLevels[i];
    const isCleared = savedProgress.clearedLevels[i];
    const card = document.createElement("div");
    card.className = `lvl-card ${isCleared ? "cleared" : ""} ${i === currentLevelIdx ? "active" : ""}`;
    if (!isUnlocked) {
      card.style.opacity = "0.35";
      card.style.cursor = "not-allowed";
      card.innerHTML = `<div>🔒</div><div style="font-size:0.75rem">${lvl.world} ${i + 1}</div>`;
    } else {
      card.innerHTML = `
        <div>${isCleared ? "✓" : i + 1}</div>
        <div style="font-size:0.75rem">${lvl.world}</div>
      `;
      card.onclick = () => {
        loadLevel(i);
      };
    }
    levelGrid.appendChild(card);
  });

  btnNext.textContent = "Weiterspielen ➔";
  btnNext.onclick = () => {
    loadLevel(currentLevelIdx);
  };

  btnRetry.textContent = "Nochmal ↺";
  btnRetry.onclick = () => {
    loadLevel(currentLevelIdx);
  };

  overlay.classList.remove("hidden");
}

function updateDevilBubble(text) {
  document.getElementById("devilText").innerHTML = text;
}

function shake(amount) {
  screenShake = Math.max(screenShake, amount);
}

function flashScreen() {
  const flash = document.getElementById("glitchFlash");
  flash.style.opacity = "0.6";
  setTimeout(() => { flash.style.opacity = "0"; }, 70);
}

// --- Player Movement & Physics Loop ---
function updatePlayer() {
  if (player.dead || gameState !== "PLAYING") return;

  const grav = 0.54 * player.gravityMultiplier;
  const accel = 0.88;
  const friction = 0.78;

  // Horizontal Movement with invert
  let moveDir = 0;
  if (keys.left) moveDir -= 1;
  if (keys.right) moveDir += 1;
  if (player.invertedControls) moveDir *= -1;

  if (moveDir !== 0) {
    player.vx += moveDir * accel;
    player.facing = moveDir;
  } else {
    player.vx *= friction;
  }

  player.vx = Math.max(-player.speed, Math.min(player.speed, player.vx));

  // Coyote Time
  if (player.onGround) {
    player.coyoteTimer = 8;
  } else if (player.coyoteTimer > 0) {
    player.coyoteTimer--;
  }

  // Jump Buffering
  if (keys.jump && !keys.jumpHeld) {
    player.jumpBuffer = 6;
  } else if (player.jumpBuffer > 0) {
    player.jumpBuffer--;
  }

  // Execute Jump
  if (player.jumpBuffer > 0 && player.coyoteTimer > 0) {
    player.vy = player.jumpPower * player.gravityMultiplier;
    player.onGround = false;
    player.coyoteTimer = 0;
    player.jumpBuffer = 0;
    keys.jumpHeld = true;
    player.squashX = 0.8;
    player.squashY = 1.3;
    sounds.jump();
  }

  // Variable Jump Height
  if (!keys.jump && player.gravityMultiplier > 0 && player.vy < -4) {
    player.vy *= 0.55;
  } else if (!keys.jump && player.gravityMultiplier < 0 && player.vy > 4) {
    player.vy *= 0.55;
  }

  // Apply Gravity
  player.vy += grav;
  player.vy = Math.max(-16, Math.min(16, player.vy));

  // Move X & Check Horizontal Collisions
  player.x += player.vx;
  checkSolidCollisions(true);

  // Move Y & Check Vertical Collisions
  player.y += player.vy;
  player.onGround = false;
  checkSolidCollisions(false);

  // Squash & Stretch recovery
  player.squashX += (1 - player.squashX) * 0.18;
  player.squashY += (1 - player.squashY) * 0.18;

  // Screen Wrap Mechanic if active in level
  if (levelData && levelData.screenWrap) {
    if (player.x + player.w < 0) {
      player.x = W - 2;
    } else if (player.x > W) {
      player.x = -player.w + 2;
    }
  } else {
    // Normal Boundaries
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;
  }

  // Abyss fall
  if (player.y > H + 50 || player.y < -80) {
    killPlayer("In den Abgrund gestürzt!");
  }

  // Blinking
  player.blinkTimer++;
  if (player.blinkTimer > 150 && Math.random() < 0.05) {
    player.blinkTimer = 0;
  }

  // Spike Collisions
  if (levelData.spikes) {
    levelData.spikes.forEach(s => {
      if (!s.active) return;
      if (s.pointDown) {
        if (player.x + player.w > s.x + 3 && player.x < s.x + s.w - 3 &&
            player.y < s.y + s.h && player.y + player.h > s.y) {
          killPlayer();
        }
      } else {
        if (player.x + player.w > s.x + 3 && player.x < s.x + s.w - 3 &&
            player.y + player.h > s.y + 4 && player.y < s.y + s.h) {
          killPlayer();
        }
      }
    });
  }

  // Generous Door / Exit Collision (AABB)
  const d = levelData.door;
  if (d) {
    if (player.x + player.w > d.x + 4 && player.x < d.x + d.w - 4 &&
        player.y + player.h > d.y + 4 && player.y < d.y + d.h + 20) {
      completeLevel();
    }
  }

  if (levelData.update) levelData.update(levelData);
}

function checkSolidCollisions(horizontal) {
  if (!levelData || !levelData.platforms) return;

  for (const plat of levelData.platforms) {
    if (plat.type !== "solid" && plat.type !== "crusher") continue;

    if (player.x < plat.x + plat.w &&
        player.x + player.w > plat.x &&
        player.y < plat.y + plat.h &&
        player.y + player.h > plat.y) {

      if (horizontal) {
        if (player.vx > 0) {
          player.x = plat.x - player.w;
        } else if (player.vx < 0) {
          player.x = plat.x + plat.w;
        }
        player.vx = 0;
      } else {
        if (player.vy > 0 && player.gravityMultiplier > 0) {
          player.y = plat.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.squashX = 1.25;
          player.squashY = 0.8;
        } else if (player.vy < 0 && player.gravityMultiplier < 0) {
          player.y = plat.y + plat.h;
          player.vy = 0;
          player.onGround = true;
          player.squashX = 1.25;
          player.squashY = 0.8;
        } else if (player.vy < 0 && player.gravityMultiplier > 0) {
          player.y = plat.y + plat.h;
          player.vy = 0;
        } else if (player.vy > 0 && player.gravityMultiplier < 0) {
          player.y = plat.y - player.h;
          player.vy = 0;
        }
      }
    }
  }
}

// --- Main Render Loop ---
function draw() {
  ctx.save();

  if (screenShake > 0) {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
    screenShake *= 0.88;
    if (screenShake < 0.2) screenShake = 0;
  }

  // Original light minimalist canvas background
  ctx.fillStyle = "#f4f4f4";
  ctx.fillRect(0, 0, W, H);

  // Subtle world title watermark in background
  if (levelData) {
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
    ctx.font = "900 48px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(levelData.world.toUpperCase(), W / 2, 80);
    ctx.restore();
  }

  if (levelData && levelData.platforms) {
    levelData.platforms.forEach(p => {
      drawPlatform(p);
    });
  }

  if (levelData && levelData.spikes) {
    levelData.spikes.forEach(s => {
      if (s.active) drawSpike(s);
    });
  }

  if (levelData && levelData.door) {
    drawDoor(levelData.door);
  }

  if (!player.dead) {
    drawPlayer();
  }

  drawParticles();

  ctx.restore();

  updatePlayer();
  requestAnimationFrame(draw);
}

// Draw Solid Minimalist Black Platform
function drawPlatform(p) {
  ctx.save();
  if (p.type === "crusher") {
    ctx.fillStyle = "#181818";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    // Yellow hazard warning stripe along bottom
    ctx.fillStyle = "#ffcc00";
    for (let x = p.x; x < p.x + p.w; x += 24) {
      ctx.fillRect(x, p.y + p.h - 8, 12, 8);
    }
  } else if (p.type === "switch") {
    ctx.fillStyle = "#181818";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#ffcc00";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("▲▼", p.x + p.w/2, p.y + 11);
  } else if (p.type === "spring") {
    // Spring launch pad
    ctx.fillStyle = "#2ed573";
    ctx.fillRect(p.x, p.y + 4, p.w, p.h - 4);
    ctx.fillStyle = "#181818";
    ctx.fillRect(p.x, p.y, p.w, 4);
  } else {
    // Standard solid black platform
    ctx.fillStyle = "#181818";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }
  ctx.restore();
}

// Draw Sharp Minimalist Spikes
function drawSpike(s) {
  ctx.save();
  ctx.fillStyle = "#181818";

  const spikeWidth = 16;
  const numSpikes = Math.max(1, Math.round(s.w / spikeWidth));
  const step = s.w / numSpikes;

  for (let i = 0; i < numSpikes; i++) {
    const sx = s.x + i * step;
    ctx.beginPath();
    if (s.pointDown) {
      ctx.moveTo(sx, s.y);
      ctx.lineTo(sx + step / 2, s.y + s.h);
      ctx.lineTo(sx + step, s.y);
    } else {
      ctx.moveTo(sx, s.y + s.h);
      ctx.lineTo(sx + step / 2, s.y);
      ctx.lineTo(sx + step, s.y + s.h);
    }
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

// Draw the iconic Yellow Exit Door with black frame
function drawDoor(d) {
  ctx.save();
  ctx.translate(d.x, d.y);

  if (d.inverted) {
    ctx.translate(d.w / 2, d.h / 2);
    ctx.rotate(Math.PI);
    ctx.translate(-d.w / 2, -d.h / 2);
  }

  // Black frame
  ctx.fillStyle = "#181818";
  ctx.fillRect(0, 0, d.w, d.h);

  // Iconic Yellow interior glow
  ctx.fillStyle = "#ffcc00";
  ctx.fillRect(4, 4, d.w - 8, d.h - 8);

  // Door handle
  ctx.fillStyle = "#181818";
  ctx.beginPath();
  ctx.arc(d.w - 9, d.h / 2, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // If running door: stick legs underneath!
  if (d.running) {
    ctx.strokeStyle = "#181818";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";
    const la = d.legAngle || 0;
    ctx.beginPath();
    ctx.moveTo(8, d.h);
    ctx.lineTo(8 + Math.sin(la) * 10, d.h + 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(d.w - 8, d.h);
    ctx.lineTo(d.w - 8 - Math.sin(la) * 10, d.h + 12);
    ctx.stroke();
  }

  ctx.restore();
}

// Draw the Player: Iconic Minimalist Black Square with small white eyes
function drawPlayer() {
  ctx.save();
  const px = player.x + player.w / 2;
  const py = player.y + player.h / 2;

  ctx.translate(px, py);
  ctx.scale(player.squashX, player.squashY);

  if (player.gravityMultiplier < 0) {
    ctx.scale(1, -1);
  }

  // Solid black square body with tiny rounded corners
  ctx.fillStyle = "#181818";
  ctx.beginPath();
  ctx.roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 3);
  ctx.fill();

  // Clean white dot eyes looking in moving direction
  const eyeXOffset = player.facing === 1 ? 2 : -2;
  const eyeY = -2;

  if (player.blinkTimer === 0) {
    // Blink closed slit
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-5 + eyeXOffset, eyeY);
    ctx.lineTo(-1 + eyeXOffset, eyeY);
    ctx.moveTo(2 + eyeXOffset, eyeY);
    ctx.lineTo(6 + eyeXOffset, eyeY);
    ctx.stroke();
  } else {
    // Open white eyes
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-3.5 + eyeXOffset, eyeY, 3, 0, Math.PI * 2);
    ctx.arc(4.5 + eyeXOffset, eyeY, 3, 0, Math.PI * 2);
    ctx.fill();

    // Tiny black pupils looking in movement direction
    ctx.fillStyle = "#181818";
    const pupilShift = player.facing === 1 ? 1 : -1;
    ctx.beginPath();
    ctx.arc(-3.5 + eyeXOffset + pupilShift, eyeY, 1.4, 0, Math.PI * 2);
    ctx.arc(4.5 + eyeXOffset + pupilShift, eyeY, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.rot += p.vRot;
    p.alpha -= 0.025;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.isEye) {
      ctx.beginPath();
      ctx.arc(0, 0, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#181818";
      ctx.beginPath();
      ctx.arc(1, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    }
    ctx.restore();
  }

  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx;
    c.y += c.vy;
    c.vy += 0.18;
    c.rot += c.vRot;
    if (c.y > H + 20) {
      confetti.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size / 2);
    ctx.restore();
  }
}

// --- Keyboard & Touch Event Listeners ---
window.addEventListener("keydown", e => {
  sounds.init();
  const k = e.code;
  if (k === "KeyA" || k === "ArrowLeft") {
    keys.left = true;
    e.preventDefault();
  }
  if (k === "KeyD" || k === "ArrowRight") {
    keys.right = true;
    e.preventDefault();
  }
  if (k === "KeyW" || k === "ArrowUp" || k === "Space") {
    keys.jump = true;
    e.preventDefault();
  }
  if (k === "KeyR") {
    if (gameState === "PLAYING" && !player.dead) resetPlayer(true);
    e.preventDefault();
  }
  if (k === "Escape") {
    showLevelMenu();
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  const k = e.code;
  if (k === "KeyA" || k === "ArrowLeft") keys.left = false;
  if (k === "KeyD" || k === "ArrowRight") keys.right = false;
  if (k === "KeyW" || k === "ArrowUp" || k === "Space") {
    keys.jump = false;
    keys.jumpHeld = false;
  }
});

function bindTouch(btnId, onDown, onUp) {
  const el = document.getElementById(btnId);
  if (!el) return;
  const start = (e) => {
    e.preventDefault();
    sounds.init();
    el.classList.add("active");
    onDown();
  };
  const end = (e) => {
    e.preventDefault();
    el.classList.remove("active");
    onUp();
  };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

bindTouch("tLeft", () => { keys.left = true; }, () => { keys.left = false; });
bindTouch("tRight", () => { keys.right = true; }, () => { keys.right = false; });
bindTouch("tJump", () => { keys.jump = true; }, () => { keys.jump = false; keys.jumpHeld = false; });
bindTouch("tReset", () => { if (gameState === "PLAYING" && !player.dead) resetPlayer(true); }, () => {});

document.getElementById("btnMenu").onclick = () => {
  sounds.init();
  showLevelMenu();
};
document.getElementById("btnQuickRestart").onclick = () => {
  sounds.init();
  if (gameState === "PLAYING" && !player.dead) resetPlayer(true);
};
document.getElementById("btnSound").onclick = (e) => {
  sounds.init();
  sounds.enabled = !sounds.enabled;
  e.currentTarget.textContent = sounds.enabled ? "🔊 Sound: An" : "🔇 Sound: Aus";
};

// Start
loadLevel(0);
requestAnimationFrame(draw);
</script>
</body>
