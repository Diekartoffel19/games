<script>
/* ==========================================================================
   DOODLE JUMP CLASSIC (Authentic Recreation)
   Faithful physics, Doodler animations, springs, jetpacks, monsters & audio
   ========================================================================== */

// --- NATIVE WEB AUDIO SYNTHESIZER ---
let audioCtx = null;
let soundEnabled = true;
let jetpackAudio = null;
let propellerAudio = null;

function getAudioCtx() {
  if (window.ArcadeCore && typeof ArcadeCore.getAudioContext === 'function') {
    const ctx = ArcadeCore.getAudioContext();
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }
  }
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function isSoundActive() {
  if (window.ArcadeCore && typeof ArcadeCore.isMuted === 'function') {
    return !ArcadeCore.isMuted();
  }
  return soundEnabled;
}

function updateSoundBtnUI() {
  const active = isSoundActive();
  const btn = document.getElementById('soundBtn');
  if (btn) btn.textContent = active ? '🔊' : '🔇';
}

function initAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }
  return ctx;
}

const unlockAudio = () => {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }
};
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(evt => {
  window.addEventListener(evt, unlockAudio, { passive: true });
});

window.addEventListener('arcade_mute_changed', (e) => {
  if (e.detail && typeof e.detail.muted === 'boolean') {
    soundEnabled = !e.detail.muted;
  }
  updateSoundBtnUI();
});

function toggleAudio() {
  unlockAudio();
  if (window.ArcadeCore && typeof ArcadeCore.toggleMute === 'function') {
    const isMuted = ArcadeCore.toggleMute();
    soundEnabled = !isMuted;
  } else {
    soundEnabled = !soundEnabled;
    localStorage.setItem('doodle_sound_enabled', soundEnabled ? 'true' : 'false');
  }
  updateSoundBtnUI();
}

function startJetpackAudio() {
  if (!isSoundActive()) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  stopJetpackAudio();
  try {
    const t = ctx.currentTime;
    const bufferSize = Math.floor(ctx.sampleRate * 1.5);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.35;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(520, t);

    const rumble = ctx.createOscillator();
    rumble.type = 'sawtooth';
    rumble.frequency.setValueAtTime(85, t);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.01, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.1);

    noise.connect(filter);
    filter.connect(gain);
    rumble.connect(gain);
    gain.connect(ctx.destination);

    noise.start(t);
    rumble.start(t);

    jetpackAudio = { noise, rumble, gain };
  } catch (e) {}
}

function stopJetpackAudio() {
  if (jetpackAudio) {
    try {
      const ctx = getAudioCtx();
      const t = ctx ? ctx.currentTime : 0;
      if (jetpackAudio.gain && ctx) {
        jetpackAudio.gain.gain.linearRampToValueAtTime(0.001, t + 0.12);
      }
      const ref = jetpackAudio;
      setTimeout(() => {
        try {
          if (ref.noise) { ref.noise.stop(); ref.noise.disconnect(); }
          if (ref.rumble) { ref.rumble.stop(); ref.rumble.disconnect(); }
        } catch (e) {}
      }, 150);
    } catch (e) {}
    jetpackAudio = null;
  }
}

function startPropellerAudio() {
  if (!isSoundActive()) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  stopPropellerAudio();
  try {
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, t);

    const lfo = ctx.createOscillator();
    lfo.type = 'square';
    lfo.frequency.setValueAtTime(16, t);

    const lfoGain = ctx.createGain();
    lfoGain.gain.setValueAtTime(0.4, t);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.01, t);
    gain.gain.linearRampToValueAtTime(0.16, t + 0.08);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(t);

    propellerAudio = { osc, gain };
  } catch (e) {}
}

function stopPropellerAudio() {
  if (propellerAudio) {
    try {
      const ctx = getAudioCtx();
      const t = ctx ? ctx.currentTime : 0;
      if (propellerAudio.gain && ctx) {
        propellerAudio.gain.gain.linearRampToValueAtTime(0.001, t + 0.1);
      }
      const ref = propellerAudio;
      setTimeout(() => {
        try {
          if (ref.osc) { ref.osc.stop(); ref.osc.disconnect(); }
        } catch (e) {}
      }, 120);
    } catch (e) {}
    propellerAudio = null;
  }
}

function playDoodleSound(type) {
  if (!isSoundActive()) return;
  const ctx = getAudioCtx();
  if (!ctx) return;

  try {
    const now = ctx.currentTime;

    if (type === 'jump') {
      // Authentic cheerful cartoon springy pop
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(540, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    } else if (type === 'spring') {
      // High cartoon spring twang with wobble
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const mod = ctx.createOscillator();
      const modGain = ctx.createGain();

      mod.frequency.setValueAtTime(26, now);
      modGain.gain.setValueAtTime(100, now);
      modGain.gain.exponentialRampToValueAtTime(8, now + 0.3);
      mod.connect(osc.frequency);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(820, now + 0.09);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.32);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(ctx.destination);
      mod.start(now);
      osc.start(now);
      mod.stop(now + 0.35);
      osc.stop(now + 0.35);
    } else if (type === 'trampoline') {
      // Deep resonant trampoline boost
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.16);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.34);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    } else if (type === 'crack') {
      // Realistic brittle wood snap & crackle
      const bufferSize = Math.floor(ctx.sampleRate * 0.1);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.018));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.Q.setValueAtTime(2.2, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
    } else if (type === 'pupa') {
      // Cartoon snout pea-shooter pop
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(680, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.07);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'monster_hit') {
      // Cartoon squishy splat / pop
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(70, now + 0.12);

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900, now);
      filter.frequency.exponentialRampToValueAtTime(180, now + 0.12);

      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    } else if (type === 'fall') {
      // Iconic cartoon slide-whistle down
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.65);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.setValueAtTime(0.22, now + 0.55);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.7);

      // Cartoon ground impact thud
      setTimeout(() => {
        if (!isSoundActive()) return;
        try {
          const t = ctx.currentTime;
          const thud = ctx.createOscillator();
          const thudGain = ctx.createGain();
          thud.type = 'triangle';
          thud.frequency.setValueAtTime(110, t);
          thud.frequency.exponentialRampToValueAtTime(35, t + 0.12);
          thudGain.gain.setValueAtTime(0.28, t);
          thudGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          thud.connect(thudGain);
          thudGain.connect(ctx.destination);
          thud.start(t);
          thud.stop(t + 0.14);
        } catch (e) {}
      }, 620);
    } else if (type === 'powerup') {
      // Ascending item pickup arpeggio
      [392, 523.25, 659.25].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        const startT = now + i * 0.06;
        osc.frequency.setValueAtTime(f, startT);
        gain.gain.setValueAtTime(0.16, startT);
        gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startT);
        osc.stop(startT + 0.12);
      });
    } else if (type === 'highscore') {
      // Celebratory high score milestone chime
      [880, 1174.66, 1760].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const startT = now + i * 0.08;
        osc.frequency.setValueAtTime(f, startT);
        gain.gain.setValueAtTime(0.18, startT);
        gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.24);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startT);
        osc.stop(startT + 0.24);
      });
    } else if (type === 'jetpack') {
      startJetpackAudio();
    } else if (type === 'propeller') {
      startPropellerAudio();
    }
  } catch (e) {}
}

// --- GAME LOGIC & ENGINE ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let isRunning = false;
let animId = null;
let score = 0;
let highScore = parseInt(localStorage.getItem('doodlejump_highscore') || '0', 10);

// Doodler Character
const doodler = {
  x: 200,
  y: 450,
  w: 52,
  h: 52,
  vx: 0,
  vy: 0,
  dir: 1, // 1: right, -1: left
  shooting: false,
  shootTimer: 0,
  powerup: null, // 'spring', 'trampoline', 'propeller', 'jetpack'
  powerupTimer: 0,
  springShoes: 0, // 5 super bounces
  shield: false   // absorbs 1 hit
};

// World objects
let platforms = [];
let items = [];
let monsters = [];
let bullets = [];
let particles = [];

// Highscore line marker on notebook
let prevHighScoreY = null;
let passedHighScoreInRun = false;

function startNewGame() {
  unlockAudio();
  stopJetpackAudio();
  stopPropellerAudio();
  passedHighScoreInRun = false;
  if (animId) cancelAnimationFrame(animId);
  score = 0;
  platforms = [];
  items = [];
  monsters = [];
  bullets = [];
  particles = [];

  doodler.x = 184;
  doodler.y = 480;
  doodler.vx = 0;
  doodler.vy = -10.5;
  doodler.dir = 1;
  doodler.shooting = false;
  doodler.shootTimer = 0;
  doodler.powerup = null;
  doodler.powerupTimer = 0;
  doodler.springShoes = 0;
  doodler.shield = false;

  // Starting base platform directly under Doodler
  platforms.push({
    x: 170,
    y: 560,
    w: 75,
    h: 16,
    type: 'green',
    vx: 0,
    broken: false
  });

  // Generate initial staircase of platforms
  let currentY = 500;
  while (currentY > -100) {
    currentY -= 52 + Math.random() * 26;
    spawnPlatformAt(currentY);
  }

  document.getElementById('scoreDisplay').textContent = `0`;
  document.getElementById('gameOverModal').style.display = 'none';
  isRunning = true;
  animId = requestAnimationFrame(gameLoop);
}

function spawnPlatformAt(y) {
  const w = 72;
  const h = 16;
  const x = 20 + Math.random() * (canvas.width - w - 40);

  // Platform Types:
  // green: static solid
  // blue: horizontally moving
  // brown: cracking and falling
  // white: vanishes on bounce
  let type = 'green';
  const r = Math.random();
  if (r < 0.22) type = 'blue';
  else if (r < 0.35) type = 'brown';
  else if (r < 0.42) type = 'white';

  const plat = {
    x: x,
    y: y,
    w: w,
    h: h,
    type: type,
    vx: type === 'blue' ? (1.4 + Math.random() * 1.4) * (Math.random() < 0.5 ? 1 : -1) : 0,
    broken: false,
    fallVy: 0
  };
  platforms.push(plat);

  // Spawn Items on platforms (Springs, Trampolines, Propeller Hat, Jetpack, Spring Shoes, Shield)
  if (type === 'green' || type === 'blue') {
    const itemRoll = Math.random();
    if (itemRoll < 0.08) {
      // Spring
      items.push({ type: 'spring', x: plat.x + plat.w / 2 - 8, y: plat.y - 14, plat: plat });
    } else if (itemRoll < 0.12) {
      // Trampoline
      items.push({ type: 'trampoline', x: plat.x + plat.w / 2 - 16, y: plat.y - 12, plat: plat });
    } else if (itemRoll < 0.15) {
      // Propeller Hat
      items.push({ type: 'propeller', x: plat.x + plat.w / 2 - 14, y: plat.y - 18, plat: plat, active: false });
    } else if (itemRoll < 0.18) {
      // Jetpack
      items.push({ type: 'jetpack', x: plat.x + plat.w / 2 - 12, y: plat.y - 28, plat: plat, active: false });
    } else if (itemRoll < 0.22) {
      // Spring Shoes (5 jumps)
      items.push({ type: 'spring_shoes', x: plat.x + plat.w / 2 - 14, y: plat.y - 16, plat: plat });
    } else if (itemRoll < 0.25) {
      // Energy Shield
      items.push({ type: 'shield', x: plat.x + plat.w / 2 - 14, y: plat.y - 18, plat: plat });
    }
  }

  // Spawn Monsters / Black Hole / UFO occasionally (higher up)
  if (score > 1500 && Math.random() < 0.09 && type === 'green') {
    const isUfo = score > 3500 && Math.random() < 0.35;
    monsters.push({
      x: x + 15,
      y: y - 60,
      w: isUfo ? 54 : 48,
      h: isUfo ? 32 : 40,
      type: isUfo ? 'ufo' : (Math.random() < 0.25 ? 'blackhole' : 'monster'),
      vx: (Math.random() < 0.5 ? 1 : -1) * (isUfo ? 1.5 : 1.1),
      alive: true
    });
  }
}

function gameOver() {
  if (!isRunning) return;
  isRunning = false;
  stopJetpackAudio();
  stopPropellerAudio();
  playDoodleSound('fall');

  const finalInt = Math.floor(score);
  if (finalInt > highScore) {
    highScore = finalInt;
    localStorage.setItem('doodlejump_highscore', highScore.toString());
    if (window.ArcadeCore) ArcadeCore.saveScore('doodlejump', highScore);
  }

  document.getElementById('finalScore').textContent = finalInt;
  document.getElementById('finalHighScore').textContent = Math.floor(highScore);
  document.getElementById('gameOverModal').style.display = 'flex';
}

function shootPellet(targetX, targetY) {
  if (!isRunning) return;
  doodler.shooting = true;
  doodler.shootTimer = 14;

  let vx = 0, vy = -15;
  if (targetX !== undefined && targetY !== undefined) {
    const dx = targetX - (doodler.x + doodler.w / 2);
    const dy = targetY - doodler.y;
    const dist = Math.hypot(dx, dy) || 1;
    vx = (dx / dist) * 16;
    vy = (dy / dist) * 16;
  }

  bullets.push({
    x: doodler.x + doodler.w / 2,
    y: doodler.y - 2,
    vx: vx,
    vy: vy
  });

  playDoodleSound('pupa');
}

// --- CONTROLS ---
const keys = { left: false, right: false };

window.addEventListener('keydown', (e) => {
  unlockAudio();
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) {
    e.preventDefault();
    shootPellet();
  }
});

window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
});

// Tap on canvas to shoot in that direction
canvas.addEventListener('pointerdown', (e) => {
  unlockAudio();
  if (!isRunning) return;
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
  const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
  shootPellet(clickX, clickY);
});

// Touch buttons
const btnL = document.getElementById('btnLeft');
const btnR = document.getElementById('btnRight');
const btnS = document.getElementById('btnShoot');

btnL.addEventListener('pointerdown', () => { unlockAudio(); keys.left = true; });
btnL.addEventListener('pointerup', () => keys.left = false);
btnL.addEventListener('pointerleave', () => keys.left = false);
btnL.addEventListener('pointercancel', () => keys.left = false);

btnR.addEventListener('pointerdown', () => { unlockAudio(); keys.right = true; });
btnR.addEventListener('pointerup', () => keys.right = false);
btnR.addEventListener('pointerleave', () => keys.right = false);
btnR.addEventListener('pointercancel', () => keys.right = false);

btnS.addEventListener('pointerdown', () => { unlockAudio(); shootPellet(); });

// --- MAIN LOOP ---
// --- MAIN LOOP WITH DELTA-TIME ACCUMULATOR ---
let lastFrameTime = performance.now();
let timeAccumulator = 0;
const STEP_MS = 1000 / 60;

function physicsStep() {
  // 1. Horizontal Motion & Acceleration
  if (keys.left) {
    doodler.vx -= 0.9;
    doodler.dir = -1;
  }
  if (keys.right) {
    doodler.vx += 0.9;
    doodler.dir = 1;
  }
  doodler.vx *= 0.88; // inertia friction
  doodler.x += doodler.vx;

  // Screen Wrap-Around (Authentic Doodle Jump)
  if (doodler.x < -doodler.w) doodler.x = canvas.width;
  if (doodler.x > canvas.width) doodler.x = -doodler.w;

  // Shoot Timer
  if (doodler.shooting) {
    doodler.shootTimer--;
    if (doodler.shootTimer <= 0) doodler.shooting = false;
  }

  // 2. Vertical Motion / Powerup physics
  if (doodler.powerup === 'jetpack') {
    doodler.vy = -14;
    doodler.powerupTimer--;

    // Smoke & flame particles
    particles.push({
      x: doodler.x + doodler.w / 2,
      y: doodler.y + doodler.h + 4,
      vx: (Math.random() - 0.5) * 3,
      vy: 4 + Math.random() * 4,
      r: 4 + Math.random() * 5,
      alpha: 1,
      color: Math.random() < 0.5 ? '#f97316' : '#facc15'
    });

    if (doodler.powerupTimer <= 0) {
      doodler.powerup = null;
      stopJetpackAudio();
    }
  } else if (doodler.powerup === 'propeller') {
    doodler.vy = -9.5;
    doodler.powerupTimer--;
    if (doodler.powerupTimer <= 0) {
      doodler.powerup = null;
      stopPropellerAudio();
    }
  } else {
    // Biome Gravity (Reduced in Space Biome 8,000 - 15,000)
    const inSpace = score >= 8000 && score < 15000;
    doodler.vy += inSpace ? 0.22 : 0.38;
  }
  doodler.y += doodler.vy;

  // UFO Tractor Beam Interaction
  monsters.forEach(m => {
    if (m.type === 'ufo' && m.alive) {
      if (doodler.y > m.y + m.h && doodler.y < m.y + 240 &&
          doodler.x + doodler.w > m.x - 20 && doodler.x < m.x + m.w + 20) {
        doodler.vy = -4.0; // Sucked upward by beam!
        doodler.vx *= 0.85;
      }
    }
  });

  // 3. Camera Scroll (When Doodler reaches top 45% of screen)
  if (doodler.y < 320) {
    const diff = 320 - doodler.y;
    doodler.y = 320;
    score += diff * 0.8;
    document.getElementById('scoreDisplay').textContent = Math.floor(score);

    if (highScore > 0 && !passedHighScoreInRun && score >= highScore) {
      passedHighScoreInRun = true;
      playDoodleSound('highscore');
    }

    // Scroll world down
    platforms.forEach(p => p.y += diff);
    items.forEach(it => it.y += diff);
    monsters.forEach(m => m.y += diff);

    // Spawn new platforms above
    let highestY = Math.min(...platforms.map(p => p.y));
    while (highestY > -60) {
      highestY -= 50 + Math.random() * 26;
      spawnPlatformAt(highestY);
    }
  }

  // 4. Update Platforms (Blue horizontal movement, Brown falling)
  platforms.forEach(p => {
    if (p.type === 'blue') {
      p.x += p.vx;
      if (p.x < 15 || p.x + p.w > canvas.width - 15) p.vx *= -1;
    } else if (p.broken) {
      p.fallVy += 0.5;
      p.y += p.fallVy;
    }
  });

  // 5. Landing / Bounce Collisions (ONLY when falling downwards!)
  if (doodler.vy > 0 && !doodler.powerup) {
    platforms.forEach(p => {
      if (!p.broken &&
          doodler.x + doodler.w - 12 > p.x &&
          doodler.x + 12 < p.x + p.w &&
          doodler.y + doodler.h >= p.y &&
          doodler.y + doodler.h <= p.y + 16) {
        
        if (p.type === 'brown') {
          p.broken = true;
          playDoodleSound('crack');
        } else if (p.type === 'white') {
          p.broken = true;
          if (doodler.springShoes > 0) {
            doodler.vy = -16.5;
            doodler.springShoes--;
            playDoodleSound('spring');
          } else {
            doodler.vy = -11;
            playDoodleSound('jump');
          }
        } else {
          if (doodler.springShoes > 0) {
            doodler.vy = -16.5;
            doodler.springShoes--;
            playDoodleSound('spring');
          } else {
            doodler.vy = -11; // Standard Jump Bounce
            playDoodleSound('jump');
          }
        }
      }
    });
  }

  // 6. Check Item Pickups (Spring, Trampoline, Propeller, Jetpack, Spring Shoes, Shield)
  items.forEach(it => {
    if (it.plat) {
      if (it.type === 'spring') it.x = it.plat.x + it.plat.w / 2 - 8;
      else if (it.type === 'trampoline') it.x = it.plat.x + it.plat.w / 2 - 16;
      else if (it.type === 'propeller') it.x = it.plat.x + it.plat.w / 2 - 14;
      else if (it.type === 'jetpack') it.x = it.plat.x + it.plat.w / 2 - 12;
      else if (it.type === 'spring_shoes') it.x = it.plat.x + it.plat.w / 2 - 14;
      else if (it.type === 'shield') it.x = it.plat.x + it.plat.w / 2 - 14;

      it.y = it.plat.y - (it.type === 'jetpack' ? 28 : (it.type === 'propeller' ? 18 : 14));
    }

    if (!it.used &&
        doodler.x + doodler.w > it.x &&
        doodler.x < it.x + 30) {
      const feetHit = doodler.y + doodler.h >= it.y && doodler.y + doodler.h <= it.y + 25;
      const bodyHit = doodler.y + doodler.h >= it.y && doodler.y <= it.y + 28;
      if (it.type === 'spring' && doodler.vy > 0 && feetHit) {
        doodler.vy = -17; // Spring boost
        it.used = true;
        playDoodleSound('spring');
      } else if (it.type === 'trampoline' && doodler.vy > 0 && feetHit) {
        doodler.vy = -21; // Trampoline mega bounce
        it.used = true;
        playDoodleSound('trampoline');
      } else if (it.type === 'propeller' && !doodler.powerup && bodyHit) {
        doodler.powerup = 'propeller';
        doodler.powerupTimer = 160;
        it.used = true;
        playDoodleSound('powerup');
        startPropellerAudio();
      } else if (it.type === 'jetpack' && !doodler.powerup && bodyHit) {
        doodler.powerup = 'jetpack';
        doodler.powerupTimer = 220;
        it.used = true;
        playDoodleSound('powerup');
        startJetpackAudio();
      } else if (it.type === 'spring_shoes' && doodler.vy > 0 && feetHit) {
        doodler.springShoes = 5;
        doodler.vy = -16.5;
        it.used = true;
        playDoodleSound('powerup');
        playDoodleSound('spring');
      } else if (it.type === 'shield' && bodyHit) {
        doodler.shield = true;
        it.used = true;
        playDoodleSound('powerup');
      }
    }
  });

  // 7. Update Bullets & Monster Collisions
  for (let b = bullets.length - 1; b >= 0; b--) {
    const bul = bullets[b];
    bul.x += bul.vx || 0;
    bul.y += bul.vy;

    for (let m = monsters.length - 1; m >= 0; m--) {
      const mon = monsters[m];
      if (mon.alive &&
          bul.x > mon.x && bul.x < mon.x + mon.w &&
          bul.y > mon.y && bul.y < mon.y + mon.h) {
        mon.alive = false;
        bullets.splice(b, 1);
        playDoodleSound('monster_hit');
        break;
      }
    }

    if (bul.y < -30 || bul.y > canvas.height + 30 || bul.x < -30 || bul.x > canvas.width + 30) {
      bullets.splice(b, 1);
    }
  }

  // 8. Update Monsters & Player Collisions
  monsters.forEach(m => {
    if (!m.alive) {
      m.y += 10; // fall down dead
      return;
    }

    if (m.type === 'monster' || m.type === 'ufo') {
      m.x += m.vx;
      if (m.x < 15 || m.x + m.w > canvas.width - 15) m.vx *= -1;
    }

    // Collision with Doodler
    if (doodler.x + doodler.w - 10 > m.x &&
        doodler.x + 10 < m.x + m.w &&
        doodler.y + doodler.h - 8 > m.y &&
        doodler.y + 10 < m.y + m.h) {
      
      // Stomp on Monster Head if falling!
      if (doodler.vy > 0 && doodler.y + doodler.h < m.y + 25 && m.type !== 'blackhole') {
        m.alive = false;
        doodler.vy = -12;
        playDoodleSound('monster_hit');
      } else if (doodler.shield) {
        // Shield absorbs fatal contact!
        doodler.shield = false;
        m.alive = false;
        doodler.vy = -11;
        playDoodleSound('monster_hit');
        for (let i = 0; i < 20; i++) {
          particles.push({
            x: doodler.x + doodler.w / 2,
            y: doodler.y + doodler.h / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            r: 3 + Math.random() * 4,
            alpha: 1,
            color: '#38bdf8'
          });
        }
      } else if (!doodler.powerup) {
        gameOver();
        return;
      }
    }
  });

  // 9. Particles Update
  for (let p = particles.length - 1; p >= 0; p--) {
    const pt = particles[p];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.alpha -= 0.035;
    if (pt.alpha <= 0) particles.splice(p, 1);
  }

  // 10. Clean off-screen objects
  platforms = platforms.filter(p => p.y < canvas.height + 60);
  items = items.filter(it => it.y < canvas.height + 60 && !it.used);
  monsters = monsters.filter(m => m.y < canvas.height + 60);

  // Fall off bottom screen: Game Over!
  if (doodler.y > canvas.height + 40) {
    gameOver();
    return;
  }
}

function gameLoop(now = performance.now()) {
  if (!isRunning) return;
  const dt = Math.min(100, now - lastFrameTime);
  lastFrameTime = now;
  timeAccumulator += dt;

  while (timeAccumulator >= STEP_MS) {
    timeAccumulator -= STEP_MS;
    physicsStep();
    if (!isRunning) return;
  }

  render();
  animId = requestAnimationFrame(gameLoop);
}

// --- RENDER PASS (Authentic Doodle Art + Dynamic Biomes) ---
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // --- Dynamic Biome Backgrounds ---
  if (score >= 15000) {
    // Cyber Neon Biome
    ctx.fillStyle = 'rgba(24, 9, 44, 0.92)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(236, 72, 153, 0.2)';
    ctx.lineWidth = 1;
    const gridOffset = (score * 0.5) % 40;
    for (let y = gridOffset; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('CYBER BIOME (15k+)', 16, 26);
  } else if (score >= 8000) {
    // Space Biome (Low Gravity)
    ctx.fillStyle = 'rgba(10, 15, 30, 0.93)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Draw twinkling stars
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 35; i++) {
      const sx = ((i * 123 + 45) % canvas.width);
      const sy = ((i * 789 + (score * 0.3)) % canvas.height);
      const sr = (i % 3 === 0) ? 2 : 1;
      ctx.globalAlpha = 0.4 + 0.6 * Math.sin((Date.now() / 300) + i);
      ctx.fillRect(sx, sy, sr, sr);
    }
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('SPACE BIOME (LOW GRAV)', 16, 26);
  } else if (score >= 3000) {
    // Jungle Biome
    ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#15803d';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('JUNGLE BIOME', 16, 26);
  }

  // Draw Highscore Line Marker if visible
  if (highScore > 0) {
    const hsY = 320 - ((highScore - score) * 1.25);
    if (hsY > 0 && hsY < canvas.height) {
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(50, hsY);
      ctx.lineTo(canvas.width - 20, hsY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 12px "Comic Sans MS", cursive';
      ctx.fillText(`Top: ${Math.floor(highScore)}`, canvas.width - 80, hsY - 4);
    }
  }

  // 1. Draw Platforms
  platforms.forEach(p => {
    if (p.type === 'green') {
      // Solid Green Platform with highlights
      ctx.fillStyle = '#58a825';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 8);
      ctx.fill();
      ctx.strokeStyle = '#365314';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Shading highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillRect(p.x + 6, p.y + 2, p.w - 12, 3);
    } else if (p.type === 'blue') {
      // Moving Blue Platform
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 8);
      ctx.fill();
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fillRect(p.x + 6, p.y + 2, p.w - 12, 3);
    } else if (p.type === 'brown') {
      // Cracking Brown Platform
      ctx.fillStyle = '#b45309';
      if (p.broken) {
        // Snapped in half
        ctx.fillRect(p.x, p.y, p.w / 2 - 2, p.h);
        ctx.fillRect(p.x + p.w / 2 + 2, p.y + 6, p.w / 2 - 2, p.h);
      } else {
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Crack line
        ctx.strokeStyle = '#451a03';
        ctx.beginPath();
        ctx.moveTo(p.x + p.w / 2, p.y);
        ctx.lineTo(p.x + p.w / 2 - 4, p.y + p.h / 2);
        ctx.lineTo(p.x + p.w / 2 + 2, p.y + p.h);
        ctx.stroke();
      }
    } else if (p.type === 'white') {
      // Cloud Vanishing Platform
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 8);
      ctx.fill();
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  });

  // 2. Draw Items (Springs, Trampolines, Propeller Hat, Jetpack, Spring Shoes, Shield)
  items.forEach(it => {
    if (it.used) return;

    if (it.type === 'spring') {
      // Coiled metallic spring
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(it.x + 2, it.y + 12);
      ctx.lineTo(it.x + 14, it.y + 8);
      ctx.lineTo(it.x + 2, it.y + 4);
      ctx.lineTo(it.x + 14, it.y);
      ctx.stroke();
    } else if (it.type === 'trampoline') {
      // Trampoline with legs
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.roundRect(it.x, it.y + 2, 32, 6, 3);
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(it.x + 4, it.y + 8); ctx.lineTo(it.x + 2, it.y + 14);
      ctx.moveTo(it.x + 28, it.y + 8); ctx.lineTo(it.x + 30, it.y + 14);
      ctx.stroke();
    } else if (it.type === 'propeller') {
      // Propeller Hat
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(it.x + 14, it.y + 12, 12, Math.PI, 0);
      ctx.fill();
      // Yellow spinning blade
      ctx.fillStyle = '#eab308';
      ctx.fillRect(it.x + 2, it.y - 2, 24, 4);
    } else if (it.type === 'jetpack') {
      // Metallic Rocket Jetpack
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.roundRect(it.x, it.y, 24, 26, 4);
      ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(it.x + 4, it.y + 22, 6, 4);
      ctx.fillRect(it.x + 14, it.y + 22, 6, 4);
    } else if (it.type === 'spring_shoes') {
      // Spring Shoes
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.roundRect(it.x + 2, it.y + 2, 11, 8, 2);
      ctx.roundRect(it.x + 15, it.y + 2, 11, 8, 2);
      ctx.fill();
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(it.x + 7, it.y + 10); ctx.lineTo(it.x + 7, it.y + 15);
      ctx.moveTo(it.x + 20, it.y + 10); ctx.lineTo(it.x + 20, it.y + 15);
      ctx.stroke();
    } else if (it.type === 'shield') {
      // Energy Shield Orb
      ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.beginPath();
      ctx.arc(it.x + 12, it.y + 10, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px sans-serif';
      ctx.fillText('🛡️', it.x + 6, it.y + 14);
    }
  });

  // 3. Draw Monsters & Black Holes & UFOs
  monsters.forEach(m => {
    if (!m.alive) return;
    if (m.type === 'blackhole') {
      // Swirling Black Hole Vortex
      ctx.save();
      ctx.translate(m.x + m.w / 2, m.y + m.h / 2);
      ctx.rotate(Date.now() / 150);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 25, 0, 1.4 * Math.PI);
      ctx.stroke();
      ctx.restore();
    } else if (m.type === 'ufo') {
      // UFO Saucer with Tractor Beam
      // Tractor beam cone
      const beamGrad = ctx.createLinearGradient(0, m.y + m.h, 0, m.y + 240);
      const pulse = 0.15 + 0.1 * Math.sin(Date.now() / 150);
      beamGrad.addColorStop(0, `rgba(56, 189, 248, ${pulse * 2})`);
      beamGrad.addColorStop(1, 'rgba(56, 189, 248, 0.0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(m.x + 10, m.y + m.h);
      ctx.lineTo(m.x + m.w - 10, m.y + m.h);
      ctx.lineTo(m.x + m.w + 40, m.y + 240);
      ctx.lineTo(m.x - 40, m.y + 240);
      ctx.closePath();
      ctx.fill();

      // Saucer Body
      ctx.fillStyle = '#64748b';
      ctx.beginPath();
      ctx.ellipse(m.x + m.w / 2, m.y + 18, m.w / 2, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Cockpit Dome
      ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
      ctx.beginPath();
      ctx.arc(m.x + m.w / 2, m.y + 14, 12, Math.PI, 0);
      ctx.fill();
      ctx.stroke();

      // Flashing Lights
      for (let i = 0; i < 4; i++) {
        const lx = m.x + 10 + i * 11;
        ctx.fillStyle = ((Date.now() / 200 + i) % 2 > 1) ? '#eab308' : '#ef4444';
        ctx.beginPath();
        ctx.arc(lx, m.y + 20, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // Authentic Purple/Blue Monster with Horns & Big Teeth
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.roundRect(m.x, m.y, m.w, m.h, 12);
      ctx.fill();
      ctx.strokeStyle = '#6b21a8';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Big Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(m.x + m.w / 2, m.y + 15, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(m.x + m.w / 2 + Math.sin(Date.now() / 200) * 3, m.y + 15, 4, 0, Math.PI * 2);
      ctx.fill();

      // Sharp Teeth
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(m.x + 12, m.y + 28); ctx.lineTo(m.x + 18, m.y + 35); ctx.lineTo(m.x + 24, m.y + 28);
      ctx.lineTo(m.x + 30, m.y + 35); ctx.lineTo(m.x + 36, m.y + 28);
      ctx.fill();
    }
  });

  // 4. Draw Bullets (Yellow pellets)
  ctx.fillStyle = '#facc15';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ca8a04';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // 5. Draw Particles
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.alpha;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  // 6. DRAW THE DOODLER! (Iconic 4-Legged Creature)
  drawDoodler(doodler.x, doodler.y, doodler.dir, doodler.shooting, doodler.powerup);
}

function drawDoodler(x, y, dir, shooting, powerup) {
  ctx.save();

  // Active Shield Aura
  if (doodler.shield) {
    ctx.save();
    const pulse = 24 + Math.sin(Date.now() / 150) * 3;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
    ctx.beginPath();
    ctx.arc(x + 26, y + 26, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // If shooting, trunk points straight up!
  const isShooting = shooting;

  // 1. Legs (4 little cute stubby feet at the bottom)
  ctx.fillStyle = '#6e9a28';
  const legOffset = Math.sin(Date.now() / 80) * 2;
  ctx.fillRect(x + 10, y + 44, 6, 8 + (doodler.vy > 0 ? 2 : -1));
  ctx.fillRect(x + 18, y + 44, 6, 8 + legOffset);
  ctx.fillRect(x + 28, y + 44, 6, 8 - legOffset);
  ctx.fillRect(x + 36, y + 44, 6, 8 + (doodler.vy > 0 ? 2 : -1));

  // Spring Shoes on feet
  if (doodler.springShoes > 0) {
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(x + 8, y + 49, 18, 5);
    ctx.fillRect(x + 26, y + 49, 18, 5);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 17, y + 54); ctx.lineTo(x + 17, y + 59);
    ctx.moveTo(x + 35, y + 54); ctx.lineTo(x + 35, y + 59);
    ctx.stroke();

    // Remaining jumps badge
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(x + 48, y + 10, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText(`${doodler.springShoes}`, x + 45, y + 13);
  }

  // 2. Main Body (Bright yellow-green oval)
  ctx.fillStyle = '#90c738';
  ctx.beginPath();
  ctx.ellipse(x + 26, y + 26, 22, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#5d8a1c';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 3. Iconic Snout / Trunk (Cannon Nozzle)
  if (isShooting) {
    // Pointing straight up!
    ctx.fillStyle = '#90c738';
    ctx.beginPath();
    ctx.roundRect(x + 20, y - 8, 12, 18, 4);
    ctx.fill();
    ctx.strokeStyle = '#5d8a1c';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Nozzle opening
    ctx.fillStyle = '#14532d';
    ctx.beginPath();
    ctx.ellipse(x + 26, y - 8, 6, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Pointing horizontally left or right
    ctx.fillStyle = '#90c738';
    ctx.beginPath();
    if (dir === 1) {
      ctx.roundRect(x + 38, y + 20, 16, 12, 5);
    } else {
      ctx.roundRect(x - 2, y + 20, 16, 12, 5);
    }
    ctx.fill();
    ctx.strokeStyle = '#5d8a1c';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 4. Eyes (Two cute expressive black dots)
  ctx.fillStyle = '#000000';
  const eyeX1 = dir === 1 ? x + 28 : x + 16;
  const eyeX2 = dir === 1 ? x + 38 : x + 26;
  const eyeY = isShooting ? y + 14 : y + 18;

  ctx.beginPath();
  ctx.arc(eyeX1, eyeY, 3, 0, Math.PI * 2);
  ctx.arc(eyeX2, eyeY, 3, 0, Math.PI * 2);
  ctx.fill();

  // 5. Active Power-up equipment on Doodler
  if (powerup === 'propeller') {
    // Propeller cap on head
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(x + 26, y + 8, 10, Math.PI, 0);
    ctx.fill();
    // Spinning blade
    ctx.fillStyle = '#facc15';
    const bladeW = Math.sin(Date.now() / 25) * 20;
    ctx.fillRect(x + 26 - bladeW / 2, y - 2, bladeW, 4);
  } else if (powerup === 'jetpack') {
    // Rocket jetpack strapped to back
    ctx.fillStyle = '#94a3b8';
    const jpX = dir === 1 ? x + 2 : x + 34;
    ctx.beginPath();
    ctx.roundRect(jpX, y + 14, 16, 26, 4);
    ctx.fill();
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();
}

// Start game automatically on load
window.addEventListener('DOMContentLoaded', () => {
  startNewGame();
});
</script>
