  <script>
    /* ==========================================================================
       DETERMINISTIC PRNG (FNV-1a Hash + Mulberry32)
       ========================================================================== */
    function hashString(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 16777619);
      }
      return h >>> 0;
    }

    function createPRNG(seedNum) {
      let s = seedNum >>> 0;
      return function() {
        let t = (s += 0x6D2B79F5) >>> 0;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const WORDS = [
      "atlas", "canyon", "dune", "delta", "ember", "fjord", "granite",
      "haven", "iron", "jungle", "mesa", "orbit", "peak", "ridge",
      "stone", "tundra", "vale", "zenith", "timber", "summit"
    ];

    function getRandomSeed() {
      const w = WORDS[Math.floor(Math.random() * WORDS.length)];
      const num = Math.floor(Math.random() * 899) + 100;
      return `${w}-${num}`;
    }

    /* ==========================================================================
       AUDIO SYNTHESIZER (Clean subtle clicks)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioCls = window.AudioContext || window.webkitAudioContext;
        if (AudioCls) audioCtx = new AudioCls();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'step') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        } else if (type === 'bump') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(90, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'key') {
          [520, 650, 780].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.06);
            gain.gain.setValueAtTime(0.08, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.16);
          });
        } else if (type === 'botwin') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'win') {
          const freqs = [330, 440, 550, 660];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0.08, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.32);
          });
        }
      } catch (e) {}
    }

    /* ==========================================================================
       MAZE GENERATION (Backtracker, Prim's, Kruskal's, Braided) & SOLVER
       ========================================================================== */
    class Maze {
      constructor(cols, rows, rng, algo = 'backtracker') {
        this.cols = cols;
        this.rows = rows;
        this.rng = rng;
        this.algo = algo;
        this.cells = Array.from({ length: rows }, () =>
          Array.from({ length: cols }, () => ({
            top: true, right: true, bottom: true, left: true, visited: false
          }))
        );
        this.keys = [];
        this.gates = [];

        this.generate(algo);
        this.solution = this.solveBFS(0, 0, cols - 1, rows - 1);
        this.setupKeysAndGates();
      }

      generate(algo) {
        if (algo === 'prim') {
          this.generatePrim();
        } else if (algo === 'kruskal') {
          this.generateKruskal();
        } else if (algo === 'braided') {
          this.generateBacktracker();
          this.braid(0.38);
        } else {
          this.generateBacktracker();
        }
      }

      generateBacktracker() {
        const stack = [{ x: 0, y: 0 }];
        this.cells[0][0].visited = true;

        const dirs = [
          { dx: 0, dy: -1, wall: 'top', opp: 'bottom' },
          { dx: 1, dy: 0, wall: 'right', opp: 'left' },
          { dx: 0, dy: 1, wall: 'bottom', opp: 'top' },
          { dx: -1, dy: 0, wall: 'left', opp: 'right' }
        ];

        while (stack.length > 0) {
          const curr = stack[stack.length - 1];
          const unvisited = [];

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows) {
              if (!this.cells[ny][nx].visited) {
                unvisited.push({ x: nx, y: ny, dir: d });
              }
            }
          }

          if (unvisited.length > 0) {
            const pick = Math.floor(this.rng() * unvisited.length);
            const chosen = unvisited[pick];
            this.cells[curr.y][curr.x][chosen.dir.wall] = false;
            this.cells[chosen.y][chosen.x][chosen.dir.opp] = false;
            this.cells[chosen.y][chosen.x].visited = true;
            stack.push({ x: chosen.x, y: chosen.y });
          } else {
            stack.pop();
          }
        }
      }

      generatePrim() {
        const inMaze = Array.from({ length: this.rows }, () => Array(this.cols).fill(false));
        inMaze[0][0] = true;
        this.cells[0][0].visited = true;

        const walls = [];
        const addWalls = (x, y) => {
          const dirs = [
            { dx: 0, dy: -1, w1: 'top', w2: 'bottom' },
            { dx: 1, dy: 0, w1: 'right', w2: 'left' },
            { dx: 0, dy: 1, w1: 'bottom', w2: 'top' },
            { dx: -1, dy: 0, w1: 'left', w2: 'right' }
          ];
          for (const d of dirs) {
            const nx = x + d.dx, ny = y + d.dy;
            if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows && !inMaze[ny][nx]) {
              walls.push({ x1: x, y1: y, x2: nx, y2: ny, w1: d.w1, w2: d.w2 });
            }
          }
        };

        addWalls(0, 0);

        while (walls.length > 0) {
          const idx = Math.floor(this.rng() * walls.length);
          const w = walls.splice(idx, 1)[0];
          if (!inMaze[w.y2][w.x2]) {
            this.cells[w.y1][w.x1][w.w1] = false;
            this.cells[w.y2][w.x2][w.w2] = false;
            inMaze[w.y2][w.x2] = true;
            this.cells[w.y2][w.x2].visited = true;
            addWalls(w.x2, w.y2);
          }
        }
      }

      generateKruskal() {
        const parent = Array.from({ length: this.rows * this.cols }, (_, i) => i);
        const find = (i) => {
          let root = i;
          while (root !== parent[root]) root = parent[root];
          let curr = i;
          while (curr !== root) {
            const next = parent[curr];
            parent[curr] = root;
            curr = next;
          }
          return root;
        };
        const union = (i, j) => {
          const ri = find(i);
          const rj = find(j);
          if (ri !== rj) {
            parent[ri] = rj;
            return true;
          }
          return false;
        };

        const edges = [];
        for (let y = 0; y < this.rows; y++) {
          for (let x = 0; x < this.cols; x++) {
            const id = y * this.cols + x;
            if (x < this.cols - 1) {
              edges.push({ u: id, v: id + 1, x1: x, y1: y, x2: x + 1, y2: y, w1: 'right', w2: 'left' });
            }
            if (y < this.rows - 1) {
              edges.push({ u: id, v: id + this.cols, x1: x, y1: y, x2: x, y2: y + 1, w1: 'bottom', w2: 'top' });
            }
          }
        }

        for (let i = edges.length - 1; i > 0; i--) {
          const j = Math.floor(this.rng() * (i + 1));
          const tmp = edges[i];
          edges[i] = edges[j];
          edges[j] = tmp;
        }

        for (const e of edges) {
          if (union(e.u, e.v)) {
            this.cells[e.y1][e.x1][e.w1] = false;
            this.cells[e.y2][e.x2][e.w2] = false;
          }
        }
      }

      braid(ratio = 0.38) {
        for (let y = 0; y < this.rows; y++) {
          for (let x = 0; x < this.cols; x++) {
            const c = this.cells[y][x];
            let openCount = 0;
            if (!c.top) openCount++;
            if (!c.right) openCount++;
            if (!c.bottom) openCount++;
            if (!c.left) openCount++;
            if (openCount === 1 && this.rng() < ratio) {
              const closed = [];
              if (c.top && y > 0) closed.push({ w1: 'top', w2: 'bottom', nx: x, ny: y - 1 });
              if (c.right && x < this.cols - 1) closed.push({ w1: 'right', w2: 'left', nx: x + 1, ny: y });
              if (c.bottom && y < this.rows - 1) closed.push({ w1: 'bottom', w2: 'top', nx: x, ny: y + 1 });
              if (c.left && x > 0) closed.push({ w1: 'left', w2: 'right', nx: x - 1, ny: y });
              if (closed.length > 0) {
                const pick = closed[Math.floor(this.rng() * closed.length)];
                c[pick.w1] = false;
                this.cells[pick.ny][pick.nx][pick.w2] = false;
              }
            }
          }
        }
      }

      setupKeysAndGates() {
        this.keys = [];
        this.gates = [];
        if (!keyModeActive) return;

        const sol = this.solution;
        if (!sol || sol.length < 10) return;

        const g1Idx = Math.max(2, Math.floor(sol.length * 0.35));
        const g2Idx = Math.max(g1Idx + 2, Math.floor(sol.length * 0.70));

        const pA = sol[g1Idx - 1];
        const pB = sol[g1Idx];
        const pC = sol[g2Idx - 1];
        const pD = sol[g2Idx];

        this.gates = [
          { id: 'yellow', color: '#facc15', open: false, x1: pA.x, y1: pA.y, x2: pB.x, y2: pB.y },
          { id: 'blue', color: '#38bdf8', open: false, x1: pC.x, y1: pC.y, x2: pD.x, y2: pD.y }
        ];

        const pathSet = new Set(sol.map(p => `${p.x},${p.y}`));
        const sideCells = [];
        for (let y = 0; y < this.rows; y++) {
          for (let x = 0; x < this.cols; x++) {
            if (!pathSet.has(`${x},${y}`) && !(x === 0 && y === 0)) {
              sideCells.push({ x, y });
            }
          }
        }

        for (let i = sideCells.length - 1; i > 0; i--) {
          const j = Math.floor(this.rng() * (i + 1));
          const tmp = sideCells[i];
          sideCells[i] = sideCells[j];
          sideCells[j] = tmp;
        }

        const k1Pos = sideCells[0] || { x: Math.floor(this.cols / 2), y: 0 };
        const k2Pos = sideCells[1] || { x: Math.floor(this.cols / 2), y: this.rows - 1 };

        this.keys = [
          { id: 'yellow', color: '#facc15', label: 'Gelb', x: k1Pos.x, y: k1Pos.y, collected: false },
          { id: 'blue', color: '#38bdf8', label: 'Blau', x: k2Pos.x, y: k2Pos.y, collected: false }
        ];
      }

      solveBFS(sx, sy, gx, gy) {
        const queue = [{ x: sx, y: sy, path: [{ x: sx, y: sy }] }];
        const visited = Array.from({ length: this.rows }, () => Array(this.cols).fill(false));
        visited[sy][sx] = true;

        const dirs = [
          { dx: 0, dy: -1, wall: 'top' },
          { dx: 1, dy: 0, wall: 'right' },
          { dx: 0, dy: 1, wall: 'bottom' },
          { dx: -1, dy: 0, wall: 'left' }
        ];

        while (queue.length > 0) {
          const { x, y, path } = queue.shift();
          if (x === gx && y === gy) return path;

          for (const d of dirs) {
            if (!this.cells[y][x][d.wall]) {
              const nx = x + d.dx;
              const ny = y + d.dy;
              if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows && !visited[ny][nx]) {
                visited[ny][nx] = true;
                queue.push({ x: nx, y: ny, path: [...path, { x: nx, y: ny }] });
              }
            }
          }
        }
        return [];
      }

      canMove(x, y, dx, dy) {
        let open = false;
        if (dx === 0 && dy === -1) open = !this.cells[y][x].top;
        else if (dx === 1 && dy === 0) open = !this.cells[y][x].right;
        else if (dx === 0 && dy === 1) open = !this.cells[y][x].bottom;
        else if (dx === -1 && dy === 0) open = !this.cells[y][x].left;
        if (!open) return { ok: false, reason: 'wall' };

        if (keyModeActive && this.gates) {
          const nx = x + dx, ny = y + dy;
          for (const g of this.gates) {
            if (!g.open) {
              if ((g.x1 === x && g.y1 === y && g.x2 === nx && g.y2 === ny) ||
                  (g.x1 === nx && g.y1 === ny && g.x2 === x && g.y2 === y)) {
                return { ok: false, reason: 'gate', gate: g };
              }
            }
          }
        }
        return { ok: true };
      }
    }

    /* ==========================================================================
       GAME STATE & UI BINDINGS
       ========================================================================== */
    const canvas = document.getElementById("mazeCanvas");
    const ctx = canvas.getContext("2d");
    const viewport = document.getElementById("viewport");

    // Controls
    const seedInput = document.getElementById("seedInput");
    const randomBtn = document.getElementById("randomBtn");
    const dailyBtn = document.getElementById("dailyBtn");
    const copyBtn = document.getElementById("copyBtn");
    const algoSelect = document.getElementById("algoSelect");
    const genBtn = document.getElementById("genBtn");
    const resetBtn = document.getElementById("resetBtn");
    const sizeButtons = document.querySelectorAll(".segmented button");

    const botBtn = document.getElementById("botBtn");
    const keyModeBtn = document.getElementById("keyModeBtn");
    const crumbsBtn = document.getElementById("crumbsBtn");
    const fogBtn = document.getElementById("fogBtn");
    const trailBtn = document.getElementById("trailBtn");
    const soundBtn = document.getElementById("soundBtn");

    const timeVal = document.getElementById("timeVal");
    const stepVal = document.getElementById("stepVal");
    const parVal = document.getElementById("parVal");
    const bestVal = document.getElementById("bestVal");
    const keyHudWrap = document.getElementById("keyHudWrap");
    const keyHudVal = document.getElementById("keyHudVal");
    const botHudWrap = document.getElementById("botHudWrap");
    const botHudVal = document.getElementById("botHudVal");
    const toast = document.getElementById("toast");

    // Modal
    const winModal = document.getElementById("winModal");
    const winSeedLabel = document.getElementById("winSeedLabel");
    const winTime = document.getElementById("winTime");
    const winSteps = document.getElementById("winSteps");
    const winPar = document.getElementById("winPar");
    const winEff = document.getElementById("winEff");
    const winRec = document.getElementById("winRec");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shareWinBtn = document.getElementById("shareWinBtn");

    let currentSeed = "";
    let currentSize = 25;
    let maze = null;
    let player = { x: 0, y: 0, renderX: 0, renderY: 0 };
    let goal = { x: 0, y: 0 };

    let botActive = false;
    let keyModeActive = false;
    let showCrumbs = true;
    let bot = { x: 0, y: 0, renderX: 0, renderY: 0, pathIndex: 0, timer: null };

    let steps = 0;
    let startTime = null;
    let timerInterval = null;
    let elapsedMs = 0;
    let isGameOver = false;
    let isRunActive = false;

    let showTrail = true;
    let showFog = false;

    let trailPositions = [];
    let trailSet = new Set();
    let visitCounts = new Map();

    /* Lock/Unlock pre-run configuration */
    function setRunActive(active) {
      isRunActive = active;
      seedInput.disabled = active;
      randomBtn.disabled = active;
      dailyBtn.disabled = active;
      algoSelect.disabled = active;
      genBtn.disabled = active;
      sizeButtons.forEach(b => b.disabled = active);
      fogBtn.disabled = active;
      botBtn.disabled = active;
      keyModeBtn.disabled = active;
    }

    function stopBot() {
      if (bot.timer) {
        clearInterval(bot.timer);
        bot.timer = null;
      }
    }

    function initGame() {
      stopBot();
      let rawSeed = seedInput.value.trim().toLowerCase();
      if (!rawSeed) {
        rawSeed = getRandomSeed();
        seedInput.value = rawSeed;
      }
      currentSeed = rawSeed;

      const seedHash = hashString(currentSeed);
      const rng = createPRNG(seedHash);

      maze = new Maze(currentSize, currentSize, rng, algoSelect.value);
      player = { x: 0, y: 0, renderX: 0, renderY: 0 };
      goal = { x: currentSize - 1, y: currentSize - 1 };

      bot = { x: 0, y: 0, renderX: 0, renderY: 0, pathIndex: 0, timer: null };

      steps = 0;
      elapsedMs = 0;
      startTime = null;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      isGameOver = false;

      trailPositions = [{ x: 0, y: 0 }];
      trailSet.clear();
      trailSet.add("0,0");
      visitCounts.clear();
      visitCounts.set("0,0", 1);

      timeVal.textContent = "00:00.0";
      stepVal.textContent = "0";
      const parSteps = maze.solution.length - 1;
      parVal.textContent = `${parSteps}`;

      updateHudExtras();
      setRunActive(false);
      loadRecord();
      resizeCanvas();
      winModal.classList.remove("open");
    }

    function updateHudExtras() {
      if (keyModeActive && maze && maze.keys) {
        keyHudWrap.style.display = "inline";
        const coll = maze.keys.filter(k => k.collected).length;
        keyHudVal.textContent = `🔑 ${coll}/${maze.keys.length}`;
      } else {
        keyHudWrap.style.display = "none";
      }

      if (botActive && maze) {
        botHudWrap.style.display = "inline";
        const dist = Math.max(0, maze.solution.length - 1 - bot.pathIndex);
        botHudVal.textContent = `${dist} Schritte`;
      } else {
        botHudWrap.style.display = "none";
      }
    }

    function resetCurrentRun() {
      if (!maze) return;
      stopBot();
      player = { x: 0, y: 0, renderX: 0, renderY: 0 };
      bot = { x: 0, y: 0, renderX: 0, renderY: 0, pathIndex: 0, timer: null };

      if (keyModeActive && maze.keys) {
        maze.keys.forEach(k => k.collected = false);
        maze.gates.forEach(g => g.open = false);
      }

      steps = 0;
      elapsedMs = 0;
      startTime = null;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      isGameOver = false;

      trailPositions = [{ x: 0, y: 0 }];
      trailSet.clear();
      trailSet.add("0,0");
      visitCounts.clear();
      visitCounts.set("0,0", 1);

      timeVal.textContent = "00:00.0";
      stepVal.textContent = "0";
      updateHudExtras();
      setRunActive(false);
      winModal.classList.remove("open");
    }

    function loadRecord() {
      const key = `maze_rec_${currentSeed}_${currentSize}_${algoSelect.value}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        const data = JSON.parse(saved);
        bestVal.textContent = `${formatTime(data.time)} (${data.steps} Schritte)`;
      } else {
        bestVal.textContent = "None";
      }
    }

    function saveRecord() {
      const key = `maze_rec_${currentSeed}_${currentSize}_${algoSelect.value}`;
      const record = { time: elapsedMs, steps: steps };
      const saved = localStorage.getItem(key);
      let isNew = false;

      if (!saved) {
        localStorage.setItem(key, JSON.stringify(record));
        isNew = true;
      } else {
        const prev = JSON.parse(saved);
        if (elapsedMs < prev.time) {
          localStorage.setItem(key, JSON.stringify(record));
          isNew = true;
        }
      }
      loadRecord();
      if (window.ArcadeCore) {
        ArcadeCore.saveScore('maze', steps);
      }
      return isNew;
    }

    function startTimerIfNeeded() {
      if (!startTime && !isGameOver) {
        startTime = performance.now();
        timerInterval = setInterval(() => {
          if (!isGameOver) {
            elapsedMs = performance.now() - startTime;
            timeVal.textContent = formatTime(elapsedMs);
          }
        }, 80);

        if (botActive && !bot.timer) {
          startBotRunner();
        }
      }
    }

    function startBotRunner() {
      const stepInterval = Math.max(160, 320 - currentSize * 2.5);
      bot.timer = setInterval(() => {
        if (isGameOver || !maze) return;
        if (bot.pathIndex < maze.solution.length - 1) {
          bot.pathIndex++;
          const nextPos = maze.solution[bot.pathIndex];
          bot.x = nextPos.x;
          bot.y = nextPos.y;
          updateHudExtras();

          if (bot.x === goal.x && bot.y === goal.y && !isGameOver) {
            handleBotWin();
          }
        }
      }, stepInterval);
    }

    function handleBotWin() {
      isGameOver = true;
      stopBot();
      setRunActive(false);
      if (timerInterval) clearInterval(timerInterval);
      playSound('botwin');
      showToast("🤖 KI-Gegner hat das Ziel vor dir erreicht!");
    }

    function formatTime(ms) {
      const totalSec = ms / 1000;
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      const tenths = Math.floor((ms % 1000) / 100);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${tenths}`;
    }

    function move(dx, dy) {
      if (isGameOver) return;
      if (!isRunActive) {
        setRunActive(true);
      }
      startTimerIfNeeded();

      const check = maze.canMove(player.x, player.y, dx, dy);
      if (check.ok) {
        player.x += dx;
        player.y += dy;
        steps++;
        stepVal.textContent = steps;

        const key = `${player.x},${player.y}`;
        visitCounts.set(key, (visitCounts.get(key) || 0) + 1);

        if (!trailSet.has(key)) {
          trailSet.add(key);
          trailPositions.push({ x: player.x, y: player.y });
        }

        // Key collection check
        if (keyModeActive && maze.keys) {
          for (const k of maze.keys) {
            if (!k.collected && k.x === player.x && k.y === player.y) {
              k.collected = true;
              playSound('key');
              showToast(`🔑 ${k.label}er Schlüssel gefunden! Tor geöffnet.`);
              const matchedGate = maze.gates.find(g => g.id === k.id);
              if (matchedGate) matchedGate.open = true;
              updateHudExtras();
            }
          }
        }

        playSound('step');

        if (player.x === goal.x && player.y === goal.y) {
          handleWin();
        }
      } else {
        playSound('bump');
        if (check.reason === 'gate') {
          showToast(`🔒 ${check.gate.id === 'yellow' ? 'Gelbes' : 'Blaues'} Tor verschlossen! Finde den Schlüssel.`);
        }
      }
    }

    function handleWin() {
      isGameOver = true;
      stopBot();
      setRunActive(false);
      if (timerInterval) clearInterval(timerInterval);
      elapsedMs = performance.now() - startTime;
      timeVal.textContent = formatTime(elapsedMs);

      playSound('win');
      const isNewRecord = saveRecord();
      const par = maze.solution.length - 1;
      const eff = Math.round((par / Math.max(steps, 1)) * 100);

      winSeedLabel.textContent = `Seed: ${currentSeed} · ${algoSelect.options[algoSelect.selectedIndex].text}`;
      winTime.textContent = formatTime(elapsedMs);
      winSteps.textContent = steps;
      winPar.textContent = par;
      winEff.textContent = `${eff}%`;
      winRec.textContent = isNewRecord ? "Neuer Rekord! 🏆" : "Geschafft!";

      setTimeout(() => {
        winModal.classList.add("open");
      }, 300);
    }

    /* Canvas Sizing */
    let cellSize = 22;
    function resizeCanvas() {
      if (!maze) return;
      const maxWidth = Math.min(window.innerWidth - 32, 740);
      const maxHeight = window.innerHeight * 0.62;
      const targetSize = Math.min(maxWidth, maxHeight);

      cellSize = Math.max(12, Math.floor(targetSize / maze.cols));
      canvas.width = maze.cols * cellSize;
      canvas.height = maze.rows * cellSize;
      viewport.style.width = `${canvas.width}px`;
      viewport.style.height = `${canvas.height}px`;
    }

    window.addEventListener("resize", resizeCanvas);

    /* ==========================================================================
       RENDER LOOP: SOLID AUTHENTIC MAZE GRAPHICS WITH KEYS, GATES & BOTS
       ========================================================================== */
    function render() {
      if (!maze) {
        requestAnimationFrame(render);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      player.renderX += (player.x - player.renderX) * 0.35;
      player.renderY += (player.y - player.renderY) * 0.35;

      bot.renderX += (bot.x - bot.renderX) * 0.35;
      bot.renderY += (bot.y - bot.renderY) * 0.35;

      const cs = cellSize;

      // Solid background
      ctx.fillStyle = "#0c0e14";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Trail
      if (showTrail && trailPositions.length > 0) {
        ctx.fillStyle = "#1e2433";
        for (let i = 0; i < trailPositions.length; i++) {
          const pt = trailPositions[i];
          ctx.fillRect(pt.x * cs + 2, pt.y * cs + 2, cs - 4, cs - 4);
        }
      }

      // Breadcrumbs (footprints / dead-ends)
      if (showCrumbs) {
        visitCounts.forEach((count, key) => {
          const [cx, cy] = key.split(',').map(Number);
          const px = (cx + 0.5) * cs;
          const py = (cy + 0.5) * cs;
          ctx.beginPath();
          if (count > 1) {
            // Backtracked / Dead end marker (amber dot)
            ctx.fillStyle = "rgba(245, 158, 11, 0.4)";
            ctx.arc(px, py, Math.max(2, cs * 0.14), 0, Math.PI * 2);
          } else {
            // Single visit breadcrumb (subtle cyan dot)
            ctx.fillStyle = "rgba(99, 102, 241, 0.25)";
            ctx.arc(px, py, Math.max(1.5, cs * 0.08), 0, Math.PI * 2);
          }
          ctx.fill();
        });
      }

      // Start square
      ctx.fillStyle = "#166534";
      ctx.fillRect(2, 2, cs - 4, cs - 4);

      // Goal square
      const gx = goal.x * cs;
      const gy = goal.y * cs;
      ctx.fillStyle = "#854d0e";
      ctx.fillRect(gx + 2, gy + 2, cs - 4, cs - 4);

      // Clean Solid Walls
      ctx.strokeStyle = "#384152";
      ctx.lineWidth = Math.max(2, Math.floor(cs * 0.14));
      ctx.lineCap = "square";

      for (let y = 0; y < maze.rows; y++) {
        for (let x = 0; x < maze.cols; x++) {
          const c = maze.cells[y][x];
          const x1 = x * cs, y1 = y * cs, x2 = x1 + cs, y2 = y1 + cs;
          ctx.beginPath();
          if (c.top) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y1); }
          if (c.right) { ctx.moveTo(x2, y1); ctx.lineTo(x2, y2); }
          if (c.bottom) { ctx.moveTo(x1, y2); ctx.lineTo(x2, y2); }
          if (c.left) { ctx.moveTo(x1, y1); ctx.lineTo(x1, y2); }
          ctx.stroke();
        }
      }

      // Render Gates
      if (keyModeActive && maze.gates) {
        for (const g of maze.gates) {
          if (!g.open) {
            ctx.strokeStyle = g.color;
            ctx.lineWidth = Math.max(3, Math.floor(cs * 0.22));
            const midX = ((g.x1 + g.x2) / 2 + 0.5) * cs;
            const midY = ((g.y1 + g.y2) / 2 + 0.5) * cs;
            ctx.beginPath();
            if (g.x1 === g.x2) {
              // Horizontal passage wall
              ctx.moveTo(g.x1 * cs + 3, (Math.max(g.y1, g.y2)) * cs);
              ctx.lineTo((g.x1 + 1) * cs - 3, (Math.max(g.y1, g.y2)) * cs);
            } else {
              // Vertical passage wall
              ctx.moveTo((Math.max(g.x1, g.x2)) * cs, g.y1 * cs + 3);
              ctx.lineTo((Math.max(g.x1, g.x2)) * cs, (g.y1 + 1) * cs - 3);
            }
            ctx.stroke();

            // Glowing lock indicator
            ctx.fillStyle = g.color;
            ctx.beginPath();
            ctx.arc(midX, midY, Math.max(2, cs * 0.18), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Render Keys
      if (keyModeActive && maze.keys) {
        for (const k of maze.keys) {
          if (!k.collected) {
            const kx = (k.x + 0.5) * cs;
            const ky = (k.y + 0.5) * cs;
            ctx.fillStyle = k.color;
            ctx.beginPath();
            ctx.arc(kx, ky, cs * 0.22, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.font = `${Math.floor(cs * 0.42)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🔑", kx, ky);
          }
        }
      }

      // Bot Token
      if (botActive) {
        const bx = (bot.renderX + 0.5) * cs;
        const by = (bot.renderY + 0.5) * cs;
        ctx.fillStyle = "#f43f5e";
        ctx.beginPath();
        ctx.arc(bx, by, cs * 0.26, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Player Token (Crisp circle)
      const px = (player.renderX + 0.5) * cs;
      const py = (player.renderY + 0.5) * cs;
      ctx.fillStyle = "#f4f4f5";
      ctx.beginPath();
      ctx.arc(px, py, cs * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // Fog of War (solid dark radius)
      if (showFog) {
        ctx.save();
        const r1 = cs * 2.2;
        const r2 = cs * 3.8;
        const grad = ctx.createRadialGradient(px, py, r1, px, py, r2);
        grad.addColorStop(0, "rgba(5, 6, 8, 0)");
        grad.addColorStop(1, "rgba(5, 6, 8, 1)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    /* ==========================================================================
       USER INPUT HANDLING
       ========================================================================== */
    const DIRS = {
      ArrowUp: [0, -1], KeyW: [0, -1],
      ArrowDown: [0, 1], KeyS: [0, 1],
      ArrowLeft: [-1, 0], KeyA: [-1, 0],
      ArrowRight: [1, 0], KeyD: [1, 0]
    };

    window.addEventListener("keydown", (e) => {
      if (document.activeElement === seedInput) return;
      if (DIRS[e.code]) {
        e.preventDefault();
        const [dx, dy] = DIRS[e.code];
        move(dx, dy);
      } else if (e.code === "KeyR") {
        resetCurrentRun();
      }
    });

    // Touch D-Pad (with hold-to-move repeat)
    let dpadTimer = null;
    function bindDpad(id, dx, dy) {
      const el = document.getElementById(id);
      const stop = () => { if (dpadTimer) { clearInterval(dpadTimer); dpadTimer = null; } };
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        stop();
        move(dx, dy);
        dpadTimer = setInterval(() => move(dx, dy), 95);
      });
      el.addEventListener("pointerup", stop);
      el.addEventListener("pointerleave", stop);
      el.addEventListener("pointercancel", stop);
    }
    bindDpad("btnUp", 0, -1);
    bindDpad("btnDown", 0, 1);
    bindDpad("btnLeft", -1, 0);
    bindDpad("btnRight", 1, 0);

    // Swipe
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const t = 18;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (Math.abs(dx) > t) move(dx > 0 ? 1 : -1, 0);
        } else {
          if (Math.abs(dy) > t) move(0, dy > 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    // Buttons
    genBtn.addEventListener("click", () => {
      if (isRunActive) return;
      getAudioCtx();
      initGame();
    });

    randomBtn.addEventListener("click", () => {
      if (isRunActive) return;
      seedInput.value = getRandomSeed();
      initGame();
    });

    dailyBtn.addEventListener("click", () => {
      if (isRunActive) return;
      const today = new Date().toISOString().slice(0, 10);
      seedInput.value = `daily-${today}`;
      initGame();
      showToast(`📅 Täglicher Seed geladen (${today})`);
    });

    algoSelect.addEventListener("change", () => {
      if (isRunActive) return;
      initGame();
    });

    botBtn.addEventListener("click", () => {
      if (isRunActive) return;
      botActive = !botActive;
      botBtn.textContent = `🤖 KI-Gegner: ${botActive ? "An" : "Aus"}`;
      botBtn.classList.toggle("active", botActive);
      updateHudExtras();
    });

    keyModeBtn.addEventListener("click", () => {
      if (isRunActive) return;
      keyModeActive = !keyModeActive;
      keyModeBtn.textContent = `🔑 Schlüssel-Modus: ${keyModeActive ? "An" : "Aus"}`;
      keyModeBtn.classList.toggle("active", keyModeActive);
      initGame();
    });

    crumbsBtn.addEventListener("click", () => {
      showCrumbs = !showCrumbs;
      crumbsBtn.textContent = `👣 Spuren: ${showCrumbs ? "An" : "Aus"}`;
      crumbsBtn.classList.toggle("active", showCrumbs);
    });

    seedInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (isRunActive) return;
        initGame();
        seedInput.blur();
      }
    });

    sizeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        if (isRunActive) return;
        sizeButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSize = parseInt(btn.dataset.size, 10);
        initGame();
      });
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function copyLink() {
      const url = new URL(window.location.href);
      url.searchParams.set("seed", currentSeed);
      url.searchParams.set("size", currentSize);
      url.searchParams.set("algo", algoSelect.value);
      navigator.clipboard.writeText(url.toString()).then(() => {
        showToast("Seed link copied");
      }).catch(() => {
        showToast(`Seed: ${currentSeed}`);
      });
    }

    copyBtn.addEventListener("click", copyLink);
    shareWinBtn.addEventListener("click", copyLink);

    resetBtn.addEventListener("click", resetCurrentRun);

    fogBtn.addEventListener("click", () => {
      if (isRunActive) return;
      showFog = !showFog;
      fogBtn.textContent = `Fog of War: ${showFog ? "On" : "Off"}`;
      fogBtn.classList.toggle("active", showFog);
    });

    trailBtn.addEventListener("click", () => {
      showTrail = !showTrail;
      trailBtn.textContent = `Trail: ${showTrail ? "On" : "Off"}`;
      trailBtn.classList.toggle("active", showTrail);
    });

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = `Sound: ${soundEnabled ? "On" : "Off"}`;
      soundBtn.classList.toggle("active", soundEnabled);
    });

    playAgainBtn.addEventListener("click", () => {
      winModal.classList.remove("open");
      resetCurrentRun();
    });

    nextBtn.addEventListener("click", () => {
      winModal.classList.remove("open");
      randomBtn.click();
    });

    function loadParams() {
      const p = new URLSearchParams(window.location.search);
      const s = p.get("seed");
      const sz = p.get("size");
      const al = p.get("algo");
      if (s) seedInput.value = s;
      if (sz && ["15", "25", "35", "49"].includes(sz)) {
        currentSize = parseInt(sz, 10);
        sizeButtons.forEach(b => {
          b.classList.toggle("active", b.dataset.size === sz);
        });
      }
      if (al && ["backtracker", "prim", "kruskal", "braided"].includes(al)) {
        algoSelect.value = al;
      }
    }

    loadParams();
    initGame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
