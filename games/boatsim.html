<script type="module">

const BOATS = [

// ---------- HUD ----------
const heelCtx = $('heel').getContext('2d');
function drawHeel(roll, pitch) {
  const g = heelCtx, W = 280;
  g.clearRect(0, 0, W, W);
  g.save(); g.translate(W / 2, W / 2);
  g.fillStyle = '#0008'; g.beginPath(); g.arc(0, 0, 130, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(0, 0, 128, 0, 7); g.clip(); g.rotate(-roll);
  g.fillStyle = '#1f7fb0'; g.fillRect(-140, pitch * 120, 280, 280);
  g.restore();
  g.strokeStyle = '#fff'; g.lineWidth = 3;
  for (const a of [-60, -30, 0, 30, 60]) { const r = a * Math.PI / 180; g.beginPath(); g.moveTo(Math.sin(r) * 112, -Math.cos(r) * 112); g.lineTo(Math.sin(r) * 128, -Math.cos(r) * 128); g.stroke(); }
  g.fillStyle = '#ffd21f'; g.fillRect(-60, -4, 120, 8); g.fillRect(-4, -22, 8, 22);
  g.fillStyle = '#fff'; g.font = 'bold 30px Trebuchet MS'; g.textAlign = 'center';
  g.fillText(Math.round(Math.abs(roll) * 180 / Math.PI) + '°', 0, 70);
  g.font = 'bold 18px Trebuchet MS'; g.fillText('Krängung', 0, 96);
  g.restore();
  g.strokeStyle = Math.abs(roll) > 0.7 ? '#ff4a3a' : '#fff'; g.lineWidth = 6; g.beginPath(); g.arc(W / 2, W / 2, 130, 0, 7); g.stroke();
}

// ---------- Loop ----------
let last = performance.now();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camInit = false;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  env.t += dt;
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('show'); }
  // Steuerung
  const d = boat.def;
  const th = (keys['w'] || keys['arrowup'] || touch.f ? 1 : 0) - (keys['s'] || keys['arrowdown'] || touch.b ? 1 : 0);
  if (th) boat.throttle = clamp(boat.throttle + th * dt * 0.6, -0.5, 1); else if (Math.abs(boat.throttle) < 0.03) boat.throttle = 0;
  const rd = (keys['a'] || keys['arrowleft'] || touch.l ? 1 : 0) - (keys['d'] || keys['arrowright'] || touch.r ? 1 : 0);
  boat.rudder += ((rd * 0.6) - boat.rudder) * Math.min(1, dt * 3);
  if (d.sub) { if (keys['q']) boat.ballast = clamp(boat.ballast - dt * 0.25, 0.38, 1.1); if (keys['e']) boat.ballast = clamp(boat.ballast + dt * 0.25, 0.38, 1.1); }
  // Sturm-Challenge
  if (storm) {
    storm.t += dt;
    env.sea = Math.min(3, 0.8 + storm.t * 0.025); env.wind = Math.min(60, 18 + storm.t * 0.35);
    env.wdir += dt * 0.01; updateWaveParams();
    if (Math.floor(storm.t * 4) % 4 === 0) syncSliders();
    storm.next -= dt; if (storm.next <= 0) { storm.next = Math.max(10, 24 - storm.t * 0.06); spawnRogue(); }
  }
  env.storm += ((clamp((env.sea - 1) / 2, 0, 1) * 0.5 + clamp((env.wind - 25) / 35, 0, 1) * 0.5) - env.storm) * Math.min(1, dt * 0.5);
  if (Math.random() < dt * 2) paintSky(env.storm);
  sun.intensity = 2.2 * (1 - env.storm * 0.7); hemi.intensity = 1.1 * (1 - env.storm * 0.35);
  // Monsterwelle
  if (rogue) { rogue.s += rogue.c * dt; if (rogue.s - (boat.pos.x * rogue.dx + boat.pos.z * rogue.dz) > 160) rogue = null; }
  for (let i = ripples.length - 1; i >= 0; i--) if (env.t - ripples[i].t0 > 14) ripples.splice(i, 1);
  // Physik (Substeps)
  const big = d.mass > 1e6;
  const sub = big ? 3 : 5;
  let up;
  for (let i = 0; i < sub; i++) up = stepBoat(dt / sub);
  // Kentern / Sinken
  const roll = Math.atan2(new THREE.Vector3(0, 0, 1).applyQuaternion(boat.q).y, up.y);
  const fwdV = new THREE.Vector3(1, 0, 0).applyQuaternion(boat.q);
  const pitch = Math.asin(clamp(fwdV.y, -1, 1));
  boat.maxHeel = Math.max(boat.maxHeel, Math.abs(roll));
  const sunk = !d.sub && boat.pos.y < waterHeight(boat.pos.x, boat.pos.z) - d.free - d.draft - 2;
  if (!boat.capsized && (up.y < 0.05 || sunk || boat.flood > 0.95)) {
    boat.capT += dt;
    if (boat.capT > 2.2) {
      boat.capsized = true;
      banner(sunk || boat.flood > 0.95 ? '🫧 GESUNKEN!' : '🙃 GEKENTERT!', 2.5); ArcadeCore.gameOver();
      if (storm) {
        const s = Math.floor(storm.t);
        let rec = '';
        if (s > bestStorm) { bestStorm = s; ArcadeCore.saveScore(KEY, s); rec = ' · NEUER REKORD!'; }
        setTimeout(() => banner(`⛈️ ${d.name}<br><span style="font-size:22px">${s} s im Sturm überlebt${rec}</span>`, 3.5), 2600);
        stopStorm();
      }
      setTimeout(() => { resetBoat(); if (env.sea > 1.6 && !storm) { env.sea = 1.2; syncSliders(); updateWaveParams(); } }, 3200);
    }
  } else if (up.y > 0.3) boat.capT = 0;
  boat.mesh.position.copy(boat.pos); boat.mesh.quaternion.copy(boat.q);
  // Wasser & Szene
  updateWater(boat.pos.x, boat.pos.z);
  updateSpray(dt);
  for (const g of gulls) { const u = g.userData; u.a += dt * u.s; g.position.set(boat.pos.x + Math.cos(u.a) * u.r, u.h + Math.sin(u.a * 3) * 1.5, boat.pos.z + Math.sin(u.a) * u.r); g.rotation.y = -u.a; const f = Math.sin(env.t * 9 + u.r) * 0.5; u.wl.rotation.x = f; u.wr.rotation.x = -f; g.visible = env.storm < 0.6; }
  if (oceanGain) oceanGain.gain.value = 0.06 + env.sea * 0.05 + env.wind * 0.002;
  // Kamera
  const dist = camDist;
  const tp = new THREE.Vector3(boat.pos.x + Math.cos(camYaw) * Math.cos(camPitch) * dist, boat.pos.y + Math.sin(camPitch) * dist + d.free, boat.pos.z + Math.sin(camYaw) * Math.cos(camPitch) * dist);
  const wh = waterHeight(tp.x, tp.z) + 1.5; if (tp.y < wh) tp.y = wh;
  if (!camInit) { camPos.copy(tp); camLook.copy(boat.pos); camInit = true; }
  camPos.lerp(tp, Math.min(1, dt * 4)); camLook.lerp(boat.pos.clone().add(new THREE.Vector3(0, d.free, 0)), Math.min(1, dt * 6));
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(boat.pos.x + 80, 140, boat.pos.z + 50); sun.target.position.copy(boat.pos);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -Math.max(40, d.L); sun.shadow.camera.right = sun.shadow.camera.top = Math.max(40, d.L); sun.shadow.camera.updateProjectionMatrix();
  sunDisk.position.set(camera.position.x + 600, 420, camera.position.z + 380);
  // HUD
  const spd = Math.hypot(boat.vel.x, boat.vel.z) / 0.514;
  const draftNow = Math.max(0, waterHeight(boat.pos.x, boat.pos.z) - (boat.pos.y - d.draft));
  $('stats').innerHTML = `<b>${d.name}</b><br>⚓ ${spd.toFixed(1)} kn<br>Trimm ${(pitch * 180 / Math.PI).toFixed(1)}°<br>Tiefgang ${draftNow.toFixed(1)} m${d.sub ? '<br>Tiefe ' + Math.max(0, -boat.pos.y).toFixed(1) + ' m · Ballast ' + Math.round((1.1 - boat.ballast) / 0.72 * 100) + '%' : ''}<br>💧 Wasser im Rumpf ${Math.round(boat.flood * 100)}%<br>Max. Krängung ${Math.round(boat.maxHeel * 180 / Math.PI)}°` + (storm ? `<br>⛈️ <b>${Math.floor(storm.t)} s</b> überlebt` : '') + (bestStorm ? `<br>🏆 Sturm-Rekord ${bestStorm} s` : '');
  $('thr').style.left = (boat.throttle >= 0 ? 50 : 50 + boat.throttle * 50) + '%'; $('thr').style.width = Math.abs(boat.throttle) * 50 + '%';
  $('thr').style.background = boat.throttle >= 0 ? '#5fe36a' : '#ff8a3a';
  drawHeel(roll, pitch);
  renderer.render(scene, camera);
}
selectBoat(0);
appStarted = true;
requestAnimationFrame(loop);
</script>
</body>
</html>
