<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Memory Match</title><link rel="stylesheet" href="../style.css">
<script defer src="https://umami.lucius-website.xyz/script.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
<script defer src="https://umami.lucius-website.xyz/recorder.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
<style>
body { touch-action: manipulation; }
#grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:clamp(8px, 2.5vw, 14px); max-width:min(92vw, 460px); margin:20px auto; perspective:800px; }
.card2 { width:100%; aspect-ratio:1; height:auto; cursor:pointer; position:relative; transform-style:preserve-3d; transition:transform .4s; touch-action:manipulation; }
.card2.flip, .card2.done { transform:rotateY(180deg); }
.face { position:absolute; inset:0; border-radius:clamp(8px, 2.5vw, 14px); display:flex; align-items:center; justify-content:center; backface-visibility:hidden; font-size:clamp(1.8rem, 7vw, 3.2rem); }
.back2 { background:linear-gradient(135deg,#7c3aed,#db2777); box-shadow:0 6px 15px rgba(0,0,0,.4); }
.back2::after { content:"?"; font-size:clamp(1.5rem, 5vw, 2.5rem); color:rgba(255,255,255,.5); font-weight:900; }
.front { background:#f8fafc; transform:rotateY(180deg); }
.card2.done .front { background:#bbf7d0; box-shadow:0 0 20px #22c55e; }
.card2:hover:not(.flip):not(.done) { transform:translateY(-4px); }
button { background:#f59e0b; border:0; color:#fff; font-weight:bold; padding:8px 16px; border-radius:10px; cursor:pointer; font-size:0.95rem; touch-action:manipulation; }
#win { font-size:clamp(1.2rem, 4vw, 1.6rem); color:#fde047; min-height:2rem; margin:10px 0; }
.info { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 14px; }
</style></head>
<body>
<a class="back" href="../index.html">← Back</a>
<h1>🧠 Memory Match</h1>
<div class="info">Moves: <b id="moves">0</b> · Zeit: <b id="time">0</b>s · Best: <b id="best">-</b> <button onclick="reset()">Restart</button></div>
<div id="grid"></div>
<div id="win"></div>
<script>
const EMOJIS = ["🍕","🚀","🐱","🎸","🌈","⚽","🦄","🍩"];
const grid = document.getElementById("grid");
let first, lock, moves, matched, start, timer, best = +localStorage.memoryBest || 0;
function reset() {
  grid.innerHTML = ""; first = null; lock = false; moves = 0; matched = 0; start = null;
  clearInterval(timer); document.getElementById("time").textContent = 0;
  document.getElementById("moves").textContent = 0; document.getElementById("win").textContent = "";
  document.getElementById("best").textContent = best || "-";
  const deck = [...EMOJIS, ...EMOJIS].sort(() => Math.random() - .5);
  for (const e of deck) {
    const card = document.createElement("div"); card.className = "card2"; card.dataset.e = e;
    card.innerHTML = `<div class="face back2"></div><div class="face front">${e}</div>`;
    card.onclick = () => flip(card); grid.appendChild(card);
  }
}
function flip(card) {
  if (lock || card === first || card.classList.contains("done")) return;
  if (!start) { start = Date.now(); timer = setInterval(() => document.getElementById("time").textContent = ((Date.now() - start)/1000|0), 250); }
  card.classList.add("flip");
  if (!first) { first = card; return; }
  moves++; document.getElementById("moves").textContent = moves;
  if (first.dataset.e === card.dataset.e) {
    first.classList.add("done"); card.classList.add("done"); first = null; matched++;
    if (matched === EMOJIS.length) {
      clearInterval(timer);
      if (!best || moves < best) { best = moves; localStorage.memoryBest = best; }
      document.getElementById("best").textContent = best;
      document.getElementById("win").textContent = `🎉 You won in ${moves} moves and ${(Date.now()-start)/1000|0}s!`;
    }
  } else {
    lock = true; const a = first; first = null;
    setTimeout(() => { a.classList.remove("flip"); card.classList.remove("flip"); lock = false; }, 800);
  }
}
reset();
</script>
</body>
</html>
