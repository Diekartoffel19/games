<script>
// --- AUDIO SYNTHESIS (BTD6 Original Sound Palette) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playAudio(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'pop') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(650 + Math.random() * 200, t);
    osc.frequency.exponentialRampToValueAtTime(120, t + 0.04);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.04);
    osc.start(t); osc.stop(t + 0.04);
  } else if (type === 'dart') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(460, t);
    osc.frequency.exponentialRampToValueAtTime(190, t + 0.06);
    gain.gain.setValueAtTime(0.035, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.06);
    osc.start(t); osc.stop(t + 0.06);
  } else if (type === 'boom') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130, t);
    osc.frequency.exponentialRampToValueAtTime(25, t + 0.3);
    gain.gain.setValueAtTime(0.22, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'cash') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.setValueAtTime(1200, t + 0.05);
    gain.gain.setValueAtTime(0.06, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
  } else if (type === 'leak') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.linearRampToValueAtTime(50, t + 0.25);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.25);
    osc.start(t); osc.stop(t + 0.25);
  }
}

let currentMapIdx = 0;
let WAYPOINTS = MAPS[0].waypoints;
let pathDistances = [0];
let totalPathLength = 0;

function recalculatePath() {
  WAYPOINTS = MAPS[currentMapIdx].waypoints;
  pathDistances = [0];
  totalPathLength = 0;
  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    const d = Math.hypot(WAYPOINTS[i+1].x - WAYPOINTS[i].x, WAYPOINTS[i+1].y - WAYPOINTS[i].y);
    totalPathLength += d;
    pathDistances.push(totalPathLength);
  }
}
recalculatePath();

function switchMap(idx) {
  if (waveActive) return;
  currentMapIdx = idx;
  recalculatePath();
  bloons = [];
  projectiles = [];
  towers = [];
  roadSpikes = [];
  closeUpgradeModal();
  document.querySelectorAll(".map-btn").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
  });
  updateHUD();
}

function isPointInWater(x, y) {
  const map = MAPS[currentMapIdx];
  for (const w of map.water) {
    if (Math.hypot(x - w.x, y - w.y) <= w.r) return true;
  }
  return false;
}

function getPointAtDist(dist) {
  if (dist <= 0) return { x: WAYPOINTS[0].x, y: WAYPOINTS[0].y };
  if (dist >= totalPathLength) return { x: WAYPOINTS[WAYPOINTS.length-1].x, y: WAYPOINTS[WAYPOINTS.length-1].y };

  for (let i = 0; i < pathDistances.length - 1; i++) {
    if (dist >= pathDistances[i] && dist <= pathDistances[i+1]) {
      const segLen = pathDistances[i+1] - pathDistances[i];
      const t = (dist - pathDistances[i]) / segLen;
      return {
        x: WAYPOINTS[i].x + (WAYPOINTS[i+1].x - WAYPOINTS[i].x) * t,
        y: WAYPOINTS[i].y + (WAYPOINTS[i+1].y - WAYPOINTS[i].y) * t
      };
    }
  }
  return { x: WAYPOINTS[0].x, y: WAYPOINTS[0].y };
}

function distToTrack(px, py) {
  let minDist = Infinity;
  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    const x1 = WAYPOINTS[i].x, y1 = WAYPOINTS[i].y;
    const x2 = WAYPOINTS[i+1].x, y2 = WAYPOINTS[i+1].y;
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lenSq));
    const projX = x1 + t * dx;
    const projY = y1 + t * dy;
    const d = Math.hypot(px - projX, py - projY);
    if (d < minDist) minDist = d;
  }
  return minDist;
}

function createTowerObject(key, x, y) {
  const spec = TOWER_SPECS[key];
  return {
    key: key,
    spec: spec,
    x: x,
    y: y,
    range: spec.range,
    fireRate: spec.fireRate,
    pierce: spec.pierce,
    damage: spec.damage,
    bulletSpeed: spec.bulletSpeed,
    bulletType: spec.bulletType,
    splashRadius: spec.splashRadius || 0,
    canPopLead: !!spec.canPopLead,
    canSeeCamo: false,
    canPopFrozen: false,
    freezeDuration: 1.8,
    isFarm: !!spec.isFarm,
    incomePerWave: spec.incomePerWave || 0,

    tierB: 0,
    invested: spec.cost,
    cooldown: 0,
    angle: 0,
    targeting: "first"
  };
}

// Generate round Bloon groups
function getRoundBloons(r) {
  const list = [];
  const add = (type, count, delay) => {
    for (let i = 0; i < count; i++) list.push({ type, delay });
  };

  if (r === 1) { add("red", 20, 0.6); }
  else if (r === 2) { add("red", 15, 0.45); add("blue", 10, 0.5); }
  else if (r === 3) { add("blue", 20, 0.4); add("green", 5, 0.55); }
  else if (r === 4) { add("blue", 15, 0.35); add("green", 18, 0.4); }
  else if (r === 5) { add("green", 25, 0.3); add("yellow", 8, 0.45); }
  else if (r <= 8) { add("green", 20, 0.25); add("yellow", 20, 0.3); add("pink", 8, 0.35); }
  else if (r <= 12) {
    add("yellow", 25, 0.2); add("pink", 25, 0.2);
    add("black", 10, 0.35); add("white", 10, 0.35);
  } else if (r <= 15) {
    add("lead", 15, 0.5); add("pink", 30, 0.18); add("black", 15, 0.3);
  } else if (r <= 20) {
    add("camo", 18, 0.4); add("lead", 15, 0.45); add("pink", 35, 0.15);
  } else if (r <= 26) {
    add("rainbow", 15, 0.45); add("camo", 20, 0.35); add("lead", 20, 0.3);
  } else if (r <= 30) {
    add("ceramic", 6, 0.8); add("rainbow", 25, 0.35); add("lead", 20, 0.3);
  } else if (r === 31) {
    add("black", 15, 0.3); add("white", 15, 0.3);
    add("green", 25, 0.2); add("red", 20, 0.15); add("yellow", 18, 0.25);
  } else if (r <= 35) {
    add("ceramic", 15, 0.6); add("rainbow", 25, 0.3); add("camo", 20, 0.3);
  } else if (r <= 39) {
    add("ceramic", 25, 0.5); add("rainbow", 35, 0.2); add("lead", 30, 0.2);
  } else if (r === 40) {
    add("ceramic", 12, 0.4);
    add("moab", 1, 2.5);
  } else {
    const scale = r - 40;
    add("ceramic", 15 + scale * 3, Math.max(0.15, 0.4 - scale * 0.02));
    add("moab", 1 + Math.floor(scale / 2), 1.8);
    if (scale >= 3) add("bfb", Math.floor(scale / 3), 3.0);
  }
  return list;
}

function handlePlayForward() {
  if (!waveActive) {
    // Start Round
    waveActive = true;
    waveQueue = getRoundBloons(round);
    document.getElementById("btn-forward").textContent = "⏩";
    document.getElementById("btn-forward").classList.add("fast");
  } else {
    // Toggle 1x / 3x speed
    if (gameSpeed === 1) {
      gameSpeed = 3;
      document.getElementById("btn-forward").textContent = "▶️▶️";
    } else {
      gameSpeed = 1;
      document.getElementById("btn-forward").textContent = "⏩";
    }
  }
}

// --- HERO LEVELING & ABILITIES (QUINCY) ---
let heroLevel = 1;
let heroXp = 0;
let heroXpNext = 150;
let heroSalvoCooldown = 0;
let heroStormCooldown = 0;

function grantHeroXp(amount) {
  const quincy = towers.find(t => t.isHero);
  if (!quincy) return;
  heroXp += amount;
  while (heroXp >= heroXpNext && heroLevel < 20) {
    heroXp -= heroXpNext;
    heroLevel++;
    heroXpNext = Math.round(heroXpNext * 1.35);
    quincy.damage = 2 + Math.floor(heroLevel / 3);
    quincy.pierce = 3 + Math.floor(heroLevel / 2);
    quincy.fireRate = Math.max(0.18, 0.65 - (heroLevel * 0.024));
    if (heroLevel >= 5) quincy.canSeeCamo = true;
    if (heroLevel >= 7) quincy.canPopLead = true;
    playAudio('cash');
    createParticles(quincy.x, quincy.y, "#fde047", 22, 2);
  }
  updateHeroHUD();
}

function updateHeroHUD() {
  const lvlEl = document.getElementById("hero-lvl-val");
  const xpEl = document.getElementById("hero-xp-val");
  if (lvlEl) lvlEl.textContent = heroLevel;
  if (xpEl) xpEl.textContent = heroLevel >= 20 ? "MAX" : `${heroXp}/${heroXpNext}`;
  const salvoBtn = document.getElementById("btn-hero-salvo");
  if (salvoBtn) {
    salvoBtn.style.opacity = (heroLevel >= 3 && heroSalvoCooldown <= 0) ? "1" : "0.4";
  }
  const stormBtn = document.getElementById("btn-hero-storm");
  if (stormBtn) {
    stormBtn.style.opacity = (heroLevel >= 10 && heroStormCooldown <= 0) ? "1" : "0.4";
  }
}

function activateHeroSalvo() {
  if (heroLevel < 3 || heroSalvoCooldown > 0) return;
  const quincy = towers.find(t => t.isHero);
  if (!quincy) return;
  heroSalvoCooldown = 15;
  playAudio('dart');
  let shotsFired = 0;
  const salvoInterval = setInterval(() => {
    if (shotsFired++ >= 18 || bloons.length === 0) {
      clearInterval(salvoInterval);
      return;
    }
    const target = bloons[0];
    if (target) {
      const angle = Math.atan2(target.y - quincy.y, target.x - quincy.x);
      projectiles.push({
        x: quincy.x, y: quincy.y,
        vx: Math.cos(angle) * 16,
        vy: Math.sin(angle) * 16,
        r: 4,
        damage: quincy.damage + 2,
        pierce: 5,
        life: 1.0,
        hitBloons: [],
        tower: quincy
      });
      playAudio('dart');
    }
  }, 65);
}

function activateHeroAbility() {
  if (heroLevel < 10 || heroStormCooldown > 0) return;
  heroStormCooldown = 30;
  playAudio('boom');
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const p = getPointAtDist(Math.random() * totalPathLength);
      createParticles(p.x, p.y, "#ef4444", 8, 1.5);
      bloons.forEach(b => {
        if (Math.hypot(b.x - p.x, b.y - p.y) < 55) {
          damageBloon(b, 5, { canPopLead: true, canSeeCamo: true, bulletType: 'bomb' });
        }
      });
    }, i * 35);
  }
}

function placeRoadSpikes() {
  if (cash >= 50) {
    cash -= 50;
    playAudio('cash');
    const pos = mousePos.x > 0 ? { x: mousePos.x, y: mousePos.y } : getPointAtDist(200);
    roadSpikes.push({ x: pos.x, y: pos.y, hits: 10 });
    updateHUD();
  }
}

function useInstaBomb() {
  if (cash >= 200) {
    cash -= 200;
    playAudio('boom');
    for (let i = bloons.length - 1; i >= 0; i--) {
      damageBloon(bloons[i], 12, { canPopLead: true, canSeeCamo: true });
    }
    updateHUD();
  }
}

function upgradeModalTower(path) {
  const t = selectedPlacedTower;
  if (!t) return;

  const maxTierA = (t.tierB >= 3) ? 2 : 5;
  const maxTierB = (t.tierA >= 3) ? 2 : 5;

  if (path === 'A' && t.tierA < maxTierA && t.tierA < t.spec.pathA.tiers.length) {
    const cost = t.spec.pathA.tiers[t.tierA].cost;
    if (cash >= cost) {
      cash -= cost;
      t.invested += cost;
      t.spec.pathA.tiers[t.tierA].apply(t);
      t.tierA++;
      playAudio('cash');
      createParticles(t.x, t.y, "#38bdf8", 16);
      openUpgradeModal(t);
      updateHUD();
    }
  } else if (path === 'B' && t.tierB < maxTierB && t.tierB < t.spec.pathB.tiers.length) {
    const cost = t.spec.pathB.tiers[t.tierB].cost;
    if (cash >= cost) {
      cash -= cost;
      t.invested += cost;
      t.spec.pathB.tiers[t.tierB].apply(t);
      t.tierB++;
      playAudio('cash');
      createParticles(t.x, t.y, "#facc15", 16);
      openUpgradeModal(t);
      updateHUD();
    }
  }
}

  updateHUD();

// --- CANVAS MOUSE HANDLING ---
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
  mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});

canvas.addEventListener("mouseleave", () => {
  mousePos.x = -1;
  mousePos.y = -1;
});

canvas.addEventListener("click", () => {
  if (lives <= 0) return;
  const mx = mousePos.x, my = mousePos.y;

  // 1. Click existing tower
  for (const t of towers) {
    if (Math.hypot(t.x - mx, t.y - my) <= 24) {
      openUpgradeModal(t);
      return;
    }
  }

  // 2. Place new tower
  if (selectedSlotKey) {
    const spec = TOWER_SPECS[selectedSlotKey];
    const inWater = isPointInWater(mx, my);

    if (spec.isWater && !inWater) return; // Water towers must be placed in water
    if (!spec.isWater && inWater) return; // Land towers cannot be placed in water

    const dTrack = distToTrack(mx, my);
    if (dTrack < 28) return; // Cannot place on stone road

    for (const t of towers) {
      if (Math.hypot(t.x - mx, t.y - my) < 36) return;
    }

    if (cash >= spec.cost) {
      cash -= spec.cost;
      const newTower = createTowerObject(selectedSlotKey, mx, my);
      towers.push(newTower);
      playAudio('cash');
      createParticles(mx, my, "#22c55e", 15);
      updateHUD();
    }
  } else {
    closeUpgradeModal();
  }
});

function updateHUD() {
  document.getElementById("hud-cash").textContent = cash.toLocaleString();
  document.getElementById("hud-lives").textContent = lives;
  document.getElementById("hud-round").textContent = round;

  // Update lock states on cards
  Object.keys(TOWER_SPECS).forEach(k => {
    const el = document.getElementById(`slot-${k}`);
    if (el) el.classList.toggle("locked", cash < TOWER_SPECS[k].cost);
  });
}

function spawnBloon(type) {
  const spec = BLOON_TIERS[type];
  const start = WAYPOINTS[0];
  bloons.push({
    type,
    spec,
    dist: 0,
    x: start.x,
    y: start.y,
    speed: spec.speed,
    r: spec.r,
    hp: spec.hp || 1,
    maxHp: spec.maxHp || 1,
    isMoab: !!spec.isMoab,
    isBfb: !!spec.isBfb,
    isCeramic: !!spec.isCeramic,
    isLead: !!spec.isLead,
    isCamo: !!spec.isCamo,
    frozen: 0,
    popped: false
  });
}

function spawnChildBloon(type, dist) {
  const spec = BLOON_TIERS[type];
  const pos = getPointAtDist(dist);
  bloons.push({
    type,
    spec,
    dist,
    x: pos.x,
    y: pos.y,
    speed: spec.speed,
    r: spec.r,
    hp: spec.hp || 1,
    maxHp: spec.maxHp || 1,
    isMoab: !!spec.isMoab,
    isCeramic: !!spec.isCeramic,
    isLead: !!spec.isLead,
    isCamo: !!spec.isCamo,
    frozen: 0,
    popped: false
  });
}

function damageBloon(b, dmg, tower) {
  if (b.isCamo && !tower.canSeeCamo) return;
  if (b.type === "lead" && !tower.canPopLead) return;
  if (b.type === "black" && tower.bulletType === "bomb") return;
  if (b.frozen > 0 && !tower.canPopFrozen && tower.bulletType !== "bomb") return;

  if (tower.deCamo && b.isCamo) b.isCamo = false;

  if (tower.bulletType === "glue") {
    b.glued = 4.5;
    b.slowFactor = tower.slowFactor || 0.5;
    createParticles(b.x, b.y, "#eab308", 5);
  }
  if (dmg <= 0) return;
  grantHeroXp(1);

  if (b.isMoab || b.isBfb) {
    let airDmg = dmg;
    if (tower.moabSpecial) airDmg *= 18;
    b.hp -= airDmg;
    cash += 1;
    createParticles(b.x, b.y, "#38bdf8", 3);

    if (b.hp <= 0) {
      playAudio('boom');
      cash += b.isBfb ? 300 : 150;
      createParticles(b.x, b.y, b.spec.color, 35, 2);
      if (b.spec.spawns) {
        b.spec.spawns.forEach((cType, idx) => spawnChildBloon(cType, b.dist - (idx * 22)));
      }
      b.popped = true;
    }
    updateHUD();
    return;
  }

  if (b.isCeramic) {
    b.hp -= dmg;
    cash += 1;
    createParticles(b.x, b.y, "#b45309", 4);
    if (b.hp <= 0) {
      playAudio('pop');
      spawnChildBloon("rainbow", b.dist);
      spawnChildBloon("rainbow", b.dist - 14);
      b.popped = true;
    }
    updateHUD();
    return;
  }

  playAudio('pop');
  createParticles(b.x, b.y, b.spec.color === "rainbow" ? "#ec4899" : b.spec.color, 6);

  if (b.type === "rainbow") {
    cash += 1;
    updateHUD();
    spawnChildBloon("black", b.dist);
    spawnChildBloon("white", b.dist - 14);
    b.popped = true;
    return;
  }

  let rem = Math.max(1, Math.floor(dmg));
  while (rem > 0) {
    cash += 1;
    const nextType = b.spec.next;
    if (nextType) {
      b.type = nextType;
      b.spec = BLOON_TIERS[nextType];
      b.speed = b.spec.speed;
      b.r = b.spec.r;
      b.isLead = !!b.spec.isLead;
      b.isCamo = !!b.spec.isCamo;
      rem--;
    } else {
      b.popped = true;
      break;
    }
  }
  updateHUD();
}

// --- GAME LOOP & UPDATES ---
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1) * gameSpeed;
  lastTime = now;

  if (!isPaused) {
    update(dt);
  }
  render();

  requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (lives <= 0) return;
  if (heroSalvoCooldown > 0) heroSalvoCooldown = Math.max(0, heroSalvoCooldown - dt);
  if (heroStormCooldown > 0) heroStormCooldown = Math.max(0, heroStormCooldown - dt);
  updateHeroHUD();

  // 1. Wave Spawner
  if (waveActive && waveQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const item = waveQueue.shift();
      spawnBloon(item.type);
      spawnTimer = item.delay;
    }
  }

  // Wave Ended
  if (waveActive && waveQueue.length === 0 && bloons.length === 0) {
    waveActive = false;
    let waveBonus = 100 + round * 5;

    // Banana Farms
    towers.forEach(t => {
      if (t.isFarm) {
        cash += t.incomePerWave;
        createParticles(t.x, t.y, "#facc15", 8);
      }
    });

    cash += waveBonus;
    grantHeroXp(round * 45);
    if (window.ArcadeCore) ArcadeCore.saveScore('towerdefense', round);
    round++;
    playAudio('cash');

    document.getElementById("btn-forward").textContent = "▶️";
    document.getElementById("btn-forward").classList.remove("fast");
    updateHUD();
    updateWavePreviewTicker();
  }

  // 2. Bloon Movement & Road Spikes
  for (let i = bloons.length - 1; i >= 0; i--) {
    const b = bloons[i];
    if (b.popped) {
      bloons.splice(i, 1);
      continue;
    }

    if (b.glued > 0) b.glued -= dt;
    if (b.frozen > 0) {
      b.frozen -= dt;
    } else {
      const slowMult = b.glued > 0 ? (b.slowFactor || 0.5) : 1;
      b.dist += b.speed * slowMult * 60 * dt;
      const pos = getPointAtDist(b.dist);
      b.x = pos.x;
      b.y = pos.y;
    }

    // Road spikes collision
    for (let s = roadSpikes.length - 1; s >= 0; s--) {
      const spk = roadSpikes[s];
      if (Math.hypot(b.x - spk.x, b.y - spk.y) < b.r + 10) {
        damageBloon(b, 1, { canPopLead: true, canSeeCamo: true });
        spk.hits--;
        if (spk.hits <= 0) roadSpikes.splice(s, 1);
        break;
      }
    }

    // Leaks
    if (b.dist >= totalPathLength) {
      lives -= b.spec.damage || 1;
      playAudio('leak');
      createParticles(b.x, b.y, "#ef4444", 16);
      bloons.splice(i, 1);
      updateHUD();
      if (lives <= 0) {
        lives = 0;
        updateHUD();
      }
    }
  }

  // 3. Towers Firing
  for (const t of towers) {
    if (t.isFarm) continue;
    if (t.cooldown > 0) t.cooldown -= dt;

    let inRange = bloons.filter(b => {
      if (b.isCamo && !t.canSeeCamo) return false;
      return Math.hypot(b.x - t.x, b.y - t.y) <= t.range;
    });
    if (inRange.length === 0) continue;

    let target = inRange[0];
    if (t.targeting === "first") target = inRange.reduce((max, b) => b.dist > max.dist ? b : max, inRange[0]);
    else if (t.targeting === "last") target = inRange.reduce((min, b) => b.dist < min.dist ? b : min, inRange[0]);
    else if (t.targeting === "strong") target = inRange.reduce((str, b) => (b.spec.damage || 1) > (str.spec.damage || 1) ? b : str, inRange[0]);
    else if (t.targeting === "close") target = inRange.reduce((cls, b) => Math.hypot(b.x - t.x, b.y - t.y) < Math.hypot(cls.x - t.x, cls.y - t.y) ? b : cls, inRange[0]);

    t.angle = Math.atan2(target.y - t.y, target.x - t.x);

    if (t.cooldown <= 0) {
      t.cooldown = t.fireRate;
      fireTower(t, target);
    }
  }

  // 4. Projectiles Update
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * 60 * dt;
    p.y += p.vy * 60 * dt;
    p.life -= dt;

    if (p.life <= 0) {
      projectiles.splice(i, 1);
      continue;
    }

    for (const b of bloons) {
      if (b.popped) continue;
      if (b.isCamo && !p.tower.canSeeCamo) continue;
      if (p.hitBloons.includes(b)) continue;

      const hitDist = p.splash ? p.splash : (b.r + p.r);
      if (Math.hypot(b.x - p.x, b.y - p.y) <= hitDist) {
        p.hitBloons.push(b);

        if (p.splash) {
          playAudio('boom');
          createParticles(p.x, p.y, "#f97316", 16);
          for (const spB of bloons) {
            if (spB.isCamo && !p.tower.canSeeCamo) continue;
            if (Math.hypot(spB.x - p.x, spB.y - p.y) <= p.splash) {
              damageBloon(spB, p.damage, p.tower);
            }
          }
          projectiles.splice(i, 1);
          break;
        } else {
          damageBloon(b, p.damage, p.tower);
          p.pierce--;
          if (p.pierce <= 0) {
            projectiles.splice(i, 1);
            break;
          }
        }
      }
    }
  }

  // 5. Particles Update
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life -= pt.decay;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function fireTower(t, target) {
  t.shotCount = (t.shotCount || 0) + 1;
  if (t.bulletType === "instant") {
    playAudio('dart');
    damageBloon(target, t.damage, t);
    createParticles(target.x, target.y, "#e2e8f0", 5);
  } else if (t.bulletType === "freezeWave") {
    playAudio('pop');
    createParticles(t.x, t.y, "#38bdf8", 18, 1.5);
    for (const b of bloons) {
      if (b.isCamo && !t.canSeeCamo) continue;
      if (Math.hypot(b.x - t.x, b.y - t.y) <= t.range) {
        if (!b.spec.immuneFreeze && !b.isMoab && !b.isBfb) {
          b.frozen = t.freezeDuration;
          if (t.damage > 0) damageBloon(b, t.damage, t);
        }
      }
    }
  } else if (t.bulletType === "tack") {
    playAudio('dart');
    const count = t.tackCount || 8;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      projectiles.push({
        x: t.x, y: t.y,
        vx: Math.cos(angle) * t.bulletSpeed,
        vy: Math.sin(angle) * t.bulletSpeed,
        r: 3,
        damage: t.damage,
        pierce: t.pierce,
        life: 0.35,
        hitBloons: [],
        tower: t
      });
    }
  } else {
    playAudio(t.key === 'bomb' ? 'dart' : 'dart');
    const shots = t.multiShot || 1;
    const isExplosiveArrow = t.explosiveArrows && (t.shotCount % 3 === 0);
    for (let s = 0; s < shots; s++) {
      const spread = (s - (shots - 1) / 2) * 0.16;
      const angle = t.angle + spread;
      projectiles.push({
        x: t.x, y: t.y,
        vx: Math.cos(angle) * t.bulletSpeed,
        vy: Math.sin(angle) * t.bulletSpeed,
        r: t.key === "bomb" || isExplosiveArrow ? 6 : 3,
        damage: t.damage,
        pierce: t.pierce,
        splash: isExplosiveArrow ? 45 : t.splashRadius,
        life: 1.2,
        hitBloons: [],
        tower: t
      });
    }
  }
}

function createParticles(x, y, color, count = 8, speedMult = 1) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = (Math.random() * 3 + 1) * speedMult;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      color,
      size: Math.random() * 3 + 2,
      life: 1.0,
      decay: Math.random() * 0.04 + 0.02
    });
  }
}

// --- RENDERING BTD6 MONKEY MEADOW GRAPHICS ---
function render() {
  ctx.clearRect(0, 0, W, H);

  // 1. Lush Green Lawn Background
  drawBTD6Lawn();

  // 2. Realistic Cobblestone Road with Shadow Rim
  drawBTD6StoneRoad();

  // 3. Trees, Foliage & Flowers (as in reference photo)
  drawFoliageAndDecorations();

  // 4. Road Spikes
  drawRoadSpikes();

  // 5. Towers
  drawTowers();

  // 6. Bloons
  drawBloons();

  // 7. Projectiles
  drawProjectiles();

  // 8. Particles
  drawParticles();

  // 9. Tower Range Ring & Selection Ghost
  drawPlacementHover();

  // 10. Game Over Screen
  drawOverlays();
}

function drawBTD6Lawn() {
  const map = MAPS[currentMapIdx];
  if (currentMapIdx === 2) {
    // Winter Loop (snowy terrain)
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 600);
    grad.addColorStop(0, '#f1f5f9');
    grad.addColorStop(1, '#cbd5e1');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  } else if (currentMapIdx === 1) {
    // Park Path (dark lush grass)
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 600);
    grad.addColorStop(0, '#86efac');
    grad.addColorStop(1, '#16a34a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  } else {
    // Monkey Meadow
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 600);
    grad.addColorStop(0, '#84cc16'); // Vibrant bright sunny center
    grad.addColorStop(1, '#4d7c0f'); // Rich lush border
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // Draw Water ponds
  for (const w of map.water) {
    ctx.save();
    ctx.fillStyle = currentMapIdx === 2 ? "#94a3b8" : "#ca8a04";
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r + 7, 0, Math.PI * 2);
    ctx.fill();

    const wGrad = ctx.createRadialGradient(w.x, w.y, 10, w.x, w.y, w.r);
    wGrad.addColorStop(0, currentMapIdx === 2 ? '#bae6fd' : '#38bdf8');
    wGrad.addColorStop(1, currentMapIdx === 2 ? '#38bdf8' : '#0284c7');
    ctx.fillStyle = wGrad;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(w.x - 10, w.y - 12, w.r * 0.45, 0.5, 2.4);
    ctx.stroke();
    ctx.restore();
  }
}

function drawBTD6StoneRoad() {
  const map = MAPS[currentMapIdx];
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Deep shadow rim under stones
  ctx.strokeStyle = "rgba(15, 23, 42, 0.45)";
  ctx.lineWidth = 54;
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();

  // Outer Stone Border
  ctx.strokeStyle = map.trackBorder;
  ctx.lineWidth = 46;
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();

  // Main Light Cobblestones
  ctx.strokeStyle = map.trackColor;
  ctx.lineWidth = 38;
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();

  // Cobblestone Brick Grout Cracks
  ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 16]);
  ctx.beginPath();
  ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
  for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFoliageAndDecorations() {
  // Corner Pine Trees & Deciduous Bushes (matching reference photo)
  // Top Left Tree Canopy
  drawTreeCanopy(50, 40, 85, '#65a30d', '#3f6212');
  drawTreeCanopy(160, 50, 65, '#4d7c0f', '#365314');

  // Top Right Foliage
  drawTreeCanopy(800, 40, 75, '#65a30d', '#3f6212');
  drawTreeCanopy(920, 50, 85, '#4d7c0f', '#365314');

  // Bottom Left Pine Trees
  drawPineTree(40, 680);
  drawPineTree(80, 630);
  drawPineTree(40, 550);

  // Bottom Right Corner Trees
  drawPineTree(980, 680);
  drawPineTree(940, 620);

  // Scattered Wildflowers on Grass
  const flowers = [
    [100, 220], [320, 100], [520, 90], [680, 180], [780, 360],
    [320, 260], [480, 500], [680, 580], [120, 450], [860, 180]
  ];
  flowers.forEach(([fx, fy]) => {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(fx, fy, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(fx, fy, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawTreeCanopy(x, y, r, c1, c2) {
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.arc(x, y + 6, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawPineTree(x, y) {
  ctx.fillStyle = "#166534";
  ctx.beginPath();
  ctx.moveTo(x, y - 50);
  ctx.lineTo(x + 35, y);
  ctx.lineTo(x - 35, y);
  ctx.fill();
  ctx.fillStyle = "#15803d";
  ctx.beginPath();
  ctx.moveTo(x, y - 40);
  ctx.lineTo(x + 28, y - 5);
  ctx.lineTo(x - 28, y - 5);
  ctx.fill();
}

function drawRoadSpikes() {
  for (const s of roadSpikes) {
    ctx.fillStyle = "#94a3b8";
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const ang = (i / 4) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + Math.cos(ang) * 12, s.y + Math.sin(ang) * 12);
      ctx.stroke();
    }
  }
}

function drawTowers() {
  for (const t of towers) {
    ctx.save();
    ctx.translate(t.x, t.y);

    // High-tier glowing aura
    if (t.tierA >= 4 || t.tierB >= 4 || (t.isHero && heroLevel >= 10)) {
      ctx.save();
      const pulse = 14 + Math.sin(performance.now() * 0.006) * 5;
      ctx.shadowBlur = pulse;
      ctx.shadowColor = (t.tierA === 5 || t.tierB === 5 || heroLevel >= 20) ? "#facc15" : "#38bdf8";
      ctx.strokeStyle = ctx.shadowColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // BTD6 Circular Pedestal Base
    ctx.fillStyle = "#451a03";
    ctx.strokeStyle = "#d97706";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Turret / Barrel Direction
    if (!t.isFarm) {
      ctx.save();
      ctx.rotate(t.angle);
      if (t.key === 'bomb') {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, -7, 24, 14);
      } else if (t.key === 'super') {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(5, -4, 18, 8);
      }
      ctx.restore();
    }

    // High quality Emoji / Avatar character
    ctx.font = t.isHero ? "28px sans-serif" : "24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t.spec.icon, 0, 0);

    // Hero Crown or Upgrade Stars
    if (t.isHero) {
      ctx.font = "14px sans-serif";
      ctx.fillText("👑", 0, -22);
    } else {
      const tiers = t.tierA + t.tierB;
      if (tiers > 0) {
        ctx.font = "bold 11px sans-serif";
        ctx.fillStyle = "#facc15";
        ctx.fillText(`★${tiers}`, 0, -18);
      }
    }

    ctx.restore();
  }
}

function drawBloons() {
  for (const b of bloons) {
    ctx.save();
    ctx.translate(b.x, b.y);

    // Camo shimmer
    if (b.isCamo) {
      ctx.strokeStyle = "rgba(34, 197, 94, 0.8)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, b.r + 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Ice cube
    if (b.frozen > 0) {
      ctx.fillStyle = "rgba(56, 189, 248, 0.45)";
      ctx.strokeStyle = "#bae6fd";
      ctx.lineWidth = 2;
      ctx.strokeRect(-b.r - 2, -b.r - 2, (b.r + 2) * 2, (b.r + 2) * 2);
      ctx.fillRect(-b.r - 2, -b.r - 2, (b.r + 2) * 2, (b.r + 2) * 2);
    }

    // MOAB
    if (b.isMoab) {
      ctx.fillStyle = "#0284c7";
      ctx.strokeStyle = "#082f49";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.r * 1.5, b.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🦈 MOAB", 0, 0);

      // HP bar
      const pct = Math.max(0, b.hp / b.maxHp);
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(-30, -b.r - 12, 60, 6);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(-30, -b.r - 12, 60 * pct, 6);
    } else if (b.isCeramic) {
      // Ceramic clay pot
      ctx.fillStyle = "#b45309";
      ctx.strokeStyle = "#451a03";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(0, -2, b.r, b.r * 1.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`${b.hp}`, 0, -2);
    } else {
      // Standard Bloon with glossy shine
      ctx.fillStyle = b.spec.color === "rainbow" ? "#ec4899" : b.spec.color;
      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.ellipse(0, -2, b.r, b.r * 1.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Shiny highlight
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath();
      ctx.arc(-b.r * 0.35, -b.r * 0.5, b.r * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Bottom Knot
      ctx.fillStyle = b.spec.color === "rainbow" ? "#3b82f6" : b.spec.color;
      ctx.beginPath();
      ctx.moveTo(-3, b.r * 1.15);
      ctx.lineTo(3, b.r * 1.15);
      ctx.lineTo(0, b.r * 1.4);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    ctx.save();
    if (p.splash) {
      ctx.fillStyle = "#0f172a";
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const pt of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPlacementHover() {
  if (selectedPlacedTower) {
    ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
    ctx.fillStyle = "rgba(56, 189, 248, 0.12)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(selectedPlacedTower.x, selectedPlacedTower.y, selectedPlacedTower.range, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  if (selectedSlotKey && mousePos.x >= 0 && mousePos.y >= 0) {
    const spec = TOWER_SPECS[selectedSlotKey];
    const inWater = isPointInWater(mousePos.x, mousePos.y);
    const dTrack = distToTrack(mousePos.x, mousePos.y);
    let valid = dTrack >= 28 && cash >= spec.cost;
    if (spec.isWater && !inWater) valid = false;
    if (!spec.isWater && inWater) valid = false;

    for (const t of towers) {
      if (Math.hypot(t.x - mousePos.x, t.y - mousePos.y) < 36) valid = false;
    }

    ctx.strokeStyle = valid ? "rgba(34, 197, 94, 0.85)" : "rgba(239, 68, 68, 0.85)";
    ctx.fillStyle = valid ? "rgba(34, 197, 94, 0.15)" : "rgba(239, 68, 68, 0.15)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mousePos.x, mousePos.y, spec.range, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.font = "26px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(spec.icon, mousePos.x, mousePos.y);
  }
}

function drawOverlays() {
  if (lives <= 0) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ef4444";
    ctx.font = "bold 46px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("💀 DEFEAT!", W/2, H/2 - 20);

    ctx.fillStyle = "#fff";
    ctx.font = "20px system-ui, sans-serif";
    ctx.fillText(`Round Reached: ${round} / 40`, W/2, H/2 + 25);
    ctx.fillText("Click / Tap anywhere to restart", W/2, H/2 + 65);
  } else if (round > 40 && !waveActive && bloons.length === 0) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 46px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🏆 VICTORY!", W/2, H/2 - 20);

    ctx.fillStyle = "#fff";
    ctx.font = "20px system-ui, sans-serif";
    ctx.fillText("Alle 40 Runden überstanden!", W/2, H/2 + 25);
    ctx.fillText("Click / Tap to continue Freeplay", W/2, H/2 + 65);
  }
}

canvas.addEventListener("pointerdown", () => {
  if (lives <= 0) {
    lives = 200; cash = 650; round = 1; waveActive = false; waveQueue = [];
    bloons = []; towers = []; projectiles = []; particles = []; roadSpikes = [];
    heroLevel = 1; heroXp = 0; heroXpNext = 150;
    selectedPlacedTower = null; selectedSlotKey = null;
    closeUpgradeModal();
    document.getElementById("btn-forward").textContent = "▶️";
    document.getElementById("btn-forward").classList.remove("fast");
    updateHUD();
    updateWavePreviewTicker();
    updateHeroHUD();
  }
});

function fitViewport() {
  const vp = document.getElementById("game-viewport");
  const s = Math.min(1, window.innerWidth / 1280, window.innerHeight / 720);
  vp.style.transform = s < 1 ? `scale(${s})` : "none";
  vp.style.transformOrigin = "center center";
}
window.addEventListener("resize", fitViewport);
fitViewport();

// Initial Boot
updateHUD();
updateWavePreviewTicker();
updateHeroHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
