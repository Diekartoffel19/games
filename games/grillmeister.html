<script>
'use strict';

// ================= Modell: Grillgut, Hitze, Garstufen (reine Funktionen, siehe ?selftest) =================
const TAU = Math.PI * 2;
const SQ = 0.62; // Perspektive: Rost-Ellipse ist um diesen Faktor gestaucht
const TYPES = {
  wurst:   { name: 'Bratwurst',   raw: '#e9a9a2', done: '#a8552b', rate: 0.10,  fat: 1.0, shape: 'sausage', w: 58, h: 18 },
  steak:   { name: 'Steak',       raw: '#c9424c', done: '#7b4329', rate: 0.085, fat: 0.8, shape: 'steak',   w: 56, h: 40 },
  mais:    { name: 'Maiskolben',  raw: '#f3d84c', done: '#d79a2c', rate: 0.065, fat: 0,   shape: 'corn',    w: 62, h: 22 },
  kaese:   { name: 'Grillkäse',   raw: '#f5edd3', done: '#d8a443', rate: 0.14,  fat: 0.4, shape: 'cheese',  w: 44, h: 30 },
  tofu:    { name: 'Tofu-Wurst',  raw: '#efe2c1', done: '#b98b4b', rate: 0.16,  fat: 0.1, shape: 'sausage', w: 56, h: 17 },
  paprika: { name: 'Paprika',     raw: '#e23c2f', done: '#8f2b1b', rate: 0.11,  fat: 0,   shape: 'pepper',  w: 40, h: 34 },
  marsh:   { name: 'Marshmallow', raw: '#fffaf2', done: '#c98b3d', rate: 0.33,  fat: 0,   shape: 'marsh',   w: 28, h: 28 },
};
const BURNT = '#1b120c';
// Zielfenster je Bestellung (Garstufe 1.0 = klassisch perfekt, ab ~1.5 Kohle)
const WIN = {
  wurst:   { normal: { lo: 0.8, hi: 1.2, label: '' }, schwarz: { lo: 1.2, hi: 1.5, label: 'schön schwarz' } },
  steak:   { medium: { lo: 0.7, hi: 1.0, label: 'medium' }, durch: { lo: 1.05, hi: 1.35, label: 'durch' } },
  mais:    { normal: { lo: 0.85, hi: 1.35, label: '' } },
  kaese:   { normal: { lo: 0.7, hi: 1.05, label: '' } },
  tofu:    { normal: { lo: 0.8, hi: 1.15, label: 'vegan!' } },
  paprika: { normal: { lo: 0.8, hi: 1.3, label: '' } },
  marsh:   { normal: { lo: 0.65, hi: 1.0, label: 'goldbraun' } },
};
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mixRGB(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const A = hex2rgb(a), B = hex2rgb(b);
  return [0, 1, 2].map(i => Math.round(A[i] + (B[i] - A[i]) * t));
}
function doneRGB(type, d) {
  const T = TYPES[type];
  return d <= 1 ? mixRGB(T.raw, T.done, d) : mixRGB(T.done, BURNT, (d - 1) / 0.6);
}
const css = rgb => `rgb(${rgb})`;
// Kohlen liegen in Rost-Koordinaten (u,v) im Einheitskreis; Abstand ist dort isotrop.
function makeCoals(n, rnd) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU;
    const r = Math.min(0.86, 0.3 * Math.sqrt(-2 * Math.log(1 - rnd() * 0.999)));
    out.push({ u: Math.cos(a) * r, v: Math.sin(a) * r, heat: 0.9 + rnd() * 0.2, s: 0.7 + rnd() * 0.6 });
  }
  return out;
}
function rawHeatAt(coals, u, v, sigma) {
  const k = 1 / (2 * sigma * sigma);
  let s = 0;
  for (const c of coals) { const du = c.u - u, dv = c.v - v; s += c.heat * Math.exp(-(du * du + dv * dv) * k); }
  return s;
}
function cookStep(it, heat, dt) {
  const r = TYPES[it.type].rate * heat * dt;
  it.sides[it.down] += r;
  it.sides[1 - it.down] += r * 0.06; // aufsteigende Hitze gart die Oberseite nur minimal
}
function flipItem(it) { it.down = 1 - it.down; }
function sideScore(d, w) {
  if (d < w.lo) return Math.max(0, 1 - (w.lo - d) / 0.5);
  if (d > w.hi) return Math.max(0, 1 - (d - w.hi) / 0.35);
  return 1;
}
function itemQuality(it, w) {
  const a = sideScore(it.sides[0], w), b = sideScore(it.sides[1], w);
  return (Math.min(a, b) + (a + b) / 2) / 2;
}
function starsFor(avgQ, patienceRatio) {
  return Math.max(1, Math.min(5, Math.round((1 + 4 * avgQ) * (0.75 + 0.25 * patienceRatio))));
}
const SIGMA = 0.2;

// ================= Inhalte =================

  neighbour: ['Der Qualm zieht in meine Wäsche!', 'Das ist ein Kleingarten, kein Kraftwerk!', 'Ich ruf gleich das Ordnungsamt!', 'Paragraf 3 der Gartenordnung!', 'Meine Geranien husten!'],
  gerd: ['Junge, das macht man ganz anders!', 'Lass mal den Onkel ran.', 'Früher hatten wir nur Briketts!', 'Die muss in die Mitte!', 'Immer schön wenden!'],
  gerdBye: ['Na gut, ich hol mir\'n Bier.', 'Ihr jungen Leute wisst ja alles besser.'],
};
const UPGRADES = [
  { id: 'thermo', ic: '🌡️', name: 'Thermometer', price: 60, desc: 'Zeigt die Garstufe beider Seiten samt Zielbereich.' },
  { id: 'zange', ic: '🥢', name: 'Grillzange Pro', price: 80, desc: 'Schiebt doppelt so viel Glut, blitzschnelles Wenden.' },
  { id: 'wender', ic: '🌭', name: 'Würstchen-Wender', price: 90, desc: 'Wendet Brat- und Tofu-Würste automatisch.' },
  { id: 'pavillon', ic: '⛺', name: 'Pavillon', price: 100, desc: 'Regen? Egal. Der Grill bleibt trocken.' },
  { id: 'gas', ic: '🔥', name: 'Gasgrill-Brenner', price: 140, desc: 'Glut kühlt nie aus, erholt sich nach Wasser & Bier, halb so viele Stichflammen.' },
];
const EVENTS = ['hund', 'bier', 'gerd', 'wespen', 'regen', 'stichflamme'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ================= Spielstand =================
const SAVE_KEY = 'grillmeister_save';
const S = { evening: 1, money: 0, upgrades: {}, best: 0 };
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s) return;
    if (Number.isInteger(s.evening) && s.evening >= 1) S.evening = s.evening;
    if (Number.isFinite(s.money) && s.money >= 0) S.money = Math.floor(s.money);
    if (Number.isInteger(s.best) && s.best >= 0) S.best = s.best;
    if (s.upgrades && typeof s.upgrades === 'object') for (const u of UPGRADES) S.upgrades[u.id] = !!s.upgrades[u.id];
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  if (window.ArcadeCore) ArcadeCore.saveScore('grillmeister', S.best);
}
const has = id => !!S.upgrades[id];

// ================= Audio =================
const AC = window.ArcadeCore;
const Sfx = {
  ctx: null, buf: null, gain: null,
  init() {
    if (this.gain || !AC) return;
    const ctx = AC.getAudioContext();
    if (!ctx) return;
    try {
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.015 ? 1 : 0.3); // Knister-Spitzen
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 4300; f.Q.value = 0.6;
      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
      this.ctx = ctx; this.buf = buf; this.gain = g;
    } catch (e) {}
  },
  sizzle(level) {
    if (!this.gain) return;
    const v = AC.isMuted() ? 0 : Math.min(0.1, level);
    this.gain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.12);
  },
  noise(dur, freq, vol, type) {
    if (!this.buf || AC.isMuted()) return;
    try {
      const c = this.ctx, now = c.currentTime, src = c.createBufferSource();
      src.buffer = this.buf;
      const f = c.createBiquadFilter(); f.type = type || 'highpass'; f.frequency.value = freq;
      const g = c.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(now, Math.random()); src.stop(now + dur);
    } catch (e) {}
  },
};
const snd = (name, ...a) => { if (AC && AC[name]) AC[name](...a); };

// ================= Canvas & Layout =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, LW, LH, SC, portrait;
const L = {};
function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  portrait = W < H * 0.9;
  LW = portrait ? 600 : 1000; SC = W / LW; LH = H / SC;
  const minH = portrait ? 900 : 560;
  if (LH < minH) { SC = H / minH; LH = minH; LW = W / SC; }
  L.bot = LH - 74 / SC;
  if (!portrait) {
    L.fence = Math.max(70, LH * 0.15);
    const avail = L.bot - L.fence;
    L.grx = Math.min(250, avail * 0.6, LW * 0.25); L.gry = L.grx * SQ;
    L.gx = LW * 0.47; L.gy = L.fence + avail * 0.44;
    L.cooler = { x: 14, y: L.fence + 20, w: Math.min(190, LW * 0.19), h: Math.min(avail - 40, 420) };
    L.cols = 2;
    const top = L.fence + 50, step = (L.bot - 50 - top) / 3;
    L.slots = [0, 1, 2, 3].map(i => { const x = LW - 60, y = top + i * step; return { x, y, side: 'left', zone: { x: LW - 270, y: y - step / 2, w: 270, h: step } }; });
    L.ketchup = { x: L.cooler.x + L.cooler.w + 34, y: L.bot - 24 };
    L.gerd = { x: L.gx - L.grx * 0.75, y: L.gy + L.gry + 52 };
    L.neighbour = LW * 0.8;
  } else {
    L.fence = LH * 0.07;
    L.slots = [0, 1, 2, 3].map(i => { const x = 75 + 150 * i, y = L.fence + 150; return { x, y, side: 'top', zone: { x: x - 75, y: y - 150, w: 150, h: 230 } }; });
    const ch = 110;
    L.cooler = { x: 10, y: L.bot - ch - 10, w: LW - 20, h: ch };
    L.cols = 7;
    const top = L.fence + 240, avail = L.cooler.y - 20 - top;
    L.grx = Math.min(260, LW * 0.42, avail * 0.55); L.gry = L.grx * SQ;
    L.gx = LW / 2; L.gy = top + avail * 0.4;
    L.ketchup = { x: LW - 45, y: L.cooler.y - 34 };
    L.gerd = { x: L.gx - L.grx * 0.8, y: L.gy + L.gry + 48 };
    L.neighbour = LW * 0.22;
  }
  const keys = Object.keys(TYPES), cols = L.cols, rows = Math.ceil(keys.length / cols), c = L.cooler, pad = 8, head = 24;
  const cw = (c.w - pad * 2) / cols, chh = (c.h - pad * 2 - head) / rows;
  L.cells = keys.map((k, i) => ({ type: k, x: c.x + pad + (i % cols) * cw, y: c.y + head + pad + Math.floor(i / cols) * chh, w: cw, h: chh }));
}
const toScreen = (u, v) => [L.gx + u * L.grx, L.gy + v * L.gry];
const toUV = (x, y) => [(x - L.gx) / L.grx, (y - L.gy) / L.gry];
const onGrate = (x, y, m = 0.88) => { const [u, v] = toUV(x, y); return u * u + v * v <= m * m; };
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

// ================= Abend-Zustand =================
let G = null;
let state = 'menu'; // menu | play | busted | result
let tool = 'hand';
let nextId = 1;

function startEvening() {
  const e = S.evening;
  const coals = makeCoals(46, Math.random);
  G = {
    t: 0, items: [], coals, flames: [], parts: [], popups: [], says: [],
    slots: [null, null, null, null],
    total: Math.min(26, 3 + e * 2), toSpawn: Math.min(26, 3 + e * 2), spawnT: 2,
    served: 0, starsSum: 0, starsN: 0, earned: 0, meter: 0, smoke: 0,
    norm: 1.25 / Math.max(0.5, rawHeatAt(coals, 0, 0, SIGMA)),
    eventT: 14 + Math.random() * 6, rain: 0, umbrella: false, dog: null, gerd: null, wasps: [], beer: null,
    shake: 0, fan: null, drag: null, sprayCD: 0, neigh: { rise: 0, said: 0, t: 0, line: '' }, endT: -1, bustT: 0,
  };
  state = 'play';
  setTool('hand');

  banner(`Abend ${e}`, `${G.total} hungrige Gäste im Anmarsch`);
}
function rawWeather() {
  if (G.rain <= 0 || G.umbrella || has('pavillon')) return 1;
  return has('gas') ? 0.75 : 0.45;
}
function flameHeat(u, v) {
  let s = 0;
  for (const f of G.flames) { const du = f.u - u, dv = f.v - v; s += f.int * 1.4 * Math.exp(-(du * du + dv * dv) / 0.03); }
  return s;
}
function heatAt(u, v) {
  return Math.min(1.9, rawHeatAt(G.coals, u, v, SIGMA) * G.norm * rawWeather()) + flameHeat(u, v);
}

// ================= Gäste =================
function spawnGuest() {
  const slot = G.slots.findIndex(s => !s);
  if (slot < 0) return;
  const present = G.slots.filter(Boolean).map(g => g.ch.name);
  const ch = pick(CHARS.filter(c => !present.includes(c.name)));
  const e = S.evening;
  const n = 1 + (Math.random() < 0.25 + e * 0.06 ? 1 : 0) + (e >= 4 && Math.random() < 0.15 ? 1 : 0);
  const orders = [];
  for (let i = 0; i < n; i++) {
    const type = pick(ch.likes);
    const vs = Object.keys(WIN[type]);
    const variant = type === 'wurst' ? (Math.random() < 0.45 ? 'schwarz' : 'normal') : type === 'steak' ? (Math.random() < 0.7 ? 'medium' : 'durch') : vs[0];
    orders.push({ type, variant, done: false, q: 0 });
  }
  const pat = Math.max(38, 70 - e * 3) + n * 18;
  const g = { ch, orders, pat, max: pat, enter: 0, leave: -1, warned: false, stars: 0 };
  G.slots[slot] = g;
  G.toSpawn--;
  const o = orders[0];
  say(slot, pick(LINES.order[o.type + ':' + o.variant] || ['Hunger!']), 3);
  snd('pop', 1.4);
}
function say(slot, text, dur) {
  G.says = G.says.filter(s => s.slot !== slot);
  G.says.push({ slot, text, t: dur || 2.6 });
}
function guestLeave(slot, angry) {
  const g = G.slots[slot];
  if (!g || g.leave >= 0) return;
  const done = g.orders.filter(o => o.done);
  const avgQ = done.length ? g.orders.reduce((a, o) => a + o.q, 0) / g.orders.length : 0;
  g.stars = angry ? 1 : starsFor(avgQ, g.pat / g.max);
  g.leave = 0;
  G.starsSum += g.stars; G.starsN++;
  if (!angry) {
    G.served++;
    const tip = Math.max(0, g.stars - 2) * 2;
    if (tip) { addMoney(tip); popup(L.slots[slot].x, L.slots[slot].y - 40, `Trinkgeld +${tip} €`, '#ffd54f'); }
    popup(L.slots[slot].x, L.slots[slot].y - 62, '★'.repeat(g.stars), '#ffc83d');
    if (g.stars >= 4) snd('powerup');
  } else {
    say(slot, pick(LINES.angry), 2.2);
    popup(L.slots[slot].x, L.slots[slot].y - 40, '★ Wütend weg', '#ff7043');
    snd('hit');
  }
}
function addMoney(n) { S.money += n; G.earned += n; }
function serve(slot, it) {
  const g = G.slots[slot];
  if (!g || g.leave >= 0) return false;
  const T = TYPES[it.type];
  if (g.ch.vegan && T.fat >= 0.8) {
    say(slot, pick(LINES.vegan), 2.4);
    g.pat = Math.max(0, g.pat - g.max * 0.2);
    snd('hit');
    return false;
  }
  const o = g.orders.find(o => !o.done && o.type === it.type);
  if (!o) { say(slot, pick(LINES.wrong), 2); snd('playTone', 180, 0.15, 'square', 0.08); return false; }
  const w = WIN[o.type][o.variant];
  const q = itemQuality(it, w);
  o.done = true; o.q = q;
  const base = 3 + Math.round(q * 4);
  addMoney(base);
  const s = L.slots[slot];
  let txt, col, line;
  if (q >= 0.85) { txt = 'Perfekt!'; col = '#9ccc65'; line = pick(LINES.perfect); }
  else if (q >= 0.5) { txt = 'Okay'; col = '#ffd54f'; line = pick(LINES.good); }
  else {
    const avg = (it.sides[0] + it.sides[1]) / 2;
    const burnt = avg > w.hi || Math.max(it.sides[0], it.sides[1]) > w.hi + 0.35;
    txt = burnt ? 'Verbrannt!' : 'Roh!'; col = '#ff7043'; line = pick(burnt ? LINES.burnt : LINES.raw);
  }
  popup(s.x - 30, s.y - 10, `${txt} +${base} €`, col);
  say(slot, line, 2.2);
  snd('coin');
  if (g.orders.every(o => o.done)) guestLeave(slot, false);
  return true;
}

// ================= Effekte =================
function popup(x, y, text, color) { G.popups.push({ x, y, text, color, t: 1.6 }); }

function spawnFlame(u, v, int, big) {

// ================= Ereignisse =================
function triggerEvent(name) {
  const e = name;
  if (e === 'hund' && !G.dog) {
    G.dog = { x: -60, y: L.gy + L.gry * 0.9, st: 'come', taps: 0, t: 0, carry: null, dir: 1 };
    banner('🐕 Hund im Anmarsch!', 'Antippen zum Verscheuchen (2×)');
    snd('playTone', 520, 0.12, 'square', 0.08);
  } else if (e === 'bier' && !G.beer) {
    const a = rand(0, TAU), r = rand(0, 0.5);
    G.beer = { u: Math.cos(a) * r, v: Math.sin(a) * r, t: 0 };
    banner('🍺 Bier umgekippt!', 'Glut gelöscht – fächeln hilft');
  } else if (e === 'gerd' && !G.gerd) {
    G.gerd = { x: -50, t: 16, act: 3, gone: false };
    banner('🧔 Onkel Gerd kommt', 'Er hat Ratschläge. Antippen = wegschicken');
  } else if (e === 'wespen' && !G.wasps.length) {
    for (let i = 0; i < 3 + Math.min(4, S.evening); i++) G.wasps.push({ a: rand(0, TAU), r: rand(14, 34), sp: rand(2, 4), off: rand(0, 10), out: 0, vx: 0, vy: 0 });
    G.waspT = 28;
    banner('🐝 Wespen am Ketchup!', 'Gäste werden ungeduldig – antippen!');
  } else if (e === 'regen' && G.rain <= 0) {
    G.rain = 16; G.umbrella = false;
    banner('🌧️ Regenschauer!', has('pavillon') ? 'Der Pavillon hält dicht.' : 'Schirm aufspannen!');
  } else if (e === 'stichflamme') {
    banner('🔥 Grillanzünder-Stichflamme!', 'Wer hat da nachgekippt?!');
    for (let i = 0; i < 3; i++) spawnFlame(rand(-0.2, 0.2), rand(-0.2, 0.2), 1.4, i === 0);
    for (const it of G.items) { const d = Math.hypot(it.u, it.v); if (d < 0.45) it.sides[it.down] += 0.25; }
    const [x, y] = toScreen(0, 0);
    smokeAt(x, y, 18, true);
    G.meter = Math.min(1, G.meter + 0.06);
  }
}
function updateEvents(dt) {
  G.eventT -= dt;
  if (G.eventT <= 0 && G.toSpawn + G.slots.filter(Boolean).length > 0) {
    const pool = EVENTS.slice(0, Math.min(EVENTS.length, S.evening * 2));
    triggerEvent(pick(pool));
    G.eventT = Math.max(10, 24 - S.evening * 1.5) + Math.random() * 10;
  }
  // Hund
  const d = G.dog;
  if (d) {
    d.t += dt;
    if (d.st === 'come') {
      let tgt = G.items.filter(i => !i.drag).sort((a, b) => (TYPES[b.type].fat - TYPES[a.type].fat))[0];
      let tx, ty;
      if (tgt) [tx, ty] = toScreen(tgt.u, tgt.v); else { tx = L.gx - L.grx; ty = L.gy + L.gry; }
      const dx = tx - d.x, dy = ty - d.y, dist = Math.hypot(dx, dy);
      d.dir = dx >= 0 ? 1 : -1;
      if (dist > 4) { d.x += dx / dist * 85 * dt; d.y += dy / dist * 85 * dt; }
      if (tgt && dist < 24) {
        G.items.splice(G.items.indexOf(tgt), 1);
        d.carry = tgt.type; d.st = 'flee';
        banner('🐕 Weg ist die ' + TYPES[tgt.type].name + '!', 'Der Hund freut sich.');
        snd('playTone', 700, 0.1, 'square', 0.08);
      }
      if (d.t > 22) d.st = 'flee';
    } else {
      d.dir = -1; d.x -= 190 * dt;
      if (d.x < -80) G.dog = null;
    }
  }
  // Onkel Gerd
  const g = G.gerd;
  if (g) {
    const tx = g.gone ? -80 : L.gerd.x;
    g.x += clamp(tx - g.x, -110 * dt, 110 * dt);
    if (!g.gone) {
      g.t -= dt; g.act -= dt;
      if (g.act <= 0 && Math.abs(g.x - tx) < 2) {
        g.act = 3.2;
        const cand = G.items.filter(i => !i.drag);
        if (cand.length) {
          const it = pick(cand);
          if (Math.random() < 0.5) { it.u = rand(-0.12, 0.12); it.v = rand(-0.12, 0.12); g.line = 'Die muss in die Mitte!'; }
          else { flipItem(it); it.flip = 1; g.line = 'Immer schön wenden!'; }
          snd('pop', 0.8);
        } else g.line = pick(LINES.gerd);
        g.lineT = 2.4;
      }
      if (g.t <= 0) { g.gone = true; g.line = pick(LINES.gerdBye); g.lineT = 2.4; }
    } else if (g.x <= -75) G.gerd = null;
    if (g.lineT) g.lineT -= dt;
  }
  // Wespen
  if (G.wasps.length) {
    G.waspT -= dt;
    for (const w of G.wasps) { if (w.out) { w.out += dt; } }
    G.wasps = G.wasps.filter(w => w.out < 1.2);
    if (G.waspT <= 0) G.wasps.forEach(w => { if (!w.out) shooWasp(w); });
    if (G.wasps.some(w => !w.out) && Math.random() < dt * 2) snd('playTone', rand(210, 260), 0.12, 'sawtooth', 0.025);
  }
  // Regen
  if (G.rain > 0) {
    G.rain -= dt;
    const covered = G.umbrella || has('pavillon');
    for (let i = 0; i < 6; i++) part({ k: 'rain', x: rand(0, LW), y: rand(-20, LH), vx: -40, vy: 700, life: 0.25, max: 0.25 });
    if (!covered && Math.random() < dt * 4) { const c = pick(G.coals); const [x, y] = toScreen(c.u, c.v); steamAt(x, y, 2); }
    if (G.rain <= 0) { G.umbrella = false; banner('☀️ Regen vorbei', ''); }
  }
  // Bier
  const b = G.beer;
  if (b) {
    b.t += dt;
    if (b.t >= 0.6 && !b.hit) {
      b.hit = true;
      for (const c of G.coals) if (Math.hypot(c.u - b.u, c.v - b.v) < 0.32) c.heat *= 0.2;
      G.flames = G.flames.filter(f => Math.hypot(f.u - b.u, f.v - b.v) > 0.32);
      const [x, y] = toScreen(b.u, b.v);
      steamAt(x, y, 22);
      for (let i = 0; i < 16; i++) part({ k: 'beer', x, y, vx: rand(-90, 90), vy: rand(-120, -20), r: rand(2, 4), life: 0.6, max: 0.6 });
      Sfx.noise(0.8, 2500, 0.18);
      snd('pop', 0.6);
    }
    if (b.t > 1.6) G.beer = null;
  }
}
function shooWasp(w) { w.out = 0.001; const a = rand(0, TAU); w.vx = Math.cos(a) * 260; w.vy = Math.sin(a) * 260 - 80; }
function waspPos(w) {
  const k = L.ketchup;
  if (w.out) return [k.x + Math.cos(w.a) * w.r + w.vx * w.out, k.y - 20 + Math.sin(w.a) * w.r * 0.6 + w.vy * w.out];
  return [k.x + Math.cos(w.a) * w.r, k.y - 20 + Math.sin(w.a) * w.r * 0.6 + Math.sin(G.t * 9 + w.off) * 5];
}

// ================= Update =================
function update(dt) {
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) document.getElementById('banner').classList.remove('show'); }
  if (!G) return;
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 30);
  updateParticles(dt);
  if (state === 'busted') {
    G.bustT += dt;
    if (G.bustT > 2.8) finishEvening('busted');
    return;
  }
  if (state !== 'play') return;

  // Glut
  const gas = has('gas');
  for (const c of G.coals) c.heat = gas ? c.heat + (1 - c.heat) * Math.min(1, dt * 0.08) : Math.max(0.12, c.heat - 0.0035 * dt);
  // Fächeln
  const f = G.fan;
  if (f && f.on) {
    f.wob += dt * 18;
    const [fu, fv] = toUV(f.x, f.y);
    const boost = 0.35 + Math.min(1.2, f.speed / 400);
    for (const c of G.coals) if (Math.hypot(c.u - fu, c.v - fv) < 0.5) c.heat = Math.min(1.5, c.heat + dt * boost * 0.4);
    f.speed *= Math.pow(0.05, dt);
    if (Math.random() < dt * 3) Sfx.noise(0.25, 600, 0.05, 'bandpass');
  }
  G.sprayCD -= dt;
  G.fanGlow = f && f.on ? 1 : 0;

  // Grillgut garen
  let sizzle = 0, smoke = 0;
  for (const it of G.items) {
    if (it.flip > 0) it.flip = Math.max(0, it.flip - dt * (has('zange') ? 8 : 3.5));
    if (it.drag) continue;
    const h = heatAt(it.u, it.v);
    cookStep(it, h, dt);
    sizzle += Math.max(0, h - 0.3) * 0.022;
    const [x, y] = toScreen(it.u, it.v);
    if (h > 0.6 && Math.random() < dt * h * 2.5) part({ k: 'smoke', x: x + rand(-12, 12), y: y - 4, vx: rand(-6, 6), vy: -30, r: 3, g: 10, life: 0.8, max: 0.8, c: 235 });
    const maxD = Math.max(it.sides[0], it.sides[1]);
    if (maxD > 1.5) { smoke += 0.6; if (Math.random() < dt * 4) smokeAt(x, y - 6, 1, true); }
    // Fett tropft -> Stichflamme
    const fat = TYPES[it.type].fat;
    if (fat > 0 && h > 0.55) {
      const p = fat * (h - 0.55) * 0.18 * dt * (f && f.on ? 1.6 : 1) * (gas ? 0.5 : 1);
      if (Math.random() < p) {
        part({ k: 'drip', x, y: y + 6, vx: 0, vy: 40, r: 2.5, life: 0.3, max: 0.3 });
        Sfx.noise(0.12, 3000, 0.08);
        if (Math.random() < 0.55) spawnFlame(it.u + rand(-0.06, 0.06), it.v + rand(-0.04, 0.06));
      }
    }
    // Würstchen-Wender
    if (has('wender') && (it.type === 'wurst' || it.type === 'tofu')) {
      it.wcd = (it.wcd || 0) - dt;
      if (it.wcd <= 0 && it.sides[it.down] - it.sides[1 - it.down] > 0.22) { flipItem(it); it.flip = 1; it.wcd = 1.5; }
    }
  }
  // Flammen
  for (const fl of G.flames) {
    fl.life -= dt;
    const fuel = G.items.some(it => !it.drag && TYPES[it.type].fat > 0.3 && Math.hypot(it.u - fl.u, it.v - fl.v) < 0.16);
    if (fuel) fl.life = Math.min(5, fl.life + dt * 0.55);
    fl.int = Math.min(fl.int, fl.life / 1.2 + 0.2);
    smoke += fl.int;
    sizzle += 0.03 * fl.int;
    const [x, y] = toScreen(fl.u, fl.v);
    if (Math.random() < dt * 6 * fl.int) smokeAt(x, y - 20, 1, true);
    if (Math.random() < dt * 0.35 * fl.int) {
      const near = G.items.find(it => !it.drag && TYPES[it.type].fat > 0.3 && Math.hypot(it.u - fl.u, it.v - fl.v) < 0.45 && !G.flames.some(o => Math.hypot(o.u - it.u, o.v - it.v) < 0.12));
      if (near) spawnFlame(near.u, near.v + 0.03);
    }
  }
  G.flames = G.flames.filter(fl => fl.life > 0);
  // Qualm & Nachbar
  let coalHeat = 0;
  for (const c of G.coals) coalHeat += c.heat;
  smoke += coalHeat * 0.006 + (G.rain > 0 && G.umbrella ? 0.35 : 0) + (f && f.on ? 0.15 : 0);
  G.smoke = smoke;
  if (Math.random() < dt * 2.5) { const c = pick(G.coals); const [x, y] = toScreen(c.u, c.v); smokeAt(x, y - 10, 1, false); }
  G.meter = clamp(G.meter + (smoke * 0.028 - 0.016) * dt, 0, 1);
  const n = G.neigh;
  n.rise += ((G.meter > 0.35 || n.t > 0 ? 1 : 0) - n.rise) * Math.min(1, dt * 4);
  if (n.t > 0) n.t -= dt;
  const th = [0.4, 0.65, 0.85];
  if (n.said < th.length && G.meter >= th[n.said]) { n.line = LINES.neighbour[Math.min(LINES.neighbour.length - 1, n.said * 2 + Math.floor(Math.random() * 2))]; n.t = 3; n.said++; shake(4); snd('playTone', 150, 0.3, 'sawtooth', 0.08); }
  if (n.said > 0 && G.meter < th[n.said - 1] - 0.15) n.said--;
  if (G.meter >= 1) {
    state = 'busted'; G.bustT = 0; n.line = 'ORDNUNGSAMT! Sofort ausmachen!'; n.t = 5;
    banner('🚨 ORDNUNGSAMT!', 'Die Party ist vorbei.', 3);
    snd('gameOver'); shake(14);
    Sfx.sizzle(0);
    return;
  }
  Sfx.sizzle(sizzle);

  // Gäste
  if (G.toSpawn > 0) {
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.slots.some(s => !s)) { spawnGuest(); G.spawnT = Math.max(5, 13 - S.evening) + rand(0, 4); }
  }
  const waspMul = G.wasps.some(w => !w.out) ? 1.6 : 1;
  G.slots.forEach((g, i) => {
    if (!g) return;
    g.enter = Math.min(1, g.enter + dt * 2.5);
    if (g.leave >= 0) { g.leave += dt * 1.6; if (g.leave >= 1) G.slots[i] = null; return; }
    g.pat -= dt * waspMul;
    if (!g.warned && g.pat < g.max * 0.3) { g.warned = true; say(i, pick(LINES.wait), 2.5); }
    if (g.pat <= 0) guestLeave(i, true);
  });
  G.says.forEach(s => s.t -= dt);
  G.says = G.says.filter(s => s.t > 0);
  updateEvents(dt);
  // Abend vorbei?
  if (G.toSpawn === 0 && G.slots.every(s => !s)) {
    if (G.endT < 0) G.endT = 1.5;
    G.endT -= dt;
    if (G.endT <= 0) finishEvening('done');
  }
}
function updateParticles(dt) {
  for (const p of G.parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'smoke') { p.r += p.g * dt; p.vx += 6 * dt; }
    if (p.k === 'spark' || p.k === 'beer' || p.k === 'water') p.vy += 300 * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);

function draw() {
  ctx.setTransform(dpr * SC, 0, 0, dpr * SC, 0, 0);

// ================= Selbsttest (?selftest) =================
function selfTest() {
  const res = [];
  const ok = (name, cond) => { res.push([name, !!cond]); console.assert(cond, '[Grillmeister selftest] ' + name); };
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const coals = makeCoals(46, rnd);
  const hc = rawHeatAt(coals, 0, 0, SIGMA), he = rawHeatAt(coals, 0.85, 0, SIGMA);
  ok('Mitte heißer als Rand', hc > he * 2);
  ok('Kohlen bleiben im Rost', coals.every(c => Math.hypot(c.u, c.v) <= 0.861));
  ok('Kohlen weggeschoben -> Mitte kalt', rawHeatAt(coals.map(c => ({ ...c, u: c.u + 3 })), 0, 0, SIGMA) < hc * 0.01);
  const it = { type: 'wurst', sides: [0, 0], down: 0 };
  for (let i = 0; i < 100; i++) cookStep(it, 1, 0.1);
  ok('Unterseite gart (10 s bei Hitze 1 -> 1.0)', Math.abs(it.sides[0] - 1) < 0.01);
  ok('Oberseite gart kaum', it.sides[1] < 0.1);
  ok('Rohe Oberseite: Wurst noch nicht perfekt', itemQuality(it, WIN.wurst.normal) < 0.85);
  flipItem(it);
  ok('Wenden tauscht Seite', it.down === 1);
  for (let i = 0; i < 100; i++) cookStep(it, 1, 0.1);
  ok('Beidseitig gegart = perfekt', itemQuality(it, WIN.wurst.normal) > 0.99);
  ok('Perfekt ist nicht "schön schwarz"', itemQuality(it, WIN.wurst.schwarz) < 0.95);
  ok('Rohe Wurst schlecht', itemQuality({ type: 'wurst', sides: [0, 0], down: 0 }, WIN.wurst.normal) < 0.05);
  ok('Kohle-Wurst schlecht', itemQuality({ type: 'wurst', sides: [2, 2], down: 0 }, WIN.wurst.normal) === 0);
  const hot = { type: 'steak', sides: [0, 0], down: 0 }, cold = { type: 'steak', sides: [0, 0], down: 0 };
  cookStep(hot, hc * 1.25 / hc, 5); cookStep(cold, he * 1.25 / hc, 5);
  ok('Steak in der Mitte gart schneller als am Rand', hot.sides[0] > cold.sides[0] * 2);
  const lum = c => c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
  ok('Farbe: roh > gar > verbrannt (Helligkeit)', lum(doneRGB('wurst', 0)) > lum(doneRGB('wurst', 1)) && lum(doneRGB('wurst', 1)) > lum(doneRGB('wurst', 1.6)));
  ok('Sterne: perfekt & geduldig = 5', starsFor(1, 1) === 5);
  ok('Sterne: Minimum 1', starsFor(0, 0) === 1);
  // Simulation: Abend mit allen Ereignissen durchspielen, ohne Fehler
  const backup = (() => { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } })();
  const sBackup = JSON.stringify(S);
  let simErr = null;
  try {
    startEvening();
    for (const k of Object.keys(TYPES)) G.items.push({ id: nextId++, type: k, sides: [0, 0], down: 0, u: rand(-0.4, 0.4), v: rand(-0.4, 0.4), flip: 0 });
    EVENTS.forEach((e, i) => { G.eventT = 999; for (let s = 0; s < 60; s++) { if (s === 5) triggerEvent(e); update(1 / 30); } });
    onDown({ x: L.gx, y: L.gy }); onUp({ x: L.gx, y: L.gy });
    setTool('fan'); onDown({ x: L.gx, y: L.gy }); onMove({ x: L.gx + 30, y: L.gy }); update(0.1); onUp({ x: L.gx, y: L.gy });
    setTool('tongs'); onDown({ x: L.gx, y: L.gy }); onMove({ x: L.gx + 40, y: L.gy }); onUp({ x: L.gx, y: L.gy });
    setTool('water'); spawnFlame(0, 0); G.sprayCD = 0; onDown({ x: L.gx, y: L.gy }); onUp({ x: L.gx, y: L.gy });
    ok('Wasser löscht Flamme in der Mitte', !G.flames.some(f => Math.hypot(f.u, f.v) < 0.1));
    setTool('hand');
    const gi = G.slots.findIndex(Boolean);
    if (gi >= 0) { const o = G.slots[gi].orders[0]; serve(gi, { type: o.type, sides: [1, 1], down: 0 }); }
    for (let s = 0; s < 300; s++) { update(1 / 30); draw(); }
  } catch (e) { simErr = e; console.error(e); }
  ok('Simulation (alle Ereignisse, Werkzeuge, Servieren) ohne Fehler' + (simErr ? ': ' + simErr.message : ''), !simErr);
  Object.assign(S, JSON.parse(sBackup));
  try { if (backup === null) localStorage.removeItem(SAVE_KEY); else localStorage.setItem(SAVE_KEY, backup); } catch (e) {}
  G = null; Sfx.sizzle(0);
  const pass = res.filter(r => r[1]).length;
  console.log(`[Grillmeister selftest] ${pass}/${res.length} bestanden`);
  res.forEach(r => console.log(`  ${r[1] ? 'OK  ' : 'FAIL'} ${r[0]}`));
  document.body.dataset.selftest = `${pass === res.length ? 'PASS' : 'FAIL'} ${pass}/${res.length}` + res.filter(r => !r[1]).map(r => ' | ' + r[0]).join('');
}

// ================= Loop =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  updateHud(dt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden) Sfx.sizzle(0); });
loadSave();
layout();
if (new URLSearchParams(location.search).has('selftest')) selfTest();
showMenu();
requestAnimationFrame(loop);
</script>
