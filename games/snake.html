<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Snake</title><link rel="stylesheet" href="../style.css"></head>
<body>
<a class="back" href="../index.html">← Back</a>
<h1>🐍 Snake</h1>
<p class="info">Score: <b id="score">0</b> · Best: <b id="best">0</b></p>
<canvas id="c" width="560" height="560"></canvas>
<p class="info">Arrows / WASD to move · Space to start/pause</p>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const N = 20, S = c.width / N;
let snake, dir, nextDir, food, score, state, acc, speed, particles = [];
let best = +localStorage.snakeBest || 0;
document.getElementById("best").textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0}; score = 0; speed = 0.12; acc = 0; state = "ready";
  placeFood(); document.getElementById("score").textContent = 0;
}
function placeFood() {
  do food = { x: Math.random()*N|0, y: Math.random()*N|0 };
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
const DIRS = { ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1], ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0] };
addEventListener("keydown", e => {
  if (DIRS[e.code]) {
    e.preventDefault();
    const [x, y] = DIRS[e.code];
    if (x !== -dir.x || y !== -dir.y) nextDir = {x, y};
    if (state === "ready") state = "play";
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "over") reset(); else state = state === "play" ? "pause" : "play";
  }
});
function step() {
  dir = nextDir;
  const h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
  if (snake.some(s => s.x === h.x && s.y === h.y)) {
    state = "over";
    if (score > best) { best = score; localStorage.snakeBest = best; document.getElementById("best").textContent = best; }
    return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score++; document.getElementById("score").textContent = score;
    for (let i = 0; i < 16; i++) particles.push({ x:(food.x+.5)*S, y:(food.y+.5)*S, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6, life:1 });
    speed = Math.max(0.05, speed - 0.003); placeFood();
  } else snake.pop();
}
function draw(t) {
  // checker background
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = (x + y) % 2 ? "#1a2e1a" : "#1f361f"; ctx.fillRect(x*S, y*S, S, S);
  }
  // food (pulsing apple)
  const p = 1 + Math.sin(t / 150) * 0.08;
  ctx.save(); ctx.translate((food.x+.5)*S, (food.y+.5)*S); ctx.scale(p, p);
  ctx.shadowColor = "#ff4d4d"; ctx.shadowBlur = 20;
  ctx.fillStyle = "#ff3b3b"; ctx.beginPath(); ctx.arc(0, 2, S*0.38, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "#4caf50"; ctx.beginPath(); ctx.ellipse(4, -S*0.35, 6, 3, -0.5, 0, 7); ctx.fill();
  ctx.restore();
  // snake
  snake.forEach((s, i) => {
    const k = 1 - i / snake.length * 0.5;
    ctx.fillStyle = `hsl(${130 - i * 2}, 70%, ${55 * k}%)`;
    ctx.beginPath(); ctx.roundRect(s.x*S+2, s.y*S+2, S-4, S-4, 8); ctx.fill();
  });
  // eyes
  const h = snake[0], cx = (h.x+.5)*S, cy = (h.y+.5)*S;
  [[-1],[1]].forEach(([side]) => {
    const ex = cx + dir.x*5 + dir.y*side*7, ey = cy + dir.y*5 - dir.x*side*7;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(ex + dir.x*2, ey + dir.y*2, 2.5, 0, 7); ctx.fill();
  });
  // particles
  particles.forEach(q => { q.x += q.vx; q.y += q.vy; q.life -= 0.03;
    ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = "#ffd54f"; ctx.fillRect(q.x, q.y, 4, 4); });
  ctx.globalAlpha = 1; particles = particles.filter(q => q.life > 0);
  // overlay
  const msg = { ready: ["Snake", "Press an arrow key to start"], pause: ["Paused", "Space to resume"], over: ["Game Over", `Score ${score} · Space to retry`] }[state];
  if (msg) {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 50px sans-serif"; ctx.fillText(msg[0], c.width/2, c.height/2);
    ctx.font = "20px sans-serif"; ctx.fillText(msg[1], c.width/2, c.height/2 + 40);
  }
}
let last;
function loop(t) {
  const dt = (t - (last ?? t)) / 1000; last = t;
  if (state === "play") { acc += dt; while (acc > speed && state === "play") { acc -= speed; step(); } }
  draw(t); requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
