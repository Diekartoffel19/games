<style>
  /* Physik-Labor: Blaupausen-Look – Kreide-Linien auf nachtblauem Konstruktionspapier, Messing-Akzente */
  :root{
    --bg:#0c2434; --ink:#e8f4fa; --dim:#8fb4c8; --acc:#ffb347; --acc2:#4ecdc4; --line:rgba(180,225,245,.32);
    --panel:rgba(8,26,38,.9);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"Consolas","Lucida Console","Courier New",monospace;color:var(--ink);padding:0;text-align:left;
       touch-action:none;-webkit-user-select:none;user-select:none;}
  canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;margin:0;border:0;border-radius:0;max-width:none;background:var(--bg);cursor:crosshair;touch-action:none;}
  .back{position:fixed;top:10px;left:10px;}
  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
       background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13px;letter-spacing:.3px;
       max-width:calc(100vw - 230px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #hud b{color:var(--acc);}
  #hud i{color:#ff9b9b;font-style:normal;}
  #dock{position:fixed;left:8px;right:8px;bottom:8px;z-index:6;display:flex;overflow-x:auto;padding-bottom:2px;
        -webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #dock::-webkit-scrollbar{display:none;}
  #dockIn{display:flex;gap:5px;margin:0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px;}
  .tool{position:relative;flex:0 0 auto;width:60px;height:58px;border-radius:8px;border:1.5px solid transparent;background:transparent;color:var(--ink);
        font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation;}
  .tool span{font-size:21px;line-height:1;}
  .tool kbd{position:absolute;top:2px;right:4px;font:inherit;font-size:8.5px;opacity:.5;}
  .tool:hover{border-color:var(--line);}
  .tool.on{background:var(--acc);color:#10222e;border-color:var(--acc);font-weight:bold;}
  #gear{position:fixed;top:10px;right:10px;z-index:8;width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);
        color:var(--ink);font-size:20px;cursor:pointer;touch-action:manipulation;}
  #panel{position:fixed;top:56px;right:10px;z-index:7;width:236px;max-height:calc(100vh - 150px);overflow-y:auto;background:var(--panel);
         border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;scrollbar-width:thin;}
  #panel.hide{display:none;}
  #panel h4{margin:10px 0 6px;font-size:11px;letter-spacing:1.5px;color:var(--acc2);text-transform:uppercase;}
  #panel h4:first-child{margin-top:0;}
  .row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .row label{flex:0 0 72px;color:var(--dim);}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--acc);}
  .row output{flex:0 0 36px;text-align:right;color:var(--acc);}
  .chk{display:flex;align-items:center;gap:6px;margin:5px 0;cursor:pointer;}
  .chk input{accent-color:var(--acc);}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .btn{font:inherit;font-size:11.5px;padding:7px 4px;border-radius:6px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;touch-action:manipulation;}
  .grid3 .btn{font-size:10.5px;padding:6px 2px;}
  .btn:hover{border-color:var(--acc2);}
  .btn.on{background:var(--acc2);color:#07202a;border-color:var(--acc2);font-weight:bold;}
  .btn.danger:hover{border-color:#ff6b6b;color:#ff9b9b;}
  .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.45);}
  #toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:var(--acc);color:#10222e;font-weight:bold;padding:6px 14px;border-radius:8px;
         z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;font-size:13px;max-width:calc(100vw - 32px);text-align:center;box-sizing:border-box;}
  #toast.show{opacity:1;}
  @media (max-width:700px){
    #hud{max-width:calc(100vw - 170px);font-size:11px;padding:5px 8px;top:58px;left:10px;transform:none;}
    #panel{width:min(240px,calc(100vw - 20px));}
    #toast{top:100px;font-size:12px;}
    .tool{width:54px;height:54px;}
    .tool kbd{display:none;}
  }
</style>

<script>
'use strict';
/* =====================================================================
   PHYSIK-LABOR – eigene 2D-Starrkörper-Engine (Sequential Impulses, Substeps)
   Kreise & konvexe Polygone (SAT + Kanten-Clipping), Warmstart für Kontakte & Gelenke,
   Sweep-and-Prune, Stangen, Seile, Federn, Gelenke, Motoren, Auftrieb, Materialien
   ===================================================================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,gridCv=null;
const FLOOR_H=26, PPM=92, RHO_W=0.0011, MARGIN=0.6, MAX_VERTS=10, MOTOR_MAX=24, MOTOR_T=6e4, MAX_BODIES=600;

/* Materialien: Dichte (Masse pro px²), Reibung, Sprungkraft, Farbe; Ballon hat Auftrieb gegen die Schwerkraft */
const MATS={
  bunt:  {name:'Bunt',  density:0.001, mu:0.5, e:0.55,color:null},
  holz:  {name:'Holz',  density:0.0007,mu:0.6, e:0.3, color:'#d9a35a'},
  metall:{name:'Metall',density:0.0045,mu:0.35,e:0.15,color:'#9aa9b4'},
  gummi: {name:'Gummi', density:0.0012,mu:1.0, e:0.85,color:'#ff6b6b'},
  eis:   {name:'Eis',   density:0.0009,mu:0.02,e:0.1, color:'#bfe9ff'},
  ballon:{name:'Ballon',density:0.0003,mu:0.4, e:0.5, color:'#fd79a8',lift:2.4,drag:1.4}
};

/* ---------- Welt-Zustand ---------- */
let bodies=[], joints=[], noColl=new Set(), parts=[], rings=[], emitters=[], undoStack=[];
let nid=1, grpN=0, sap=[], sapDirty=true;
const WORLD={id:0,x:0,y:0,a:0,ca:1,sa:0,vx:0,vy:0,w:0,im:0,iI:0,m:0,static:true};
let G=900, wind=0, timeScale=1, paused=false, trailsOn=false, soundOn=true, arrowsOn=false;
let waterFrac=0, waterY=Infinity, motorSet=0.5, motorKey=0, MS=0;
let mouse=null, bounds={}, shakeAmp=0, simT=0, curMat='bunt', curShape='3';
const PAL=['#ffb347','#ff6b6b','#4ecdc4','#ffe66d','#a29bfe','#74b9ff','#55efc4','#fd79a8'];
const pick=()=>PAL[(Math.random()*PAL.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const motorSpeed=()=>(motorKey||motorSet)*MOTOR_MAX;

function trig(b){b.ca=Math.cos(b.a);b.sa=Math.sin(b.a);}
const boxV=(hw,hh)=>[-hw,-hh,hw,-hh,hw,hh,-hw,hh];
function ngonV(n,R){
  const v=[],a0=-Math.PI/2+(n%2?0:Math.PI/n);
  for(let i=0;i<n;i++){const a=a0+i*2*Math.PI/n;v.push(Math.cos(a)*R,Math.sin(a)*R);}
  return v;
}
function mkBody(type,x,y,o={}){
  const mk=MATS[o.mat]?o.mat:'bunt', mat=MATS[mk];
  const b={id:nid++,type,x,y,a:o.a||0,vx:o.vx||0,vy:o.vy||0,w:o.w||0,r:o.r||0,hw:o.hw||0,hh:o.hh||0,
    e:o.e!==undefined?o.e:0.4,mu:o.mu!==undefined?o.mu:mat.mu,group:o.group||0,color:o.color||mat.color||pick(),
    static:!!o.static,bound:!!o.bound,trail:null,ca:1,sa:0,br:0,kind:o.kind||'',mat:mk,
    density:o.density!==undefined?o.density:mat.density,lift:o.lift!==undefined?o.lift:(mat.lift||0),drag:mat.drag||0,
    n:0,lv:null,ln:null,wv:null,wn:null,wet:false};
  trig(b);
  if(type==='circle'){b.area=Math.PI*b.r*b.r;b.br=b.r;b.I0=0.5*b.r*b.r;}
  else setVerts(b,o.verts);
  if(b.static){b.m=0;b.im=0;b.I=0;b.iI=0;}
  else{b.m=b.density*b.area;b.im=1/b.m;b.I=b.m*b.I0;b.iI=1/b.I;}
  if(type==='poly')updW(b);
  bodies.push(b);sapDirty=true;return b;
}
/* Polygon-Ecken setzen: Wicklung prüfen, Schwerpunkt & Trägheit berechnen, Körper auf den Schwerpunkt verschieben */
function setVerts(b,src){
  let v=Array.from(src);const n=v.length/2;
  let s=0;
  for(let i=0;i<n;i++){const k=(i+1)%n;s+=v[2*i]*v[2*k+1]-v[2*k]*v[2*i+1];}
  if(s<0){const r=[];for(let i=n-1;i>=0;i--)r.push(v[2*i],v[2*i+1]);v=r;}
  const sx=v[0],sy=v[1];let A=0,cx=0,cy=0,I=0;
  for(let i=1;i<n-1;i++){
    const e1x=v[2*i]-sx,e1y=v[2*i+1]-sy,e2x=v[2*i+2]-sx,e2y=v[2*i+3]-sy;
    const D=e1x*e2y-e1y*e2x,t=D/2;
    A+=t;cx+=t*(e1x+e2x)/3;cy+=t*(e1y+e2y)/3;
    I+=D/12*(e1x*e1x+e2x*e1x+e2x*e2x+e1y*e1y+e2y*e1y+e2y*e2y);
  }
  cx/=A;cy/=A;
  b.area=A;b.I0=(I-A*(cx*cx+cy*cy))/A;
  const ox=sx+cx,oy=sy+cy;
  b.n=n;b.lv=new Float64Array(2*n);b.ln=new Float64Array(2*n);b.wv=new Float64Array(2*n);b.wn=new Float64Array(2*n);
  let br=0;
  for(let i=0;i<n;i++){b.lv[2*i]=v[2*i]-ox;b.lv[2*i+1]=v[2*i+1]-oy;br=Math.max(br,Math.hypot(b.lv[2*i],b.lv[2*i+1]));}
  for(let i=0;i<n;i++){
    const k=(i+1)%n,ex=b.lv[2*k]-b.lv[2*i],ey=b.lv[2*k+1]-b.lv[2*i+1],l=Math.hypot(ex,ey)||1;
    b.ln[2*i]=ey/l;b.ln[2*i+1]=-ex/l;
  }
  b.br=br;
  b.x+=b.ca*ox-b.sa*oy;b.y+=b.sa*ox+b.ca*oy;
}
function updW(b){
  const c=b.ca,s=b.sa,lv=b.lv,ln=b.ln,wv=b.wv,wn=b.wn;
  for(let i=0,n=2*b.n;i<n;i+=2){
    const x=lv[i],y=lv[i+1];wv[i]=b.x+c*x-s*y;wv[i+1]=b.y+s*x+c*y;
    const nx=ln[i],ny=ln[i+1];wn[i]=c*nx-s*ny;wn[i+1]=s*nx+c*ny;
  }
}
const addBall=(x,y,r,o={})=>mkBody('circle',x,y,Object.assign({r},o));
const addBox=(x,y,hw,hh,o={})=>mkBody('poly',x,y,Object.assign({hw,hh,verts:boxV(hw,hh)},o));
const addPoly=(x,y,verts,o={})=>mkBody('poly',x,y,Object.assign({verts},o));

function wpt(b,lx,ly){return [b.x+b.ca*lx-b.sa*ly, b.y+b.sa*lx+b.ca*ly];}
function lpt(b,wx,wy){const dx=wx-b.x,dy=wy-b.y;return [b.ca*dx+b.sa*dy,-b.sa*dx+b.ca*dy];}

/* Gelenke: ax/ay bzw. bx/by sind lokale Anker (für WORLD = Weltkoordinaten). Motor: A dreht relativ zu B */
function addJoint(type,A,ax,ay,B,bx,by,o={}){
  A=A||WORLD;B=B||WORLD;
  const j={type,A,B,ax,ay,bx,by,len:0,acc:0,ix:0,iy:0,macc:0,color:o.color,freq:o.freq||2.2,zeta:o.zeta||0.08,
    chain:!!o.chain,motor:!!o.motor};
  if(type!=='pin'){
    if(o.len!==undefined) j.len=o.len;
    else{const pa=wpt(A,ax,ay),pb=wpt(B,bx,by);j.len=Math.hypot(pb[0]-pa[0],pb[1]-pa[1]);}
  }
  joints.push(j); rebuildNoColl(); return j;
}
function rebuildNoColl(){
  noColl.clear();
  for(const j of joints){ if((j.type==='pin'||j.chain)&&j.A!==WORLD&&j.B!==WORLD){
    const a=Math.min(j.A.id,j.B.id),b=Math.max(j.A.id,j.B.id); noColl.add(a*1048576+b);} }
}
function removeBody(b){
  if(b.bound)return;
  bodies=bodies.filter(x=>x!==b);
  joints=joints.filter(j=>j.A!==b&&j.B!==b);
  if(mouse&&mouse.b===b)mouse=null;
  rebuildNoColl(); sapDirty=true;
}
function clearAll(){
  bodies=bodies.filter(b=>b.bound); joints=[]; noColl.clear(); mouse=null; emitters=[]; parts=[]; rings=[]; sapDirty=true;
}

/* ---------- Kollisionserkennung (Normale immer von A nach B, sep < 0 = Durchdringung) ---------- */
function ccContact(A,B,out){
  const dx=B.x-A.x,dy=B.y-A.y,rr=A.r+B.r,d2=dx*dx+dy*dy,lim=rr+MARGIN;
  if(d2>=lim*lim)return;
  const d=Math.sqrt(d2);let nx=0,ny=1;
  if(d>1e-6){nx=dx/d;ny=dy/d;}
  const sep=d-rr;
  out.push({A,B,nx,ny,px:A.x+nx*(A.r+sep/2),py:A.y+ny*(A.r+sep/2),sep,fid:0});
}
/* Kreis C gegen Polygon X – Normale zeigt von X zum Kreis */
function cpRaw(C,X){
  const n=X.n,v=X.wv,nn=X.wn,r=C.r;
  let s=-1e12,i0=0;
  for(let i=0;i<n;i++){const d=nn[2*i]*(C.x-v[2*i])+nn[2*i+1]*(C.y-v[2*i+1]);if(d>s){s=d;i0=i;}}
  if(s>r+MARGIN)return null;
  const i1=(i0+1)%n,v1x=v[2*i0],v1y=v[2*i0+1],v2x=v[2*i1],v2y=v[2*i1+1];
  let nx=nn[2*i0],ny=nn[2*i0+1],qx,qy,sep;
  if(s<1e-6){sep=s-r;qx=C.x-nx*s;qy=C.y-ny*s;}
  else{
    const u1=(C.x-v1x)*(v2x-v1x)+(C.y-v1y)*(v2y-v1y), u2=(C.x-v2x)*(v1x-v2x)+(C.y-v2y)*(v1y-v2y);
    if(u1<=0||u2<=0){
      qx=u1<=0?v1x:v2x;qy=u1<=0?v1y:v2y;
      const dx=C.x-qx,dy=C.y-qy,d=Math.hypot(dx,dy);
      if(d>r+MARGIN)return null;
      if(d>1e-9){nx=dx/d;ny=dy/d;}
      sep=d-r;
    }else{sep=s-r;qx=C.x-nx*s;qy=C.y-ny*s;}
  }
  return {nx,ny,sep,px:(qx+C.x-nx*r)/2,py:(qy+C.y-ny*r)/2};
}
let SEP_I=0;
function maxSep(A,B){
  let best=-1e12,bi=0;const an=A.n,bn=B.n,av=A.wv,aw=A.wn,bv=B.wv;
  for(let i=0;i<an;i++){
    const nx=aw[2*i],ny=aw[2*i+1],ox=av[2*i],oy=av[2*i+1];
    let mn=1e12;
    for(let k=0;k<bn;k++){const d=nx*(bv[2*k]-ox)+ny*(bv[2*k+1]-oy);if(d<mn)mn=d;}
    if(mn>best){best=mn;bi=i;if(best>MARGIN)break;}
  }
  SEP_I=bi;return best;
}
const CP=[0,0,0,0,0,0];
function clipSeg(nx,ny,off,cid){ // behält Punkte mit n·p <= off
  const d1=nx*CP[0]+ny*CP[1]-off,d2=nx*CP[3]+ny*CP[4]-off;
  if(d1<=0&&d2<=0)return true;
  if(d1>0&&d2>0)return false;
  const t=d1/(d1-d2),x=CP[0]+(CP[3]-CP[0])*t,y=CP[1]+(CP[4]-CP[1])*t;
  if(d1>0){CP[0]=x;CP[1]=y;CP[2]=cid;}else{CP[3]=x;CP[4]=y;CP[5]=cid;}
  return true;
}
/* Polygon gegen Polygon: SAT, Referenz-/Inzidenzkante, Clipping (bis zu 2 Kontaktpunkte) */
function polyPoly(A,B,out){
  const sA=maxSep(A,B),eA=SEP_I; if(sA>MARGIN)return;
  const sB=maxSep(B,A),eB=SEP_I; if(sB>MARGIN)return;
  let R=A,I=B,re=eA,flip=0;
  if(sB>sA+0.05){R=B;I=A;re=eB;flip=1;}
  const nx=R.wn[2*re],ny=R.wn[2*re+1];
  let ie=0,mn=1e12;
  for(let k=0;k<I.n;k++){const d=nx*I.wn[2*k]+ny*I.wn[2*k+1];if(d<mn){mn=d;ie=k;}}
  const ie2=(ie+1)%I.n;
  CP[0]=I.wv[2*ie];CP[1]=I.wv[2*ie+1];CP[2]=ie;CP[3]=I.wv[2*ie2];CP[4]=I.wv[2*ie2+1];CP[5]=ie2;
  const re2=(re+1)%R.n,r1x=R.wv[2*re],r1y=R.wv[2*re+1],r2x=R.wv[2*re2],r2y=R.wv[2*re2+1];
  let tx=r2x-r1x,ty=r2y-r1y;const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
  if(!clipSeg(-tx,-ty,-(tx*r1x+ty*r1y),12))return;
  if(!clipSeg(tx,ty,tx*r2x+ty*r2y,13))return;
  const onx=flip?-nx:nx,ony=flip?-ny:ny;
  for(let k=0;k<2;k++){
    const px=CP[3*k],py=CP[3*k+1];
    const sep=nx*(px-r1x)+ny*(py-r1y);
    if(sep>MARGIN)continue;
    out.push({A,B,nx:onx,ny:ony,px:px-nx*sep/2,py:py-ny*sep/2,sep,fid:flip*256+re*16+CP[3*k+2]});
  }
}
function collide(A,B,out){
  if(A.type==='circle'){
    if(B.type==='circle')return ccContact(A,B,out);
    const r=cpRaw(A,B); if(!r)return;       // r.n: Polygon B -> Kreis A
    out.push({A,B,nx:-r.nx,ny:-r.ny,px:r.px,py:r.py,sep:r.sep,fid:0});
  }else if(B.type==='circle'){
    const r=cpRaw(B,A); if(!r)return;       // r.n: Polygon A -> Kreis B
    out.push({A,B,nx:r.nx,ny:r.ny,px:r.px,py:r.py,sep:r.sep,fid:0});
  }else polyPoly(A,B,out);
}

/* ---------- Auftrieb (exakte Unterwasserfläche: Kreissegment bzw. abgeschnittenes Polygon) ---------- */
const BUF=new Float64Array(2*(MAX_VERTS+8));
function buoy(b,h){
  let area,cx,cy;
  if(b.type==='circle'){
    const r=b.r,d=clamp(b.y+r-waterY,0,2*r);
    if(d<=0)return;
    if(d>=2*r)area=b.area;else{const k=r-d;area=r*r*Math.acos(k/r)-k*Math.sqrt(Math.max(0,r*r-k*k));}
    cx=b.x;cy=b.y;
  }else{
    const v=b.wv,n=b.n;let m=0;
    for(let i=0;i<n;i++){
      const j=(i+1)%n,ax=v[2*i],ay=v[2*i+1],bx=v[2*j],by=v[2*j+1],ina=ay>=waterY,inb=by>=waterY;
      if(ina){BUF[m++]=ax;BUF[m++]=ay;}
      if(ina!==inb){const t=(waterY-ay)/(by-ay);BUF[m++]=ax+(bx-ax)*t;BUF[m++]=waterY;}
    }
    if(m<6)return;
    area=0;cx=0;cy=0;
    for(let i=0;i<m;i+=2){const j=(i+2)%m,cr=BUF[i]*BUF[j+1]-BUF[j]*BUF[i+1];area+=cr;cx+=(BUF[i]+BUF[j])*cr;cy+=(BUF[i+1]+BUF[j+1])*cr;}
    area*=0.5;if(area<=1e-6)return;
    cx/=6*area;cy/=6*area;
  }
  const frac=Math.min(1,area/b.area);
  const Py=-RHO_W*area*G*h;
  b.vy+=Py*b.im; b.w+=b.iI*(cx-b.x)*Py;
  const k=1/(1+h*3*frac),kw=1/(1+h*3.5*frac);
  b.vx*=k;b.vy*=k;b.w*=kw;
}

/* ---------- Löser ---------- */
const SUB=8, ITER=8, BETA_C=0.15, BETA_J=0.2, SLOP=0.5, REST_THR=30;
const WS_J=0.8;   // Gelenk-Warmstart leicht gedämpft – volle Übernahme lässt Ketten und Brücken zittern
let prevCache=new Map(), hits=[];

function applyImp(b,rx,ry,px,py,s){
  b.vx+=px*b.im*s; b.vy+=py*b.im*s; b.w+=b.iI*(rx*py-ry*px)*s;
}
function prepContact(c,h){
  const A=c.A,B=c.B;
  c.rax=c.px-A.x;c.ray=c.py-A.y;c.rbx=c.px-B.x;c.rby=c.py-B.y;
  const nx=c.nx,ny=c.ny,tx=-ny,ty=nx;
  const an=c.rax*ny-c.ray*nx,bn=c.rbx*ny-c.rby*nx,at=c.rax*ty-c.ray*tx,bt=c.rbx*ty-c.rby*tx;
  c.kn=A.im+B.im+A.iI*an*an+B.iI*bn*bn;
  c.kt=A.im+B.im+A.iI*at*at+B.iI*bt*bt;
  if(c.kn<=0)c.kn=1e-9;if(c.kt<=0)c.kt=1e-9;
  const dvx=(B.vx-B.w*c.rby)-(A.vx-A.w*c.ray), dvy=(B.vy+B.w*c.rbx)-(A.vy+A.w*c.rax);
  const vn0=dvx*nx+dvy*ny;
  c.mu=Math.sqrt(A.mu*B.mu);

  let bias=c.sep>0?-c.sep/h:Math.min(150,Math.max(0,-c.sep-SLOP)*BETA_C/h);
  c.key=(A.id*1048576+B.id)*512+c.fid;
  const w=prevCache.get(c.key);
  if(w){c.accN=w[0];c.accT=w[1];}
  else{
    // Sprungkraft nur beim ersten Aufprall – ruhende Stapel sollen nicht hüpfen
    c.accN=0;c.accT=0;
    if(vn0<-REST_THR){const e=Math.max(A.e,B.e);if(e>0)bias=Math.max(bias,-e*vn0);}
    if(vn0<-90&&hits.length<40)hits.push({v:-vn0,A,B,x:c.px,y:c.py});
  }

}
function warmContact(c){
  if(!c.accN&&!c.accT)return;
  const tx=-c.ny,ty=c.nx,px=c.nx*c.accN+tx*c.accT,py=c.ny*c.accN+ty*c.accT;
  applyImp(c.A,c.rax,c.ray,px,py,-1);applyImp(c.B,c.rbx,c.rby,px,py,1);
}
function solveContact(c){
  const A=c.A,B=c.B,nx=c.nx,ny=c.ny;
  let dvx=(B.vx-B.w*c.rby)-(A.vx-A.w*c.ray), dvy=(B.vy+B.w*c.rbx)-(A.vy+A.w*c.rax);
  const vn=dvx*nx+dvy*ny;
  let l=(c.bias-vn)/c.kn;
  const na=Math.max(c.accN+l,0); l=na-c.accN; c.accN=na;
  if(l!==0){const px=nx*l,py=ny*l;applyImp(A,c.rax,c.ray,px,py,-1);applyImp(B,c.rbx,c.rby,px,py,1);}
  dvx=(B.vx-B.w*c.rby)-(A.vx-A.w*c.ray); dvy=(B.vy+B.w*c.rbx)-(A.vy+A.w*c.rax);
  const tx=-ny,ty=nx, vt=dvx*tx+dvy*ty;
  let lt=-vt/c.kt;
  const mx=c.mu*c.accN, nt=clamp(c.accT+lt,-mx,mx); lt=nt-c.accT; c.accT=nt;
  if(lt!==0){const px=tx*lt,py=ty*lt;applyImp(A,c.rax,c.ray,px,py,-1);applyImp(B,c.rbx,c.rby,px,py,1);}
}
function prepJoint(j,h){
  const A=j.A,B=j.B;
  j.rax=A.ca*j.ax-A.sa*j.ay; j.ray=A.sa*j.ax+A.ca*j.ay;
  j.rbx=B.ca*j.bx-B.sa*j.by; j.rby=B.sa*j.bx+B.ca*j.by;
  const dx=(B.x+j.rbx)-(A.x+j.rax), dy=(B.y+j.rby)-(A.y+j.ray);
  if(j.type==='pin'){
    j.Cx=dx;j.Cy=dy;
    const K11=A.im+B.im+A.iI*j.ray*j.ray+B.iI*j.rby*j.rby;
    const K12=-A.iI*j.rax*j.ray-B.iI*j.rbx*j.rby;
    const K22=A.im+B.im+A.iI*j.rax*j.rax+B.iI*j.rbx*j.rbx;
    const det=K11*K22-K12*K12;
    j.ok=det>1e-14; if(j.ok){j.i11=K22/det;j.i12=-K12/det;j.i22=K11/det;}
    j.ix*=WS_J;j.iy*=WS_J;
    if(j.ok&&(j.ix||j.iy)){applyImp(A,j.rax,j.ray,j.ix,j.iy,-1);applyImp(B,j.rbx,j.rby,j.ix,j.iy,1);}
    if(j.motor){j.mK=A.iI+B.iI;if(j.mK>0&&j.macc){A.w+=A.iI*j.macc;B.w-=B.iI*j.macc;}}
    return;
  }

  const ca=j.rax*j.ny-j.ray*j.nx, cb=j.rbx*j.ny-j.rby*j.nx;

function solveJoint(j){
  if(!j.ok)return;

    const bs=BETA_J/hSub;

    const px=j.i11*rx+j.i12*ry, py=j.i12*rx+j.i22*ry;
    j.ix+=px;j.iy+=py;
    applyImp(A,j.rax,j.ray,px,py,-1);applyImp(B,j.rbx,j.rby,px,py,1);
    return;
  }
  const dvx=(B.vx-B.w*j.rby)-(A.vx-A.w*j.ray), dvy=(B.vy+B.w*j.rbx)-(A.vy+A.w*j.rax);

    l=-(cd+j.sbias+j.gamma*j.acc)/(j.K+j.gamma); j.acc+=l;
  }else{

  }

  applyImp(A,j.rax,j.ray,px,py,-1);applyImp(B,j.rbx,j.rby,px,py,1);

let hSub=1/480;
function substep(h){
  hSub=h; MS=motorSpeed();
  const vmax=3500;
  const damp=1/(1+h*0.04), adamp=1/(1+h*0.12);
  for(const b of bodies){
    if(!b.im)continue;
    b.vy+=G*h*(1-b.lift); b.vx+=wind*h;
    const dl=b.drag?1/(1+h*b.drag):damp;
    b.vx*=dl;b.vy*=dl;b.w*=adamp;
    if(b.y+b.br>waterY)buoy(b,h);
    const sp=Math.hypot(b.vx,b.vy); if(sp>vmax){b.vx*=vmax/sp;b.vy*=vmax/sp;}
    b.w=clamp(b.w,-60,60);
  }
  if(mouse&&!mouse.kin){
    const b=mouse.b,rx=b.ca*mouse.lx-b.sa*mouse.ly,ry=b.sa*mouse.lx+b.ca*mouse.ly;
    const px=b.x+rx,py=b.y+ry,vx=b.vx-b.w*ry,vy=b.vy+b.w*rx,om=16;
    let fx=om*om*(mouse.tx-px)-2*om*vx, fy=om*om*(mouse.ty-py)-2*om*vy;
    const mag=Math.hypot(fx,fy),cap=9000; if(mag>cap){fx*=cap/mag;fy*=cap/mag;}
    const Px=fx*b.m*h,Py=fy*b.m*h;
    b.vx+=Px*b.im;b.vy+=Py*b.im;b.w+=b.iI*(rx*Py-ry*Px);
  }
  for(const b of bodies)if(b.type==='poly')updW(b);
  // Breitphase: Sweep-and-Prune entlang x (Insertion-Sort, da fast sortiert)
  if(sapDirty){sap=bodies.slice();sapDirty=false;}
  const n=sap.length;
  for(const b of sap){b.mnx=b.x-b.br-MARGIN;b.mxx=b.x+b.br+MARGIN;}
  for(let i=1;i<n;i++){const b=sap[i],v=b.mnx;let k=i-1;while(k>=0&&sap[k].mnx>v){sap[k+1]=sap[k];k--;}sap[k+1]=b;}
  const list=[];
  for(let i=0;i<n;i++){
    const A0=sap[i],mx=A0.mxx;
    for(let k=i+1;k<n;k++){
      const B0=sap[k]; if(B0.mnx>mx)break;
      if(!A0.im&&!B0.im)continue;
      let A=A0,B=B0; if(A.id>B.id){A=B0;B=A0;}
      if(A.group&&A.group===B.group)continue;
      const dx=B.x-A.x,dy=B.y-A.y,rr=A.br+B.br+MARGIN;
      if(dx*dx+dy*dy>rr*rr)continue;
      if(noColl.size&&noColl.has(A.id*1048576+B.id))continue;
      collide(A,B,list);
    }
  }
  for(const c of list)prepContact(c,h);
  for(const c of list)warmContact(c);
  for(const j of joints)prepJoint(j,h);
  const iters=list.length>900?4:list.length>450?6:ITER;
  for(let it=0;it<iters;it++){
    for(const j of joints)solveJoint(j);
    for(const c of list)solveContact(c);
  }
  prevCache=new Map();
  for(const c of list)prevCache.set(c.key,[c.accN,c.accT]);
  for(const b of bodies){
    if(!b.im){ if(b.vx||b.vy){b.x+=b.vx*h;b.y+=b.vy*h;} continue; }   // kinematisch gezogene feste Körper
    b.x+=b.vx*h;b.y+=b.vy*h;
    if(b.w!==0){b.a+=b.w*h;trig(b);}
  }
}
function kinTarget(){const b=mouse.b;return [mouse.tx-(b.ca*mouse.lx-b.sa*mouse.ly), mouse.ty-(b.sa*mouse.lx+b.ca*mouse.ly)];}
function step(dt){
  if(dt<=0)return;
  if(mouse&&mouse.kin){
    const b=mouse.b,t=kinTarget();
    b.vx=clamp((t[0]-b.x)/dt,-4000,4000); b.vy=clamp((t[1]-b.y)/dt,-4000,4000);
  }
  const h=dt/SUB;
  for(let s=0;s<SUB;s++)substep(h);
  for(const b of bodies){ if(!b.im&&(b.vx||b.vy)&&!(mouse&&mouse.b===b)){b.vx=0;b.vy=0;} }
  simT+=dt;
  // Aufräumen weit draußen & Wasserspritzer
  let rm=null;
  for(const b of bodies){
    if(!b.im)continue;
    if(b.y>H+400||b.y<-900||b.x<-400||b.x>W+400){(rm||(rm=[])).push(b);continue;}
    const wet=b.y>waterY;
    if(wet&&!b.wet&&b.vy>220)splash(b);
    b.wet=wet;
  }
  if(rm)rm.forEach(removeBody);
  // Spender (z. B. Galton-Brett)
  for(const em of emitters){em.t-=dt;while(em.t<=0&&em.n>0){em.fn();em.n--;em.t+=em.every;}}
  if(emitters.length)emitters=emitters.filter(e=>e.n>0);
  // Spuren
  if(trailsOn){
    for(const b of bodies){
      if(b.im&&b.type==='circle'&&b.r>=8){
        if(!b.trail)b.trail=[];
        b.trail.push(b.x,b.y); if(b.trail.length>520)b.trail.splice(0,2);
      }
    }
  }
  // Ton & Staub
  if(hits.length){
    let cnt=0;
    for(const hh of hits){
      if(cnt++>4)break; sfx(hh);
      if(hh.v>450)puff(hh.x,hh.y,3+Math.min(6,hh.v/400|0),'#cfe3ee',110,0.35,2,60);
    }
    hits.length=0;
  }
  // Partikel & Druckwellen
  for(const p of parts){p.vy+=G*0.6*p.g*dt;p.vx*=0.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;}
  if(parts.length)parts=parts.filter(p=>p.l>0);
  for(const r of rings){r.r+=900*dt;r.l-=dt;}
  if(rings.length)rings=rings.filter(r=>r.l>0);
}

/* ---------- Effekte ---------- */
function puff(x,y,n,col,spd,life,sz,up,g){
  for(let i=0;i<n&&parts.length<600;i++){
    const L=life*(0.6+Math.random()*0.7);
    parts.push({x,y,vx:(Math.random()-.5)*2*spd,vy:(Math.random()-.5)*2*spd-(up||0),l:L,L,c:col,s:sz*(0.6+Math.random()*0.8),g:g===undefined?1:g});
  }
}
function splash(b){
  const n=Math.min(22,6+b.vy/80|0);
  for(let i=0;i<n;i++)puff(b.x+(Math.random()-.5)*b.br*1.6,waterY,1,'#bfe9ff',140,0.7,2.6,180+b.vy*0.35);
  splashSnd(b.vy*Math.sqrt(b.m));
}
function explode(x,y){
  const R=200;
  for(const b of bodies){
    if(!b.im)continue;
    const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy); if(d>R+b.br)continue;
    const f=1-Math.min(1,Math.max(0,d-b.br*0.5)/R), dv=1700*f*Math.min(1.5,2.2/Math.sqrt(b.m));
    const nx=d>1?dx/d:0, ny=d>1?dy/d:-1;
    b.vx+=nx*dv; b.vy+=ny*dv-200*f; b.w+=(Math.random()-.5)*14*f;
  }
  // Verbindungen in der Nähe reißen
  const before=joints.length;
  joints=joints.filter(j=>{
    const pa=wpt(j.A,j.ax,j.ay),pb=wpt(j.B,j.bx,j.by);
    return Math.hypot((pa[0]+pb[0])/2-x,(pa[1]+pb[1])/2-y)>R*0.45;
  });
  if(joints.length!==before)rebuildNoColl();
  puff(x,y,34,'#ffd36e',520,0.45,3.2,80);
  puff(x,y,18,'#ff7f50',360,0.6,4,60);
  puff(x,y,16,'#9fb3bf',120,1.2,7,40,-0.12);
  rings.push({x,y,r:14,l:0.4});
  shakeAmp=Math.max(shakeAmp,11);
  boom();
}

/* ---------- Audio ---------- */
let AC=null,lastSnd=0,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function sfx(hit){
  if(!AC||!soundOn||paused)return;
  const t=AC.currentTime; if(t-lastSnd<0.015)return; lastSnd=t;
  let dyn=hit.A.im?hit.A:hit.B; if(hit.A.im&&hit.B.im&&hit.B.br<hit.A.br)dyn=hit.B;
  if(!dyn.im)return;
  const floorish=!hit.A.im||!hit.B.im;
  let f=clamp(2000/(1+dyn.br*0.09),160,1700)*(floorish?0.55:1), type=floorish?'sine':'triangle', dec=0.14;
  let g=Math.min(0.2,hit.v/2600);
  switch(dyn.mat){
    case 'metall': f*=1.7;type='square';g*=0.4;dec=0.25;break;
    case 'holz': f*=0.75;type='triangle';dec=0.07;break;
    case 'gummi': f*=0.6;type='sine';break;
    case 'eis': f*=2.2;type='sine';dec=0.1;break;
    case 'ballon': f*=0.4;type='sine';g*=0.5;break;
  }
  const o=AC.createOscillator(),gn=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.6,t+dec*0.85);

function serialize(){
  const list=bodies.filter(b=>!b.bound), idx=new Map(list.map((b,i)=>[b,i]));
  const r=v=>Math.round(v*1000)/1000;
  return {v:2,water:waterFrac,
    bodies:list.map(b=>({t:b.type,x:r(b.x),y:r(b.y),a:r(b.a),vx:r(b.vx),vy:r(b.vy),w:r(b.w),r:b.r,hw:b.hw,hh:b.hh,
      lv:b.lv?Array.from(b.lv,r):null,e:b.e,mu:b.mu,g:b.group,c:b.color,s:b.static,k:b.kind,m:b.mat,d:b.density,l:b.lift,dr:b.drag})),
    joints:joints.map(j=>({t:j.type,A:j.A===WORLD?-1:idx.get(j.A),B:j.B===WORLD?-1:idx.get(j.B),
      ax:j.ax,ay:j.ay,bx:j.bx,by:j.by,len:j.len,f:j.freq,z:j.zeta,ch:j.chain,mo:j.motor}))};
}
function restore(s){
  clearAll();
  const list=s.bodies.map(d=>{
    const o={a:d.a,vx:d.vx,vy:d.vy,w:d.w,e:d.e,mu:d.mu,group:d.g,color:d.c,static:d.s,kind:d.k,mat:d.m,density:d.d,lift:d.l};
    if(d.g)grpN=Math.max(grpN,d.g);
    const b=d.t==='circle'?addBall(d.x,d.y,d.r,o):mkBody('poly',d.x,d.y,Object.assign(o,{verts:d.lv,hw:d.hw,hh:d.hh}));
    if(d.dr!==undefined)b.drag=d.dr;
    return b;
  });
  for(const d of s.joints){
    const A=d.A<0?null:list[d.A],B=d.B<0?null:list[d.B];
    if((d.A>=0&&!A)||(d.B>=0&&!B))continue;
    addJoint(d.t,A,d.ax,d.ay,B,d.bx,d.by,{len:d.len,freq:d.f,zeta:d.z,chain:d.ch,motor:d.mo});
  }
  setWater(s.water||0);
  updHud();
}

/* ---------- Hilfsfunktionen für Werkzeuge ---------- */
function inside(b,x,y){
  const dx=x-b.x,dy=y-b.y;
  if(b.type==='circle')return dx*dx+dy*dy<=b.r*b.r;
  const lx=b.ca*dx+b.sa*dy,ly=-b.sa*dx+b.ca*dy,v=b.lv,n=b.ln;
  for(let i=0;i<2*b.n;i+=2)if(n[i]*(lx-v[i])+n[i+1]*(ly-v[i+1])>0)return false;
  return true;
}
function hitAll(x,y,incStatic){
  const out=[];
  for(let i=bodies.length-1;i>=0;i--){
    const b=bodies[i]; if(b.bound)continue; if(!incStatic&&b.static)continue;
    if(inside(b,x,y))out.push(b);
  }
  return out;
}
function anchorAt(x,y){
  const h=hitAll(x,y,true);
  if(h.length){const l=lpt(h[0],x,y);return {b:h[0],lx:l[0],ly:l[1],wx:x,wy:y};}
  return {b:null,lx:x,ly:y,wx:x,wy:y};
}
function anchorWorld(a){return a.b?wpt(a.b,a.lx,a.ly):[a.lx,a.ly];}
const sizeVal=()=>parseFloat($('sSize').value);
const bounceVal=()=>parseFloat($('sBounce').value);
const fixedVal=()=>$('cStatic').checked;
function capCheck(){ if(bodies.length>MAX_BODIES){toast('Zu viele Körper – erst aufräumen!');return false;} return true; }
function matOpts(extra){
  const st=fixedVal();
  return Object.assign({mat:curMat,e:bounceVal(),static:st,color:st?'#7f98a8':undefined},extra||{});
}

function spawnBody(kind,x,y,vx,vy){
  if(!capCheck())return null;
  pushUndo();
  const s=sizeVal(),o=matOpts({vx,vy});
  if(kind==='ball')return addBall(x,y,s,o);
  if(kind==='box')return addBox(x,y,s,s,o);
  return addPoly(x,y,ngonV(+curShape,s*1.2),o);
}
function makeBob(x,y,group){
  return addBall(x,y,Math.max(8,sizeVal()),{mat:curMat,e:bounceVal(),group,density:curMat==='bunt'?0.002:undefined,mu:0.3});
}
function makeChain(a,ex,ey,opts={}){
  const [ax,ay]=anchorWorld(a);
  const L=Math.max(30,Math.hypot(ex-ax,ey-ay));
  const n=Math.max(3,Math.round(L/16)), seg=L/n, ux=(ex-ax)/L, uy=(ey-ay)/L;
  const g=++grpN; let prev=null;
  for(let i=1;i<=n;i++){
    const x=ax+ux*seg*i,y=ay+uy*seg*i;
    const last=i===n;
    const b=last?addBall(x,y,opts.ballR||Math.max(8,sizeVal()),{group:g,mat:opts.mat||curMat,density:opts.ballDensity||(curMat==='bunt'?0.003:undefined),
                  e:opts.e!==undefined?opts.e:bounceVal(),mu:0.4,color:opts.color})
                :addBall(x,y,4,{group:g,density:opts.nodeDensity||0.025,e:0.1,mu:0.2,color:'#cdd9e0'});
    if(i===1){
      if(a.b)addJoint('rod',a.b,a.lx,a.ly,b,0,0,{len:seg,chain:true});
      else addJoint('rod',null,ax,ay,b,0,0,{len:seg,chain:true});
    }else addJoint('rod',prev,0,0,b,0,0,{len:seg,chain:true});
    prev=b;
  }
  return prev;
}
/* Freie Form: konvexe Hülle des gemalten Pfads, auf max. 10 Ecken vereinfacht */
function hull(pts){
  const p=[];for(let i=0;i<pts.length;i+=2)p.push([pts[i],pts[i+1]]);
  p.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  up.pop();lo.pop();return lo.concat(up);
}
function simplifyHull(h,max){
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  while(h.length>3){
    let bi=0,ba=1e18;
    for(let i=0;i<h.length;i++){
      const a=h[(i+h.length-1)%h.length],c=h[(i+1)%h.length],ar=Math.abs(cr(a,h[i],c));
      if(ar<ba){ba=ar;bi=i;}
    }
    if(h.length>max||ba<60)h.splice(bi,1);else break;
  }
  return h;
}
function makeFreeform(path){
  const h=simplifyHull(hull(path),MAX_VERTS);
  if(h.length<3)return false;
  let a=0;for(let i=0;i<h.length;i++){const k=(i+1)%h.length;a+=h[i][0]*h[k][1]-h[k][0]*h[i][1];}
  if(Math.abs(a)/2<150){toast('Form zu klein');return false;}
  if(!capCheck())return false;
  pushUndo();
  addPoly(0,0,h.flat(),matOpts());
  return true;
}
function removeLinkNear(x,y){
  for(let i=joints.length-1;i>=0;i--){
    const j=joints[i], pa=wpt(j.A,j.ax,j.ay), pb=wpt(j.B,j.bx,j.by);
    const dx=pb[0]-pa[0],dy=pb[1]-pa[1],l2=dx*dx+dy*dy;
    let t=l2>0?((x-pa[0])*dx+(y-pa[1])*dy)/l2:0; t=clamp(t,0,1);
    const d=Math.hypot(pa[0]+dx*t-x,pa[1]+dy*t-y);
    if(d<(j.type==='pin'?9:8)){
      if(!P.erased){pushUndo();P.erased=true;}
      joints.splice(i,1);rebuildNoColl();return true;
    }
  }
  return false;
}
function eraseAt(x,y){
  const hs=hitAll(x,y,true);
  if(hs.length){
    if(!P.erased){pushUndo();P.erased=true;}
    puff(hs[0].x,hs[0].y,6,'#ff9b9b',90,0.35,2.5,0,0.2);
    removeBody(hs[0]);updHud();return;
  }
  if(removeLinkNear(x,y))updHud();
}
function doWheel(x,y){
  if(!capCheck())return;
  const hs=hitAll(x,y,true).filter(b=>b.kind!=='wheel');
  pushUndo();
  const mk=curMat==='bunt'?'gummi':curMat;
  const wh=addBall(x,y,Math.max(8,sizeVal()),{mat:mk,e:Math.min(0.4,bounceVal()),kind:'wheel',color:curMat==='bunt'?'#ffe66d':undefined});
  if(hs.length){const l=lpt(hs[0],x,y);addJoint('pin',wh,0,0,hs[0],l[0],l[1],{motor:true});}
  else addJoint('pin',wh,0,0,null,x,y,{motor:true});
  updHud();
}
function rotGrab(da){

function throwVel(){
  const dx=P.x-P.sx,dy=P.y-P.sy;
  if(Math.hypot(dx,dy)<=12)return [0,0];
  return [clamp(dx*7,-2200,2200),clamp(dy*7,-2200,2200)];
}
function endPointer(e){
  if(!P.down)return;
  P.down=false; P.x=e.clientX;P.y=e.clientY;
  const dx=P.x-P.sx,dy=P.y-P.sy,dist=Math.hypot(dx,dy);
  switch(tool){
    case 'grab': mouse=null; break;
    case 'ball': case 'box':{const v=throwVel();spawnBody(tool,P.sx,P.sy,v[0],v[1]);break;}
    case 'form':{
      if(curShape==='draw'){if(P.path&&P.path.length>=6)makeFreeform(P.path);}
      else{const v=throwVel();spawnBody('form',P.sx,P.sy,v[0],v[1]);}
      break;
    }
    case 'pend':{
      const a=P.anchor||anchorAt(P.sx,P.sy); const [ax,ay]=anchorWorld(a);
      let ex=P.x,ey=P.y;
      if(Math.hypot(ex-ax,ey-ay)<25){const L=Math.min(170,Math.max(90,H*0.25));ex=ax+Math.sin(1.05)*L;ey=ay+Math.cos(1.05)*L;}
      if(!capCheck())break;
      pushUndo();
      const L=Math.hypot(ex-ax,ey-ay), bob=makeBob(ex,ey,0);
      const type=(linkMode==='pin'||linkMode==='motor')?'rod':linkMode;
      addJoint(type,a.b,a.lx,a.ly,bob,0,0,{len:L});
      break;
    }
    case 'chain':{
      const a=P.anchor||anchorAt(P.sx,P.sy);
      let ex=P.x,ey=P.y; const [ax,ay]=anchorWorld(a);
      if(Math.hypot(ex-ax,ey-ay)<60){ex=ax+Math.sin(1.0)*220;ey=ay+Math.cos(1.0)*220;}
      if(!capCheck())break;
      pushUndo(); makeChain(a,ex,ey,{}); break;
    }
    case 'link':{
      const a=P.anchor; if(!a)break;
      const b=anchorAt(P.x,P.y);
      if(!a.b&&!b.b){toast('Mindestens ein Ende muss an einem Körper hängen');break;}
      if(a.b&&a.b===b.b){toast('Zwei verschiedene Körper wählen');break;}
      pushUndo();
      const pa=anchorWorld(a);
      if(linkMode==='pin'||linkMode==='motor'){
        const mo={motor:linkMode==='motor'};
        if(a.b){const l=b.b?lpt(b.b,pa[0],pa[1]):pa;addJoint('pin',a.b,a.lx,a.ly,b.b,l[0],l[1],mo);}
        else{const l=lpt(b.b,pa[0],pa[1]);addJoint('pin',b.b,l[0],l[1],null,pa[0],pa[1],mo);}
      }else addJoint(linkMode,a.b,a.lx,a.ly,b.b,b.lx,b.ly);
      break;
    }
    case 'plank':{
      if(!capCheck())break;
      pushUndo();
      let x1=P.sx,y1=P.sy,x2=P.x,y2=P.y;
      if(dist<20){x1=P.sx-90;x2=P.sx+90;y1=y2=P.sy;}
      const len=Math.max(12,Math.hypot(x2-x1,y2-y1)), st=fixedVal(), bunt=curMat==='bunt';
      addBox((x1+x2)/2,(y1+y2)/2,len/2,7,{a:Math.atan2(y2-y1,x2-x1),static:st,e:Math.min(0.4,bounceVal()),
        mat:bunt?'holz':curMat,mu:bunt?0.6:undefined,density:bunt?0.002:undefined,color:st?'#7f98a8':undefined});
      break;
    }
  }
  P.anchor=null; P.path=null; updHud();
}

function doPin(x,y){
  const hs=hitAll(x,y,true);
  if(!hs.length){toast('Nagel muss auf einen Körper');return;}
  if(hs.length>=2){
    const a=hs[0],b=hs[1]; if(a.static&&b.static)return;
    pushUndo();
    const la=lpt(a,x,y),lb=lpt(b,x,y);
    addJoint('pin',a,la[0],la[1],b,lb[0],lb[1]);
  }else{
    const a=hs[0]; if(a.static){toast('Der ist schon fest');return;}
    pushUndo();
    const la=lpt(a,x,y); addJoint('pin',a,la[0],la[1],null,x,y);
  }
  updHud();
}

window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  const k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){
    if(k==='z'){e.preventDefault();undo();}
    else if(k==='s'){e.preventDefault();saveScene();}
    return;
  }
  if(e.code==='Space'){e.preventDefault();togglePause();return;}
  if(e.key==='ArrowLeft'||k==='a'){e.preventDefault();motorKey=-1;return;}
  if(e.key==='ArrowRight'||k==='d'){e.preventDefault();motorKey=1;return;}
  if(k==='n'||k==='.'){singleStep();return;}
  if(k==='r'){pushUndo();clearAll();updHud();return;}
  if(k==='s'){shake();return;}
  if(k==='q'){rotGrab(-0.08);return;}
  if(k==='e'){rotGrab(0.08);return;}
  const t=TOOLS.find(x=>x.key.toLowerCase()===k);
  if(t)setTool(t.id);
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if((e.key==='ArrowLeft'||k==='a')&&motorKey<0)motorKey=0;
  if((e.key==='ArrowRight'||k==='d')&&motorKey>0)motorKey=0;
});
window.addEventListener('blur',()=>{motorKey=0;});

function makeCar(x,y,sc){
  const s=v=>v.map(q=>q*sc);
  // flache Karosserie mit langem Radstand – tiefer Schwerpunkt, damit es am Hang nicht kippt
  const ch=addPoly(x,y,s([-64,8,64,8,64,-2,26,-18,-38,-18,-64,-6]),{mat:'bunt',density:0.002,color:'#ffb347',e:0.1,mu:0.5});
  for(const wx of [-46,46]){
    const px=x+wx*sc,py=y+12*sc;
    const wh=addBall(px,py,17*sc,{mat:'gummi',e:0.15,kind:'wheel',color:'#ffe66d'});
    const l=lpt(ch,px,py); addJoint('pin',wh,0,0,ch,l[0],l[1],{motor:true});
  }
  return ch;
}

  if(j.type==='rod'){
    if(j.chain){ctx.strokeStyle=OUT;ctx.lineWidth=5;line(pa,pb);ctx.strokeStyle='#cdd9e0';ctx.lineWidth=2.5;line(pa,pb);}
    else{ctx.strokeStyle=OUT;ctx.lineWidth=7;line(pa,pb);ctx.strokeStyle='#e4eef4';ctx.lineWidth=4;line(pa,pb);}
  }else if(j.type==='rope'){
    ctx.strokeStyle=j.color||'#e6c48a';ctx.lineWidth=j.color?1.6:3;
    ctx.beginPath();ctx.moveTo(pa[0],pa[1]);
    if(d<j.len-0.5){
      const sag=Math.sqrt(Math.max(0,j.len*j.len-d*d))*0.55;
      ctx.quadraticCurveTo((pa[0]+pb[0])/2,(pa[1]+pb[1])/2+sag*(G>=0?1:-1),pb[0],pb[1]);
    }else ctx.lineTo(pb[0],pb[1]);
    ctx.stroke();
  }else if(j.type==='spring'){
    const n=16,ux=dx/(d||1),uy=dy/(d||1),nx=-uy,ny=ux,amp=clamp(9*Math.sqrt(j.len/Math.max(d,1)),4,16);
    ctx.beginPath();ctx.moveTo(pa[0],pa[1]);
    const st=Math.min(14,d*0.12);
    ctx.lineTo(pa[0]+ux*st,pa[1]+uy*st);
    for(let i=0;i<n;i++){
      const t=st+(d-2*st)*(i+0.5)/n,s=(i%2?1:-1)*amp;
      ctx.lineTo(pa[0]+ux*t+nx*s,pa[1]+uy*t+ny*s);
    }
    ctx.lineTo(pb[0]-ux*st,pb[1]-uy*st);ctx.lineTo(pb[0],pb[1]);
    ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#9be7c4';ctx.lineWidth=2.5;ctx.stroke();
  }
}
function line(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function drawPins(j){
  if(j.type==='rope'&&j.color)return;
  const ends=[[j.A,j.ax,j.ay],[j.B,j.bx,j.by]];
  for(const [b,lx,ly] of ends){
    if(j.chain&&b!==WORLD)continue;
    const p=wpt(b,lx,ly);
    ctx.beginPath();ctx.arc(p[0],p[1],j.type==='pin'?5.5:5,0,7);
    ctx.fillStyle=b===WORLD?'#ffd36e':'#e8f4fa';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=OUT;ctx.stroke();
    ctx.beginPath();ctx.arc(p[0],p[1],1.6,0,7);ctx.fillStyle=OUT;ctx.fill();
    if(j.motor&&b===j.A){
      const ms=motorSpeed(), a0=j.A.a, r=Math.min(11,(j.A.br||11)*0.5+4);
      ctx.beginPath();ctx.arc(p[0],p[1],r,a0,a0+4.2*Math.sign(ms||1),ms<0);
      ctx.strokeStyle=ms?'#4ecdc4':'rgba(78,205,196,.4)';ctx.lineWidth=2;ctx.stroke();
    }
  }
}
function bodyPath(b){
  ctx.beginPath();
  if(b.type==='circle')ctx.arc(0,0,b.r,0,7);
  else{const v=b.lv;ctx.moveTo(v[0],v[1]);for(let i=2;i<v.length;i+=2)ctx.lineTo(v[i],v[i+1]);ctx.closePath();}
}
function drawWheel(b){
  const r=b.r;
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle='#22303a';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=OUT;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.beginPath();
  for(let k=0;k<10;k++){const a=k*0.6283;ctx.moveTo(Math.cos(a)*r*0.74,Math.sin(a)*r*0.74);ctx.lineTo(Math.cos(a)*r*0.93,Math.sin(a)*r*0.93);}
  ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*0.6,0,7);ctx.fillStyle=b.color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OUT;ctx.stroke();
  ctx.lineWidth=Math.max(1.5,r*0.09);ctx.beginPath();
  for(let k=0;k<3;k++){const a=k*2.0944;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*0.58,Math.sin(a)*r*0.58);}
  ctx.stroke();
}
function hatch(s){
  ctx.strokeStyle='rgba(6,20,29,.28)';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=-s*2;i<s*2;i+=7){ctx.moveTo(i,-s*2);ctx.lineTo(i+s*2,s*2);}
  ctx.stroke();
}
function grain(s){
  ctx.strokeStyle='rgba(90,50,20,.32)';ctx.lineWidth=1.3;ctx.beginPath();
  for(let y=-s+4,k=0;y<s;y+=6,k++){ctx.moveTo(-s,y);ctx.bezierCurveTo(-s*0.3,y+(k%2?3:-3),s*0.3,y+(k%2?-3:3),s,y);}
  ctx.stroke();
}
function drawBody(b){
  if(b.bound)return;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
  if(b.kind==='wheel'){drawWheel(b);ctx.restore();return;}
  bodyPath(b);
  if(b.mat==='eis'&&!b.static)ctx.globalAlpha=0.78;
  ctx.fillStyle=b.color;ctx.fill();ctx.globalAlpha=1;
  const s=b.br;
  if(b.static||b.mat==='holz'||b.mat==='eis'){
    ctx.save();ctx.clip();
    if(b.static)hatch(s);
    else if(b.mat==='holz')grain(s);
    else{ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-s*0.7,-s*0.05);ctx.lineTo(-s*0.05,-s*0.7);ctx.moveTo(-s*0.45,s*0.3);ctx.lineTo(s*0.3,-s*0.45);ctx.stroke();}
    ctx.restore();bodyPath(b);
  }
  ctx.lineWidth=2.5;ctx.strokeStyle=OUT;ctx.stroke();
  if(!b.static){
    if(b.type==='circle'){
      if(b.r>=8&&b.mat!=='ballon'){
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(b.r*0.8,0);ctx.lineWidth=2;ctx.strokeStyle='rgba(6,20,29,.45)';ctx.stroke();
        ctx.beginPath();ctx.arc(0,0,2,0,7);ctx.fillStyle='rgba(6,20,29,.5)';ctx.fill();
      }
    }else if(b.mat==='metall'){
      ctx.fillStyle='rgba(6,20,29,.5)';
      for(let i=0;i<2*b.n;i+=2){ctx.beginPath();ctx.arc(b.lv[i]*0.72,b.lv[i+1]*0.72,Math.min(2.4,s*0.1),0,7);ctx.fill();}
    }else if(b.mat==='bunt'&&b.hw>10&&b.hh>10){
      ctx.strokeStyle='rgba(6,20,29,.28)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-b.hw+4,-b.hh+4);ctx.lineTo(b.hw-4,b.hh-4);ctx.moveTo(b.hw-4,-b.hh+4);ctx.lineTo(-b.hw+4,b.hh-4);ctx.stroke();
    }
  }
  ctx.restore();
  if(b.type==='circle'&&b.r>=8&&!b.static){ // Glanzpunkt (unrotiert)
    if(b.mat==='ballon'){
      ctx.beginPath();ctx.moveTo(b.x,b.y+b.r-1);ctx.lineTo(b.x-4,b.y+b.r+6);ctx.lineTo(b.x+4,b.y+b.r+6);ctx.closePath();
      ctx.fillStyle=b.color;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=OUT;ctx.stroke();
      ctx.beginPath();ctx.ellipse(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.18,b.r*0.3,0.7,0,7);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(b.x-b.r*0.35,b.y-b.r*0.38,b.r*(b.mat==='metall'?0.26:0.2),0,7);ctx.fillStyle=b.mat==='metall'?'rgba(255,255,255,.55)':'rgba(255,255,255,.35)';ctx.fill();
    }
  }
}
function drawTrails(){
  for(const b of bodies){
    const t=b.trail; if(!t||t.length<4)continue;
    const n=t.length/2, chunk=10;
    ctx.lineWidth=2.4;ctx.lineCap='round';
    for(let i=0;i<n-1;i+=chunk){
      const end=Math.min(n-1,i+chunk);
      ctx.strokeStyle=b.color;ctx.globalAlpha=0.08+0.62*(i/n);
      ctx.beginPath();ctx.moveTo(t[i*2],t[i*2+1]);
      for(let k=i+1;k<=end;k++)ctx.lineTo(t[k*2],t[k*2+1]);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
function wavePath(close){
  const t=simT;
  ctx.beginPath();
  for(let x=0;x<=W+16;x+=16){
    const y=waterY+Math.sin(x*0.025+t*2.2)*2.4+Math.sin(x*0.061-t*1.5)*1.4;
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  if(close){ctx.lineTo(W,H-FLOOR_H);ctx.lineTo(0,H-FLOOR_H);ctx.closePath();}
}
function drawWater(){
  if(waterY>=H-FLOOR_H)return;
  wavePath(true);
  const gr=ctx.createLinearGradient(0,waterY,0,H-FLOOR_H);
  gr.addColorStop(0,'rgba(70,175,230,.30)');gr.addColorStop(1,'rgba(20,90,160,.48)');
  ctx.fillStyle=gr;ctx.fill();
  wavePath(false);ctx.strokeStyle='rgba(200,240,255,.85)';ctx.lineWidth=2;ctx.stroke();
}
function drawFx(){
  for(const p of parts){
    ctx.globalAlpha=clamp(p.l/p.L,0,1);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
  }
  for(const r of rings){
    ctx.globalAlpha=clamp(r.l/0.4,0,1);ctx.strokeStyle='#ffe2a8';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawArrows(){
  ctx.strokeStyle='#55efc4';ctx.fillStyle='#55efc4';ctx.lineWidth=2;
  for(const b of bodies){
    if(!b.im)continue;
    const sp=Math.hypot(b.vx,b.vy); if(sp<25)continue;
    const L=Math.min(140,sp*0.09),ux=b.vx/sp,uy=b.vy/sp,ex=b.x+ux*L,ey=b.y+uy*L;
    line([b.x,b.y],[ex,ey]);
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-ux*7-uy*4,ey-uy*7+ux*4);ctx.lineTo(ex-ux*7+uy*4,ey-uy*7-ux*4);ctx.closePath();ctx.fill();
  }
}
function drawTrajectory(vx,vy){
  const ge=G*(1-(curMat==='ballon'?MATS.ballon.lift:0));
  ctx.fillStyle='#ffd36e';
  for(let t=0.04;t<2;t+=0.04){
    const x=P.sx+vx*t+0.5*wind*t*t,y=P.sy+vy*t+0.5*ge*t*t;
    if(y>H-FLOOR_H||x<0||x>W||y<-200)break;
    ctx.globalAlpha=Math.max(0.15,0.9-t*0.45);
    ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawPreview(){
  if(!P.down)return;
  ctx.save();ctx.lineCap='round';
  if(tool==='ball'||tool==='box'||(tool==='form'&&curShape!=='draw')){
    const s=sizeVal();
    ctx.globalAlpha=.55;ctx.fillStyle=curMat==='bunt'?'#e8f4fa':MATS[curMat].color;ctx.strokeStyle=OUT;ctx.lineWidth=2;
    ctx.beginPath();
    if(tool==='ball')ctx.arc(P.sx,P.sy,s,0,7);
    else if(tool==='box')ctx.rect(P.sx-s,P.sy-s,2*s,2*s);
    else{const v=ngonV(+curShape,s*1.2);ctx.moveTo(P.sx+v[0],P.sy+v[1]);for(let i=2;i<v.length;i+=2)ctx.lineTo(P.sx+v[i],P.sy+v[i+1]);ctx.closePath();}
    ctx.fill();ctx.stroke();
    if(Math.hypot(P.x-P.sx,P.y-P.sy)>12){
      ctx.globalAlpha=1;ctx.strokeStyle='#ffb347';ctx.setLineDash([6,5]);ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(P.sx,P.sy);ctx.lineTo(P.x,P.y);ctx.stroke();
      ctx.setLineDash([]);const a=Math.atan2(P.y-P.sy,P.x-P.sx);
      ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x-12*Math.cos(a-.4),P.y-12*Math.sin(a-.4));ctx.moveTo(P.x,P.y);ctx.lineTo(P.x-12*Math.cos(a+.4),P.y-12*Math.sin(a+.4));ctx.stroke();
      if(!fixedVal()){const v=throwVel();drawTrajectory(v[0],v[1]);}
    }
  }else if(tool==='form'&&P.path){
    const p=P.path;
    ctx.strokeStyle='#ffb347';ctx.lineWidth=2.5;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.stroke();ctx.setLineDash([]);
    if(p.length>=6){
      const h=simplifyHull(hull(p),MAX_VERTS);
      ctx.globalAlpha=.35;ctx.fillStyle='#e8f4fa';ctx.beginPath();
      h.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
    }
  }else if(tool==='pend'||tool==='chain'||tool==='link'){
    const a=P.anchor; if(a){
      const pa=anchorWorld(a);
      ctx.strokeStyle='#ffb347';ctx.lineWidth=2.5;ctx.setLineDash([6,5]);line(pa,[P.x,P.y]);ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(pa[0],pa[1],6,0,7);ctx.fillStyle='#ffd36e';ctx.fill();ctx.strokeStyle=OUT;ctx.stroke();
      if(tool!=='link'){ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(P.x,P.y,Math.max(8,sizeVal()),0,7);ctx.fillStyle='#e8f4fa';ctx.fill();ctx.stroke();}
      else{const t=anchorAt(P.x,P.y);ctx.globalAlpha=1;ctx.beginPath();ctx.arc(P.x,P.y,t.b?9:5,0,7);ctx.strokeStyle=t.b?'#4ecdc4':'#ffd36e';ctx.lineWidth=2.5;ctx.stroke();}
    }
  }else if(tool==='plank'){
    ctx.strokeStyle=fixedVal()?'#9fb6c4':'#d9a35a';ctx.lineWidth=14;ctx.globalAlpha=.65;line([P.sx,P.sy],[P.x,P.y]);
  }else if(tool==='erase'){
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,10,0,7);ctx.stroke();
  }
  ctx.restore();
}
function drawCursorHint(){
  if(!P.over)return;
  if(tool==='bomb'){
    ctx.strokeStyle='rgba(255,107,107,.55)';ctx.setLineDash([5,6]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(P.x,P.y,200,0,7);ctx.stroke();ctx.setLineDash([]);
    return;
  }
  if(tool!=='grab')return;
  const b=mouse?mouse.b:hitAll(P.x,P.y,true)[0];
  if(!b)return;
  const sp=Math.hypot(b.vx,b.vy)/PPM;
  const txt=MATS[b.mat].name+(b.static?' · fest':' · '+b.m.toFixed(1)+' kg · '+sp.toFixed(1)+' m/s');
  ctx.font='11px Consolas,monospace';
  const w=ctx.measureText(txt).width+12, x=clamp(P.x+14,4,W-w-4), y=clamp(P.y-30,4,H-24);
  ctx.fillStyle='rgba(8,26,38,.88)';ctx.strokeStyle='rgba(180,225,245,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.rect(x,y,w,20);ctx.fill();ctx.stroke();
  ctx.fillStyle='#e8f4fa';ctx.fillText(txt,x+6,y+14);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(gridCv,0,0,W,H);
  if(shakeAmp>0.3)ctx.translate((Math.random()-.5)*shakeAmp,(Math.random()-.5)*shakeAmp);
  if(trailsOn)drawTrails();
  for(const j of joints)drawLink(j);
  for(const b of bodies)drawBody(b);
  for(const j of joints)drawPins(j);
  drawWater();
  drawFx();
  if(arrowsOn)drawArrows();
  if(mouse){
    const b=mouse.b,p=wpt(b,mouse.lx,mouse.ly);
    ctx.strokeStyle='#ffb347';ctx.lineWidth=2;ctx.setLineDash([4,4]);line(p,[mouse.tx,mouse.ty]);ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(mouse.tx,mouse.ty,5,0,7);ctx.fillStyle='#ffb347';ctx.fill();
  }
  drawPreview();
  drawCursorHint();
}

/* ---------- Hauptschleife ---------- */
let last=performance.now(),hudT=0,started=false;
function frame(t){
  const dt=Math.min((t-last)/1000,1/30);last=t;
  if(innerWidth!==W||innerHeight!==H)resize();
  if(!W||!H){requestAnimationFrame(frame);return;}
  if(!started){started=true;PRESETS.double();}
  if(!paused)step(dt*timeScale);
  shakeAmp*=0.86;
  draw();
  if(t-hudT>400){hudT=t;updHud();}
  requestAnimationFrame(frame);
}
resize();
setTool('grab');
requestAnimationFrame(frame);
window.__phys={get bodies(){return bodies;},get joints(){return joints;},PRESETS,runPreset,clearAll,step,draw,explode,serialize,restore,addBall,addBox,addPoly,addJoint};
</script>
</body>
