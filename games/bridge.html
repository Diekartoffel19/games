<script>
(() => {
'use strict';

/* ---------- Konstanten ---------- */
const G = 9.81;          // m/s²
const SUBSTEPS = 10;     // XPBD-Substeps pro 1/60 s
const DT = 1 / 60;
const WALL_L = 6, WALL_R = 26, GROUND_Y = 0, WATER_Y = 12;

// Einheiten: Meter, Tonnen, Kilonewton (Poly Bridge Materialeigenschaften)
const MAT = {
  road:  { name: 'Fahrbahn',    cost: 30, max: 4,  dens: 0.10,  k: 9500,  cap: 140, w: 0.30, road: true },
  wood:  { name: 'Holzbalken',  cost: 18, max: 5,  dens: 0.05,  k: 9000,  cap: 170, w: 0.22 },
  steel: { name: 'Stahlträger', cost: 55, max: 6,  dens: 0.14,  k: 42000, cap: 680, w: 0.20 },
  rope:  { name: 'Seil',        cost: 10, max: 12, dens: 0.012, k: 6500,  cap: 320, w: 0.07, rope: true },
  cable: { name: 'Stahlkabel',  cost: 32, max: 16, dens: 0.035, k: 34000, cap: 880, w: 0.09, rope: true, isCable: true },
  hyd:   { name: 'Hydraulik',   cost: 85, max: 5,  dens: 0.15,  k: 32000, cap: 600, w: 0.24, hyd: true }
};
const TOOLS = ['road', 'wood', 'steel', 'rope', 'cable', 'hyd', 'move', 'erase'];

const TRUCKS = [
  { name: 'Leicht-Pickup',        t: 2,   kind: 'pickup',  wb: 2.5, r: 0.40, col: '#c8472f', budget: 3200 },
  { name: 'Kurier-Van',           t: 4,   kind: 'van',     wb: 3.0, r: 0.44, col: '#f6d32d', budget: 3600 },
  { name: 'Handwerker-Bus',       t: 7,   kind: 'van',     wb: 3.4, r: 0.48, col: '#e9e1cf', budget: 4200 },
  { name: 'Gartenbau-Kipper',     t: 10,  kind: 'dump',    wb: 3.8, r: 0.52, col: '#2ec27e', budget: 4800 },
  { name: 'Baustellen-Kipper',    t: 14,  kind: 'dump',    wb: 4.2, r: 0.58, col: '#e0a21c', budget: 5500 },
  { name: 'Beton-Transporter',    t: 19,  kind: 'dump',    wb: 4.5, r: 0.60, col: '#3584e4', budget: 6200 },
  { name: 'Wasser-Tanker',        t: 25,  kind: 'tank',    wb: 4.8, r: 0.62, col: '#62a0ea', budget: 7000 },
  { name: 'Chemie-Tankwagen',     t: 32,  kind: 'tank',    wb: 5.2, r: 0.64, col: '#e66100', budget: 7900 },
  { name: 'Speditions-Sattelzug', t: 40,  kind: 'semi',    wb: 6.2, r: 0.62, col: '#2f6fa5', budget: 8900 },
  { name: 'Schwerer Sattelzug',   t: 50,  kind: 'semi',    wb: 6.6, r: 0.65, col: '#9141ac', budget: 10000 },
  { name: 'Monstertruck Rex',     t: 60,  kind: 'monster', wb: 3.8, r: 1.15, col: '#4aa84a', budget: 11200 },
  { name: 'Monstertruck Behemoth',t: 75,  kind: 'monster', wb: 4.2, r: 1.25, col: '#c01c28', budget: 12600 },
  { name: 'Titan-Monstertruck',   t: 90,  kind: 'monster', wb: 4.5, r: 1.35, col: '#8b3fb5', budget: 14200 },
  { name: 'Schwerlast-Tieflader', t: 115, kind: 'semi',   wb: 7.2, r: 0.68, col: '#f8e45c', budget: 16000 },
  { name: 'Muldenkipper Goliath', t: 145, kind: 'monster', wb: 5.2, r: 1.45, col: '#ffa348', budget: 18500 },
  { name: 'Koloss Mk I',          t: 180, kind: 'monster', wb: 5.6, r: 1.55, col: '#1c71d8', budget: 22000 }
];
function truckFor(level) {
  if (level < TRUCKS.length) return TRUCKS[level];
  const n = level - TRUCKS.length + 1;
  return { ...TRUCKS[TRUCKS.length - 1], name: 'Koloss Mk ' + (n + 1), t: 180 + 25 * n, budget: 22000 + 1200 * n };
}

/* ---------- Zustand ---------- */
let level = 0;
let tool = 'wood';
let build = [];          // {ax,ay,bx,by,type,hydMode}
let sim = null;          // läuft nur im Test
let simPaused = false;
let simSpeed = 1;        // 0.5, 1, 2, 4
let showStressNums = false;
let drag = null;         // {ax,ay,ex,ey}
let jointDrag = null;    // {origX,origY,curX,curY,valid,msg}
let hover = { x: 0, y: 0 };
let result = null;
let shake = 0;
let particles = [];
let clock = 0;
let acc = 0;
let lastTs = 0;
let cleared = 0;
try { cleared = (window.ArcadeCore && ArcadeCore.getScore('bridge')) || 0; } catch (e) {}
if (cleared > 0) level = Math.min(cleared, TRUCKS.length - 1);

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { s: 20, ox: 0, oy: 0 };

/* ---------- Geometrie ---------- */
function isAnchor(x, y) {
  const left = (x === WALL_L && y >= 0 && y <= 7) || (y === 0 && x >= 0 && x <= WALL_L) || (x === 3 && y >= -7 && y <= 0);
  const mx = 32 - x;
  const right = (mx === WALL_L && y >= 0 && y <= 7) || (y === 0 && mx >= 0 && mx <= WALL_L) || (mx === 3 && y >= -7 && y <= 0);
  return left || right;
}
function inRock(x, y) { return y > 0.01 && (x < WALL_L - 0.01 || x > WALL_R + 0.01); }
function ptOK(x, y) {
  if (y > 9 || y < -9 || x < -2 || x > 34) return false;
  if (isAnchor(x, y)) return true;
  return !(y > 0 && (x <= WALL_L || x >= WALL_R));
}
function segInRock(ax, ay, bx, by) {
  for (let i = 1; i < 12; i++) {
    const t = i / 12;
    if (inRock(ax + (bx - ax) * t, ay + (by - ay) * t)) return true;
  }
  return false;
}
function len(b) { return Math.hypot(b.bx - b.ax, b.by - b.ay); }
function costOf(b) { return Math.round(len(b) * (MAT[b.type] ? MAT[b.type].cost : 20)); }
function spent() { return build.reduce((s, b) => s + costOf(b), 0); }
function budget() { return truckFor(level).budget; }
function fmtEur(n) { return n.toLocaleString('de-DE') + ' €'; }
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function findJointNear(x, y, maxDist = 0.8) {
  let best = null, bd = maxDist;
  for (const b of build) {
    for (const pt of [{ x: b.ax, y: b.ay }, { x: b.bx, y: b.by }]) {
      const d = Math.hypot(pt.x - x, pt.y - y);
      if (d < bd) { bd = d; best = { x: pt.x, y: pt.y }; }
    }
  }
  return best;
}

/* ---------- Farben ---------- */
const STOPS = [[0, [63, 191, 106]], [0.5, [232, 210, 58]], [0.8, [240, 138, 44]], [1, [226, 59, 46]]];
function stressRGB(r) {
  r = Math.max(0, Math.min(1, r));
  for (let i = 1; i < STOPS.length; i++) {
    if (r <= STOPS[i][0]) {
      const [r0, c0] = STOPS[i - 1], [r1, c1] = STOPS[i];
      const t = (r - r0) / (r1 - r0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
    }
  }
  return STOPS[3][1];
}
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- Sound ---------- */
let ac = null, creakOsc = null, creakGain = null, engineOsc = null, engineGain = null;
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
  const A = window.AudioContext || window.webkitAudioContext;
  if (!A) return null;
  ac = new A();
  creakOsc = ac.createOscillator();
  creakGain = ac.createGain();
  creakOsc.type = 'sawtooth';
  creakOsc.frequency.value = 90;
  creakGain.gain.value = 0;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 420;
  creakOsc.connect(lp); lp.connect(creakGain); creakGain.connect(ac.destination);
  creakOsc.start();
  return ac;
}
function muted() { try { return window.ArcadeCore && ArcadeCore.isMuted(); } catch (e) { return false; } }

function creak(level01) {
  if (!ac || !creakGain) return;
  const g = muted() ? 0 : Math.max(0, (level01 - 0.65) / 0.35) * 0.08;
  creakGain.gain.setTargetAtTime(g, ac.currentTime, 0.05);
  creakOsc.frequency.setTargetAtTime(70 + level01 * 70 + Math.random() * 25, ac.currentTime, 0.04);
}
function crack(big = 1) {
  if (muted() || !audio()) return;
  const n = Math.floor(ac.sampleRate * 0.28);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 700; f.Q.value = 0.8;
  g.gain.value = 0.5 * big;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}
function splashSound() {
  if (muted() || !audio()) return;
  const n = Math.floor(ac.sampleRate * 0.35);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.8);
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 550;
  g.gain.value = 0.25;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}
function tone(freq, dur, type = 'triangle', vol = 0.12, delay = 0) {
  if (muted() || !audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
}
function place() { tone(220, 0.07, 'square', 0.05); }

function startEngine() {
  if (muted() || !audio()) return;
  if (!engineOsc) {
    try {
      engineOsc = ac.createOscillator();
      engineGain = ac.createGain();
      engineOsc.type = 'triangle';
      engineOsc.frequency.value = 45;
      engineGain.gain.value = 0;
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 260;
      engineOsc.connect(lp); lp.connect(engineGain); engineGain.connect(ac.destination);
      engineOsc.start();
    } catch (e) {}
  }
}
function updateEngine(speed, load) {
  if (!ac || !engineGain || !engineOsc) return;
  if (muted()) { engineGain.gain.value = 0; return; }
  const freq = 40 + Math.min(65, Math.abs(speed) * 11) + Math.min(30, load * 35);
  engineOsc.frequency.setTargetAtTime(freq, ac.currentTime, 0.08);
  engineGain.gain.setTargetAtTime(0.035 + Math.min(0.035, load * 0.035), ac.currentTime, 0.08);
}
function stopEngine() {
  if (engineGain && ac) engineGain.gain.setTargetAtTime(0, ac.currentTime, 0.05);
}

/* ---------- Simulation (XPBD) ---------- */
function startTest() {
  const nodes = [], map = new Map();
  const get = (x, y) => {
    const k = x + ',' + y;
    if (!map.has(k)) { map.set(k, nodes.length); nodes.push({ x, y, px: x, py: y, vx: 0, vy: 0, m: 0, fixed: isAnchor(x, y) }); }
    return map.get(k);
  };
  const beams = build.map(b => {
    const a = get(b.ax, b.ay), c = get(b.bx, b.by), m = MAT[b.type], L = len(b);
    nodes[a].m += m.dens * L / 2; nodes[c].m += m.dens * L / 2;
    const capC = m.rope ? 0 : m.cap * Math.min(1, Math.pow(3 / L, 1.2));
    return {
      a, b: c, type: b.type, m, rest: L, baseRest: L,
      hydMode: b.hydMode || 'expand', hyd: !!m.hyd, isCable: !!m.isCable,
      alpha: 1 / m.k, capT: m.cap, capC, f: 0, facc: 0, ratio: 0, dead: false, road: !!m.road
    };
  });
  nodes.forEach(n => { n.m = n.fixed ? 0 : Math.max(0.06, n.m + 0.03); n.w = n.fixed ? 0 : 1 / n.m; });
  const tk = truckFor(level);
  const speed = Math.max(3.4, 6 - tk.t * 0.035);
  sim = {
    nodes, beams, t: 0, state: 'run', endT: 0, maxRatio: 0, broken: 0, note: '',
    truck: { ...tk, x: -tk.wb - 5, speed, vx: speed * 0.9, fall: null, wheel: 0, ya: 0, yb: 0, suspY: 0 }
  };
  result = null; drag = null; jointDrag = null;
  simPaused = false;
  audio();
  startEngine();
  $('go').textContent = 'Bau-Modus'; $('go').classList.add('stop');
  $('tools').style.display = 'none';
  $('simControls').style.display = 'flex';
  $('gauge').classList.add('on');
  $('legend').style.display = 'none';
  setHint('Leertaste pausiert | 1-4 ändert Geschwindigkeit');
  updateSimUi();
}
function stopTest() {
  sim = null; result = null; acc = 0;
  creak(0);
  stopEngine();
  $('go').textContent = 'Stresstest starten'; $('go').classList.remove('stop');
  $('tools').style.display = 'flex';
  $('simControls').style.display = 'none';
  $('gauge').classList.remove('on');

}
function togglePause() {

  if (simPaused) stopEngine();
  else startEngine();
  updateSimUi();
}
function setSimSpeed(s) {

  updateSimUi();
}

  startTest();
}
function updateSimUi() {

function support(x) {
  let best = null;
  if (x <= WALL_L + 1e-4 || x >= WALL_R - 1e-4) best = { y: GROUND_Y, beam: null, t: 0 };
  for (const b of sim.beams) {
    if (b.dead || !b.road) continue;
    const A = sim.nodes[b.a], B = sim.nodes[b.b];
    if (Math.abs(B.x - A.x) < 0.2) continue;
    const lo = Math.min(A.x, B.x), hi = Math.max(A.x, B.x);
    if (x < lo - 1e-3 || x > hi + 1e-3) continue;
    const t = (x - A.x) / (B.x - A.x), y = A.y + (B.y - A.y) * t;
    if (!best || y < best.y - 1e-6) best = { y, beam: b, t };
  }
  return best;
}

function splash(x, y, count = 16) {
  splashSound();
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 1.2,
      y: y + (Math.random() - 0.5) * 0.2,
      vx: (Math.random() - 0.5) * 6,
      vy: -2.5 - Math.random() * 5.5,
      a: Math.random() * 6,
      va: (Math.random() - 0.5) * 8,
      l: 0.15 + Math.random() * 0.25,
      col: 'rgba(180, 225, 255, 0.85)',
      isWater: true,
      life: 0.95
    });
  }
}

function substep(h) {
  const { nodes, beams, truck } = sim;
  const h2 = h * h;
  const ext = new Array(nodes.length).fill(0);

  // Hydraulik-Ausdehnung / Zusammenziehen (Poly Bridge Mechanik)
  for (const b of beams) {
    if (b.dead || !b.hyd) continue;
    const p = Math.min(1, Math.max(0, (sim.t - 0.5) / 2.2));
    const smooth = p * p * (3 - 2 * p);
    const targetRatio = b.hydMode === 'contract' ? 0.65 : 1.35;
    b.rest = b.baseRest * (1 + (targetRatio - 1) * smooth);
  }

  if (!truck.fall && sim.state === 'run') {
    const sRear = support(truck.x);
    const sFront = support(truck.x + truck.wb);
    if (!sRear || !sFront) {
      const ya = sRear ? sRear.y : (sFront ? sFront.y : GROUND_Y);
      truck.fall = {
        x: truck.x, y: ya - truck.r,
        vx: truck.vx || truck.speed, vy: -0.4,
        ang: Math.atan2((sFront ? sFront.y : ya) - (sRear ? sRear.y : ya), truck.wb),
        w: (Math.random() - 0.5) * 1.5,
        splashed: false
      };
      sim.endT = sim.t; sim.note = 'Der Truck stürzt in die Schlucht.';
      crack(0.7);
    } else {
      truck.ya = sRear.y;
      truck.yb = sFront.y;
      const slope = Math.atan2(truck.yb - truck.ya, truck.wb);

      // Poly Bridge Fahrphysik: Motor-Zugkraft vs. Schwerkraft an Steigungen
      const motorDrive = (truck.speed - truck.vx) * 3.8;
      const slopePull = -Math.sin(slope) * G * 0.75;
      truck.vx += (motorDrive + slopePull) * h;
      truck.vx = Math.max(0.6, Math.min(truck.speed * 2.2, truck.vx));

      const stepDist = truck.vx * h;
      truck.x += stepDist * Math.cos(slope);
      truck.wheel += stepDist / truck.r;

      // Achslasten
      const total = truck.t * G;
      const fRear = total * 0.54, fFront = total * 0.46;
      if (sRear.beam) {
        ext[sRear.beam.a] += fRear * (1 - sRear.t);
        ext[sRear.beam.b] += fRear * sRear.t;
      }
      if (sFront.beam) {
        ext[sFront.beam.a] += fFront * (1 - sFront.t);
        ext[sFront.beam.b] += fFront * sFront.t;
      }

      // Federung / Vibration
      const targetSusp = (truck.ya + truck.yb) / 2;
      truck.suspY += (targetSusp - truck.suspY) * Math.min(1, 18 * h);

      // Auspuff-Partikel
      if (Math.random() < 0.22) {
        particles.push({
          x: truck.x - 0.4,
          y: truck.ya - truck.r * 0.65,
          vx: -1.2 - Math.random() * 1.4,
          vy: -0.3 - Math.random() * 0.5,
          a: Math.random() * 6,
          va: (Math.random() - 0.5) * 3,
          l: 0.15 + Math.random() * 0.15,
          col: 'rgba(190, 180, 170, 0.45)',
          isSmoke: true,
          life: 0.75
        });
      }
    }
  } else if (truck.fall) {
    const f = truck.fall;
    f.vy += G * h; f.x += f.vx * h; f.y += f.vy * h; f.ang += f.w * h;
    if (f.y >= WATER_Y && !f.splashed) {
      f.splashed = true;
      splash(f.x, WATER_Y, 26);
      f.vx *= 0.35; f.vy *= 0.2; f.w *= 0.2;
    }
    if (f.y > WATER_Y) { f.vx *= 0.94; f.vy *= 0.94; }
  }

  // Vorhersage
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.fixed) continue;
    n.px = n.x; n.py = n.y;
    n.vy += G * h;
    n.vx *= 1 - 1.6 * h; n.vy *= 1 - 1.6 * h;
    n.x += n.vx * h;
    n.y += n.vy * h + (ext[i] / n.m) * h2;
  }
  // Constraints
  for (const b of beams) {
    if (b.dead) continue;
    const A = nodes[b.a], B = nodes[b.b];
    const dx = A.x - B.x, dy = A.y - B.y;
    const l = Math.hypot(dx, dy) || 1e-9;
    const C = l - b.rest;
    if (b.m.rope && C < 0) continue;
    const at = b.alpha / h2;
    const wsum = A.w + B.w;
    if (wsum === 0) continue;
    const dl = -C / (wsum + at);
    const nx = dx / l, ny = dy / l;
    A.x += A.w * nx * dl; A.y += A.w * ny * dl;
    B.x -= B.w * nx * dl; B.y -= B.w * ny * dl;
    b.facc += -dl / h2;
  }
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.fixed) continue;
    n.vx = (n.x - n.px) / h; n.vy = (n.y - n.py) / h;
    if (n.y > WATER_Y + 1.5) { n.y = WATER_Y + 1.5; n.vy = 0; n.vx *= 0.8; }
  }
}

function stepFrame() {
  const h = DT / SUBSTEPS;
  for (const b of sim.beams) b.facc = 0;
  for (let i = 0; i < SUBSTEPS; i++) substep(h);
  sim.t += DT;

  let maxR = 0;
  for (const b of sim.beams) {
    if (b.dead) continue;
    const inst = b.facc / SUBSTEPS;
    b.f = b.f * 0.65 + inst * 0.35;
    const cap = b.f >= 0 ? b.capT : b.capC;
    b.ratio = b.f === 0 ? 0 : (cap > 0 ? Math.abs(b.f) / cap : 0);
    if (b.f < 0 && cap === 0) b.ratio = 0;
    if (b.ratio > maxR) maxR = b.ratio;
    if (b.ratio > 1) breakBeam(b);
  }
  sim.maxRatio = Math.max(0, maxR);

  const tr = sim.truck;
  updateEngine(tr.vx || 0, sim.maxRatio);

  if (sim.state === 'run') {
    if (!tr.fall && tr.x > WALL_R + 1.5) { sim.state = 'win'; sim.endT = sim.t; }
    else if (tr.fall && sim.t - sim.endT > 2.2) sim.state = 'lose';
    else if (sim.broken > 0 && !tr.fall && sim.t - (sim.firstBreak || 0) > 6) sim.state = 'lose';
    else if (sim.t > 45) sim.state = 'lose';
  }
  if (sim.state === 'win' && sim.t - sim.endT > 0.9) finish(true);
  if (sim.state === 'lose') finish(false);
}

function breakBeam(b) {
  b.dead = true;
  sim.broken++;
  if (!sim.firstBreak) sim.firstBreak = sim.t;
  const A = sim.nodes[b.a], B = sim.nodes[b.b];
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
  const mat = b.type;
  const col = mat === 'steel' ? '#aab8c6' : mat === 'cable' ? '#b8c9d9' : mat === 'hyd' ? '#e0a520' : mat === 'rope' ? '#d9c59a' : mat === 'road' ? '#5a463a' : '#c99a5b';
  const count = mat === 'rope' || mat === 'cable' ? 5 : 9;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: mx + (Math.random() - 0.5) * 0.6,
      y: my + (Math.random() - 0.5) * 0.6,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 6,
      a: Math.random() * 6,
      va: (Math.random() - 0.5) * 14,
      l: 0.2 + Math.random() * 0.5,
      col,
      life: 1.6
    });
  }
  shake = Math.min(1, shake + 0.7);
  crack(mat === 'steel' || mat === 'cable' ? 1.3 : 1);
  sim.note = (b.f < 0 ? 'Ein ' + b.m.name + ' wurde zerdrückt.' : 'Ein ' + b.m.name + ' ist gerissen.');
}

function finish(win) {
  if (result) return;
  creak(0);
  stopEngine();
  const tk = truckFor(level);
  result = win ? 'win' : 'lose';
  const box = $('resultBox');
  $('resultTitle').className = win ? 'win' : 'lose';
  const btns = $('resultBtns');
  btns.innerHTML = '';
  const add = (label, fn, primary) => {
    const b = document.createElement('button');
    b.textContent = label; if (primary) b.className = 'primary';
    b.addEventListener('click', () => { $('result').classList.remove('on'); fn(); });
    btns.appendChild(b); return b;
  };

  // Poly Bridge 3-Sterne-System:
  // Stern 1: Ziel erreicht (Bridge hold)
  // Stern 2: Budget eingehalten (Under budget)
  // Stern 3: Hohe Stabilität (Max Stress < 85% & 0 Brüche)
  const star1 = win;
  const star2 = win && (spent() <= budget());
  const star3 = win && (sim.broken === 0) && (sim.maxRatio < 0.85);

  $('star1').className = 'star' + (star1 ? ' lit' : '');
  $('star2').className = 'star' + (star2 ? ' lit' : '');
  $('star3').className = 'star' + (star3 ? ' lit' : '');

  const statsBox = $('resultStats');
  const sp = spent(), bd = budget();
  statsBox.innerHTML = `
    <div class="stat-item"><span class="stat-lbl">Materialkosten</span><span class="stat-val">${fmtEur(sp)} / ${fmtEur(bd)}</span></div>
    <div class="stat-item"><span class="stat-lbl">Höchste Last</span><span class="stat-val ${sim.maxRatio > 0.85 ? 'stress-hi' : ''}">${Math.round(sim.maxRatio * 100)} %</span></div>
    <div class="stat-item"><span class="stat-lbl">Gebrochen</span><span class="stat-val">${sim.broken} Bauteil(e)</span></div>
    <div class="stat-item"><span class="stat-lbl">Fahrzeug</span><span class="stat-val">${tk.name} (${tk.t} t)</span></div>
  `;

  if (win) {
    const left = budget() - spent();
    const nextTk = truckFor(level + 1);
    cleared = Math.max(cleared, level + 1);
    try { ArcadeCore.saveScore('bridge', cleared); } catch (e) {}
    try { if (window.umami) umami.track('bridge-win', { level: level + 1, truck: tk.name }); } catch (e) {}
    tone(523, 0.18, 'triangle', 0.14); tone(659, 0.18, 'triangle', 0.14, 0.14); tone(784, 0.3, 'triangle', 0.14, 0.28);
    $('resultTitle').textContent = 'Brücke hält!';
    $('resultText').textContent = `Der ${tk.name} ist sicher angekommen! ${star3 ? 'Hervorragende Konstruktion ohne Überlastung.' : sim.broken ? 'Einige Teile sind gebrochen, aber die Brücke hielt stand!' : 'Gute Arbeit!'} Nächste Stufe: ${nextTk.name} (${nextTk.t} t).`;
    add('Verstärken für ' + nextTk.name, () => { level++; stopTest(); refreshHud(); }, true);
    add('Neu bauen', () => { level++; build = []; stopTest(); refreshHud(); });
  } else {
    try { if (window.umami) umami.track('bridge-lose', { level: level + 1, truck: tk.name }); } catch (e) {}
    tone(160, 0.5, 'sawtooth', 0.12); tone(110, 0.6, 'sawtooth', 0.12, 0.2);
    $('resultTitle').textContent = sim.truck.fall ? 'Truck abgestürzt' : 'Brücke eingestürzt';
    $('resultText').textContent = (sim.note || 'Die Brücke hat nicht gehalten.') + ' Tipp: Nutze Dreiecksverbände, Stahlkabel für hohe Zuglasten oder Hydraulik zur Entlastung.';
    add('Weiter bauen', () => { stopTest(); }, true);
    add('Neu beginnen', () => { build = []; stopTest(); refreshHud(); });
  }
  $('result').classList.add('on');
  box.querySelector('button').focus();
}

/* ---------- Eingabe ---------- */
function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left - cam.ox) / cam.s, y: (ev.clientY - r.top - cam.oy) / cam.s };
}
function snapPt(w) { return { x: Math.round(w.x), y: Math.round(w.y) }; }
function dragCheck(d) {
  if (!d) return { ok: false };
  const m = MAT[tool];
  if (!m) return { ok: false };
  const L = Math.hypot(d.ex - d.ax, d.ey - d.ay);
  if (L < 0.5) return { ok: false, msg: '' };
  if (!ptOK(d.ex, d.ey)) return { ok: false, msg: 'Hier ist Fels oder Wasser.' };
  if (L > m.max + 1e-6) return { ok: false, msg: `Zu lang, max. ${m.max} m` };
  if (segInRock(d.ax, d.ay, d.ex, d.ey)) return { ok: false, msg: 'Balken kann nicht durch Fels.' };
  if (build.some(b => (b.ax === d.ax && b.ay === d.ay && b.bx === d.ex && b.by === d.ey) || (b.bx === d.ax && b.by === d.ay && b.ax === d.ex && b.ay === d.ey))) return { ok: false, msg: 'Da liegt schon ein Bauteil.' };
  const cost = Math.round(L * m.cost);
  if (spent() + cost > budget()) return { ok: false, msg: `Zu teuer, es fehlen ${fmtEur(spent() + cost - budget())}` };
  return { ok: true, L, cost, msg: `${L.toFixed(1)} m, ${fmtEur(cost)}` };
}
function eraseAt(w) {
  let best = -1, bd = 0.7;
  build.forEach((b, i) => { const d = distSeg(w.x, w.y, b.ax, b.ay, b.bx, b.by); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) { build.splice(best, 1); tone(150, 0.08, 'square', 0.06); refreshHud(); }
}

cv.addEventListener('pointerdown', ev => {
  if (sim || result) return;
  const w = toWorld(ev);
  if (ev.button === 2 || tool === 'erase') { eraseAt(w); return; }

  // Poly Bridge: Hydraulik-Richtung umschalten durch Klick
  if (tool === 'hyd') {
    let hitHyd = null, hd = 0.6;
    build.forEach(b => {
      if (b.type === 'hyd') {
        const d = distSeg(w.x, w.y, b.ax, b.ay, b.bx, b.by);
        if (d < hd) { hd = d; hitHyd = b; }
      }
    });
    if (hitHyd) {
      hitHyd.hydMode = hitHyd.hydMode === 'contract' ? 'expand' : 'contract';
      tone(350, 0.09, 'sine', 0.1);
      setHint(`Hydraulik: ${hitHyd.hydMode === 'contract' ? 'Zusammenziehen (-35%)' : 'Ausfahren (+35%)'}`);
      return;
    }
  }

  // Poly Bridge: Knoten verschieben (Move-Tool oder mit Shift)
  if (tool === 'move' || ev.shiftKey) {
    const j = findJointNear(w.x, w.y, 0.75);
    if (j && !isAnchor(j.x, j.y)) {
      cv.setPointerCapture(ev.pointerId);
      jointDrag = { origX: j.x, origY: j.y, curX: j.x, curY: j.y, valid: true, msg: 'Knoten an neue Position ziehen' };
      return;
    }
  }

  const p = snapPt(w);
  if (!ptOK(p.x, p.y)) return;
  cv.setPointerCapture(ev.pointerId);
  drag = { ax: p.x, ay: p.y, ex: p.x, ey: p.y };
});

cv.addEventListener('pointermove', ev => {
  const w = toWorld(ev); const p = snapPt(w);
  hover = p;
  if (drag) { drag.ex = p.x; drag.ey = p.y; }
  if (jointDrag) {
    jointDrag.curX = p.x;
    jointDrag.curY = p.y;
    // Gültigkeitsprüfung beim Verschieben
    if (!ptOK(p.x, p.y)) {
      jointDrag.valid = false; jointDrag.msg = 'Ungültige Position.';
    } else {
      let ok = true;
      let msg = '';
      for (const b of build) {
        const ax = (b.ax === jointDrag.origX && b.ay === jointDrag.origY) ? p.x : b.ax;
        const ay = (b.ax === jointDrag.origX && b.ay === jointDrag.origY) ? p.y : b.ay;
        const bx = (b.bx === jointDrag.origX && b.by === jointDrag.origY) ? p.x : b.bx;
        const by = (b.bx === jointDrag.origX && b.by === jointDrag.origY) ? p.y : b.by;
        if (ax === p.x && ay === p.y || bx === p.x && by === p.y) {
          const l = Math.hypot(bx - ax, by - ay);
          const m = MAT[b.type];
          if (l > m.max + 1e-4) { ok = false; msg = `${m.name} wird zu lang!`; break; }
          if (segInRock(ax, ay, bx, by)) { ok = false; msg = 'Kollision mit Fels!'; break; }
        }
      }
      jointDrag.valid = ok;
      jointDrag.msg = ok ? 'Position loslassen zum Platzieren' : msg;
    }
  }
});

function endDrag() {
  if (jointDrag) {
    if (jointDrag.valid && (jointDrag.curX !== jointDrag.origX || jointDrag.curY !== jointDrag.origY)) {
      for (const b of build) {
        if (b.ax === jointDrag.origX && b.ay === jointDrag.origY) { b.ax = jointDrag.curX; b.ay = jointDrag.curY; }
        if (b.bx === jointDrag.origX && b.by === jointDrag.origY) { b.bx = jointDrag.curX; b.by = jointDrag.curY; }
      }
      build = build.filter(b => b.ax !== b.bx || b.ay !== b.by);
      place();
      refreshHud();
    }
    jointDrag = null;
    return;
  }
  if (!drag) return;
  const c = dragCheck(drag);
  if (c.ok) {
    build.push({ ax: drag.ax, ay: drag.ay, bx: drag.ex, by: drag.ey, type: tool, hydMode: 'expand' });
    place();
    refreshHud();
  }
  drag = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; jointDrag = null; });
cv.addEventListener('contextmenu', ev => { ev.preventDefault(); if (!sim && !result) eraseAt(toWorld(ev)); });

addEventListener('keydown', ev => {
  if (result) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { if (!sim) { build.pop(); refreshHud(); } ev.preventDefault(); return; }
  if (ev.key === 'Escape') { drag = null; jointDrag = null; return; }
  if (ev.key === ' ' && ev.target === document.body) {
    ev.preventDefault();
    if (sim) togglePause();
    else $('go').click();
    return;
  }
  if (sim) {
    if (ev.key.toLowerCase() === 'r') { restartTest(); return; }
    if (ev.key === '1') { setSimSpeed(0.5); return; }
    if (ev.key === '2') { setSimSpeed(1); return; }
    if (ev.key === '3') { setSimSpeed(2); return; }
    if (ev.key === '4') { setSimSpeed(4); return; }
    return;
  }
  const n = parseInt(ev.key, 10);
  if (n >= 1 && n <= 6) setTool(TOOLS[n - 1]);
  if (ev.key.toLowerCase() === 'm' || ev.key.toLowerCase() === 'v') setTool('move');
  if (ev.key.toLowerCase() === 'e') setTool('erase');
});

/* ---------- HUD & Tools ---------- */
function setHint(t) { $('hint').textContent = t; $('hint').style.opacity = t ? 1 : 0; }
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t ? 'true' : 'false'));
  if (t === 'move') setHint('Klicke auf einen freien Knoten und ziehe ihn an eine neue Stelle.');
  else if (t === 'hyd') setHint('Hydraulik platzieren. Durch Klick auf bestehende Hydraulik wird Modus (+ / -) umgeschaltet.');
  else if (t === 'erase') setHint('Klicke auf Bauteile zum Löschen (Rechtsklick geht auch).');
}

function buildTools() {
  const box = $('tools');

    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.tool = t;
    if (t === 'erase') b.innerHTML = '<span class="sw erase"></span><span class="nm">Abreißen</span><span class="pr">Geld zurück</span>';
    else if (t === 'move') b.innerHTML = '<span class="sw move"></span><span class="nm">Verschieben</span><span class="pr">Knoten anpassen</span>';
    else {
      const m = MAT[t];
      b.innerHTML = `<span class="sw ${t}"></span><span class="nm">${m.name}</span><span class="pr">${m.cost} €/m, max. ${m.max} m</span>`;
    }
    b.addEventListener('click', () => setTool(t));
    box.appendChild(b);
  });
  const undo = document.createElement('button');
  undo.className = 'tool small'; undo.textContent = 'Zurück'; undo.title = 'Letzten Balken entfernen (Strg+Z)';
  undo.addEventListener('click', () => { if (!sim) { build.pop(); refreshHud(); } });
  const clear = document.createElement('button');
  clear.className = 'tool small'; clear.textContent = 'Alles weg';
  clear.addEventListener('click', () => { if (!sim && build.length && confirm('Die ganze Brücke abreißen?')) { build = []; refreshHud(); } });

  // Simulations-Steuerung (Poly Bridge Sim Controls)

  sc.innerHTML = `
    <button id="simPauseBtn" class="simBtn" title="Simulation anhalten/fortsetzen (Leertaste)">⏸ Pause</button>
    <button class="simBtn speedBtn" data-speed="0.5" title="Zeitlupe 0.5x">0.5x</button>
    <button class="simBtn speedBtn active" data-speed="1" title="Normal 1x">1x</button>
    <button class="simBtn speedBtn" data-speed="2" title="Schnell 2x">2x</button>
    <button class="simBtn speedBtn" data-speed="4" title="Zeitraffer 4x">4x</button>
    <button id="simStressBtn" class="simBtn stressToggle" title="Spannungs-Prozente auf Bauteilen einblenden">% Last</button>
    <button id="simRestartBtn" class="simBtn" title="Stresstest von vorne beginnen (R)">↺ Neustart</button>
  `;
  $('simPauseBtn').addEventListener('click', togglePause);
  sc.querySelectorAll('.speedBtn').forEach(btn => {
    btn.addEventListener('click', () => setSimSpeed(parseFloat(btn.dataset.speed)));
  });
  $('simStressBtn').addEventListener('click', () => {
    showStressNums = !showStressNums;
    updateSimUi();
  });
  $('simRestartBtn').addEventListener('click', restartTest);

  setTool(tool);
}

function refreshHud() {
  const tk = truckFor(level);
  $('truckName').innerHTML = `Test: ${tk.name}, <span>${tk.t} t</span>`;
  const st = $('stages'); st.innerHTML = '';

  for (let i = 0; i < n; i++) { const e = document.createElement('i'); e.className = i < cleared && i !== level ? 'done' : i === level ? 'now' : ''; st.appendChild(e); }
  const sp = spent(), bd = budget();
  $('budgetNum').textContent = fmtEur(Math.max(0, bd - sp));
  const f = $('budgetFill'); f.style.width = Math.min(100, sp / bd * 100) + '%';
  f.classList.toggle('over', sp > bd * 0.92);
}
$('go').addEventListener('click', () => {
  if (result) return;
  if (sim) { stopTest(); return; }
  startTest();
});
addEventListener('arcade_mute_changed', () => { creak(0); stopEngine(); });

/* ---------- Rendering ---------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  const top = W < 720 ? 100 : 64, bottom = $('bar').offsetHeight + 6;
  const availH = Math.max(120, H - top - bottom);
  cam.s = Math.min(W / 38, availH / 22);
  cam.ox = (W - 38 * cam.s) / 2 + 3 * cam.s;
  cam.oy = top + (availH - 22 * cam.s) / 2 + 8 * cam.s;
}
addEventListener('resize', resize);

function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rng(42);
const strata = Array.from({ length: 46 }, (_, i) => ({ y: i * 0.3, h: 0.08 + R() * 0.3, a: 0.05 + R() * 0.18, dark: R() > 0.45 }));
const mesas = (() => { const a = []; let x = -20; while (x < 60) { const w = 3 + R() * 8, h = 2 + R() * 4; a.push({ x, w, h, step: R() * 0.8 }); x += w * 0.7; } return a; })();
const stars = Array.from({ length: 40 }, () => ({ x: R(), y: R() * 0.35, r: 0.5 + R() * 1.2 }));

function sx(x) { return cam.ox + x * cam.s; }
function sy(y) { return cam.oy + y * cam.s; }

function drawBackdrop(t) {
  const horizon = sy(-1.2);
  let g = ctx.createLinearGradient(0, 0, 0, horizon + cam.s * 3);
  g.addColorStop(0, '#171531'); g.addColorStop(0.45, '#5a2d52'); g.addColorStop(0.8, '#d4665a'); g.addColorStop(1, '#f3a65c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,240,220,0.8)';
  for (const s of stars) { ctx.globalAlpha = 0.5; ctx.fillRect(s.x * W, s.y * H, s.r, s.r); }
  ctx.globalAlpha = 1;
  // Sonne
  const sunX = sx(17), sunY = sy(-3.2), sr = cam.s * 2.6;
  g = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sr * 2.8);
  g.addColorStop(0, 'rgba(255,214,140,0.9)'); g.addColorStop(0.25, 'rgba(255,176,98,0.45)'); g.addColorStop(1, 'rgba(255,140,80,0)');
  ctx.fillStyle = g; ctx.fillRect(sunX - sr * 3, sunY - sr * 3, sr * 6, sr * 6);
  ctx.fillStyle = '#ffe3a8'; ctx.beginPath(); ctx.arc(sunX, sunY, sr * 0.7, 0, 7); ctx.fill();
  // Mesas
  ctx.fillStyle = '#6b3550';
  for (const m of mesas) {
    const x0 = sx(m.x * 0.8 + 3), w = m.w * cam.s * 0.8, h = m.h * cam.s * 0.5;
    ctx.fillRect(x0, horizon - h, w, h + cam.s * 3);
    ctx.fillRect(x0 - w * m.step * 0.3, horizon - h * 0.55, w * (1 + m.step * 0.6), h * 0.55 + cam.s * 3);
  }
  // Schlucht
  g = ctx.createLinearGradient(0, sy(0), 0, sy(WATER_Y));
  g.addColorStop(0, '#7a3d44'); g.addColorStop(0.55, '#41222f'); g.addColorStop(1, '#1d1220');
  ctx.fillStyle = g; ctx.fillRect(sx(WALL_L), sy(0), (WALL_R - WALL_L) * cam.s, (WATER_Y) * cam.s);
  // Wasser
  g = ctx.createLinearGradient(0, sy(WATER_Y), 0, sy(WATER_Y + 5));
  g.addColorStop(0, '#2c5a66'); g.addColorStop(1, '#0d1e28');
  ctx.fillStyle = g; ctx.fillRect(sx(WALL_L), sy(WATER_Y), (WALL_R - WALL_L) * cam.s, H);
  ctx.strokeStyle = 'rgba(255,214,160,0.28)'; ctx.lineWidth = 1.5;
  for (let r = 0; r < 4; r++) {
    ctx.beginPath();
    for (let x = WALL_L; x <= WALL_R; x += 0.5) {
      const yy = WATER_Y + 0.4 + r * 0.55 + Math.sin(x * 1.4 + t * 1.2 + r) * 0.06;
      x === WALL_L ? ctx.moveTo(sx(x), sy(yy)) : ctx.lineTo(sx(x), sy(yy));
    }
    ctx.stroke();
  }
  // Dunst
  g = ctx.createLinearGradient(0, sy(WATER_Y - 3), 0, sy(WATER_Y + 0.5));
  g.addColorStop(0, 'rgba(210,120,100,0)'); g.addColorStop(1, 'rgba(210,120,100,0.28)');
  ctx.fillStyle = g; ctx.fillRect(sx(WALL_L), sy(WATER_Y - 3), (WALL_R - WALL_L) * cam.s, cam.s * 3.5);
}

function drawRock(x0, x1) {
  const top = sy(0), bot = H + 20;
  const g = ctx.createLinearGradient(0, top, 0, sy(14));
  g.addColorStop(0, '#b4693e'); g.addColorStop(0.35, '#7c3f2a'); g.addColorStop(1, '#2c1713');
  ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, bot - top);
  for (const s of strata) {
    ctx.fillStyle = s.dark ? `rgba(30,12,10,${s.a})` : `rgba(255,190,130,${s.a * 0.7})`;
    ctx.fillRect(x0, sy(0.35 + s.y), x1 - x0, s.h * cam.s);
  }
  ctx.fillStyle = '#2a2024'; ctx.fillRect(x0, sy(-0.02), x1 - x0, cam.s * 0.16);
  ctx.fillStyle = '#e8c38a'; ctx.fillRect(x0, sy(-0.02), x1 - x0, 2);
}
function drawPylon(cx) {
  const x0 = sx(cx - 0.55), w = cam.s * 1.1, y0 = sy(-7.5), h = cam.s * 7.5;
  const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
  g.addColorStop(0, '#8d4b32'); g.addColorStop(0.5, '#b86f46'); g.addColorStop(1, '#6a3524');
  ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = 'rgba(30,12,10,0.25)';
  for (let i = 1; i < 8; i++) ctx.fillRect(x0, y0 + i * h / 8, w, 2);
  ctx.fillStyle = '#d38b57'; ctx.fillRect(x0 - 3, y0 - 5, w + 6, 7);
}

function drawGrid() {
  ctx.fillStyle = 'rgba(255,230,190,0.15)';
  for (let x = -1; x <= 33; x++) for (let y = -8; y <= 9; y++) {
    if (!ptOK(x, y) || isAnchor(x, y)) continue;
    ctx.fillRect(sx(x) - 1, sy(y) - 1, 2, 2);
  }
  for (let x = 0; x <= 32; x++) for (let y = -7; y <= 7; y++) {
    if (!isAnchor(x, y)) continue;
    // Poly Bridge Felsen-Ankerpunkte
    ctx.fillStyle = '#1c1416';
    ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.22, 0, 7); ctx.fill();
    ctx.strokeStyle = '#f2a93b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.16, 0, 7); ctx.stroke();
    ctx.fillStyle = '#f2a93b';
    ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.07, 0, 7); ctx.fill();
  }
}

function beamPath(ax, ay, bx, by, rope, slackLen) {
  ctx.beginPath(); ctx.moveTo(sx(ax), sy(ay));
  if (rope && slackLen > 0) {
    const mx = (ax + bx) / 2, my = (ay + by) / 2 + slackLen;
    ctx.quadraticCurveTo(sx(mx), sy(my), sx(bx), sy(by));
  } else ctx.lineTo(sx(bx), sy(by));
}

function drawBeam(ax, ay, bx, by, type, ratio, live, jitter) {
  const m = MAT[type];
  const wpx = Math.max(2, m.w * cam.s);
  const rest = Math.hypot(bx - ax, by - ay);
  ctx.lineCap = 'round';
  if (jitter) { const j = (Math.random() - 0.5) * 0.05; ax += j; by += j; }
  if (live) {
    const c = stressRGB(ratio);
    if (ratio > 0.55) {
      ctx.strokeStyle = rgb(c, 0.22 + 0.45 * Math.min(1, (ratio - 0.55) / 0.45));
      ctx.lineWidth = wpx + cam.s * (0.18 + 0.32 * ratio);
      beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(20,10,10,0.8)'; ctx.lineWidth = wpx + 3; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
    ctx.strokeStyle = rgb(c); ctx.lineWidth = wpx; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
    if (type === 'steel') { ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = Math.max(1, wpx * 0.28); beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); }
    if (type === 'road') { ctx.strokeStyle = 'rgba(20,10,10,0.55)'; ctx.lineWidth = wpx * 0.35; beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); }
    return;
  }
  ctx.strokeStyle = 'rgba(20,10,10,0.75)'; ctx.lineWidth = wpx + 3; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  const col = type === 'wood' ? '#c99a5b' : type === 'steel' ? '#8fa3b6' : '#5a463a';
  ctx.strokeStyle = col; ctx.lineWidth = wpx; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  if (type === 'steel') {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = Math.max(1, wpx * 0.25); beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  }
  if (type === 'road') {
    // Fahrbahn-Mittelstreifen (Poly Bridge Stil)
    ctx.strokeStyle = '#d8b27a'; ctx.lineWidth = Math.max(1, wpx * 0.22);
    beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  }
  if (type === 'wood') {
    ctx.strokeStyle = 'rgba(70,35,15,0.5)'; ctx.lineWidth = 1; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  }
}

function drawRope(ax, ay, bx, by, ratio, live, slack) {
  const wpx = Math.max(2, MAT.rope.w * cam.s);
  ctx.lineCap = 'round';
  if (live && ratio > 0.55) {
    ctx.strokeStyle = rgb(stressRGB(ratio), 0.3 + 0.45 * ratio); ctx.lineWidth = wpx + cam.s * 0.25;
    beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(20,10,10,0.75)'; ctx.lineWidth = wpx + 2; beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
  ctx.strokeStyle = live ? rgb(stressRGB(ratio)) : '#d9c59a'; ctx.lineWidth = wpx; beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
}

function drawCable(ax, ay, bx, by, ratio, live, slack) {
  const wpx = Math.max(2.5, MAT.cable.w * cam.s);
  ctx.lineCap = 'round';
  if (live && ratio > 0.55) {
    ctx.strokeStyle = rgb(stressRGB(ratio), 0.3 + 0.45 * ratio); ctx.lineWidth = wpx + cam.s * 0.25;
    beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(15,18,24,0.85)'; ctx.lineWidth = wpx + 2.5; beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
  ctx.strokeStyle = live ? rgb(stressRGB(ratio)) : '#b4c7dc'; ctx.lineWidth = wpx; beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
  // Glanzstreifen auf Stahlkabel
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1, wpx * 0.3); beamPath(ax, ay, bx, by, true, slack); ctx.stroke();
}

function drawHydraulic(ax, ay, bx, by, ratio, live, mode = 'expand') {
  const wpx = Math.max(3, MAT.hyd.w * cam.s);
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  ctx.lineCap = 'round';

  if (live && ratio > 0.55) {
    ctx.strokeStyle = rgb(stressRGB(ratio), 0.3 + 0.45 * ratio); ctx.lineWidth = wpx + cam.s * 0.3;
    beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  }

  // Zylindergehäuse (Hälfte A bis Mitte)
  ctx.strokeStyle = '#1b1418'; ctx.lineWidth = wpx + 3;
  ctx.beginPath(); ctx.moveTo(sx(ax), sy(ay)); ctx.lineTo(sx(mx), sy(my)); ctx.stroke();
  ctx.strokeStyle = live ? rgb(stressRGB(ratio)) : (mode === 'contract' ? '#3da2e5' : '#e5a520');
  ctx.lineWidth = wpx;
  ctx.beginPath(); ctx.moveTo(sx(ax), sy(ay)); ctx.lineTo(sx(mx), sy(my)); ctx.stroke();

  // Chrom-Kolbenstange (Mitte bis B)
  ctx.strokeStyle = '#1b1418'; ctx.lineWidth = wpx * 0.6 + 2.5;
  ctx.beginPath(); ctx.moveTo(sx(mx), sy(my)); ctx.lineTo(sx(bx), sy(by)); ctx.stroke();
  ctx.strokeStyle = '#e6edf5'; ctx.lineWidth = wpx * 0.6;
  ctx.beginPath(); ctx.moveTo(sx(mx), sy(my)); ctx.lineTo(sx(bx), sy(by)); ctx.stroke();

  // Zylinderkopf / Muffe
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(sx(mx), sy(my), wpx * 0.7, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx(mx), sy(my), wpx * 0.3, 0, 7); ctx.fill();

  // Modus-Markierung im Bau-Modus
  if (!live) {
    ctx.fillStyle = mode === 'contract' ? '#3da2e5' : '#ffc83b';
    ctx.font = `bold ${Math.max(10, cam.s * 0.35)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(mode === 'contract' ? '[-]' : '[+]', sx(mx), sy(my) - wpx - 4);
  }
}

function joint(x, y, fixed) {
  ctx.fillStyle = fixed ? '#f2a93b' : '#221a20';
  ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * (fixed ? 0.16 : 0.18), 0, 7); ctx.fill();
  ctx.fillStyle = fixed ? '#fff2d4' : '#c8b89e';
  ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.08, 0, 7); ctx.fill();
  ctx.fillStyle = '#110c10';
  ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.03, 0, 7); ctx.fill();
}

function drawStressBadge(x, y, pct, isComp) {
  const txt = pct + '%' + (isComp ? ' D' : ' Z');
  ctx.font = `bold ${Math.max(10, cam.s * 0.38)}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(txt).width;
  const padX = 5, h = cam.s * 0.44;
  const c = stressRGB(pct / 100);
  ctx.fillStyle = 'rgba(20, 14, 18, 0.9)';
  ctx.strokeStyle = rgb(c, 0.9);
  ctx.lineWidth = 1.2;
  const rx = sx(x) - tw / 2 - padX, ry = sy(y) - h / 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rx, ry, tw + padX * 2, h, 4);
  else ctx.rect(rx, ry, tw + padX * 2, h);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = rgb(c);
  ctx.fillText(txt, sx(x), sy(y));
}

function drawStructure() {
  if (sim) {
    const { nodes, beams } = sim;
    const used = new Set();
    const order = [...beams].filter(b => !b.dead).sort((p, q) => (q.type === 'rope' || q.type === 'cable') - (p.type === 'rope' || p.type === 'cable') || (p.type === 'road') - (q.type === 'road'));
    for (const b of order) {
      const A = nodes[b.a], B = nodes[b.b];
      used.add(b.a); used.add(b.b);
      const l = Math.hypot(B.x - A.x, B.y - A.y);
      const slack = Math.min(1.2, Math.sqrt(Math.max(0, b.rest * b.rest - l * l)) * 0.5);

      if (b.type === 'rope') drawRope(A.x, A.y, B.x, B.y, b.ratio, true, slack);
      else if (b.type === 'cable') drawCable(A.x, A.y, B.x, B.y, b.ratio, true, slack);
      else if (b.type === 'hyd') drawHydraulic(A.x, A.y, B.x, B.y, b.ratio, true, b.hydMode);
      else drawBeam(A.x, A.y, B.x, B.y, b.type, b.ratio, true, b.ratio > 0.92);

      // Poly Bridge Belastungszahlen auf den Bauteilen
      if (showStressNums || b.ratio > 0.65) {
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        drawStressBadge(mx, my, Math.round(b.ratio * 100), b.f < 0);
      }
    }
    used.forEach(i => { if (nodes[i].y < WATER_Y + 1.4) joint(nodes[i].x, nodes[i].y, nodes[i].fixed); });
  } else {
    const order = [...build].sort((p, q) => (q.type === 'rope' || q.type === 'cable') - (p.type === 'rope' || p.type === 'cable') || (p.type === 'road') - (q.type === 'road'));
    for (const b of order) {
      if (b.type === 'rope') drawRope(b.ax, b.ay, b.bx, b.by, 0, false, 0);
      else if (b.type === 'cable') drawCable(b.ax, b.ay, b.bx, b.by, 0, false, 0);
      else if (b.type === 'hyd') drawHydraulic(b.ax, b.ay, b.bx, b.by, 0, false, b.hydMode || 'expand');
      else drawBeam(b.ax, b.ay, b.bx, b.by, b.type, 0, false, false);
    }
    const seen = new Set();
    for (const b of build) {
      for (const [x, y] of [[b.ax, b.ay], [b.bx, b.by]]) {
        const k = x + ',' + y;
        if (!seen.has(k)) { seen.add(k); joint(x, y, isAnchor(x, y)); }
      }
    }
  }
}

function drawPreview() {
  if (sim || result) return;
  if (tool === 'erase') {
    let best = null, bd = 0.7;
    build.forEach(b => { const d = distSeg(hover.x, hover.y, b.ax, b.ay, b.bx, b.by); if (d < bd) { bd = d; best = b; } });
    if (best) {
      ctx.strokeStyle = 'rgba(226,59,46,0.85)';
      ctx.lineWidth = Math.max(3, (MAT[best.type] ? MAT[best.type].w : 0.2) * cam.s + 5);
      ctx.lineCap = 'round';
      beamPath(best.ax, best.ay, best.bx, best.by, false, 0); ctx.stroke();
    }
    return;
  }
  if (tool === 'move' || jointDrag) {
    if (jointDrag) {
      ctx.strokeStyle = jointDrag.valid ? 'rgba(63, 191, 106, 0.8)' : 'rgba(226, 59, 46, 0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([cam.s * 0.2, cam.s * 0.2]);
      ctx.beginPath();
      ctx.arc(sx(jointDrag.curX), sy(jointDrag.curY), cam.s * 0.28, 0, 7);
      ctx.stroke();
      ctx.setLineDash([]);
      // Vorschau der verbundenen Balken
      for (const b of build) {
        if (b.ax === jointDrag.origX && b.ay === jointDrag.origY || b.bx === jointDrag.origX && b.by === jointDrag.origY) {
          const ax = (b.ax === jointDrag.origX && b.ay === jointDrag.origY) ? jointDrag.curX : b.ax;
          const ay = (b.ax === jointDrag.origX && b.ay === jointDrag.origY) ? jointDrag.curY : b.ay;
          const bx = (b.bx === jointDrag.origX && b.by === jointDrag.origY) ? jointDrag.curX : b.bx;
          const by = (b.bx === jointDrag.origX && b.by === jointDrag.origY) ? jointDrag.curY : b.by;
          ctx.strokeStyle = jointDrag.valid ? 'rgba(63, 191, 106, 0.55)' : 'rgba(226, 59, 46, 0.55)';
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(sx(ax), sy(ay)); ctx.lineTo(sx(bx), sy(by)); ctx.stroke();
        }
      }
    } else {
      const j = findJointNear(hover.x, hover.y, 0.75);
      if (j && !isAnchor(j.x, j.y)) {
        ctx.strokeStyle = 'rgba(63, 191, 106, 0.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx(j.x), sy(j.y), cam.s * 0.26, 0, 7); ctx.stroke();
      }
    }
    return;
  }
  if (ptOK(hover.x, hover.y)) {
    ctx.strokeStyle = 'rgba(255,240,210,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx(hover.x), sy(hover.y), cam.s * 0.24, 0, 7); ctx.stroke();
  }
  if (!drag) return;
  const c = dragCheck(drag), m = MAT[tool];
  if (!m) return;
  ctx.lineCap = 'round';
  ctx.strokeStyle = c.ok ? 'rgba(255,240,210,0.7)' : 'rgba(226,59,46,0.8)';
  ctx.setLineDash([cam.s * 0.3, cam.s * 0.25]);
  ctx.lineWidth = Math.max(2, m.w * cam.s);
  beamPath(drag.ax, drag.ay, drag.ex, drag.ey, false, 0); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,240,210,0.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx(drag.ax), sy(drag.ay), m.max * cam.s, 0, 7); ctx.stroke();
  const label = c.msg;
  if (label) {
    ctx.font = `700 ${Math.max(12, cam.s * 0.5)}px ${getComputedStyle(document.body).fontFamily}`;
    const tx = sx(drag.ex) + 14, ty = sy(drag.ey) - 14, tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(26,18,24,0.88)'; ctx.fillRect(tx - 6, ty - cam.s * 0.5, tw + 12, cam.s * 0.7);
    ctx.fillStyle = c.ok ? '#f3e6cf' : '#ff9d8f'; ctx.fillText(label, tx, ty);
  }
}

/* ---------- Trucks ---------- */
function wheel(x, y, r, rot) {
  ctx.fillStyle = '#16100f'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#6e6660'; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a2220'; ctx.lineWidth = r * 0.14;
  for (let i = 0; i < 5; i++) { const a = rot + i * 1.2566; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55); ctx.stroke(); }
  if (r > 0.9) { ctx.strokeStyle = '#0b0807'; ctx.lineWidth = r * 0.12; for (let i = 0; i < 14; i++) { const a = rot + i * 0.4488; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.86, y + Math.sin(a) * r * 0.86); ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.stroke(); } }
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function drawTruckLocal(tk, rot) {
  const r = tk.r, wb = tk.wb, c = tk.col;
  const dark = 'rgba(0,0,0,0.28)';
  const cab = (x, w, h, y0) => {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x, y0); ctx.lineTo(x + w * 0.62, y0); ctx.lineTo(x + w, y0 + h * 0.42); ctx.lineTo(x + w, y0 + h); ctx.lineTo(x, y0 + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#bfe1ee'; ctx.beginPath();
    ctx.moveTo(x + w * 0.42, y0 + h * 0.1); ctx.lineTo(x + w * 0.6, y0 + h * 0.1); ctx.lineTo(x + w * 0.92, y0 + h * 0.42); ctx.lineTo(x + w * 0.42, y0 + h * 0.42); ctx.closePath(); ctx.fill();
    rect(x + w - 0.12, y0 + h * 0.6, 0.12, h * 0.16, '#ffeaa0');
  };
  const chassisY = -r * 0.2;
  switch (tk.kind) {
    case 'pickup': {
      rect(-0.9, chassisY - 0.35, wb + 1.9, 0.5, '#2a2224');
      rect(-0.9, chassisY - 0.85, 1.9, 0.5, c); rect(-0.9, chassisY - 0.85, 1.9, 0.08, dark);
      cab(wb - 1.1, 2.0, 0.95, chassisY - 1.05);
      break; }
    case 'van': {
      rect(-1, chassisY - 0.3, wb + 1.9, 0.45, '#2a2224');
      rect(-1, chassisY - 1.75, wb - 0.1, 1.45, c);
      rect(-1, chassisY - 1.75, wb - 0.1, 0.1, dark);
      cab(wb - 1.2, 2.3, 1.3, chassisY - 1.6);
      break; }
    case 'dump': {
      rect(-1, chassisY - 0.3, wb + 2.1, 0.5, '#2a2224');
      ctx.fillStyle = '#7d6a55'; ctx.beginPath(); ctx.moveTo(-1.2, chassisY - 1.9); ctx.lineTo(wb - 1.4, chassisY - 1.9); ctx.lineTo(wb - 1.7, chassisY - 0.3); ctx.lineTo(-1, chassisY - 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5a4a3a'; ctx.fillRect(-1.2, chassisY - 1.9, wb - 0.2, 0.18);
      cab(wb - 1.4, 2.4, 1.4, chassisY - 1.7);
      break; }
    case 'tank': {
      rect(-1.2, chassisY - 0.3, wb + 2.4, 0.5, '#2a2224');
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(wb * 0.5 - 0.5, chassisY - 1.3, wb * 0.5 + 0.9, 1.05, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(wb * 0.5 - 0.5, chassisY - 1.6, wb * 0.45 + 0.8, 0.28, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#d63a2a'; ctx.fillRect(wb * 0.5 - 1.1, chassisY - 1.5, 1.2, 0.4);
      cab(wb - 0.6, 2.2, 1.5, chassisY - 1.8);
      break; }
    case 'semi': {
      rect(-5.6, chassisY - 0.3, wb + 7.6, 0.5, '#2a2224');
      rect(-5.6, chassisY - 3.1, 6.9, 2.8, '#d9d2c0');
      rect(-5.6, chassisY - 3.1, 6.9, 0.14, dark);
      ctx.fillStyle = c; ctx.fillRect(-5.6, chassisY - 1.4, 6.9, 0.35);
      cab(wb - 0.9, 2.4, 2.0, chassisY - 2.3);
      break; }
    case 'monster': {
      const top = -r * 0.95;
      rect(-0.8, top - 0.25, wb + 1.8, 0.35, '#1d1618');
      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-1.1, top - 0.1); ctx.lineTo(-1.1, top - 1.1); ctx.lineTo(1.0, top - 1.1); ctx.lineTo(1.0, top - 0.1); ctx.closePath(); ctx.fill();
      cab(wb - 1.8, 2.8, 1.35, top - 1.35);
      ctx.fillStyle = '#ffcf3a'; ctx.beginPath(); ctx.moveTo(-0.7, top - 0.3); ctx.lineTo(1.5, top - 0.5); ctx.lineTo(wb + 0.6, top - 0.3); ctx.lineTo(1.5, top - 0.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 0.1;
      [0, wb].forEach(ax => { ctx.beginPath(); ctx.moveTo(ax, top - 0.15); ctx.lineTo(ax, 0); ctx.stroke(); });
      break; }
  }
  wheel(0, 0, r, rot); wheel(wb, 0, r, rot);
  if (tk.kind === 'semi') { wheel(-1.4, 0, r, rot); wheel(-2.7, 0, r, rot); wheel(-4.5, 0, r, rot); wheel(-5.4, 0, r, rot); }
  if (tk.kind === 'dump' || tk.kind === 'tank') wheel(-1.3, 0, r, rot);
}

function drawTruck() {
  if (!sim) return;
  const tk = sim.truck;
  ctx.save();
  let ya, yb, rot, posX, posY;
  if (tk.fall) {
    posX = sx(tk.fall.x);
    posY = sy(tk.fall.y);
    rot = tk.fall.ang;
  } else {
    ya = (tk.ya ?? GROUND_Y) - tk.r;
    yb = (tk.yb ?? GROUND_Y) - tk.r;
    posX = sx(tk.x);
    posY = sy(ya);
    rot = Math.atan2(yb - ya, tk.wb);
  }
  ctx.translate(posX, posY);
  ctx.rotate(rot);

  // Poly Bridge Scheinwerfer-Lichtkegel
  if (!tk.fall) {
    ctx.save();
    const beamLen = cam.s * 7.5;
    const beamStart = (tk.wb + 0.8) * cam.s;
    const g = ctx.createRadialGradient(beamStart, 0, cam.s * 0.3, beamStart + beamLen * 0.7, cam.s * 0.5, beamLen);
    g.addColorStop(0, 'rgba(255, 245, 180, 0.45)');
    g.addColorStop(0.35, 'rgba(255, 230, 140, 0.18)');
    g.addColorStop(1, 'rgba(255, 210, 100, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(beamStart, -cam.s * 0.2);
    ctx.lineTo(beamStart + beamLen, -cam.s * 1.5);
    ctx.lineTo(beamStart + beamLen, cam.s * 2.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.scale(cam.s, cam.s);
  drawTruckLocal(tk, tk.wheel);
  ctx.restore();
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0 || p.y > WATER_Y + 1.2) { particles.splice(i, 1); continue; }
    p.vy += (p.isSmoke ? -0.8 : G) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.a += p.va * dt;
    ctx.strokeStyle = p.col;
    ctx.globalAlpha = Math.min(1, p.life);
    if (p.isSmoke) {
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), cam.s * (0.15 + (1 - p.life) * 0.25), 0, 7);
      ctx.fill();
    } else if (p.isWater) {
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), cam.s * 0.08, 0, 7);
      ctx.fill();
    } else {
      ctx.lineWidth = Math.max(2, cam.s * 0.1);
      ctx.beginPath(); ctx.moveTo(sx(p.x), sy(p.y)); ctx.lineTo(sx(p.x + Math.cos(p.a) * p.l), sy(p.y + Math.sin(p.a) * p.l)); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function updateGauge() {
  if (!sim) return;
  const r = Math.min(1, sim.maxRatio);
  $('gaugePct').textContent = Math.round(sim.maxRatio * 100) + ' %';
  $('gaugeMask').style.transform = `scaleX(${1 - r})`;
  $('gaugeNote').textContent = sim.state === 'run' && sim.truck.x < WALL_L - 2
    ? 'Der Truck rollt an …'
    : sim.broken ? `${sim.broken} Bauteil(e) gebrochen!`
    : r > 0.88 ? 'Achtung: Bauteile nahe der Bruchgrenze!'
    : r > 0.65 ? 'Belastung steigt spürbar an.' : '';
}

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  clock += dt;
  if (sim && !result && !simPaused) {
    acc += dt * simSpeed;
    let guard = 0;
    const maxSteps = simSpeed > 2 ? 16 : 8;
    while (acc >= DT && guard++ < maxSteps && sim && !result) {
      stepFrame();
      acc -= DT;
    }
    if (sim) creak(sim.maxRatio);
    updateGauge();
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0.01) { ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10); shake *= 0.9; }
  drawBackdrop(clock);
  drawRock(-4000, sx(WALL_L));
  drawRock(sx(WALL_R), 4000 + W);
  ctx.fillStyle = 'rgba(255,200,140,0.35)';
  ctx.fillRect(sx(WALL_L) - 2, sy(0), 2, cam.s * 12); ctx.fillRect(sx(WALL_R), sy(0), 2, cam.s * 12);
  drawPylon(3); drawPylon(29);
  if (!sim) drawGrid();
  drawStructure();
  drawTruck();
  drawParticles(dt * (sim ? simSpeed : 1));
  drawPreview();
  ctx.restore();
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
buildTools();
resize();
refreshHud();
setHint('Zieh von Punkt zu Punkt, um Bauteile zu setzen. Rechtsklick reißt ab.');
setTimeout(() => { if (!sim && build.length) $('hint').style.opacity = 0; }, 9000);
cv.addEventListener('pointerdown', () => { if (build.length) $('hint').style.opacity = 0; }, { once: true });
requestAnimationFrame(frame);
})();
</script>
</body>
