@media (max-width: 720px) {

<script>
(() => {
'use strict';

/* ---------- Konstanten ---------- */
const G = 9.81;          // m/s²
const SUBSTEPS = 10;     // XPBD-Substeps pro 1/60 s
const DT = 1 / 60;
const WALL_L = 6, WALL_R = 26, GROUND_Y = 0, WATER_Y = 12;

// Einheiten: Meter, Tonnen, Kilonewton
const MAT = {
  road:  { name: 'Fahrbahn',    cost: 30, max: 4,  dens: 0.10,  k: 9000,  cap: 140, w: 0.30, road: true },
  wood:  { name: 'Holzbalken',  cost: 18, max: 5,  dens: 0.05,  k: 9000,  cap: 170, w: 0.22 },
  steel: { name: 'Stahlträger', cost: 55, max: 6,  dens: 0.14,  k: 40000, cap: 650, w: 0.20 },
  rope:  { name: 'Seil',        cost: 10, max: 12, dens: 0.012, k: 6000,  cap: 320, w: 0.07, rope: true }
};
const TOOLS = ['road', 'wood', 'steel', 'rope', 'erase'];

const TRUCKS = [
  { name: 'Pickup',            t: 2,  kind: 'pickup', wb: 2.7, r: 0.42, col: '#c8472f', budget: 3000 },
  { name: 'Lieferwagen',       t: 6,  kind: 'van',    wb: 3.4, r: 0.48, col: '#e9e1cf', budget: 3600 },
  { name: 'Kipper',            t: 14, kind: 'dump',   wb: 4.2, r: 0.58, col: '#e0a21c', budget: 4600 },
  { name: 'Tankwagen',         t: 26, kind: 'tank',   wb: 4.8, r: 0.62, col: '#9aa9b6', budget: 6000 },
  { name: 'Sattelzug',         t: 40, kind: 'semi',   wb: 6.2, r: 0.62, col: '#2f6fa5', budget: 8000 },
  { name: 'Monstertruck',      t: 60, kind: 'monster',wb: 3.8, r: 1.15, col: '#4aa84a', budget: 10000 },
  { name: 'Titan-Monstertruck',t: 90, kind: 'monster',wb: 4.4, r: 1.35, col: '#8b3fb5', budget: 12000 }
];
function truckFor(level) {
  if (level < TRUCKS.length) return TRUCKS[level];
  const n = level - TRUCKS.length + 1;
  return { ...TRUCKS[TRUCKS.length - 1], name: 'Titan Mk ' + (n + 1), t: 90 + 20 * n, budget: 12000 + 800 * n };
}

/* ---------- Zustand ---------- */
let level = 0;
let tool = 'wood';
let build = [];          // {ax,ay,bx,by,type}
let sim = null;          // läuft nur im Test
let drag = null;         // {ax,ay,ex,ey}
let hover = { x: 0, y: 0 };
let result = null;
let shake = 0;
let particles = [];
let clock = 0;
let acc = 0;
let lastTs = 0;
let cleared = 0;
try { cleared = (window.ArcadeCore && ArcadeCore.getScore('bridge')) || 0; } catch (e) {}
if (cleared > 0) level = Math.min(cleared, 12);

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { s: 20, ox: 0, oy: 0 };

/* ---------- Geometrie ---------- */
function isAnchor(x, y) {
  const left = (x === WALL_L && y >= 0 && y <= 7) || (y === 0 && x >= 0 && x <= WALL_L) || (x === 3 && y >= -7 && y <= 0);
  const mx = 32 - x;
  const right = (mx === WALL_L && y >= 0 && y <= 7) || (y === 0 && mx >= 0 && mx <= WALL_L) || (mx === 3 && y >= -7 && y <= 0);
  return left || right;
}
function inRock(x, y) { return y > 0.01 && (x < WALL_L - 0.01 || x > WALL_R + 0.01); }
function ptOK(x, y) {
  if (y > 9 || y < -9 || x < -2 || x > 34) return false;
  if (isAnchor(x, y)) return true;
  return !(y > 0 && (x <= WALL_L || x >= WALL_R));
}
function segInRock(ax, ay, bx, by) {
  for (let i = 1; i < 12; i++) {
    const t = i / 12;
    if (inRock(ax + (bx - ax) * t, ay + (by - ay) * t)) return true;
  }
  return false;
}
function len(b) { return Math.hypot(b.bx - b.ax, b.by - b.ay); }
function costOf(b) { return Math.round(len(b) * MAT[b.type].cost); }
function spent() { return build.reduce((s, b) => s + costOf(b), 0); }
function budget() { return truckFor(level).budget; }
function fmtEur(n) { return n.toLocaleString('de-DE') + ' €'; }
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

/* ---------- Farben ---------- */
const STOPS = [[0, [63, 191, 106]], [0.5, [232, 210, 58]], [0.8, [240, 138, 44]], [1, [226, 59, 46]]];
function stressRGB(r) {
  r = Math.max(0, Math.min(1, r));
  for (let i = 1; i < STOPS.length; i++) {
    if (r <= STOPS[i][0]) {
      const [r0, c0] = STOPS[i - 1], [r1, c1] = STOPS[i];
      const t = (r - r0) / (r1 - r0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
    }
  }
  return STOPS[3][1];
}
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- Sound ---------- */
let ac = null, creakOsc = null, creakGain = null;
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
  const A = window.AudioContext || window.webkitAudioContext;
  if (!A) return null;
  ac = new A();
  creakOsc = ac.createOscillator();
  creakGain = ac.createGain();
  creakOsc.type = 'sawtooth';
  creakOsc.frequency.value = 90;
  creakGain.gain.value = 0;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 420;
  creakOsc.connect(lp); lp.connect(creakGain); creakGain.connect(ac.destination);
  creakOsc.start();
  return ac;
}
function muted() { try { return window.ArcadeCore && ArcadeCore.isMuted(); } catch (e) { return false; } }
function creak(level01) {
  if (!ac || !creakGain) return;
  const g = muted() ? 0 : Math.max(0, (level01 - 0.65) / 0.35) * 0.07;
  creakGain.gain.setTargetAtTime(g, ac.currentTime, 0.05);
  creakOsc.frequency.setTargetAtTime(70 + level01 * 60 + Math.random() * 25, ac.currentTime, 0.04);
}
function crack(big = 1) {
  if (muted() || !audio()) return;
  const n = Math.floor(ac.sampleRate * 0.28);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 700; f.Q.value = 0.8;
  g.gain.value = 0.5 * big;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}
function tone(freq, dur, type = 'triangle', vol = 0.12, delay = 0) {
  if (muted() || !audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + delay;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
}
function place() { tone(220, 0.07, 'square', 0.05); }

/* ---------- Simulation (XPBD) ---------- */
function startTest() {
  const nodes = [], map = new Map();
  const get = (x, y) => {
    const k = x + ',' + y;
    if (!map.has(k)) { map.set(k, nodes.length); nodes.push({ x, y, px: x, py: y, vx: 0, vy: 0, m: 0, fixed: isAnchor(x, y) }); }
    return map.get(k);
  };
  const beams = build.map(b => {
    const a = get(b.ax, b.ay), c = get(b.bx, b.by), m = MAT[b.type], L = len(b);
    nodes[a].m += m.dens * L / 2; nodes[c].m += m.dens * L / 2;
    const capC = m.rope ? 0 : m.cap * Math.min(1, Math.pow(3 / L, 1.2));
    return { a, b: c, type: b.type, m, rest: L, alpha: 1 / m.k, capT: m.cap, capC, f: 0, ratio: 0, dead: false, road: !!m.road };
  });
  nodes.forEach(n => { n.m = n.fixed ? 0 : Math.max(0.06, n.m + 0.03); n.w = n.fixed ? 0 : 1 / n.m; });
  const tk = truckFor(level);
  const speed = Math.max(3.4, 6 - tk.t * 0.035);
  sim = {
    nodes, beams, t: 0, state: 'run', endT: 0, maxRatio: 0, broken: 0, note: '',
    truck: { ...tk, x: -tk.wb - 5, speed, fall: null, wheel: 0, ya: 0, yb: 0 }
  };
  result = null; drag = null;
  audio();
  $('go').textContent = 'Test abbrechen'; $('go').classList.add('stop');
  $('gauge').classList.add('on');
  $('legend').style.display = 'none';
  setHint('');
}
function stopTest() {
  sim = null;
  creak(0);
  $('go').textContent = 'Stresstest starten'; $('go').classList.remove('stop');
  $('gauge').classList.remove('on');
  $('legend').style.display = '';
  setHint('Zieh von Punkt zu Punkt, um Balken zu bauen.');
}

function support(x) {
  let best = null;
  if (x <= WALL_L + 1e-4 || x >= WALL_R - 1e-4) best = { y: GROUND_Y, beam: null, t: 0 };
  for (const b of sim.beams) {
    if (b.dead || !b.road) continue;
    const A = sim.nodes[b.a], B = sim.nodes[b.b];
    if (Math.abs(B.x - A.x) < 0.2) continue;
    const lo = Math.min(A.x, B.x), hi = Math.max(A.x, B.x);
    if (x < lo - 1e-3 || x > hi + 1e-3) continue;
    const t = (x - A.x) / (B.x - A.x), y = A.y + (B.y - A.y) * t;
    if (!best || y < best.y - 1e-6) best = { y, beam: b, t };
  }
  return best;
}

function substep(h) {
  const { nodes, beams, truck } = sim;
  const h2 = h * h;
  const ext = new Array(nodes.length).fill(0);

  if (!truck.fall && sim.state === 'run') {
    truck.x += truck.speed * h;
    truck.wheel += truck.speed * h / truck.r;
    const total = truck.t * G;
    const axles = [{ x: truck.x, F: total * 0.55 }, { x: truck.x + truck.wb, F: total * 0.45 }];
    const ys = [];
    let lost = false;
    axles.forEach((ax, i) => {
      const s = support(ax.x);
      if (!s) { lost = true; ys.push(null); return; }
      ys.push(s.y);
      if (s.beam) {
        const bm = s.beam;
        ext[bm.a] += ax.F * (1 - s.t);
        ext[bm.b] += ax.F * s.t;
      }
    });
    if (lost) {
      const ya = ys[0] != null ? ys[0] : (ys[1] != null ? ys[1] : GROUND_Y);
      truck.fall = { x: truck.x, y: ya - truck.r, vx: truck.speed, vy: 0, ang: Math.atan2((ys[1] ?? ya) - ya, truck.wb), w: 0.9 };
      sim.endT = sim.t; sim.note = 'Der Truck stürzt in die Schlucht.';
      crack(0.6);
    } else { truck.ya = ys[0]; truck.yb = ys[1]; }
  } else if (truck.fall) {
    const f = truck.fall;
    f.vy += G * h; f.x += f.vx * h; f.y += f.vy * h; f.ang += f.w * h;
  }

  // Vorhersage
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.fixed) continue;
    n.px = n.x; n.py = n.y;
    n.vy += G * h;
    n.vx *= 1 - 1.6 * h; n.vy *= 1 - 1.6 * h;
    n.x += n.vx * h;
    n.y += n.vy * h + (ext[i] / n.m) * h2;
  }
  // Constraints, ein Durchgang pro Substep
  for (const b of beams) {
    if (b.dead) continue;
    const A = nodes[b.a], B = nodes[b.b];
    const dx = A.x - B.x, dy = A.y - B.y;
    const l = Math.hypot(dx, dy) || 1e-9;
    const C = l - b.rest;
    if (b.m.rope && C < 0) continue;
    const at = b.alpha / h2;
    const wsum = A.w + B.w;
    if (wsum === 0) continue;
    const dl = -C / (wsum + at);
    const nx = dx / l, ny = dy / l;
    A.x += A.w * nx * dl; A.y += A.w * ny * dl;
    B.x -= B.w * nx * dl; B.y -= B.w * ny * dl;
    b.facc += -dl / h2; // +: Zug
  }
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.fixed) continue;
    n.vx = (n.x - n.px) / h; n.vy = (n.y - n.py) / h;
    if (n.y > WATER_Y + 1.5) { n.y = WATER_Y + 1.5; n.vy = 0; n.vx *= 0.8; }
  }
}

function stepFrame() {
  const h = DT / SUBSTEPS;
  for (const b of sim.beams) b.facc = 0;
  for (let i = 0; i < SUBSTEPS; i++) substep(h);
  sim.t += DT;

  let maxR = 0;
  for (const b of sim.beams) {
    if (b.dead) continue;
    const inst = b.facc / SUBSTEPS;
    b.f = b.f * 0.65 + inst * 0.35;
    const cap = b.f >= 0 ? b.capT : b.capC;
    b.ratio = b.f === 0 ? 0 : (cap > 0 ? Math.abs(b.f) / cap : 0);
    if (b.f < 0 && cap === 0) b.ratio = 0;
    if (b.ratio > maxR) maxR = b.ratio;
    if (b.ratio > 1) breakBeam(b);
  }
  sim.maxRatio = Math.max(0, maxR);

  const tr = sim.truck;
  if (sim.state === 'run') {
    if (!tr.fall && tr.x > WALL_R + 1.5) { sim.state = 'win'; sim.endT = sim.t; }
    else if (tr.fall && sim.t - sim.endT > 2.2) sim.state = 'lose';
    else if (sim.broken > 0 && !tr.fall && sim.t - (sim.firstBreak || 0) > 6) sim.state = 'lose';
    else if (sim.t > 45) sim.state = 'lose';
  }
  if (sim.state === 'win' && sim.t - sim.endT > 0.9) finish(true);
  if (sim.state === 'lose') finish(false);
}

function breakBeam(b) {
  b.dead = true;
  sim.broken++;
  if (!sim.firstBreak) sim.firstBreak = sim.t;
  const A = sim.nodes[b.a], B = sim.nodes[b.b];
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
  const mat = b.type;
  const col = mat === 'steel' ? '#aab8c6' : mat === 'rope' ? '#d9c59a' : mat === 'road' ? '#5a463a' : '#c99a5b';
  const count = mat === 'rope' ? 4 : 9;
  for (let i = 0; i < count; i++) {
    particles.push({ x: mx + (Math.random() - 0.5) * 0.6, y: my + (Math.random() - 0.5) * 0.6, vx: (Math.random() - 0.5) * 7, vy: -Math.random() * 6, a: Math.random() * 6, va: (Math.random() - 0.5) * 14, l: 0.2 + Math.random() * 0.5, col, life: 1.6 });
  }
  shake = Math.min(1, shake + 0.7);
  crack(mat === 'steel' ? 1.3 : 1);
  sim.note = (b.f < 0 ? 'Ein ' + b.m.name + ' wurde zerdrückt.' : 'Ein ' + b.m.name + ' ist gerissen.');
}

function finish(win) {
  if (result) return;
  creak(0);
  const tk = truckFor(level);
  result = win ? 'win' : 'lose';
  const box = $('resultBox');
  $('resultTitle').className = win ? 'win' : 'lose';
  const btns = $('resultBtns');
  btns.innerHTML = '';
  const add = (label, fn, primary) => {
    const b = document.createElement('button');
    b.textContent = label; if (primary) b.className = 'primary';
    b.addEventListener('click', () => { $('result').classList.remove('on'); fn(); });
    btns.appendChild(b); return b;
  };
  if (win) {
    const left = budget() - spent();
    const nextTk = truckFor(level + 1);
    cleared = Math.max(cleared, level + 1);
    try { ArcadeCore.saveScore('bridge', cleared); } catch (e) {}
    try { if (window.umami) umami.track('bridge-win', { level: level + 1, truck: tk.name }); } catch (e) {}
    tone(523, 0.18, 'triangle', 0.14); tone(659, 0.18, 'triangle', 0.14, 0.14); tone(784, 0.3, 'triangle', 0.14, 0.28);
    $('resultTitle').textContent = 'Brücke hält!';
    $('resultText').textContent = `Der ${tk.name} (${tk.t} t) ist drüber. ${sim.broken ? sim.broken + ' Bauteil(e) sind unterwegs gebrochen. ' : ''}${left >= 0 ? fmtEur(left) + ' Budget übrig.' : ''} Als Nächstes kommt der ${nextTk.name} mit ${nextTk.t} t.`;
    add('Verstärken für ' + nextTk.name, () => { level++; stopTest(); refreshHud(); }, true);
    add('Neu bauen', () => { level++; build = []; stopTest(); refreshHud(); });
  } else {
    try { if (window.umami) umami.track('bridge-lose', { level: level + 1, truck: tk.name }); } catch (e) {}
    tone(160, 0.5, 'sawtooth', 0.12); tone(110, 0.6, 'sawtooth', 0.12, 0.2);
    $('resultTitle').textContent = sim.truck.fall ? 'Truck abgestürzt' : 'Brücke eingestürzt';
    $('resultText').textContent = (sim.note || 'Die Brücke hat nicht gehalten.') + ' Rot und Orange zeigen, wo die Last zu groß war. Nimm Stahl, bau höher oder verteile die Kräfte auf mehr Streben.';
    add('Weiter bauen', () => { stopTest(); }, true);
    add('Neu beginnen', () => { build = []; stopTest(); refreshHud(); });
  }
  $('result').classList.add('on');
  box.querySelector('button').focus();
}

/* ---------- Eingabe ---------- */
function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left - cam.ox) / cam.s, y: (ev.clientY - r.top - cam.oy) / cam.s };
}
function snapPt(w) { return { x: Math.round(w.x), y: Math.round(w.y) }; }
function dragCheck(d) {
  if (!d) return { ok: false };
  const m = MAT[tool];
  const L = Math.hypot(d.ex - d.ax, d.ey - d.ay);
  if (L < 0.5) return { ok: false, msg: '' };
  if (!ptOK(d.ex, d.ey)) return { ok: false, msg: 'Hier ist Fels oder Wasser.' };
  if (L > m.max + 1e-6) return { ok: false, msg: `Zu lang, max. ${m.max} m` };
  if (segInRock(d.ax, d.ay, d.ex, d.ey)) return { ok: false, msg: 'Balken kann nicht durch Fels.' };
  if (build.some(b => (b.ax === d.ax && b.ay === d.ay && b.bx === d.ex && b.by === d.ey) || (b.bx === d.ax && b.by === d.ay && b.ax === d.ex && b.ay === d.ey))) return { ok: false, msg: 'Da liegt schon ein Balken.' };
  const cost = Math.round(L * m.cost);
  if (spent() + cost > budget()) return { ok: false, msg: `Zu teuer, es fehlen ${fmtEur(spent() + cost - budget())}` };
  return { ok: true, L, cost, msg: `${L.toFixed(1)} m, ${fmtEur(cost)}` };
}
function eraseAt(w) {
  let best = -1, bd = 0.7;
  build.forEach((b, i) => { const d = distSeg(w.x, w.y, b.ax, b.ay, b.bx, b.by); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) { build.splice(best, 1); tone(150, 0.08, 'square', 0.06); refreshHud(); }
}
cv.addEventListener('pointerdown', ev => {

});
cv.addEventListener('pointermove', ev => {

});
function endDrag() {

}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });

addEventListener('keydown', ev => {
  if (result) return;

function resize() {

  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  const top = W < 720 ? 100 : 64, bottom = $('bar').offsetHeight + 6;
  const availH = Math.max(120, H - top - bottom);
  cam.s = Math.min(W / 38, availH / 22);

}
addEventListener('resize', resize);

// Gesteins-Schichten und Mesas einmalig erzeugen
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

const stars = Array.from({ length: 40 }, () => ({ x: R(), y: R() * 0.35, r: 0.5 + R() * 1.2 }));

function sx(x) { return cam.ox + x * cam.s; }
function sy(y) { return cam.oy + y * cam.s; }

function drawBackdrop(t) {

  let g = ctx.createLinearGradient(0, 0, 0, horizon + cam.s * 3);
  g.addColorStop(0, '#171531'); g.addColorStop(0.45, '#5a2d52'); g.addColorStop(0.8, '#d4665a'); g.addColorStop(1, '#f3a65c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of stars) { ctx.globalAlpha = 0.5; ctx.fillRect(s.x * W, s.y * H, s.r, s.r); }
  ctx.globalAlpha = 1;
  // Sonne
  const sunX = sx(17), sunY = sy(-3.2), sr = cam.s * 2.6;
  g = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sr * 2.8);
  g.addColorStop(0, 'rgba(255,214,140,0.9)'); g.addColorStop(0.25, 'rgba(255,176,98,0.45)'); g.addColorStop(1, 'rgba(255,140,80,0)');

  ctx.fillStyle = '#ffe3a8'; ctx.beginPath(); ctx.arc(sunX, sunY, sr * 0.7, 0, 7); ctx.fill();

    ctx.fillRect(x0, horizon - h, w, h + cam.s * 3);
    ctx.fillRect(x0 - w * m.step * 0.3, horizon - h * 0.55, w * (1 + m.step * 0.6), h * 0.55 + cam.s * 3);
  }

  g.addColorStop(0, '#7a3d44'); g.addColorStop(0.55, '#41222f'); g.addColorStop(1, '#1d1220');
  ctx.fillStyle = g; ctx.fillRect(sx(WALL_L), sy(0), (WALL_R - WALL_L) * cam.s, (WATER_Y) * cam.s);

function drawRock(x0, x1) {

}
function drawPylon(cx) {

  const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);

  ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = 'rgba(30,12,10,0.25)';
  for (let i = 1; i < 8; i++) ctx.fillRect(x0, y0 + i * h / 8, w, 2);
  ctx.fillStyle = '#d38b57'; ctx.fillRect(x0 - 3, y0 - 5, w + 6, 7);
}

function drawGrid() {
  ctx.fillStyle = 'rgba(255,230,190,0.14)';
  for (let x = -1; x <= 33; x++) for (let y = -8; y <= 9; y++) {
    if (!ptOK(x, y) || isAnchor(x, y)) continue;
    ctx.fillRect(sx(x) - 1, sy(y) - 1, 2, 2);
  }
  for (let x = 0; x <= 32; x++) for (let y = -7; y <= 7; y++) {
    if (!isAnchor(x, y)) continue;
    ctx.strokeStyle = 'rgba(242,169,59,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.14, 0, 7); ctx.stroke();
  }
}

function beamPath(ax, ay, bx, by, rope, slackLen) {

  if (rope && slackLen > 0) {
    const mx = (ax + bx) / 2, my = (ay + by) / 2 + slackLen;

}
function drawBeam(ax, ay, bx, by, type, ratio, live, jitter) {

    ctx.strokeStyle = rgb(c); ctx.lineWidth = wpx; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
    if (type === 'steel') { ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1, wpx * 0.25); beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); }
    if (type === 'road') { ctx.strokeStyle = 'rgba(20,10,10,0.55)'; ctx.lineWidth = wpx * 0.35; beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); }

  const col = type === 'wood' ? '#c99a5b' : type === 'steel' ? '#8fa3b6' : type === 'rope' ? '#d9c59a' : '#5a463a';
  ctx.strokeStyle = col; ctx.lineWidth = wpx; beamPath(ax, ay, bx, by, false, 0); ctx.stroke();
  if (type === 'steel') { ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = Math.max(1, wpx * 0.25); beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); }
  if (type === 'road') { ctx.strokeStyle = '#d8b27a'; ctx.lineWidth = Math.max(1, wpx * 0.22); ctx.save(); const nx = (by - ay) / rest, ny = -(bx - ax) / rest; ctx.translate(nx * wpx * 0.0, ny * 0); beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); ctx.restore(); }
  if (type === 'wood') { ctx.strokeStyle = 'rgba(80,45,20,0.45)'; ctx.lineWidth = 1; beamPath(ax, ay, bx, by, false, 0); ctx.stroke(); }
}
function drawRope(ax, ay, bx, by, ratio, live, slack) {

function joint(x, y, fixed) {
  ctx.fillStyle = fixed ? '#f2a93b' : '#2a2024';
  ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * (fixed ? 0.15 : 0.17), 0, 7); ctx.fill();
  ctx.fillStyle = fixed ? '#fff0c8' : '#d8c6a8';
  ctx.beginPath(); ctx.arc(sx(x), sy(y), cam.s * 0.07, 0, 7); ctx.fill();
}

function drawStructure() {
  if (sim) {
    const { nodes, beams } = sim;
    const used = new Set();
    // Seile zuerst (hinten), dann Balken
    const order = [...beams].filter(b => !b.dead).sort((p, q) => (q.type === 'rope') - (p.type === 'rope') || (p.type === 'road') - (q.type === 'road'));
    for (const b of order) {
      const A = nodes[b.a], B = nodes[b.b];
      used.add(b.a); used.add(b.b);
      if (b.type === 'rope') {
        const l = Math.hypot(B.x - A.x, B.y - A.y);
        const slack = Math.min(1.2, Math.sqrt(Math.max(0, b.rest * b.rest - l * l)) * 0.5);
        drawRope(A.x, A.y, B.x, B.y, b.ratio, true, slack);
      } else drawBeam(A.x, A.y, B.x, B.y, b.type, b.ratio, true, b.ratio > 0.9);
    }
    used.forEach(i => { if (nodes[i].y < WATER_Y + 1.4) joint(nodes[i].x, nodes[i].y, nodes[i].fixed); });
  } else {
    const order = [...build].sort((p, q) => (q.type === 'rope') - (p.type === 'rope') || (p.type === 'road') - (q.type === 'road'));
    for (const b of order) {
      if (b.type === 'rope') drawRope(b.ax, b.ay, b.bx, b.by, 0, false, 0);
      else drawBeam(b.ax, b.ay, b.bx, b.by, b.type, 0, false, false);
    }
    const seen = new Set();
    for (const b of build) for (const [x, y] of [[b.ax, b.ay], [b.bx, b.by]]) { const k = x + ',' + y; if (!seen.has(k)) { seen.add(k); joint(x, y, isAnchor(x, y)); } }
  }
}

function drawPreview() {
  if (sim || result) return;
  if (tool === 'erase') {
    let best = null, bd = 0.7;
    build.forEach(b => { const d = distSeg(hover.x, hover.y, b.ax, b.ay, b.bx, b.by); if (d < bd) { bd = d; best = b; } });
    if (best) { ctx.strokeStyle = 'rgba(226,59,46,0.85)'; ctx.lineWidth = Math.max(3, MAT[best.type].w * cam.s + 5); ctx.lineCap = 'round'; beamPath(best.ax, best.ay, best.bx, best.by, false, 0); ctx.stroke(); }
    return;
  }
  if (ptOK(hover.x, hover.y)) {
    ctx.strokeStyle = 'rgba(255,240,210,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx(hover.x), sy(hover.y), cam.s * 0.24, 0, 7); ctx.stroke();
  }
  if (!drag) return;
  const c = dragCheck(drag), m = MAT[tool];
  ctx.lineCap = 'round';
  ctx.strokeStyle = c.ok ? 'rgba(255,240,210,0.7)' : 'rgba(226,59,46,0.8)';
  ctx.setLineDash([cam.s * 0.3, cam.s * 0.25]);
  ctx.lineWidth = Math.max(2, m.w * cam.s);
  beamPath(drag.ax, drag.ay, drag.ex, drag.ey, false, 0); ctx.stroke();
  ctx.setLineDash([]);
  // max. Reichweite
  ctx.strokeStyle = 'rgba(255,240,210,0.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx(drag.ax), sy(drag.ay), m.max * cam.s, 0, 7); ctx.stroke();
  const label = c.msg;
  if (label) {
    ctx.font = `700 ${Math.max(12, cam.s * 0.5)}px ${getComputedStyle(document.body).fontFamily}`;
    const tx = sx(drag.ex) + 14, ty = sy(drag.ey) - 14, tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(26,18,24,0.88)'; ctx.fillRect(tx - 6, ty - cam.s * 0.5, tw + 12, cam.s * 0.7);
    ctx.fillStyle = c.ok ? '#f3e6cf' : '#ff9d8f'; ctx.fillText(label, tx, ty);
  }
}

/* ---- Trucks ---- */
function wheel(x, y, r, rot) {
  ctx.fillStyle = '#16100f'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#6e6660'; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a2220'; ctx.lineWidth = r * 0.14;
  for (let i = 0; i < 5; i++) { const a = rot + i * 1.2566; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55); ctx.stroke(); }
  if (r > 0.9) { ctx.strokeStyle = '#0b0807'; ctx.lineWidth = r * 0.12; for (let i = 0; i < 14; i++) { const a = rot + i * 0.4488; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.86, y + Math.sin(a) * r * 0.86); ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.stroke(); } }
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function drawTruckLocal(tk, rot) {
  // lokale Einheiten = Meter, Hinterachse bei (0,0), Boden bei y=r
  const r = tk.r, wb = tk.wb, c = tk.col;
  const dark = 'rgba(0,0,0,0.28)';
  const cab = (x, w, h, y0) => {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x, y0); ctx.lineTo(x + w * 0.62, y0); ctx.lineTo(x + w, y0 + h * 0.42); ctx.lineTo(x + w, y0 + h); ctx.lineTo(x, y0 + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#bfe1ee'; ctx.beginPath();
    ctx.moveTo(x + w * 0.42, y0 + h * 0.1); ctx.lineTo(x + w * 0.6, y0 + h * 0.1); ctx.lineTo(x + w * 0.92, y0 + h * 0.42); ctx.lineTo(x + w * 0.42, y0 + h * 0.42); ctx.closePath(); ctx.fill();
    rect(x + w - 0.12, y0 + h * 0.6, 0.12, h * 0.16, '#ffeaa0');
  };
  const chassisY = -r * 0.2;
  switch (tk.kind) {
    case 'pickup': {
      rect(-0.9, chassisY - 0.35, wb + 1.9, 0.5, '#2a2224');
      rect(-0.9, chassisY - 0.85, 1.9, 0.5, c); rect(-0.9, chassisY - 0.85, 1.9, 0.08, dark);
      cab(wb - 1.1, 2.0, 0.95, chassisY - 1.35 + 0.3 - 0.0);
      break; }
    case 'van': {
      rect(-1, chassisY - 0.3, wb + 1.9, 0.45, '#2a2224');
      rect(-1, chassisY - 1.75, wb - 0.1, 1.45, c);
      rect(-1, chassisY - 1.75, wb - 0.1, 0.1, dark);
      cab(wb - 1.2, 2.3, 1.3, chassisY - 1.6);
      break; }
    case 'dump': {
      rect(-1, chassisY - 0.3, wb + 2.1, 0.5, '#2a2224');
      ctx.fillStyle = '#7d6a55'; ctx.beginPath(); ctx.moveTo(-1.2, chassisY - 1.9); ctx.lineTo(wb - 1.4, chassisY - 1.9); ctx.lineTo(wb - 1.7, chassisY - 0.3); ctx.lineTo(-1, chassisY - 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5a4a3a'; ctx.fillRect(-1.2, chassisY - 1.9, wb - 0.2, 0.18);
      cab(wb - 1.4, 2.4, 1.4, chassisY - 1.7);
      break; }
    case 'tank': {
      rect(-1.2, chassisY - 0.3, wb + 2.4, 0.5, '#2a2224');
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(wb * 0.5 - 0.5, chassisY - 1.3, wb * 0.5 + 0.9, 1.05, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(wb * 0.5 - 0.5, chassisY - 1.6, wb * 0.45 + 0.8, 0.28, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#d63a2a'; ctx.fillRect(wb * 0.5 - 1.1, chassisY - 1.5, 1.2, 0.4);
      cab(wb - 0.6, 2.2, 1.5, chassisY - 1.8);
      break; }
    case 'semi': {
      rect(-5.6, chassisY - 0.3, wb + 7.6, 0.5, '#2a2224');
      rect(-5.6, chassisY - 3.1, 6.7 + 0.2, 2.8, '#d9d2c0');
      rect(-5.6, chassisY - 3.1, 6.9, 0.14, dark);
      ctx.fillStyle = c; ctx.fillRect(-5.6, chassisY - 1.4, 6.9, 0.35);
      cab(wb - 0.9, 2.4, 2.0, chassisY - 2.3);
      break; }
    case 'monster': {
      const top = -r * 0.95;
      rect(-0.8, top - 0.25, wb + 1.8, 0.35, '#1d1618');
      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-1.1, top - 0.1); ctx.lineTo(-1.1, top - 1.1); ctx.lineTo(1.0, top - 1.1); ctx.lineTo(1.0, top - 0.1); ctx.closePath(); ctx.fill();
      cab(wb - 1.8, 2.8, 1.35, top - 1.35);
      ctx.fillStyle = '#ffcf3a'; ctx.beginPath(); ctx.moveTo(-0.7, top - 0.3); ctx.lineTo(1.5, top - 0.5); ctx.lineTo(wb + 0.6, top - 0.3); ctx.lineTo(1.5, top - 0.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 0.1;
      [0, wb].forEach(ax => { ctx.beginPath(); ctx.moveTo(ax, top - 0.15); ctx.lineTo(ax, 0); ctx.stroke(); });
      break; }
  }
  wheel(0, 0, r, rot); wheel(wb, 0, r, rot);
  if (tk.kind === 'semi') { wheel(-1.4, 0, r, rot); wheel(-2.7, 0, r, rot); wheel(-4.5, 0, r, rot); wheel(-5.8 + 0.4, 0, r, rot); }
  if (tk.kind === 'dump' || tk.kind === 'tank') wheel(-1.3, 0, r, rot);
}
function drawTruck() {
  if (!sim) return;
  const tk = sim.truck;
  ctx.save();
  if (tk.fall) {
    ctx.translate(sx(tk.fall.x), sy(tk.fall.y));
    ctx.rotate(tk.fall.ang);
  } else {
    const ya = tk.ya - tk.r, yb = tk.yb - tk.r;
    ctx.translate(sx(tk.x), sy(ya));
    ctx.rotate(Math.atan2(yb - ya, tk.wb));
  }
  ctx.scale(cam.s, cam.s);
  drawTruckLocal(tk, tk.wheel);
  ctx.restore();
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0 || p.y > WATER_Y + 1) { particles.splice(i, 1); continue; }
    p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
    ctx.strokeStyle = p.col; ctx.globalAlpha = Math.min(1, p.life);
    ctx.lineWidth = Math.max(2, cam.s * 0.1);
    ctx.beginPath(); ctx.moveTo(sx(p.x), sy(p.y)); ctx.lineTo(sx(p.x + Math.cos(p.a) * p.l), sy(p.y + Math.sin(p.a) * p.l)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function updateGauge() {
  if (!sim) return;
  const r = Math.min(1, sim.maxRatio);
  $('gaugePct').textContent = Math.round(sim.maxRatio * 100) + ' %';
  $('gaugeMask').style.transform = `scaleX(${1 - r})`;
  $('gaugeNote').textContent = sim.state === 'run' && sim.truck.x < WALL_L - 2 ? 'Der Truck rollt an …' : sim.broken ? `${sim.broken} Bauteil(e) gebrochen` : r > 0.85 ? 'Es knarzt gefährlich.' : '';
}

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  clock += dt;
  if (sim && !result) {
    acc += dt;
    let guard = 0;
    while (acc >= DT && guard++ < 4 && sim && !result) { stepFrame(); acc -= DT; }
    if (sim) creak(sim.maxRatio);
    updateGauge();
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0.01) { ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10); shake *= 0.9; }
  drawBackdrop(clock);
  drawRock(-4000, sx(WALL_L));
  drawRock(sx(WALL_R), 4000 + W);
  // Kantenlicht
  ctx.fillStyle = 'rgba(255,200,140,0.35)';
  ctx.fillRect(sx(WALL_L) - 2, sy(0), 2, cam.s * 12); ctx.fillRect(sx(WALL_R), sy(0), 2, cam.s * 12);
  drawPylon(3); drawPylon(29);
  if (!sim) drawGrid();
  drawStructure();
  drawTruck();
  drawParticles(dt);
  drawPreview();
  ctx.restore();
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
buildTools();
resize();
refreshHud();
setHint('Zieh von Punkt zu Punkt, um Balken zu bauen. Rechtsklick reißt ab.');
setTimeout(() => { if (!sim && build.length) $('hint').style.opacity = 0; }, 9000);
cv.addEventListener('pointerdown', () => { if (build.length) $('hint').style.opacity = 0; }, { once: true });
requestAnimationFrame(frame);
})();
</script>
</body>
