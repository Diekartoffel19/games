<style>

.bar { height:8px; background:rgba(255,255,255,.13); border-radius:4px; overflow:hidden; margin:2px 0 5px; }
#bClear { background:linear-gradient(90deg,#5fd1ff,#7be08a); }

.gp { position:relative; width:62px; height:70px; }
.gp .body { position:absolute; left:20px; top:28px; width:22px; height:36px; background:#ff8a1f; border-radius:4px; }

#tright .tb { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:240px; }
#tright button { font:inherit; font-weight:800; font-size:14px; color:#fff; background:rgba(10,18,40,.75); border:2px solid rgba(255,255,255,.35); border-radius:12px; padding:9px 10px; min-width:64px; min-height:44px; touch-action:none; }

.ov.hide { display:none; }
.panel { background:var(--panel); border:3px solid var(--accent); border-radius:18px; padding:18px 22px; max-width:680px; width:100%; margin:auto; box-shadow:0 10px 0 rgba(0,0,0,.35); text-align:center; backdrop-filter:blur(4px); }

.up .ic { font-size:28px; } .up .tx { flex:1; } .up .tx b { font-size:15px; }
.up button { font-size:14px; padding:7px 10px; margin:0; white-space:nowrap; }
.up.own { outline:2px solid var(--good); }
ul.how { text-align:left; margin:8px auto; max-width:500px; padding-left:20px; line-height:1.5; font-size:14px; }
.kbd { display:inline-block; background:#fff2; border:1px solid #fff5; border-radius:5px; padding:0 5px; font-size:12px; font-weight:800; }

  #clock { font-size:26px; }
}
</style>

<script>
'use strict';
const errlog = document.getElementById('errlog');
window.addEventListener('error', e => { errlog.textContent += (e.message || e) + ' @' + (e.lineno || '') + '\n'; });
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const SAVE_KEY = 'winterdienst_save';
const Q = new URLSearchParams(location.search);
const DEG = Math.PI / 180;

// ================= Mathe =================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function mulberry32(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry32(1);
const rand = (a, b) => a + R() * (b - a);
const pick = a => a[(R() * a.length) | 0];
const hexC = h => new THREE.Color(h);

// ================= Speicherstand =================
function loadSave() {
  const def = { budget: 0, stars: [0, 0, 0, 0, 0], up: {} };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.stars)) return { budget: Math.max(0, +s.budget || 0), stars: def.stars.map((v, i) => clamp(+s.stars[i] || 0, 0, 3)), up: Object.assign({}, s.up) };
  } catch (e) {}
  return def;
}
let save = loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const has = k => !!save.up[k] || Q.get('up') === 'all';
let P = {};
function refreshParams() {
  P = {
    bladeW: has('hyd') ? 3.0 : 2.4, angSpd: has('hyd') ? 150 : 70, cap: has('hyd') ? 1.3 : 0.9,
    iceGrip: has('chains') ? 0.55 : 0.14, saltMax: has('salt') ? 140 : 50, saltR: has('salt') ? 2.1 : 1.25,
    blower: has('blower'), led: has('led')
  };
}
refreshParams();

const UPGRADES = [
  { id: 'hyd', ic: '🔧', name: 'Hydraulik-Schild', price: 260, desc: 'Breiteres Schild (3,0 m), doppelt so schnelles Schwenken, 45 % mehr Ladung.' },
  { id: 'chains', ic: '⛓️', name: 'Schneeketten', price: 200, desc: 'Viermal mehr Grip auf Glatteis. Kein Pirouetten-Ballett mehr.' },
  { id: 'salt', ic: '🧂', name: 'Salzstreuer XL', price: 160, desc: 'Fast dreifacher Salztank und breiterer Streuteller.' },
  { id: 'blower', ic: '🌀', name: 'Schneefräsen-Aufsatz', price: 480, desc: 'Taste F: schleudert den Schnee ~10 m weit zur Schild-Seite – über Zäune aufs Feld.' },
  { id: 'led', ic: '💡', name: 'LED-Scheinwerfer', price: 180, desc: 'Hellerer Lichtkegel, der verstecktes Glatteis sichtbar macht.' }
];

// ================= Bezirke =================
const LEVELS = [
  { name: 'Rosenweg', sub: 'Reihenhaus-Gehweg', seed: 11, roadW: 5.6, depth: 0.14, snow: 0.00006, ice: 3, roadCars: [1], carN: 3, driveP: 0.5, slope: 0, field: false, storm: 0,
    intro: 'Reihenhaussiedlung, 14 cm Neuschnee. Hinter jeder Gardine steht ein Rentner mit Stoppuhr. Straße und Gehwege frei, Schnee auf die Grünstreifen mit den orangen Stangen.' },
  { name: 'Lindenallee', sub: 'Zugeparkt bis zum letzten Meter', seed: 23, roadW: 7.0, depth: 0.18, snow: 0.0001, ice: 4, roadCars: [-1, 1], carN: 9, driveP: 0.7, slope: 0, field: false, storm: 0,
    intro: 'Autos links, Autos rechts, Einfahrten dazwischen. Jedes Auto gehört jemandem, der um 6:15 los muss. Wer ein Auto einmauert, bekommt Besuch im Bademantel.' },
  { name: 'Schulstraße', sub: 'Blitzeis-Gasse', seed: 37, roadW: 6.4, depth: 0.15, snow: 0.0001, ice: 13, roadCars: [1], carN: 5, driveP: 0.5, slope: 0, field: false, storm: 0,
    intro: 'Gestern Tauwetter, heute Nacht Frost: Unter dem Schnee lauert Blitzeis. Gehwege salzen (Leertaste), bevor um 7:30 die Grundschüler kommen. Salznachschub am Haufen beim Start.' },
  { name: 'Am Kartoffelacker', sub: 'Feldrand mit Zaun', seed: 41, roadW: 6.8, depth: 0.27, snow: 0.00015, ice: 6, roadCars: [-1], carN: 5, driveP: 0.6, slope: 0, field: true, storm: 0,
    intro: '27 cm Pappschnee. Auf der Feldseite gibt es keinen Grünstreifen – der Schnee muss über den Zaun aufs Feld. Mit der Schneefräse (Werkstatt) ein Vergnügen, ohne sie Handarbeit am Zaun.' },
  { name: 'Bergstraße', sub: 'Steile Bergstraße im Schneesturm', seed: 59, roadW: 6.4, depth: 0.22, snow: 0.00026, ice: 9, roadCars: [-1, 1], carN: 6, driveP: 0.6, slope: 0.1, field: false, storm: 1,
    intro: 'Zehn Prozent Steigung, Schneesturm, Glatteis. Was du oben liegen lässt, ist um 7 wieder zugeschneit. Wer hier rutscht, rutscht bis zur Bäckerei.' }
];
const LEVEL_SECONDS = 210;
const NAMES = ['Herr Krause', 'Frau Schmidtke', 'Dr. Wiesel', 'Familie Özdemir', 'Herr Pohl', 'Frau Brandt', 'Opa Heinz', 'Frau Kowalski', 'Herr Lehmann', 'Frau Dörfler', 'Herr Yilmaz', 'Frau Nowak', 'Herr Bauer', 'Frau Hinz', 'Herr Kunz', 'Frau Gerlach'];
const LINES = {
  4: ['Meine Einfahrt! Ich muss um sechs zur Schicht!', 'Hallo?! Hier ist eine AUSFAHRT!', 'Das schieb ICH jetzt bestimmt nicht weg!', 'Ich hab die Einfahrt gestern erst gefegt!'],
  5: ['MEIN AUTO! Wie soll ich da rauskommen?!', 'Den Wagen hab ich gestern waschen lassen!', 'Man sieht ja das Kennzeichen nicht mehr!', 'Das ist ein Leasingwagen, junger Mann!'],
  6: ['Ich komm nicht mehr aus dem Haus!', 'Die Haustür! Der Paketbote kommt doch!', 'Soll ich jetzt aus dem Fenster klettern?!'],
  8: ['Schnee an MEINER Hauswand?!', 'Das ist Sachbeschädigung!'],
  bin: ['Meine Tonne! Heute ist Abholung!', 'Die Biotonne! Jetzt liegt alles im Schnee!'],
  mail: ['Der Briefkasten war von 1987!', 'Mein Briefkasten! Da kommt die Zeitung rein!'],
  dent: ['DELLE! Das zahlt die Stadt!', 'Haben Sie überhaupt einen Führerschein?!'],
  near: ['Sind Sie wahnsinnig?! Fast im Bademantel überfahren!', 'Ich ruf die Polizei! Und das Ordnungsamt!'],
  early: ['Um halb sechs?! Ich hab Nachtschicht gehabt!', 'Früher hat man das mit der Schippe gemacht!', 'Ich schreib an die Zeitung!']
};
const FINES = { 4: 20, 5: 40, 6: 25, 8: 30, bin: 15, mail: 25, dent: 60, near: 80 };
const KIND_LABEL = { 4: 'Einfahrt', 5: 'Auto', 6: 'Hauseingang', 8: 'Hauswand', bin: 'Mülltonne', mail: 'Briefkasten', dent: 'Delle', near: 'Beinahe-Unfall' };

// ================= Schneeraster =================
const CS = 0.32, CS2 = CS * CS, GW = 128, GH = 256, NC = GW * GH;
const GWID = (GW - 1) * CS, GLEN = (GH - 1) * CS, X0 = -GWID / 2, Z0 = -GLEN / 2;
const Z_YARD = 0, Z_ROAD = 1, Z_WALK = 2, Z_VERGE = 3, Z_DRIVE = 4, Z_CAR = 5, Z_DOOR = 6, Z_FIELD = 7, Z_HOUSE = 8, Z_END = 9, Z_FENCE = 10;
const ILLEGAL = [0, 0, 0, 0, 1, 1, 1, 0, 1, 0, 0];
const LEGAL = [0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0];

    const mk = (type, f, q) => { const src = ctx.createBufferSource(); src.buffer = nb; src.loop = true; const bf = ctx.createBiquadFilter(); bf.type = type; bf.frequency.value = f; bf.Q.value = q; const g = ctx.createGain(); g.gain.value = 0; src.connect(bf); bf.connect(g); g.connect(master); src.start(); return { src, g }; };
    const scrape = mk('bandpass', 480, 0.6), salt = mk('highpass', 3800, 0.5), skid = mk('bandpass', 1400, 9), blow = mk('bandpass', 950, 1.4);
    o1.start(); o2.start();
    Object.assign(Eng, { on: true, ctx, master, lp, o1, o2, scrape, salt, skid, blow });
  } catch (e) { Eng.on = false; }
}
function engineSet(thr, spd, scr, sl, sk, bl) {
  if (!Eng.on) return;
  const t = Eng.ctx.currentTime, f = 34 + spd * 4 + thr * 16;
  Eng.master.gain.setTargetAtTime(AC.isMuted() ? 0 : 0.5, t, 0.1);
  Eng.o1.frequency.setTargetAtTime(f, t, 0.08); Eng.o2.frequency.setTargetAtTime(f / 2.01, t, 0.08);
  Eng.lp.frequency.setTargetAtTime(200 + thr * 300 + spd * 25, t, 0.1);
  Eng.scrape.g.gain.setTargetAtTime(scr, t, 0.06); Eng.salt.g.gain.setTargetAtTime(sl, t, 0.05);
  Eng.skid.g.gain.setTargetAtTime(sk, t, 0.05); Eng.blow.g.gain.setTargetAtTime(bl, t, 0.1);
}
function engineStop() {
  if (!Eng.on) return;
  try { const t = Eng.ctx.currentTime; Eng.master.gain.setTargetAtTime(0, t, 0.05); [Eng.o1, Eng.o2, Eng.scrape.src, Eng.salt.src, Eng.skid.src, Eng.blow.src].forEach(n => n.stop(t + 0.3)); } catch (e) {}
  Eng.on = false;
}

// ================= Eingabe =================
const keys = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Enter') e.preventDefault();
  if (state === 'play') {
    if (e.code === 'KeyC') setCam(1 - camMode);
    if (e.code === 'KeyF') toggleBlower();
    if (e.code === 'Enter') confirmDone();
    if (e.code === 'Escape' || e.code === 'KeyP') pauseGame();
  } else if (state === 'pause' && (e.code === 'Escape' || e.code === 'KeyP')) { hidePanel(); state = 'play'; }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; input.joyX = input.joyY = 0; input.touchSalt = false; });
canvas.addEventListener('wheel', e => { if (state === 'play') { e.preventDefault(); plow.aTarget = clamp(plow.aTarget + (e.deltaY > 0 ? 5 : -5), -35, 35); slider.value = plow.aTarget; } }, { passive: false });
function setCam(m) { camMode = m; overlay = m === 1; markDirty(0, GH - 1); }
function toggleBlower() { if (!P.blower) { toast('🌀 Schneefräse gibt es in der Werkstatt.'); return; } plow.blower = !plow.blower; snd('pop', plow.blower ? 1.4 : 0.8); }
function confirmDone() {
  if (cleared < 0.6) { toast('Erst mindestens 60 % räumen, sonst gibt’s Ärger vom Bauhof.', 'bad'); return; }
  endLevel(true);
}
const slider = document.getElementById('angSlider');
slider.addEventListener('input', () => { plow.aTarget = +slider.value; });
const touchEl = document.getElementById('touch');
function enableTouch() { touchEl.classList.add('on'); }
if (matchMedia('(pointer: coarse)').matches) enableTouch();
addEventListener('touchstart', enableTouch, { once: true, passive: true });
const joy = document.getElementById('joy'), knob = document.getElementById('knob');
let joyId = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  input.joyX = dx; input.joyY = -dy; knob.style.transform = `translate(${dx * 40}px,${dy * 40}px)`;
}
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; input.joyX = input.joyY = 0; knob.style.transform = ''; };
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);
const tSaltBtn = document.getElementById('tSalt');
tSaltBtn.addEventListener('pointerdown', () => { input.touchSalt = true; tSaltBtn.classList.add('on'); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) tSaltBtn.addEventListener(ev, () => { input.touchSalt = false; tSaltBtn.classList.remove('on'); });
document.getElementById('tBlow').onclick = toggleBlower;
document.getElementById('tCam').onclick = () => setCam(1 - camMode);
document.getElementById('tDone').onclick = () => { if (state === 'play') confirmDone(); };
document.getElementById('tPause').onclick = pauseGame;
const muteBtn = document.getElementById('muteBtn');
const syncMute = () => { muteBtn.textContent = AC && AC.isMuted() ? '🔇' : '🔊'; };
muteBtn.onclick = () => { if (AC) AC.toggleMute(); syncMute(); }; syncMute();

// ================= Hauptschleife =================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt <= 0) return;
  if (state === 'play') { const n = dt > 0.025 ? 2 : 1; for (let k = 0; k < n; k++) update(dt / n); }
  updateWorld(dt, now);
  placeCamera(false, dt);
  flush();
  if (state === 'play' && (tHud += dt) > 0.1) { tHud = 0; updateHud(); }
  renderer.render(scene, camera);
}

// ================= Selbsttest (?selftest=1): Massenerhaltung =================
function selfTest() {
  buildLevel(0); L = Object.assign({}, L, { snow: 0 }); state = 'play'; auto = {};
  const v0 = totalSnow() + plow.load;
  for (let k = 0; k < 600; k++) update(1 / 30);
  const v1 = totalSnow() + plow.load;
  const ok = Math.abs(v1 - v0) < 1e-3 * v0 && collectedTotal > 5 && cleared > 0.05;
  const msg = `SELFTEST ${ok ? 'PASS' : 'FAIL'}: Schnee vorher ${v0.toFixed(4)} m³, nachher ${v1.toFixed(4)} m³, bewegt ${collectedTotal.toFixed(2)} m³, geräumt ${(cleared * 100).toFixed(1)} %`;
  const el = document.getElementById('selftest'); el.style.display = 'block'; el.textContent = msg; console.log(msg);
  auto = null; showMenu();
}

// ================= Start =================
buildLevel(0);
if (Q.get('selftest')) selfTest();
else if (Q.get('demo')) {
  const li = clamp((+Q.get('level') || 1) - 1, 0, 4);
  buildLevel(li); startPlay(); auto = { salt: true };
  if (Q.get('cam') === 'top') setCam(1);
  const ff = +Q.get('ff') || 0;
  for (let k = 0; k < ff * 30; k++) update(1 / 30);
  placeCamera(true);
  if (Q.get('dbg')) { const el = document.getElementById('selftest'); el.style.display = 'block'; el.textContent = `t=${gameTime.toFixed(0)}s cleared=${(cleared * 100).toFixed(1)}% legal=${(legalPct * 100).toFixed(0)}% kinds=${JSON.stringify(compKinds)} moved=${collectedTotal.toFixed(1)} plow=${plow.x.toFixed(1)},${plow.z.toFixed(1)} th=${plow.th.toFixed(2)} v=${Math.hypot(plow.vx, plow.vz).toFixed(2)} load=${plow.load.toFixed(2)} li=${auto && auto.li}`; }
  if (Q.get('manual')) auto = null;
  if (Q.get('end')) endLevel(true);
} else if (Q.get('shop')) { save.budget = Math.max(save.budget, 500); showShop(showMenu); }
else showMenu();
requestAnimationFrame(frame);
</script>
