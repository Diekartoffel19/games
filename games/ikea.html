<script>
const { Engine, Bodies, Body, Composite, Constraint, Events, Query, Vector } = Matter;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const WW = 1200, WH = 700, FLOOR = 620, CX = 600;
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(innerWidth / WW, innerHeight / WH);
  offX = (innerWidth - WW * scale) / 2; offY = (innerHeight - WH * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- Audio ----------
function ac() { return ArcadeCore.isMuted() ? null : ArcadeCore.getAudioContext(); }
function noise(dur, freq, vol, type = 'highpass') {
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function tone(freq, dur, vol, type = 'square', slide = 0) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
const sfx = {
  crack() { noise(0.25, 2500, 0.6); setTimeout(() => noise(0.15, 4000, 0.4), 40); setTimeout(() => noise(0.3, 1200, 0.3), 90); tone(180, 0.2, 0.25, 'sawtooth', -120); },
  click() { tone(1800, 0.03, 0.12); noise(0.03, 5000, 0.15); },
  ratchet() { for (let i = 0; i < 4; i++) setTimeout(() => tone(2200 + Math.random() * 400, 0.02, 0.1), i * 35); },
  thud(v) { tone(90, 0.15, Math.min(0.4, v * 0.04), 'sine', -40); noise(0.08, 400, Math.min(0.3, v * 0.03), 'lowpass'); },
  snap() { tone(500, 0.08, 0.15, 'triangle', 300); },
  bad() { tone(200, 0.3, 0.2, 'sawtooth', -100); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.25, 0.15, 'triangle'), i * 120)); },
  boing() { tone(300, 0.3, 0.15, 'sine', 400); }
};

// ---------- Levels (coords relative to floor center, y up = negative) ----------
const LEVELS = [
  { name: 'HOPPLA', what: 'Hocker', test: 'sit', slots: [
    { id: 'A', w: 16, h: 110, x: -60, y: -55, anchor: true },
    { id: 'B', w: 160, h: 16, x: 0, y: -118 },
    { id: 'C', w: 16, h: 110, x: 60, y: -55 },
    { id: 'D', w: 120, h: 12, x: 0, y: -40 }],
    joints: [['A', 'B', -60, -114], ['C', 'B', 60, -114], ['A', 'D', -60, -40], ['C', 'D', 60, -40]] },
  { name: 'BILLIG', what: 'Regal', test: 'books', slots: [
    { id: 'A', w: 14, h: 260, x: -82, y: -130, anchor: true },
    { id: 'B', w: 150, h: 12, x: 0, y: -12 },
    { id: 'C', w: 14, h: 260, x: 82, y: -130 },
    { id: 'D', w: 150, h: 12, x: 0, y: -130 },
    { id: 'E', w: 150, h: 12, x: 0, y: -254 }],
    joints: [['A', 'B', -78, -12], ['C', 'B', 78, -12], ['A', 'D', -78, -130], ['C', 'D', 78, -130], ['A', 'E', -78, -254], ['C', 'E', 78, -254]] },
  { name: 'STOLPA', what: 'Stuhl', test: 'sit', slots: [
    { id: 'A', w: 16, h: 240, x: -60, y: -120, anchor: true },
    { id: 'B', w: 140, h: 16, x: 8, y: -118 },
    { id: 'C', w: 16, h: 110, x: 70, y: -55 },
    { id: 'D', w: 60, h: 14, x: -22, y: -200 },
    { id: 'E', w: 130, h: 10, x: 5, y: -40 }],
    joints: [['A', 'B', -60, -118], ['C', 'B', 70, -114], ['A', 'D', -58, -200], ['A', 'E', -60, -40], ['C', 'E', 70, -40]] },
  { name: 'KNARRSTAD', what: 'Bett', test: 'bed', slots: [
    { id: 'A', w: 20, h: 200, x: -230, y: -100, anchor: true },
    { id: 'B', w: 220, h: 20, x: -110, y: -60 },
    { id: 'C', w: 220, h: 20, x: 110, y: -60 },
    { id: 'D', w: 20, h: 50, x: 0, y: -25 },
    { id: 'E', w: 20, h: 120, x: 230, y: -60 }],
    joints: [['A', 'B', -222, -60], ['B', 'C', 0, -60], ['D', 'B', -6, -52], ['D', 'C', 6, -52], ['E', 'C', 222, -60]] },
  { name: 'SCHRANKBORG', what: 'Kleiderschrank', test: 'books', slots: [
    { id: 'A', w: 16, h: 340, x: -110, y: -170, anchor: true },
    { id: 'B', w: 204, h: 14, x: 0, y: -14 },
    { id: 'C', w: 16, h: 340, x: 110, y: -170 },
    { id: 'D', w: 204, h: 14, x: 0, y: -333 },
    { id: 'E', w: 12, h: 160, x: 0, y: -100 },
    { id: 'F', w: 204, h: 12, x: 0, y: -186 }],
    joints: [['A', 'B', -106, -14], ['C', 'B', 106, -14], ['A', 'D', -106, -333], ['C', 'D', 106, -333], ['E', 'B', 0, -24], ['E', 'F', 0, -184], ['A', 'F', -106, -186], ['C', 'F', 106, -186]] }
];

const CURSES = ['Verdammter Inbus!!', 'Wo ist Schraube 104?!', 'WER HAT DAS ENTWORFEN?!', '#@!%&§!!', 'Das Bild zeigt nur ein Männchen mit Fragezeichen!', 'Warum sind da 3 Teile übrig?!', 'Ich hasse Schweden.', 'Das war MEIN Daumen!', 'Holz! Warum Holz?!'];
const PRAISE = ['Ha! Wie ein Profi.', 'Bombenfest!', 'Läuft bei mir.', 'Ich bin ein Gott des Spanplattenbaus.'];
const PARTNER_BAD = ['Schatz... das ist schief.', 'Sollen wir nicht lieber jemanden anrufen?', 'Meine Mutter hätte das schon fertig.', 'Du hältst die Anleitung falsch rum.', 'Ich geh schon mal Pizza bestellen...'];
const PARTNER_GOOD = ['Oh, sieht gut aus!', 'Mein Held! 😍', 'Wow, richtig stabil.', 'Okay, ich bin beeindruckt.'];

// ---------- State ----------
const CAT_FLOOR = 1, CAT_PART = 2, CAT_WEIGHT = 4;
let engine, world, lvl, lvIndex = 0, slots, joints, pieces, weights, clamp = [];
let state = 'title', sat = 100, totalScore = 0, levelTime = 0, testT = 0, shake = 0;
let particles = [], bubble = null, pBubble = null, drag = null, mouse = { x: 0, y: 0 }, screw = null, msg = null;
let anger = 0;

function say(t) { bubble = { t, life: 3 }; }
function psay(t) { pBubble = { t, life: 3 }; }
function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
function toast(t, col = '#c0392b') { msg = { t, col, life: 2 }; }
function addSat(v) { sat = Math.max(0, Math.min(100, sat + v)); }

function rot(v, a) { const c = Math.cos(a), s = Math.sin(a); return { x: v.x * c - v.y * s, y: v.x * s + v.y * c }; }
function slotWorld(s) { return { x: CX + s.x, y: FLOOR + s.y }; }

function startLevel(i) {
  lvIndex = i; lvl = LEVELS[i];
  engine = Engine.create(); world = engine.world;
  engine.constraintIterations = 6; engine.positionIterations = 8;
  Composite.add(world, [
    Bodies.rectangle(WW / 2, FLOOR + 40, WW * 3, 80, { isStatic: true, friction: 1, collisionFilter: { category: CAT_FLOOR } }),
    Bodies.rectangle(-40, WH / 2, 80, WH * 2, { isStatic: true, collisionFilter: { category: CAT_FLOOR } }),
    Bodies.rectangle(WW + 40, WH / 2, 80, WH * 2, { isStatic: true, collisionFilter: { category: CAT_FLOOR } })
  ]);
  slots = lvl.slots.map(s => ({ ...s, piece: null }));
  joints = lvl.joints.map(([a, b, x, y]) => ({ a: slots.find(s => s.id === a), b: slots.find(s => s.id === b), x, y, cons: [], kind: 'none', q: 0 }));
  pieces = []; weights = []; particles = []; clamp = [];
  // spawn pieces in two piles, shuffled
  const order = slots.slice().sort(() => Math.random() - 0.5);
  let li = 0, ri = 0;
  order.forEach(s => {
    const body = Bodies.rectangle(0, 0, s.w, s.h, { friction: 0.9, frictionAir: 0.02, density: 0.002, collisionFilter: { category: CAT_PART, mask: CAT_FLOOR | CAT_WEIGHT } });
    const p = { body, w: s.w, h: s.h, slot: null, grain: Math.random() * 100 };
    pieces.push(p); Composite.add(world, body);
    if (s.anchor) { place(p, s, true); return; }
    // lay flat in a pile
    const left = (li + ri) % 2 === 0;
    const lw = Math.max(s.w, s.h), lh = Math.min(s.w, s.h);
    Body.setAngle(body, s.h > s.w ? Math.PI / 2 : 0);
    const x = left ? 130 + 60 * li : WW - 130 - 60 * ri;
    if (left) li++; else ri++;
    Body.setPosition(body, { x: Math.max(lw / 2 + 10, Math.min(WW - lw / 2 - 10, x + (left ? 60 : -60))), y: FLOOR - lh / 2 - (li + ri) * 18 });
  });
  Events.on(engine, 'collisionStart', e => {
    for (const pr of e.pairs) {
      const v = Vector.magnitude(Vector.sub(pr.bodyA.velocity, pr.bodyB.velocity));
      if (v > 4) sfx.thud(v);
    }
  });
  levelTime = 0; testT = 0; state = 'build'; screw = null; drag = null;
  say(i === 0 ? 'Na gut. Wie schwer kann das sein?' : rnd(['Nächstes Möbel. Ich schaff das.', 'Diesmal lese ich die Anleitung.', 'Noch ein Karton...']));
}

function place(p, s, isAnchor) {
  p.slot = s; s.piece = p;
  const anchorPiece = slots.find(x => x.anchor).piece;
  let pos = slotWorld(s), ang = 0;
  if (!isAnchor && anchorPiece) {
    // line the part up with the part it plugs into (prefer the anchor), even if that one sags
    const ns = joints.filter(j => j.a === s || j.b === s).map(j => j.a === s ? j.b : j.a).filter(n => n.piece);
    const ref = ns.find(n => n.anchor) || ns[0] || slots.find(x => x.anchor), rb = ref.piece.body;
    const off = rot({ x: s.x - ref.x, y: s.y - ref.y }, rb.angle);
    pos = { x: rb.position.x + off.x, y: rb.position.y + off.y }; ang = rb.angle;
  }
  Body.setPosition(p.body, pos); Body.setAngle(p.body, ang);
  Body.setVelocity(p.body, { x: 0, y: 0 }); Body.setAngularVelocity(p.body, 0);
  if (isAnchor) {
    const b = p.body;
    clamp = [-1, 1].map(sx => Constraint.create({ bodyA: b, pointA: { x: sx * s.w / 2, y: s.h / 2 }, pointB: { x: pos.x + sx * s.w / 2, y: pos.y + s.h / 2 }, stiffness: 0.9, length: 0, render: { visible: false } }));
    clamp.push(Constraint.create({ bodyA: b, pointA: { x: 0, y: -s.h / 2 }, pointB: { x: pos.x, y: pos.y - s.h / 2 }, stiffness: 0.6, length: 0 }));
    Composite.add(world, clamp);
  }
  // dowels to placed neighbours
  joints.forEach(j => {
    if (j.kind !== 'none' && j.kind !== 'broken') return;
    if ((j.a === s && j.b.piece) || (j.b === s && j.a.piece)) setJoint(j, 'dowel', 0);
  });
}

function localPt(slot, wx, wy) { return { x: wx - slot.x, y: wy - slot.y }; }
function setJoint(j, kind, q) {
  j.cons.forEach(c => Composite.remove(world, c)); j.cons = [];
  j.kind = kind; j.q = q; j.age = 0;
  if (kind === 'dowel') {
    // two soft pins: parts sag and wobble but don't swing around like a hinge
    j.cons = [[-7, -7], [7, 7]].map(([dx, dy]) => Constraint.create({ bodyA: j.a.piece.body, bodyB: j.b.piece.body, pointA: localPt(j.a, j.x + dx, j.y + dy), pointB: localPt(j.b, j.x + dx, j.y + dy), stiffness: 0.03, length: 0, damping: 0.05 }));
  } else if (kind === 'screw') {
    const st = 0.06 + 0.5 * q * q;
    j.cons = [[-7, -7], [7, 7]].map(([dx, dy]) => Constraint.create({ bodyA: j.a.piece.body, bodyB: j.b.piece.body, pointA: localPt(j.a, j.x + dx, j.y + dy), pointB: localPt(j.b, j.x + dx, j.y + dy), stiffness: st, length: 0, damping: 0.1 }));
  }
  Composite.add(world, j.cons);
}
function stretch(c) {
  return Vector.magnitude(Vector.sub(Constraint.pointAWorld(c), Constraint.pointBWorld(c)));
}
function jointWorld(j) {
  const p = j.a.piece; if (!p) return slotWorld({ x: j.x, y: j.y });
  return Vector.add(p.body.position, Vector.rotate({ x: j.x - j.a.x, y: j.y - j.a.y }, p.body.angle));
}

function breakJoint(j) {
  const wasScrew = j.kind === 'screw';
  setJoint(j, 'broken', 0);
  const w = jointWorld(j);
  splinter(w.x, w.y, wasScrew ? 26 : 10);
  if (wasScrew) { sfx.crack(); shake = 14; } else { sfx.boing(); shake = 5; }
  anger = 1;
  if (state !== 'build') return;
  addSat(wasScrew ? -8 : -3);
  say(rnd(CURSES)); if (Math.random() < 0.5) psay(rnd(PARTNER_BAD));
  // the looser of the two parts falls off, so the broken joint can be rebuilt by re-inserting it
  const live = s => joints.filter(k => (k.a === s || k.b === s) && (k.kind === 'dowel' || k.kind === 'screw')).length;
  const loose = j.a.anchor ? j.b : j.b.anchor ? j.a : live(j.a) <= live(j.b) ? j.a : j.b;
  const lost = [loose.id];
  detach(loose);
  // everything no longer connected to the anchor falls off too
  const anchorSlot = slots.find(s => s.anchor), seen = new Set([anchorSlot]), queue = [anchorSlot];
  while (queue.length) {
    const s = queue.shift();
    joints.forEach(k => {
      if (k.kind !== 'dowel' && k.kind !== 'screw') return;
      const o = k.a === s ? k.b : k.b === s ? k.a : null;
      if (o && !seen.has(o)) { seen.add(o); queue.push(o); }
    });
  }
  slots.forEach(s => { if (s.piece && !seen.has(s)) { lost.push(s.id); detach(s); } });
  toast((wasScrew ? 'KRACK! ' : 'Dübel raus! ') + 'Teil ' + lost.join(', ') + ' neu einsetzen!');
}
function detach(s) {
  joints.forEach(k => { if ((k.a === s || k.b === s) && k.kind !== 'none') setJoint(k, 'none', 0); });
  s.piece.slot = null; s.piece = null;
}
function splinter(x, y, n) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 10 - 2, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.6, l: 6 + Math.random() * 10, life: 1.5 + Math.random() });
}

// ---------- Input ----------
function toWorld(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
cv.addEventListener('pointerdown', e => {
  ArcadeCore.getAudioContext();
  mouse = toWorld(e);
  if (state !== 'build') return;
  if (screw) { screwHit(); return; }
  // screw icons first
  for (const j of joints) {
    if (j.kind !== 'dowel') continue;
    const w = jointWorld(j);
    if (Math.hypot(w.x - mouse.x, w.y - mouse.y) < 16) { startScrew(j); return; }
  }
  const hits = Query.point(pieces.map(p => p.body), mouse);
  if (hits.length) {
    const b = hits[hits.length - 1], p = pieces.find(p => p.body === b);
    // loose parts are held at their centre so they can be turned upright while carried
    const grip = p.slot ? Vector.sub(mouse, b.position) : { x: 0, y: 0 };
    drag = { p, c: Constraint.create({ pointA: { ...mouse }, bodyB: b, pointB: grip, stiffness: 0.15, damping: 0.1, length: 0 }) };
    Composite.add(world, drag.c);
    if (p.slot) { say(rnd(['Ups...', 'Nur kurz anheben...', 'Vorsichtig...'])); }
  }
});
addEventListener('pointermove', e => { mouse = toWorld(e); if (drag) drag.c.pointA = { ...mouse }; });
addEventListener('pointerup', () => { if (drag) release(); });
addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && screw) { e.preventDefault(); screwHit(); }
  if (e.code === 'Escape' && screw) screw = null;
});

const SNAP = 60;
function fitsSlot(p, s) { return s.w === p.w && s.h === p.h; }
function hasNeighbour(s) { return joints.some(j => (j.a === s && j.b.piece) || (j.b === s && j.a.piece)); }
// nearest free slot to a loose part; prefers a matching, reachable slot within snap range
function snapTarget(p) {
  const as = slots.find(s => s.anchor), anchor = as.piece.body;
  let best = null, bd = 1e9, fit = null, fd = 1e9;
  slots.forEach(s => {
    if (s.piece) return;
    const off = rot({ x: s.x - as.x, y: s.y - as.y }, anchor.angle);
    const d = Math.hypot(anchor.position.x + off.x - p.body.position.x, anchor.position.y + off.y - p.body.position.y);
    if (d < bd) { bd = d; best = s; }
    if (fitsSlot(p, s) && hasNeighbour(s) && d < fd) { fd = d; fit = s; }
  });
  if (fit && fd <= SNAP) return { slot: fit, ok: true };
  if (best && bd <= SNAP) return { slot: best, ok: false };
  return null;
}
function release() {
  const p = drag.p; Composite.remove(world, drag.c); drag = null;
  if (p.slot) return;
  const t = snapTarget(p);
  if (!t) return;
  if (!t.ok) {
    if (!fitsSlot(p, t.slot)) { toast('Falsches Teil! Hier gehört Teil ' + t.slot.id + ' hin.'); addSat(-3); sfx.bad(); say(rnd(CURSES)); }
    else { toast('Hängt noch in der Luft – erst Teil ' + nextSlot().id + '!', '#e67e22'); addSat(-2); }
    return;
  }
  place(p, t.slot, false); sfx.snap();
  toast('Gesteckt! Jetzt die roten 🔴 Dübel festschrauben', '#27ae60');
}
function nextSlot() { return slots.find(s => !s.piece && hasNeighbour(s)); }
function nextStepNo() { return slots.filter(s => s.piece).length; }

// ---------- Screw minigame ----------
function startScrew(j) {
  screw = { j, t: 0, hits: [], zone: (Math.random() - 0.5) * 1.6, speed: 3 + lvIndex * 0.7 + Math.random() };
  sfx.click();
}
function screwHit() {
  if (!screw.j.a.piece || !screw.j.b.piece) { screw = null; return; }
  const a =Math.sin(screw.t * screw.speed) * 1.4;
  const d = Math.abs(a - screw.zone), q = Math.max(0, 1 - d / 0.45);
  screw.hits.push(q); sfx.ratchet();
  if (q < 0.15) { toast('SCHIEF ANGESETZT!', '#c0392b'); sfx.bad(); say(rnd(CURSES)); anger = 1; const b = screw.j.b.piece.body; Body.applyForce(b, b.position, { x: (Math.random() - 0.5) * 0.04 * b.mass, y: -0.02 * b.mass }); }
  screw.zone = (Math.random() - 0.5) * 1.6;
  if (screw.hits.length >= 3) {
    const q = screw.hits.reduce((a, b) => a + b, 0) / 3, j = screw.j;
    screw = null;
    if (!j.a.piece || !j.b.piece) return;
    setJoint(j, 'screw', q);
    if (q > 0.8) { toast('Perfekt festgezogen!', '#27ae60'); addSat(4); say(rnd(PRAISE)); if (Math.random() < 0.4) psay(rnd(PARTNER_GOOD)); }
    else if (q > 0.45) toast('Hält... irgendwie.', '#e67e22');
    else { toast('Wackelig verschraubt!', '#c0392b'); addSat(-3); psay(rnd(PARTNER_BAD)); }
    if (slots.every(s => s.piece) && joints.every(j => j.kind === 'screw')) setTimeout(startTest, 700);
  }
}

// ---------- Load test ----------
function startTest() {
  if (state !== 'build') return;
  state = 'test'; testT = 0;
  clamp.forEach(c => Composite.remove(world, c)); clamp = [];
  say('Fertig! Und jetzt... der Belastungstest.');
  psay(lvl.test === 'sit' ? 'Ich setz mich mal drauf!' : lvl.test === 'bed' ? 'PROBELIEGEN!' : 'Ich räum mal die Bücher ein.');
}
function dropWeights() {
  const top = Math.min(...slots.map(s => s.piece.body.bounds.min.y));
  const opt = { density: 0.01, friction: 0.8, restitution: 0.1, collisionFilter: { category: CAT_WEIGHT, mask: CAT_FLOOR | CAT_PART | CAT_WEIGHT } };
  if (lvl.test === 'sit') {
    const b = Bodies.rectangle(CX + 10, top - 140, 70, 60, { ...opt, density: 0.012 }); b.kind = 'person'; weights.push(b);
  } else if (lvl.test === 'bed') {
    const b = Bodies.rectangle(CX, top - 120, 420, 36, { ...opt, density: 0.006 }); b.kind = 'mattress'; weights.push(b);
  } else {
    slots.filter(s => s.w > s.h).forEach(s => {
      const p = s.piece.body;
      // wide shelves have a divider in the middle, so books go left and right of it
      const xs = s.w > 180 ? [-70, -35, 35, 70] : [-40, 0, 40];
      xs.forEach((dx, k) => { const b = Bodies.rectangle(p.position.x + dx, p.position.y - 40 - k * 12, 30, 44, opt); b.kind = 'book'; b.col = rnd(['#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#f39c12']); weights.push(b); });
    });
  }
  Composite.add(world, weights);
}
function endTest() {
  const broken = joints.filter(j => j.kind === 'broken').length;
  const tilt = slots.find(s => s.anchor).piece.body.angle;
  const toppled = Math.abs(Math.atan2(Math.sin(tilt), Math.cos(tilt))) > 0.6;
  const passed = broken <= 1 && !toppled;
  const lvScore = passed ? Math.round(sat * 10 + Math.max(0, 150 - levelTime) * 5) : 0;
  if (passed) {
    totalScore += lvScore; sfx.win(); addSat(10);
    showOv(`<h2>✅ ${lvl.name} steht!</h2><p>${broken ? 'Wackelt ein bisschen, aber hält. Eine Schraube ist übrig – egal.' : 'Bombenfest. Die Schweden wären stolz.'}</p><p>Zeit: ${Math.round(levelTime)}s · Zufriedenheit: ${Math.round(sat)}%<br>Punkte: <b>+${lvScore}</b> · Gesamt: <b>${totalScore}</b></p>`,
      lvIndex + 1 < LEVELS.length ? 'Nächstes Möbel ▶' : 'Abschluss ▶', () => lvIndex + 1 < LEVELS.length ? startLevel(lvIndex + 1) : finish(true));
  } else {
    addSat(-25); sfx.bad();
    if (sat <= 0) return gameOver();
    showOv(`<h2>💥 ZUSAMMENGEKRACHT!</h2><p>${toppled && broken <= 1 ? `Umgekippt! Der ${lvl.what} liegt jetzt flach.` : `${broken} Verbindungen gerissen. Der ${lvl.what} ist jetzt Kaminholz.`}</p><p>Tipp: Schrauben im grünen Bereich halten viel mehr aus.</p><p>Zufriedenheit: ${Math.round(sat)}%</p>`, 'Nochmal aufbauen 🔧', () => startLevel(lvIndex));
  }
  state = 'result';
}
function gameOver() { state = 'over'; finish(false); }
function finish(won) {
  const best = Number(ArcadeCore.getScore('ikea')) || 0;
  if (totalScore > best) ArcadeCore.saveScore('ikea', totalScore);
  showOv(won ? `<h1>🏠 Wohnung eingerichtet!</h1><p>Alle Möbel stehen. Eure Beziehung hat es überlebt (knapp).</p><p>Endpunkte: <b>${totalScore}</b> · Rekord: ${Math.max(best, totalScore)}</p>`
    : `<h1>💔 Beziehungsende</h1><p>„Ich zieh zu meiner Mutter. Die hat fertige Möbel.“</p><p>Punkte: <b>${totalScore}</b> · Rekord: ${Math.max(best, totalScore)}</p>`,
    'Neu anfangen', () => { sat = 100; totalScore = 0; startLevel(0); });
}
function showOv(html, btn, fn) {
  document.getElementById('ovBox').innerHTML = html + `<br><button id="ovBtn">${btn}</button>`;
  document.getElementById('ov').classList.remove('hide');
  document.getElementById('ovBtn').onclick = () => { document.getElementById('ov').classList.add('hide'); fn(); };
}

// ---------- Update ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'build' || state === 'test' || state === 'result') {
    Engine.update(engine, 1000 / 60);
    if (state === 'build') {
      levelTime += dt; addSat(-dt / 5);
      if (sat <= 0) gameOver();
      // carried loose parts turn themselves to match the furniture's orientation
      if (drag && !drag.p.slot) {
        const b = drag.p.body, ab = slots.find(s => s.anchor).piece.body;
        let d = ab.angle - b.angle; d = Math.atan2(Math.sin(2 * d), Math.cos(2 * d)) / 2;
        Body.setAngle(b, b.angle + d * 0.2); Body.setAngularVelocity(b, 0);
      }
    }
    joints.forEach(j => {
      j.age += dt;
      // fresh dowels get a moment to pull the parts together before they can pop out
      if (j.kind === 'dowel' && j.age > 1 && j.cons.some(c => stretch(c) > 30)) breakJoint(j);
      else if (j.kind === 'screw' && j.cons.some(c => stretch(c) > 3.5 + 7 * j.q)) breakJoint(j);
    });
    if (state === 'test') {
      testT += dt;
      if (testT > 1 && !weights.length) dropWeights();
      if (lvl.test === 'bed' && testT > 2.5 && testT < 5) weights.forEach(w => { if (Math.random() < 0.04) Body.applyForce(w, w.position, { x: 0, y: -0.05 * w.mass }); });
      if (testT > 6) endTest();
    }
    if (screw) screw.t += dt;
  }
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.r += p.vr; p.life -= dt; if (p.y > FLOOR) { p.y = FLOOR; p.vy *= -0.3; p.vx *= 0.7; } });
  particles = particles.filter(p => p.life > 0);
  [bubble, pBubble, msg].forEach(b => b && (b.life -= dt));
  if (bubble && bubble.life <= 0) bubble = null;
  if (pBubble && pBubble.life <= 0) pBubble = null;
  if (msg && msg.life <= 0) msg = null;
  if (bubble === null && state === 'build' && Math.random() < dt / 9) say(rnd(CURSES));
  anger = Math.max(0, anger - dt * 0.5); shake *= 0.88;
  draw(); requestAnimationFrame(loop);
}

// ---------- Draw ----------
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function drawPart(p, alpha = 1) {
  const b = p.body;
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle); ctx.globalAlpha = alpha;
  ctx.fillStyle = '#e8c48a'; ctx.strokeStyle = '#8a6237'; ctx.lineWidth = 2;
  roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(140,95,45,.35)'; ctx.lineWidth = 1;
  const horiz = p.w >= p.h, len = horiz ? p.w : p.h, th = horiz ? p.h : p.w;
  for (let k = 1; k < 3; k++) {
    ctx.beginPath();
    for (let t = -len / 2 + 3; t < len / 2 - 3; t += 6) {
      const o = -th / 2 + th * k / 3 + Math.sin(t * 0.05 + p.grain + k) * 1.5;
      horiz ? ctx.lineTo(t, o) : ctx.lineTo(o, t);
    }
    ctx.stroke();
  }
  const letter = p.slot ? p.slot.id : slots.filter(s => !s.piece && fitsSlot(p, s)).map(s => s.id).join('/');
  if (letter && th >= 10) { ctx.fillStyle = p.slot ? '#5a3d1c' : '#0058a3'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (!horiz) ctx.rotate(-Math.PI / 2); ctx.fillText(letter, 0, 1); }
  ctx.restore();
}
function drawPerson(x, y, col, face, mood, partner) {
  ctx.save(); ctx.translate(x, y);
  const wob = Math.sin(performance.now() / (mood > 0.5 ? 60 : 400)) * (mood > 0.5 ? 3 : 1);
  ctx.translate(wob, 0);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(-14, 0); ctx.moveTo(0, -70); ctx.lineTo(14, 0); ctx.stroke();
  ctx.fillStyle = col; roundRect(-22, -150, 44, 85, 12); ctx.fill();
  ctx.beginPath();
  if (partner) { ctx.moveTo(-18, -135); ctx.lineTo(-30, -95); ctx.moveTo(18, -135); ctx.lineTo(28, -100); }
  else { const arm = Math.sin(performance.now() / 90) * (mood * 25); ctx.moveTo(-18, -135); ctx.lineTo(-34, -100 + arm); ctx.moveTo(18, -135); ctx.lineTo(38, -110 - arm); }
  ctx.stroke();
  if (!partner) { ctx.strokeStyle = '#666'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(38, -110); ctx.lineTo(50, -125); ctx.lineTo(56, -120); ctx.stroke(); }
  ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.arc(0, -172, 24, 0, 7); ctx.fill();
  if (mood > 0.3 && !partner) { ctx.fillStyle = 'rgba(255,0,0,' + mood * 0.5 + ')'; ctx.beginPath(); ctx.arc(0, -172, 24, 0, 7); ctx.fill(); ctx.fillStyle = '#5dade2'; ctx.beginPath(); ctx.arc(20, -185, 4, 0, 7); ctx.fill(); }
  ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(face, 0, -170);
  ctx.restore();
}
function drawBubble(b, x, y, right) {
  if (!b) return;
  ctx.save(); ctx.font = 'bold 15px "Segoe UI",Arial';
  const w = Math.min(260, ctx.measureText(b.t).width + 24);
  const bx = right ? x - w + 30 : x - 30;
  ctx.globalAlpha = Math.min(1, b.life * 3);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  roundRect(bx, y - 44, w, 36, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.t, bx + w / 2, y - 26, w - 14);
  ctx.restore();
}
function draw() {
  const W = innerWidth, H = innerHeight;
  ctx.fillStyle = '#1b2a3a'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(offX + (Math.random() - 0.5) * shake, offY + (Math.random() - 0.5) * shake); ctx.scale(scale, scale);
  // room
  ctx.fillStyle = '#f3ead8'; ctx.fillRect(0, 0, WW, FLOOR);
  ctx.fillStyle = 'rgba(0,88,163,.06)'; for (let x = 0; x < WW; x += 60) ctx.fillRect(x, 0, 30, FLOOR);
  ctx.fillStyle = '#b9895a'; ctx.fillRect(0, FLOOR, WW, WH - FLOOR);
  ctx.strokeStyle = 'rgba(90,60,30,.3)'; for (let x = 0; x < WW; x += 120) { ctx.beginPath(); ctx.moveTo(x, FLOOR); ctx.lineTo(x, WH); ctx.stroke(); }
  // box
  ctx.fillStyle = '#c9a06a'; ctx.fillRect(1010, FLOOR - 70, 150, 70); ctx.fillStyle = '#0058a3'; ctx.fillRect(1010, FLOOR - 52, 150, 22);
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText(lvl ? lvl.name : 'IKEA?', 1085, FLOOR - 37);
  if (!lvl) { ctx.restore(); return; }
  // ghosts
  const as = slots.find(s => s.anchor), ab = as.piece.body;
  const next = nextSlot();
  const snap = drag && !drag.p.slot && state === 'build' ? snapTarget(drag.p) : null;
  if (state === 'build') slots.forEach(s => {
    if (s.piece) return;
    const off = rot({ x: s.x - as.x, y: s.y - as.y }, ab.angle);
    ctx.save(); ctx.translate(ab.position.x + off.x, ab.position.y + off.y); ctx.rotate(ab.angle);
    ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
    if (snap && snap.slot === s) { ctx.fillStyle = snap.ok ? 'rgba(46,204,113,.35)' : 'rgba(231,76,60,.3)'; ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h); }
    ctx.strokeStyle = s === next ? 'rgba(0,88,163,' + (0.6 + Math.sin(performance.now() / 200) * 0.3) + ')' : 'rgba(0,88,163,.25)';
    ctx.strokeRect(-s.w / 2, -s.h / 2, s.w, s.h); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(0,88,163,.5)'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.id, 0, 0);
    ctx.restore();
  });
  pieces.forEach(p => drawPart(p));
  // weights
  weights.forEach(w => {
    ctx.save(); ctx.translate(w.position.x, w.position.y); ctx.rotate(w.angle);
    const bw = w.bounds.max.x - w.bounds.min.x;
    if (w.kind === 'book') { ctx.fillStyle = w.col; ctx.fillRect(-15, -22, 30, 44); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(-10, -12, 20, 4); }
    else if (w.kind === 'person') { ctx.fillStyle = '#e84393'; roundRect(-35, -30, 70, 60, 14); ctx.fill(); ctx.font = '34px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('😬', 0, -45); }
    else { ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 2; roundRect(-210, -18, 420, 36, 14); ctx.fill(); ctx.stroke(); ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.fillText('🤸', 0, -30); }
    ctx.restore();
  });
  // joints
  joints.forEach(j => {
    if (!j.a.piece || !j.b.piece || j.kind === 'broken') return;
    const w = jointWorld(j);
    if (j.kind === 'dowel' && state === 'build') {
      const pulse = 8 + Math.sin(performance.now() / 150) * 2;
      ctx.fillStyle = screw && screw.j === j ? '#ffcc00' : 'rgba(231,76,60,.85)';
      ctx.beginPath(); ctx.arc(w.x, w.y, pulse, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(w.x - 4, w.y); ctx.lineTo(w.x + 4, w.y); ctx.moveTo(w.x, w.y - 4); ctx.lineTo(w.x, w.y + 4); ctx.stroke();
    } else if (j.kind === 'screw') {
      ctx.fillStyle = j.q > 0.7 ? '#7f8c8d' : j.q > 0.4 ? '#d68910' : '#c0392b';
      ctx.beginPath(); for (let k = 0; k < 6; k++) ctx.lineTo(w.x + Math.cos(k * 1.047) * 5, w.y + Math.sin(k * 1.047) * 5); ctx.fill();
    }
  });
  // particles
  particles.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = '#d4a56a'; ctx.fillRect(-p.l / 2, -1.5, p.l, 3); ctx.restore(); });
  // people
  const sf = sat >= 80 ? '😍' : sat >= 60 ? '🙂' : sat >= 40 ? '😐' : sat >= 20 ? '😠' : '🤬';
  drawPerson(95, FLOOR, '#2e86de', anger > 0.4 ? '🤬' : state === 'test' ? '😰' : '😤', anger, false);
  drawPerson(1100, FLOOR - 70, '#e84393', sf, 0, true);
  drawBubble(bubble, 95, FLOOR - 205, false);
  drawBubble(pBubble, 1100, FLOOR - 275, true);
  // satisfaction meter
  ctx.fillStyle = 'rgba(0,0,0,.7)'; roundRect(930, 20, 250, 58, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'left'; ctx.fillText('Zufriedenheit Partner/in ' + sf, 942, 40);
  ctx.fillStyle = '#333'; ctx.fillRect(942, 50, 226, 16);
  ctx.fillStyle = sat > 60 ? '#2ecc71' : sat > 30 ? '#f1c40f' : '#e74c3c'; ctx.fillRect(942, 50, 226 * sat / 100, 16);
  // instruction sheet
  drawManual(next);
  // screw minigame
  if (screw) drawScrew();
  if (msg) { ctx.globalAlpha = Math.min(1, msg.life * 2); ctx.fillStyle = msg.col; ctx.font = 'bold 26px "Segoe UI",Arial'; ctx.textAlign = 'center'; ctx.fillText(msg.t, WW / 2, 210); ctx.globalAlpha = 1; }
  if (state === 'test') { ctx.fillStyle = '#c0392b'; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center'; ctx.fillText('BELASTUNGSTEST ' + Math.max(0, Math.ceil(6 - testT)), WW / 2, 170); }
  ctx.restore();
}
function drawManual(next) {
  const x = 380, y = 14, w = 440, h = 140;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-0.012); ctx.translate(-w / 2, -h / 2);
  ctx.fillRect(0, 0, w, h); ctx.strokeRect(0, 0, w, h);
  ctx.fillStyle = '#222'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'left';
  ctx.fillText(`${lvl.name} – ${lvl.what}   (${lvIndex + 1}/${LEVELS.length})`, 10, 20);
  ctx.font = '12px Arial';
  const unscrewed = joints.filter(j => j.kind !== 'screw').length;
  ctx.fillText(state === 'test' ? 'Schritt ∞: 🧍❓💥' : next ? `Schritt ${nextStepNo()}: Teil ${next.id} in den blinkenden Umriss ziehen` : unscrewed ? `Alle 🔴 festschrauben! (${unscrewed} übrig)` : '✔', 10, 38);
  ctx.fillText(`Teile platziert: ${slots.filter(s => s.piece).length}/${slots.length} · verschraubt: ${joints.length - unscrewed}/${joints.length}`, 10, 54);
  ctx.fillText('Ziehen = Teil bewegen · 🔴 klicken = Inbus · Klick/Leertaste im grünen Feld', 10, h - 8);
  // mini schematic
  const sx = 360, sy = 80, k = 0.27;
  slots.forEach(s => {
    ctx.fillStyle = s === next ? '#ff9f1a' : s.piece ? '#ccc' : '#fff';
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
    ctx.fillRect(sx + s.x * k - s.w * k / 2, sy + 40 + s.y * k - s.h * k / 2, s.w * k, s.h * k);
    ctx.strokeRect(sx + s.x * k - s.w * k / 2, sy + 40 + s.y * k - s.h * k / 2, s.w * k, s.h * k);
  });
  // little confused man
  ctx.font = '28px serif'; ctx.fillText('🧍', 20, 95); ctx.font = 'bold 22px Arial'; ctx.fillText('?', 50, 75);
  ctx.font = '22px serif'; ctx.fillText(next ? '➡ 🪵 ➡' : '🔧🔧🔧', 80, 95);
  ctx.restore();
}
function drawScrew() {
  const jw = jointWorld(screw.j), cx = 290, cy = 330;
  ctx.strokeStyle = 'rgba(255,204,0,.6)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(jw.x, jw.y); ctx.lineTo(cx, cy - 70); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(20,20,30,.88)'; roundRect(cx - 150, cy - 75, 300, 130, 14); ctx.fill();
  ctx.strokeStyle = '#555'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(cx, cy, 50, -Math.PI / 2 - 1.4, -Math.PI / 2 + 1.4); ctx.stroke();
  ctx.strokeStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(cx, cy, 50, -Math.PI / 2 + screw.zone - 0.2, -Math.PI / 2 + screw.zone + 0.2); ctx.stroke();
  const a = Math.sin(screw.t * screw.speed) * 1.4;
  ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * 58, cy - Math.cos(a) * 58); ctx.lineTo(cx + Math.sin(a) * 58 + 10, cy - Math.cos(a) * 58); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
  ctx.fillText(`INBUS: Drehung ${screw.hits.length + 1}/3 – Klick/Leertaste!`, cx, cy + 40);
}

showOv(`<h1>🛋️ Möbelbau aus der Hölle</h1>
<p>Fünf Kartons. Eine kryptische Anleitung. Ein Inbusschlüssel. Und dein/e Partner/in schaut zu.</p>
<p>🪵 <b>Ziehe</b> die Teile in den <b>blinkenden Umriss</b> (Buchstabe auf dem Teil = Platz im Umriss). Grün = passt. Teile drehen sich beim Tragen von selbst gerade.<br>
🔴 Gesteckte Teile hängen nur an <b>Dübeln</b>. <b>Klicke</b> die roten Punkte und drück im <b>grünen Bereich</b> (3×) – schief angesetzt = wackelige Schraube.<br>
⚠️ Fertige Teile nicht rumzerren! Reißt eine Verbindung, fällt das Teil ab und muss neu rein.<br>
💥 Am Ende kommt der <b>Belastungstest</b>. Hält dein Möbel?</p>
<p>Wenn die Zufriedenheit auf 0 fällt, ist die Beziehung vorbei.</p>`, 'Karton aufreißen 📦', () => startLevel(0));
requestAnimationFrame(loop);
</script>
