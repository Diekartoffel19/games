<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  body { background: radial-gradient(circle at 50% 15%, #3b1a6b 0%, #1a1240 45%, #0b0a1f 100%); touch-action: none; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  .hud { position: fixed; pointer-events: none; z-index: 5; }
  .panel { background: rgba(20, 16, 50, 0.72); border: 1px solid rgba(167, 139, 250, 0.28); border-radius: 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
  #topLeft { top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; }
  #scoreBox { padding: 10px 16px; min-width: 130px; }
  .label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #c4b5fd; font-weight: 700; }
  #score { font-size: 2rem; font-weight: 900; line-height: 1.1; }
  #best { font-size: 0.85rem; color: #fbbf24; font-weight: 700; }
  #topRight { top: 12px; right: 12px; padding: 10px 14px; text-align: center; }
  #nextFruit { width: 64px; height: 64px; margin-top: 6px; border-radius: 50%; display: grid; place-items: center; font-size: 2.1rem; background: rgba(255,255,255,0.06); border: 2px dashed rgba(196,181,253,0.4); }

  #evo { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px 14px; display: flex; align-items: center; gap: 4px; }
  #evo .f { display: grid; place-items: center; border-radius: 50%; font-size: 1rem; opacity: 0.45; transition: opacity 0.2s, transform 0.2s; }
  #evo .f.seen { opacity: 1; }
  #evo .f.pulse { transform: scale(1.35); }

  .btns { position: fixed; z-index: 6; display: flex; gap: 8px; }
  #btnsTop { top: 12px; left: 50%; transform: translateX(-50%); }
  #btnsBottom { bottom: 64px; right: 12px; flex-direction: column; }
  .btn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(167,139,250,0.35); background: rgba(30, 24, 70, 0.8); color: #ede9fe; font-weight: 800; font-size: 0.9rem; border-radius: 12px; padding: 8px 12px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 40px; transition: background 0.15s, transform 0.1s; }
  .btn:hover { background: #4338ca; }
  .btn:active { transform: scale(0.95); }
  .btn.big { font-size: 1.3rem; width: 52px; height: 52px; border-radius: 50%; }

  #help { position: fixed; left: 12px; bottom: 64px; z-index: 5; font-size: 0.75rem; color: #c4b5fd; padding: 8px 12px; line-height: 1.5; pointer-events: none; max-width: 240px; }
  @media (max-width: 640px) { #help { display: none; } #score { font-size: 1.5rem; } #evo .f { font-size: 0.8rem; } }

  #danger { position: fixed; inset: 0; pointer-events: none; z-index: 4; box-shadow: inset 0 0 0 rgba(244,63,94,0); transition: box-shadow 0.2s; }
  #danger.on { box-shadow: inset 0 0 90px rgba(244,63,94,0.55); }

  .float { position: fixed; z-index: 7; pointer-events: none; font-weight: 900; font-size: 1.4rem; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.6), 0 0 12px rgba(251,191,36,0.8); transform: translate(-50%, -50%); animation: floatUp 0.95s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }

  #overlay { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: rgba(8, 6, 25, 0.7); backdrop-filter: blur(4px); }
  #overlay.show { display: grid; }
  #overlay .card { padding: 28px 32px; text-align: center; max-width: 360px; width: calc(100% - 40px); }
  #overlay h1 { margin: 0 0 6px; font-size: 1.9rem; }
  #overlay p { margin: 6px 0; color: #ddd6fe; }
  #overlay .final { font-size: 2.6rem; font-weight: 900; color: #fbbf24; margin: 10px 0; }
  #overlay .btn { font-size: 1.05rem; padding: 12px 22px; margin-top: 12px; background: #e11d48; border-color: #fb7185; }
  #overlay .btn:hover { background: #f43f5e; }
</style>

<body>
<canvas id="scene"></canvas>
<div id="danger"></div>

<div id="topLeft" class="hud">
  <div id="scoreBox" class="panel">
    <div class="label">Score</div>
    <div id="score">0</div>
    <div id="best">Best: 0</div>
  </div>
</div>
<div id="topRight" class="hud panel">
  <div class="label">Next</div>
  <div id="nextFruit"></div>
</div>

<div id="btnsTop" class="btns">
  <a class="btn" href="../index.html" title="Back to the game collection">&lt; Arcade</a>
  <button class="btn" id="btnRestart" title="Restart (R)">↻</button>
  <button class="btn" id="btnMute" title="Sound on/off (M)">🔊</button>
</div>
<div id="btnsBottom" class="btns">
  <button class="btn big" id="btnRotL" title="Rotate view left (Q)">⟲</button>
  <button class="btn big" id="btnRotR" title="Rotate view right (E)">⟳</button>
</div>

<div id="help" class="panel">
  <b>Mouse:</b> aim · click to drop<br>
  <b>Right-drag / Q E:</b> rotate view · <b>Wheel:</b> zoom<br>
  <b>WASD / arrows:</b> move · <b>Space:</b> drop<br>
  <b>Touch:</b> drag to aim, release to drop · two fingers rotate
</div>

<div id="evo" class="hud panel"></div>

<div id="overlay">
  <div class="card panel">
    <h1>🍉 Game Over</h1>
    <p>The fruits spilled over the rim!</p>
    <div class="final" id="finalScore">0</div>
    <p id="finalBest"></p>
    <button class="btn" id="btnAgain">Play again</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Config ----------
  const BOX_W = 8;          // inner width (x) and depth (z)
  const BOX_H = 10;         // rim height = game over line
  const HALF = BOX_W / 2;
  const GRAVITY = 24;
  const SUBSTEPS = 10;
  const RESTITUTION = 0.12;
  const DROP_COOLDOWN = 0.55;
  const DANGER_TIME = 2.5;  // seconds above rim before game over

  const FRUITS = [
    { name: 'Cherry',     emoji: '🍒', r: 0.36, score: 1,  color: '#d6203c' },
    { name: 'Strawberry', emoji: '🍓', r: 0.48, score: 3,  color: '#ef3b3b' },
    { name: 'Grape',      emoji: '🍇', r: 0.62, score: 6,  color: '#7c3aed' },
    { name: 'Dekopon',    emoji: '🍊', r: 0.78, score: 10, color: '#fb8c1a' },
    { name: 'Persimmon',  emoji: '🟠', r: 0.95, score: 15, color: '#f0630f' },
    { name: 'Apple',      emoji: '🍎', r: 1.12, score: 21, color: '#e11d48' },
    { name: 'Pear',       emoji: '🍐', r: 1.30, score: 28, color: '#d9e36a' },
    { name: 'Peach',      emoji: '🍑', r: 1.50, score: 36, color: '#ffa8a0' },
    { name: 'Pineapple',  emoji: '🍍', r: 1.72, score: 45, color: '#f2c12e' },
    { name: 'Melon',      emoji: '🍈', r: 1.95, score: 55, color: '#b9e48a' },
    { name: 'Watermelon', emoji: '🍉', r: 2.20, score: 66, color: '#2f9e44' },
  ];
  const MAX_LEVEL = FRUITS.length - 1;
  const SPAWN_MAX = 4; // random drops use levels 0..4

  const AC = window.ArcadeCore;
  const sfx = (name, ...a) => { try { if (AC && !AC.isMuted() && AC[name]) AC[name](...a); } catch (e) {} };

  // ---------- Renderer / scene ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x140f33, 30, 70);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xcfc8ff, 0x2a1d45, 0.5));
  const sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(7, 18, 9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 12, bottom: -10, near: 1, far: 50 });
  sun.shadow.bias = -0.0008;
  scene.add(sun);
  const rimLight = new THREE.PointLight(0xff7ab6, 0.5, 40);
  rimLight.position.set(-9, 12, -8);
  scene.add(rimLight);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(40, 64),
    new THREE.MeshStandardMaterial({ color: 0x120d2a, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.8;
  floor.receiveShadow = true;
  scene.add(floor);

  // Container
  const wood = new THREE.MeshStandardMaterial({ color: 0xc08552, roughness: 0.7 });
  const base = new THREE.Mesh(new THREE.BoxGeometry(BOX_W + 1, 0.8, BOX_W + 1), wood);
  base.position.y = -0.4;
  base.receiveShadow = true; base.castShadow = true;
  scene.add(base);
  const innerFloor = new THREE.Mesh(new THREE.PlaneGeometry(BOX_W, BOX_W), new THREE.MeshStandardMaterial({ color: 0xd9c49a, roughness: 0.9 }));
  innerFloor.rotation.x = -Math.PI / 2; innerFloor.position.y = 0.002; innerFloor.receiveShadow = true;
  scene.add(innerFloor);

  const glassMat = new THREE.MeshStandardMaterial({ color: 0xbfe6ff, transparent: true, opacity: 0.1, roughness: 0.05, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const wallGeo = new THREE.PlaneGeometry(BOX_W, BOX_H);
  [[0, -HALF, 0], [0, HALF, Math.PI], [-HALF, 0, Math.PI / 2], [HALF, 0, -Math.PI / 2]].forEach(([x, z, ry]) => {
    const w = new THREE.Mesh(wallGeo, glassMat);
    w.position.set(x, BOX_H / 2, z); w.rotation.y = ry; w.renderOrder = 2;
    scene.add(w);
  });
  const postGeo = new THREE.BoxGeometry(0.25, BOX_H, 0.25);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const p = new THREE.Mesh(postGeo, wood);
    p.position.set(sx * (HALF + 0.125), BOX_H / 2, sz * (HALF + 0.125));
    p.castShadow = true;
    scene.add(p);
  });
  // Rim (doubles as danger line)
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xc08552, emissive: 0xff2d55, emissiveIntensity: 0, roughness: 0.4 });
  const rimGeoX = new THREE.BoxGeometry(BOX_W + 0.5, 0.12, 0.12);
  [[0, -1, 0], [0, 1, 0], [-1, 0, 1], [1, 0, 1]].forEach(([sx, sz, rot]) => {
    const r = new THREE.Mesh(rimGeoX, rimMat);
    r.position.set(sx * (HALF + 0.125), BOX_H, sz * (HALF + 0.125));
    if (rot) r.rotation.y = Math.PI / 2;
    scene.add(r);
  });

  // ---------- Fruit visuals ----------
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
  const rand = (a, b) => a + Math.random() * (b - a);

  function fruitTexture(level) {
    const W = 512, H = 256;
    const [c, g] = makeCanvas(W, H);
    const fill = (col) => { g.fillStyle = col; g.fillRect(0, 0, W, H); };
    const vgrad = (stops) => { const gr = g.createLinearGradient(0, 0, 0, H); stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
    const speckle = (n, col, size) => { g.fillStyle = col; for (let i = 0; i < n; i++) { g.beginPath(); g.arc(Math.random() * W, Math.random() * H, rand(size * 0.5, size), 0, 7); g.fill(); } };
    switch (level) {
      case 0: vgrad([[0, '#7a0a1c'], [0.4, '#d6203c'], [1, '#8e0c22']]); break;
      case 1: {
        vgrad([[0, '#d81e2a'], [0.6, '#f0403a'], [1, '#c4161f']]);
        for (let row = 0; row < 9; row++) for (let col = 0; col < 18; col++) {
          const x = (col + (row % 2) * 0.5) * (W / 18), y = 20 + row * (H - 30) / 9;
          g.fillStyle = '#ffe27a'; g.beginPath(); g.ellipse(x, y, 4, 6, 0, 0, 7); g.fill();
          g.fillStyle = 'rgba(120,0,0,0.35)'; g.beginPath(); g.ellipse(x, y + 4, 5, 3, 0, 0, 7); g.fill();
        }
        break;
      }
      case 2: vgrad([[0, '#4c1d95'], [0.5, '#7c3aed'], [1, '#3b0f80']]); speckle(160, 'rgba(220,210,255,0.12)', 10); break;
      case 3: fill('#fb8c1a'); speckle(1600, 'rgba(190,80,0,0.35)', 2.2); speckle(500, 'rgba(255,200,120,0.25)', 2); break;
      case 4: vgrad([[0, '#d9480f'], [0.5, '#f0630f'], [1, '#e8590c']]); speckle(200, 'rgba(255,170,80,0.18)', 6); break;
      case 5: {
        vgrad([[0, '#f6d365'], [0.18, '#e11d48'], [0.75, '#be123c'], [1, '#f3c56b']]);
        g.strokeStyle = 'rgba(255,220,120,0.25)'; g.lineWidth = 3;
        for (let i = 0; i < 70; i++) { const x = Math.random() * W; g.beginPath(); g.moveTo(x, rand(0, 40)); g.bezierCurveTo(x + rand(-10, 10), H * 0.4, x + rand(-10, 10), H * 0.6, x + rand(-6, 6), rand(H - 40, H)); g.stroke(); }
        speckle(120, 'rgba(255,240,180,0.4)', 2);
        break;
      }
      case 6: vgrad([[0, '#a3b83a'], [0.5, '#d9e36a'], [1, '#c8d455']]); speckle(500, 'rgba(120,90,30,0.4)', 2.2); break;
      case 7: {
        vgrad([[0, '#ffd59e'], [0.5, '#ffa8a0'], [1, '#ff7f7a']]);
        g.strokeStyle = 'rgba(200,60,70,0.35)'; g.lineWidth = 6; g.beginPath(); g.moveTo(W * 0.25, 0); g.bezierCurveTo(W * 0.22, H * 0.4, W * 0.28, H * 0.6, W * 0.25, H); g.stroke();
        speckle(300, 'rgba(255,255,255,0.08)', 8);
        break;
      }
      case 8: {
        fill('#e9a92a');
        const cols = 16, rows = 9, cw = W / cols, rh = H / rows;
        for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
          const x = (q + (r % 2) * 0.5) * cw, y = r * rh + rh / 2;
          const gr = g.createRadialGradient(x, y, 2, x, y, cw * 0.6);
          gr.addColorStop(0, '#ffd84d'); gr.addColorStop(0.6, '#e9a92a'); gr.addColorStop(1, '#8a5a12');
          g.fillStyle = gr; g.beginPath(); g.moveTo(x, y - rh / 2); g.lineTo(x + cw / 2, y); g.lineTo(x, y + rh / 2); g.lineTo(x - cw / 2, y); g.closePath(); g.fill();
          g.fillStyle = '#5a3a0a'; g.beginPath(); g.arc(x, y, 2.5, 0, 7); g.fill();
        }
        break;
      }
      case 9: {
        vgrad([[0, '#9fd46a'], [0.5, '#c6ec9a'], [1, '#93c95c']]);
        g.strokeStyle = 'rgba(245,250,225,0.7)'; g.lineWidth = 2.2;
        for (let i = 0; i < 260; i++) { let x = Math.random() * W, y = Math.random() * H; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 3; k++) { x += rand(-22, 22); y += rand(-22, 22); g.lineTo(x, y); } g.stroke(); }
        break;
      }
      case 10: {
        fill('#3fae4f');
        g.fillStyle = '#14532d';
        const stripes = 14;
        for (let s = 0; s < stripes; s++) {
          const cx = (s + 0.5) * W / stripes;
          g.beginPath(); g.moveTo(cx, 0);
          for (let y = 0; y <= H; y += 8) g.lineTo(cx - 9 - Math.sin(y * 0.09 + s) * 5 - (Math.random() * 3), y);
          for (let y = H; y >= 0; y -= 8) g.lineTo(cx + 9 + Math.sin(y * 0.11 + s * 2) * 5 + (Math.random() * 3), y);
          g.closePath(); g.fill();
        }
        speckle(200, 'rgba(160,230,150,0.12)', 6);
        break;
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  const sphereGeo = new THREE.SphereGeometry(1, 40, 28);
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f9a2f, roughness: 0.6, side: THREE.DoubleSide });
  const ROUGH = [0.25, 0.45, 0.3, 0.6, 0.4, 0.3, 0.55, 0.75, 0.7, 0.8, 0.45];
  const fruitMats = FRUITS.map((f, i) => new THREE.MeshStandardMaterial({ map: fruitTexture(i), roughness: ROUGH[i], metalness: 0 }));

  function leaf(size) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.quadraticCurveTo(size * 0.5, size * 0.45, 0, size);
    shape.quadraticCurveTo(-size * 0.5, size * 0.45, 0, 0);
    return new THREE.Mesh(new THREE.ShapeGeometry(shape), leafMat);
  }
  function addStem(group, len, thick) {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(thick * 0.7, thick, len, 6), stemMat);
    s.position.y = 1 + len / 2 - 0.05; s.rotation.z = 0.15;
    group.add(s);
    return s;
  }

  // Decorations are built in unit-radius space; whole group is scaled by fruit radius.
  function buildFruitMesh(level) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(sphereGeo, fruitMats[level]);
    body.castShadow = true; body.receiveShadow = true;
    g.add(body);
    switch (level) {
      case 0: { const s = addStem(g, 1.1, 0.06); s.rotation.z = 0.35; s.position.x = 0.18; const l = leaf(0.6); l.position.set(0.3, 1.5, 0); l.rotation.set(0.3, 0, -1.0); g.add(l); break; }
      case 1: case 4: {
        const n = level === 1 ? 6 : 4;
        for (let i = 0; i < n; i++) { const l = leaf(level === 1 ? 0.55 : 0.45); l.position.y = 0.97; l.rotation.set(-Math.PI / 2 + 0.35, i / n * Math.PI * 2, 0, 'YXZ'); g.add(l); }
        if (level === 4) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.12, 8), leafMat); c.position.y = 1.0; g.add(c); }
        break;
      }
      case 2: { const s = addStem(g, 0.35, 0.07); s.rotation.z = 0; break; }
      case 3: { const bump = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 12), fruitMats[3]); bump.position.y = 0.88; bump.castShadow = true; g.add(bump); addStem(g, 0.18, 0.05).position.y = 1.3; break; }
      case 5: case 6: case 7: { addStem(g, 0.3, 0.05); const l = leaf(0.55); l.position.set(0.05, 1.1, 0); l.rotation.set(0.2, 0.6, -1.1); g.add(l); break; }
      case 8: {
        for (let i = 0; i < 9; i++) {
          const cone = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.85 - (i % 3) * 0.15, 4), leafMat);
          const a = i / 9 * Math.PI * 2;
          cone.position.set(Math.cos(a) * 0.12, 1.3, Math.sin(a) * 0.12);
          cone.rotation.set(Math.sin(a) * 0.45, 0, -Math.cos(a) * 0.45);
          cone.castShadow = true;
          g.add(cone);
        }
        break;
      }
      case 9: { const s = addStem(g, 0.18, 0.06); s.rotation.z = 0; break; }
      case 10: { const s = addStem(g, 0.12, 0.05); s.rotation.z = 0; break; }
    }
    return g;
  }

  // ---------- Particles ----------
  const particleGeo = new THREE.SphereGeometry(1, 8, 6);
  const particleMats = FRUITS.map(f => new THREE.MeshBasicMaterial({ color: f.color, transparent: true }));
  const particles = [];
  function burst(pos, level, count) {
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(particleGeo, particleMats[level].clone());
      const s = rand(0.05, 0.12) * (1 + level * 0.12);
      m.scale.setScalar(s);
      m.position.copy(pos);
      const dir = new THREE.Vector3(rand(-1, 1), rand(-0.2, 1.2), rand(-1, 1)).normalize();
      particles.push({ m, v: dir.multiplyScalar(rand(3, 7) * (1 + level * 0.08)), life: rand(0.5, 0.9), max: 0.9, s });
      scene.add(m);
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); continue; }
      p.v.y -= GRAVITY * 0.6 * dt;
      p.m.position.addScaledVector(p.v, dt);
      p.m.material.opacity = Math.min(1, p.life / 0.4);
      p.m.scale.setScalar(p.s * (0.4 + 0.6 * p.life / p.max));
    }
  }

  // ---------- Game state ----------
  const fruits = [];
  let score = 0, best = 0, gameOver = false;
  let heldLevel = 0, nextLevel = 0, heldMesh = null;
  let aim = new THREE.Vector2(0, 0); // x, z
  let cooldown = 0, dangerTimer = 0, shake = 0;
  const seen = new Set();

  try { best = Number(AC && AC.getScore('suika3d')) || 0; } catch (e) {}

  const dropY = () => BOX_H + 1.0 + FRUITS[heldLevel].r;

  function randomSpawnLevel() {
    // Bias toward small fruits like the original.
    const w = [0.3, 0.27, 0.2, 0.14, 0.09];
    let x = Math.random();
    for (let i = 0; i <= SPAWN_MAX; i++) { if ((x -= w[i]) <= 0) return i; }
    return 0;
  }

  function createFruit(level, x, y, z) {
    const f = FRUITS[level];
    const mesh = buildFruitMesh(level);
    mesh.rotation.set(rand(-0.3, 0.3), rand(0, Math.PI * 2), rand(-0.3, 0.3));
    scene.add(mesh);
    const body = {
      level, mesh,
      pos: new THREE.Vector3(x, y, z),
      vel: new THREE.Vector3(),
      r: f.r, targetR: f.r, growT: 1,
      mass: f.r * f.r * f.r,
      age: 0, merged: false,
    };
    fruits.push(body);
    markSeen(level);
    return body;
  }

  function removeFruit(b) {
    scene.remove(b.mesh);
    const i = fruits.indexOf(b);
    if (i >= 0) fruits.splice(i, 1);
  }

  function setHeld(level) {
    if (heldMesh) scene.remove(heldMesh);
    heldLevel = level;
    heldMesh = buildFruitMesh(level);
    heldMesh.scale.setScalar(FRUITS[level].r);
    scene.add(heldMesh);
    clampAim();
  }

  function clampAim() {
    const lim = HALF - FRUITS[heldLevel].r - 0.01;
    aim.x = Math.max(-lim, Math.min(lim, aim.x));
    aim.y = Math.max(-lim, Math.min(lim, aim.y));
  }

  function drop() {
    if (gameOver || cooldown > 0 || !heldMesh) return;
    const b = createFruit(heldLevel, aim.x + rand(-0.01, 0.01), dropY(), aim.y + rand(-0.01, 0.01));
    b.mesh.quaternion.copy(heldMesh.quaternion);
    b.vel.y = -2;
    sfx('pop', 1 + (4 - heldLevel) * 0.1);
    cooldown = DROP_COOLDOWN;
    scene.remove(heldMesh); heldMesh = null;
    const lvl = nextLevel;
    nextLevel = randomSpawnLevel();
    updateNextUI();
    setTimeout(() => { if (!gameOver) setHeld(lvl); }, DROP_COOLDOWN * 1000 * 0.8);
  }

  function addScore(n, pos) {
    score += n;
    document.getElementById('score').textContent = score.toLocaleString();
    if (score > best) { best = score; document.getElementById('best').textContent = 'Best: ' + best.toLocaleString(); }
    if (pos) floatText('+' + n, pos);
  }

  function floatText(text, pos) {
    const v = pos.clone().project(camera);
    const el = document.createElement('div');
    el.className = 'float';
    el.textContent = text;
    el.style.left = ((v.x + 1) / 2 * window.innerWidth) + 'px';
    el.style.top = ((1 - v.y) / 2 * window.innerHeight) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  // ---------- Physics ----------
  const tmp = new THREE.Vector3(), nrm = new THREE.Vector3(), relV = new THREE.Vector3(), tang = new THREE.Vector3();
  const pendingMerges = [];

  function physicsStep(dt) {
    const h = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) {
      for (const b of fruits) {
        if (b.growT < 1) { b.growT = Math.min(1, b.growT + h / 0.18); b.r = b.startR + (b.targetR - b.startR) * easeOutBack(b.growT); }
        b.vel.y -= GRAVITY * h;
        b.vel.multiplyScalar(0.9995);
        b.pos.addScaledVector(b.vel, h);
        // Floor
        if (b.pos.y < b.r) {
          b.pos.y = b.r;
          if (b.vel.y < 0) b.vel.y = -b.vel.y * RESTITUTION;
          b.vel.x *= 0.985; b.vel.z *= 0.985;
        }
        // Walls (infinite height keeps fruit inside)
        const lim = HALF - Math.min(b.r, b.targetR);
        if (b.pos.x < -lim) { b.pos.x = -lim; if (b.vel.x < 0) b.vel.x = -b.vel.x * RESTITUTION; b.vel.y *= 0.99; b.vel.z *= 0.99; }
        if (b.pos.x > lim)  { b.pos.x = lim;  if (b.vel.x > 0) b.vel.x = -b.vel.x * RESTITUTION; b.vel.y *= 0.99; b.vel.z *= 0.99; }
        if (b.pos.z < -lim) { b.pos.z = -lim; if (b.vel.z < 0) b.vel.z = -b.vel.z * RESTITUTION; b.vel.y *= 0.99; b.vel.x *= 0.99; }
        if (b.pos.z > lim)  { b.pos.z = lim;  if (b.vel.z > 0) b.vel.z = -b.vel.z * RESTITUTION; b.vel.y *= 0.99; b.vel.x *= 0.99; }
      }
      // Sphere-sphere
      const n = fruits.length;
      for (let i = 0; i < n; i++) {
        const a = fruits[i];
        for (let j = i + 1; j < n; j++) {
          const b = fruits[j];
          tmp.subVectors(b.pos, a.pos);
          const rs = a.r + b.r;
          const d2 = tmp.lengthSq();
          if (d2 >= rs * rs) continue;
          let d = Math.sqrt(d2);
          if (d < 1e-6) { tmp.set(rand(-1, 1), 0.01, rand(-1, 1)); d = tmp.length(); }
          nrm.copy(tmp).divideScalar(d);
          // Merge check
          if (a.level === b.level && !a.merged && !b.merged) {
            a.merged = b.merged = true;
            pendingMerges.push([a, b]);
          }
          const pen = rs - d;
          const ia = 1 / a.mass, ib = 1 / b.mass, isum = ia + ib;
          a.pos.addScaledVector(nrm, -pen * ia / isum);
          b.pos.addScaledVector(nrm, pen * ib / isum);
          relV.subVectors(b.vel, a.vel);
          const vn = relV.dot(nrm);
          if (vn < 0) {
            const jn = -(1 + RESTITUTION) * vn / isum;
            a.vel.addScaledVector(nrm, -jn * ia);
            b.vel.addScaledVector(nrm, jn * ib);
            // Friction on tangential relative velocity
            tang.copy(relV).addScaledVector(nrm, -vn);
            const jt = 0.06 / isum;
            a.vel.addScaledVector(tang, jt * ia);
            b.vel.addScaledVector(tang, -jt * ib);
          }
        }
      }
    }
  }

  function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

  function processMerges() {
    while (pendingMerges.length) {
      const [a, b] = pendingMerges.shift();
      if (fruits.indexOf(a) < 0 || fruits.indexOf(b) < 0) continue;
      const mid = a.pos.clone().add(b.pos).multiplyScalar(0.5);
      const vel = a.vel.clone().add(b.vel).multiplyScalar(0.5);
      const level = a.level;
      removeFruit(a); removeFruit(b);
      burst(mid, level, 14 + level * 3);
      if (level >= MAX_LEVEL) {
        addScore(100, mid);
        sfx('powerup');
        shake = 0.6;
        continue;
      }
      const nb = createFruit(level + 1, mid.x, mid.y, mid.z);
      nb.vel.copy(vel).multiplyScalar(0.5);
      nb.vel.y += 1.5;
      nb.startR = FRUITS[level].r;
      nb.r = nb.startR;
      nb.growT = 0;
      nb.age = 2; // treat as settled for danger checks
      addScore(FRUITS[level + 1].score, mid);
      sfx('merge', level + 1);
      if (level + 1 >= 7) shake = Math.max(shake, 0.15 + (level - 6) * 0.08);
      pulseEvo(level + 1);
    }
    for (const f of fruits) f.merged = false;
  }

  // ---------- Visual sync ----------
  const up = new THREE.Vector3(0, 1, 0), axis = new THREE.Vector3(), qTmp = new THREE.Quaternion(), hv = new THREE.Vector3();
  function syncMeshes(dt) {
    for (const b of fruits) {
      b.age += dt;
      b.mesh.position.copy(b.pos);
      b.mesh.scale.setScalar(b.r);
      // Rolling: rotate around axis perpendicular to horizontal velocity
      hv.set(b.vel.x, 0, b.vel.z);
      const sp = hv.length();
      if (sp > 0.02) {
        axis.crossVectors(up, hv).normalize();
        qTmp.setFromAxisAngle(axis, sp * dt / b.r);
        b.mesh.quaternion.premultiply(qTmp);
      }
    }
  }

  // ---------- Aim guide ----------
  const guideMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.25, gapSize: 0.18, transparent: true, opacity: 0.7 });
  const guideGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, -1, 0)]);
  const guide = new THREE.Line(guideGeo, guideMat);
  scene.add(guide);
  const ghost = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.18 }));
  scene.add(ghost);
  const footRing = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
  footRing.rotation.x = -Math.PI / 2;
  scene.add(footRing);

  function landingHeight(x, z, r) {
    let y = r;
    for (const f of fruits) {
      const dx = f.pos.x - x, dz = f.pos.z - z, rs = f.r + r;
      const d2 = dx * dx + dz * dz;
      if (d2 < rs * rs) y = Math.max(y, f.pos.y + Math.sqrt(rs * rs - d2));
    }
    return y;
  }

  function updateGuide(t) {
    const visible = !!heldMesh && !gameOver;
    guide.visible = ghost.visible = footRing.visible = visible;
    if (!visible) return;
    const r = FRUITS[heldLevel].r;
    const top = dropY();
    heldMesh.position.set(aim.x, top + Math.sin(t * 3) * 0.06, aim.y);
    heldMesh.rotation.y += 0.01;
    const ly = landingHeight(aim.x, aim.y, r);
    const pos = guideGeo.attributes.position;
    pos.setXYZ(0, aim.x, top - r, aim.y);
    pos.setXYZ(1, aim.x, Math.max(0, ly - r), aim.y);
    pos.needsUpdate = true;
    guide.computeLineDistances();
    ghost.position.set(aim.x, ly, aim.y);
    ghost.scale.setScalar(r);
    footRing.position.set(aim.x, 0.01, aim.y);
    footRing.scale.setScalar(r);
  }

  // ---------- Camera ----------
  const cam = { theta: 0.6, phi: 0.55, dist: 25, targetTheta: 0.6 };
  const camTarget = new THREE.Vector3(0, 6.2, 0);
  function updateCamera(dt) {
    cam.theta += (cam.targetTheta - cam.theta) * Math.min(1, dt * 10);
    const aspect = window.innerWidth / window.innerHeight;
    const fit = aspect < 0.8 ? 1.0 + (0.8 - aspect) * 1.4 : 1;
    const d = cam.dist * fit;
    camera.position.set(
      camTarget.x + Math.sin(cam.theta) * Math.cos(cam.phi) * d,
      camTarget.y + Math.sin(cam.phi) * d,
      camTarget.z + Math.cos(cam.theta) * Math.cos(cam.phi) * d
    );
    if (shake > 0) {
      camera.position.x += rand(-1, 1) * shake * 0.4;
      camera.position.y += rand(-1, 1) * shake * 0.4;
      shake = Math.max(0, shake - dt * 1.5);
    }
    camera.lookAt(camTarget);
  }
  function rotateView(delta) { cam.targetTheta += delta; }

  // ---------- Input ----------
  const raycaster = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ndc = new THREE.Vector2(), hit = new THREE.Vector3();
  function aimAtScreen(cx, cy) {
    ndc.set(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    plane.constant = -dropY();
    if (raycaster.ray.intersectPlane(plane, hit)) { aim.set(hit.x, hit.z); clampAim(); }
  }

  const pointers = new Map();
  let gesture = null; // { multi, rotating, lastX, lastY, moved }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) gesture = { multi: false, rotating: e.button === 2, lastX: e.clientX, lastY: e.clientY };
    if (pointers.size >= 2 && gesture) { gesture.multi = true; gesture.rotating = true; gesture.lastX = avgX(); gesture.lastY = avgY(); }
    if (!gesture.rotating) aimAtScreen(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture && gesture.rotating) {
      const x = avgX(), y = avgY();
      cam.targetTheta -= (x - gesture.lastX) * 0.008;
      cam.phi = Math.max(0.2, Math.min(1.35, cam.phi + (y - gesture.lastY) * 0.005));
      gesture.lastX = x; gesture.lastY = y;
      return;
    }
    if (e.pointerType === 'mouse' || pointers.size === 1) aimAtScreen(e.clientX, e.clientY);
  });
  const endPointer = e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0 && gesture) {
      if (!gesture.rotating && !gesture.multi && e.type === 'pointerup') drop();
      gesture = null;
    } else if (gesture) { gesture.lastX = avgX(); gesture.lastY = avgY(); }
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  function avgX() { let s = 0; pointers.forEach(p => s += p.x); return s / Math.max(1, pointers.size); }
  function avgY() { let s = 0; pointers.forEach(p => s += p.y); return s / Math.max(1, pointers.size); }
  canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(14, Math.min(34, cam.dist + e.deltaY * 0.01)); }, { passive: false });

  const keys = new Set();
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); if (gameOver) restart(); else drop(); return; }
    if (k === 'q') rotateView(Math.PI / 4);
    if (k === 'e') rotateView(-Math.PI / 4);
    if (k === 'r') restart();
    if (k === 'm') toggleMute();
    keys.add(k);
    if (k.startsWith('arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  function keyboardAim(dt) {
    let fx = 0, fz = 0;
    if (keys.has('w') || keys.has('arrowup')) fz += 1;
    if (keys.has('s') || keys.has('arrowdown')) fz -= 1;
    if (keys.has('d') || keys.has('arrowright')) fx += 1;
    if (keys.has('a') || keys.has('arrowleft')) fx -= 1;
    if (!fx && !fz) return;
    // Move relative to camera orientation
    const fwdX = -Math.sin(cam.theta), fwdZ = -Math.cos(cam.theta);
    const rightX = Math.cos(cam.theta), rightZ = -Math.sin(cam.theta);
    const sp = 6 * dt;
    aim.x += (fwdX * fz + rightX * fx) * sp;
    aim.y += (fwdZ * fz + rightZ * fx) * sp;
    clampAim();
  }

  document.getElementById('btnRotL').addEventListener('click', () => rotateView(Math.PI / 4));
  document.getElementById('btnRotR').addEventListener('click', () => rotateView(-Math.PI / 4));
  document.getElementById('btnRestart').addEventListener('click', e => { e.currentTarget.blur(); restart(); });
  document.getElementById('btnAgain').addEventListener('click', restart);
  const muteBtn = document.getElementById('btnMute');
  function refreshMute() { muteBtn.textContent = AC && AC.isMuted() ? '🔇' : '🔊'; }
  function toggleMute() { if (AC) AC.toggleMute(); refreshMute(); }
  muteBtn.addEventListener('click', e => { e.currentTarget.blur(); toggleMute(); });
  refreshMute();

  // ---------- UI ----------
  const evoEl = document.getElementById('evo');
  FRUITS.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'f';
    const size = 18 + i * 2.4;
    el.style.width = el.style.height = size + 'px';
    el.style.fontSize = (size * 0.72) + 'px';
    el.textContent = f.emoji;
    el.title = f.name;
    evoEl.appendChild(el);
  });
  function markSeen(level) { if (!seen.has(level)) { seen.add(level); evoEl.children[level].classList.add('seen'); } }
  function pulseEvo(level) { const el = evoEl.children[level]; el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 250); }
  function updateNextUI() { const el = document.getElementById('nextFruit'); el.textContent = FRUITS[nextLevel].emoji; el.title = FRUITS[nextLevel].name; }

  // ---------- Game over ----------
  function checkDanger(dt) {
    let over = false;
    for (const b of fruits) {
      if (b.age > 1.2 && b.pos.y + b.r > BOX_H && b.vel.lengthSq() < 4) { over = true; break; }
    }
    dangerTimer = over ? dangerTimer + dt : Math.max(0, dangerTimer - dt * 2);
    const level = dangerTimer / DANGER_TIME;
    rimMat.emissiveIntensity = level > 0 ? 0.4 + 0.6 * Math.abs(Math.sin(performance.now() * 0.012)) * level * 2 : 0;
    document.getElementById('danger').classList.toggle('on', level > 0.15);
    if (dangerTimer >= DANGER_TIME) endGame();
  }

  function endGame() {
    if (gameOver) return;
    gameOver = true;
    sfx('gameOver');
    if (heldMesh) { scene.remove(heldMesh); heldMesh = null; }
    let prev = 0;
    try { prev = Number(AC && AC.getScore('suika3d')) || 0; } catch (e) {}
    if (score > prev && AC) AC.saveScore('suika3d', score);
    document.getElementById('finalScore').textContent = score.toLocaleString();
    document.getElementById('finalBest').textContent = score > prev ? '🏆 New best score!' : 'Best: ' + Math.max(prev, best).toLocaleString();
    document.getElementById('overlay').classList.add('show');
    document.getElementById('danger').classList.remove('on');
    rimMat.emissiveIntensity = 0.8;
  }

  function restart() {
    while (fruits.length) removeFruit(fruits[0]);
    pendingMerges.length = 0;
    score = 0; dangerTimer = 0; cooldown = 0; gameOver = false;
    document.getElementById('score').textContent = '0';
    document.getElementById('best').textContent = 'Best: ' + best.toLocaleString();
    document.getElementById('overlay').classList.remove('show');
    rimMat.emissiveIntensity = 0;
    nextLevel = randomSpawnLevel();
    setHeld(randomSpawnLevel());
    updateNextUI();
  }

  window.addEventListener('beforeunload', () => {
    // Persist best score even if the player leaves mid-game.
    try { const prev = Number(AC && AC.getScore('suika3d')) || 0; if (score > prev && AC) AC.saveScore('suika3d', score); } catch (e) {}
  });

  // ---------- Loop ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    if (!gameOver) {
      cooldown = Math.max(0, cooldown - dt);
      keyboardAim(dt);
      physicsStep(dt);
      processMerges();
      checkDanger(dt);
    }
    syncMeshes(dt);
    updateParticles(dt);
    updateCamera(dt);
    updateGuide(now / 1000);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  document.getElementById('best').textContent = 'Best: ' + best.toLocaleString();
  restart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
