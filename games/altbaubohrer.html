<script>
'use strict';
const AC = window.ArcadeCore || null;
const snd = (n, ...a) => { try { if (AC && AC[n]) AC[n](...a); } catch (e) {} };
const SAVE_KEY = 'altbaubohrer_save';
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
function mulberry32(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const isCoarse = matchMedia('(pointer:coarse)').matches;
const fmtT = m => { m = Math.floor(m); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const eur = v => Math.round(v).toLocaleString('de-DE') + ' €';

// ================= Spielstand =================
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') return Object.assign({ money: 0, up: {}, stars: [], done: [] }, s); } catch (e) {} return { money: 0, up: {}, stars: [], done: [] }; }
let save = loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const has = k => !!save.up[k];

// ================= Audio (eigene Dauertöne, Effekte teils via ArcadeCore) =================
let actx = null, noiseBuf = null, drillSnd = null;
const isMuted = () => !!(AC && AC.isMuted && AC.isMuted());
function ax() { if (isMuted()) return null; if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { actx = new C(); } catch (e) { return null; } } if (actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, dur, type = 'sine', g = 0.15, f2 = 0, delay = 0) {
  const c = ax(); if (!c) return;
  try { const t = c.currentTime + delay, o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + dur + 0.03); } catch (e) {}
}
function nz(dur, g = 0.2, freq = 800, q = 1, type = 'bandpass', delay = 0) {
  const c = ax(); if (!c) return;
  try {
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), v = c.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q; v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(v); v.connect(c.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  } catch (e) {}
}
function drillSound(on, rpm, freq, strain) {
  const c = on ? ax() : actx; if (!c) return;
  try {
    if (!drillSnd) {
      if (!on) return;
      const o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), v = c.createGain();
      o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.Q.value = 5; v.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(v); v.connect(c.destination); o.start(); o2.start(); drillSnd = { o, o2, f, v };
    }
    const t = c.currentTime, d = drillSnd, base = 70 + 240 * rpm - strain * 45;
    d.v.gain.setTargetAtTime(on && !isMuted() ? 0.045 + 0.04 * rpm : 0, t, 0.04);
    d.o.frequency.setTargetAtTime(base, t, 0.05); d.o2.frequency.setTargetAtTime(base * 1.502 + Math.random() * 6, t, 0.05);
    d.f.frequency.setTargetAtTime(freq * (0.5 + rpm), t, 0.05);
  } catch (e) {}
}

// ================= Materialien & Daten =================
const W = 4.2, H = 2.6, BIT_R = 0.004, DEPTH = 0.06;
const MAT = {
  fliese: { n: 'Fliese', sp: 0.006, band: [0, 0.4], heat: 1.3, col: '#dfe9ee', f: 1900 },
  putz:   { n: 'Putz', sp: 0.03, band: [0, 1], heat: 0.3, col: '#e8dcc4', f: 600 },
  ziegel: { n: 'Ziegel', sp: 0.014, band: [0.35, 0.8], heat: 0.7, col: '#c0583d', f: 800 },
  hohl:   { n: 'Hohlraum!', sp: 0.25, band: [0, 1], heat: 0.05, col: '#2a2440', f: 260 },
  daemm:  { n: 'Dämmwolle', sp: 0.14, band: [0, 1], heat: 0.05, col: '#e8cf5a', f: 240 },
  beton:  { n: 'Beton', sp: 0.0065, band: [0.65, 1], heat: 1.1, col: '#8d8f92', f: 1000 },
  stahl:  { n: 'BEWEHRUNG!', sp: 0, band: [0, 1], heat: 2, col: '#3c4652', f: 2600 },
  rigips: { n: 'Rigips', sp: 0.05, band: [0, 0.8], heat: 0.2, col: '#f2f0ea', f: 450 },
  holz:   { n: 'Holzsparren', sp: 0.02, band: [0.25, 0.7], heat: 0.5, col: '#a8743e', f: 480 },
  profil: { n: 'Metallständer', sp: 0.012, band: [0.2, 0.6], heat: 0.9, col: '#a9b0b8', f: 1700 },
};
// Halt in kg pro Dübel, je Material im Verankerungsbereich
const HOLD = {
  std:      { fliese: 10, putz: 4, ziegel: 30, hohl: 1, daemm: 1, beton: 45, stahl: 0, rigips: 3, holz: 35, profil: 20 },
  xxl:      { fliese: 12, putz: 5, ziegel: 50, hohl: 3, daemm: 1, beton: 70, stahl: 0, rigips: 4, holz: 40, profil: 22 },
  hohlraum: { fliese: 10, putz: 4, ziegel: 18, hohl: 26, daemm: 24, beton: 12, stahl: 0, rigips: 25, holz: 30, profil: 22 },
};

}
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  cam.dist = clamp(1.75 / tanH, 2.6, 5.6); camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode !== 'pause') { try { update(dt); if (demo) demo(dt); } catch (e) { console.error(e); } for (const k in PS) updPS(PS[k], dt); }
  placeCamera(dt); placeDrill();
  if (mode === 'play' || mode === 'plug') { if (!G.drilling) projectAimKeep(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function projectAimKeep() { /* Fadenkreuz bleibt an Bildschirmposition; Wandpunkt nachführen, wenn sich die Kamera bewegt */ if (cam.drillT > 0.01) aimFromScreen(aim.sx, aim.sy); }

// ================= Selbsttest (?selftest=1) & Demo (?demo=1&job=N&state=...) =================
function runSelfTest() {
  const out = []; let fails = 0;
  JOBS.forEach((job, i) => {
    const hd = genHidden(job);
    job.spots.forEach((sp, k) => { const s = findSafe(hd, job, sp); if (!s) { fails++; out.push(`✗ Job ${i + 1} Loch ${k + 1}: keine sichere Stelle`); } });
    const centerHits = job.spots.filter(sp => { for (let d = 0.001; d <= DEPTH; d += 0.002) if (dangerAt(hd, sp[0], sp[1], d)) return true; return false; }).length;
    out.push(`Job ${i + 1}: ${job.spots.length} Löcher ok, Mitte trifft Leitung: ${centerHits}`);
  });
  console.assert(fails === 0, 'Selbsttest fehlgeschlagen');
  const el = $('selftest'); el.style.display = 'block'; el.textContent = (fails ? 'SELBSTTEST FEHLER\n' : 'SELBSTTEST OK\n') + out.join('\n');
  console.log(el.textContent);
}
function setupDemo() {
  const ji = clamp((+Q.get('job') || 1) - 1, 0, JOBS.length - 1), state = Q.get('state') || 'knock';
  if (state === 'menu') { showTitle(); return; }
  if (state === 'shop') { save.money = Math.max(save.money, 300); showShop(-1); return; }
  if (state === 'brief') { showBrief(ji); return; }
  startJob(ji); const job = G.job; let t = 0;
  const safe = job.spots.map(sp => findSafe(G.hd, job, sp) || sp);
  const mkDone = () => safe.forEach((s, i) => { aim.x = s[0]; aim.y = s[1]; aim.on = true; startDrill(); const h = G.hole; h.depth = DEPTH; for (let k = 0; k < 60; k++) h.prof[k] = matAt(G.hd, job.layers, h.x, h.y, k / 1000); h.mats[matAt(G.hd, job.layers, h.x, h.y, 0.04)] = 0.045; G.drilling = false; finishHole(h); });
  if (state === 'knock') {
    G.finder = true; const pts = [[job.spots[0][0], job.spots[0][1]], [job.spots[1][0] + 0.1, job.spots[1][1] - 0.15], [job.spots[0][0] + 0.45, job.spots[0][1] + 0.1]];
    let n = 0; demo = dt => { t -= dt; if (t <= 0) { const p = pts[n++ % pts.length]; aim.x = p[0]; aim.y = p[1]; projectAim(); knock(p[0], p[1]); t = 0.45; } };
  } else if (state === 'drill') {
    aim.x = safe[0][0]; aim.y = safe[0][1]; aim.on = true; G.rpm = 0.7; G.demoFreeze = 0.032; startDrill(); G.hole.depth = 0.012; demo = dt => { G.tilt.x = 0.09; G.tilt.y = 0.04; };
  } else if (state === 'water' || state === 'spark') {
    const o = G.hd.objs.find(o => o.t === (state === 'water' ? 'pipe' : 'wire')); const p = o.curve.getPoint(0.5);
    aim.x = p.x; aim.y = p.y; aim.on = true; startDrill(); G.hole.depth = -p.z - 0.002; G.demoPlug = 1; projectAim();
  } else if (state === 'auto') { // spielt den Auftrag über den echten Bohr-Code durch
    demo = dt => {
      if (mode === 'play' && !G.drilling) {
        const i = job.spots.findIndex((s, k) => !G.holes.some(h => h.spot === k && h.done && !h.dead));
        if (i < 0) { openMount(); startLoad(has('hohlraum') && job.layers[0][1] === 'rigips' ? 'hohlraum' : has('xxl') ? 'xxl' : 'std'); return; }
        aim.x = safe[i][0]; aim.y = safe[i][1]; aim.on = true; startDrill();
      }
      if (G.drilling && G.hole) { const m = matAt(G.hd, job.layers, G.hole.x, G.hole.y, G.hole.depth + 0.0005); G.rpm = clamp((MAT[m].band[0] + MAT[m].band[1]) / 2, 0.1, 1); G.tilt.x *= 0.3; G.tilt.y *= 0.3; if (G.heat > 0.9) stopDrill(); }
    };
  } else if (state === 'load' || state === 'xray') {
    mkDone(); if (Q.has('weak')) G.holes.forEach(h => h.mats = { hohl: 0.045 }); openMount(); startLoad(has('xxl') ? 'xxl' : 'std');
  }
  // Vorspulen ohne Rendern, damit Screenshots echte Spielzustände zeigen
  const ff = +(Q.get('ff') || 0), step = 1 / 30;
  for (let i = 0; i < ff * 30; i++) { update(step); if (demo) demo(step); for (const k in PS) updPS(PS[k], step); placeCamera(step); }
}

resize();
if (Q.has('selftest')) runSelfTest();
if (Q.has('demo')) setupDemo(); else showTitle();
requestAnimationFrame(frame);
</script>
</body>
