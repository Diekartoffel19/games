<script>
'use strict';
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const KEY = 'gassichaos';
const SAVE_KEY = 'gassichaos_save';

// ================= Mathe =================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function mulberry32(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function angLerp(a, b, t) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; }

// echte Kreuzung zweier Strecken (Endpunkte zählen nicht)
function segCross(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1x = bx - ax, d1y = by - ay, d2x = dx - cx, d2y = dy - cy;
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-9) return false;
  const t = ((cx - ax) * d2y - (cy - ay) * d2x) / den;
  const u = ((cx - ax) * d1y - (cy - ay) * d1x) / den;
  return t > 0 && t < 1 && u > 0 && u < 1;
}
// Summe der Winkeländerung einer Polylinie um einen Punkt (2π = einmal ganz herumgewickelt)
function windingAngle(pts, cx, cy) {
  let tot = 0, prev = Math.atan2(pts[0].y - cy, pts[0].x - cx);
  for (let i = 1; i < pts.length; i++) {
    const a = Math.atan2(pts[i].y - cy, pts[i].x - cx);
    let d = a - prev;
    if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
    tot += d; prev = a;
  }
  return tot;
}

// ================= Leinen-Physik (Verlet) =================
const SEG_LEN = 12; // kurze Segmente, damit die Leine nicht durch dünne Laternen rutscht
function makeRope(x0, y0, x1, y1, len) {
  const n = Math.max(8, Math.ceil(len / SEG_LEN)), p = [];
  for (let i = 0; i <= n; i++) { const t = i / n, x = lerp(x0, x1, t), y = lerp(y0, y1, t); p.push({ x, y, px: x, py: y }); }
  return { p, len, obs: [], touching: false, cx: 0, cy: 0, ex: x1, ey: y1 };
}
// p[0] = Hand (fest), p[n] = Hund (wird bei Überlänge zurückgezogen). Ergebnis: r.cx/r.cy = Korrektur am Hund.
function solveRopes(ropes, knots, iters) {
  for (const r of ropes) {
    const P = r.p, n = P.length;
    for (let i = 1; i < n - 1; i++) {
      const q = P[i], vx = (q.x - q.px) * 0.86, vy = (q.y - q.py) * 0.86;
      q.px = q.x; q.py = q.y; q.x += vx; q.y += vy;
    }
    const e = P[n - 1]; r.ex = e.x; r.ey = e.y; e.px = e.x; e.py = e.y; r.touching = false;
  }
  for (let k = 0; k < iters; k++) {
    for (const r of ropes) {
      const P = r.p, n = P.length, seg = r.len / (n - 1);
      for (let i = 0; i < n - 1; i++) {
        const a = P[i], b = P[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
        if (d <= seg) continue; // Leine ist schlaff erlaubt, nur Dehnung wird korrigiert
        const wa = i === 0 ? 0 : 1, wb = i + 1 === n - 1 ? 0.4 : 1;
        const f = (d - seg) / d / (wa + wb);
        a.x += dx * f * wa; a.y += dy * f * wa; b.x -= dx * f * wb; b.y -= dy * f * wb;
      }
      for (let i = 1; i < n - 1; i++) {
        const q = P[i];
        for (const o of r.obs) {
          const dx = q.x - o.x, dy = q.y - o.y, rr = o.r + 2, d2 = dx * dx + dy * dy;
          if (d2 < rr * rr) {
            const d = Math.sqrt(d2) || 1e-3;
            q.x = o.x + dx / d * rr; q.y = o.y + dy / d * rr;
            if (o.ped) o.ped.ropeHit = r; else r.touching = true;
          }
        }
      }
    }
    for (const kn of knots) {
      const a = kn.ra.p[kn.ia], b = kn.rb.p[kn.ib];
      if (!a || !b) continue;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      a.x = b.x = mx; a.y = b.y = my;
    }
  }
  for (const r of ropes) { // harte Unzerreißbarkeit: von der Hand aus durchziehen
    const P = r.p, n = P.length, seg = r.len / (n - 1);
    for (let i = 1; i < n; i++) {
      const a = P[i - 1], b = P[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > seg) { b.x = a.x + dx / d * seg; b.y = a.y + dy / d * seg; }
    }
    r.cx = P[n - 1].x - r.ex; r.cy = P[n - 1].y - r.ey;
  }
}
function ropePathLen(r) { let s = 0; for (let i = 1; i < r.p.length; i++) s += dist(r.p[i - 1].x, r.p[i - 1].y, r.p[i].x, r.p[i].y); return s; }
// Wicklungen um Hindernisse, die die Leine berührt (0 = gerade vorbei, 1 = einmal komplett herum)
function ropeWraps(r) {
  let w = 0;
  for (const o of r.obs) {
    if (!o.wrap) continue;
    let near = false;
    for (const q of r.p) if ((q.x - o.x) ** 2 + (q.y - o.y) ** 2 < (o.r + 10) ** 2) { near = true; break; }
    if (!near) continue;
    const a = Math.abs(windingAngle(r.p, o.x, o.y));
    if (a > Math.PI * 1.15) w += Math.min(3, (a - Math.PI) / Math.PI);
  }
  return w;
}

// ================= Selbsttest (?selftest) =================
function runSelfTest() {
  const res = [];
  const t = (name, ok) => { res.push((ok ? 'OK   ' : 'FAIL ') + name); console.assert(ok, name); };
  t('segCross X', segCross(0, 0, 10, 10, 0, 10, 10, 0));
  t('segCross parallel', !segCross(0, 0, 10, 0, 0, 5, 10, 5));
  t('segCross getrennt', !segCross(0, 0, 1, 1, 5, 5, 6, 7));
  const circ = []; for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2; circ.push({ x: Math.cos(a) * 20, y: Math.sin(a) * 20 }); }
  t('winding Vollkreis ≈ 2π', Math.abs(windingAngle(circ, 0, 0) - Math.PI * 2) < 1e-6);
  t('winding gerade Linie < π', Math.abs(windingAngle([{ x: -50, y: 30 }, { x: 0, y: 30 }, { x: 50, y: 30 }], 0, 0)) < Math.PI);
  // 1) Überdehnung: Hund wird auf Leinenlänge zurückgezogen
  const r1 = makeRope(0, 0, 50, 0, 120); const e1 = r1.p[r1.p.length - 1]; e1.x = 400; e1.y = 0;
  solveRopes([r1], [], 12);
  t('Leine max. Länge (Hund-Hand)', dist(0, 0, e1.x, e1.y) <= 120 + 0.01);
  t('Leine max. Länge (Pfad)', ropePathLen(r1) <= 120 + 0.01);
  t('Korrektur zeigt zur Hand', r1.cx < -250);
  // 2) Um Laterne gewickelt: bleibt gewickelt, verkürzt die effektive Leine
  // Hand (60,0) → Laterne bei (100,0), 1,125 Umdrehungen herum, dann Schwanz nach unten; alle Abstände < Segmentlänge
  const post = { x: 100, y: 0, r: 7, wrap: true };
  const r2 = makeRope(0, 0, 0, 0, 240); const n2 = r2.p.length;
  for (let i = 0; i < n2; i++) {
    const q = r2.p[i]; let x, y;
    if (i <= 3) { x = 60 + i * 9.7; y = 0; }
    else if (i <= 12) { const a = Math.PI - ((i - 4) / 8) * Math.PI * 2.25; x = 100 + Math.cos(a) * 11; y = Math.sin(a) * 11; }
    else { const a = Math.PI - Math.PI * 2.25; x = 100 + Math.cos(a) * 11 - (i - 12) * 2; y = Math.sin(a) * 11 + (i - 12) * 9; }
    q.x = q.px = x; q.y = q.py = y;
  }
  r2.obs = [post];
  let dog = { x: r2.p[n2 - 1].x, y: r2.p[n2 - 1].y };
  for (let f = 0; f < 150; f++) {
    const dx = 100 - dog.x, dy = 400 - dog.y, d = Math.hypot(dx, dy) || 1; dog.x += dx / d * 3; dog.y += dy / d * 3;
    r2.p[0].x = 60; r2.p[0].y = 0; r2.p[n2 - 1].x = dog.x; r2.p[n2 - 1].y = dog.y;
    solveRopes([r2], [], 12); dog.x = r2.p[n2 - 1].x; dog.y = r2.p[n2 - 1].y;
  }
  t('Wicklung bleibt bestehen', Math.abs(windingAngle(r2.p, post.x, post.y)) > Math.PI);
  t('Wicklung erkannt', ropeWraps(r2) > 0.3);
  t('Wicklung kürzt Leine', dist(60, 0, dog.x, dog.y) < 240 - 30);
  t('Leine hat Laterne berührt', r2.touching);
  // 3) Knoten verbindet zwei Leinen
  const ra = makeRope(0, 0, 100, 100, 300), rb = makeRope(0, 0, 100, -100, 300);
  const kn = { ra, rb, ia: 6, ib: 6 };
  solveRopes([ra, rb], [kn], 12);
  t('Knoten hält Leinen zusammen', dist(ra.p[6].x, ra.p[6].y, rb.p[6].x, rb.p[6].y) < 2);
  const ok = res.filter(s => s.startsWith('OK')).length;
  const summary = `[selftest] gassichaos: ${ok}/${res.length} bestanden`;
  console.log(summary + '\n' + res.join('\n'));
  const el = document.getElementById('selftest'); el.style.display = 'block'; el.textContent = summary + '\n' + res.join('\n');
  return ok === res.length;
}

function loadSave() {
  const d = { money: 0, shift: 1, up: {}, best: 0, total: 0, stats: { dogs: 0, falls: 0, poops: 0 } };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') { Object.assign(d, s); d.stats = Object.assign({ dogs: 0, falls: 0, poops: 0 }, s.stats || {}); }
  } catch (e) {}

function collideBody(e, r) {
  for (const o of OBS) {
    if (!o.body) continue;
    const dx = e.x - o.x, dy = e.y - o.y, rr = o.r + r, d2 = dx * dx + dy * dy;
    if (d2 < rr * rr) { const d = Math.sqrt(d2) || 1e-3; e.x = o.x + dx / d * rr; e.y = o.y + dy / d * rr; }
  }
  for (const R of RECTS) {
    const nx = clamp(e.x, R.x, R.x + R.w), ny = clamp(e.y, R.y, R.y + R.h), dx = e.x - nx, dy = e.y - ny, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      if (d2 > 1e-6) { const d = Math.sqrt(d2); e.x = nx + dx / d * r; e.y = ny + dy / d * r; }
      else { const cy = R.y + R.h / 2; e.y = e.y < cy ? R.y - r : R.y + R.h + r; }
    }
  }
  e.x = clamp(e.x, r, W - r); e.y = clamp(e.y, r, H - r);
}

function tgtPos(t) { return t.kind === 'food' && t.ent === STAND ? { x: STAND.fx, y: STAND.fy } : t.ent; }

  for (const c of G.critters) if (c.state !== 'fly') consider(c.kind, c, c.x, c.y, 320);
  for (const f of G.foods) consider('food', f, f.x, f.y, 300);
  if (STAND.cd <= G.t) consider('food', STAND, STAND.fx, STAND.fy, 340);
  for (const p of G.peds) consider(p.kind === 'mail' ? 'mail' : p.kind === 'dogwalker' ? 'dog' : 'person', p, p.x, p.y, 220);

}

    if (t.ent === STAND) { STAND.cd = G.t + 20; say(STAND, pick(T.wurst), '#ffb4b4', 2.2, true); fine('Geklaute Bratwurst', 4, STAND.x, STAND.y - 30); }

function updateDog(d, dt) {

function updateCritters(dt) {
  for (let i = G.critters.length - 1; i >= 0; i--) {
    const c = G.critters[i]; c.life -= dt; c.bubT -= dt;
    let nd = null, ndd = 1e9;
    for (const d of G.dogs) if (d.state === 'leash') { const dd = dist(d.x, d.y, c.x, c.y); if (dd < ndd) { ndd = dd; nd = d; } }
    const pd = dist(player.x, player.y, c.x, c.y);
    if (c.kind === 'squirrel') {
      const dx = c.to.x - c.x, dy = c.to.y - c.y, dd = Math.hypot(dx, dy), s = ndd < 110 ? 270 : 170;
      if (ndd < 110) say(c, pick(['Tschiep!', 'Ätsch!', 'Zu langsam!']), '#fff', 1.3);
      if (dd < 10 || c.life < 0) { puff(c.x, c.y, 8, '#3b8a35', 60, 4, .6); G.critters.splice(i, 1); continue; }
      c.vx = dx / dd * s; c.vy = dy / dd * s; c.face = Math.atan2(dy, dx);
    } else if (c.kind === 'cat') {
      if (c.state === 'sit' && ndd < 150) { c.state = 'flee'; c.life = 2.5; say(c, pick(['FAUCH!', 'Miau?!', 'Pöbel!']), '#ffb4b4', 1.4, true); snd('playTone', 1300, 0.12, 'sawtooth', 0.04); }

      else if (c.state === 'sit') { c.vx = c.vy = 0; }
      if (c.life < 0) { G.critters.splice(i, 1); continue; }
    } else if (c.kind === 'pigeon') {
      if (c.state === 'peck') {
        c.t -= dt; if (c.t < 0) { c.t = rand(.5, 2); c.face = rand(0, 6); c.vx = Math.cos(c.face) * 20; c.vy = Math.sin(c.face) * 20; }

          if (!G.flapT || G.flapT < G.t) { G.flapT = G.t + .4; snd('playTone', 300, 0.08, 'triangle', 0.05); setTimeout(() => snd('playTone', 360, 0.06, 'triangle', 0.05), 70); }
        }

      if (c.life < 0) { G.critters.splice(i, 1); continue; }
    }
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.state !== 'fly' && c.kind !== 'squirrel') collideBody(c, 5);
    if (c.x < -50 || c.x > W + 50 || c.y < -50 || c.y > H + 50) G.critters.splice(i, 1);

}
function updatePeds(dt) {

  for (let i = G.peds.length - 1; i >= 0; i--) {
    const p = G.peds[i]; p.bubT -= dt; p.life -= dt; p.tripCd -= dt;
    if (p.life < 0 && !onScreen(p.x, p.y, 80)) { G.peds.splice(i, 1); continue; }

const view = { w: innerWidth, h: innerHeight, dpr: 1 };
function update(dt) {

  player.bubT -= dt; STAND.bubT -= dt; player.slow -= dt;
  for (const h of houses) h.bubT -= dt;
  G.evT -= dt; if (G.evT <= 0) { G.evT = rand(5, 10) * Math.max(0.45, 1 - 0.06 * (save.shift - 1)); spawnEvent(); }

  if (keys.KeyW || keys.ArrowUp) iy -= 1; if (keys.KeyS || keys.ArrowDown) iy += 1;
  if (joy && joy.moved) { const jx = (joy.x - joy.sx) / 55, jy = (joy.y - joy.sy) / 55; ix += jx; iy += jy; }
  const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }

  if (player.rag) updateRagdoll(dt);

    if (holding && im < 0.15) { G.untangle += dt / 1.1; player.face += dt * 9; if (G.untangle >= 1) { G.untangle = 0; doUntangle(); } }

    const sp = pSpeed() * (player.slow > 0 ? 0.6 : 1) * (G.slowMul || 1), k = 1 - Math.exp(-12 * dt);
    player.vx += (ix * sp - player.vx) * k; player.vy += (iy * sp - player.vy) * k;
    player.x += player.vx * dt; player.y += player.vy * dt; collideBody(player, 13);
    const ps = Math.hypot(player.vx, player.vy);
    if (ps > 10 && !holding) player.face = angLerp(player.face, Math.atan2(player.vy, player.vx), 1 - Math.exp(-12 * dt));
    player.walk += ps * dt * 0.1;

  }

    } else if (d.state === 'leash' && dh < 75 && !player.rag) {

        const tip = d.happy >= 80 ? Math.round(rand(3, 9)) : 0;
        G.pay.push({ dog: d, base: Math.round(base), tip });

        floater(h.door.x, h.door.y - 20, '+' + euro(base + tip), '#7bff6b'); snd('coin'); puff(h.door.x, h.door.y, 10, '#ffd23f', 90, 4, .8, 'star');

  ctx.fillStyle = '#5a3412'; ell(p.x, p.y + 2, 8, 5); ctx.fillStyle = '#6e4218'; ell(p.x, p.y - 2, 6, 4); ctx.fillStyle = '#7d4c1e'; ell(p.x, p.y - 5, 3.5, 3);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y - 22, 6, -Math.PI / 2, -Math.PI / 2 + (1 - p.t / p.max) * Math.PI * 2); ctx.stroke();
}
function drawFood(f) {
  ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText({ pommes: '🍟', doener: '🥙', brezel: '🥨' }[f.kind], f.x, f.y + 6);
}
function toScreen(x, y) { return { x: (x - cam.x) * cam.zoom + view.w / 2, y: (y - cam.y) * cam.zoom + view.h / 2 }; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawBubbles(ox, oy) {
  ctx.font = 'bold 14px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of G.bubbles) {
    const e = b.ent, ex = e.door ? e.door.x : e.x, ey = e.door ? e.door.y - 10 : (e === player && player.rag ? player.rag.pts[0].y : e.y);
    const ex2 = e === player && player.rag ? player.rag.pts[0].x : ex;
    const s = toScreen(ex2, ey); const a = Math.min(1, (b.max - b.t) * 4, b.t * 10);
    const pop = 1 + Math.max(0, .25 - b.t) * 1.6;
    const tw = ctx.measureText(b.txt).width + 16, th = 24, bx = s.x + ox, by = s.y + oy - 34 * pop;
    ctx.globalAlpha = a;
    ctx.fillStyle = b.col; rr(bx - tw / 2, by - th / 2, tw, th, 9); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5; ctx.stroke();

function render() {
  const { w, h, dpr } = view;

  ctx.fillStyle = '#3f7d3a'; ctx.fillRect(0, 0, w, h);
  if (!G) return;
  const sh = G.shake, ox = rand(-sh, sh), oy = rand(-sh, sh);
  ctx.setTransform(dpr * cam.zoom, 0, 0, dpr * cam.zoom, dpr * (w / 2 + ox) - dpr * cam.zoom * cam.x, dpr * (h / 2 + oy) - dpr * cam.zoom * cam.y);
  const hw = w / cam.zoom / 2 + 2, hh = h / cam.zoom / 2 + 2;
  const sx = clamp(cam.x - hw, 0, W), sy = clamp(cam.y - hh, 0, H), sw = clamp(cam.x + hw, 0, W) - sx, shh = clamp(cam.y + hh, 0, H) - sy;
  if (sw > 0 && shh > 0) ctx.drawImage(bg, sx, sy, sw, shh, sx, sy, sw, shh);
  // Ziel-Markierungen
  for (const d of G.dogs) {
    if (d.state === 'wait' || (d.state === 'leash' && d.need <= 0)) {
      const p = d.house.door, r = 26 + Math.sin(G.t * 5) * 4;
      ctx.strokeStyle = d.col; ctx.lineWidth = 4; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  for (const f of G.foods) drawFood(f);
  for (const p of G.poops) drawPoop(p);
  drawObstacles();
  for (const c of G.critters) if (c.state !== 'fly') drawCritter(c);
  for (const d of G.dogs) if (d.state !== 'leash') { drawDog(d); if (d.state === 'home') { ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('💤', d.x + 10, d.y - 12); } }
  for (const p of G.peds) drawPed(p);
  for (const d of G.dogs) if (d.state === 'leash') drawRope(d);
  for (const k of G.knots) { const a = k.ra.p[k.ia]; if (!a) continue; ctx.fillStyle = '#3a2a1a'; circ(a.x, a.y, 5.5); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(a.x - 3, a.y - 3); ctx.lineTo(a.x + 3, a.y + 3); ctx.moveTo(a.x + 3, a.y - 3); ctx.lineTo(a.x - 3, a.y + 3); ctx.stroke(); }
  for (const d of G.dogs) if (d.state === 'leash') {
    drawDog(d);
    const bw = 26, x = d.x - bw / 2, y = d.y - BREEDS[d.breed].size - 14;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - 1, y - 1, bw + 2, 6);
    ctx.fillStyle = d.need <= 0 ? '#7bff6b' : d.col; ctx.fillRect(x, y, bw * (1 - d.need / 100), 4);
  }
  drawPlayer();
  for (const c of G.critters) if (c.state === 'fly') drawCritter(c);
  // Partikel
  for (const q of G.parts) {
    const a = clamp(q.life / q.max, 0, 1); ctx.globalAlpha = a;
    if (q.kind === 'text') { ctx.font = 'bold 20px Trebuchet MS, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(q.txt, q.x + 1.5, q.y + 1.5); ctx.fillStyle = q.col; ctx.fillText(q.txt, q.x, q.y); }
    else if (q.kind === 'heart' || q.kind === 'star') { ctx.fillStyle = q.col; ctx.font = (q.size * 3.5 | 0) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(q.kind === 'heart' ? '♥' : '★', q.x, q.y); }
    else if (q.kind === 'feather') { ctx.fillStyle = q.col; ell(q.x, q.y, q.size * 1.6, q.size * .6, q.rot + q.life * 3); }
    else { ctx.fillStyle = q.col; circ(q.x, q.y, q.size * (0.5 + a * .5)); }

  ctx.globalAlpha = 1;
  // Bildschirm-Raum
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBubbles(ox, oy);
  drawArrows();
  drawHud();
  if (joy && joy.moved) {
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 55, 0, 7); ctx.stroke();
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, m = Math.min(55, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; circ(joy.sx + Math.cos(a) * m, joy.sy + Math.sin(a) * m, 22);

}
function drawArrows() {
  const { w, h } = view, m = 34;
  for (const d of G.dogs) {
    let icon = null; if (d.state === 'wait') icon = BREEDS[d.breed].emoji; else if (d.state === 'leash' && d.need <= 0) icon = '🏠';
    if (!icon) continue;
    const s = toScreen(d.house.door.x, d.house.door.y);
    if (s.x > m && s.x < w - m && s.y > 70 && s.y < h - m) { ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(icon, s.x, s.y - 34 + Math.sin(G.t * 4) * 3); continue; }
    const cx = w / 2, cy = h / 2, dx = s.x - cx, dy = s.y - cy;
    const t = Math.min((w / 2 - m) / Math.abs(dx || 1e-3), (h / 2 - m) / Math.abs(dy || 1e-3));
    const ax = cx + dx * t, ay = clamp(cy + dy * t, 80, h - m), a = Math.atan2(dy, dx);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.fillStyle = d.col; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-6, -12); ctx.lineTo(-6, 12); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(icon, ax - Math.cos(a) * 20, ay - Math.sin(a) * 20 + 6);
  }
}
function bar(x, y, w, h, v, col, bgc) { ctx.fillStyle = bgc || 'rgba(0,0,0,.55)'; rr(x, y, w, h, h / 2); ctx.fill(); if (v > 0) { ctx.fillStyle = col; rr(x, y, Math.max(h, w * clamp(v, 0, 1)), h, h / 2); ctx.fill(); } }
function hudText(t, x, y, size, col, align) { ctx.font = `bold ${size}px Trebuchet MS, sans-serif`; ctx.textAlign = align || 'left'; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(t, x + 1.5, y + 1.5); ctx.fillStyle = col || '#fff'; ctx.fillText(t, x, y); }
function drawHud() {
  const { w, h } = view, small = w < 600;
  // Uhr & Zeit
  const tm = 8 * 60 + (G.t / G.dur) * 240, hh = Math.floor(tm / 60), mm = Math.floor(tm % 60);
  const left = G.dur - G.t;
  hudText(`Schicht ${save.shift} · ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, w / 2, 24, small ? 15 : 19, left < 20 && G.t % 1 < .5 ? '#ff6b6b' : '#fff', 'center');
  bar(w / 2 - 90, 32, 180, 7, 1 - G.t / G.dur, left < 20 ? '#ff6b6b' : '#ffd23f');
  // Verheddert-O-Meter

  hudText('Verheddert-O-Meter', w / 2, 58, 12, '#fff', 'center');
  bar(w / 2 - 90, 63, 180, 11, tv, tc);
  const info = [];
  if (G.knots.length) info.push('🪢 ' + G.knots.length);
  if (G.wraps > 0.3) info.push('🌳 ' + G.wraps.toFixed(1));

  if (tv > .8 && G.t % .5 < .25) hudText('GLEICH LIEGST DU!', w / 2, iy + 18, 16, '#ff4d4d', 'center');

  } else {
    hudText(`💶 ${euro(save.money)}`, w - 64, 24, 18, '#ffd27a', 'right');
    hudText(todayTxt, w - 64, 44, 13, todayCol, 'right');

}

// ================= Overlays =================
const ov = document.getElementById('ov'), panel = document.getElementById('panel'), touchEl = document.getElementById('touch');
function showOv(html) { panel.innerHTML = html; ov.classList.remove('hide'); touchEl.style.display = 'none'; }
function hideOv() { ov.classList.add('hide'); touchEl.style.display = 'flex'; }
function setPause(v) { if (mode !== 'play') return; paused = v; if (v) joy = null; }
function showTitle() {
  mode = 'title';
  showOv(`<h1>🐕 Gassi-Chaos</h1><p><b>Hundesitter-Simulator</b></p>
  <ul class="how">
    <li>Lauf zu den markierten Häusern und hol die Hunde ab – bis zu <b>6 gleichzeitig</b> an der Leine.</li>
    <li>Jeder Hund hat einen <b>Gassi-Bedarf</b>. Ist er gestillt, bring ihn heim → 💶.</li>
    <li>Leinen sind echte Seile: Sie wickeln sich um Laternen, Bäume, Bänke und Passanten und <b>verknoten</b> sich miteinander.</li>
    <li>Zu verheddert = du <b>fliegst auf die Nase</b>. Um Pfosten zurücklaufen, <b>E halten</b> (Entwirren) oder Leckerli (<b>Q</b>).</li>
    <li>Haufen mit <b>Leertaste</b> / Antippen eintüten, sonst kassiert der Nachbar 25 €.</li>
  </ul>
  <p class="small">Steuerung: WASD/Pfeile · Touch/Maus: irgendwo ziehen = Joystick · P = Pause</p>
  <p>Schicht <b>${save.shift}</b> · Kontostand <b>${euro(save.money)}</b> · Rekord-Verdienst <b>${euro(save.best)}</b></p>
  <button id="go">${save.shift > 1 ? 'Weiter: Schicht ' + save.shift : 'Erste Schicht starten'}</button>
  ${save.shift > 1 ? '<button class="alt" id="shopB">🛒 Laden</button><button class="alt" id="reset">Spielstand löschen</button>' : ''}`);
  document.getElementById('go').onclick = showBrief;
  const r = document.getElementById('reset'); if (r) r.onclick = () => { if (confirm('Wirklich den ganzen Spielstand löschen?')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} save = loadSave(); showTitle(); } };
  const s = document.getElementById('shopB'); if (s) s.onclick = () => showShop(null);
}
function showBrief() {
  newShift(); mode = 'brief';
  const cards = G.dogs.map(d => `<div class="dogc" style="border-color:${d.col}"><b>${BREEDS[d.breed].emoji} ${d.name}</b><br>${BREEDS[d.breed].name} · bei ${d.house.owner}<br><i>${BREEDS[d.breed].quirk}</i></div>`).join('');
  showOv(`<h2>Schicht ${save.shift}: ${G.dogs.length} Hunde · 08:00–12:00</h2><div class="dogs">${cards}</div>
  <p class="small">Tüten: ${G.bags} · Leckerli: ${G.treats} · Leinenlänge: ${leashLen()}</p><button id="go">Los geht's! 🐾</button>`);
  document.getElementById('go').onclick = () => { hideOv(); mode = 'play'; paused = false; snd('powerup'); };
}
function endShift(allHome) {
  G.ended = true; mode = 'result'; joy = null;
  const earned = G.pay.reduce((s, p) => s + p.base, 0), tips = G.pay.reduce((s, p) => s + p.tip, 0);
  const bonus = allHome ? Math.round((G.dur - G.t) * 0.25) : 0;
  const lines = [];
  for (const d of G.dogs) {
    if (d.state === 'wait') G.fines.push({ reason: `${d.name} nie abgeholt`, amt: 15 });
    else if (d.state === 'leash') G.fines.push({ reason: `${d.name} nicht heimgebracht`, amt: 25 });
  }
  const fines = G.fines.reduce((s, f) => s + f.amt, 0);
  const net = earned + tips + bonus - fines;
  save.money += net; save.shift++; if (net > 0) save.total += net; save.stats.poops += G.bagged;
  if (net > save.best) { save.best = net; snd('powerup'); }
  try { AC && AC.saveScore(KEY, save.best); } catch (e) {}
  writeSave();
  net >= 0 ? snd('coin') : snd('gameOver');
  for (const p of G.pay) lines.push(`<div><span>${BREEDS[p.dog.breed].emoji} ${p.dog.name} (${p.dog.happy | 0}% glücklich)</span><span class="pos">+${euro(p.base)}${p.tip ? ' +' + p.tip + ' Tip' : ''}</span></div>`);
  if (bonus) lines.push(`<div><span>⏱️ Früher Feierabend</span><span class="pos">+${euro(bonus)}</span></div>`);

  for (const k in agg) lines.push(`<div><span>${agg[k].n > 1 ? agg[k].n + '× ' : ''}${k}</span><span class="neg">−${euro(agg[k].amt)}</span></div>`);

  const stats = `Stürze: ${G.falls} · Haufen eingetütet: ${G.bagged} · Knoten am Ende: ${G.knots.length}`;
  showShop(`<h2>${allHome ? 'Feierabend! 🎉' : 'Schichtende – 12:00 Uhr'}</h2><p>${rating}</p><div class="res">${lines.join('') || '<div><span>Nichts verdient.</span><span></span></div>'}
  <div class="tot"><span>Schicht gesamt</span><span class="${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : ''}${euro(net)}</span></div></div><p class="small">${stats}</p>`);
}
function showShop(head) {
  if (mode !== 'result') mode = 'shop';
  const rows = Object.entries(UPG).map(([k, u]) => {
    const lv = save.up[k], max = u.cost.length, c = u.cost[lv];
    return `<div class="up"><div class="ic">${u.icon}</div><div class="tx"><b>${u.name}</b> <span class="lv">${lv}/${max}</span><br>${u.desc}</div>
      ${lv >= max ? '<button disabled>MAX</button>' : `<button data-k="${k}" ${save.money < c ? 'disabled' : ''}>${euro(c)}</button>`}</div>`;
  }).join('');

// ================= Loop =================
function resize() {
  view.w = innerWidth; view.h = innerHeight; view.dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(view.w * view.dpr); cv.height = Math.round(view.h * view.dpr);
  cam.zoom = clamp(Math.min(view.w, view.h) / 620, 0.68, 1.3);
}
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (mode === 'play' && !paused && G) { try { update(dt); } catch (e) { console.error(e); paused = true; } }
  render();
  requestAnimationFrame(frame);
}
buildMap(); renderBg(); resize();
if (/[?&]selftest/.test(location.search)) runSelfTest();
showTitle();
requestAnimationFrame(frame);
</script>
