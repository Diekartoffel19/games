<script>
(() => {
'use strict';

// ---------- Setup ----------
const AC = window.ArcadeCore || null;
const snd = (name, ...args) => { try { if (AC && AC[name]) AC[name](...args); } catch (e) {} };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elFill = document.getElementById('pressureFill');
const elOverlay = document.getElementById('overlay');

const VW = 480, VH = 720;
const BX = 26, BW = 428, BR = BX + BW;      // box inner left / width / right
const TRAY_Y = 26, TRAY_H = 72;
const LINE_Y = TRAY_Y + TRAY_H;             // membrane between tray and box
const BOX_B = VH - 26;                      // box inner bottom
const BOX_AREA = BW * (BOX_B - LINE_Y);
const FILL_LIMIT = 0.74;                    // packed fraction that bursts the box
const BURST_TIME = 4;                       // seconds over the limit before game over
const H = 1 / 120;                          // physics step
const DRAG = 0.9;                           // velocity damping in the box (1/s)
const NSLOT = 6;
const SLOTS = Array.from({ length: NSLOT }, (_, i) => BX + BW * (i + 0.5) / NSLOT);
const TRAY_SCALE = 0.86;                    // blobs wait small in the tray
const CR = 0.84;                            // collision radius vs. drawn radius: blobs squish
const TAU = Math.PI * 2;
const RIM = 24;                             // rim points per blob (soft outline)
const RC = [], RS = [];
for (let i = 0; i < RIM; i++) { RC.push(Math.cos(i * TAU / RIM)); RS.push(Math.sin(i * TAU / RIM)); }
const BEST_KEY = 'bubblefusion';
const FONT = '"Arial Rounded MT Bold", "Varela Round", "Nunito", system-ui, sans-serif';
const WIN_LVL = 12;                         // 2048

const radiusOf = lvl => 22 * Math.pow(1.2, lvl - 1);
const valueOf = lvl => Math.pow(2, lvl - 1);

// Flat colour per level (value 1, 2, 4, ... 2048), then a cycle beyond.
const FLAT = ['#f25f5c', '#ffb84d', '#9be15d', '#3ec7e0', '#5b6cff', '#c45bff',
              '#ff5fa2', '#ff8a3d', '#41d6a0', '#ffe066', '#7ad3ff', '#ffffff'];
const BEYOND = ['#ff7676', '#b18cff', '#5ee6c4', '#ffd36e'];
const colorOf = lvl => lvl <= FLAT.length ? FLAT[lvl - 1] : BEYOND[(lvl - FLAT.length - 1) % BEYOND.length];

// ---------- State ----------
let bubbles, fx, slots, slotTimer, uid;
let score, best, maxLvl, combo, lastMerge, time, fill, fillShown, danger, over, won, launches, shake;
let grab = null, aim = null, lastTick = 0, lastBeat = 0, hudDirty = true;

function readBest() {
  let v = null;
  try { v = AC ? AC.getScore(BEST_KEY) : localStorage.getItem(BEST_KEY); } catch (e) {}
  return Number(v) || 0;
}
function writeBest(v) {
  try { if (AC) AC.saveScore(BEST_KEY, v); else localStorage.setItem(BEST_KEY, v); } catch (e) {}
}

function makeBubble(lvl, x, y, state) {
  const b = {
    id: ++uid, lvl, x, y, vx: 0, vy: 0,
    r: radiusOf(lvl),
    rs: 1, rsv: 0, ts: 1,     // radius scale spring and its target
    state,                    // 'tray' | 'enter' | 'box'
    t: 0, cd: 0, slot: -1,
    seed: Math.random() * TAU,
    rim: new Float32Array(RIM), rimV: new Float32Array(RIM),
    tgt: new Float32Array(RIM), cap: new Float32Array(RIM), lump: new Float32Array(RIM),
    contacts: [],
    dead: false
  };
  // Each blob gets its own slightly irregular resting shape.
  const k1 = 2 + (Math.random() * 2 | 0), k2 = 3 + (Math.random() * 3 | 0);
  const p1 = Math.random() * TAU, p2 = Math.random() * TAU;
  const a1 = 0.03 + Math.random() * 0.04, a2 = 0.02 + Math.random() * 0.03;
  for (let i = 0; i < RIM; i++) {
    const th = i * TAU / RIM;
    b.lump[i] = a1 * Math.sin(k1 * th + p1) + a2 * Math.sin(k2 * th + p2);
  }
  return b;
}

function rollLevel() {
  const top = Math.max(3, Math.min(5, maxLvl - 3));
  let total = 0;
  for (let l = 1; l <= top; l++) total += Math.pow(0.55, l - 1);
  let pick = Math.random() * total;
  for (let l = 1; l <= top; l++) {
    pick -= Math.pow(0.55, l - 1);
    if (pick <= 0) return l;
  }
  return 1;
}

function spawnTray(s) {
  const b = makeBubble(rollLevel(), SLOTS[s], TRAY_Y + TRAY_H / 2, 'tray');
  b.slot = s;
  b.ts = TRAY_SCALE;
  b.rs = 0.05;
  b.rsv = 3;
  slots[s] = b;
  bubbles.push(b);
  ripple(b, 70);
}

function reset() {
  bubbles = []; fx = []; slots = new Array(NSLOT).fill(null); slotTimer = new Array(NSLOT).fill(0); uid = 0;
  score = 0; maxLvl = 1; combo = 0; lastMerge = -9; time = 0;
  fill = 0; fillShown = 0; danger = 0; over = false; won = false; launches = 0; shake = 0;
  grab = null; aim = null;
  best = readBest();
  for (let s = 0; s < NSLOT; s++) spawnTray(s);
  elOverlay.classList.remove('show');
  hudDirty = true;
}

// ---------- Soft rim ----------
// Squash along an axis (mode-2 wobble), used for impacts.
function poke(b, ang, amt) {
  for (let i = 0; i < RIM; i++) b.rimV[i] -= amt * Math.cos(2 * (i * TAU / RIM - ang));
}
// Random multi-lobe ripple, used for pops and merges.
function ripple(b, amt) {
  const ph = Math.random() * TAU, lobes = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < RIM; i++) b.rimV[i] += amt * Math.sin(lobes * i * TAU / RIM + ph);
}
const physR = b => b.r * Math.min(b.rs, b.ts) * CR;
const visR = b => b.r * b.rs;

function updateRim(b, dt) {
  const vr = visR(b), cap = b.cap, tgt = b.tgt, rim = b.rim, rv = b.rimV;
  // Each contact is a plane: the outline may not cross it, so blobs flatten into faces.
  for (let i = 0; i < RIM; i++) cap[i] = Infinity;
  for (let k = 0; k < b.contacts.length; k += 3) {
    const ca = b.contacts[k], sa = b.contacts[k + 1], p = b.contacts[k + 2];
    for (let i = 0; i < RIM; i++) {
      const cs = RC[i] * ca + RS[i] * sa;
      if (cs > 0.05) {
        const l = p / cs - vr;
        if (l < cap[i]) cap[i] = l;
      }
    }
  }
  let dent = 0, free = 0;
  for (let i = 0; i < RIM; i++) {
    if (cap[i] < -0.7 * vr) cap[i] = -0.7 * vr;
    if (cap[i] < 0) dent -= cap[i]; else free++;
  }
  // Displaced liquid bulges out wherever the blob is still free.
  const bulge = free ? Math.min(vr * 0.3, dent / free * 0.8) : 0;
  for (let i = 0; i < RIM; i++) tgt[i] = Math.min(b.lump[i] * vr + bulge, cap[i]);

  const lim = vr * 0.4;
  for (let i = 0; i < RIM; i++) {
    const a = rim[(i + RIM - 1) % RIM], c = rim[(i + 1) % RIM];
    rv[i] += (520 * (tgt[i] - rim[i]) + 200 * (a + c - 2 * rim[i]) - 12 * rv[i]) * dt;
  }
  for (let i = 0; i < RIM; i++) {
    rim[i] += rv[i] * dt;
    if (rim[i] > lim) { rim[i] = lim; rv[i] = 0; }
    else if (rim[i] < -0.75 * vr) { rim[i] = -0.75 * vr; rv[i] = 0; }
  }
}

// ---------- Effects ----------
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (0.35 + Math.random() * 0.65);
    fx.push({ k: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.45 + Math.random() * 0.45, size: 3 + Math.random() * 4, color });
  }
}
function ring(x, y, r0, r1, color) { fx.push({ k: 'r', x, y, r0, r1, life: 0, max: 0.4, color }); }
function floatText(x, y, str, color, size) { fx.push({ k: 't', x, y, str, life: 0, max: 0.95, color, size }); }

function bounceTick(speed) {
  if (speed < 130 || time - lastTick < 0.07) return;
  lastTick = time;
  snd('playTone', 140 + Math.random() * 60, 0.05, 'sine', Math.min(0.06, speed / 9000));
}

// ---------- Merge ----------
function merge(a, b, born) {
  a.dead = b.dead = true;
  const lvl = a.lvl + 1;
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  const n = makeBubble(lvl, x, y, y > LINE_Y ? 'box' : 'enter');
  n.vx = (a.vx + b.vx) / 2;
  n.vy = (a.vy + b.vy) / 2;
  n.rs = a.r / n.r;
  n.rsv = 2.4;
  n.cd = 0.13;                 // short pause so chains play out one beat at a time
  ripple(n, 120);
  born.push(n);

  combo = (time - lastMerge < 1.1) ? combo + 1 : 1;
  lastMerge = time;
  const pts = valueOf(lvl) * combo;
  score += pts;
  hudDirty = true;

  const col = colorOf(lvl), old = colorOf(a.lvl);
  fx.push({ k: 'g', x: a.x, y: a.y, tx: x, ty: y, r: visR(a), life: 0, max: 0.13, color: old });
  fx.push({ k: 'g', x: b.x, y: b.y, tx: x, ty: y, r: visR(b), life: 0, max: 0.13, color: old });
  ring(x, y, n.r * 0.7, n.r * 2.1, col);
  burst(x, y, col, 8 + lvl * 2, 130 + lvl * 20);
  floatText(x, y - n.r * 0.3, '+' + pts, '#ffffff', 16 + Math.min(14, lvl * 1.3));
  if (combo > 1) floatText(x, y - n.r * 0.3 - 26, 'x' + combo + ' combo', '#ffe066', 15 + Math.min(10, combo * 2));
  if (lvl >= 5) shake = Math.max(shake, Math.min(11, lvl * 0.85));

  // Shockwave: nudge the neighbours outward.
  const range = n.r * 2.4;
  for (const o of bubbles) {
    if (o.dead || o.state === 'tray') continue;
    const dx = o.x - x, dy = o.y - y, d = Math.hypot(dx, dy) || 1;
    if (d < range + o.r) {
      const f = (1 - d / (range + o.r)) * (80 + lvl * 22) * Math.min(1, (n.r * n.r) / (o.r * o.r));
      o.vx += dx / d * f;
      o.vy += dy / d * f;
      poke(o, Math.atan2(-dy, -dx), f * 0.5);
    }
  }

  snd('merge', lvl + combo - 2);
  if (lvl > maxLvl) {
    maxLvl = lvl;
    if (lvl >= 6) floatText(x, y + n.r * 0.3 + 24, 'NEW ' + valueOf(lvl) + '!', col, 22);
    if (lvl === WIN_LVL && !won) {
      won = true;
      snd('powerup');
      floatText(VW / 2, VH / 2, '2048!', '#ffe066', 70);
      for (let i = 0; i < 8; i++) burst(BX + Math.random() * BW, LINE_Y + Math.random() * (BOX_B - LINE_Y), FLAT[i], 14, 320);
      shake = 16;
    }
  }
}

// ---------- Physics ----------
function wall(b, pen, nx, ny) {
  // Soft wall: push back part of the penetration, reflect the inbound velocity.
  const corr = Math.min(pen * 0.6, 7);
  b.x += nx * corr;
  b.y += ny * corr;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    b.vx -= 1.45 * vn * nx;
    b.vy -= 1.45 * vn * ny;
    if (vn < -60) {
      poke(b, Math.atan2(-ny, -nx), Math.min(240, -vn * 0.45));
      bounceTick(-vn);
    }
  }
}

function step(dt) {
  time += dt;

  for (let s = 0; s < NSLOT; s++) {
    if (!slots[s]) {
      slotTimer[s] -= dt;
      if (slotTimer[s] <= 0) { spawnTray(s); snd('playTone', 520 + Math.random() * 120, 0.05, 'sine', 0.035); }
    }
  }

  const dragBox = Math.exp(-DRAG * dt), dragTray = Math.exp(-6 * dt);
  for (const b of bubbles) {
    b.t += dt;
    if (b.cd > 0) b.cd -= dt;
    b.rsv += (200 * (b.ts - b.rs) - 14 * b.rsv) * dt;
    b.rs += b.rsv * dt;
    if (b.rs < 0.03) b.rs = 0.03;
    if (b.state === 'tray') {
      // Floats around its slot on a soft spring.
      let hx = SLOTS[b.slot] + Math.sin(time * 0.9 + b.seed) * 4;
      let hy = TRAY_Y + TRAY_H / 2 + Math.cos(time * 1.15 + b.seed * 2) * 3;
      if (grab === b && aim && aim.valid) { hx -= aim.nx * aim.pow * 12; hy -= aim.ny * aim.pow * 8; }
      b.vx += (hx - b.x) * 45 * dt;
      b.vy += (hy - b.y) * 45 * dt;
      b.vx *= dragTray; b.vy *= dragTray;
    } else {
      // Zero gravity: only drag and a faint ambient current.
      b.vx += Math.sin(time * 0.31 + b.y * 0.012 + b.seed) * 5 * dt;
      b.vy += Math.cos(time * 0.27 + b.x * 0.012 + b.seed) * 5 * dt;
      if (b.state === 'enter' && b.vy < 140) b.vy += 620 * dt;   // membrane pulls it in
      b.vx *= dragBox; b.vy *= dragBox;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }

  const born = [];
  const n = bubbles.length;
  for (let it = 0; it < 2; it++) {
    const rec = it === 1;
    if (rec) for (const b of bubbles) b.contacts.length = 0;
    for (let i = 0; i < n; i++) {
      const a = bubbles[i];
      if (a.dead) continue;
      const ca = physR(a), va = visR(a), aTray = a.state === 'tray';
      for (let j = i + 1; j < n; j++) {
        const b = bubbles[j];
        if (b.dead || (b.state === 'tray') !== aTray) continue;
        const cb = physR(b), vb = visR(b);
        const R = ca + cb, V = va + vb, lim = V * 1.02;
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dx > lim || dx < -lim || dy > lim || dy < -lim) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= lim * lim) continue;
        const d = Math.sqrt(d2) || 0.01;
        const nx = dx / d, ny = dy / d;
        if (!aTray && a.lvl === b.lvl && a.cd <= 0 && b.cd <= 0 && d < V * 0.97) { merge(a, b, born); break; }
        if (d < R) {
          const ma = ca * ca, mb = cb * cb, inv = 1 / (ma + mb);
          const corr = (R - d) * 0.4;
          a.x -= nx * corr * mb * inv; a.y -= ny * corr * mb * inv;
          b.x += nx * corr * ma * inv; b.y += ny * corr * ma * inv;
          const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (vn < 0) {
            const jimp = -1.25 * vn / (1 / ma + 1 / mb);
            a.vx -= jimp / ma * nx; a.vy -= jimp / ma * ny;
            b.vx += jimp / mb * nx; b.vy += jimp / mb * ny;
            if (vn < -60) {
              const ang = Math.atan2(ny, nx), amt = Math.min(240, -vn * 0.4);
              poke(a, ang, amt * mb * inv * 2);
              poke(b, ang, amt * ma * inv * 2);
              bounceTick(-vn);
            }
          }
        }
        if (rec) {
          const pa = d * va / V;
          a.contacts.push(nx, ny, pa);
          b.contacts.push(-nx, -ny, d - pa);
        }
      }
    }
    // Walls: collide with the physics radius, flatten the drawn outline against them.
    for (const b of bubbles) {
      if (b.dead) continue;
      const r = physR(b);
      const top = b.state === 'box' ? LINE_Y : TRAY_Y;
      const bottom = b.state === 'tray' ? LINE_Y : BOX_B;
      if (b.x - r < BX) wall(b, BX - (b.x - r), 1, 0);
      if (b.x + r > BR) wall(b, b.x + r - BR, -1, 0);
      if (b.y - r < top) wall(b, top - (b.y - r), 0, 1);
      if (b.y + r > bottom) wall(b, b.y + r - bottom, 0, -1);
      if (rec) {
        const m = visR(b) * 1.02;
        if (b.x - BX < m) b.contacts.push(-1, 0, b.x - BX);
        if (BR - b.x < m) b.contacts.push(1, 0, BR - b.x);
        if (b.y - top < m) b.contacts.push(0, -1, b.y - top);
        if (bottom - b.y < m) b.contacts.push(0, 1, bottom - b.y);
      }
    }
  }

  if (born.length) {
    bubbles = bubbles.filter(b => !b.dead);
    for (const nb of born) bubbles.push(nb);
  }

  let area = 0;
  for (const b of bubbles) {
    if (b.state === 'enter' && (b.y - physR(b) >= LINE_Y || (b.t > 1.4 && b.y > LINE_Y))) b.state = 'box';
    if (b.state !== 'tray') area += Math.PI * b.r * b.r;
    updateRim(b, dt);
  }
  fill = area / BOX_AREA;

  if (fill > FILL_LIMIT) {
    danger += dt;
    if (time - lastBeat > 0.5) { lastBeat = time; snd('playTone', 96, 0.14, 'sine', 0.14); }
    if (danger >= BURST_TIME) gameOver();
  } else if (danger > 0) {
    danger = Math.max(0, danger - dt * 2);
  }
}

function stepFx(dt) {
  for (const f of fx) {
    f.life += dt;
    if (f.k === 'p') {
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= Math.exp(-2.4 * dt); f.vy *= Math.exp(-2.4 * dt);
    } else if (f.k === 't') {
      f.y -= 34 * dt;
    }
  }
  fx = fx.filter(f => f.life < f.max);
  if (fx.length > 500) fx.splice(0, fx.length - 500);
  shake *= Math.exp(-9 * dt);
  fillShown += (fill - fillShown) * Math.min(1, dt * 8);
}

function gameOver() {
  if (over) return;
  over = true;
  grab = null; aim = null;
  canvas.classList.remove('grabbing');
  if (score > best) { best = score; writeBest(best); }
  for (const b of bubbles) if (b.state !== 'tray') burst(b.x, b.y, colorOf(b.lvl), 5, 260);
  shake = 18;
  snd('gameOver');
  document.getElementById('ovScore').textContent = score;
  document.getElementById('ovBest').textContent = best;
  document.getElementById('ovTop').textContent = valueOf(maxLvl);
  elOverlay.classList.add('show');
  hudDirty = true;
}

// ---------- Input ----------
function toLocal(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}

function pickTray(p) {
  let pick = null, bestD = Infinity;
  for (const b of slots) {
    if (!b || b.rs < 0.5) continue;
    // In the tray: closest blob. Below it: the blob above the pointer.
    const d = p.y < LINE_Y + 16 ? Math.hypot(p.x - b.x, p.y - b.y) : Math.abs(p.x - b.x);
    if (d < bestD) { bestD = d; pick = b; }
  }
  return pick;
}

function updateAim(p) {
  const dx = p.x - aim.sx, dy = p.y - aim.sy;
  const len = Math.hypot(dx, dy);
  aim.valid = len > 14 && dy > len * 0.12;
  aim.pow = Math.max(0, Math.min(1, (len - 14) / 170));
  if (len > 0.01) { aim.nx = dx / len; aim.ny = dy / len; }
  aim.speed = 190 + aim.pow * 1150;
}

canvas.addEventListener('pointerdown', e => {
  if (over || grab) return;
  const p = toLocal(e);
  const b = pickTray(p);
  if (!b) return;
  e.preventDefault();
  grab = b;
  aim = { id: e.pointerId, sx: p.x, sy: p.y, nx: 0, ny: 1, pow: 0, speed: 0, valid: false };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  canvas.classList.add('grabbing');
  poke(b, Math.PI / 2, 50);
});

canvas.addEventListener('pointermove', e => {
  if (!grab || !aim || e.pointerId !== aim.id) return;
  updateAim(toLocal(e));
});

function release(e, fire) {
  if (!grab || !aim || e.pointerId !== aim.id) return;
  if (fire) updateAim(toLocal(e));
  const b = grab;
  if (fire && aim.valid && !over && b.state === 'tray') {
    b.state = 'enter';
    b.t = 0;
    b.ts = 1;                  // grows to full size on its way in
    b.vx = aim.nx * aim.speed;
    b.vy = aim.ny * aim.speed;
    slots[b.slot] = null;
    slotTimer[b.slot] = 0.38;
    b.slot = -1;
    poke(b, Math.atan2(aim.ny, aim.nx), 120 + aim.pow * 160);
    burst(b.x, b.y, colorOf(b.lvl), 4 + (aim.pow * 8 | 0), 80 + aim.pow * 160);
    snd('pop', 0.75 + aim.pow * 0.7);
    launches++;
  }
  grab = null; aim = null;
  canvas.classList.remove('grabbing');
}
canvas.addEventListener('pointerup', e => release(e, true));
canvas.addEventListener('pointercancel', e => release(e, false));
canvas.addEventListener('contextmenu', e => e.preventDefault());

const muteBtn = document.getElementById('muteBtn');
function syncMute() { muteBtn.textContent = AC && AC.isMuted() ? '🔇' : '🔊'; }
function toggleMute() { if (AC) AC.toggleMute(); syncMute(); }
muteBtn.addEventListener('click', toggleMute);
document.getElementById('restartBtn').addEventListener('click', reset);
document.getElementById('againBtn').addEventListener('click', reset);
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});

// ---------- Rendering ----------
function drawHud() {
  if (hudDirty) {
    hudDirty = false;
    elScore.textContent = score;
    elBest.textContent = Math.max(best, score);
  }
  const f = Math.min(1, fillShown / FILL_LIMIT);
  elFill.style.width = (f * 100).toFixed(1) + '%';
  elFill.style.background = f > 0.97 ? '#f25f5c' : f > 0.8 ? '#ff8a3d' : f > 0.6 ? '#ffb84d' : '#8a8a8a';
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const PX = new Float32Array(RIM), PY = new Float32Array(RIM);
function drawBubble(b) {
  const vr = visR(b);
  if (vr < 1.5) return;
  for (let i = 0; i < RIM; i++) {
    const rr = Math.max(vr * 0.25, vr + b.rim[i]);
    PX[i] = b.x + RC[i] * rr;
    PY[i] = b.y + RS[i] * rr;
  }
  ctx.beginPath();
  ctx.moveTo((PX[RIM - 1] + PX[0]) / 2, (PY[RIM - 1] + PY[0]) / 2);
  for (let i = 0; i < RIM; i++) {
    const j = (i + 1) % RIM;
    ctx.quadraticCurveTo(PX[i], PY[i], (PX[i] + PX[j]) / 2, (PY[i] + PY[j]) / 2);
  }
  ctx.closePath();
  ctx.fillStyle = colorOf(b.lvl);
  ctx.fill();

  const label = String(valueOf(b.lvl));
  const fs = vr * (label.length === 1 ? 0.8 : label.length === 2 ? 0.66 : label.length === 3 ? 0.5 : 0.4);
  if (fs >= 6) {
    ctx.font = `900 ${fs.toFixed(1)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#121212';
    ctx.fillText(label, b.x, b.y + fs * 0.06);
  }
}

function drawAim() {
  const b = grab;
  if (!b || !aim || b.state !== 'tray') return;
  const col = colorOf(b.lvl);
  // Power ring
  const rr = visR(b) + 8;
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, TAU); ctx.stroke();
  if (!aim.valid) return;
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(b.x, b.y, rr, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0.03, aim.pow)); ctx.stroke();

  // Predicted path: straight flight with wall bounces, stops at the first blob.
  const r = b.r * CR;
  let x = b.x, y = b.y, dx = aim.nx, dy = aim.ny;
  const total = Math.min(1100, aim.speed / DRAG * 0.8);
  const stepLen = 7;
  let hit = null;
  ctx.fillStyle = col;
  for (let s = 0; s < total; s += stepLen) {
    x += dx * stepLen; y += dy * stepLen;
    if (x - r < BX) { x = BX + r; dx = -dx; }
    else if (x + r > BR) { x = BR - r; dx = -dx; }
    if (y + r > BOX_B) { y = BOX_B - r; dy = -dy; }
    else if (y - r < TRAY_Y) { y = TRAY_Y + r; dy = -dy; }
    for (const o of bubbles) {
      if (o.state === 'tray' || o.dead) continue;
      const hr = r + physR(o);
      if ((o.x - x) * (o.x - x) + (o.y - y) * (o.y - y) < hr * hr) { hit = o; break; }
    }
    if (hit) break;
    if ((s / stepLen | 0) % 3 === 0) {
      ctx.globalAlpha = 0.85 * (1 - s / total) + 0.1;
      ctx.beginPath(); ctx.arc(x, y, 2.5 + aim.pow * 2, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.setLineDash([6, 6]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = hit && hit.lvl === b.lvl ? '#ffffff' : 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(x, y, b.r, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawFx() {
  for (const f of fx) {
    const t = f.life / f.max;
    if (f.k === 'p') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.size * (1 - t * 0.6), 0, TAU); ctx.fill();
    } else if (f.k === 'r') {
      const e = 1 - (1 - t) * (1 - t);
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * e, 0, TAU); ctx.stroke();
    } else if (f.k === 'g') {
      ctx.globalAlpha = 0.8 * (1 - t);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x + (f.tx - f.x) * t, f.y + (f.ty - f.y) * t, f.r * (1 - t * 0.35), 0, TAU); ctx.fill();
    } else if (f.k === 't') {
      const pop = t < 0.15 ? 0.6 + t / 0.15 * 0.5 : 1.1 - Math.min(0.1, (t - 0.15) * 0.5);
      ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
      ctx.font = `900 ${(f.size * pop).toFixed(1)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.strokeText(f.str, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.str, f.x, f.y);
    }
  }
  ctx.globalAlpha = 1;
}

function frameColor() {
  if (fill <= FILL_LIMIT || over) return '#4d4d4d';
  const k = 0.5 + 0.5 * Math.sin(time * 14);
  const r = 77 + (220 - 77) * k, g = 77 + (70 - 77) * k, b = 77 + (80 - 77) * k;
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function draw() {
  ctx.setTransform(scalePx, 0, 0, scalePx, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // Black interior
  roundRect(BX, TRAY_Y, BW, BOX_B - TRAY_Y, 12);
  ctx.fillStyle = '#000';
  ctx.fill();

  ctx.save();
  ctx.clip();
  // Membrane between tray and box
  ctx.setLineDash([2, 10]);
  ctx.lineDashOffset = -time * 12;
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.moveTo(BX, LINE_Y); ctx.lineTo(BR, LINE_Y); ctx.stroke();
  ctx.setLineDash([]);

  const hot = Math.min(1, danger / BURST_TIME);
  if (hot > 0) {
    ctx.fillStyle = `rgba(242,95,92,${0.14 * hot})`;
    ctx.fillRect(BX, LINE_Y, BW, BOX_B - LINE_Y);
  }

  for (const b of bubbles) if (b.state !== 'tray') drawBubble(b);
  for (const b of bubbles) if (b.state === 'tray' && b !== grab) drawBubble(b);
  ctx.restore();

  // Thick grey frame on top hides blob edges pressed into the walls.
  const fc = frameColor();
  roundRect(BX - 9, TRAY_Y - 9, BW + 18, BOX_B - TRAY_Y + 18, 21);
  ctx.lineWidth = 18;
  ctx.strokeStyle = fc;
  ctx.stroke();
  ctx.fillStyle = fc;
  ctx.fillRect(BX, LINE_Y - 3, 12, 6);
  ctx.fillRect(BR - 12, LINE_Y - 3, 12, 6);

  drawAim();
  if (grab && grab.state === 'tray') drawBubble(grab);
  drawFx();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (fill > FILL_LIMIT && !over) {
    ctx.font = `900 150px ${FONT}`;
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillText(String(Math.max(1, Math.ceil(BURST_TIME - danger))), VW / 2, (LINE_Y + BOX_B) / 2);
    ctx.font = `900 18px ${FONT}`;
    ctx.fillStyle = 'rgba(255,200,200,0.9)';
    ctx.fillText('OVERPRESSURE — MERGE NOW', VW / 2, (LINE_Y + BOX_B) / 2 + 92);
  }

  if (launches < 2 && !over) {
    const a = 0.55 + 0.25 * Math.sin(time * 3);
    ctx.font = `900 18px ${FONT}`;
    ctx.fillStyle = `rgba(200,200,200,${a})`;
    ctx.fillText('Drag a blob downward and let go', VW / 2, LINE_Y + 160);
    ctx.font = `700 14px ${FONT}`;
    ctx.fillStyle = `rgba(150,150,150,${a})`;
    ctx.fillText('Longer drag = more force · equal numbers fuse', VW / 2, LINE_Y + 186);
  }
  ctx.restore();
}

// ---------- Layout & loop ----------
let scalePx = 1;
function fit() {
  const iw = window.innerWidth || VW, ih = window.innerHeight || VH;
  const narrow = iw < 720;
  const availW = narrow ? iw - 16 : iw - 2 * 210;
  const availH = ih - 16 - (narrow ? 66 : 0);
  const w = Math.max(220, Math.min(availW, availH * VW / VH));
  const h = w * VH / VW;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  scalePx = canvas.width / VW;
}
window.addEventListener('resize', fit);

let lastT = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  if (!over) {
    acc += dt;
    while (acc >= H) { step(H); acc -= H; if (over) break; }
  }
  stepFx(dt);
  drawHud();
  draw();
  requestAnimationFrame(frame);
}

reset();
fit();
syncMute();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
