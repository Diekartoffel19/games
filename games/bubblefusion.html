<script>
(() => {
'use strict';

// ---------- Setup ----------
const AC = window.ArcadeCore || null;
const snd = (name, ...args) => { try { if (AC && AC[name]) AC[name](...args); } catch (e) {} };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elFill = document.getElementById('pressureFill');
const elOverlay = document.getElementById('overlay');

const VW = 480, VH = 720;
// Container inner geometry matching Sobosuba reference
const BX_TOP = 30, BR_TOP = 450;            // upper inner walls (around spawn queue)
const BX = 38, BR = 442, BW = BR - BX;      // main chamber inner walls
const WALL_STEP_Y = 132;                    // where thick side walls begin
const TOP_Y = 30;                           // underside of top bar
const TRAY_Y = 66;                          // center Y of the top waiting queue
const RELEASE_Y = 114;                      // below this Y a launched blob is in the chamber
const BOX_B = 690;                          // inner flat bottom floor
const CHAMFER = 44;                         // 45-degree beveled bottom corners
const SENSOR_LX = 158, SENSOR_RX = 322, SENSOR_Y = 31; // two white top overflow sensors
const DANGER_Y = 152;                       // blobs stacked above this trigger top sensors
const BURST_TIME = 3.6;                     // seconds of sensor contact before game over

const H = 1 / 120;                          // physics timestep
const GRAV = 190;                           // gentle downward gravity ("leichte Anziehungskraft")
const SAME_PULL = 155;                      // gentle attraction between nearby equal numbers
const SAME_RANGE = 34;                      // surface distance within which equal numbers attract
const DRAG = 1.45;                          // viscous damping in chamber
const CR = 0.76;                            // deep liquid squish core factor
const SKIN_GAP = 3.8;                       // separation gap between touching liquid skins
const MIN_QUEUE = 4;                        // always keep at least 4 blobs in the top queue
const MAX_QUEUE = 5;                        // max 5 blobs in the top queue
const TAU = Math.PI * 2;
const RIM = 40;                             // high-res smooth spline points around liquid perimeter
const RC = new Float32Array(RIM), RS = new Float32Array(RIM);
const C2 = new Float32Array(RIM), S2 = new Float32Array(RIM);
for (let i = 0; i < RIM; i++) {
  const th = i * TAU / RIM;
  RC[i] = Math.cos(th);
  RS[i] = Math.sin(th);
  C2[i] = Math.cos(2 * th);
  S2[i] = Math.sin(2 * th);
}
const BEST_KEY = 'bubblefusion';
const WIN_LVL = 12;                         // 2048

const radiusOf = lvl => 18 * Math.pow(1.236, lvl - 1);
const valueOf = lvl => Math.pow(2, lvl - 1);

// Sobosuba colour palette with rich liquid shading pairs (base, highlight, shadow)
const PALETTE = [
  { base: '#e03131', hi: '#ff7070', sh: '#a81919' }, // 1   - red
  { base: '#e3c736', hi: '#fff078', sh: '#ad9214' }, // 2   - yellow
  { base: '#54e32e', hi: '#99ff7a', sh: '#2ea312' }, // 4   - lime green
  { base: '#36e0a4', hi: '#82ffd2', sh: '#18a372' }, // 8   - mint turquoise
  { base: '#3074eb', hi: '#78adff', sh: '#1748a6' }, // 16  - blue
  { base: '#8c32eb', hi: '#c282ff', sh: '#5815a3' }, // 32  - purple
  { base: '#e63cb0', hi: '#ff8adc', sh: '#a31977' }, // 64  - pink
  { base: '#e06728', hi: '#ffa56e', sh: '#9e3e0e' }, // 128 - orange
  { base: '#f5fa96', hi: '#ffffff', sh: '#c1c754' }, // 256 - cream yellow
  { base: '#4ce0ff', hi: '#a6f1ff', sh: '#1ba0bd' }, // 512 - cyan
  { base: '#ff9f40', hi: '#ffd094', sh: '#bd6511' }, // 1024 - amber
  { base: '#ffffff', hi: '#ffffff', sh: '#c7d2fe' }  // 2048 - pure white
];
const styleOf = lvl => PALETTE[(lvl - 1) % PALETTE.length];
const colorOf = lvl => styleOf(lvl).base;

// ---------- State ----------
let bubbles, trayRow, fx, spawnTimer, uid;
let score, best, maxLvl, combo, lastMerge, time, danger, sensorL, sensorR, over, won, launches, shake;
let grab = null, aim = null, lastTick = 0, lastBeat = 0, hudDirty = true;

function readBest() {
  let v = null;
  try { v = AC ? AC.getScore(BEST_KEY) : localStorage.getItem(BEST_KEY); } catch (e) {}
  return Number(v) || 0;
}
function writeBest(v) {
  try { if (AC) AC.saveScore(BEST_KEY, v); else localStorage.setItem(BEST_KEY, v); } catch (e) {}
}

// ---------- Liquid Jelly Soft-Body Construction ----------
function trayScaleOf(lvl) {
  const r = radiusOf(lvl);
  return Math.min(0.90, 31 / r);
}

function makeBubble(lvl, x, y, state, initQx = 0) {
  const r = radiusOf(lvl);
  // qx > 0 means wider horizontally, qx < 0 means taller vertically
  let restQx = initQx;
  if (state === 'tray') {
    if (lvl >= 4) restQx = 0.34;
    else if (lvl === 3) restQx = -0.07;
    else if (lvl === 2) restQx = 0.09;
    else restQx = 0.03;
  }
  const ts = state === 'tray' ? trayScaleOf(lvl) : 1.0;

  const b = {
    id: ++uid,
    lvl,
    x, y,
    vx: 0, vy: 0,
    pvx: 0, pvy: 0,             // previous velocity for inertial liquid sloshing
    r,
    rs: state === 'tray' ? ts * 0.4 : 0.72,
    rsv: 0,
    ts,
    // 2D Quadrupole Jelly Oscillator: (qx, qy) = 2-lobe elliptical squash & diagonal shear
    qx: restQx,
    qy: 0,
    qvx: 0,
    qvy: 0,
    restQx,
    fxQx: 0, fxQy: 0,           // external squeeze forces on the quadrupole
    state,                      // 'tray' | 'enter' | 'box'
    t: 0,
    cd: 0,
    seed: Math.random() * TAU,
    rim: new Float32Array(RIM),
    rimV: new Float32Array(RIM),
    tgt: new Float32Array(RIM),
    cap: new Float32Array(RIM),
    lump: new Float32Array(RIM),
    px: new Float32Array(RIM),
    py: new Float32Array(RIM),
    cx: x, cy: y,
    contacts: [],
    dead: false
  };

  // Gentle, smooth organic rest contour (no sharp dents or glitchy spikes)
  const p1 = Math.random() * TAU, p2 = Math.random() * TAU;
  const a1 = 0.025 + Math.random() * 0.02;
  const a2 = 0.018 + Math.random() * 0.015;
  for (let i = 0; i < RIM; i++) {
    const th = i * TAU / RIM;
    b.lump[i] = a1 * Math.cos(2 * th + p1) + a2 * Math.sin(3 * th + p2);
  }
  return b;
}

// Excite both whole-body quadrupole jiggle and traveling surface capillary waves!
function poke(b, ang, amt) {
  const c2 = Math.cos(2 * ang), s2 = Math.sin(2 * ang);
  b.qvx -= c2 * amt * 0.014;
  b.qvy -= s2 * amt * 0.014;
  for (let i = 0; i < RIM; i++) {
    const da = i * TAU / RIM - ang;
    b.rimV[i] -= amt * (0.65 * Math.cos(2 * da) + 0.35 * Math.cos(3 * da));
  }
}

function ripple(b, amt) {
  const ph = Math.random() * TAU;
  b.qvx += (Math.random() - 0.5) * amt * 0.03;
  b.qvy += (Math.random() - 0.5) * amt * 0.03;
  for (let i = 0; i < RIM; i++) {
    const th = i * TAU / RIM;
    b.rimV[i] += amt * (0.6 * Math.sin(3 * th + ph) + 0.4 * Math.cos(4 * th - ph));
  }
}

const visR = b => b.r * b.rs;
// Directional radius at unit vector (nx, ny) accounting for quadrupole deformation (qx, qy)
function dirRadius(b, nx, ny) {
  const base = b.r * Math.min(b.rs, b.ts);
  const c2 = nx * nx - ny * ny;
  const s2 = 2 * nx * ny;
  const stretch = Math.max(0.56, Math.min(1.58, 1 + b.qx * c2 + b.qy * s2));
  return base * stretch;
}
const rxOf = b => dirRadius(b, 1, 0);
const ryOf = b => dirRadius(b, 0, 1);

function rollLevel(avoid1 = -1) {
  const weights = [0.40, 0.30, 0.18, 0.12];
  for (let tries = 0; tries < 8; tries++) {
    let r = Math.random(), acc = 0, pick = 1;
    for (let i = 0; i < weights.length; i++) {
      acc += weights[i];
      if (r <= acc) { pick = i + 1; break; }
    }
    if (pick !== avoid1 || tries === 7) return pick;
  }
  return 1;
}

function spawnIntoTray() {
  if (trayRow.length >= MAX_QUEUE) return;
  const last = trayRow.length > 0 ? trayRow[trayRow.length - 1] : null;
  const lvl = rollLevel(last ? last.lvl : -1);
  const startX = last ? Math.min(BR_TOP - 22, last.x + rxOf(last) + radiusOf(lvl)) : VW / 2;
  const b = makeBubble(lvl, startX, TRAY_Y, 'tray');
  ripple(b, 75);
  trayRow.push(b);
  bubbles.push(b);
}

function layoutTrayInitial() {
  let totalW = 0;
  const widths = trayRow.map(b => {
    b.rs = b.ts;
    const w = rxOf(b) * 2;
    totalW += w + 3;
    return w;
  });
  totalW -= 3;
  let curX = (VW - totalW) * 0.5;
  for (let i = 0; i < trayRow.length; i++) {
    const b = trayRow[i];
    b.x = curX + widths[i] * 0.5;
    b.y = TRAY_Y;
    curX += widths[i] + 3;
  }
}

function reset() {
  bubbles = [];
  trayRow = [];
  fx = [];
  spawnTimer = 0.2;
  uid = 0;
  score = 0; maxLvl = 1; combo = 0; lastMerge = -9; time = 0;
  danger = 0; sensorL = false; sensorR = false;
  over = false; won = false; launches = 0; shake = 0;
  grab = null; aim = null;
  best = readBest();
  const initialQueue = [2, 4, 1, 3, 1];
  for (let s = 0; s < MAX_QUEUE; s++) {
    const b = makeBubble(initialQueue[s], VW / 2, TRAY_Y, 'tray');
    trayRow.push(b);
    bubbles.push(b);
  }
  layoutTrayInitial();
  elOverlay.classList.remove('show');
  hudDirty = true;
}

// ---------- Liquid Rim & Quadrupole Jelly Solver ----------
function updateRim(b, dt) {
  const vr = visR(b);
  const cap = b.cap, tgt = b.tgt, rim = b.rim, rv = b.rimV;

  // 1. Update 2D Quadrupole Jelly Oscillator (underdamped spring + contact squeeze)
  const targetQx = (b.state === 'tray' ? b.restQx : 0) + Math.max(-0.44, Math.min(0.44, b.fxQx * 0.28));
  const targetQy = Math.max(-0.38, Math.min(0.38, b.fxQy * 0.28));
  // Low damping (3.6) + lively spring (42) = continuous multi-bounce whole-body jelly jiggle!
  b.qvx += (42 * (targetQx - b.qx) - 3.6 * b.qvx) * dt;
  b.qvy += (42 * (targetQy - b.qy) - 3.6 * b.qvy) * dt;
  b.qx += b.qvx * dt;
  b.qy += b.qvy * dt;
  const qMag = Math.hypot(b.qx, b.qy);
  if (qMag > 0.46) {
    b.qx = (b.qx / qMag) * 0.46;
    b.qy = (b.qy / qMag) * 0.46;
  }

  // 2. Inertial liquid sloshing from center acceleration + ambient liquid breathing
  const ax = (b.vx - b.pvx) / Math.max(dt, 0.001);
  const ay = (b.vy - b.pvy) / Math.max(dt, 0.001);
  b.pvx = b.vx;
  b.pvy = b.vy;
  const accMag = Math.min(900, Math.hypot(ax, ay));
  if (accMag > 12) {
    const accAng = Math.atan2(ay, ax);
    b.qvx -= Math.cos(2 * accAng) * accMag * 0.004 * dt;
    b.qvy -= Math.sin(2 * accAng) * accMag * 0.004 * dt;
    for (let i = 0; i < RIM; i++) {
      const da = i * TAU / RIM - accAng;
      rv[i] -= accMag * 0.11 * Math.cos(2 * da) * dt;
    }
  }

  for (let i = 0; i < RIM; i++) cap[i] = Infinity;

  // 3. Contact constraints: walls & curved neighbor pockets
  const cl = b.contacts;
  for (let k = 0; k < cl.length; k += 4) {
    const type = cl[k];
    const c1 = cl[k + 1], c2 = cl[k + 2], c3 = cl[k + 3];
    if (type === 0) {
      for (let i = 0; i < RIM; i++) {
        const dirX = RC[i], dirY = RS[i];
        const cs = dirX * c1 + dirY * c2;
        if (cs > 0.06) {
          const maxDist = c3 / cs;
          const stretch = Math.max(0.56, 1 + b.qx * C2[i] + b.qy * S2[i]);
          const baseDist = vr * stretch;
          const delta = maxDist - baseDist;
          if (delta < cap[i]) cap[i] = delta;
        }
      }
    } else {
      const rEff2 = c3 * c3;
      for (let i = 0; i < RIM; i++) {
        const dirX = RC[i], dirY = RS[i];
        const proj = c1 * dirX + c2 * dirY;
        if (proj > 0) {
          const perp2 = (c1 * c1 + c2 * c2) - proj * proj;
          if (perp2 < rEff2) {
            const maxDist = proj - Math.sqrt(rEff2 - perp2);
            const stretch = Math.max(0.56, 1 + b.qx * C2[i] + b.qy * S2[i]);
            const baseDist = vr * stretch;
            const delta = maxDist - baseDist;
            if (delta < cap[i]) cap[i] = delta;
          }
        }
      }
    }
  }

  let dent = 0, free = 0;
  for (let i = 0; i < RIM; i++) {
    if (cap[i] < -0.62 * vr) cap[i] = -0.62 * vr;
    if (cap[i] < 0) dent -= cap[i];
    else free++;
  }
  const bulge = free ? Math.min(vr * 0.42, (dent / free) * 0.92) : 0;
  for (let i = 0; i < RIM; i++) {
    const breath = Math.sin(time * 2.8 + i * TAU / RIM * 3 + b.seed) * vr * 0.012;
    tgt[i] = Math.min(b.lump[i] * vr + breath + bulge, cap[i]);
  }

  // Smooth surface-tension shoulders so liquid flows smoothly around contacts
  for (let pass = 0; pass < 3; pass++) {
    let prev = tgt[RIM - 1];
    const first = tgt[0];
    for (let i = 0; i < RIM; i++) {
      const next = (i + 1 === RIM) ? first : tgt[i + 1];
      const cur = tgt[i];
      tgt[i] = cur * 0.52 + (prev + next) * 0.24;
      prev = cur;
    }
  }

  // 4. Traveling surface capillary wave equation (low damping = 3.8, high wave speed = 740 -> super jiggly liquid!)
  const lim = vr * 0.55;
  for (let i = 0; i < RIM; i++) {
    const a = rim[(i + RIM - 1) % RIM], c = rim[(i + 1) % RIM];
    rv[i] += (155 * (tgt[i] - rim[i]) + 740 * (a + c - 2 * rim[i]) - 3.8 * rv[i]) * dt;
  }

  let sx = 0, sy = 0;
  for (let i = 0; i < RIM; i++) {
    rim[i] += rv[i] * dt;
    // Never cross a neighbor/wall contact boundary so bubbles never overlap!
    const hardCap = cap[i] + 0.8;
    if (rim[i] > hardCap) {
      rim[i] = hardCap;
      if (rv[i] > 0) rv[i] *= -0.25;
    }
    if (rim[i] > lim) { rim[i] = lim; rv[i] *= -0.3; }
    else if (rim[i] < -0.68 * vr) { rim[i] = -0.68 * vr; rv[i] *= -0.3; }

    const stretch = Math.max(0.56, 1 + b.qx * C2[i] + b.qy * S2[i]);
    const rr = Math.max(vr * 0.24, vr * stretch + rim[i]);
    const x = b.x + RC[i] * rr;
    const y = b.y + RS[i] * rr;
    b.px[i] = x;
    b.py[i] = y;
    sx += x; sy += y;
  }
  b.cx = sx / RIM;
  b.cy = sy / RIM;
}

// ---------- Effects ----------
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (0.35 + Math.random() * 0.65);
    fx.push({ k: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.42 + Math.random() * 0.35, size: 3.5 + Math.random() * 4, color });
  }
}
function ring(x, y, r0, r1, color) { fx.push({ k: 'r', x, y, r0, r1, life: 0, max: 0.36, color }); }
function floatText(x, y, str, color, size) { fx.push({ k: 't', x, y, str, life: 0, max: 0.9, color, size }); }

function bounceTick(speed) {
  if (speed < 120 || time - lastTick < 0.07) return;
  lastTick = time;
  snd('playTone', 135 + Math.random() * 55, 0.045, 'sine', Math.min(0.055, speed / 9500));
}

// ---------- Merge ----------
function merge(a, b, born) {
  if (a.dead || b.dead) return;
  a.dead = b.dead = true;

  const inTray = a.state === 'tray' && b.state === 'tray';
  let trayIdx = -1;
  if (inTray) {
    const ia = trayRow.indexOf(a);
    const ib = trayRow.indexOf(b);
    trayIdx = Math.min(ia >= 0 ? ia : 99, ib >= 0 ? ib : 99);
    trayRow = trayRow.filter(x => x !== a && x !== b);
  } else {
    trayRow = trayRow.filter(x => x !== a && x !== b);
  }

  const lvl = a.lvl + 1;
  const x = (a.x + b.x) * 0.5;
  const y = (a.y + b.y) * 0.5;
  const nb = makeBubble(lvl, x, y, inTray ? 'tray' : 'box', (a.qx + b.qx) * 0.5);
  nb.vx = (a.vx + b.vx) * 0.5;
  nb.vy = (a.vy + b.vy) * 0.5;
  nb.rs = a.r / nb.r;
  nb.rsv = 3.2;
  nb.cd = 0.13;
  // Strong liquid slosh along the merge axis!
  const mergeAng = Math.atan2(b.y - a.y, b.x - a.x);
  poke(nb, mergeAng + Math.PI * 0.5, 220);
  ripple(nb, 145);

  if (inTray) {
    if (trayIdx >= 0 && trayIdx <= trayRow.length) trayRow.splice(trayIdx, 0, nb);
    else trayRow.push(nb);
    if (grab === a || grab === b) {
      grab = nb;
      if (aim && !aim.valid) {
        aim.sx = nb.x;
        aim.sy = TRAY_Y;
      }
    }
  }
  born.push(nb);

  combo = (time - lastMerge < 1.15) ? combo + 1 : 1;
  lastMerge = time;
  const pts = valueOf(lvl) * combo;
  score += pts;
  if (score > best) { best = score; writeBest(best); }
  hudDirty = true;

  const col = colorOf(lvl), old = colorOf(a.lvl);
  fx.push({ k: 'g', x: a.x, y: a.y, tx: x, ty: y, r: visR(a), life: 0, max: 0.13, color: old });
  fx.push({ k: 'g', x: b.x, y: b.y, tx: x, ty: y, r: visR(b), life: 0, max: 0.13, color: old });
  ring(x, y, nb.r * 0.65, nb.r * 1.9, col);
  burst(x, y, col, 7 + lvl * 2, 120 + lvl * 18);
  floatText(x, y - nb.r * 0.3, '+' + pts, '#ffffff', 16 + Math.min(12, lvl * 1.2));
  if (combo > 1) floatText(x, y - nb.r * 0.3 - 24, 'x' + combo + '!', '#f6fa97', 15 + Math.min(10, combo * 2));
  if (lvl >= 5) shake = Math.max(shake, Math.min(10, lvl * 0.8));

  if (!inTray) {
    const range = nb.r * 2.4;
    for (const o of bubbles) {
      if (o.dead || o.state === 'tray') continue;
      const dx = o.x - x, dy = o.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < range + o.r) {
        const f = (1 - d / (range + o.r)) * (70 + lvl * 18) * Math.min(1, (nb.r * nb.r) / (o.r * o.r));
        o.vx += (dx / d) * f;
        o.vy += (dy / d) * f;
        poke(o, Math.atan2(-dy, -dx), f * 0.85);
      }
    }
  }

  snd('merge', lvl + combo - 2);
  if (lvl > maxLvl) {
    maxLvl = lvl;
    if (lvl >= 6) floatText(x, y + nb.r * 0.3 + 20, 'NEU ' + valueOf(lvl) + '!', col, 20);
    if (lvl === WIN_LVL && !won) {
      won = true;
      snd('powerup');
      floatText(VW / 2, VH / 2, '2048!', '#f6fa97', 64);
      for (let i = 0; i < 8; i++) burst(BX + Math.random() * BW, RELEASE_Y + Math.random() * (BOX_B - RELEASE_Y), PALETTE[i].base, 14, 300);
      shake = 14;
    }
  }
}

// ---------- Physics Step ----------
function wall(b, pen, nx, ny) {
  const corr = Math.min(pen * 0.6, 8);
  b.x += nx * corr;
  b.y += ny * corr;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    b.vx -= 1.22 * vn * nx;
    b.vy -= 1.22 * vn * ny;
    if (vn < -35) {
      poke(b, Math.atan2(-ny, -nx), Math.min(280, -vn * 0.72));
      bounceTick(-vn);
    }
  }
}

function computeTrayTargets() {
  const n = trayRow.length;
  if (!n) return [];
  const widths = new Array(n);
  const gaps = new Array(n);
  let totalW = 0;
  for (let i = 0; i < n; i++) {
    const b = trayRow[i];
    const w = rxOf(b) * 2;
    widths[i] = w;
    const sameNext = i + 1 < n && trayRow[i + 1].lvl === b.lvl;
    const g = i + 1 < n ? (sameNext ? -14 : 2.5) : 0;
    gaps[i] = g;
    totalW += w + g;
  }
  let curX = (VW - totalW) * 0.5;
  const targets = new Array(n);
  for (let i = 0; i < n; i++) {
    targets[i] = curX + widths[i] * 0.5;
    curX += widths[i] + gaps[i];
  }
  return targets;
}

function step(dt) {
  time += dt;

  if (trayRow.length < MIN_QUEUE) {
    while (trayRow.length < MIN_QUEUE) {
      spawnIntoTray();
    }
    spawnTimer = 0.25;
    snd('playTone', 520 + Math.random() * 110, 0.04, 'sine', 0.025);
  }
  if (trayRow.length < MAX_QUEUE) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnIntoTray();
      spawnTimer = 0.25;
      snd('playTone', 520 + Math.random() * 110, 0.04, 'sine', 0.025);
    }
  }

  // Allow sliding a grabbed blob horizontally in the top bar to reorder or merge with neighbors
  if (grab && grab.state === 'tray' && !grab.dead && aim && !aim.valid) {
    let ig = trayRow.indexOf(grab);
    while (ig > 0 && trayRow[ig - 1] && trayRow[ig - 1].lvl !== grab.lvl && grab.x < trayRow[ig - 1].x) {
      trayRow[ig] = trayRow[ig - 1];
      trayRow[ig - 1] = grab;
      poke(trayRow[ig], 0, 55);
      ig--;
    }
    while (ig >= 0 && ig < trayRow.length - 1 && trayRow[ig + 1] && trayRow[ig + 1].lvl !== grab.lvl && grab.x > trayRow[ig + 1].x) {
      trayRow[ig] = trayRow[ig + 1];
      trayRow[ig + 1] = grab;
      poke(trayRow[ig], Math.PI, 55);
      ig++;
    }
  }

  const trayTargets = computeTrayTargets();
  const dragBox = Math.exp(-DRAG * dt);
  const dragTray = Math.exp(-8.0 * dt);

  for (const b of bubbles) {
    b.t += dt;
    if (b.cd > 0) b.cd -= dt;
    // Bouncier radius scale spring (underdamped so new/merged blobs wobble in size too!)
    b.rsv += (190 * (b.ts - b.rs) - 9.5 * b.rsv) * dt;
    b.rs += b.rsv * dt;
    if (b.rs < 0.05) b.rs = 0.05;

    if (b.state === 'tray') {
      const idx = trayRow.indexOf(b);
      let hx = idx >= 0 ? trayTargets[idx] : VW * 0.5;
      let hy = TRAY_Y;
      if (grab === b && aim) {
        if (aim.valid) {
          hx -= aim.nx * aim.pow * 14;
          hy -= aim.ny * aim.pow * 10;
        } else {
          const rx = rxOf(b);
          hx = Math.max(BX_TOP + rx + 4, Math.min(BR_TOP - rx - 4, aim.px));
          hy = TRAY_Y + Math.max(-10, Math.min(12, aim.py - TRAY_Y));
        }
      }
      const kSpring = (grab === b && aim && !aim.valid) ? 135 : 55;
      b.vx += (hx - b.x) * kSpring * dt;
      b.vy += (hy - b.y) * 65 * dt;
      b.vx *= dragTray;
      b.vy *= dragTray;
    } else {
      const spd = Math.hypot(b.vx, b.vy);
      const gScale = spd > 360 ? 0.42 : 1.0;
      b.vy += GRAV * gScale * dt;
      if (b.state === 'enter' && b.vy < 140) b.vy += 480 * dt;
      b.vx *= dragBox;
      b.vy *= dragBox;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }

  const born = [];
  const n = bubbles.length;
  for (let it = 0; it < 3; it++) {
    const rec = it === 2;
    if (rec) {
      for (const b of bubbles) {
        b.contacts.length = 0;
        b.fxQx = 0;
        b.fxQy = 0;
      }
    }

    for (let i = 0; i < n; i++) {
      const a = bubbles[i];
      if (a.dead) continue;
      const aTray = a.state === 'tray';
      for (let j = i + 1; j < n; j++) {
        const b = bubbles[j];
        if (b.dead || (b.state === 'tray') !== aTray) continue;

        const dx = b.x - a.x, dy = b.y - a.y;
        const maxReach = (a.r + b.r) * 1.55 + SAME_RANGE;
        if (dx > maxReach || dx < -maxReach || dy > maxReach || dy < -maxReach) continue;

        const d = Math.hypot(dx, dy) || 0.01;
        const nx = dx / d, ny = dy / d;

        const ra = dirRadius(a, nx, ny);
        const rb = dirRadius(b, nx, ny);
        const V = ra + rb;
        const R = V * CR;
        const surfGap = d - V;

        // Same-number merge & gentle magnetic attraction ("leichte Anziehungskraft")
        const trayCanMerge = aTray && (a === grab || b === grab || Math.abs(trayRow.indexOf(a) - trayRow.indexOf(b)) === 1);
        if (a.lvl === b.lvl && a.cd <= 0 && b.cd <= 0) {
          const canMerge = !aTray || trayCanMerge;
          if (canMerge && d < V * (aTray ? 1.04 : 0.96)) {
            merge(a, b, born);
            break;
          }
          if (canMerge && it === 0 && surfGap < SAME_RANGE && surfGap > -V) {
            const pull = SAME_PULL * (1 - Math.max(0, surfGap) / SAME_RANGE) * dt;
            const ma = a.r * a.r, mb = b.r * b.r, inv = 1 / (ma + mb);
            a.vx += nx * pull * mb * inv * 2;
            a.vy += ny * pull * mb * inv * 2;
            b.vx -= nx * pull * ma * inv * 2;
            b.vy -= ny * pull * ma * inv * 2;
          }
        }

        const skipTrayBlock = aTray && ((a.lvl === b.lvl && trayCanMerge) || ((a === grab || b === grab) && aim && !aim.valid));
        if (d < R && !skipTrayBlock) {
          const ma = a.r * a.r, mb = b.r * b.r, inv = 1 / (ma + mb);
          const pen = R - d;
          const corr = pen * 0.42;
          a.x -= nx * corr * mb * inv;
          a.y -= ny * corr * mb * inv;
          b.x += nx * corr * ma * inv;
          b.y += ny * corr * ma * inv;

          const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (vn < 0) {
            const jimp = -1.16 * vn / (1 / ma + 1 / mb);
            a.vx -= (jimp / ma) * nx;
            a.vy -= (jimp / ma) * ny;
            b.vx += (jimp / mb) * nx;
            b.vy += (jimp / mb) * ny;
            if (vn < -30) {
              const ang = Math.atan2(ny, nx), amt = Math.min(270, -vn * 0.65);
              poke(a, ang, amt * mb * inv * 2);
              poke(b, ang, amt * ma * inv * 2);
              bounceTick(-vn);
            }
          }
        }

        // Record curved pocket/cleft contact & 2D quadrupole squeeze along contact angle
        if (rec && d < V * 1.08 + SKIN_GAP) {
          const sq = Math.max(0, (V - d) / V);
          // Contact along (nx, ny) compresses along (nx, ny) -> quadrupole force is -(nx^2 - ny^2, 2*nx*ny)
          const c2 = nx * nx - ny * ny;
          const s2 = 2 * nx * ny;
          a.fxQx -= c2 * sq * 1.4;
          a.fxQy -= s2 * sq * 1.4;
          b.fxQx -= c2 * sq * 1.4;
          b.fxQy -= s2 * sq * 1.4;

          const gap = aTray ? 1.8 : SKIN_GAP;
          const dSurfA = Math.max(ra * 0.30, d * (ra / V) - gap * 0.5);
          const rEffA = rb * (1 + (rb / ra) * 0.85) + gap;
          const cDistA = dSurfA + rEffA;
          a.contacts.push(1, nx * cDistA, ny * cDistA, rEffA);

          const dSurfB = Math.max(rb * 0.30, d * (rb / V) - gap * 0.5);
          const rEffB = ra * (1 + (ra / rb) * 0.85) + gap;
          const cDistB = dSurfB + rEffB;
          b.contacts.push(1, -nx * cDistB, -ny * cDistB, rEffB);
        }
      }
    }

    // Walls & 45° chamfered bottom corners
    for (const b of bubbles) {
      if (b.dead) continue;
      const rx = rxOf(b) * CR, ry = ryOf(b) * CR;
      const vrx = rxOf(b), vry = ryOf(b);

      if (b.state === 'tray') {
        const left = BX_TOP + 8, right = BR_TOP - 8;
        const halfH = b.lvl >= 4 ? 19 : b.lvl === 3 ? 25 : 22;
        const top = TRAY_Y - halfH, bot = TRAY_Y + halfH;
        if (b.x - rx < left) wall(b, left - (b.x - rx), 1, 0);
        if (b.x + rx > right) wall(b, (b.x + rx) - right, -1, 0);
        if (rec) {
          if (b.x - left < vrx * 1.05) b.contacts.push(0, -1, 0, b.x - left - 1.5);
          if (right - b.x < vrx * 1.05) b.contacts.push(0, 1, 0, right - b.x - 1.5);
          b.contacts.push(0, 0, -1, Math.max(8, b.y - top));
          b.contacts.push(0, 0, 1, Math.max(8, bot - b.y));
        }
        continue;
      }

      const leftW = b.y < WALL_STEP_Y ? BX_TOP : BX;
      const rightW = b.y < WALL_STEP_Y ? BR_TOP : BR;
      const topW = TOP_Y;
      const botW = BOX_B;

      if (b.x - rx < leftW) wall(b, leftW - (b.x - rx), 1, 0);
      if (b.x + rx > rightW) wall(b, (b.x + rx) - rightW, -1, 0);
      if (b.y - ry < topW) wall(b, topW - (b.y - ry), 0, 1);
      if (b.y + ry > botW) wall(b, (b.y + ry) - botW, 0, -1);

      const inv2 = Math.SQRT1_2;
      const rDiag1 = dirRadius(b, inv2, -inv2) * CR;
      const vDiag1 = dirRadius(b, inv2, -inv2);
      const distBL = ((b.x - BX) + (BOX_B - b.y) - CHAMFER) * inv2;
      if (distBL < rDiag1) wall(b, rDiag1 - distBL, inv2, -inv2);

      const rDiag2 = dirRadius(b, -inv2, -inv2) * CR;
      const vDiag2 = dirRadius(b, -inv2, -inv2);
      const distBR = ((BR - b.x) + (BOX_B - b.y) - CHAMFER) * inv2;
      if (distBR < rDiag2) wall(b, rDiag2 - distBR, -inv2, -inv2);

      if (rec) {
        const pad = 2.0;
        if (b.x - leftW < vrx * 1.06) {
          b.contacts.push(0, -1, 0, Math.max(4, b.x - leftW - pad));
          b.fxQx -= 0.45;
        }
        if (rightW - b.x < vrx * 1.06) {
          b.contacts.push(0, 1, 0, Math.max(4, rightW - b.x - pad));
          b.fxQx -= 0.45;
        }
        if (b.y - topW < vry * 1.06) {
          b.contacts.push(0, 0, -1, Math.max(4, b.y - topW - pad));
          b.fxQx += 0.45;
        }
        if (botW - b.y < vry * 1.06) {
          b.contacts.push(0, 0, 1, Math.max(4, botW - b.y - pad));
          b.fxQx += 0.45;
        }
        if (distBL < vDiag1 * 1.06) {
          b.contacts.push(0, -inv2, inv2, Math.max(4, distBL - pad));
          b.fxQy += 0.4;
        }
        if (distBR < vDiag2 * 1.06) {
          b.contacts.push(0, inv2, inv2, Math.max(4, distBR - pad));
          b.fxQy -= 0.4;
        }
      }
    }
  }

  if (born.length) {
    bubbles = bubbles.filter(b => !b.dead);
    for (const nb of born) bubbles.push(nb);
  }

  sensorL = false;
  sensorR = false;
  let highCount = 0;

  for (const b of bubbles) {
    if (b.state === 'enter' && (b.y - ryOf(b) * CR >= RELEASE_Y || (b.t > 0.65 && b.y > RELEASE_Y))) {
      b.state = 'box';
    }
    updateRim(b, dt);

    if (b.state === 'box' && b.t > 0.8) {
      const topEdge = b.y - ryOf(b);
      if (topEdge < DANGER_Y && Math.hypot(b.vx, b.vy) < 95) {
        highCount++;
        if (b.x < VW * 0.55) sensorL = true;
        if (b.x > VW * 0.45) sensorR = true;
      }
    }
  }

  if (highCount > 0 && (sensorL || sensorR)) {
    danger += dt * (sensorL && sensorR ? 1.35 : 0.85);
    if (time - lastBeat > 0.48) {
      lastBeat = time;
      snd('playTone', 98, 0.12, 'sine', 0.12);
    }
    if (danger >= BURST_TIME) gameOver();
  } else if (danger > 0) {
    danger = Math.max(0, danger - dt * 1.8);
  }
}

function stepFx(dt) {
  for (const f of fx) {
    f.life += dt;
    if (f.k === 'p') {
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= Math.exp(-2.5 * dt); f.vy *= Math.exp(-2.5 * dt);
    } else if (f.k === 't') {
      f.y -= 32 * dt;
    }
  }
  fx = fx.filter(f => f.life < f.max);
  if (fx.length > 400) fx.splice(0, fx.length - 400);
  shake *= Math.exp(-9 * dt);
}

function gameOver() {
  if (over) return;
  over = true;
  grab = null; aim = null;
  canvas.classList.remove('grabbing');
  if (score > best) { best = score; writeBest(best); }
  for (const b of bubbles) if (b.state !== 'tray') burst(b.cx, b.cy, colorOf(b.lvl), 6, 250);
  shake = 16;
  snd('gameOver');
  document.getElementById('ovScore').textContent = score;
  document.getElementById('ovBest').textContent = best;
  document.getElementById('ovTop').textContent = valueOf(maxLvl);
  elOverlay.classList.add('show');
  hudDirty = true;
}

// ---------- Input ----------
function toLocal(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}

function pickTray(p) {
  let pick = null, bestD = Infinity;
  for (const b of trayRow) {
    if (!b || b.dead || b.rs < 0.25) continue;
    const d = p.y < RELEASE_Y + 24 ? Math.hypot(p.x - b.x, p.y - b.y) : Math.abs(p.x - b.x);
    if (d < bestD) { bestD = d; pick = b; }
  }
  return pick;
}

function updateAim(p) {
  const prevPx = aim.px, prevPy = aim.py;
  aim.px = p.x;
  aim.py = p.y;
  // Wiggling pointer excites liquid jiggle on grabbed blob!
  if (grab) {
    const mdx = p.x - prevPx, mdy = p.y - prevPy;
    const mSpd = Math.hypot(mdx, mdy);
    if (mSpd > 2) poke(grab, Math.atan2(mdy, mdx), Math.min(45, mSpd * 1.8));
  }

  let dx = p.x - aim.sx, dy = p.y - aim.sy;
  const pullingDown = dy > 22 && p.y > RELEASE_Y - 12;
  const pullingUp = dy < -22 && p.y < TOP_Y;
  if (pullingUp) { dx = -dx; dy = -dy; }
  const len = Math.hypot(dx, dy);
  aim.valid = (pullingDown || pullingUp) && len > 18 && dy > len * 0.14;
  aim.pow = Math.max(0, Math.min(1, (len - 18) / 165));
  if (len > 0.01) { aim.nx = dx / len; aim.ny = Math.max(0.14, dy / len); }
  const nl = Math.hypot(aim.nx, aim.ny) || 1;
  aim.nx /= nl; aim.ny /= nl;
  aim.speed = 190 + aim.pow * 980;
}

canvas.addEventListener('pointerdown', e => {
  if (over || grab) return;
  const p = toLocal(e);
  const b = pickTray(p);
  if (!b) return;
  e.preventDefault();
  grab = b;
  aim = { id: e.pointerId, sx: p.x, sy: p.y, px: p.x, py: p.y, nx: 0, ny: 1, pow: 0, speed: 0, valid: false };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  canvas.classList.add('grabbing');
  poke(b, Math.PI / 2, 75);
});

canvas.addEventListener('pointermove', e => {
  if (!grab || !aim || e.pointerId !== aim.id) return;
  updateAim(toLocal(e));
});

function release(e, fire) {
  if (!grab || !aim || e.pointerId !== aim.id) return;
  if (fire) updateAim(toLocal(e));
  const b = grab;
  if (fire && aim.valid && !over && b.state === 'tray' && !b.dead) {
    b.state = 'enter';
    b.t = 0;
    b.ts = 1.0;
    b.restQx = 0;
    trayRow = trayRow.filter(x => x !== b);
    if (spawnTimer <= 0) spawnTimer = 0.24;
    b.vx = aim.nx * aim.speed;
    b.vy = aim.ny * aim.speed;
    poke(b, Math.atan2(aim.ny, aim.nx), 160 + aim.pow * 180);
    burst(b.x, b.y, colorOf(b.lvl), 4 + (aim.pow * 6 | 0), 75 + aim.pow * 140);
    snd('pop', 0.75 + aim.pow * 0.65);
    launches++;
  }
  grab = null; aim = null;
  canvas.classList.remove('grabbing');
}
canvas.addEventListener('pointerup', e => release(e, true));
canvas.addEventListener('pointercancel', e => release(e, false));
canvas.addEventListener('contextmenu', e => e.preventDefault());

const muteBtn = document.getElementById('muteBtn');
function syncMute() { muteBtn.textContent = AC && AC.isMuted() ? '🔇' : '🔊'; }
function toggleMute() { if (AC) AC.toggleMute(); syncMute(); }
muteBtn.addEventListener('click', toggleMute);
document.getElementById('restartBtn').addEventListener('click', reset);
document.getElementById('againBtn').addEventListener('click', reset);
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});

// ---------- Drawn Liquid-Jelly Bubble & Number Rendering ----------
const DIGIT_STROKES = {
  '0': [[[0.2,0.06],[0.8,0.06],[0.88,0.2],[0.88,0.8],[0.8,0.94],[0.2,0.94],[0.12,0.8],[0.12,0.2],[0.2,0.06]]],
  '1': [[[0.20,0.20],[0.52,0.06],[0.52,0.94]], [[0.22,0.94],[0.82,0.94]]],
  '2': [[[0.14,0.18],[0.26,0.06],[0.78,0.06],[0.88,0.18],[0.88,0.44],[0.76,0.52],[0.22,0.54],[0.14,0.68],[0.14,0.94],[0.88,0.94]]],
  '3': [[[0.14,0.08],[0.78,0.06],[0.88,0.18],[0.88,0.40],[0.72,0.50],[0.30,0.50]], [[0.72,0.50],[0.88,0.62],[0.88,0.82],[0.76,0.94],[0.14,0.92]]],
  '4': [[[0.16,0.06],[0.16,0.54],[0.86,0.54]], [[0.70,0.06],[0.70,0.95]]],
  '5': [[[0.86,0.06],[0.16,0.06],[0.14,0.48],[0.74,0.48],[0.88,0.60],[0.88,0.82],[0.74,0.94],[0.14,0.92]]],
  '6': [[[0.82,0.08],[0.24,0.06],[0.12,0.22],[0.12,0.82],[0.24,0.94],[0.76,0.94],[0.88,0.82],[0.88,0.58],[0.76,0.48],[0.14,0.50]]],
  '7': [[[0.12,0.08],[0.88,0.08],[0.42,0.94]]],
  '8': [[[0.24,0.06],[0.76,0.06],[0.88,0.18],[0.88,0.38],[0.76,0.49],[0.24,0.49],[0.12,0.38],[0.12,0.18],[0.24,0.06]],
        [[0.24,0.49],[0.12,0.60],[0.12,0.82],[0.24,0.94],[0.76,0.94],[0.88,0.82],[0.88,0.60],[0.76,0.49]]],
  '9': [[[0.86,0.50],[0.24,0.50],[0.12,0.38],[0.12,0.18],[0.24,0.06],[0.76,0.06],[0.88,0.20],[0.88,0.80],[0.74,0.94],[0.18,0.94]]]
};

function drawHandNumber(b, str, cx, cy, h) {
  const w = h * 0.60;
  const gap = h * 0.16;
  const totalW = str.length * w + (str.length - 1) * gap;
  let startX = -totalW * 0.5;
  const startY = -h * 0.5;

  ctx.save();
  ctx.translate(cx, cy);
  // Number squashes, stretches, and tilts slightly with the liquid jelly!
  const sx = Math.max(0.76, Math.min(1.28, 1 + b.qx * 0.38));
  const sy = Math.max(0.76, Math.min(1.28, 1 - b.qx * 0.38));
  ctx.rotate(b.qy * 0.25);
  ctx.scale(sx, sy);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = Math.max(2.7, h * 0.22);

  for (let c = 0; c < str.length; c++) {
    const strokes = DIGIT_STROKES[str[c]];
    if (strokes) {
      for (let s = 0; s < strokes.length; s++) {
        const pts = strokes[s];
        ctx.beginPath();
        for (let p = 0; p < pts.length; p++) {
          const x = startX + pts[p][0] * w;
          const y = startY + pts[p][1] * h;
          if (p === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    startX += w + gap;
  }
  ctx.restore();
}

function traceSmoothLoop(px, py, cx = 0, cy = 0, scale = 1, ox = 0, oy = 0) {
  ctx.beginPath();
  const xLast = cx + (px[RIM - 1] - cx) * scale + ox;
  const yLast = cy + (py[RIM - 1] - cy) * scale + oy;
  const x0 = cx + (px[0] - cx) * scale + ox;
  const y0 = cy + (py[0] - cy) * scale + oy;
  ctx.moveTo((xLast + x0) * 0.5, (yLast + y0) * 0.5);
  for (let i = 0; i < RIM; i++) {
    const j = (i + 1) % RIM;
    const xi = cx + (px[i] - cx) * scale + ox;
    const yi = cy + (py[i] - cy) * scale + oy;
    const xj = cx + (px[j] - cx) * scale + ox;
    const yj = cy + (py[j] - cy) * scale + oy;
    ctx.quadraticCurveTo(xi, yi, (xi + xj) * 0.5, (yi + yj) * 0.5);
  }
  ctx.closePath();
}

function drawBubble(b) {
  const vr = visR(b);
  if (vr < 2) return;
  const px = b.px, py = b.py;
  const st = styleOf(b.lvl);

  // 1. Outer smooth liquid silhouette (shaded rim base)
  traceSmoothLoop(px, py);
  ctx.fillStyle = st.sh;
  ctx.fill();

  // 2. Main cel-shaded liquid body (inset slightly from bottom-right to create a drawn 2D liquid depth rim!)
  ctx.save();
  ctx.clip();
  traceSmoothLoop(px, py, b.cx, b.cy, 0.96, -vr * 0.035, -vr * 0.045);
  ctx.fillStyle = st.base;
  ctx.fill();

  // 3. Soft inner liquid core glow near top-left (deforms with the blob!)
  traceSmoothLoop(px, py, b.cx, b.cy, 0.68, -vr * 0.10, -vr * 0.12);
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = st.hi;
  ctx.fill();

  // 4. Smooth curved cartoon liquid specular crescent + shine droplet along upper-left curve
  ctx.globalAlpha = 0.50;
  ctx.strokeStyle = '#ffffff';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const hiW = Math.max(2.0, Math.min(5.0, vr * 0.105));
  ctx.lineWidth = hiW;
  ctx.beginPath();
  const iStart = Math.round(RIM * 0.56);
  const iEnd = Math.round(RIM * 0.67);
  for (let i = iStart; i <= iEnd; i++) {
    const idx0 = i % RIM, idx1 = (i + 1) % RIM;
    const x0 = b.cx + (px[idx0] - b.cx) * 0.76;
    const y0 = b.cy + (py[idx0] - b.cy) * 0.76;
    const x1 = b.cx + (px[idx1] - b.cx) * 0.76;
    const y1 = b.cy + (py[idx1] - b.cy) * 0.76;
    if (i === iStart) ctx.moveTo(x0, y0);
    else ctx.quadraticCurveTo(x0, y0, (x0 + x1) * 0.5, (y0 + y1) * 0.5);
  }
  ctx.stroke();
  // Small liquid shine dot next to the crescent
  const dotIdx = Math.round(RIM * 0.71) % RIM;
  const dxDot = b.cx + (px[dotIdx] - b.cx) * 0.75;
  const dyDot = b.cy + (py[dotIdx] - b.cy) * 0.75;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(dxDot, dyDot, hiW * 0.55, 0, TAU);
  ctx.fill();
  ctx.restore();

  // 5. Crisp drawn ink contour around the liquid drop
  traceSmoothLoop(px, py);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = '#0a0a0a';
  ctx.stroke();

  // 6. Drawn number at visual centroid that squashes & stretches with the jelly
  const label = String(valueOf(b.lvl));
  const digitH = Math.min(21, Math.max(13.5, 13.5 + b.lvl * 0.85)) * Math.min(1, b.rs * 1.1);
  drawHandNumber(b, label, b.cx, b.cy, digitH);
}

function drawContainerFrame() {
  ctx.beginPath();
  ctx.moveTo(BX_TOP - 6, TOP_Y - 6);
  ctx.lineTo(BR_TOP + 6, TOP_Y - 6);
  ctx.lineTo(BR_TOP + 6, WALL_STEP_Y + 10);
  ctx.lineTo(BR + 6, WALL_STEP_Y + 10);
  ctx.lineTo(BR + 6, BOX_B - CHAMFER + 4);
  ctx.lineTo(BR - CHAMFER + 4, BOX_B + 6);
  ctx.lineTo(BX + CHAMFER - 4, BOX_B + 6);
  ctx.lineTo(BX - 6, BOX_B - CHAMFER + 4);
  ctx.lineTo(BX - 6, WALL_STEP_Y + 10);
  ctx.lineTo(BX_TOP - 6, WALL_STEP_Y + 10);
  ctx.closePath();
  ctx.fillStyle = '#020202';
  ctx.fill();

  const hot = Math.min(1, danger / BURST_TIME);
  if (hot > 0) {
    const grad = ctx.createLinearGradient(0, TOP_Y, 0, DANGER_Y + 90);
    grad.addColorStop(0, `rgba(220, 44, 44, ${0.32 * hot})`);
    grad.addColorStop(1, 'rgba(220, 44, 44, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(BX_TOP, TOP_Y, BR_TOP - BX_TOP, DANGER_Y + 90 - TOP_Y);
  }
}

function drawContainerWallsOnTop() {
  const pulse = danger > 0 ? 0.5 + 0.5 * Math.sin(time * 14) : 0;
  const mainWallCol = danger > 0
    ? `rgb(${68 + (140 * pulse) | 0}, ${68 - (20 * pulse) | 0}, ${68 - (20 * pulse) | 0})`
    : '#434343';

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Upper thinner side walls (around the top queue, #2e2e2e like screenshot)
  ctx.strokeStyle = '#2f2f2f';
  ctx.lineWidth = 18;
  ctx.beginPath();
  ctx.moveTo(BX_TOP - 9, TOP_Y - 2);
  ctx.lineTo(BX_TOP - 9, WALL_STEP_Y + 14);
  ctx.moveTo(BR_TOP + 9, TOP_Y - 2);
  ctx.lineTo(BR_TOP + 9, WALL_STEP_Y + 14);
  ctx.stroke();

  // Main thick side walls + 45° chamfered bottom corners + flat bottom bar (#434343 with rounded top caps)
  ctx.strokeStyle = mainWallCol;
  ctx.lineWidth = 24;
  ctx.beginPath();
  ctx.moveTo(BX - 12, WALL_STEP_Y);
  ctx.lineTo(BX - 12, BOX_B - CHAMFER + 5);
  ctx.lineTo(BX + CHAMFER - 5, BOX_B + 12);
  ctx.lineTo(BR - CHAMFER + 5, BOX_B + 12);
  ctx.lineTo(BR + 12, BOX_B - CHAMFER + 5);
  ctx.lineTo(BR + 12, WALL_STEP_Y);
  ctx.stroke();

  // Top horizontal bar with rounded ends (#434343)
  ctx.strokeStyle = mainWallCol;
  ctx.lineWidth = 22;
  ctx.beginPath();
  ctx.moveTo(22, TOP_Y - 11);
  ctx.lineTo(VW - 22, TOP_Y - 11);
  ctx.stroke();

  // Two small white overflow sensor nubs under the top bar
  for (const [sx, active] of [[SENSOR_LX, sensorL], [SENSOR_RX, sensorR]]) {
    ctx.fillStyle = active ? '#ff4d4d' : '#d8d8d8';
    ctx.beginPath();
    ctx.arc(sx, SENSOR_Y, active ? 5.2 : 3.8, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawAim() {
  const b = grab;
  if (!b || !aim || b.state !== 'tray' || b.dead) return;
  const col = colorOf(b.lvl);

  const rr = Math.max(rxOf(b), ryOf(b)) + 8;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = 4.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, TAU); ctx.stroke();
  if (!aim.valid) { ctx.restore(); return; }

  ctx.strokeStyle = col;
  ctx.beginPath();
  ctx.arc(b.x, b.y, rr, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0.04, aim.pow));
  ctx.stroke();

  const r = b.r * CR;
  let x = b.x, y = b.y;
  let vx = aim.nx * aim.speed, vy = aim.ny * aim.speed;
  const stepDt = 0.014;
  let hit = null;
  ctx.fillStyle = col;

  for (let s = 0; s < 55; s++) {
    const spd = Math.hypot(vx, vy);
    vy += GRAV * (spd > 360 ? 0.42 : 1.0) * stepDt;
    vx *= Math.exp(-DRAG * stepDt);
    vy *= Math.exp(-DRAG * stepDt);
    x += vx * stepDt;
    y += vy * stepDt;

    const lw = (y < WALL_STEP_Y ? BX_TOP : BX) + r;
    const rw = (y < WALL_STEP_Y ? BR_TOP : BR) - r;
    if (x < lw) { x = lw; vx = -vx * 0.7; }
    else if (x > rw) { x = rw; vx = -vx * 0.7; }
    if (y > BOX_B - r) { y = BOX_B - r; vy = -vy * 0.5; break; }

    for (const o of bubbles) {
      if (o.state === 'tray' || o.dead || o === b) continue;
      const hr = r + o.r * CR;
      if ((o.x - x) * (o.x - x) + (o.y - y) * (o.y - y) < hr * hr) { hit = o; break; }
    }
    if (hit) break;
    if (s % 2 === 1) {
      ctx.globalAlpha = 0.85 * (1 - s / 55) + 0.12;
      ctx.beginPath();
      ctx.arc(x, y, 2.8 + aim.pow * 2.2, 0, TAU);
      ctx.fill();
    }
  }

  ctx.globalAlpha = 1;
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 2.8;
  ctx.strokeStyle = hit && hit.lvl === b.lvl ? '#ffffff' : 'rgba(255,255,255,0.38)';
  ctx.beginPath();
  ctx.arc(x, y, b.r * 0.9, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawFx() {
  for (const f of fx) {
    const t = f.life / f.max;
    if (f.k === 'p') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.size * (1 - t * 0.6), 0, TAU); ctx.fill();
    } else if (f.k === 'r') {
      const e = 1 - (1 - t) * (1 - t);
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 5 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * e, 0, TAU); ctx.stroke();
    } else if (f.k === 'g') {
      ctx.globalAlpha = 0.78 * (1 - t);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x + (f.tx - f.x) * t, f.y + (f.ty - f.y) * t, f.r * (1 - t * 0.35), 0, TAU); ctx.fill();
    } else if (f.k === 't') {
      const pop = t < 0.15 ? 0.6 + t / 0.15 * 0.5 : 1.1 - Math.min(0.1, (t - 0.15) * 0.5);
      ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
      ctx.font = `900 ${(f.size * pop).toFixed(1)}px "Arial Rounded MT Bold", "Varela Round", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(f.str, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.str, f.x, f.y);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  if (hudDirty) {
    hudDirty = false;
    elScore.textContent = score;
    elBest.textContent = Math.max(best, score);
  }
  const f = Math.min(1, danger / BURST_TIME);
  elFill.style.width = (f * 100).toFixed(1) + '%';
  elFill.style.background = f > 0.75 ? '#dc2c2c' : f > 0.4 ? '#da6427' : '#35dfa2';
}

function draw() {
  ctx.setTransform(scalePx, 0, 0, scalePx, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawContainerFrame();

  for (const b of bubbles) if (!b.dead && b.state !== 'tray') drawBubble(b);
  for (const b of bubbles) if (!b.dead && b.state === 'tray' && b !== grab) drawBubble(b);
  if (grab && !grab.dead && grab.state === 'tray') drawBubble(grab);

  drawContainerWallsOnTop();
  drawAim();
  drawFx();

  if (danger > 0.35 && !over) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 110px "Arial Rounded MT Bold", "Varela Round", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255, 80, 80, 0.28)';
    ctx.fillText(String(Math.max(1, Math.ceil(BURST_TIME - danger))), VW / 2, VH / 2);
  }

  if (launches < 2 && !over) {
    const a = 0.5 + 0.25 * Math.sin(time * 3);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 15px "Arial Rounded MT Bold", "Varela Round", system-ui, sans-serif';
    ctx.fillStyle = `rgba(195,195,195,${a})`;
    ctx.fillText('Oben in der Leiste mergen oder nach unten ziehen & schießen', VW / 2, 210);
  }

  ctx.restore();
}

// ---------- Layout & Loop ----------
let scalePx = 1;
function fit() {
  const iw = window.innerWidth || VW, ih = window.innerHeight || VH;
  const narrow = iw < 720;
  const availW = narrow ? iw - 16 : iw - 2 * 210;
  const availH = ih - 16 - (narrow ? 66 : 0);
  const w = Math.max(220, Math.min(availW, availH * VW / VH));
  const h = w * VH / VW;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  scalePx = canvas.width / VW;
}
window.addEventListener('resize', fit);

let lastT = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  if (!over) {
    acc += dt;
    while (acc >= H) { step(H); acc -= H; if (over) break; }
  }
  stepFx(dt);
  drawHud();
  draw();
  requestAnimationFrame(frame);
}

reset();
fit();
syncMute();
requestAnimationFrame(frame);

})();
</script>
