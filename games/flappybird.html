<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird</title><link rel="stylesheet" href="../style.css">
<style>
  body { touch-action: manipulation; }
  #c { touch-action: none; max-height: 68vh; width: auto; max-width: 100%; aspect-ratio: 400/600; }
</style>
<script defer src="https://umami.lucius-website.xyz/script.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
<script defer src="https://umami.lucius-website.xyz/recorder.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script></head>
<body>
<a class="back" href="../index.html">← Back</a>
<h1>🐤 Flappy Bird</h1>
<canvas id="c" width="400" height="600"></canvas>
<p class="info">Tap anywhere or Space to flap</p>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const W = c.width, H = c.height, GAP = 160, PW = 60, SPEED = 2.5;
let bird, pipes, score, best = +localStorage.flappyBest || 0, state, frame;

function reset() { bird = { x: 90, y: H/2, v: 0, r: 15 }; pipes = []; score = 0; frame = 0; state = "ready"; }
function flap() {
  if (state === "over") { reset(); return; }
  state = "play"; bird.v = -7.5;
}
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flap(); } });
document.addEventListener("pointerdown", e => {
  if (e.target.closest(".back")) return;
  flap();
});

function update() {
  if (state !== "play") return;
  frame++;
  bird.v += 0.4; bird.y += bird.v;
  if (frame % 95 === 0) pipes.push({ x: W, top: 60 + Math.random() * (H - GAP - 160), passed: false });
  for (const p of pipes) {
    p.x -= SPEED;
    if (!p.passed && p.x + PW < bird.x) { p.passed = true; score++; }
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PW &&
        (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP)) die();
  }
  pipes = pipes.filter(p => p.x > -PW);
  if (bird.y + bird.r > H - 40 || bird.y < 0) die();
}
function die() { state = "over"; if (score > best) { best = score; localStorage.flappyBest = best; } }

function draw() {
  ctx.fillStyle = "#70c5ce"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#5cb85c"; ctx.strokeStyle = "#2d6a2d"; ctx.lineWidth = 3;
  for (const p of pipes) {
    ctx.fillRect(p.x, 0, PW, p.top); ctx.strokeRect(p.x, -5, PW, p.top + 5);
    ctx.fillRect(p.x, p.top + GAP, PW, H); ctx.strokeRect(p.x, p.top + GAP, PW, H);
  }
  ctx.fillStyle = "#ded895"; ctx.fillRect(0, H - 40, W, 40);
  // bird
  ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(Math.min(bird.v / 10, 1));
  ctx.fillStyle = "#f7d51d"; ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(6, -5, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(8, -5, 2, 0, 7); ctx.fill();
  ctx.fillStyle = "#f57c00"; ctx.fillRect(10, 0, 10, 5);
  ctx.restore();
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.textAlign = "center";
  ctx.font = "bold 48px sans-serif"; ctx.strokeText(score, W/2, 80); ctx.fillText(score, W/2, 80);
  ctx.font = "bold 24px sans-serif";
  const msg = state === "ready" ? "Tap or Space to start" : state === "over" ? `Game Over! Best: ${best}` : "";
  if (msg) {
    ctx.strokeText(msg, W/2, H/2 - 60); ctx.fillText(msg, W/2, H/2 - 60);
    if (state === "over") {
      ctx.font = "bold 18px sans-serif";
      ctx.strokeText("Tap to retry", W/2, H/2 - 20);
      ctx.fillText("Tap to retry", W/2, H/2 - 20);
    }
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
reset(); loop();
</script>
</body>
</html>
