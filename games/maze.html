<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maze Runner</title>
  <link rel="stylesheet" href="../style.css">
  <script defer src="https://umami.lucius-website.xyz/script.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
  <script defer src="https://umami.lucius-website.xyz/recorder.js" data-website-id="9d0997fa-7e37-41fa-beb7-d5b67a386b57"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #090a0f;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .top-bar {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .back-btn:hover { color: #fff; }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f4f4f5;
    }

    /* Solid Game Toolbar */
    .toolbar {
      width: 100%;
      max-width: 760px;
      background: #14161f;
      border: 1px solid #272a38;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      background: #090a0f;
      border: 1px solid #272a38;
      color: #f4f4f5;
      font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, monospace;
      font-size: 0.88rem;
      padding: 6px 10px;
      border-radius: 6px;
      width: 140px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #52525b;
    }

    button {
      background: #1e2230;
      border: 1px solid #2e3347;
      color: #e4e4e7;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    button:hover:not(:disabled) {
      background: #282d3f;
      border-color: #3f4660;
      color: #fff;
    }

    button:active:not(:disabled) {
      background: #1e2230;
    }

    button.active {
      background: #2b3147;
      border-color: #6366f1;
      color: #fff;
    }

    /* Size segmented control */
    .segmented {
      display: inline-flex;
      background: #090a0f;
      border: 1px solid #272a38;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .segmented button {
      background: transparent;
      border: none;
      color: #8b8f9e;
      padding: 4px 10px;
      font-size: 0.78rem;
      border-radius: 4px;
    }

    .segmented button.active {
      background: #1e2230;
      color: #fff;
    }

    /* Locked state during run */
    button:disabled, input:disabled {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
    }

    /* Stats HUD */
    .hud {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #a1a1aa;
      font-variant-numeric: tabular-nums;
    }

    .hud b {
      color: #f4f4f5;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .hud-metrics {
      display: flex;
      gap: 16px;
    }

    /* Canvas Viewport */
    .canvas-box {
      background: #050608;
      border: 1px solid #272a38;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      margin: 0;
      background: #050608;
    }

    .shortcuts-hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #71717a;
    }

    kbd {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: #d4d4d8;
    }

    /* Simple Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #181a24;
      border: 1px solid #32374a;
      color: #f4f4f5;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.82rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 50;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Victory Card */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: #14161f;
      border: 1px solid #2e3347;
      border-radius: 10px;
      padding: 24px 28px;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    .modal-content h2 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      color: #fff;
    }
    .modal-seed {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: #a1a1aa;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #202433;
      font-size: 0.85rem;
      color: #a1a1aa;
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-row b {
      color: #f4f4f5;
      font-family: ui-monospace, monospace;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    /* Mobile D-Pad */
    .dpad {
      display: none;
      margin-top: 14px;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      justify-content: center;
    }
    .dpad button {
      background: #14161f;
      border: 1px solid #272a38;
      color: #fff;
      font-size: 1.1rem;
      border-radius: 6px;
      padding: 0;
      justify-content: center;
    }
    .dpad button:active { background: #272a38; }
    @media (max-width: 768px) {
      .dpad { display: grid; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <a class="back-btn" href="../index.html">← Back</a>
    <h1>Maze</h1>
    <div style="width: 50px;"></div>
  </div>

  <!-- Game Toolbar -->
  <div class="toolbar">
    <!-- Top Row: Seed & Size -->
    <div class="tool-row">
      <div class="group">
        <label for="seedInput">Seed</label>
        <input type="text" id="seedInput" placeholder="seed" maxlength="24" spellcheck="false">
        <button id="randomBtn" title="Random seed">🎲 Random</button>
        <button id="copyBtn" title="Copy seed link">🔗 Share</button>
      </div>

      <div class="group">
        <label>Size</label>
        <div class="segmented" id="sizeGroup">
          <button data-size="15">15</button>
          <button data-size="25" class="active">25</button>
          <button data-size="35">35</button>
          <button data-size="49">49</button>
        </div>
        <button id="genBtn">Generate</button>
      </div>
    </div>

    <!-- Bottom Row: Toggles & Reset -->
    <div class="tool-row" style="border-top: 1px solid #202433; padding-top: 10px;">
      <div class="group">
        <button id="fogBtn">Fog of War: Off</button>
        <button id="trailBtn" class="active">Trail: On</button>
        <button id="soundBtn" class="active">Sound: On</button>
      </div>

      <button id="resetBtn">Reset Run</button>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-metrics">
      <span>Time: <b id="timeVal">00:00.0</b></span>
      <span>Steps: <b id="stepVal">0</b></span>
      <span>Shortest: <b id="parVal">-</b></span>
    </div>
    <div>
      <span>Best: <b id="bestVal">None</b></span>
    </div>
  </div>

  <!-- Maze Canvas -->
  <div class="canvas-box" id="viewport">
    <canvas id="mazeCanvas"></canvas>
  </div>

  <div class="shortcuts-hint">
    Use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrows</kbd> to move · <kbd>R</kbd> to reset run
  </div>

  <!-- Mobile Controls -->
  <div class="dpad">
    <div></div>
    <button id="btnUp">▲</button>
    <div></div>
    <button id="btnLeft">◀</button>
    <button id="btnDown">▼</button>
    <button id="btnRight">▶</button>
    <div></div><div></div><div></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Link copied</div>

  <!-- Victory Dialog -->
  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2>Maze Cleared</h2>
      <div class="modal-seed" id="winSeedLabel">seed</div>

      <div class="stat-row">
        <span>Time</span>
        <b id="winTime">00:00.0</b>
      </div>
      <div class="stat-row">
        <span>Steps</span>
        <b id="winSteps">0</b>
      </div>
      <div class="stat-row">
        <span>Shortest Possible</span>
        <b id="winPar">0</b>
      </div>
      <div class="stat-row">
        <span>Efficiency</span>
        <b id="winEff">100%</b>
      </div>
      <div class="stat-row">
        <span>Seed Record</span>
        <b id="winRec">Completed</b>
      </div>

      <div class="modal-actions">
        <button id="playAgainBtn">Play Again</button>
        <button id="nextBtn">New Seed</button>
        <button id="shareWinBtn">Share</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       DETERMINISTIC PRNG (FNV-1a Hash + Mulberry32)
       ========================================================================== */
    function hashString(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 16777619);
      }
      return h >>> 0;
    }

    function createPRNG(seedNum) {
      let s = seedNum >>> 0;
      return function() {
        let t = (s += 0x6D2B79F5) >>> 0;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const WORDS = [
      "atlas", "canyon", "dune", "delta", "ember", "fjord", "granite",
      "haven", "iron", "jungle", "mesa", "orbit", "peak", "ridge",
      "stone", "tundra", "vale", "zenith", "timber", "summit"
    ];

    function getRandomSeed() {
      const w = WORDS[Math.floor(Math.random() * WORDS.length)];
      const num = Math.floor(Math.random() * 899) + 100;
      return `${w}-${num}`;
    }

    /* ==========================================================================
       AUDIO SYNTHESIZER (Clean subtle clicks)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioCls = window.AudioContext || window.webkitAudioContext;
        if (AudioCls) audioCtx = new AudioCls();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'step') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        } else if (type === 'bump') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(90, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'win') {
          const freqs = [330, 440, 550, 660];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0.08, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.32);
          });
        }
      } catch (e) {}
    }

    /* ==========================================================================
       MAZE GENERATION (Recursive Backtracker) & BFS SOLVER
       ========================================================================== */
    class Maze {
      constructor(cols, rows, rng) {
        this.cols = cols;
        this.rows = rows;
        this.rng = rng;
        this.cells = Array.from({ length: rows }, () =>
          Array.from({ length: cols }, () => ({
            top: true, right: true, bottom: true, left: true, visited: false
          }))
        );
        this.generate();
        this.solution = this.solveBFS(0, 0, cols - 1, rows - 1);
      }

      generate() {
        const stack = [{ x: 0, y: 0 }];
        this.cells[0][0].visited = true;

        const dirs = [
          { dx: 0, dy: -1, wall: 'top', opp: 'bottom' },
          { dx: 1, dy: 0, wall: 'right', opp: 'left' },
          { dx: 0, dy: 1, wall: 'bottom', opp: 'top' },
          { dx: -1, dy: 0, wall: 'left', opp: 'right' }
        ];

        while (stack.length > 0) {
          const curr = stack[stack.length - 1];
          const unvisited = [];

          for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows) {
              if (!this.cells[ny][nx].visited) {
                unvisited.push({ x: nx, y: ny, dir: d });
              }
            }
          }

          if (unvisited.length > 0) {
            const pick = Math.floor(this.rng() * unvisited.length);
            const chosen = unvisited[pick];
            this.cells[curr.y][curr.x][chosen.dir.wall] = false;
            this.cells[chosen.y][chosen.x][chosen.dir.opp] = false;
            this.cells[chosen.y][chosen.x].visited = true;
            stack.push({ x: chosen.x, y: chosen.y });
          } else {
            stack.pop();
          }
        }
      }

      solveBFS(sx, sy, gx, gy) {
        const queue = [{ x: sx, y: sy, path: [{ x: sx, y: sy }] }];
        const visited = Array.from({ length: this.rows }, () => Array(this.cols).fill(false));
        visited[sy][sx] = true;

        const dirs = [
          { dx: 0, dy: -1, wall: 'top' },
          { dx: 1, dy: 0, wall: 'right' },
          { dx: 0, dy: 1, wall: 'bottom' },
          { dx: -1, dy: 0, wall: 'left' }
        ];

        while (queue.length > 0) {
          const { x, y, path } = queue.shift();
          if (x === gx && y === gy) return path;

          for (const d of dirs) {
            if (!this.cells[y][x][d.wall]) {
              const nx = x + d.dx;
              const ny = y + d.dy;
              if (nx >= 0 && nx < this.cols && ny >= 0 && ny < this.rows && !visited[ny][nx]) {
                visited[ny][nx] = true;
                queue.push({ x: nx, y: ny, path: [...path, { x: nx, y: ny }] });
              }
            }
          }
        }
        return [];
      }

      canMove(x, y, dx, dy) {
        if (dx === 0 && dy === -1) return !this.cells[y][x].top;
        if (dx === 1 && dy === 0) return !this.cells[y][x].right;
        if (dx === 0 && dy === 1) return !this.cells[y][x].bottom;
        if (dx === -1 && dy === 0) return !this.cells[y][x].left;
        return false;
      }
    }

    /* ==========================================================================
       GAME STATE & UI BINDINGS
       ========================================================================== */
    const canvas = document.getElementById("mazeCanvas");
    const ctx = canvas.getContext("2d");
    const viewport = document.getElementById("viewport");

    // Controls
    const seedInput = document.getElementById("seedInput");
    const randomBtn = document.getElementById("randomBtn");
    const copyBtn = document.getElementById("copyBtn");
    const genBtn = document.getElementById("genBtn");
    const resetBtn = document.getElementById("resetBtn");
    const sizeButtons = document.querySelectorAll(".segmented button");

    const fogBtn = document.getElementById("fogBtn");
    const trailBtn = document.getElementById("trailBtn");
    const soundBtn = document.getElementById("soundBtn");

    const timeVal = document.getElementById("timeVal");
    const stepVal = document.getElementById("stepVal");
    const parVal = document.getElementById("parVal");
    const bestVal = document.getElementById("bestVal");
    const toast = document.getElementById("toast");

    // Modal
    const winModal = document.getElementById("winModal");
    const winSeedLabel = document.getElementById("winSeedLabel");
    const winTime = document.getElementById("winTime");
    const winSteps = document.getElementById("winSteps");
    const winPar = document.getElementById("winPar");
    const winEff = document.getElementById("winEff");
    const winRec = document.getElementById("winRec");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shareWinBtn = document.getElementById("shareWinBtn");

    let currentSeed = "";
    let currentSize = 25;
    let maze = null;
    let player = { x: 0, y: 0, renderX: 0, renderY: 0 };
    let goal = { x: 0, y: 0 };

    let steps = 0;
    let startTime = null;
    let timerInterval = null;
    let elapsedMs = 0;
    let isGameOver = false;
    let isRunActive = false;

    let showTrail = true;
    let showFog = false;

    let trailPositions = [];
    let trailSet = new Set();

    /* Lock/Unlock pre-run configuration */
    function setRunActive(active) {
      isRunActive = active;
      seedInput.disabled = active;
      randomBtn.disabled = active;
      genBtn.disabled = active;
      sizeButtons.forEach(b => b.disabled = active);
      fogBtn.disabled = active;
    }

    function initGame() {
      let rawSeed = seedInput.value.trim().toLowerCase();
      if (!rawSeed) {
        rawSeed = getRandomSeed();
        seedInput.value = rawSeed;
      }
      currentSeed = rawSeed;

      const seedHash = hashString(currentSeed);
      const rng = createPRNG(seedHash);

      maze = new Maze(currentSize, currentSize, rng);
      player = { x: 0, y: 0, renderX: 0, renderY: 0 };
      goal = { x: currentSize - 1, y: currentSize - 1 };

      steps = 0;
      elapsedMs = 0;
      startTime = null;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      isGameOver = false;

      trailPositions = [{ x: 0, y: 0 }];
      trailSet.clear();
      trailSet.add("0,0");

      timeVal.textContent = "00:00.0";
      stepVal.textContent = "0";
      const parSteps = maze.solution.length - 1;
      parVal.textContent = `${parSteps}`;

      setRunActive(false);
      loadRecord();
      resizeCanvas();
      winModal.classList.remove("open");
    }

    function resetCurrentRun() {
      if (!maze) return;
      player = { x: 0, y: 0, renderX: 0, renderY: 0 };
      steps = 0;
      elapsedMs = 0;
      startTime = null;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      isGameOver = false;

      trailPositions = [{ x: 0, y: 0 }];
      trailSet.clear();
      trailSet.add("0,0");

      timeVal.textContent = "00:00.0";
      stepVal.textContent = "0";
      setRunActive(false);
      winModal.classList.remove("open");
    }

    function loadRecord() {
      const key = `maze_rec_${currentSeed}_${currentSize}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        const data = JSON.parse(saved);
        bestVal.textContent = `${formatTime(data.time)} (${data.steps}s)`;
      } else {
        bestVal.textContent = "None";
      }
    }

    function saveRecord() {
      const key = `maze_rec_${currentSeed}_${currentSize}`;
      const record = { time: elapsedMs, steps: steps };
      const saved = localStorage.getItem(key);
      let isNew = false;

      if (!saved) {
        localStorage.setItem(key, JSON.stringify(record));
        isNew = true;
      } else {
        const prev = JSON.parse(saved);
        if (elapsedMs < prev.time) {
          localStorage.setItem(key, JSON.stringify(record));
          isNew = true;
        }
      }
      loadRecord();
      return isNew;
    }

    function startTimerIfNeeded() {
      if (!startTime && !isGameOver) {
        startTime = performance.now();
        timerInterval = setInterval(() => {
          if (!isGameOver) {
            elapsedMs = performance.now() - startTime;
            timeVal.textContent = formatTime(elapsedMs);
          }
        }, 80);
      }
    }

    function formatTime(ms) {
      const totalSec = ms / 1000;
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      const tenths = Math.floor((ms % 1000) / 100);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${tenths}`;
    }

    function move(dx, dy) {
      if (isGameOver) return;
      if (!isRunActive) {
        setRunActive(true);
      }
      startTimerIfNeeded();

      if (maze.canMove(player.x, player.y, dx, dy)) {
        player.x += dx;
        player.y += dy;
        steps++;
        stepVal.textContent = steps;

        const key = `${player.x},${player.y}`;
        if (!trailSet.has(key)) {
          trailSet.add(key);
          trailPositions.push({ x: player.x, y: player.y });
        }

        playSound('step');

        if (player.x === goal.x && player.y === goal.y) {
          handleWin();
        }
      } else {
        playSound('bump');
      }
    }

    function handleWin() {
      isGameOver = true;
      setRunActive(false);
      if (timerInterval) clearInterval(timerInterval);
      elapsedMs = performance.now() - startTime;
      timeVal.textContent = formatTime(elapsedMs);

      playSound('win');
      const isNewRecord = saveRecord();
      const par = maze.solution.length - 1;
      const eff = Math.round((par / Math.max(steps, 1)) * 100);

      winSeedLabel.textContent = `Seed: ${currentSeed}`;
      winTime.textContent = formatTime(elapsedMs);
      winSteps.textContent = steps;
      winPar.textContent = par;
      winEff.textContent = `${eff}%`;
      winRec.textContent = isNewRecord ? "New Best" : "Completed";

      setTimeout(() => {
        winModal.classList.add("open");
      }, 300);
    }

    /* Canvas Sizing */
    let cellSize = 22;
    function resizeCanvas() {
      if (!maze) return;
      const maxWidth = Math.min(window.innerWidth - 32, 740);
      const maxHeight = window.innerHeight * 0.62;
      const targetSize = Math.min(maxWidth, maxHeight);

      cellSize = Math.max(12, Math.floor(targetSize / maze.cols));
      canvas.width = maze.cols * cellSize;
      canvas.height = maze.rows * cellSize;
      viewport.style.width = `${canvas.width}px`;
      viewport.style.height = `${canvas.height}px`;
    }

    window.addEventListener("resize", resizeCanvas);

    /* ==========================================================================
       RENDER LOOP: SOLID AUTHENTIC MAZE GRAPHICS
       ========================================================================== */
    function render() {
      if (!maze) {
        requestAnimationFrame(render);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      player.renderX += (player.x - player.renderX) * 0.35;
      player.renderY += (player.y - player.renderY) * 0.35;

      const cs = cellSize;

      // Solid background
      ctx.fillStyle = "#0c0e14";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Trail
      if (showTrail && trailPositions.length > 0) {
        ctx.fillStyle = "#1e2433";
        for (let i = 0; i < trailPositions.length; i++) {
          const pt = trailPositions[i];
          ctx.fillRect(pt.x * cs + 2, pt.y * cs + 2, cs - 4, cs - 4);
        }
      }

      // Start square
      ctx.fillStyle = "#166534";
      ctx.fillRect(2, 2, cs - 4, cs - 4);

      // Goal square
      const gx = goal.x * cs;
      const gy = goal.y * cs;
      ctx.fillStyle = "#854d0e";
      ctx.fillRect(gx + 2, gy + 2, cs - 4, cs - 4);

      // Clean Solid Walls
      ctx.strokeStyle = "#384152";
      ctx.lineWidth = Math.max(2, Math.floor(cs * 0.14));
      ctx.lineCap = "square";

      for (let y = 0; y < maze.rows; y++) {
        for (let x = 0; x < maze.cols; x++) {
          const c = maze.cells[y][x];
          const x1 = x * cs, y1 = y * cs, x2 = x1 + cs, y2 = y1 + cs;
          ctx.beginPath();
          if (c.top) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y1); }
          if (c.right) { ctx.moveTo(x2, y1); ctx.lineTo(x2, y2); }
          if (c.bottom) { ctx.moveTo(x1, y2); ctx.lineTo(x2, y2); }
          if (c.left) { ctx.moveTo(x1, y1); ctx.lineTo(x1, y2); }
          ctx.stroke();
        }
      }

      // Player Token (Crisp circle)
      const px = (player.renderX + 0.5) * cs;
      const py = (player.renderY + 0.5) * cs;
      ctx.fillStyle = "#f4f4f5";
      ctx.beginPath();
      ctx.arc(px, py, cs * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // Fog of War (solid dark radius)
      if (showFog) {
        ctx.save();
        const r1 = cs * 2.2;
        const r2 = cs * 3.8;
        const grad = ctx.createRadialGradient(px, py, r1, px, py, r2);
        grad.addColorStop(0, "rgba(5, 6, 8, 0)");
        grad.addColorStop(1, "rgba(5, 6, 8, 1)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    /* ==========================================================================
       USER INPUT HANDLING
       ========================================================================== */
    const DIRS = {
      ArrowUp: [0, -1], KeyW: [0, -1],
      ArrowDown: [0, 1], KeyS: [0, 1],
      ArrowLeft: [-1, 0], KeyA: [-1, 0],
      ArrowRight: [1, 0], KeyD: [1, 0]
    };

    window.addEventListener("keydown", (e) => {
      if (document.activeElement === seedInput) return;
      if (DIRS[e.code]) {
        e.preventDefault();
        const [dx, dy] = DIRS[e.code];
        move(dx, dy);
      } else if (e.code === "KeyR") {
        resetCurrentRun();
      }
    });

    // Touch D-Pad
    document.getElementById("btnUp").addEventListener("pointerdown", (e) => { e.preventDefault(); move(0, -1); });
    document.getElementById("btnDown").addEventListener("pointerdown", (e) => { e.preventDefault(); move(0, 1); });
    document.getElementById("btnLeft").addEventListener("pointerdown", (e) => { e.preventDefault(); move(-1, 0); });
    document.getElementById("btnRight").addEventListener("pointerdown", (e) => { e.preventDefault(); move(1, 0); });

    // Swipe
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const t = 18;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (Math.abs(dx) > t) move(dx > 0 ? 1 : -1, 0);
        } else {
          if (Math.abs(dy) > t) move(0, dy > 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    // Buttons
    genBtn.addEventListener("click", () => {
      if (isRunActive) return;
      getAudioCtx();
      initGame();
    });

    randomBtn.addEventListener("click", () => {
      if (isRunActive) return;
      seedInput.value = getRandomSeed();
      initGame();
    });

    seedInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (isRunActive) return;
        initGame();
        seedInput.blur();
      }
    });

    sizeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        if (isRunActive) return;
        sizeButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSize = parseInt(btn.dataset.size, 10);
        initGame();
      });
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function copyLink() {
      const url = new URL(window.location.href);
      url.searchParams.set("seed", currentSeed);
      url.searchParams.set("size", currentSize);
      navigator.clipboard.writeText(url.toString()).then(() => {
        showToast("Seed link copied");
      }).catch(() => {
        showToast(`Seed: ${currentSeed}`);
      });
    }

    copyBtn.addEventListener("click", copyLink);
    shareWinBtn.addEventListener("click", copyLink);

    resetBtn.addEventListener("click", resetCurrentRun);

    fogBtn.addEventListener("click", () => {
      if (isRunActive) return;
      showFog = !showFog;
      fogBtn.textContent = `Fog of War: ${showFog ? "On" : "Off"}`;
      fogBtn.classList.toggle("active", showFog);
    });

    trailBtn.addEventListener("click", () => {
      showTrail = !showTrail;
      trailBtn.textContent = `Trail: ${showTrail ? "On" : "Off"}`;
      trailBtn.classList.toggle("active", showTrail);
    });

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = `Sound: ${soundEnabled ? "On" : "Off"}`;
      soundBtn.classList.toggle("active", soundEnabled);
    });

    playAgainBtn.addEventListener("click", () => {
      winModal.classList.remove("open");
      resetCurrentRun();
    });

    nextBtn.addEventListener("click", () => {
      winModal.classList.remove("open");
      randomBtn.click();
    });

    function loadParams() {
      const p = new URLSearchParams(window.location.search);
      const s = p.get("seed");
      const sz = p.get("size");
      if (s) seedInput.value = s;
      if (sz && ["15", "25", "35", "49"].includes(sz)) {
        currentSize = parseInt(sz, 10);
        sizeButtons.forEach(b => {
          b.classList.toggle("active", b.dataset.size === sz);
        });
      }
    }

    loadParams();
    initGame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
