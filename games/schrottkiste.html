function buildLevel(def) {
  const L = { chains: [], loops: [], objs: [], deco: [], startX: 0, finishX: 0, maxY: 0, minY: 0 };
  let x = 0, y = 0, chain = [[-1500, 0], [0, 0]];
  const pt = (nx, ny) => { x = nx; y = ny; chain.push([x, y]); };
  const endChain = () => { if (chain.length > 1) L.chains.push(chain); };
  const curve = (len, f) => { const n = Math.max(2, Math.ceil(len / 20)), x0 = x, y0 = y; for (let i = 1; i <= n; i++) { const t = i / n; pt(x0 + len * t, y0 - f(t)); } };
  const b = {
    flat(len) { pt(x + len, y); },
    slope(len, rise) { curve(len, t => rise * t * t * (3 - 2 * t)); },
    ramp(len, rise) { curve(len, t => rise * t * t); },
    hills(len, amp, n) { curve(len, t => amp * (1 - Math.cos(Math.PI * 2 * n * t)) / 2); },
    bumps(len, h, n) { curve(len, t => h * Math.abs(Math.sin(Math.PI * n * t))); },
    stairs(n, h) { for (let i = 0; i < n; i++) { b.flat(55); b.slope(30, h); } b.flat(55); },
    gap(w, rise = 0) { endChain(); x += w; y -= rise; chain = [[x, y]]; },
    loop(r) { const cx = x + 40; L.loops.push({ cx, cy: y - r, r, state: 0 }); b.flat(40 + r + 160); },
    crates(n) {
      const s = 34; let i = 0;
      for (let row = 0; i < n; row++) for (let c = 0; c < Math.max(1, 3 - row) && i < n; c++, i++) L.objs.push({ t: 'crate', x: x + 90 + c * s + row * s / 2, y: y - s / 2 - row * s, s });
      b.flat(260);
    },
    barrels(n, dx = 60) { for (let i = 0; i < n; i++) L.objs.push({ t: 'barrel', x: x + dx + i * 64, y: y - 13, r: 12 }); },
    seesaw(len) { L.objs.push({ t: 'seesaw', x: x + 60 + len / 2, y: y - 34, len }); b.flat(len + 120); },
    bridge(len) { const x0 = x, y0 = y; b.gap(len); L.objs.push({ t: 'bridge', x1: x0, y1: y0, x2: x, y2: y }); },
    pendulum() { L.objs.push({ t: 'pendulum', x: x + 120, y: y - 300, len: 240 }); b.flat(240); },
  };
  def.build(b);
  b.flat(150); L.finishX = x; b.flat(700); endChain();
  for (const c of L.chains) for (const p of c) { L.maxY = Math.max(L.maxY, p[1]); L.minY = Math.min(L.minY, p[1]); }
  return L;
}

function segBody(ax, ay, bx, by, opts) {
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy), T = 40;
  return Bodies.rectangle((ax + bx) / 2 - dy / len * T / 2, (ay + by) / 2 + dx / len * T / 2, len + 2, T, Object.assign({ isStatic: true, angle: Math.atan2(dy, dx), friction: 0.9 }, opts));
}

function createGame(levelIdx, car) {
  const L = buildLevel(LEVELS[levelIdx]);
  const engine = Engine.create({ positionIterations: 10, velocityIterations: 8, constraintIterations: 4, gravity: { x: 0, y: 1, scale: 0.0008 } });
  const W = engine.world, statics = [], dyn = [];
  const gf = { category: CAT.GROUND, mask: 0xffffffff };
  L.chains.forEach((c, ci) => {
    for (let i = 1; i < c.length; i++) statics.push(segBody(c[i - 1][0], c[i - 1][1], c[i][0], c[i][1], { collisionFilter: gf }));
    const [lx, ly] = c[c.length - 1], [fx, fy] = c[0];
    // cliff walls start below the surface slab so they never poke up through a steep ramp
    statics.push(Bodies.rectangle(lx - 10, ly + 430, 20, 800, { isStatic: true, collisionFilter: gf }));
    if (ci > 0) statics.push(Bodies.rectangle(fx + 10, fy + 430, 20, 800, { isStatic: true, collisionFilter: gf }));
  });
  for (const lp of L.loops) {
    const P = a => [lp.cx + lp.r * Math.sin(a), lp.cy + lp.r * Math.cos(a)], n = 40;
    // right half (entry side) + overlap past the top; left half (exit side) + overlap before the top
    const arc = (a0, a1, cat) => { const k = Math.ceil(n * (a1 - a0) / (2 * Math.PI)); for (let i = 0; i < k; i++) { const p = P(a0 + (a1 - a0) * i / k), q = P(a0 + (a1 - a0) * (i + 1) / k); statics.push(segBody(p[0], p[1], q[0], q[1], { collisionFilter: { category: cat, mask: 0xffffffff } })); } };
    arc(0.08, Math.PI + 0.6, CAT.LA); arc(Math.PI - 0.6, 2 * Math.PI - 0.08, CAT.LB);
  }
  const of = () => ({ category: CAT.OBJ, mask: CAT.GROUND | CAT.CAR | CAT.OBJ });
  for (const o of L.objs) {
    if (o.t === 'crate') { o.b = Bodies.rectangle(o.x, o.y, o.s, o.s, { density: 0.0002, friction: 0.25, collisionFilter: of() }); dyn.push(o); }
    else if (o.t === 'barrel') { o.b = Bodies.circle(o.x, o.y, o.r, { density: 0.0006, friction: 0.4, restitution: 0.2, collisionFilter: of() }); dyn.push(o); }
    else if (o.t === 'seesaw') {
      const h = 34, a = -Math.asin((h - 6) / (o.len / 2));
      o.b = Bodies.rectangle(o.x, o.y, o.len, 12, { angle: a, density: 0.002, friction: 0.9, collisionFilter: of() });
      o.c = Constraint.create({ pointA: { x: o.x, y: o.y }, bodyB: o.b, length: 0, stiffness: 1 }); dyn.push(o); Composite.add(W, o.c);
    } else if (o.t === 'bridge') {
      const n = Math.max(4, Math.round((o.x2 - o.x1) / 38)), g = Body.nextGroup(true), pl = [];
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n, w = (o.x2 - o.x1) / n;
        pl.push(Bodies.rectangle(o.x1 + (o.x2 - o.x1) * t, o.y1 + (o.y2 - o.y1) * t + 5, w - 2, 10, { density: 0.002, friction: 0.9, collisionFilter: { group: g, category: CAT.OBJ, mask: CAT.CAR | CAT.OBJ } }));
      }
      const w = (o.x2 - o.x1) / n, cs = [];
      cs.push(Constraint.create({ pointA: { x: o.x1, y: o.y1 + 5 }, bodyB: pl[0], pointB: { x: -w / 2, y: 0 }, length: 0, stiffness: 0.9 }));
      for (let i = 1; i < n; i++) cs.push(Constraint.create({ bodyA: pl[i - 1], pointA: { x: w / 2, y: 0 }, bodyB: pl[i], pointB: { x: -w / 2, y: 0 }, length: 0, stiffness: 0.9 }));
      cs.push(Constraint.create({ pointA: { x: o.x2, y: o.y2 + 5 }, bodyB: pl[n - 1], pointB: { x: w / 2, y: 0 }, length: 0, stiffness: 0.9 }));
      o.planks = pl; Composite.add(W, pl.concat(cs)); dyn.push(o);
    } else if (o.t === 'pendulum') {
      o.b = Bodies.circle(o.x - o.len * 0.75, o.y + o.len * 0.66, 26, { density: 0.006, frictionAir: 0, restitution: 0.3, collisionFilter: { category: CAT.OBJ, mask: CAT.CAR | CAT.OBJ } });
      o.c = Constraint.create({ pointA: { x: o.x, y: o.y }, bodyB: o.b, length: o.len, stiffness: 1 }); Composite.add(W, o.c); dyn.push(o);
    }
    if (o.b) Composite.add(W, o.b);
  }
  Composite.add(W, statics);
  const C = createCar(W, car, 0, -car.wy - car.wr - 4);
  const track = [C.chassis, ...C.wheels];
  for (const o of dyn) { if (o.b) track.push(o.b); if (o.planks) track.push(...o.planks); }
  const G = { L, engine, car, C, dyn, track, time: 0, crashed: false, won: false, touch: [false, false], roof: false, air: 0, takeoff: 0, spin: 0, flips: 0, score: 0, events: [] };
  const onPairs = e => {
    for (const p of e.pairs) for (const [a, o] of [[p.bodyA, p.bodyB], [p.bodyB, p.bodyA]]) {
      const pa = a.parent;
      if (pa === C.wheels[0]) G.touch[0] = true; else if (pa === C.wheels[1]) G.touch[1] = true;
      else if (pa === C.chassis && o.isStatic && o.collisionFilter.category === CAT.GROUND) G.roof = true; // loop rings never count as a roof hit
    }
  };
  Events.on(engine, 'collisionStart', onPairs); Events.on(engine, 'collisionActive', onPairs);
  return G;
}

function createCar(W, d, x, y) {
  const filt = { group: Body.nextGroup(true), category: CAT.CAR, mask: CAT.GROUND | CAT.OBJ | CAT.LA };
  const main = Bodies.rectangle(x, y, d.w, d.h, { collisionFilter: filt, density: d.dens, friction: 0.05, frictionAir: 0.002 });
  const ballast = Bodies.rectangle(x, y + d.h / 2 - 3, d.w * 0.8, 6, { collisionFilter: filt, density: d.dens * 4, friction: 0.05, frictionAir: 0.002 });
  const chassis = Body.create({ parts: [main, ballast], collisionFilter: filt, frictionAir: 0.002 });
  const cp = { x: chassis.position.x, y: chassis.position.y };
  const wheels = d.wx.map(wx => Bodies.circle(x + wx, y + d.wy, d.wr, { collisionFilter: filt, friction: d.grip, frictionStatic: 2, density: d.dens, restitution: 0, frictionAir: 0.002 }));
  // trailing arm (keeps the wheel from wobbling fore/aft) + vertical spring/damper per wheel
  const axles = [];
  wheels.forEach((wh, i) => {
    const lx = x + d.wx[i] - cp.x, ly = y + d.wy - cp.y, s = d.wx[i] < 0 ? 1 : -1;
    axles.push(Constraint.create({ bodyA: chassis, pointA: { x: lx + s * 26, y: ly - 4 }, bodyB: wh, length: Math.hypot(26, 4), stiffness: 0.9 }));
    axles.push(Constraint.create({ bodyA: chassis, pointA: { x: lx, y: ly - 22 }, bodyB: wh, length: 22, stiffness: d.stiff, damping: 0.25 }));
  });
  Composite.add(W, [chassis, ...wheels, ...axles]);
  return { chassis, wheels, all: [...chassis.parts, ...wheels], off: { x: x - cp.x, y: y - cp.y } };
}

const normAng = a => Math.atan2(Math.sin(a), Math.cos(a));

function stepGame(G, input) {
  const { C, car } = G, ch = C.chassis, onGround = G.touch[0] || G.touch[1];
  for (const b of G.track) { b._px = b.position.x; b._py = b.position.y; b._pa = b.angle; } // tick start, for render interpolation
  if (!G.crashed && !G.won) {
    const dir = input.gas ? 1 : input.brake ? -1 : 0;
    for (const w of C.wheels) {
      const target = dir * car.speed * (dir < 0 ? 0.7 : 1);
      // motor only pushes towards target, never brakes downhill momentum
      if (dir && dir * w.angularVelocity < dir * target) Body.setAngularVelocity(w, w.angularVelocity + (target - w.angularVelocity) * car.torque);
      else if (!dir) Body.setAngularVelocity(w, w.angularVelocity * 0.99);
    }
    // ground: motor reaction pitches the chassis (gas = nose up, reverse = nose down); on one wheel only
    // reverse acts so wheelies self-limit but can be pushed back down
    const both = G.touch[0] && G.touch[1];
    if (onGround) {
      G.spin = 0; G.armed = false;
      const k = both ? 0.08 : dir < 0 ? 0.6 : 0;
      if (dir) Body.setAngularVelocity(ch, Math.max(-0.11, Math.min(0.11, ch.angularVelocity - dir * car.air * k)));
    } else {
      // air: our own spin rate, applied by turning the whole car about its centre of mass (sprung wheels would
      // soak up a physical torque). Gas held through the takeoff never spins: release and press again to flip.
      if (dir <= 0 && G.air > 2) G.armed = true;
      const k = dir > 0 ? (G.armed ? 0.9 : 0) : dir < 0 ? 0.9 : 0;
      G.spin = k ? Math.max(-0.11, Math.min(0.11, G.spin - dir * car.air * k)) : G.spin * 0.9;
      if (!k) Body.setAngularVelocity(ch, ch.angularVelocity * 0.98);
      if (Math.abs(G.spin) > 1e-4) for (const bd of [ch, ...C.wheels]) Body.rotate(bd, G.spin, ch.position);
    }
  }
  G.onGround = onGround;
  G.touch[0] = G.touch[1] = false; G.roof = false;
  for (let sub = 0; sub < SUB; sub++) {
    // arcade loop assist: holding gas inside a loop presses the car onto the ring (1.6 g outward); forces reset every update
    if (input.gas && !G.crashed) for (const lp of G.L.loops) {
      const dx = ch.position.x - lp.cx, dy = ch.position.y - lp.cy, d = Math.hypot(dx, dy);
      if (d > lp.r - 70 && d < lp.r + 10 && (lp.state || dx > -10 || dy < 0)) {
        for (const bd of [ch, ...C.wheels]) Body.applyForce(bd, bd.position, { x: dx / d * bd.mass * 0.0008 * 1.6, y: dy / d * bd.mass * 0.0008 * 1.6 });
        if (dy < lp.r * 0.3) Body.setAngularVelocity(ch, ch.angularVelocity + normAng(Math.atan2(-dx, dy) - ch.angle) * 0.04); // keep roof pointing at the centre
      }
    }
    Engine.update(G.engine, STEP / SUB);
  }
  // loops: once past the top, swap which half of the ring the car collides with
  let inB = false;
  for (const lp of G.L.loops) {
    const dx = ch.position.x - lp.cx, dy = ch.position.y - lp.cy, phi = (Math.atan2(dx, dy) + 2 * Math.PI) % (2 * Math.PI);
    if (lp.state === 0 && Math.hypot(dx, dy) < lp.r + 10 && phi > Math.PI + 0.1 && phi < Math.PI + 0.9) lp.state = 1;
    else if (lp.state === 1 && Math.abs(dx) > lp.r + 50) lp.state = 0;
    if (lp.state) inB = true;
  }
  // Matter deep-copies collisionFilter, so every body/part needs its own update
  const mask = CAT.GROUND | CAT.OBJ | (inB ? CAT.LB : CAT.LA);
  for (const bd of C.all) bd.collisionFilter.mask = mask;
  if (G.crashed || G.won) return;
  G.time += STEP;
  if (G.roof && Math.abs(normAng(ch.angle)) > 1.75) G.crashed = 'roof';
  // flips: total rotation between takeoff and an upright landing; 1 flip = 100, 2 = 300, 3 = 600 ...
  if (!(G.touch[0] || G.touch[1])) { if (G.air++ === 0) G.takeoff = ch.angle; }
  else {
    if (G.air > 8 && !G.crashed && Math.abs(normAng(ch.angle)) < 1.3) {
      const rot = ch.angle - G.takeoff, n = Math.floor((Math.abs(rot) + 0.8) / (2 * Math.PI));
      if (n > 0) { const pts = 50 * n * (n + 1); G.flips += n; G.score += pts; G.events.push({ n, back: rot < 0, pts }); }
      else if (G.air > 70) { G.score += 25; G.events.push({ n: 0, pts: 25 }); } // big air bonus
    }
    G.air = 0;
  }
  if (ch.position.y > G.L.maxY + 700) G.crashed = 'fall';
  // standing on the bumper / wedged for 3 s counts as a crash so the player never soft-locks
  G.stuck = Math.abs(normAng(ch.angle)) > 1.3 && Math.hypot(ch.velocity.x, ch.velocity.y) < 1.5 ? (G.stuck || 0) + 1 : 0;
  if (G.stuck > 180) G.crashed = 'stuck';
  if (ch.position.x > G.L.finishX) G.won = true;
}

// Sprite cells become bevelled blocks (light top, dark bottom) on a hi-res canvas, drawn smooth at any angle.
const BK = 12;
function blockCanvas(sp) {
  const c = document.createElement('canvas'); c.width = sp.rows[0].length * BK; c.height = sp.rows.length * BK;
  const g = c.getContext('2d');
  sp.rows.forEach((row, y) => [...row].forEach((ch, x) => {
    const col = sp.palette[ch]; if (ch === '.' || !col) return;
    g.fillStyle = col; g.fillRect(x * BK, y * BK, BK, BK);
    if (ch === 'o') return;
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x * BK, y * BK, BK, 2);
    g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(x * BK, y * BK + BK - 2, BK, 2);
  }));
  return c;
}
const carSprites = {}; for (const d of CARS) carSprites[d.id] = blockCanvas(CAR_SPRITES[d.id]);

const ip = b => b._px === undefined ? { x: b.position.x, y: b.position.y, a: b.angle }
  : { x: b._px + (b.position.x - b._px) * ALPHA, y: b._py + (b.position.y - b._py) * ALPHA, a: b._pa + (b.angle - b._pa) * ALPHA };

function drawWheel(g, x, y, a, r) {
  g.save(); g.translate(x, y); g.rotate(a);
  g.fillStyle = '#15151c'; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#2c2c36'; // tread blocks
  for (let i = 0; i < 10; i++) { g.save(); g.rotate(i * Math.PI / 5); g.fillRect(-r * 0.16, -r, r * 0.32, r * 0.22); g.restore(); }
  g.fillStyle = '#c3c7d2'; g.beginPath(); g.arc(0, 0, r * 0.55, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#7b808d'; g.fillRect(-r * 0.55, -r * 0.1, r * 1.1, r * 0.2); g.fillRect(-r * 0.1, -r * 0.55, r * 0.2, r * 1.1);
  g.fillStyle = '#1a1a24'; g.fillRect(-r * 0.16, -r * 0.16, r * 0.32, r * 0.32);
  g.restore();
}
function drawCarBody(g, d, x, y, a, ox, oy) {
  g.save(); g.translate(x, y); g.rotate(a); g.drawImage(carSprites[d.id], -32 + ox, -14 + oy - 4, 64, 28); g.restore();
}
function blockRect(g, x, y, a, w, h, fill, light, dark) { // bevelled block, the basic look of every prop
  const e = Math.min(4, h / 4);
  g.save(); g.translate(x, y); g.rotate(a);
  g.fillStyle = '#1a1a24'; g.fillRect(-w / 2 - 2, -h / 2 - 2, w + 4, h + 4);
  g.fillStyle = fill; g.fillRect(-w / 2, -h / 2, w, h);
  g.fillStyle = light; g.fillRect(-w / 2, -h / 2, w, e);
  g.fillStyle = dark; g.fillRect(-w / 2, h / 2 - e, w, e);
  g.restore();
}

const patCache = {};
function groundPattern(th) {
  if (patCache[th]) return patCache[th];
  const T = THEMES[th], c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  [[0, 0, T.dirt], [32, 0, T.dirt2], [0, 32, T.dirt2], [32, 32, T.dirt]].forEach(([x, y, col]) => {
    g.fillStyle = col; g.fillRect(x, y, 32, 32);
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x, y, 32, 3); g.fillRect(x, y, 3, 32);
    g.fillStyle = 'rgba(0,0,0,0.14)'; g.fillRect(x, y + 29, 32, 3); g.fillRect(x + 29, y, 3, 32);
  });
  const p = ctx.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix([0.75, 0, 0, 0.75, 0, 0])); // 24 world units per block
  return patCache[th] = p;
}

const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i) * (1 - u) + hash(i + 1) * u; };

function drawBackground(T, c) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const W = view.width, H = view.height, gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, T.sky[0]); gr.addColorStop(1, T.sky[1]); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 6; i++) { // block clouds
    const span = W + 300, cx = ((i * 397 - c.x * S * 0.05 - (G ? G.time : 0) * 0.01 * S) % span + span) % span - 150, cy = (40 + (i * 53) % 140) * S;
    ctx.fillRect(cx, cy, 90 * S, 18 * S); ctx.fillRect(cx + 18 * S, cy - 14 * S, 50 * S, 14 * S);
  }
  const horizon = H * 0.6 - c.y * S * 0.08;
  [[0.12, 130, T.mtn[0], 0.06], [0.25, 90, T.mtn[1], 0.11]].forEach(([par, amp, col, fq], li) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    const step = 14 * S, shift = c.x * par * S; // stepped skyline = block mountains, steps glued to the parallax layer
    for (let k = Math.floor(shift / step) - 1; k * step - shift <= W + step; k++) {
      const x = k * step - shift, h = amp * (noise1(k * fq + li * 50) * 0.7 + noise1(k * fq * 3) * 0.3);
      const top = horizon + li * 50 * S - h * S;
      ctx.lineTo(x, top); ctx.lineTo(x + step, top);
    }
    ctx.lineTo(W, H); ctx.fill();
  });
}

function drawWorld(G, c) {
  const T = THEMES[LEVELS[G.lvl].theme];
  ctx.setTransform(S, 0, 0, S, view.width / 2 - c.x * S, view.height / 2 - c.y * S);
  const left = c.x - VW / 2 - 50, right = c.x + VW / 2 + 50, bottom = c.y + VH / 2 + 50;
  for (const lp of G.L.loops) {
    ctx.lineWidth = 44; ctx.strokeStyle = '#1a1a24'; ctx.beginPath(); ctx.arc(lp.cx, lp.cy, lp.r + 20, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 36; ctx.strokeStyle = '#8d99ae'; ctx.beginPath(); ctx.arc(lp.cx, lp.cy, lp.r + 20, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = '#ffb000'; ctx.setLineDash([18, 18]); ctx.beginPath(); ctx.arc(lp.cx, lp.cy, lp.r + 20, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  const fy = groundY(G.L, G.L.finishX);
  ctx.fillStyle = '#1a1a24'; ctx.fillRect(G.L.finishX - 4, fy - 200, 8, 200);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 6; j++) { ctx.fillStyle = (i + j) % 2 ? '#fff' : '#1a1a24'; ctx.fillRect(G.L.finishX + 4 + j * 12, fy - 200 + i * 12, 12, 12); }
  ctx.fillStyle = '#1a1a24'; ctx.fillRect(-120, -110, 6, 110); ctx.fillStyle = '#2ecc71'; ctx.fillRect(-114, -110, 50, 28);
  for (const o of G.dyn) drawObj(o);
  const { C, car } = G, ch = ip(C.chassis);
  for (const w of C.wheels) { const p = ip(w); drawWheel(ctx, p.x, p.y, p.a, car.wr); }
  drawCarBody(ctx, car, ch.x, ch.y, ch.a, C.off.x, C.off.y);
  ctx.fillStyle = groundPattern(LEVELS[G.lvl].theme); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const c of G.L.chains) {
    if (c[c.length - 1][0] < left || c[0][0] > right) continue;
    ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]);
    for (const p of c) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(c[c.length - 1][0], bottom); ctx.lineTo(c[0][0], bottom); ctx.closePath(); ctx.fill();
    const line = (w, col, dy) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); c.forEach((p, i) => i ? ctx.lineTo(p[0], p[1] + dy) : ctx.moveTo(p[0], p[1] + dy)); ctx.stroke(); };
    line(16, 'rgba(0,0,0,0.18)', 9); line(14, T.grass, 5); line(5, T.grass2, 1);
  }
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
}
function groundY(L, x) { for (const c of L.chains) for (let i = 1; i < c.length; i++) if (c[i - 1][0] <= x && c[i][0] >= x) return c[i][1]; return 0; }

function drawObj(o) {
  if (o.t === 'crate') {
    const p = ip(o.b); blockRect(ctx, p.x, p.y, p.a, o.s - 2, o.s - 2, '#c8873a', '#e8a85a', '#8a5a26');
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.strokeStyle = '#7a4a1a'; ctx.lineWidth = 3;
    const h = o.s / 2 - 5; ctx.beginPath(); ctx.moveTo(-h, -h); ctx.lineTo(h, h); ctx.moveTo(h, -h); ctx.lineTo(-h, h); ctx.stroke(); ctx.restore();
  } else if (o.t === 'barrel') {
    const p = ip(o.b); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.fillStyle = '#1a1a24'; ctx.beginPath(); ctx.arc(0, 0, o.r + 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d63c3c'; ctx.beginPath(); ctx.arc(0, 0, o.r - 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd84a'; ctx.fillRect(-o.r + 1, -2.5, o.r * 2 - 2, 5); ctx.restore();
  } else if (o.t === 'seesaw') {
    ctx.fillStyle = '#1a1a24'; ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x - 26, o.y + 36); ctx.lineTo(o.x + 26, o.y + 36); ctx.fill();
    ctx.fillStyle = '#8d99ae'; ctx.beginPath(); ctx.moveTo(o.x, o.y + 6); ctx.lineTo(o.x - 18, o.y + 34); ctx.lineTo(o.x + 18, o.y + 34); ctx.fill();
    const p = ip(o.b); blockRect(ctx, p.x, p.y, p.a, o.len, 12, '#b07a3a', '#d8a060', '#7a5224');
  } else if (o.t === 'bridge') {
    const pl = o.planks.map(ip), w = (o.x2 - o.x1) / o.planks.length;
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(o.x1, o.y1); pl.forEach(p => ctx.lineTo(p.x, p.y)); ctx.lineTo(o.x2, o.y2); ctx.stroke();
    pl.forEach(p => blockRect(ctx, p.x, p.y, p.a, w - 4, 8, '#b07a3a', '#d8a060', '#7a5224'));
  } else if (o.t === 'pendulum') {
    const p = ip(o.b);
    blockRect(ctx, o.x, o.y - 4, 0, 60, 10, '#4a4e69', '#6b6f8c', '#2b2d42');
    ctx.strokeStyle = '#5c606c'; ctx.lineWidth = 5; ctx.setLineDash([9, 6]); ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#1a1a24'; ctx.beginPath(); ctx.arc(p.x, p.y, 29, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a4e69'; ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8d99ae'; ctx.fillRect(p.x - 13, p.y - 15, 9, 9);
  }
}

// ---------- particles & audio ----------
const parts = [];
function puff(x, y, c, n, sp = 2) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * sp * 2, vy: -Math.random() * sp * 1.5, life: 30 + Math.random() * 30, c, s: 4 + (Math.random() * 3 | 0) * 3 }); }
function updParts() { for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; if (--p.life <= 0) parts.splice(i, 1); } }

let eng = null;
function engineSound(on, rpm) {
  const ac = ArcadeCore.getAudioContext(); if (!ac) return;
  if (!eng) {
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(); eng = { o, g };
  }
  const t = ac.currentTime;
  eng.o.frequency.setTargetAtTime(45 + rpm * 110, t, 0.05);
  eng.g.gain.setTargetAtTime(on && !ArcadeCore.isMuted() ? 0.035 + Math.min(0.03, rpm * 0.03) : 0, t, 0.08);
}

// ---------- game flow ----------
const SAVE_KEY = 'schrottkiste_v1';
let save = { unlocked: 0, best: {}, pts: {}, car: 'kaefer' };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

let G = null, cam = { x: 0, y: 0 }, running = false, crashTimer = 0, wasGround = true;
const input = { gas: false, brake: false };
const $ = id => document.getElementById(id);

function startLevel(i) {
  const car = CARS.find(c => c.id === save.car) || CARS[0];
  G = createGame(i, car); G.lvl = i; parts.length = 0; crashTimer = 0; acc = 0;
  cam.x = camPrev.x = G.C.chassis.position.x + 120; cam.y = camPrev.y = G.C.chassis.position.y - 40;
  $('menu').classList.add('hide'); $('win').classList.add('hide'); $('banner').style.display = 'none'; $('pop').className = '';
  $('hLv').textContent = `${i + 1}. ${LEVELS[i].name}`;
  running = true;
}
function carPreview(d) {
  const cv = document.createElement('canvas'), k = 2; cv.width = 128 * k; cv.height = 72 * k;
  const g = cv.getContext('2d'); g.setTransform(k * 1.6, 0, 0, k * 1.6, 64 * k, 30 * k);
  d.wx.forEach(wx => drawWheel(g, wx, d.wy, 0, d.wr));
  drawCarBody(g, d, 0, 0, 0, 0, 0);
  return cv;
}
function showMenu() {
  running = false; engineSound(false, 0);
  $('win').classList.add('hide'); $('menu').classList.remove('hide');
  const cl = $('carList'); cl.innerHTML = '';
  const mx = { speed: 1.15, torque: 0.22, grip: 1.2 };
  for (const d of CARS) {
    const locked = save.unlocked < d.unlock, el = document.createElement('div');
    el.className = 'carc' + (save.car === d.id ? ' sel' : '') + (locked ? ' locked' : '');
    el.appendChild(carPreview(d));
    el.insertAdjacentHTML('beforeend', `<b>${d.name}</b>${locked ? `🔒 Level ${d.unlock} schaffen` : d.desc}` +
      ['speed', 'torque', 'grip'].map((k, i) => `<div class="stat">${['Tempo', 'Kraft', 'Grip'][i]}<span><i style="width:${Math.round(d[k] / mx[k] * 100)}%"></i></span></div>`).join(''));
    if (!locked) el.onclick = () => { save.car = d.id; persist(); showMenu(); };
    cl.appendChild(el);
  }
  const ll = $('lvlList'); ll.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const bt = document.createElement('button');
    bt.disabled = i > save.unlocked;
    bt.innerHTML = `${i + 1}<br>${lv.name}<br><small>${save.best[i] ? (save.best[i] / 1000).toFixed(1) + 's' + (save.pts[i] ? ' · ' + save.pts[i] + 'P' : '') : i > save.unlocked ? '🔒' : '—'}</small>`;
    bt.onclick = () => startLevel(i);
    ll.appendChild(bt);
  });
}
function onWin() {
  running = false; engineSound(false, 0); ArcadeCore.powerup();
  const i = G.lvl, t = G.time, prev = save.best[i], prevPts = save.pts[i] || 0;
  if (!prev || t < prev) save.best[i] = Math.round(t);
  if (G.score > prevPts) save.pts[i] = G.score;
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length - 1, i + 1));
  if (i === LEVELS.length - 1) save.unlocked = LEVELS.length; // all done -> every car unlocked
  persist();
  const newCar = CARS.find(c => c.unlock === i + 1);
  $('winTxt').innerHTML = `${LEVELS[i].name}: <b>${(t / 1000).toFixed(2)} s</b>${!prev || t < prev ? ' · Neue Bestzeit!' : ` · Bestzeit ${(prev / 1000).toFixed(2)} s`}` +
    `<br>Saltos: <b>${G.flips}</b> · Punkte: <b>${G.score}</b>${G.score > prevPts ? ' · Rekord!' : ` · Rekord ${prevPts}`}` +
    (newCar ? `<br>🔓 Neues Auto: <b>${newCar.name}</b>` : '');
  $('wNext').style.display = i < LEVELS.length - 1 ? '' : 'none';
  $('win').classList.remove('hide');
}
function popup(ev) {
  const el = $('pop');
  el.textContent = ev.n ? `${ev.n > 1 ? ev.n + 'x ' : ''}${ev.back ? 'Rückwärts' : 'Vorwärts'}salto! +${ev.pts}` : `Weiter Sprung! +${ev.pts}`;
  el.className = ''; void el.offsetWidth; el.className = 'show';
  if (ev.n) ArcadeCore.coin(); else ArcadeCore.playTone(660, 0.1, 'square', 0.05);
}

let acc = 0, last = performance.now();
const camPrev = { x: 0, y: 0 }, camNow = { x: 0, y: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(100, now - last); last = now;
  if (G && running) {
    acc += dt;
    while (acc >= STEP) {
      acc -= STEP;
      stepGame(G, G.crashed ? {} : input);
      const ch = G.C.chassis;
      if (G.onGround && !wasGround) ArcadeCore.playTone(90, 0.08, 'square', 0.06);
      wasGround = G.onGround;
      while (G.events.length) popup(G.events.shift());
      if (G.onGround && (input.gas || input.brake) && Math.random() < 0.4) { const w = G.C.wheels[input.gas ? 0 : 1]; puff(w.position.x, w.position.y + G.car.wr, THEMES[LEVELS[G.lvl].theme].dirt, 1, 1.5); }
      updParts();
      // camera advances per physics tick; the renderer interpolates between ticks
      camPrev.x = cam.x; camPrev.y = cam.y;
      const tx = ch.position.x + Math.max(-60, Math.min(160, ch.velocity.x * 14)), ty = ch.position.y - 40;
      cam.x += (tx - cam.x) * 0.08; cam.y += (ty - cam.y) * 0.08;
      if (G.crashed && !crashTimer) { crashTimer = 1; ArcadeCore.explosion(); puff(ch.position.x, ch.position.y, '#ffb000', 25, 5); puff(ch.position.x, ch.position.y, '#1a1a24', 15, 4); $('banner').style.display = 'block'; }
      if (crashTimer && ++crashTimer > 75) { startLevel(G.lvl); break; }
      if (G.won) { onWin(); break; }
    }
    if (G) {
      const ch = G.C.chassis, rpm = Math.abs(G.C.wheels[0].angularVelocity) / G.car.speed;
      engineSound(running && !G.crashed, rpm);
      $('hTm').textContent = (G.time / 1000).toFixed(2);
      $('hPts').textContent = G.score ? G.score + ' P' : '';
      $('hBar').style.width = Math.max(0, Math.min(100, ch.position.x / G.L.finishX * 100)) + '%';
    }
  }
  ALPHA = running ? acc / STEP : 1;
  camNow.x = camPrev.x + (cam.x - camPrev.x) * ALPHA; camNow.y = camPrev.y + (cam.y - camPrev.y) * ALPHA;
  if (G) { drawBackground(THEMES[LEVELS[G.lvl].theme], camNow); drawWorld(G, camNow); }
  else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#2b2d42'; ctx.fillRect(0, 0, view.width, view.height); }
}

// ---------- input ----------
const KEYS = { ArrowRight: 'gas', KeyD: 'gas', ArrowUp: 'gas', KeyW: 'gas', ArrowLeft: 'brake', KeyA: 'brake', ArrowDown: 'brake', KeyS: 'brake' };
addEventListener('keydown', e => {
  if (KEYS[e.code]) { input[KEYS[e.code]] = true; e.preventDefault(); }
  else if (e.code === 'KeyR' && G && $('menu').classList.contains('hide')) startLevel(G.lvl);
  else if (e.code === 'Escape') showMenu();
  else if ((e.code === 'Enter' || e.code === 'Space') && !$('win').classList.contains('hide')) $('wNext').style.display !== 'none' ? $('wNext').click() : $('wRetry').click();
});
addEventListener('keyup', e => { if (KEYS[e.code]) input[KEYS[e.code]] = false; });
addEventListener('blur', () => { input.gas = input.brake = false; });
for (const [id, k] of [['pGas', 'gas'], ['pBrake', 'brake']]) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); input[k] = true; el.classList.add('on'); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, () => { input[k] = false; el.classList.remove('on'); });
}
if (matchMedia('(pointer: coarse)').matches) for (const id of ['pGas', 'pBrake']) $(id).style.display = 'block';
$('rBtn').onclick = () => G && startLevel(G.lvl);
$('menuBtn').onclick = showMenu;
$('wNext').onclick = () => startLevel(G.lvl + 1);
$('wRetry').onclick = () => startLevel(G.lvl);
$('wMenu').onclick = showMenu;
const mb = $('muteBtn'), syncMute = () => mb.textContent = ArcadeCore.isMuted() ? '🔇' : '🔊';
mb.onclick = () => { ArcadeCore.toggleMute(); syncMute(); }; syncMute();

startLevel(Math.min(save.unlocked, LEVELS.length - 1)); running = false; showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
