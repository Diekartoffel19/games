<style>

<script>
(() => {
'use strict';

// ============ ArcadeCore ============
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const KEY = 'eisangler_best'; // Gramm

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const kg = g => (g / 1000).toFixed(2).replace('.', ',') + ' kg';
const V3 = THREE.Vector3, UP = new V3(0, 1, 0);

const DATA = window.EISANGLER_MODELS;
if (!DATA) { $('mText').textContent = 'Modelle (models/eisangler_models.js) konnten nicht geladen werden.'; $('modal').style.display = 'flex'; $('mBtn').hidden = true; return; }

// ============ Tuning ============
const LAKE_R = 60, DAY_LEN = 300, LIVES = 3;
const WALK = 3.2, THIN = 11;                     // unter 11 cm Eis knackt es
const SHACK = new V3(0, 0, 40), WARM_R = 5.5; // Ofenwärme reicht durch die offene Tür
const GREEN = [0.3, 0.8], SLACK = 0.22, SNAP = 0.92;
// Arten: Gewicht kg, Länge-Faktor (m pro kg^1/3), Kraft, Ausdauer-Verbrauch
const SPECIES = {
  barsch:   { name: 'Barsch',   emoji: '🐟', kg: [0.15, 1.4], len: 0.38, power: 0.75, tire: 0.07 },
  hecht:    { name: 'Hecht',    emoji: '🐊', kg: [1.5, 8.5],  len: 0.54, power: 1.0,  tire: 0.045 },
  zander:   { name: 'Zander',   emoji: '🐠', kg: [0.8, 5.5],  len: 0.48, power: 1.0,  tire: 0.05 },
  saibling: { name: 'Goldener Saibling', emoji: '✨', kg: [0.8, 3.5], len: 0.44, power: 1.05, tire: 0.04 },
};

// ============ Renderer ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd9a98e, 45, 230);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 700);
function fitCamera() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 80 : 62;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
fitCamera(); addEventListener('resize', fitCamera);

// ============ Licht & Himmel ============
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x8a9bb0, 0.5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb070, 0.8);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
const SKY = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: new V3() }, sunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 24, 12), new THREE.ShaderMaterial({
  uniforms: SKY, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vP;
    void main(){ vec3 d = normalize(vP); float h = d.y;
      vec3 c = mix(hor, top, smoothstep(-0.02, 0.45, h));
      float s = max(dot(d, sunDir), 0.0);
      c += sunCol * (pow(s, 600.0) * 2.0 + pow(s, 12.0) * 0.35);
      gl_FragColor = vec4(c, 1.0); }`,
}));
scene.add(sky);
// Tageslauf-Stützpunkte: t, Himmel oben, Horizont/Nebel, Sonnenfarbe, Sonnen-Stärke, Himmelslicht
const KEYS = [
  [0.0, '#34477a', '#f0a07a', '#ff9a5a', 0.7, 0.55],
  [0.2, '#5d8cc4', '#f3cfae', '#ffd9b0', 0.95, 0.6],
  [0.55, '#5a8ec8', '#dbe7f0', '#fff4e6', 1.1, 0.7],
  [0.82, '#4a5a8c', '#f0a070', '#ff9050', 0.75, 0.5],
  [1.0, '#1a2140', '#7d4565', '#c0506a', 0.2, 0.28],
].map(k => [k[0], new THREE.Color(k[1]), new THREE.Color(k[2]), new THREE.Color(k[3]), k[4], k[5]]);
const _ca = new THREE.Color();
function applyDaylight(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const a = KEYS[i], b = KEYS[i + 1], f = clamp((t - a[0]) / (b[0] - a[0]), 0, 1);
  SKY.top.value.copy(a[1]).lerp(b[1], f); SKY.hor.value.copy(a[2]).lerp(b[2], f);
  scene.fog.color.copy(SKY.hor.value); renderer.setClearColor(SKY.hor.value);
  sun.color.copy(a[3]).lerp(b[3], f); SKY.sunCol.value.copy(sun.color);
  sun.intensity = a[4] + (b[4] - a[4]) * f; hemi.intensity = a[5] + (b[5] - a[5]) * f;
  hemi.color.copy(_ca.set(0xcfe3ff).lerp(SKY.hor.value, 0.3));
  // Sonne von Osten (+x) nach Westen, flach wie im Winter
  const az = Math.PI * t, el = 0.05 + 0.38 * Math.sin(Math.PI * t);
  SKY.sunDir.value.set(Math.cos(az) * Math.cos(el), Math.sin(el), -0.55).normalize();
}

// ============ Modelle aus Blender ============
const RAW = {}; DATA.objects.forEach(o => { RAW[o.n] = o; });
const GEO = {};
// Nicht-indiziert + Vertex-Farben je Material-Gruppe -> flache Low-Poly-Schattierung, ein Material für alles
function geoOf(n) {
  if (GEO[n]) return GEO[n];
  const o = RAW[n], pos = [], col = [], c = new THREE.Color();
  o.g.forEach(([hex, idx]) => {
    c.set('#' + hex);
    for (const i of idx) { pos.push(o.v[3 * i], o.v[3 * i + 1], o.v[3 * i + 2]); col.push(c.r, c.g, c.b); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals(); g.computeBoundingSphere();
  return (GEO[n] = g);
}
const MAT = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
function mesh(n, m = MAT, shadow = true) { const me = new THREE.Mesh(geoOf(n), m); me.castShadow = shadow; return me; }

// ============ Welt ============
// Eisdicke (cm) & Seetiefe (m): pro Tag neu ausgewürfelt
let thinSpots = [], depthSeed = 0;
function thick(x, z) {
  let t = 24 + 5 * Math.sin(x * 0.05 + depthSeed) * Math.cos(z * 0.043 - depthSeed);
  for (const s of thinSpots) {
    const d = Math.hypot(x - s.x, z - s.z) / s.r;
    if (d < 1) t -= s.k * (1 - d * d) * (1 - d * d);
  }
  const ds = Math.hypot(x - SHACK.x, z - SHACK.z);
  if (ds < 12) t = Math.max(t, 22);
  return clamp(t, 3, 34);
}
function lakeDepth(x, z) {
  const r = Math.hypot(x, z) / LAKE_R;
  return clamp(1.5 + 15 * (1 - r * r) * (0.72 + 0.28 * Math.sin(x * 0.07 + depthSeed * 2) * Math.cos(z * 0.06)), 1.2, 17);
}

const ICE_SEG = 120, ICE_SIZE = 2 * LAKE_R + 10;
const iceGeo = new THREE.PlaneGeometry(ICE_SIZE, ICE_SIZE, ICE_SEG, ICE_SEG); iceGeo.rotateX(-Math.PI / 2);

// ============ Sonar ============
function useSonar() {
  if (state !== 'play' || sonarCD > 0 || player.sink > 0) return;
  sonarCD = 9; sonarT = 0; sfx.sonar();
  sonarSet = schools.filter(s => s.n > 0 && Math.hypot(s.x - player.pos.x, s.z - player.pos.z) < 30);
  sonarRing.position.x = player.pos.x; sonarRing.position.z = player.pos.z;
}
function updateSonar(dt) {
  sonarCD = Math.max(0, sonarCD - dt);
  ghosts.forEach(g => { g.visible = false; });
  schoolMarks.forEach(m => { m.visible = false; });
  if (sonarT < 0) { sonarRing.material.opacity = 0; return; }
  sonarT += dt;
  const R = sonarT * 26;
  sonarRing.scale.setScalar(Math.max(0.01, R)); sonarRing.material.opacity = Math.max(0, 0.8 - sonarT * 0.7);
  const fade = clamp((5 - sonarT) / 1.2, 0, 1);
  GHOST_MAT.opacity = 0.85 * fade;
  const used = {};
  sonarSet.forEach((s, si) => {
    const d = Math.hypot(s.x - sonarRing.position.x, s.z - sonarRing.position.z);
    if (d > R) return;
    const m = schoolMarks[si % schoolMarks.length];
    m.visible = true; m.position.x = s.x; m.position.z = s.z; m.scale.setScalar(s.r); m.material.opacity = 0.45 * fade;
    m.material.color.set(s.sp === 'saibling' ? 0xfbbf24 : 0x67e8f9);
    const n = Math.min(s.n, 6);
    for (let k = 0; k < n; k++) {
      const pool = GHOSTS[s.sp]; used[s.sp] = (used[s.sp] || 0); const g = pool[used[s.sp]++ % pool.length];
      const a = day * 0.6 + k / n * Math.PI * 2 + s.ph, rr = s.r * (0.25 + 0.12 * (k % 3));
      g.visible = true; g.position.set(s.x + Math.cos(a) * rr, 0.04, s.z + Math.sin(a) * rr);
      g.rotation.y = -a - Math.PI / 2; // tangential schwimmen
      g.scale.setScalar(SPECIES[s.sp].len * 1.8);
    }

}

// ============ Update ============
const _t1 = new V3(), _t2 = new V3(), _cam = new V3(), _look = new V3();
function updatePlayer(dt) {
  // Kamera drehen
  camYaw -= mouseDX * 0.0028 + lookDX * 0.006 + ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * 2.2 * dt;
  camPitch = clamp(camPitch + mouseDY * 0.002 + lookDY * 0.004 + ((keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0)) * 1.2 * dt, 0.05, 1.1);
  // beim Angeln dreht die Kamera langsam seitlich, damit Loch, Rute & Schnur sichtbar sind
  if ((player.mode === 'fish' || player.mode === 'fight' || player.mode === 'land') && !mouseDX && !lookDX) {
    let d = player.yaw + 0.85 - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); camYaw += d * Math.min(1, 2 * dt);
  }
  mouseDX = mouseDY = lookDX = lookDY = 0;

  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stickX, iy = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stickY;
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  let mx = fx * iy - fz * ix, mz = fz * iy + fx * ix;
  const canMove = (player.mode === 'walk' || player.mode === 'fish') && player.sink <= 0;
  const moving = canMove && il > 0.1;
  if (moving && player.mode === 'fish') { setMode('walk'); holdUsed = true; showMsg('Angel eingeholt', 0.8); }
  const spd = WALK * (warmth < 20 ? 0.7 : 1);
  _t1.set(moving ? mx * spd : 0, 0, moving ? mz * spd : 0);
  player.vel.lerp(_t1, 1 - Math.exp(-10 * dt));
  player.pos.addScaledVector(player.vel, dt);
  if (moving) { let d = Math.atan2(mx, mz) - player.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); player.yaw += d * Math.min(1, 12 * dt); }
  // Seerand & Hütte
  const r = Math.hypot(player.pos.x, player.pos.z); if (r > LAKE_R - 1.5) player.pos.multiplyScalar((LAKE_R - 1.5) / r);
  const lx = player.pos.x - SHACK.x, lz = player.pos.z - SHACK.z;
  if (Math.abs(lx) < 1.9 && Math.abs(lz) < 1.7) {
    if (1.9 - Math.abs(lx) < 1.7 - Math.abs(lz)) player.pos.x = SHACK.x + Math.sign(lx) * 1.9; else player.pos.z = SHACK.z + Math.sign(lz) * 1.7;
  }
  const speed = player.vel.length();

  // Bohren
  const near = player.mode === 'walk' ? nearHole() : null;
  const drilling = player.mode === 'walk' && actionHeld && !holdUsed && !near && speed < 0.4 && player.sink <= 0;
  if (actionPressed && player.mode === 'walk' && near) castLine(near);
  else if (actionPressed && player.mode === 'fish') {
    if (bite > 0) startFight();
    else { setMode('walk'); holdUsed = true; }
  }
  if (drilling) {
    if (drillT === 0) { const f = frontPoint(_t2); drillNeed = 0.9 + thick(f.x, f.z) / 16; }
    drillT += dt;
    drillTick -= dt; if (drillTick <= 0) { drillTick = 0.09; sfx.drill(); }
    const f = frontPoint(_t2); f.y = 0.05; if (Math.random() < dt * 30) spawnChip(f);
    if (drillT >= drillNeed) {
      const t = thick(f.x, f.z);
      addHole(f.x, f.z); drillT = 0; holdUsed = true;
      noise(0.3, { freq: 500, gain: 0.12, filter: 'lowpass' });
      showMsg(`🕳️ Durch!<small>Eisdicke ${Math.round(t)} cm${t < THIN ? ' – dünn!' : t < 16 ? ' – na ja' : ''}</small>`, 1.6);
    }
  } else { drillT = Math.max(0, drillT - dt * 2); if (drillT < 0.05) drillT = 0; }
  auger.visible = drilling;
  $('ring').style.opacity = drillT > 0 ? 1 : 0; $('ring').style.setProperty('--p', (drillT / drillNeed * 100) + '%');

  // Warten auf Biss
  if (player.mode === 'fish') {
    if (bite > 0) {
      bite -= dt;
      if (bite <= 0) { showMsg('Zu spät!<small>Der Fisch hat den Köder geklaut.</small>', 1.4); nextBite(); }
    } else if ((waitT -= dt) <= 0) {
      bite = 1.3; biteDip = 0; sfx.plop(); setTimeout(sfx.plop, 260);
      showMsg('❗ Biss!<small>Die Pose taucht ab – jetzt anschlagen!</small>', 1.2);
    }
  }
  if (player.mode === 'fight') updateFight(dt);
  if (player.mode === 'land' && (landT -= dt) <= 0) { if (showFish) { scene.remove(showFish); showFish = null; } setMode('walk'); }

  // Dünnes Eis: wer stillsteht, belastet es
  const t = thick(player.pos.x, player.pos.z);
  if (player.sink > 0) {
    player.sink += dt;
    if (player.sink > 1.6) { if (lives <= 0) endDay(true); else respawn(); }
  } else if (t < THIN && speed < 0.6) {
    stress += dt * (THIN - t) / 15;

      curCrack = new THREE.LineSegments(crackGeo(), CRACK_MAT); curCrack.position.set(player.pos.x, 0.015, player.pos.z); curCrack.rotation.y = rnd(0, 6.3);
      scene.add(curCrack); cracks.push(curCrack);
      if (cracks.length > 14) { const c = cracks.shift(); scene.remove(c); c.geometry.dispose(); }
    }

    if (step > crackStep) { crackStep = step; sfx.crack(true); shake = 0.15 + stress * 0.2; showMsg(step >= 3 ? '⚠️ Knaaacks!<small>Sofort weg hier!</small>' : '⚠️ Knacks!<small>Das Eis verliert langsam das Vertrauen in dich.</small>', 1.3); }
    if (stress >= 1) breakIn();
  } else {
    stress = Math.max(0, stress - dt * 0.35); crackStep = Math.floor(stress * 4);

  // Schritte

  // Modell & Animation
  pRoot.position.set(player.pos.x, -Math.min(1.4, player.sink * 1.2), player.pos.z);
  pRoot.rotation.y = player.yaw;
  player.walk += dt * speed * 3.2;
  const sw = Math.sin(player.walk) * Math.min(1, speed / WALK) * 0.6;
  parts.legL.rotation.x = sw; parts.legR.rotation.x = -sw;
  let aL = -sw * 0.8, aR = sw * 0.8, bodyTilt = 0;
  if (drilling) {
    auger.position.set(0, -0.35 + 0.1 * (1 - drillT / drillNeed), 0.62); auger.rotation.y += dt * 14;
    aL = aR = -0.9; bodyTilt = 0.2;
    parts.armL.rotation.z = -0.25; parts.armR.rotation.z = 0.25;
  } else { parts.armL.rotation.z = 0; parts.armR.rotation.z = 0; }
  if (player.mode === 'fish' || player.mode === 'fight' || player.mode === 'land') {
    aR = -0.7 + (player.mode === 'fight' ? -0.25 - (fish ? fish.pull * 0.4 : 0) + Math.sin(day * 25) * (actionHeld ? 0.06 : 0) : 0);
    aL = player.mode === 'fight' && actionHeld ? -0.8 + Math.sin(day * 18) * 0.15 : -0.2;
    rod.rotation.x = 1.05 + (fish ? fish.pull * 0.35 : 0);

  }
  if (player.sink > 0) { aL = aR = -2.6; }
  parts.armL.rotation.x += (aL - parts.armL.rotation.x) * Math.min(1, 12 * dt);

  if (line.visible && hole) {
    pRoot.updateMatrixWorld(true);
    const tip = rod.localToWorld(_t1.copy(rodTip));
    if (bite > 0) { biteDip += dt; bobber.position.y = 0.02 - Math.abs(Math.sin(biteDip * 9)) * 0.06; }
    else bobber.position.y = player.mode === 'fight' ? -0.05 : 0.02 + Math.sin(day * 2.4) * 0.005;
    bobber.visible = player.mode === 'fish';
    const p = lineGeo.attributes.position;
    p.setXYZ(0, tip.x, tip.y, tip.z); p.setXYZ(1, hole.x, player.mode === 'fight' ? -0.3 : bobber.position.y + 0.04, hole.z); p.needsUpdate = true;
  }
  if (showFish) {
    showFish.position.set(player.pos.x + Math.sin(player.yaw) * 0.45, 1.55, player.pos.z + Math.cos(player.yaw) * 0.45);
    showFish.rotation.set(0, player.yaw, Math.sin(day * 14) * 0.3); // seitlich zur Kamera, zappelt
  }

  // Kamera: über die Schulter
  const cp = Math.cos(camPitch);

  for (let k = 0; k < 12; k++) { // nicht durch die Hüttenwand schauen
    _cam.set(player.pos.x - fx * cp * dist - fz * 0.55, 1.3 + Math.sin(camPitch) * dist + pRoot.position.y, player.pos.z - fz * cp * dist + fx * 0.55);

function breakIn() {
  stress = 0; crackStep = 0; player.sink = 0.01; lives--; wet = 25; warmth = Math.max(0, warmth - 35);
  setMode('walk'); fish = null;
  addHole(player.pos.x, player.pos.z, 4.5); curCrack = null;
  sfx.crack(true); sfx.splash(); flashT = 1; shake = 0.6;
  if (lives <= 0) showMsg('🧊 Eingebrochen!', 2);
  else showMsg(`🧊 Eingebrochen!<small>Noch ${lives} Leben – zurück zur Hütte, trocknen!</small>`, 2.6);
}

function updateWorld(dt) {
  // Schwärme ziehen langsam Kreise
  schools.forEach(s => { s.ph += dt / s.drift; s.x = s.cx + Math.cos(s.ph) * 4; s.z = s.cz + Math.sin(s.ph) * 4; });
  // Wärme
  const dShack = Math.hypot(player.pos.x - SHACK.x, player.pos.z - SHACK.z);
  const atStove = dShack < WARM_R && player.sink <= 0;
  if (atStove) {
    warmth = Math.min(100, warmth + 28 * dt); wet = Math.max(0, wet - dt * 4);
    if (warmth > 99 && !warmedMsg) { warmedMsg = true; showMsg('🔥 Endlich warm!<small>Jetzt tauen sogar die Finger wieder auf.</small>', 1.6); }
    crackleT -= dt; if (crackleT <= 0) { crackleT = rnd(0.05, 0.3); sfx.crackle(); }
  } else if (player.sink <= 0) {
    warmth -= dt * (100 / 95) * (1 + (day / DAY_LEN > 0.75 ? 0.4 : 0) + (wet > 0 ? 1.5 : 0)) * (player.mode === 'fight' ? 0.7 : 1);
    wet = Math.max(0, wet - dt);
    if (warmth < 60) warmedMsg = false;
    if (warmth <= 0) {
      lives--; flashT = 0.6; snd('hit');
      if (lives <= 0) { warmth = 0; endDay(true); return; }
      warmth = 100; respawn(); showMsg(`🥶 Unterkühlt!<small>Man trägt dich zur Hütte. Noch ${lives} Leben.</small>`, 2.6);
    }
  }
  $('frost').style.opacity = clamp((35 - warmth) / 35, 0, 0.9);
  stoveLight.intensity = 1.1 + Math.sin(day * 13) * 0.15 + Math.sin(day * 31) * 0.1;
  // Rauch
  smoke.forEach(s => {
    s.userData.t += dt; const k = s.userData.t % 4 / 4;
    s.position.set(CHIMNEY.x + k * 1.6 + Math.sin(k * 6 + s.id) * 0.2, CHIMNEY.y + k * 4, CHIMNEY.z + k * 0.6);
    s.scale.setScalar(0.5 + k * 2.2); s.material.opacity = 0.55 * (1 - k);
  });
  // Späne
  chips.forEach(c => {
    if (!c.visible) return;
    c.userData.life -= dt; if (c.userData.life <= 0 || c.position.y < 0) { c.visible = false; return; }
    c.userData.v.y -= 9 * dt; c.position.addScaledVector(c.userData.v, dt); c.rotation.x += dt * 8;
  });

  }
  snowGeo.attributes.position.needsUpdate = true;
  snowPts.position.set(Math.round(player.pos.x / 60) * 60, 0, Math.round(player.pos.z / 60) * 60);
  // Licht & Schatten folgen dem Spieler

  sun.position.copy(player.pos).addScaledVector(SKY.sunDir.value, 60); sun.target.position.copy(player.pos);
  sky.position.copy(camera.position);
}

function updateHud() {

  $('hBest').textContent = kg(Math.max(best, total));

function endDay(rescued) {

  snd(record ? 'powerup' : 'gameOver');
  const heavy = catchList.reduce((a, c) => c.g > (a ? a.g : 0) ? c : a, null);
  const gold = catchList.filter(c => c.sp === 'saibling').length;
  openModal(record ? '🏆 Neuer Rekord!' : rescued ? '🚑 Gerettet' : '🌆 Feierabend',
    rescued ? 'Die Bergwacht hat dich vom Eis geholt. Der Fang zählt trotzdem.' : 'Die Dämmerung legt sich über den See. Zeit, die Fische zu wiegen.',
    'Neuer Tag', [['Gesamtgewicht', kg(total)], ['Fische', catchList.length], ['Größter', heavy ? SPECIES[heavy.sp].name.replace('Goldener ', '') + ' ' + kg(heavy.g) : '–'], ['Gold-Saiblinge', gold], ['Rekord', kg(best)], ['Löcher gebohrt', holes.filter(h => !h.big).length]]);
}

  stickX = stickY = 0; stickId = null; lookId = null; knob.style.transform = ''; $('ring').style.opacity = 0;
  document.querySelectorAll('.tbtn.on').forEach(el => el.classList.remove('on'));

// ============ Eingabe ============
const canvas = renderer.domElement;
let pointerLocked = false;
function lockPointer() { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
document.addEventListener('pointerlockchange', () => {
  const now = document.pointerLockElement === canvas;
  if (pointerLocked && !now && state === 'play') pause();
  pointerLocked = now;
});
document.addEventListener('mousemove', e => { if (pointerLocked && state === 'play') { mouseDX += e.movementX; mouseDY += e.movementY; } });
function actDown() { if (state !== 'play' || actionHeld) return; actionHeld = true; actionPressed = true; holdUsed = false; }
function actUp() { actionHeld = false; holdUsed = false; }
let lookId = null, lookX = 0, lookY = 0;
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') { if (e.button !== 0) return; if (!pointerLocked) { lockPointer(); return; } actDown(); }
  else { setTouch(); lookId = e.pointerId; lookX = e.clientX; lookY = e.clientY; }
});
canvas.addEventListener('pointermove', e => { if (e.pointerId === lookId) { lookDX += e.clientX - lookX; lookDY += e.clientY - lookY; lookX = e.clientX; lookY = e.clientY; } });
addEventListener('pointerup', e => { if (e.pointerType === 'mouse' && e.button === 0) actUp(); if (e.pointerId === lookId) lookId = null; });
addEventListener('pointercancel', e => { if (e.pointerId === lookId) lookId = null; });

addEventListener('keydown', e => {
  if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space') actDown();
  if (e.code === 'KeyQ') useSonar();
  if (e.code === 'Escape' && state === 'play') pause();
  if (e.code === 'KeyP') { if (state === 'play') pause(); else if (state === 'pause') start(); }
  if (e.code === 'Enter' && state !== 'play') start();
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') actUp(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.blur()));
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function setTouch() { if (!isTouch) { isTouch = true; document.body.classList.add('touch'); } }
addEventListener('touchstart', setTouch, { passive: true, once: true });

const stick = $('stick'), knob = $('knob');
let stickId = null;
function stickMove(e) {
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  stickX = Math.abs(x) < 0.12 ? 0 : x; stickY = Math.abs(y) < 0.12 ? 0 : y;
  knob.style.transform = `translate(${x * R * 0.6}px, ${y * R * 0.6}px)`;
}
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
const stickEnd = e => { if (e.pointerId !== stickId) return; stickId = null; stickX = stickY = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
const btnAct = $('btnAct');
btnAct.addEventListener('pointerdown', e => { e.preventDefault(); btnAct.setPointerCapture(e.pointerId); btnAct.classList.add('on'); actDown(); });
const actOff = () => { btnAct.classList.remove('on'); actUp(); };
btnAct.addEventListener('pointerup', actOff); btnAct.addEventListener('pointercancel', actOff);
$('btnSonar').addEventListener('pointerdown', e => { e.preventDefault(); useSonar(); });

$('mBtn').addEventListener('click', start);
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pause(); else if (state === 'pause') start(); });
const soundLabel = () => { $('soundBtn').textContent = AC && AC.isMuted() ? '🔇' : '🔊'; };
$('soundBtn').addEventListener('click', () => { if (AC) AC.toggleMute(); soundLabel(); });
soundLabel();

// ============ Loop ============
let last = performance.now(), menuT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    day += dt;
    updatePlayer(dt); updateWorld(dt); updateSonar(dt);
    actionPressed = false;
    if (msgTimer > 0 && (msgTimer -= dt) <= 0) $('msg').classList.remove('show');
    if (flashT > 0) { flashT = Math.max(0, flashT - dt * 0.8); $('flash').style.opacity = flashT; }
    updateHud();
    if (day >= DAY_LEN) endDay(false);
  } else if (state === 'menu') {
    // Menü: Kamera kreist langsam um die Hütte im Morgenrot
    menuT += dt * 0.08; day = 0;
    updateWorld(dt); applyDaylight(0.04);
    camera.position.set(SHACK.x + Math.sin(menuT) * 11, 4.2, SHACK.z - 6 + Math.cos(menuT) * 11);
    camera.lookAt(SHACK.x, 1.2, SHACK.z - 2);
    sky.position.copy(camera.position);
  }
  renderer.render(scene, camera);
}

resetGame(); state = 'menu';
pRoot.position.copy(player.pos); pRoot.rotation.y = player.yaw;
$('hBest').textContent = kg(best);
openModal('🎣 Eisangler 3D', 'Der zugefrorene See liegt im Morgengrauen vor dir – fang bis zur Dämmerung so viel <b>Fischgewicht</b> wie möglich. ' +
  'Lauf mit <b>WASD</b> übers Eis, <b>Leertaste halten</b> bohrt ein Loch, am Loch wirfst du aus. <b>Q</b> schickt ein Sonar los und zeigt Schwärme. ' +
  'Beißt ein Fisch: anschlagen, dann <b>einholen (halten)</b> und die Spannung im <b>grünen Bereich</b> halten – sonst reißt die Schnur oder der Fisch ist weg.<br><br>' +
  '🧊 <b>Klares, dunkles Eis ist dünn</b>: wer dort stehen bleibt, bricht ein. 🔥 In der Hütte am Ofen wärmst du dich auf.', 'Aufs Eis');
requestAnimationFrame(frame);
})();
</script>
</body>
