<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpack Gladiator — Grid Auto-Battler</title>
<link rel="icon" type="image/x-icon" href="../src/favicon.ico">
<script defer src="https://umami.rwpxe.com/script.js" data-website-id="cb5d0067-4455-44c8-a10b-fe5432756eea"></script>

<style>
  :root {
    --bg: #17141f; --panel: #231f31; --panel2: #2d2840; --line: #3d3657;
    --text: #ece8f5; --dim: #9b93b3; --gold: #f5c542; --red: #e5534b;
    --green: #5ec26a; --blue: #5aa9e6; --purple: #a56be0; --accent: #ff9f43;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--panel); border-bottom: 2px solid var(--line);
  }
  header h1 { margin: 0; font-size: 20px; color: var(--accent); }
  .stats { display: flex; gap: 18px; font-weight: 600; }
  #app {
    display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center; align-items: flex-start;
  }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  #grid { display: grid; grid-template-columns: repeat(4, 84px); gap: 6px; }
  .cell {
    width: 84px; height: 84px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 38px; position: relative;
    cursor: pointer; overflow: hidden;
  }
  .cell.empty { border-style: dashed; }
  .cell.sel { border-color: var(--gold); box-shadow: 0 0 12px var(--gold); }
  .cell.adj { border-color: var(--blue); background: #2b3350; }
  .cell.targetable:hover { border-color: var(--green); }
  .cell .cd {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(255, 255, 255, 0.18); pointer-events: none;
  }
  .cell .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .cell .flash.on { animation: flash .25s; }
  @keyframes flash { from { opacity: .6; } to { opacity: 0; } }
  .cell .tag {
    position: absolute; top: 2px; right: 4px; font-size: 11px; color: var(--gold); font-weight: 700;
  }
  #detail { margin-top: 12px; min-height: 96px; width: 366px; font-size: 14px; line-height: 1.5; }
  #detail b { color: var(--accent); }
  #detail .dim { color: var(--dim); }
  button {
    background: var(--accent); color: #1a1208; border: 0; border-radius: 8px; padding: 9px 16px;
    font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover { filter: brightness(1.1); }
  button.sec { background: var(--panel2); color: var(--text); border: 2px solid var(--line); }
  button.red { background: var(--red); color: #fff; }
  button.big { font-size: 18px; padding: 14px 26px; }
  button:disabled { opacity: .4; cursor: default; }
  #side { width: 460px; max-width: 100%; }
  #shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .card {
    background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 8px 2px;
    text-align: center; cursor: pointer; font-size: 30px;
  }
  .card small { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .card .price { font-size: 13px; color: var(--gold); font-weight: 700; margin-top: 4px; }
  .card.sel { border-color: var(--gold); box-shadow: 0 0 12px var(--gold); }
  .card.poor { opacity: .45; }
  .card.sold { visibility: hidden; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #msg { height: 20px; margin-top: 10px; color: var(--gold); font-size: 14px; }
  .side-box { margin-bottom: 14px; position: relative; }
  .side-box .name { font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .bar { height: 22px; background: #120f19; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid var(--line); }
  .bar > div { height: 100%; transition: width .08s; }
  .bar .hp { background: var(--green); }
  .bar .hp.foe { background: var(--red); }
  .bar span { position: absolute; inset: 0; text-align: center; font-size: 13px; line-height: 22px; font-weight: 700; text-shadow: 0 0 3px #000; }
  .status { height: 22px; font-size: 14px; margin-top: 3px; color: var(--dim); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip {
    width: 44px; height: 44px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; position: relative; overflow: hidden;
  }
  .chip .cd { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(255,255,255,.18); }
  .float {
    position: absolute; right: 20px; top: 0; font-weight: 800; font-size: 20px; pointer-events: none;
    animation: rise .9s forwards; text-shadow: 0 0 4px #000;
  }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
  .result { text-align: center; padding: 14px 0; }
  .result h3 { font-size: 26px; margin: 0 0 8px; }
  @media (max-width: 560px) {
    #grid { grid-template-columns: repeat(4, 70px); }
    .cell { width: 70px; height: 70px; font-size: 32px; }
    #detail { width: 100%; }
  }
  .hl { outline: 3px solid #fff; outline-offset: 2px; animation: hlp 1s infinite; position: relative; z-index: 2; }
  @keyframes hlp { 50% { outline-color: var(--gold); box-shadow: 0 0 16px var(--gold); } }
  #coach {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(580px, calc(100vw - 24px));
    background: var(--panel); border: 2px solid var(--gold); border-radius: 12px; padding: 12px 14px; z-index: 40;
    box-shadow: 0 8px 30px rgba(0,0,0,.65); font-size: 15px; line-height: 1.5;
  }
  #coach.hide { display: none; }
  #coach b { color: var(--accent); }
  #coach .top { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  #coach .top a { color: var(--dim); cursor: pointer; }
  #coach .btns { display: flex; justify-content: flex-end; margin-top: 10px; }
  body.tut { padding-bottom: 190px; }
</style>
</head>
<body>
<a href="../index.html" style="position:fixed;top:10px;right:12px;z-index:50;color:#ece8f5;text-decoration:none;font:600 14px 'Segoe UI',system-ui,sans-serif;background:rgba(35,31,49,.92);border:1px solid #3d3657;padding:6px 12px;border-radius:18px">‹ Arcade</a>
<header>
  <h1>🎒 Backpack Gladiator</h1>
  <button class="sec" id="tutBtn">❓ Tutorial</button>
  <div class="stats">
    <span id="sRound"></span><span id="sGold"></span><span id="sLives"></span><span id="sBest"></span>
  </div>
</header>
<div id="app">
  <div class="panel">
    <h2>Backpack 4×4</h2>
    <div id="grid"></div>
    <div id="detail"></div>
  </div>
  <div class="panel" id="side"></div>
  <div id="coach" class="hide">
    <div class="top"><span id="coachTop"></span><a id="coachSkip">Skip ✕</a></div>
    <div id="coachBody"></div>
    <div class="btns"><button id="coachNext"></button></div>
  </div>
</div>

<script>
'use strict';

const GRID_W = 4, GRID_N = 16, MAX_ROUND = 10, TICKS_PER_SEC = 10;

// type: weapon | shield | heal | poison | passive. cd in ticks (10 ticks = 1s).
// aura(e): wirkt auf aktive Nachbar-Items (e = effektive Werte des Nachbarn).
const ITEMS = {
  dolch:     { name: 'Dagger', icon: '🗡️', cost: 3, type: 'weapon', cd: 10, dmg: 4, tags: ['blade'],
               desc: 'Fast attack.' },
  schwert:   { name: 'Sword', icon: '⚔️', cost: 5, type: 'weapon', cd: 20, dmg: 10, tags: ['blade'],
               desc: 'Solid damage.' },
  axt:       { name: 'Axe', icon: '🪓', cost: 7, type: 'weapon', cd: 30, dmg: 20, tags: [],
               desc: 'Slow, but hits hard.' },
  schild:    { name: 'Shield', icon: '🛡️', cost: 4, type: 'shield', cd: 20, block: 6, tags: [],
               desc: 'Gives Block. Block decays 1/s.' },
  trank:     { name: 'Healing Potion', icon: '🧪', cost: 4, type: 'heal', cd: 25, heal: 8, tags: [],
               desc: 'Heals you.' },
  pilz:      { name: 'Poison Mushroom', icon: '🍄', cost: 4, type: 'poison', cd: 15, poison: 3, tags: [],
               desc: 'Poisons the enemy. Poison ignores Block, 1 damage per stack/s, stacks -1/s.' },
  giftstein: { name: 'Poison Stone', icon: '🪨', cost: 5, type: 'passive', tags: [],
               desc: 'Adjacent weapons: +2 poison per hit. Adjacent poison items: +2 poison.',
               aura: e => { if (e.type === 'weapon') e.hitPoison += 2; else if (e.type === 'poison') e.poison += 2; } },
  wetzstein: { name: 'Whetstone', icon: '🔪', cost: 4, type: 'passive', tags: [],
               desc: 'Adjacent blades (Dagger, Sword): +3 damage.',
               aura: e => { if (e.tags.includes('blade')) e.dmg += 3; } },
  kraut:     { name: 'Healing Herb', icon: '🌿', cost: 4, type: 'passive', tags: [],
               desc: 'Adjacent healing items: +5 healing.',
               aura: e => { if (e.type === 'heal') e.heal += 5; } },
  ring:      { name: 'Iron Ring', icon: '💍', cost: 4, type: 'passive', tags: [],
               desc: 'Adjacent shields: +5 Block.',
               aura: e => { if (e.type === 'shield') e.block += 5; } },
  uhrwerk:   { name: 'Clockwork', icon: '⚙️', cost: 6, type: 'passive', tags: [],
               desc: 'Adjacent items charge 25% faster.',
               aura: e => { if (e.type !== 'passive') e.cdMul *= 0.75; } },
  kelch:     { name: 'Blood Chalice', icon: '🏆', cost: 5, type: 'passive', tags: [],
               desc: 'Adjacent weapons heal you for 2 per hit.',
               aura: e => { if (e.type === 'weapon') e.hitHeal += 2; } },
  beutel:    { name: 'Coin Pouch', icon: '💰', cost: 5, type: 'passive', tags: [],
               desc: '+3 gold after every won battle.' },
};
const ITEM_IDS = Object.keys(ITEMS);

const $ = id => document.getElementById(id);
const G = {};
let timer = null;

function newRun(tut) {
  clearInterval(timer);
  G.tut = tut ? 0 : null; G.tutHover = false;
  G.round = 1; G.gold = 10; G.lives = 3;
  G.grid = Array(GRID_N).fill(null);
  G.grid[5] = 'dolch';
  G.sel = null; G.fight = null; G.over = null;
  G.best = G.best || loadBest();
  rollShop();
  render();
}

function loadBest() { try { return +localStorage.getItem('bgBest') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('bgBest', v); } catch (e) {} }

function rollShop() {
  if (G.tut != null) { G.shop = TUT_SHOP.slice(); return; }
  G.shop = Array.from({ length: 5 }, () => ITEM_IDS[Math.floor(Math.random() * ITEM_IDS.length)]);
}

function neighbors(i) {
  const x = i % GRID_W, y = Math.floor(i / GRID_W), r = [];
  if (x > 0) r.push(i - 1);
  if (x < GRID_W - 1) r.push(i + 1);
  if (y > 0) r.push(i - GRID_W);
  if (y < GRID_W - 1) r.push(i + GRID_W);
  return r;
}

// Effektive Werte eines Items anhand seiner Nachbarn.
function effItem(id, neighborIds) {
  const d = ITEMS[id];
  const e = {
    id, name: d.name, icon: d.icon, type: d.type, tags: d.tags,
    cd: d.cd || 0, dmg: d.dmg || 0, block: d.block || 0, heal: d.heal || 0, poison: d.poison || 0,
    hitPoison: 0, hitHeal: 0, cdMul: 1,
  };
  for (const n of neighborIds) if (ITEMS[n].aura) ITEMS[n].aura(e);
  if (e.cd) e.cd = Math.max(4, Math.round(e.cd * e.cdMul));
  return e;
}
function effAt(grid, i) {
  return effItem(grid[i], neighbors(i).map(n => grid[n]).filter(Boolean));
}

function describe(e) {
  const s = e.cd ? (e.cd / TICKS_PER_SEC).toFixed(1) + 's' : '';
  const a = [];
  if (e.type === 'weapon') {
    a.push(`<b>${e.dmg}</b> damage every ${s}`);
    if (e.hitPoison) a.push(`+${e.hitPoison} poison per hit`);
    if (e.hitHeal) a.push(`+${e.hitHeal} healing per hit`);
  } else if (e.type === 'shield') a.push(`<b>${e.block}</b> Block every ${s}`);
  else if (e.type === 'heal') a.push(`<b>${e.heal}</b> healing every ${s}`);
  else if (e.type === 'poison') a.push(`<b>${e.poison}</b> poison every ${s}`);
  return a.join('<br>');
}

// ---------- Rendering (Planungsphase) ----------

function toast(t) { $('msg') && ($('msg').textContent = t); }

function render() {
  $('sRound').textContent = `Round ${G.round}/${MAX_ROUND}`;
  $('sGold').textContent = `💰 ${G.gold}`;
  $('sLives').textContent = '❤️'.repeat(G.lives) || '💀';
  $('sBest').textContent = `Best: Round ${G.best}`;
  renderGrid();
  if (G.fight) renderBattle();
  else renderShop();
  tutUpdate();
  showDetail(null);
}

function renderGrid() {
  const g = $('grid');
  g.innerHTML = '';
  for (let i = 0; i < GRID_N; i++) {
    const c = document.createElement('div');
    const id = G.grid[i];
    c.className = 'cell' + (id ? '' : ' empty') + (!G.fight ? ' targetable' : '');
    c.dataset.i = i;
    if (id) c.innerHTML = `${ITEMS[id].icon}<div class="cd"></div><div class="flash"></div>`;
    if (G.sel && G.sel.src === 'grid' && G.sel.i === i) c.classList.add('sel');
    c.onclick = () => clickCell(i);
    c.onmouseenter = () => hoverCell(i);
    c.onmouseleave = () => { clearAdj(); showDetail(null); };
    g.appendChild(c);
  }
}

function clearAdj() { document.querySelectorAll('.cell.adj').forEach(c => c.classList.remove('adj')); }

function hoverCell(i) {
  clearAdj();
  neighbors(i).forEach(n => $('grid').children[n].classList.add('adj'));
  if (G.tut === 3 && !G.tutHover && G.grid[i] === 'dolch') { G.tutHover = true; tutUpdate(); }
  if (G.grid[i]) showDetail({ id: G.grid[i], idx: i });
  else showDetail(null);
}

function showDetail(what) {
  let target = what;
  if (!target && G.sel && !G.fight) {
    target = G.sel.src === 'shop' ? { id: G.shop[G.sel.i], shop: true } : { id: G.grid[G.sel.i], idx: G.sel.i };
  }
  const el = $('detail');
  if (!target) {
    el.innerHTML = `<span class="dim">Pick an item in the shop, then click a free slot. Items only touch along edges (up/down/left/right). Hover over a slot to see its neighbors.</span>`;
    return;
  }
  const d = ITEMS[target.id];
  const e = target.idx != null ? effAt(G.grid, target.idx) : effItem(target.id, []);
  let html = `<b>${d.icon} ${d.name}</b><br>`;
  if (d.type !== 'passive') html += describe(e) + '<br>';
  html += `<span class="dim">${d.desc}</span>`;
  if (target.idx != null && !G.fight && G.sel && G.sel.src === 'grid' && G.sel.i === target.idx) {
    html += `<div style="margin-top:8px"><button class="red" id="sellBtn">Sell (+${Math.floor(d.cost / 2)}💰)</button></div>`;
  }
  el.innerHTML = html;
  const sb = $('sellBtn');
  if (sb) sb.onclick = sellSelected;
}

function renderShop() {
  const s = $('side');
  s.innerHTML = `
    <h2>Shop</h2>
    <div id="shop"></div>
    <div class="row">
      <button class="sec" id="reroll">Reroll (1💰)</button>
      <button class="big" id="fightBtn">⚔️ Start Battle</button>
    </div>
    <div id="msg"></div>`;
  const shop = $('shop');
  G.shop.forEach((id, i) => {
    const c = document.createElement('div');
    if (!id) { c.className = 'card sold'; c.innerHTML = '&nbsp;'; shop.appendChild(c); return; }
    const d = ITEMS[id];
    c.className = 'card' + (G.gold < d.cost ? ' poor' : '') + (G.sel && G.sel.src === 'shop' && G.sel.i === i ? ' sel' : '');
    c.innerHTML = `${d.icon}<small>${d.name}</small><div class="price">${d.cost}💰</div>`;
    c.onclick = () => clickShop(i);
    c.onmouseenter = () => showDetail({ id, shop: true });
    c.onmouseleave = () => showDetail(null);
    shop.appendChild(c);
  });
  $('reroll').onclick = () => {
    if (G.tut != null) return toast('Locked during the tutorial.');
    if (G.gold < 1) return toast('Not enough gold.');
    G.gold--; rollShop(); G.sel = null; render();
  };
  $('fightBtn').onclick = startFight;
}

function clickShop(i) {
  const id = G.shop[i];
  if (!id) return;
  if (G.tut != null && TUT_BUY[G.tut] !== i) { toast('Follow the tutorial first 😉'); return; }
  if (G.gold < ITEMS[id].cost) { toast('Not enough gold.'); return; }
  G.sel = G.sel && G.sel.src === 'shop' && G.sel.i === i ? null : { src: 'shop', i };
  render();
  if (G.sel) toast('Now pick a free slot in the backpack.');
}

function clickCell(i) {
  if (G.fight) return;
  if (G.tut === 3 && G.grid[i] === 'dolch') G.tutHover = true;
  const sel = G.sel;
  if (!sel) {
    if (G.grid[i]) { G.sel = { src: 'grid', i }; render(); }
    return;
  }
  if (sel.src === 'shop') {
    if (G.grid[i]) { toast('Slot occupied. Sell or move that item first.'); return; }
    const id = G.shop[sel.i];
    G.gold -= ITEMS[id].cost;
    G.grid[i] = id; G.shop[sel.i] = null; G.sel = null;
    render();
  } else {
    if (sel.i === i) { G.sel = null; render(); return; }
    const t = G.grid[i];
    G.grid[i] = G.grid[sel.i]; G.grid[sel.i] = t;
    G.sel = null; render();
  }
}

function sellSelected() {
  if (!G.sel || G.sel.src !== 'grid') return;
  const id = G.grid[G.sel.i];
  G.gold += Math.floor(ITEMS[id].cost / 2);
  G.grid[G.sel.i] = null; G.sel = null;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && G.sel) { G.sel = null; render(); }
});

// ---------- Gegner ----------

const ENEMY_NAMES = ['Rat', 'Goblin', 'Wolf', 'Skeleton', 'Orc Guard', 'Arena Beast', 'Troll', 'Dark Knight', 'Poison Mage', 'Champion'];
const ENEMY_ICONS = ['🐀', '👺', '🐺', '💀', '👹', '🦂', '🧌', '🥷', '🧙', '👑'];

function makeEnemy(r) {
  const boss = r % 5 === 0;
  const items = [{ type: 'weapon', icon: '🗡️', name: 'Weapon', cd: Math.max(10, 18 - Math.floor(r / 2)), dmg: Math.round((3 + r * 1.4) * (boss ? 1.3 : 1)) }];
  if (r >= 3) items.push({ type: 'shield', icon: '🛡️', name: 'Armor', cd: 30, block: 3 + r });
  if (r >= 4) items.push({ type: 'poison', icon: '🍄', name: 'Poison', cd: 25, poison: 1 + Math.floor(r / 3) });
  if (r >= 7) items.push({ type: 'heal', icon: '🧪', name: 'Potion', cd: 40, heal: 6 + r });
  if (boss) items.push({ type: 'weapon', icon: '🔨', name: 'Hammer', cd: 35, dmg: 10 + r * 2 });
  return {
    name: (boss ? 'BOSS ' : '') + ENEMY_NAMES[r - 1],
    icon: ENEMY_ICONS[r - 1],
    maxHp: Math.round((30 + r * 8 + r * r * 2) * (boss ? 1.4 : 1)),
    items,
  };
}

// ---------- Kampf ----------

function startFight() {
  if (G.tut != null && G.tut < 5) { toast('Finish the tutorial first – or skip it.'); return; }
  const idx = G.grid.map((id, i) => id ? i : -1).filter(i => i >= 0);
  const active = idx.filter(i => ['weapon', 'poison'].includes(ITEMS[G.grid[i]].type));
  if (!active.length) { toast('You need at least one weapon or poison item.'); return; }
  const en = makeEnemy(G.round);
  const pItems = idx.map(i => ({ ...effAt(G.grid, i), cell: i, t: 0 }))
    .filter(it => it.type !== 'passive');
  G.sel = null;
  G.fight = {
    tick: 0, speed: 1, done: null,
    p: { name: 'You', icon: '🧔', maxHp: 60, hp: 60, block: 0, poison: 0, items: pItems },
    e: { name: en.name, icon: en.icon, maxHp: en.maxHp, hp: en.maxHp, block: 0, poison: 0, items: en.items.map(it => ({ ...it, t: 0 })) },
  };
  render();
  runTimer();
}

function runTimer() {
  clearInterval(timer);
  const f = G.fight;
  if (!f || f.done) return;
  timer = setInterval(stepFight, 100 / f.speed);
}

function hurt(side, other, amt, pierce, key) {
  let dealt = amt;
  if (!pierce && side.block > 0) {
    const ab = Math.min(side.block, amt);
    side.block -= ab; dealt -= ab;
  }
  side.hp -= dealt;
  if (amt > 0) floatNum(key, dealt > 0 ? '-' + dealt : '🛡', dealt > 0 ? '#ff6b6b' : '#8ec5ff');
  return dealt;
}

function fire(f, key, side, other, otherKey, it) {
  if (it.type === 'weapon') {
    hurt(other, side, it.dmg, false, otherKey);
    if (it.hitPoison) other.poison += it.hitPoison;
    if (it.hitHeal) heal(side, it.hitHeal, key);
  } else if (it.type === 'shield') {
    side.block += it.block;
  } else if (it.type === 'heal') {
    heal(side, it.heal, key);
  } else if (it.type === 'poison') {
    other.poison += it.poison;
  }
  if (it.cell != null) {
    const fl = $('grid').children[it.cell].querySelector('.flash');
    if (fl) { fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
  }
}

function heal(side, amt, key) {
  const h = Math.min(amt, side.maxHp - side.hp);
  side.hp += h;
  if (h > 0) floatNum(key, '+' + h, '#7dff8a');
}

function stepFight() {
  const f = G.fight;
  if (!f || f.done) return;
  f.tick++;
  const sides = [['p', f.p, f.e, 'e'], ['e', f.e, f.p, 'p']];
  for (const [k, s, o, ok] of sides) {
    for (const it of s.items) {
      it.t++;
      if (it.t >= it.cd) { it.t = 0; fire(f, k, s, o, ok, it); }
    }
  }
  if (f.tick % TICKS_PER_SEC === 0) {
    for (const [k, s] of [['p', f.p], ['e', f.e]]) {
      if (s.poison > 0) { hurt(s, null, s.poison, true, k); s.poison--; }
      if (s.block > 0) s.block--;
      if (f.tick > 400) hurt(s, null, Math.ceil((f.tick - 400) / 50), true, k); // Sudden Death
    }
  }
  updateBattle();
  if (f.e.hp <= 0 || f.p.hp <= 0) endFight(f.e.hp <= 0);
}

function endFight(won) {
  const f = G.fight;
  f.done = won ? 'win' : 'lose';
  clearInterval(timer);
  let gain = 0;
  if (won) {
    gain = 7 + 3 * G.grid.filter(id => id === 'beutel').length;
    if (G.round > G.best) { G.best = G.round; saveBest(G.best); }
  } else {
    G.lives--;
  }
  f.gain = gain;
  renderBattle();
}

function floatNum(key, text, color) {
  const box = document.querySelector(`.side-box[data-k="${key}"]`);
  if (!box) return;
  const s = document.createElement('div');
  s.className = 'float'; s.textContent = text; s.style.color = color;
  s.style.right = (10 + Math.random() * 70) + 'px';
  box.appendChild(s);
  setTimeout(() => s.remove(), 900);
}

function sideBox(k, s) {
  return `<div class="side-box" data-k="${k}">
    <div class="name"><span>${s.icon} ${s.name}</span><span id="${k}Stat"></span></div>
    <div class="bar"><div class="hp ${k === 'e' ? 'foe' : ''}" id="${k}Hp"></div><span id="${k}HpT"></span></div>
    <div class="status" id="${k}Status"></div>
    ${k === 'e' ? '<div class="chips">' + s.items.map((it, i) =>
      `<div class="chip" title="${it.name}" data-ei="${i}">${it.icon}<div class="cd"></div></div>`).join('') + '</div>' : ''}
  </div>`;
}

function renderBattle() {
  const f = G.fight, s = $('side');
  let res = '';
  if (f.done) {
    const last = G.round >= MAX_ROUND;
    if (f.done === 'win') {
      res = last
        ? `<div class="result"><h3>🏆 Arena Champion!</h3><p>You survived all ${MAX_ROUND} rounds.</p><button class="big" id="againBtn">New Run</button></div>`
        : `<div class="result"><h3>Victory! +${f.gain}💰</h3><button class="big" id="nextBtn">Next Round</button></div>`;
    } else if (G.lives <= 0) {
      res = `<div class="result"><h3>💀 Game Over</h3><p>You fell in round ${G.round}.</p><button class="big" id="againBtn">New Run</button></div>`;
    } else {
      res = `<div class="result"><h3>Defeat</h3><p>${G.lives} lives left. Rebuild and try again.</p><button class="big" id="nextBtn">Back to Shop</button></div>`;
    }
  }
  s.innerHTML = `
    <h2>Battle – Round ${G.round}</h2>
    ${sideBox('e', f.e)}
    ${sideBox('p', f.p)}
    ${f.done ? res : `<div class="row">
      <span class="dim" style="color:var(--dim)">Speed:</span>
      ${[1, 2, 4].map(v => `<button class="sec spd" data-v="${v}">${v}×</button>`).join('')}
    </div>`}`;
  document.querySelectorAll('.spd').forEach(b => {
    b.onclick = () => { f.speed = +b.dataset.v; runTimer(); };
  });
  const nb = $('nextBtn');
  if (nb) nb.onclick = nextRound;
  const ab = $('againBtn');
  if (ab) ab.onclick = () => newRun();
  updateBattle();
  $('sLives').textContent = '❤️'.repeat(Math.max(G.lives, 0)) || '💀';
  tutUpdate();
  $('sBest').textContent = `Best: Round ${G.best}`;
}

function updateBattle() {
  const f = G.fight;
  for (const k of ['p', 'e']) {
    const s = f[k];
    const hp = Math.max(0, s.hp);
    $(k + 'Hp').style.width = (100 * hp / s.maxHp) + '%';
    $(k + 'HpT').textContent = `${hp} / ${s.maxHp}`;
    $(k + 'Status').textContent = [s.block > 0 ? `🛡️ ${s.block}` : '', s.poison > 0 ? `☠️ ${s.poison}` : ''].filter(Boolean).join('   ');
  }
  for (const it of f.p.items) {
    const bar = $('grid').children[it.cell].querySelector('.cd');
    if (bar) bar.style.height = (100 * it.t / it.cd) + '%';
  }
  document.querySelectorAll('.chip').forEach(c => {
    const it = f.e.items[+c.dataset.ei];
    c.querySelector('.cd').style.height = (100 * it.t / it.cd) + '%';
  });
}

function nextRound() {
  if (G.tut != null) tutEnd();
  const won = G.fight.done === 'win';
  if (won) {
    G.gold += G.fight.gain;
    G.round++;
    rollShop();
  }
  G.fight = null;
  render();
}

// ---------- Tutorial ----------

const TUT_SHOP = ['wetzstein', 'schild', 'trank', 'kraut', 'giftstein'];
const TUT_BUY = { 1: 0, 2: 0, 4: 1 }; // Tutorial-Schritt -> erlaubter Shop-Slot
const cellSel = i => `#grid .cell:nth-child(${i + 1})`;
const shopSel = i => `#shop .card:nth-child(${i + 1})`;
const emptySel = () => G.grid.map((id, i) => id ? null : cellSel(i)).filter(Boolean);
const wetzOk = () => {
  const w = G.grid.indexOf('wetzstein'), d = G.grid.indexOf('dolch');
  return w >= 0 && d >= 0 && neighbors(d).includes(w);
};

const TUT = [
  { btn: "Let's go",
    html: () => `<b>Welcome, Gladiator!</b><br>You have 60 ❤️ and a backpack with 4×4 slots. In battle your items trigger <b>on their own</b> once their bar is full. You build, the items fight. Survive 10 rounds!` },
  { ok: () => G.grid.includes('wetzstein') || (G.sel && G.sel.src === 'shop' && G.sel.i === 0),
    html: () => `<b>Step 1 – Buy.</b><br>Your Dagger 🗡️ is already in the backpack. In the shop, click the <b>Whetstone 🔪</b> (4💰).`,
    hl: () => [shopSel(0)] },
  { ok: wetzOk,
    html: () => G.grid.includes('wetzstein')
      ? `The Whetstone isn't <b>directly</b> next to the Dagger yet. Click it, then a glowing slot next to the Dagger.`
      : G.sel
        ? `<b>Step 2 – Place.</b><br>Click a <b>glowing slot</b> directly next to the Dagger. Only edges count (up/down/left/right), no diagonals!`
        : `Select the Whetstone in the shop again.`,
    hl: () => {
      const d = G.grid.indexOf('dolch'), w = G.grid.indexOf('wetzstein');
      if (w < 0 && !G.sel) return [shopSel(0)];
      const r = neighbors(d).filter(n => !G.grid[n]).map(cellSel);
      if (w >= 0) r.push(cellSel(w));
      return r;
    } },
  { ok: () => G.tutHover,
    html: () => {
      const d = G.grid.indexOf('dolch');
      return `<b>Step 3 – Synergy.</b><br>The Whetstone doesn't fight itself, but gives <b>adjacent blades +3 damage</b>. Hover over the Dagger (on mobile: tap it): instead of 4 you now see <b>${effAt(G.grid, d).dmg}</b> damage. Blue = neighbors.`;
    },
    hl: () => [cellSel(G.grid.indexOf('dolch'))] },
  { ok: () => G.grid.includes('schild'),
    html: () => `<b>Step 4 – Defense.</b><br>Buy the <b>Shield 🛡️</b> and put it on a free slot. It gives <b>Block</b>, which absorbs damage but decays by 1 per second. Poison ☠️ ignores Block.`,
    hl: () => G.sel && G.sel.src === 'shop' ? emptySel() : [shopSel(1)] },
  { ok: () => !!G.fight,
    html: () => `<b>Step 5 – Battle!</b><br>That's all you need for round 1. Items can be moved later (click, then target slot) or sold. Start the battle!`,
    hl: () => ['#fightBtn'] },
  { ok: () => G.fight && G.fight.done,
    html: () => `<b>The battle is on.</b><br>Enemy on top, you below. The <b>bright bars on your items</b> are the cooldown: full = item triggers. Red = damage, green = healing, 🛡 = blocked. <b>Speed 2×/4×</b> makes it faster.`,
    hl: () => ['.spd'] },
  { btn: 'Finish Tutorial',
    html: () => `${G.fight && G.fight.done === 'win' ? '<b>Victory!</b> That earns you 7💰.' : '<b>Defeat – no big deal.</b> You lose 1 ❤️ and rebuild.'}<br>
      • 10 rounds, 3 lives, boss in rounds 5 and 10<br>
      • Click an item → <i>Sell</i> returns half the price<br>
      • Reroll costs 1💰<br>
      • Combos: Poison Stone + Poison Mushroom, Clockwork speeds up neighbors, Blood Chalice + weapon heals you` },
];

function tutSeen() { try { return !!localStorage.getItem('bgTut'); } catch (e) { return true; } }

function tutEnd() {
  G.tut = null;
  try { localStorage.setItem('bgTut', '1'); } catch (e) {}
  tutUpdate();
}

function tutUpdate() {
  const el = $('coach');
  document.querySelectorAll('.hl').forEach(n => n.classList.remove('hl'));
  if (G.tut == null) { el.classList.add('hide'); document.body.classList.remove('tut'); return; }
  for (let guard = 0; guard < 10 && TUT[G.tut].ok && TUT[G.tut].ok(); guard++) G.tut++;
  const s = TUT[G.tut];
  $('coachTop').textContent = `Tutorial ${G.tut + 1}/${TUT.length}`;
  $('coachBody').innerHTML = s.html();
  $('coachNext').style.display = s.btn ? '' : 'none';
  if (s.btn) $('coachNext').textContent = s.btn;
  el.classList.remove('hide'); document.body.classList.add('tut');
  if (s.hl) s.hl().forEach(sel => document.querySelectorAll(sel).forEach(n => n.classList.add('hl')));
}

$('coachNext').onclick = () => { if (G.tut === TUT.length - 1) tutEnd(); else { G.tut++; tutUpdate(); } };
$('coachSkip').onclick = tutEnd;
$('tutBtn').onclick = () => {
  if ((G.fight && !G.fight.done) || G.round > 1 || G.grid.filter(Boolean).length > 1) {
    if (!confirm('Start a new run with the tutorial? Your current run will be lost.')) return;
  }
  newRun(true);
};

newRun(!tutSeen());
