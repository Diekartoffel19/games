<script>
(() => {
'use strict';

// ============ ArcadeCore ============
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const KEY = 'kranfuehrer';

// ============ Konstanten ============
const G = 9.81, STEP = 1 / 120;
const JIB_H = 32, ROPE_Y = JIB_H - 0.5;
const R_MIN = 4, R_MAX = 30, L_MIN = 2, L_MAX = ROPE_Y - 0.4;
const SLING = 1.3;            // Haken -> Lastoberkante
const SHRINK = 0.35;          // Kollisions-Toleranz pro Seite (XZ)
const SNAP_TOL = 0.6, SNAP_YAW = 0.21, SNAP_SPEED = 0.9;
const DMG_V = 1.7, BREAK_V = 3.2, BUMP_V = 1.8;
const FOUND_TOP = 0.4, PAD_TOP = 0.15;
const YARD = { x: -12.5, z: 3 };
const B_ANGLE = 0.75;

const PART = {
  container: { size: [6, 2.6, 2.4], sym: Math.PI, mass: 1.0, area: 1.0, name: 'Container' },
  slab:      { size: [6.4, 0.5, 6.4], sym: Math.PI / 2, mass: 1.3, area: 1.2, name: 'Betonplatte' },
  beam:      { size: [6.4, 0.9, 0.5], sym: Math.PI, mass: 0.8, area: 0.6, name: 'Stahlträger', twist: true },
  crown:     { size: [6.4, 1.0, 6.4], sym: Math.PI / 2, mass: 0.7, area: 0.8, name: 'Dachkranz' },
};

// C = Container-Geschoss, B = Stahlträger-Geschoss
const LEVELS = [
  { floors: ['C'], workers: 2, wind: 0, dist: 15 },
  { floors: ['C', 'B'], workers: 3, wind: 0, dist: 16 },
  { floors: ['C', 'C'], workers: 3, wind: 3.5, dist: 17 },
  { floors: ['C', 'B', 'C'], workers: 4, wind: 5, dist: 18.5 },
  { floors: ['C', 'C', 'B', 'C'], workers: 5, wind: 7, dist: 20 },
];

// ============ Helfer ============
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const wrapAngle = a => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
const symErr = (a, sym) => { const m = ((a % sym) + sym) % sym; return Math.min(m, sym - m); };
const rnd = (a, b) => a + Math.random() * (b - a);

// ============ Renderer & Szene ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc8e8);
scene.fog = new THREE.Fog(0x9fc8e8, 100, 240);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);

scene.add(new THREE.HemisphereLight(0xdbeafe, 0x6b5a3a, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(30, 55, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 150 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const matCache = {};
function M(color, opts) {
  const k = color + (opts ? JSON.stringify(opts) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0.05, flatShading: true }, opts)));
}
function box(w, h, d, mat, x, y, z, parent, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const _up = new THREE.Vector3(0, 1, 0);
function bar(list, ax, ay, az, bx, by, bz, t) {
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
  const d = b.clone().sub(a), len = d.length();
  const q = new THREE.Quaternion().setFromUnitVectors(_up, d.normalize());
  list.push(new THREE.Matrix4().compose(a.add(b).multiplyScalar(0.5), q, new THREE.Vector3(t, len, t)));
}
function lattice(list, mat) {
  const im = new THREE.InstancedMesh(unitBox, mat, list.length);
  list.forEach((m, i) => im.setMatrixAt(i, m));
  im.castShadow = true;
  return im;
}

// ============ Welt ============
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), M(0x6b8f4e));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const dirt = new THREE.Mesh(new THREE.PlaneGeometry(72, 72), M(0xa58a63));
dirt.rotation.x = -Math.PI / 2; dirt.position.y = 0.01; dirt.receiveShadow = true; scene.add(dirt);

// Bauzaun
const fenceMat = M(0xcbd5e1, { metalness: 0.3 });
[[0, -36, 72, 0.15], [0, 36, 72, 0.15], [-36, 0, 0.15, 72], [36, 6, 0.15, 60]].forEach(([x, z, w, d]) => box(w, 2, d, fenceMat, x, 1, z, scene));

// Nachbarhäuser & Bäume
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2 + rnd(-0.1, 0.1), r = rnd(55, 90);
  const h = rnd(8, 34), w = rnd(8, 16);
  box(w, h, rnd(8, 16), M([0xd6d3d1, 0xa8a29e, 0xe7e5e4, 0x94a3b8][i % 4]), Math.sin(a) * r, h / 2, Math.cos(a) * r, scene, false);
}
const trunkMat = M(0x78350f), leafMat = M(0x3f6212);
for (let i = 0; i < 14; i++) {
  const a = rnd(0, Math.PI * 2), r = rnd(40, 50), x = Math.sin(a) * r, z = Math.cos(a) * r;
  box(0.5, 2, 0.5, trunkMat, x, 1, z, scene);
  const c = new THREE.Mesh(new THREE.ConeGeometry(2, 5, 7), leafMat);
  c.position.set(x, 4.5, z); c.castShadow = true; scene.add(c);
}

// Baustellen-Deko
box(6, 2.6, 2.4, M(0xf1f5f9), 22, 1.3, -24, scene);
box(6, 2.6, 2.4, M(0xf1f5f9), 22, 3.9, -24, scene);
box(1.2, 2.3, 1.2, M(0x2563eb), 27, 1.15, -20, scene);
for (let i = 0; i < 4; i++) box(1.2, 0.9, 1, M(0xb45309), YARD.x - 7 + i * 1.5, 0.45, YARD.z + 7, scene);
const sand = new THREE.Mesh(new THREE.ConeGeometry(3, 2.2, 8), M(0xe7c27d)); sand.position.set(-20, 1.1, -14); scene.add(sand);

// Lagerplatz
const pad = box(9, PAD_TOP, 9, M(0x57534e), YARD.x, PAD_TOP / 2, YARD.z, scene);
pad.castShadow = false;

// Windsack
const sockPole = box(0.15, 8, 0.15, M(0xe2e8f0), 6, 4, 9, scene);
const sockYaw = new THREE.Group(); sockYaw.position.set(6, 7.8, 9); scene.add(sockYaw);
const sockPitch = new THREE.Group(); sockYaw.add(sockPitch);
const sockGeo = new THREE.ConeGeometry(0.4, 2.2, 8, 1, true); sockGeo.rotateX(Math.PI / 2); sockGeo.translate(0, 0, 1.1);
const sock = new THREE.Mesh(sockGeo, M(0xf97316, { side: THREE.DoubleSide })); sockPitch.add(sock);

// ============ Kran ============
const craneYellow = M(0xfacc15, { metalness: 0.25 });
const steelGray = M(0x475569, { metalness: 0.4 });
const concrete = M(0x9ca3af);
box(4.5, 1, 4.5, concrete, 0, 0.5, 0, scene);
{
  const L = [], s = 1.1, top = JIB_H - 0.8, n = Math.round((top - 1) / 2.5), sh = (top - 1) / n;
  for (const [cx, cz] of [[-s, -s], [s, -s], [s, s], [-s, s]]) bar(L, cx, 1, cz, cx, top, cz, 0.2);
  for (let i = 0; i <= n; i++) {
    const y = 1 + i * sh;
    bar(L, -s, y, -s, s, y, -s, 0.1); bar(L, s, y, -s, s, y, s, 0.1); bar(L, s, y, s, -s, y, s, 0.1); bar(L, -s, y, s, -s, y, -s, 0.1);
    if (i < n) {
      const y2 = y + sh, f = i % 2 ? 1 : -1;
      bar(L, -s * f, y, -s, s * f, y2, -s, 0.08); bar(L, s, y, -s * f, s, y2, s * f, 0.08);
      bar(L, s * f, y, s, -s * f, y2, s, 0.08); bar(L, -s, y, s * f, -s, y2, -s * f, 0.08);
    }
  }
  scene.add(lattice(L, craneYellow));
}
const jib = new THREE.Group(); scene.add(jib);
box(2.8, 0.8, 2.8, steelGray, 0, JIB_H - 0.4, 0, jib);
{
  const L = [], yb = JIB_H + 0.05, yt = JIB_H + 1.5, len = R_MAX + 2.5, w = 0.6;
  bar(L, -w, yb, 0, -w, yb, len, 0.16); bar(L, w, yb, 0, w, yb, len, 0.16); bar(L, 0, yt, 0, 0, yt, len - 1, 0.14);
  for (let z = 0; z < len - 1; z += 2) {
    bar(L, -w, yb, z, 0, yt, z + 1, 0.07); bar(L, 0, yt, z + 1, -w, yb, z + 2, 0.07);
    bar(L, w, yb, z, 0, yt, z + 1, 0.07); bar(L, 0, yt, z + 1, w, yb, z + 2, 0.07);
    bar(L, -w, yb, z, w, yb, z, 0.06);
  }
  // Turmspitze + Abspannungen

// ============ Physik ============
const res = { grounded: false, impact: 0, bump: 0, floor: 0 };
// Box: x/z ± hx/hz, y von p.y-below-h bis p.y-below
function collideBody(p, q, below, hx, hz, h) {
  res.grounded = false; res.impact = 0; res.bump = 0; res.floor = 0;
  const prevBottom = q.y - below - h;
  for (const b of solids) {
    const bottom = p.y - below - h, top = p.y - below;
    if (top <= b.y0 || bottom >= b.y1 - 0.25 || prevBottom >= b.y1 - 0.25) continue;
    const ox = hx + b.hx - SHRINK - Math.abs(p.x - b.x), oz = hz + b.hz - SHRINK - Math.abs(p.z - b.z);
    if (ox <= 0 || oz <= 0) continue;
    if (ox < oz) { const v = Math.abs(p.x - q.x) / STEP; p.x += Math.sign(p.x - b.x || 1) * ox; q.x = p.x; res.bump = Math.max(res.bump, v); }
    else { const v = Math.abs(p.z - q.z) / STEP; p.z += Math.sign(p.z - b.z || 1) * oz; q.z = p.z; res.bump = Math.max(res.bump, v); }
  }
  let floor = 0;
  for (const b of solids) {
    if (b.y1 > floor && b.y1 <= prevBottom + 0.3 &&
        Math.abs(p.x - b.x) < hx + b.hx - SHRINK && Math.abs(p.z - b.z) < hz + b.hz - SHRINK) floor = b.y1;
  }
  if (p.y - below - h < floor) {
    res.impact = -(p.y - q.y) / STEP;
    p.y = floor + below + h; q.y = p.y;
    const f = 1 - Math.min(1, 8 * STEP);
    q.x = p.x - (p.x - q.x) * f; q.z = p.z - (p.z - q.z) * f;
    res.grounded = true; res.floor = floor;
  }
  return res;
}
function floorBelow(x, z, hx, hz, bottom) {
  let floor = 0;
  for (const b of solids) if (b.y1 > floor && b.y1 <= bottom + 0.3 && Math.abs(x - b.x) < hx + b.hx - SHRINK && Math.abs(z - b.z) < hz + b.hz - SHRINK) floor = b.y1;
  return floor;
}

function verlet(p, q, h, damp, ax, az) {
  const k = 1 - damp * h;
  const vx = (p.x - q.x) * k, vy = (p.y - q.y) * k, vz = (p.z - q.z) * k;
  q.copy(p);
  p.x += vx + ax * h * h; p.y += vy - G * h * h; p.z += vz + az * h * h;
}

function stepPhysics(h) {
  const hooked = load && load.state === 'hooked';
  const m = hooked ? load.mass : 0.2;
  // Kranantriebe (begrenzte Beschleunigung -> Pendel wird angeregt)
  crane.thetaV = approach(crane.thetaV, input.slew * 0.3, 0.32 / (1 + m * 0.6) * h);
  crane.theta += crane.thetaV * h;
  crane.rV = approach(crane.rV, input.trolley * 3.2, 2.4 / (1 + m * 0.5) * h);
  crane.r += crane.rV * h;
  if (crane.r < R_MIN || crane.r > R_MAX) { crane.r = clamp(crane.r, R_MIN, R_MAX); crane.rV = 0; }
  crane.LV = approach(crane.LV, -input.winch * 2.6 / (1 + m * 0.35), 5 * h);
  crane.L += crane.LV * h;
  if (crane.L < L_MIN || crane.L > L_MAX) { crane.L = clamp(crane.L, L_MIN, L_MAX); crane.LV = 0; }
  trolleyPos.set(Math.sin(crane.theta) * crane.r, ROPE_Y, Math.cos(crane.theta) * crane.r);

  // Haken-Pendel (Seil = Abstandsbegrenzung, nur auf Zug)
  const p = hook.p, q = hook.prev, wk = hooked ? load.windK : 0.01;
  verlet(p, q, h, 0.08, wind.x * wk, wind.z * wk);
  const dx = p.x - trolleyPos.x, dy = p.y - trolleyPos.y, dz = p.z - trolleyPos.z, len = Math.hypot(dx, dy, dz);
  if (len > crane.L) { const s = crane.L / len; p.set(trolleyPos.x + dx * s, trolleyPos.y + dy * s, trolleyPos.z + dz * s); }

  if (hooked) {
    const [hx, hz] = partExtents(load.def, load.psi);
    const r = collideBody(p, q, SLING, hx, hz, load.h);
    // Verdrehung um die Seilachse (Torsionsfeder zum Haken, lange Träger reagieren träge)
    if (!r.grounded) {
      let acc = load.yawK * wrapAngle(crane.theta + load.psi0 - load.psi) - load.yawC * load.psiV;
      if (load.def.twist) acc += Math.sin(2 * (wind.dir - load.psi)) * wind.s * 0.035;
      load.psiV += acc * h; load.psi += load.psiV * h;
    } else load.psiV *= 0.9;
    contact(r, (p.x - q.x) / h, (p.z - q.z) / h);
  } else {
    collideBody(p, q, 0, 0.3, 0.3, 1.2);
  }

  if (load && load.state === 'free') {
    const fp = load.fp, fq = load.fprev;
    verlet(fp, fq, h, 0.02, wind.x * load.windK, wind.z * load.windK);
    load.psi += load.psiV * h;
    const [hx, hz] = partExtents(load.def, load.psi);
    const r = collideBody(fp, fq, 0, hx, hz, load.h);
    if (r.grounded) load.psiV *= 0.8;
    const vx = (fp.x - fq.x) / h, vz = (fp.z - fq.z) / h;
    if (contact(r, vx, vz) && load && load.state === 'free' && r.grounded && Math.hypot(vx, vz) < 0.05) load.state = 'rest';
  }
}

// Kontakt auswerten: Schaden, Bruch, Einrasten. Rückgabe false = Bauteil weg.
function contact(r, vx, vz) {
  if (S.dmgCool <= 0 && r.bump > BUMP_V) damage('Anstoß!');
  if (!r.grounded) return true;
  if (r.impact > BREAK_V) { breakPart(); return false; }
  if (r.impact > DMG_V && S.dmgCool <= 0) damage('Harter Aufprall!');
  const t = load.target;
  loadTop(_lt);
  const d = Math.hypot(_lt.x - t.x, _lt.z - t.z), hs = Math.hypot(vx, vz);
  if (Math.abs(r.floor - t.y) < 0.15 && d < SNAP_TOL && symErr(load.psi - t.yaw, load.def.sym) < SNAP_YAW && hs < SNAP_SPEED) {
    snapPart(d, hs);
    return false;
  }
  return true;
}

// ============ Ereignisse ============
function damage(text) {
  S.dmgCool = 0.8; S.damage++; S.score = Math.max(0, S.score - 40); S.levelPoints -= 40; S.shake = 0.25;
  snd('hit');
  showMsg(text, '−40 Schaden', '#f87171');
}

function snapPart(d, hs) {
  const t = load.target;
  const prec = Math.round(100 * (1 - d / SNAP_TOL)), swing = Math.round(50 * (1 - hs / SNAP_SPEED)), time = Math.round(Math.max(0, 60 - S.partTimer));
  const pts = prec + swing + time;
  S.score += pts; S.levelPoints += pts; S.precSum += prec; S.placedCount++;
  load.mesh.position.set(t.x, t.y + load.h / 2, t.z); load.mesh.rotation.y = t.yaw;
  placedMeshes.push(load.mesh);
  const [hx, hz] = partExtents(load.def, t.yaw);
  solids.push({ x: t.x, z: t.z, hx, hz, y0: t.y, y1: t.y + load.h });
  load = null;
  if (ghost) { scene.remove(ghost); ghost = null; }
  snd('coin');
  showMsg('Eingerastet! +' + pts, `Präzision ${prec} · Ruhe ${swing} · Zeit ${time}`, '#4ade80');
  S.partIdx++;
  if (S.partIdx >= S.plan.length) S.levelDoneT = 1.2;
  else spawnPart();
}

function breakPart() {
  loadTop(_lt);
  const c = new THREE.Vector3(_lt.x, _lt.y - load.h / 2, _lt.z);
  for (let i = 0; i < 10; i++) {
    const m = box(rnd(0.2, 0.6), rnd(0.2, 0.5), rnd(0.2, 0.6), load.mesh.children[0].material, c.x + rnd(-1.5, 1.5), c.y, c.z + rnd(-1.5, 1.5), scene);
    debris.push({ m, v: new THREE.Vector3(rnd(-3, 3), rnd(2, 6), rnd(-3, 3)), life: 1.6 });
  }
  scene.remove(load.mesh); load = null;
  if (ghost) { scene.remove(ghost); ghost = null; }
  S.fails++; S.shake = 0.5;
  snd('hit');
  showMsg('Bauteil zerbrochen!', `Fehlversuch ${S.fails}/3`, '#f87171');
  if (S.fails >= 3) gameOver('Bauleitung greift ein!', '3 Fehlversuche – zu viele Bauteile zu Bruch gegangen.');
  else S.respawnT = 1.4;
}

function toggleHook() {
  if (S.mode !== 'play' || !load) return;
  if (load.state === 'hooked') {
    load.state = 'free';
    load.fp.set(hook.p.x, hook.p.y - SLING, hook.p.z);
    load.fprev.set(hook.prev.x, hook.prev.y - SLING, hook.prev.z);
    snd('playTone', 260, 0.12, 'square', 0.05);
    return;
  }
  if (Math.hypot(hook.p.x - load.fp.x, hook.p.z - load.fp.z) < 1.4) {
    const dy = hook.p.y - load.fp.y;
    if (dy > -load.h - 0.3 && dy < SLING + 1.4) {
      load.state = 'hooked'; load.psiV = 0;
      hook.p.set(load.fp.x, load.fp.y + SLING, load.fp.z); hook.prev.copy(hook.p);
      crane.L = clamp(trolleyPos.distanceTo(hook.p), L_MIN, L_MAX); crane.LV = 0;   // Seil nachlassen statt Ruck
      snd('playTone', 620, 0.1, 'square', 0.06);
      return;
    }
  }
  showMsg('Zu weit weg', 'Haken direkt über dem Bauteil absenken', '#fbbf24');
}

// ============ Wind ============
function updateWind(dt) {
  const base = LEVELS[S.level].wind;
  if (!base) { wind.s = wind.x = wind.z = 0; return; }
  wind.t -= dt;
  if (wind.t <= 0) { wind.t = rnd(2, 5); wind.target = base * rnd(0.35, 1.25); wind.dirTarget = wind.base + rnd(-0.5, 0.5); }
  wind.s = approach(wind.s, wind.target, 1.6 * dt);
  wind.dir += wrapAngle(wind.dirTarget - wind.dir) * Math.min(1, 0.5 * dt);
  wind.x = Math.sin(wind.dir) * wind.s; wind.z = Math.cos(wind.dir) * wind.s;
}

// ============ Spielablauf ============
function startGame() {
  S.score = 0; S.damage = 0;
  setupLevel(0);
  S.mode = 'play';
  hideModal();
}
function nextLevel() {
  if (S.level + 1 >= LEVELS.length) return;
  setupLevel(S.level + 1);
  S.mode = 'play';
  hideModal();
}
function saveBest() {
  const rec = S.score > S.best;
  if (rec) { S.best = S.score; try { AC && AC.saveScore(KEY, S.best); } catch (e) {} }
  return rec;
}
function gameOver(title, sub) {
  if (S.mode !== 'play') return;
  S.mode = 'over';
  snd('gameOver');
  const rec = saveBest();
  showModal({
    title, sub: sub + (rec ? '<br><b style="color:#facc15">🏆 Neuer Rekord!</b>' : ''),
    stats: [['Punkte', S.score], ['Rekord', S.best], ['Level', S.level + 1], ['Bauteile (Level)', S.partIdx]],
    primary: ['Neue Schicht (Enter)', startGame], secondary: ['Zur Arcade', () => { location.href = '../index.html'; }],
  });
}
function levelComplete() {
  const bonus = 150 * (S.level + 1);
  S.score += bonus; S.levelPoints += bonus;
  snd('powerup');
  const avg = S.placedCount ? Math.round(S.precSum / S.placedCount) : 0;
  if (S.level + 1 >= LEVELS.length) {
    S.mode = 'win';
    const rec = saveBest();
    showModal({
      title: 'Richtfest! 🎉', sub: 'Alle 5 Gebäude stehen. Die Bauleitung ist begeistert.' + (rec ? '<br><b style="color:#facc15">🏆 Neuer Rekord!</b>' : ''),
      stats: [['Punkte', S.score], ['Rekord', S.best], ['Ø Präzision', avg + '%'], ['Schäden', S.damage]],
      primary: ['Neue Schicht (Enter)', startGame], secondary: ['Zur Arcade', () => { location.href = '../index.html'; }],
    });
    return;
  }
  S.mode = 'levelDone';
  showModal({
    title: `Level ${S.level + 1} geschafft!`, sub: `Gebäudebonus +${bonus}. Nächstes Level: ${LEVELS[S.level + 1].wind ? 'Wind ' + LEVELS[S.level + 1].wind + ' m/s, ' : ''}höheres Gebäude.`,
    stats: [['Level-Punkte', S.levelPoints], ['Gesamt', S.score], ['Ø Präzision', avg + '%'], ['Fehlversuche', S.fails + '/3']],
    primary: ['Weiter (Enter)', nextLevel],
  });
}
function pauseGame() {
  if (S.mode !== 'play') return;
  S.mode = 'pause';
  keys.clear(); resetSticks();
  showModal({
    title: 'Pause', sub: 'Kran gesichert.', stats: [['Punkte', S.score], ['Level', S.level + 1]],
    primary: ['Weiter (Enter / Esc)', resumeGame], secondary: ['Neu starten (R)', startGame],
  });
}
function resumeGame() { if (S.mode === 'pause') { S.mode = 'play'; hideModal(); } }

// ============ UI ============
let modalOpts = null;
function showModal(o) {
  modalOpts = o;
  $('mTitle').textContent = o.title;
  $('mSub').innerHTML = o.sub;
  $('mStats').innerHTML = (o.stats || []).map(([l, v]) => `<div class="stat-box"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');
  $('mPrimary').textContent = o.primary[0];
  $('mSecondary').hidden = !o.secondary;
  if (o.secondary) $('mSecondary').textContent = o.secondary[0];
  $('modal').style.display = 'flex';
}
function hideModal() { $('modal').style.display = 'none'; modalOpts = null; }
$('mPrimary').addEventListener('click', () => modalOpts && modalOpts.primary[1]());
$('mSecondary').addEventListener('click', () => modalOpts && modalOpts.secondary && modalOpts.secondary[1]());

function showMsg(title, sub, color) {
  const el = $('msg');
  el.innerHTML = `<span style="color:${color}">${title}</span><small>${sub || ''}</small>`;
  el.classList.add('show'); S.msgT = 1.6;
}

const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
const _fwd = new THREE.Vector3();
function updateHUD() {
  setText('hLevel', String(S.level + 1));
  setText('hScore', String(S.score));
  setText('hBest', String(Math.max(S.best, S.score)));
  setText('hPart', `${Math.min(S.partIdx + 1, S.plan.length)}/${S.plan.length}`);
  setText('hFails', `${S.fails}/3`);
  setText('hRope', crane.L.toFixed(1) + ' m');
  let task = '', alt = '–';
  if (load) {
    loadTop(_lt);
    const t = load.target;
    alt = ((_lt.y - load.h) - t.y).toFixed(1) + ' m';
    if (load.state === 'hooked') task = `${load.def.name} zum Ziel bringen und langsam absetzen`;
    else if (load.state === 'free') task = 'Last fällt!';
    else task = Math.hypot(load.fp.x - YARD.x, load.fp.z - YARD.z) < 4 ? `Haken über ${load.def.name} senken und anhängen` : `${load.def.name} wieder anhängen`;
  } else task = S.respawnT > 0 ? 'Neues Bauteil wird geliefert …' : 'Gut gemacht!';
  setText('hAlt', alt);
  setText('task', task + (document.body.classList.contains('touch') ? '' : (load && load.state === 'hooked' ? ' · LEER = ausklinken' : load && load.state !== 'free' ? ' · LEER = anhängen' : '')));
  $('btnHook').classList.toggle('active', !!(load && load.state === 'hooked'));
  // Wind relativ zur Kamera
  if (wind.s > 0.05) {
    camera.getWorldDirection(_fwd); _fwd.y = 0; _fwd.normalize();
    const sx = wind.x * -_fwd.z + wind.z * _fwd.x, sy = wind.x * _fwd.x + wind.z * _fwd.z;
    $('windArrow').style.transform = `rotate(${Math.atan2(sx, sy)}rad)`;
    $('windArrow').style.opacity = 1;
    setText('windTxt', `Wind ${wind.s.toFixed(1)} m/s`);
  } else {
    $('windArrow').style.opacity = 0.25;
    setText('windTxt', 'Windstill');
  }
}

function updateSoundBtn() {
  const muted = AC ? AC.isMuted() : false;
  $('soundBtn').textContent = muted ? '🔇 Sound: Aus' : '🔊 Sound: An';
}
$('soundBtn').addEventListener('click', () => { if (AC) AC.toggleMute(); updateSoundBtn(); });
window.addEventListener('arcade_mute_changed', updateSoundBtn);
updateSoundBtn();

// ============ Kamera ============
const cam = { yaw: 2.8, pitch: 0.5, dist: 52, cab: false };
const focus = new THREE.Vector3(0, 10, 0), camTarget = new THREE.Vector3(), cabEye = new THREE.Vector3(), cabLook = new THREE.Vector3(0, 10, 0);
function toggleCam() {
  cam.cab = !cam.cab;
  camera.fov = cam.cab ? 68 : 55; camera.updateProjectionMatrix();
  cab.visible = !cam.cab;
}
$('camBtn').addEventListener('click', toggleCam);
$('pauseBtn').addEventListener('click', () => S.mode === 'pause' ? resumeGame() : pauseGame());

function updateCamera(dt) {
  if (load && load.state !== 'placed') loadTop(_lt); else _lt.copy(hook.p);
  if (cam.cab) {
    cabEye.set(1.7, JIB_H - 0.7, 1.2); jib.localToWorld(cabEye);
    camera.position.copy(cabEye);
    camTarget.set(_lt.x, _lt.y - 1, _lt.z);
    cabLook.lerp(camTarget, 1 - Math.exp(-6 * dt));
    camera.lookAt(cabLook);
  } else {
    camTarget.set(_lt.x * 0.5, Math.max(5, _lt.y * 0.5 + 3), _lt.z * 0.5);
    focus.lerp(camTarget, 1 - Math.exp(-2.5 * dt));
    const cp = Math.cos(cam.pitch);
    camera.position.set(focus.x + Math.sin(cam.yaw) * cp * cam.dist, focus.y + Math.sin(cam.pitch) * cam.dist, focus.z + Math.cos(cam.yaw) * cp * cam.dist);
    camera.lookAt(focus);
  }
  if (S.shake > 0) {
    camera.position.x += rnd(-1, 1) * S.shake * 0.5; camera.position.y += rnd(-1, 1) * S.shake * 0.5;
  }
}

// ============ Eingabe: Tastatur ============
const GAME_KEYS = ['KeyA', 'KeyD', 'KeyW', 'KeyS', 'KeyQ', 'KeyE', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if ($('modal').style.display === 'flex') {
    if (e.repeat) return;
    if (e.code === 'Enter' && modalOpts) { e.preventDefault(); modalOpts.primary[1](); }
    else if (e.code === 'Escape' && S.mode === 'pause') resumeGame();
    else if (e.code === 'KeyR' && (S.mode === 'pause' || S.mode === 'over' || S.mode === 'win')) startGame();
    return;
  }
  if (S.mode !== 'play') return;
  keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Space') toggleHook();
  else if (e.code === 'KeyC') toggleCam();
  else if (e.code === 'Escape' || e.code === 'KeyP') pauseGame();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); resetSticks(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// ============ Eingabe: Maus / Touch-Kamera ============
const canvas = renderer.domElement, ptrs = new Map();
let pinchDist = 0;
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') document.body.classList.add('touch');
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener('pointermove', e => {
  const pt = ptrs.get(e.pointerId);
  if (!pt) return;
  if (ptrs.size === 1) {
    cam.yaw -= (e.clientX - pt.x) * 0.006;
    cam.pitch = clamp(cam.pitch + (e.clientY - pt.y) * 0.005, 0.06, 1.45);
  }
  pt.x = e.clientX; pt.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) cam.dist = clamp(cam.dist * pinchDist / d, 14, 95);
    pinchDist = d;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); pinchDist = 0; };
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (1 + Math.sign(e.deltaY) * 0.1), 14, 95); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============ Eingabe: virtuelle Sticks ============
const sticks = {};
function makeStick(id, vertOnly) {
  const el = $(id), knob = el.querySelector('.knob');
  const st = { x: 0, y: 0, id: null };
  sticks[id] = st;
  const move = e => {
    const r = el.getBoundingClientRect(), rad = vertOnly ? r.height / 2 - 20 : r.width / 2 - 20;
    let dx = vertOnly ? 0 : e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const l = Math.hypot(dx, dy); if (l > rad) { dx *= rad / l; dy *= rad / l; }
    st.x = dx / rad; st.y = dy / rad;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); document.body.classList.add('touch'); st.id = e.pointerId; el.setPointerCapture(e.pointerId); move(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === st.id) move(e); });
  const end = e => { if (e.pointerId === st.id) { st.id = null; st.x = st.y = 0; knob.style.transform = ''; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}
function resetSticks() { for (const k in sticks) { sticks[k].x = sticks[k].y = 0; sticks[k].id = null; } document.querySelectorAll('.knob').forEach(k => k.style.transform = ''); }
makeStick('stickL', false);
makeStick('stickR', true);
$('btnHook').addEventListener('pointerdown', e => { e.preventDefault(); toggleHook(); });
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

function readInput() {
  const k = c => keys.has(c) ? 1 : 0;
  const dz = v => Math.abs(v) < 0.12 ? 0 : v;
  input.slew = clamp(k('KeyA') + k('ArrowLeft') - k('KeyD') - k('ArrowRight') - dz(sticks.stickL.x), -1, 1);
  input.trolley = clamp(k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown') - dz(sticks.stickL.y), -1, 1);
  input.winch = clamp(k('KeyQ') - k('KeyE') - dz(sticks.stickR.y), -1, 1);
}

// ============ Hauptschleife ============
function update(dt) {
  readInput();
  updateWind(dt);
  S.physAcc = Math.min(S.physAcc + dt, 12 * STEP);
  while (S.physAcc >= STEP && S.mode === 'play') { stepPhysics(STEP); S.physAcc -= STEP; }
  if (S.mode !== 'play') return;
  updateWorkers(dt);
  checkWorkerHit();
  S.partTimer += dt; S.dmgCool -= dt;
  if (S.respawnT > 0 && (S.respawnT -= dt) <= 0) spawnPart();
  if (S.levelDoneT > 0 && (S.levelDoneT -= dt) <= 0) levelComplete();
  // Seilwinde
  S.winchT -= dt;
  if (Math.abs(crane.LV) > 0.2 && S.winchT <= 0) {
    snd('playTone', 70 + Math.abs(crane.LV) * 30, 0.12, 'sawtooth', 0.025);
    S.winchT = 0.09;
  }
}

const _a = new THREE.Vector3(), _b = new THREE.Vector3();
function updateVisuals(dt, time) {
  jib.rotation.y = crane.theta;
  trolley.position.z = crane.r;
  trolleyPos.set(Math.sin(crane.theta) * crane.r, ROPE_Y, Math.cos(crane.theta) * crane.r);
  hookBlock.position.copy(hook.p); hookBlock.rotation.y = crane.theta;
  _a.copy(trolleyPos); _b.copy(hook.p);
  const len = _a.distanceTo(_b);
  rope.position.copy(_a).add(_b).multiplyScalar(0.5);
  rope.scale.y = Math.max(0.01, len);
  rope.quaternion.setFromUnitVectors(_up, _b.sub(_a).normalize());

  const pos = slingGeo.attributes.position.array;
  slings.visible = !!(load && load.state === 'hooked');
  if (load) {
    loadTop(_lt);
    load.mesh.position.set(_lt.x, _lt.y - load.h / 2, _lt.z);
    load.mesh.rotation.y = load.psi;
    if (slings.visible) {
      const [sx, , sz] = load.def.size, c = Math.cos(load.psi), s = Math.sin(load.psi);
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([i, j], k) => {
        const lx = i * sx * 0.42, lz = j * sz * 0.42;
        pos.set([hook.p.x, hook.p.y - 1.1, hook.p.z, _lt.x + lx * c + lz * s, _lt.y, _lt.z - lx * s + lz * c], k * 6);
      });
      slingGeo.attributes.position.needsUpdate = true;
    }
    // Absetzmarke & Ghost-Farbe
    const [hx, hz] = partExtents(load.def, load.psi);
    const fl = floorBelow(_lt.x, _lt.z, hx, hz, _lt.y - load.h);
    marker.visible = load.state !== 'rest';
    marker.position.set(_lt.x, fl + 0.04, _lt.z);
    const t = load.target, d = Math.hypot(_lt.x - t.x, _lt.z - t.z);
    const aligned = d < SNAP_TOL && symErr(load.psi - t.yaw, load.def.sym) < SNAP_YAW;
    const col = aligned ? 0x4ade80 : 0x22d3ee;
    ghostMat.color.setHex(col); ghostLineMat.color.setHex(col); marker.material.color.setHex(aligned ? 0x4ade80 : 0xffffff);
    $('hAltPill').classList.toggle('good', aligned);
    beacon.visible = load.state === 'rest';
    beacon.position.set(load.fp.x, load.fp.y + 2.2 + Math.sin(time * 4) * 0.3, load.fp.z);
  } else { marker.visible = false; beacon.visible = false; }
  if (ghost) ghostMat.opacity = 0.15 + 0.1 * Math.sin(time * 3);

  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.v.y -= G * dt; d.m.position.addScaledVector(d.v, dt);
    if (d.m.position.y < 0.15) { d.m.position.y = 0.15; d.v.multiplyScalar(0.4); d.v.y = Math.abs(d.v.y); }
    d.m.rotation.x += dt * 4; d.life -= dt;
    if (d.life <= 0) { scene.remove(d.m); debris.splice(i, 1); }
  }
  sockYaw.rotation.y = wind.dir;
  sockPitch.rotation.x = 1.3 * (1 - Math.min(1, wind.s / 7)) + Math.sin(time * 6) * 0.04 * wind.s / 7;

  if (S.msgT > 0 && (S.msgT -= dt) <= 0) $('msg').classList.remove('show');
  S.shake = Math.max(0, S.shake - dt);
  updateCamera(dt);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.mode === 'play') update(dt);
  updateVisuals(dt, now / 1000);
  updateHUD();
  renderer.render(scene, camera);
}

// Startbildschirm
setupLevel(0);
const touch = document.body.classList.contains('touch');
showModal({
  title: 'Kranführer 3D',
  sub: (touch
    ? 'Linker Stick: Ausleger drehen &amp; Laufkatze · Rechter Stick: Seil heben/senken · 🪝 Haken an/aus · Ein Finger: Kamera drehen · Zwei Finger: Zoom'
    : '<kbd>A</kbd>/<kbd>D</kbd> Ausleger drehen · <kbd>W</kbd>/<kbd>S</kbd> Laufkatze · <kbd>Q</kbd>/<kbd>E</kbd> Seil heben/senken<br><kbd>Leertaste</kbd> anhängen/ausklinken · <kbd>C</kbd> Kabinenansicht · Maus ziehen/Rad: Kamera') +
    '<br><br>Hol das Bauteil vom Lagerplatz und setz es langsam in den leuchtenden Umriss. Fang das Pendeln ab. Pass auf die Bauarbeiter auf!',
  stats: [['Rekord', S.best], ['Level', '5']],
  primary: ['Schicht beginnen (Enter)', startGame],
});
// Test-Hook für automatisierte Checks (nur mit ?debug)
if (/[?&]debug/.test(location.search)) window.__kran = { S, crane, hook, input, resetHook, toggleHook, get load() { return load; }, get workers() { return workers; } };
requestAnimationFrame(frame);
})();
