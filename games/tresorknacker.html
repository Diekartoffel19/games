<style>

  #noise {

  .primary {

  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #hint { display: none; }
  body.touch #noise { bottom: auto; top: calc(140px + env(safe-area-inset-top)); }
  body.touch #crack { bottom: auto; top: calc(130px + env(safe-area-inset-top)); }
  #stick {
    position: fixed; left: calc(20px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40;
    width: 150px; height: 150px; border-radius: 50%; touch-action: none;
    background: rgba(12, 10, 6, 0.5); border: 2px solid rgba(255, 210, 87, 0.35);
  }
  #knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(255, 210, 87, 0.7); pointer-events: none; }
  .tlabel { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-size: 0.72rem; font-weight: 800; color: rgba(255, 255, 255, 0.7); white-space: nowrap; pointer-events: none; }
  .tbtn {
    position: fixed; z-index: 40; right: calc(18px + env(safe-area-inset-right)); width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255, 210, 87, 0.5); background: rgba(12, 10, 6, 0.65); color: #f3e2b0; font-size: 1.3rem; touch-action: none;
  }
  #btnUse { bottom: calc(24px + env(safe-area-inset-bottom)); width: 76px; height: 76px; }
  #btnCrouch { bottom: calc(112px + env(safe-area-inset-bottom)); }
  #btnRun { bottom: calc(188px + env(safe-area-inset-bottom)); }
  #btnBack { bottom: calc(112px + env(safe-area-inset-bottom)); right: calc(96px + env(safe-area-inset-right)); display: none; }
  body.cracking #btnBack { display: block; }
  body.cracking #hint { display: none; }
  body.cracking #btnRun, body.cracking #btnCrouch, body.cracking #stick { display: none; }
  .tbtn.on { background: #8a6410; }
  #lookZone { position: fixed; right: calc(96px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); z-index: 5; font-size: 0.75rem; font-weight: 800; color: rgba(243, 226, 176, 0.45); pointer-events: none; text-align: right; }
</style>

<script>
(() => {
'use strict';

// ============ ArcadeCore ============
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const KEY = 'tresorknacker';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
const euro = n => Math.round(n).toLocaleString('de-DE') + ' €';
const V3 = THREE.Vector3, UP = new V3(0, 1, 0);

const DATA = window.TRESORKNACKER_MODELS;
if (!DATA) { $('mText').textContent = 'Modelle (models/tresorknacker_models.js) konnten nicht geladen werden.'; $('modal').style.display = 'flex'; $('mBtn').hidden = true; return; }

// ============ Tuning ============
const CELL = 2, WALL_H = 3.2, PR = 0.3;
const SPEED = { crouch: 1.6, walk: 3.2, run: 5.6 };
const NOISE = { crouch: 1.5, walk: 5, run: 10 };            // Hörradius der Wachen in m
const EYE = { crouch: 0.95, stand: 1.6 };
const SEE_RANGE = 9, SEE_RANGE_CROUCH = 6, SEE_ANGLE = 0.45, SEEN_LIMIT = 0.6;
const DAWN = 300;                                            // Sekunden echte Zeit = 01:00 bis 06:00 Uhr
const DIAL_N = 40;

// ============ Karte ============
// # Wand · c Schalter (niedrig: blockiert Sicht nur, wenn man sich duckt) · f Zaun · o draußen · . Boden
const MAP = [
  '######################',
  '#......#.............#',
  '#......#..#.....#....#',
  '#......#.............#',
  '#......#.............#',
  '#......######..#######',
  '###..########..#######',
  '#......######..#######',
  '#......######..#######',
  '#....................#',
  '#....................#',
  '#..cc...cc...........#',
  '#....................#',
  '#....................#',
  '#########..###########',
  'foooooooooooooooooooof',
  'foooooooooooooooooooof',
  'foooooooooooooooooooof',
  'ffffffffffffffffffffff',
];
const COLS = MAP[0].length, ROWS = MAP.length;
console.assert(MAP.every(r => r.length === COLS), 'MAP rows must have equal length');
const cellAt = (x, z) => { const c = Math.floor(x / CELL), r = Math.floor(z / CELL); return r < 0 || r >= ROWS || c < 0 || c >= COLS ? '#' : MAP[r][c]; };
const BUILDING_Z = 14 * CELL;                                // ab hier draußen

// Kollisionsboxen (x0, z0, x1, z1)
const SOLIDS = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const ch = MAP[r][c];
  if (ch === '#' || ch === 'f') SOLIDS.push([c * CELL, r * CELL, c * CELL + CELL, r * CELL + CELL]);
  if (ch === 'c') SOLIDS.push([c * CELL, r * CELL + 0.6, c * CELL + CELL, r * CELL + 1.4]);
}
// Sichtlinie: Wände blockieren immer, Schalter nur, wenn das Ziel geduckt ist
function losDist(ax, az, bx, bz, low, max) {
  const dx = bx - ax, dz = bz - az, d = Math.min(Math.hypot(dx, dz), max || 1e9), n = Math.ceil(d / 0.2);
  for (let i = 1; i <= n; i++) {
    const t = (i / n) * d / Math.hypot(dx, dz), ch = cellAt(ax + dx * t, az + dz * t);
    if (ch === '#' || (low && ch === 'c')) return (i - 1) / n * d;
  }
  return d;
}
const los = (ax, az, bx, bz, low) => losDist(ax, az, bx, bz, low) >= Math.hypot(bx - ax, bz - az) - 0.01;

// ============ Renderer ============
const isCoarse = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isCoarse ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !isCoarse;                       // Taschenlampen sollen nicht durch Wände leuchten
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 14, 42);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 120);
camera.rotation.order = 'YXZ';
function fitCamera() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 90 : 72;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
fitCamera(); addEventListener('resize', fitCamera);

scene.add(new THREE.AmbientLight(0x3a4562, 1.0));
[[7, 6], [29, 6], [20, 23], [6, 15]].forEach(([x, z]) => { const l = new THREE.PointLight(0x7f95c8, 0.55, 16, 1.5); l.position.set(x, 2.9, z); scene.add(l); });
const street = new THREE.PointLight(0xffa040, 1.3, 18, 1.6); street.position.set(30, 4.5, 33); scene.add(street);
const exitGlow = new THREE.PointLight(0x22ff66, 0.7, 6, 2); exitGlow.position.set(17, 2.6, 27.6); scene.add(exitGlow);

// ============ Texturen ============
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = 4; return t;
}
const floorTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#3b3e46'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2f3138'; g.fillRect(0, 0, w / 2, h / 2); g.fillRect(w / 2, h / 2, w / 2, h / 2);
  g.strokeStyle = '#22242a'; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.strokeRect(0, 0, w / 2, h / 2); g.strokeRect(w / 2, h / 2, w / 2, h / 2);
}, COLS, 14);
const wallTex = canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = '#8a8474'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3d2c1f'; g.fillRect(0, h * 0.68, w, h * 0.32);
  g.fillStyle = '#c9b071'; g.fillRect(0, h * 0.66, w, 3);
  g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, 0, 2, h);
});
const asphaltTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#1c1d21'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) { g.fillStyle = Math.random() < 0.5 ? '#25262b' : '#16171a'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, 12, 3);
function textTex(text, color, bg) {
  return canvasTex(256, 64, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = color; g.font = 'bold 34px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 2);
  });
}

// ============ Bank ============
const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
const fenceGeo = new THREE.BoxGeometry(CELL, 1.3, CELL);
const wallCells = [], fenceCells = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  if (MAP[r][c] === '#') wallCells.push([c, r]);
  if (MAP[r][c] === 'f') fenceCells.push([c, r]);
}
function instanced(geo, mat, cells, y) {
  const m = new THREE.InstancedMesh(geo, mat, cells.length), o = new THREE.Object3D();
  cells.forEach(([c, r], i) => { o.position.set(c * CELL + CELL / 2, y, r * CELL + CELL / 2); o.updateMatrix(); m.setMatrixAt(i, o.matrix); });
  m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
instanced(wallGeo, new THREE.MeshPhongMaterial({ map: wallTex, shininess: 5 }), wallCells, WALL_H / 2);
instanced(fenceGeo, new THREE.MeshPhongMaterial({ color: 0x4a4c52 }), fenceCells, 0.65);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS * CELL, BUILDING_Z), new THREE.MeshPhongMaterial({ map: floorTex, shininess: 30, specular: 0x222222 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(COLS * CELL / 2, 0, BUILDING_Z / 2); floor.receiveShadow = true; scene.add(floor);
const yard = new THREE.Mesh(new THREE.PlaneGeometry(COLS * CELL, (ROWS - 14) * CELL), new THREE.MeshPhongMaterial({ map: asphaltTex }));
yard.rotation.x = -Math.PI / 2; yard.position.set(COLS * CELL / 2, 0, BUILDING_Z + (ROWS - 14) * CELL / 2); yard.receiveShadow = true; scene.add(yard);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(COLS * CELL, BUILDING_Z), new THREE.MeshPhongMaterial({ color: 0x1c1e24 }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(COLS * CELL / 2, WALL_H, BUILDING_Z / 2); scene.add(ceil);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshBasicMaterial({ color: 0x07080b }));
ground.rotation.x = -Math.PI / 2; ground.position.set(22, -0.02, 20); scene.add(ground);

function sign(text, color, bg, x, y, z, rotY, w) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w || 1.2, (w || 1.2) / 4), new THREE.MeshBasicMaterial({ map: textTex(text, color, bg) }));
  m.position.set(x, y, z); m.rotation.y = rotY || 0; scene.add(m);

function tone(freq, dur, o = {}) {

  const ctx = AC.getAudioContext(); if (!ctx) return;
  try {

    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.gain || 0.1, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    if (ctx.createStereoPanner && o.pan) { const p = ctx.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); p.connect(ctx.destination); }
    else g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}

  tone(freq, dur, Object.assign({}, o, { gain: (o.gain || 0.1) * (1 - dist / range), pan: dist > 0.01 ? _d.dot(_rt) / dist : 0 }));
}

function dialClick(s, n) {
  const target = s.combo[s.step], d = Math.min(Math.abs(n - target), DIAL_N - Math.abs(n - target));
  const pan = Math.sin(n / DIAL_N * Math.PI * 2) * 0.85;
  const base = 1500 + (n * 37) % 320;
  let gain = 0.045, f = base;
  if (d === 0) { gain *= s.gain; f *= s.hi; }
  else if (d <= s.warm) gain *= 1 + (s.warm + 1 - d) * 0.35;

function collide() {
  for (let pass = 0; pass < 2; pass++) for (const b of SOLIDS) {
    const cx = clamp(player.x, b[0], b[2]), cz = clamp(player.z, b[1], b[3]);
    const dx = player.x - cx, dz = player.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= PR * PR) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); player.x = cx + dx / d * PR; player.z = cz + dz / d * PR; }
    else player.z = b[3] + PR; // genau auf der Kante: nach Süden schieben

}
function updatePlayer(dt) {
  const kx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stickX, kz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0) + stickY;
  player.yaw -= mouseDX * 0.0022 + ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * 2.2 * dt;
  player.pitch = clamp(player.pitch - mouseDY * 0.0022 + ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * 1.6 * dt, -1.3, 1.3);
  mouseDX = mouseDY = 0;
  const len = Math.min(1, Math.hypot(kx, kz));
  const running = (keys.ShiftLeft || keys.ShiftRight || touchRun) && !player.crouch;
  player.mode = player.crouch ? 'crouch' : running ? 'run' : 'walk';
  const moving = len > 0.1;
  if (moving) {
    const a = Math.atan2(kx, kz), sp = SPEED[player.mode] * len;
    const s = Math.sin(player.yaw + a), c = Math.cos(player.yaw + a);

    player.x += s * sp * dt; player.z += c * sp * dt;
    collide();
    player.stepAcc += sp * dt;
    const stride = player.mode === 'run' ? 1.5 : player.mode === 'walk' ? 1.1 : 0.8;
    if (player.stepAcc > stride) {
      player.stepAcc = 0;
      tone(rnd(60, 80), 0.08, { type: 'triangle', gain: player.mode === 'run' ? 0.14 : player.mode === 'walk' ? 0.06 : 0.02 });

  camera.rotation.set(player.pitch, player.yaw, 0);
}

      else g.seen = Math.max(0, g.seen - dt * 0.35);
      // Hören
      const hearR = los(g.x, g.z, player.x, player.z, false) ? player.noise : player.noise * 0.55;
      if (!visible && player.noise > 0.5 && d < hearR && g.state !== 'investigate' && g.state !== 'alert') noiseEvent(player.x, player.z, player.noise);
      if (g.seen >= SEEN_LIMIT) { lose('seen'); }
      maxSeen = Math.max(maxSeen, g.seen);
    }
    const alertish = g.state === 'alert' || g.state === 'investigate' || g.state === 'search';
    g.mark.visible = g.seen > 0.05 || alertish;
    g.mark.material.map = g.seen > 0.3 ? TEX_EX : TEX_Q;
    g.mark.material.color.setRGB(1, g.seen > 0.05 ? 1 - g.seen / SEEN_LIMIT : 0.85, g.seen > 0.05 ? 0.2 : 0.3);
  });
  $('seenFx').style.opacity = clamp(maxSeen / SEEN_LIMIT, 0, 1) * 0.9;
}
function turnTo(g, want, dt, rate) {
  const diff = wrapAngle(want - g.yaw);
  g.yaw += clamp(diff, -rate * dt, rate * dt);
  return diff;
}

// ============ Laser ============
function updateLasers(detect) {
  LASERS.forEach(L => {
    const t = (elapsed + L.phase) % LASER_CYCLE, on = t < LASER_ON, warn = !on && t > LASER_CYCLE - 0.45;
    if (on && !L.on) spatial(new V3(28, 1, L.z), 880, 0.06, { type: 'square', gain: 0.05 }, 14);
    L.on = on;
    L.g.visible = on || (warn && Math.floor(elapsed * 16) % 2 === 0);
    L.glow.opacity = on ? 0.35 + Math.sin(elapsed * 30) * 0.08 : 0.15;
    L.light.intensity = on ? 1.2 : 0;
    if (detect && on && Math.abs(player.z - L.z) < PR + 0.05 && player.x > 26 && player.x < 30) lose('laser');
  });
}

// ============ Beute & Flucht ============
function updatePickups(dt) {
  pickups = pickups.filter(p => {
    p.t += dt; p.p.root.rotation.y = p.t * 1.5;
    if (p.y === 0) p.p.root.position.y = 0.05 + Math.sin(p.t * 3) * 0.04;
    if (state !== 'play' || Math.hypot(player.x - p.x, player.z - p.z) > (p.y > 0 ? 1.5 : 0.9)) return true;
    loot += p.value; snd('coin');
    showMsg(`💰 +${euro(p.value)}<small>${p.label === 'Bonus' ? 'Nebenbei mitgenommen' : p.label + ' ausgeräumt'}</small>`, 1.4);
    scene.remove(p.p.root); return false;
  });
}
function checkExit(dt) {
  noVanMsg = Math.max(0, noVanMsg - dt);
  if (state !== 'play' || Math.hypot(player.x - VAN_EXIT.x, player.z - VAN_EXIT.z) > 1.8) return;
  if (safesOpen === 0) { if (noVanMsg <= 0) { showMsg('🚐 Ohne Tresor-Beute fahren wir nicht!<small>Knack mindestens einen Tresor</small>', 2); noVanMsg = 3; } return; }
  win();
}

// ============ Ende ============
function endState() {
  state = 'over'; stopCrack(); clearInput();
  if (document.pointerLockElement) document.exitPointerLock();
}
function lose(kind) {
  if (state !== 'play') return;
  endState(); siren(); snd('gameOver');
  const t = {
    seen: ['🚨 ERWISCHT!', 'Zu lange im Taschenlampen-Kegel – stiller Alarm ausgelöst. Die Polizei ist schon unterwegs.'],
    laser: ['🚨 ZAP!', 'Laser-Gitter berührt – der Tresorgang ist abgeriegelt.'],
    dawn: ['🌅 Zu spät!', 'Die Sonne geht auf und die Frühschicht schließt die Tür auf. Flucht verpasst.'],
  }[kind];
  openModal(t[0], t[1], 'Neuer Versuch', [['Beute (verloren)', euro(loot)], ['Tresore', safesOpen + '/3'], ['Uhrzeit', clockText()], ['Rekord', euro(best)]]);
}
function win() {
  endState(); snd('powerup'); tone(90, 0.5, { type: 'triangle', gain: 0.15, delay: 0.3 });
  const timeBonus = Math.round(timeLeft) * 100, perfect = safesOpen === 3 ? 25000 : 0, total = loot + timeBonus + perfect;
  const record = total > best;
  if (record) { best = total; if (AC) AC.saveScore(KEY, best); }
  openModal(record ? '🏆 Neuer Rekord!' : '🚐 Flucht gelungen!',
    safesOpen === 3 ? 'Perfekter Coup: alle drei Tresore leer, keiner hat etwas gesehen.' : `Beute im Sack – aber ${3 - safesOpen} Tresor${safesOpen === 2 ? '' : 'e'} blieb${safesOpen === 2 ? '' : 'en'} zu.`,
    'Nächster Bruch', [['Beute', euro(loot)], ['Zeitbonus', euro(timeBonus)], ['Perfekt-Bonus', euro(perfect)], ['Gesamt', euro(total)], ['Tresore', safesOpen + '/3'], ['Rekord', euro(best)]]);
}

function clockText() {
  const mins = 60 + (DAWN - timeLeft) / DAWN * 300; // 01:00 -> 06:00
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(Math.floor(mins % 60)).padStart(2, '0');
}
function updateHud() {
  $('hLoot').textContent = euro(loot); $('hSafes').textContent = safesOpen + '/3'; $('hBest').textContent = euro(best);
  $('hClock').textContent = clockText();
  $('hLeft').textContent = '· Dämmerung in ' + Math.ceil(timeLeft) + ' s';
  $('clockPill').classList.toggle('late', timeLeft < 60);
  $('noiseFill').style.width = clamp(player.noise / NOISE.run, 0, 1) * 100 + '%';
  $('noiseTxt').textContent = 'LÄRM · ' + (cracking ? 'still' : { crouch: 'geduckt', walk: 'gehen', run: 'RENNEN' }[player.mode]);
  if (cracking) {
    $('crackNum').textContent = String(cracking.num).padStart(2, '0');
    document.querySelectorAll('.led').forEach((el, i) => el.classList.toggle('on', i < cracking.step));
  }
  let p = '';
  if (state === 'play' && !cracking) {
    const s = nearSafe();
    if (s) p = (isTouch ? '✋' : '<kbd>E</kbd>') + ' ' + s.name + ' knacken';
    else if (player.z > BUILDING_Z && safesOpen > 0) p = '🚐 Zum Fluchtwagen!';
  }
  $('prompt').innerHTML = p;
  $('btnUse').textContent = cracking ? '🔓' : '✋';
  $('btnCrouch').classList.toggle('on', player.crouch);
}

function openModal(title, text, btn, stats) {
  $('mTitle').textContent = title; $('mText').innerHTML = text; $('mBtn').textContent = btn;
  $('mStats').innerHTML = (stats || []).map(([k, v]) => `<div class="stat"><div>${k}</div><div>${v}</div></div>`).join('');
  $('modal').style.display = 'flex';
}
function start() {
  if (state === 'play') return;
  $('modal').style.display = 'none';
  if (state !== 'pause') resetGame();
  state = 'play';
  if (!isTouch) lockPointer();
}
function clearInput() {
  for (const k in keys) keys[k] = false;
  mouseDX = mouseDY = 0; dialAcc = 0; touchRun = false; stickX = stickY = 0; stickId = null; lookId = null; knob.style.transform = '';
  $('btnRun').classList.remove('on');
}
function pause() {
  if (state !== 'play') return;
  state = 'pause'; clearInput();
  if (document.pointerLockElement) document.exitPointerLock();
  openModal('⏸ Pause', 'Die Wachen drehen weiter ihre Runden, sobald du zurück bist.', 'Weiter');
}

// ============ Eingabe ============
const canvas = renderer.domElement;
let pointerLocked = false;
function lockPointer() { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
document.addEventListener('pointerlockchange', () => {
  const now = document.pointerLockElement === canvas;
  if (pointerLocked && !now && state === 'play') pause();
  pointerLocked = now;
});
document.addEventListener('mousemove', e => { if (pointerLocked && state === 'play') { mouseDX += e.movementX; mouseDY += e.movementY; } });

function useAction() {
  if (state !== 'play') return;
  if (cracking) { lockIn(); return; }
  const s = nearSafe(); if (s) startCrack(s);
}
function toggleCrouch() { if (state === 'play' && !cracking) player.crouch = !player.crouch; }

let lookId = null, lookX = 0, lookY = 0;
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') {
    if (e.button !== 0) return;
    if (!pointerLocked) { lockPointer(); return; }
    if (cracking) lockIn();
    return;
  }
  setTouch();
  if (e.clientX < innerWidth * 0.4 || lookId !== null) return;
  lookId = e.pointerId; lookX = e.clientX; lookY = e.clientY;
});
addEventListener('pointermove', e => {
  if (e.pointerId !== lookId) return;
  mouseDX += (e.clientX - lookX) * 1.6; mouseDY += (e.clientY - lookY) * 1.6; lookX = e.clientX; lookY = e.clientY;
});
const lookEnd = e => { if (e.pointerId === lookId) lookId = null; };
addEventListener('pointerup', lookEnd); addEventListener('pointercancel', lookEnd);

addEventListener('keydown', e => {
  if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (state === 'play' && cracking && ['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) turnDial(e.code === 'ArrowRight' || e.code === 'KeyD' ? 1 : -1);
  if (e.repeat) return;
  if (e.code === 'KeyE') { if (cracking) stopCrack(); else useAction(); }
  if (e.code === 'Space' && cracking) lockIn();
  if ((e.code === 'KeyQ' || e.code === 'Backspace') && cracking) stopCrack();
  if (e.code === 'KeyC' || e.code === 'ControlLeft' || e.code === 'ControlRight') toggleCrouch();
  if (e.code === 'Escape' && state === 'play') pause();
  if (e.code === 'KeyP') { if (state === 'play') pause(); else if (state === 'pause') start(); }
  if (e.code === 'Enter' && state !== 'play') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.blur()));
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function setTouch() { if (!isTouch) { isTouch = true; document.body.classList.add('touch'); } }
addEventListener('touchstart', setTouch, { passive: true, once: true });

const stick = $('stick'), knob = $('knob');
let stickId = null;
function stickMove(e) {
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  stickX = Math.abs(x) < 0.12 ? 0 : x; stickY = Math.abs(y) < 0.12 ? 0 : y;
  knob.style.transform = `translate(${x * R * 0.6}px, ${y * R * 0.6}px)`;
}
stick.addEventListener('pointerdown', e => { setTouch(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
const stickEnd = e => { if (e.pointerId !== stickId) return; stickId = null; stickX = stickY = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
const tap = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); setTouch(); fn(); });
tap($('btnUse'), useAction);
tap($('btnCrouch'), toggleCrouch);
tap($('btnBack'), stopCrack);
const run = $('btnRun');
run.addEventListener('pointerdown', e => { e.preventDefault(); setTouch(); run.setPointerCapture(e.pointerId); touchRun = true; run.classList.add('on'); });
const runOff = () => { touchRun = false; run.classList.remove('on'); };
run.addEventListener('pointerup', runOff); run.addEventListener('pointercancel', runOff);

$('mBtn').addEventListener('click', start);
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pause(); else if (state === 'pause') start(); });
const soundLabel = () => { $('soundBtn').textContent = AC && AC.isMuted() ? '🔇' : '🔊'; };
$('soundBtn').addEventListener('click', () => { if (AC) AC.toggleMute(); soundLabel(); });
soundLabel();

// ============ Loop ============
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    elapsed += dt; timeLeft -= dt;
    if (cracking) updateCrack(dt); else updatePlayer(dt);
    updateSafes(dt); updateGuards(dt, true); updateLasers(true); updatePickups(dt); checkExit(dt);
    if (state === 'play' && timeLeft <= 0) { timeLeft = 0; lose('dawn'); }
    if (msgTimer > 0 && (msgTimer -= dt) <= 0) $('msg').classList.remove('show');
    updateHud();
  } else if (state === 'menu') {
    // Menü: Kamera schaut durch die Schalterhalle, die Wachen drehen schon ihre Runden
    elapsed += dt; updateGuards(dt, false); updateLasers(false); updatePickups(dt);
    camera.position.set(3.5, 2.4, 27); camera.rotation.set(-0.12, -0.9 + Math.sin(elapsed * 0.15) * 0.35, 0);
  }
  renderer.render(scene, camera);
}

resetGame();
$('hBest').textContent = euro(best);
openModal('🔐 Tresorknacker 3D', 'Nachts in der Bank: Knacke <b>3 Tresore</b>, schnapp die Beute und erreiche den <b>Fluchtwagen</b> vor der Dämmerung (06:00).<br><br>' +
  '<b>Zahlenschloss:</b> <b>E</b> am Tresor, dann drehen und <b>hinhören</b> – auf der richtigen Zahl klickt es lauter und höher. <b>Leertaste</b> rastet ein, 3 Zahlen öffnen. Kopfhörer helfen!<br><br>' +
  '<b>Wachen:</b> Bleib aus den Taschenlampen-Kegeln (über 0,6 s gesehen = Alarm). <b>C/Strg</b> duckt dich leise – geduckt verstecken dich die Schalter. <b>Shift</b> rennt, ist aber laut. ' +
  'Im Tresorgang schalten <b>Laser-Gitter</b> im Takt – sie blinken kurz vorher.', 'Einbrechen');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
