<script>
(() => {
'use strict';

// ============ ArcadeCore ============
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const KEY = 'seiltaenzer';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const V3 = THREE.Vector3;

const DATA = window.SEILTAENZER_MODELS;
if (!DATA) { $('mText').textContent = 'Modelle (models/seiltaenzer_models.js) konnten nicht geladen werden.'; $('modal').style.display = 'flex'; $('mBtn').hidden = true; return; }

// ============ Tuning ============
const ROPE_Y = 1.1, ROOF = 16, ANCHOR_IN = 6.8, CLAMP = 0.85, GROUND_Y = -180;
const FALL_AT = 0.62;              // Neigung (rad), ab der man fällt
const PERFECT = 0.06;              // Stil-Bereich
const WALK_MAX = 2.2, LIVES = 3;
// Level-Parameter: Spannweite, Böen, Seil-Schwingen, Tauben, schlaffes Seil, Regen
function lvl(n) {
  return {
    L: Math.min(110, 30 + 12 * n),
    gust: Math.min(1.5, 0.45 + 0.17 * n), gustEvery: Math.max(3.2, 9 - 0.8 * n),
    sway: Math.min(0.7, 0.1 + 0.08 * n),
    pigeons: n >= 2, pigeonEvery: Math.max(5, 15 - 1.4 * n),
    slack: n >= 4, rain: n >= 5,
  };
}
const NEWS = {
  2: 'Tauben! 🐦<small>Sie landen auf der Stange – Leertaste schüttelt sie ab</small>',
  3: 'Das Seil schwingt stärker<small>In der Mitte am schlimmsten</small>',
  4: 'Schlaffes Seil<small>Mehr Durchhang, wackliger Stand</small>',
  5: 'Regen 🌧️<small>Rutschige Stange, unruhiger Wind</small>',
};

// ============ Renderer ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x7a4f70, 0.0026);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 2500);
function fitCamera() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 82 : 62;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
fitCamera(); addEventListener('resize', fitCamera);

// ============ Dämmerungs-Himmel ============
const SUN_DIR = new V3(-0.55, 0.07, -0.83).normalize();
{
  const g = new THREE.SphereGeometry(1800, 32, 20), col = [], c = new THREE.Color();
  const stops = [[-1, 0x2a1d3a], [-0.05, 0x5a3355], [0.0, 0xff8a4c], [0.06, 0xf06a5a], [0.2, 0x7a3f78], [0.5, 0x2c2456], [1, 0x0f1030]];
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 1800;
    let k = 0; while (k < stops.length - 2 && y > stops[k + 1][0]) k++;
    const [y0, c0] = stops[k], [y1, c1] = stops[k + 1];
    c.set(c0).lerp(new THREE.Color(c1), clamp((y - y0) / (y1 - y0), 0, 1));
    // Richtung Sonne etwas heller
    const s = Math.max(0, (p.getX(i) * SUN_DIR.x + p.getZ(i) * SUN_DIR.z) / 1800);
    c.lerp(new THREE.Color(0xffb070), s * s * 0.35 * clamp(1 - Math.abs(y) * 3, 0, 1));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  var sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -1; scene.add(sky);
  var sun = new THREE.Mesh(new THREE.CircleGeometry(38, 32), new THREE.MeshBasicMaterial({ color: 0xffd08a, fog: false }));
  scene.add(sun);
}
scene.add(new THREE.HemisphereLight(0xffb89a, 0x2a2048, 0.75));
const sunLight = new THREE.DirectionalLight(0xff9a5a, 1.25);
sunLight.position.copy(SUN_DIR).multiplyScalar(100).add(new V3(0, 40, 0)); scene.add(sunLight);
const fill = new THREE.DirectionalLight(0x8a7aff, 0.35); fill.position.set(30, 20, 40); scene.add(fill);

// ============ Texturen ============
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = 4; t.encoding = THREE.sRGBEncoding;
  return t;
}
// Fassade: Fensterraster, ein Teil der Fenster ist beleuchtet (eigene Emissive-Map)
const LIT = [];
for (let i = 0; i < 8 * 32; i++) LIT.push(Math.random() < 0.28 ? ['#ffd38a', '#ffe7b0', '#ffb45a', '#cfe8ff'][Math.floor(Math.random() * 4)] : null);
const drawWindows = emissive => (x, w, h) => {
  x.fillStyle = emissive ? '#000' : '#2a2c38'; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 32; r++) for (let c = 0; c < 8; c++) {
    const lit = LIT[r * 8 + c];
    x.fillStyle = emissive ? (lit || '#000') : lit ? '#806a50' : (r + c) % 3 ? '#1a1d28' : '#33405a';
    x.fillRect(c * 16 + 3, r * 8 + 2, 10, 5);
  }
};
const facadeMap = canvasTex(128, 256, drawWindows(false), 2, 2);
const facadeEmit = canvasTex(128, 256, drawWindows(true), 2, 2);
const facadeMat = new THREE.MeshLambertMaterial({ map: facadeMap, emissiveMap: facadeEmit, emissive: 0xffffff, emissiveIntensity: 0.95 });
const roofTopMat = new THREE.MeshLambertMaterial({ color: 0x24242c });
const streetTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#16121c'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#ff9a40'; x.fillRect(0, 120, w, 16); x.fillRect(120, 0, 16, h);
  x.fillStyle = '#ffe0a0'; for (let i = 0; i < w; i += 16) { x.fillRect(i, 122, 6, 3); x.fillRect(122, i, 3, 6); }
  x.fillStyle = '#ff3030'; for (let i = 8; i < w; i += 32) { x.fillRect(i, 131, 6, 3); x.fillRect(131, i, 3, 6); }
}, 60, 60);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshBasicMaterial({ map: streetTex }));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, GROUND_Y, -1200); scene.add(ground);

// ============ Modelle aus Blender ============
const MATS = {};
const matFor = (c, e) => MATS[c + e] || (MATS[c + e] = new THREE.MeshStandardMaterial({
  color: c, flatShading: true, roughness: 0.85, metalness: 0.05, emissive: e ? c : 0x000000, emissiveIntensity: e ? 1.2 : 0 }));
const MODEL = {};
DATA.objects.forEach(o => {
  const g = new THREE.Group();
  o.parts.forEach(p => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(p.v, 3)); geo.setIndex(p.f); geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, matFor(p.c, p.e)));
  });
  g.position.fromArray(o.t);
  MODEL[o.n] = { g, parent: o.p };
});
// Baum aus Teilen mit gleichem Präfix (z.B. walker_body/legL/legR/pole), jedes Mal frisch geklont
function makeRig(prefix) {
  const parts = {};
  Object.keys(MODEL).filter(n => n.startsWith(prefix + '_')).forEach(n => { parts[n.slice(prefix.length + 1)] = MODEL[n].g.clone(); });
  Object.keys(parts).forEach(k => { const p = MODEL[prefix + '_' + k].parent; if (p) parts[p.slice(prefix.length + 1)].add(parts[k]); });
  return parts;
}
const ROOFS = ['roof_A', 'roof_B', 'roof_C'];

// ============ Welt: Gebäude-Kette, Seile, Hintergrund-Stadt ============
const spans = [];     // { level, L, z0, z1, rope (statisches Mesh) }
const buildings = []; // z-Mitte jedes Gebäudes
const shaftGeo = new THREE.BoxGeometry(ROOF, -GROUND_Y, ROOF);
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xd9c7a0, roughness: 0.6, metalness: 0.3 });
const plankMat = new THREE.MeshLambertMaterial({ color: 0x8a5a32 });
function addBuilding(zc, k) {
  const shaft = new THREE.Mesh(shaftGeo, [facadeMat, facadeMat, roofTopMat, roofTopMat, facadeMat, facadeMat]);
  shaft.position.set(0, GROUND_Y / 2 - 0.3, zc); scene.add(shaft);
  const roof = MODEL[ROOFS[k % 3]].g.clone(); roof.position.set(0, 0, zc); if (k % 2) roof.rotation.y = Math.PI; scene.add(roof);
  if (k > 0) { const a = MODEL.anchor.g.clone(); a.position.set(0, 0, zc + ANCHOR_IN); a.rotation.y = Math.PI; scene.add(a); }
  const d = MODEL.anchor.g.clone(); d.position.set(0, 0, zc - ANCHOR_IN); scene.add(d);
  const plank = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, ANCHOR_IN * 2 - 1.2), plankMat);
  plank.position.set(0, 1.0, zc); scene.add(plank);
  buildings.push(zc);
}
function ensureWorld(k) {
  if (!buildings.length) addBuilding(0, 0);
  while (spans.length < k + 3) {
    const n = spans.length, P = lvl(n + 1), z0 = buildings[n] - ANCHOR_IN - CLAMP, z1 = z0 - P.L;
    const s = { level: n + 1, L: P.L, z0, z1, P };
    s.rope = new THREE.Mesh(ropeGeo(s, 0, 0, 0), ropeMat); scene.add(s.rope);
    spans.push(s);
    addBuilding(z1 - ANCHOR_IN - CLAMP, n + 1);
  }
}
// Seilform: Durchhang + Delle unter dem Läufer + seitliches Schwingen
const sagOf = s => s.P.slack ? 1.8 : 0.7;
function ropePoint(s, f, uw, dip, sx, out) {
  const tri = uw <= 0 ? 0 : f < uw ? f / uw : (1 - f) / Math.max(1e-4, 1 - uw);
  return out.set(sx * Math.sin(Math.PI * f), ROPE_Y - sagOf(s) * 4 * f * (1 - f) - dip * tri, s.z0 + (s.z1 - s.z0) * f);
}
function ropeGeo(s, uw, dip, sx) {
  const pts = [];
  for (let i = 0; i <= 40; i++) pts.push(ropePoint(s, i / 40, uw, dip, sx, new V3()));
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.03, 5, false);
}

// Hintergrund-Stadt: eine InstancedMesh-Ladung Hochhäuser links und rechts
{

function tone(freq, dur, o = {}) {

  const ctx = AC.getAudioContext(); if (!ctx) return;
  try {

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.gain || 0.1, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    else g.connect(ctx.destination);

  } catch (e) {}
}

    `<path d="${arcPath(-MAXDEG - 3, MAXDEG + 3, ARC_R)}" stroke="rgba(30,14,30,0.8)" stroke-width="22" fill="none" stroke-linecap="round"/>` +
    segs.map(([a, b, c]) => `<path d="${arcPath(deg(a), deg(b), ARC_R)}" stroke="${c}" stroke-width="12" fill="none" opacity="0.85"/>`).join('') +
    `<g id="poleMark"><path d="M${CX} ${CY - ARC_R + 12} l-6 10 h12 z" fill="#7dd3fc"/></g>` +
    `<g id="needle"><line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - ARC_R - 10}" stroke="#1a0a1a" stroke-width="8" stroke-linecap="round"/><line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - ARC_R - 10}" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="${CX}" cy="${CY}" r="7" fill="#fff"/></g>`;
}
function updateHud() {
  $('hScore').textContent = score; $('hLevel').textContent = span() ? span().level : 1;
  $('hDist').textContent = Math.floor(distDone + u); $('hStyle').textContent = Math.floor(style);
  $('hLives').textContent = lives; $('hBest').textContent = Math.max(best, score);
  $('stylePill').classList.toggle('on', perfectT > 0.3);
  $('meter').classList.toggle('perfect', perfectT > 0.3);
  const pig = pigeons.some(p => p.state === 'sit');
  $('meterTxt').innerHTML = Math.abs(theta) > 0.4 ? 'VORSICHT!' : pig ? '🐦 <kbd>Leer</kbd> abschütteln' : perfectT > 1.5 ? 'PERFEKT ✨' : 'BALANCE · <span style="color:#7dd3fc">▲ Stange</span>';
  $('needle').setAttribute('transform', `rotate(${clamp(theta / FALL_AT, -1.1, 1.1) * MAXDEG} ${CX} ${CY})`);
  $('poleMark').setAttribute('transform', `rotate(${pole * MAXDEG * 0.9} ${CX} ${CY})`);
  $('progFill').style.width = (span() ? (phase === 'roof' ? 100 : u / span().L * 100) : 0) + '%';
}

// ============ Ablauf ============
function openModal(title, text, btn, stats) {
  $('mTitle').textContent = title; $('mText').innerHTML = text; $('mBtn').textContent = btn;
  $('mStats').innerHTML = (stats || []).map(([k, v]) => `<div class="stat"><div>${k}</div><div>${v}</div></div>`).join('');
  $('modal').style.display = 'flex';
}
function start() {
  if (state === 'play') return;
  $('modal').style.display = 'none';
  initWind();
  if (state === 'over' && resumeFromCp) {
    resumeFromCp = false; bonus = cpBonus; style = cpStyle; score = Math.floor(distDone * 10 + style + bonus); clearInput(); placeAtSpanStart();
    showMsg(`Seil ${span().level} · zweiter Versuch`, 1.6);
  } else if (state !== 'pause') {
    resetGame();
    showMsg(`Seil 1 · ${span().L} m<small>Halte die Nadel in der Mitte</small>`, 2.4);
  }
  state = 'play';
}
function clearInput() {
  for (const k in keys) keys[k] = false;
  mouseWalk = touchWalk = false; touchPts.clear();
  document.querySelectorAll('.tbtn.on').forEach(el => { if (el.id !== 'btnTilt') el.classList.remove('on'); });
}
function pause() {
  if (state !== 'play') return;
  state = 'pause'; clearInput(); setWindSound(0, 0);
  openModal('⏸ Pause', 'Das Seil wartet. Der Wind nicht unbedingt.', 'Weiter');
}

// ============ Eingabe ============
const canvas = renderer.domElement;
document.addEventListener('mousemove', e => {
  mouseP = clamp((e.clientX / innerWidth - 0.5) * 2.4, -1, 1); mouseActive = true;
});
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') { if (e.button === 0) { mouseWalk = true; canvas.setPointerCapture(e.pointerId); } return; }
  setTouch(); touchPts.set(e.pointerId, e.clientX);
});
canvas.addEventListener('pointermove', e => { if (touchPts.has(e.pointerId)) touchPts.set(e.pointerId, e.clientX); });
const ptrEnd = e => { if (e.pointerType === 'mouse' && e.button === 0) mouseWalk = false; touchPts.delete(e.pointerId); };
addEventListener('pointerup', ptrEnd); addEventListener('pointercancel', ptrEnd);

addEventListener('keydown', e => {
  if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight'].includes(e.code)) mouseActive = false; // Tastatur hat Vorrang, bis die Maus wieder bewegt wird
  if (e.repeat) return;
  if (e.code === 'Space') shakePole();
  if (e.code === 'Escape' && state === 'play') pause();
  if (e.code === 'KeyP') { if (state === 'play') pause(); else if (state === 'pause') start(); }
  if (e.code === 'Enter' && state !== 'play') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.blur()));
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function setTouch() { if (!isTouch) { isTouch = true; document.body.classList.add('touch'); } }
addEventListener('touchstart', setTouch, { passive: true, once: true });
function holdBtn(el, set) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); setTouch(); el.setPointerCapture(e.pointerId); set(true); el.classList.add('on'); });
  const off = () => { set(false); el.classList.remove('on'); };
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
}
holdBtn($('btnWalk'), on => { touchWalk = on; });
$('btnShake').addEventListener('pointerdown', e => { e.preventDefault(); setTouch(); shakePole(); });
// Neigungssteuerung (Handy kippen); iOS braucht eine Erlaubnis per Tipp
addEventListener('deviceorientation', e => {
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const val = ang === 90 ? e.beta : ang === -90 || ang === 270 ? -e.beta : e.gamma;
  if (val != null) tiltP = clamp(val / 22, -1, 1);
});
$('btnTilt').addEventListener('click', () => {
  const toggle = () => { tiltOn = !tiltOn; $('btnTilt').classList.toggle('on', tiltOn); document.body.classList.toggle('tilt', tiltOn); };
  if (!tiltOn && window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') toggle(); }).catch(() => {});
  } else toggle();
});

$('mBtn').addEventListener('click', start);
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pause(); else if (state === 'pause') start(); });
const soundLabel = () => { $('soundBtn').textContent = AC && AC.isMuted() ? '🔇' : '🔊'; };
$('soundBtn').addEventListener('click', () => { if (AC) AC.toggleMute(); soundLabel(); });
soundLabel();

// ============ Loop ============
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let fx = { windF: 0, ge: { warn: 0, f: 0 } };
  if (state === 'play') {
    elapsed += dt;
    if (phase === 'rope') fx = stepRope(dt);
    else if (phase === 'roof') stepRoof(dt);
    else if (phase === 'fall') stepFall(dt);
    updatePigeons(dt);
    if (msgTimer > 0 && (msgTimer -= dt) <= 0) $('msg').classList.remove('show');
    if (flashT > 0) { flashT = Math.max(0, flashT - dt * 1.2); $('flash').style.opacity = flashT; }
    updateHud();
  } else if (state === 'menu') {
    // Menü: leichtes Schaukeln, Kamera kreist langsam
    demoT += dt; theta = Math.sin(demoT * 0.9) * 0.08; pole = -Math.sin(demoT * 0.9 - 0.4) * 0.5;
  }
  if (state === 'play' || state === 'menu') updateWalker(dt);
  if (state !== 'play' || phase === 'fall') setWindSound(0, 0);
  if (state === 'menu') {
    const p = W.body.position;
    camera.position.set(p.x + Math.sin(demoT * 0.15) * 7, p.y + 2.5, p.z + Math.cos(demoT * 0.15) * 7);
    camera.lookAt(p.x, p.y - 0.5, p.z - 4);
    sky.position.copy(camera.position);
    sun.position.copy(camera.position).addScaledVector(SUN_DIR, 1600); sun.lookAt(camera.position);
  } else if (state === 'play' || state === 'over') updateCamera(dt);
  updateFx(dt, fx.windF, fx.ge);
  renderer.render(scene, camera);
}

ensureWorld(0); placeAtSpanStart();
$('hBest').textContent = best;
openModal('🎪 Seiltänzer 3D', 'Ein Drahtseil, eine Balancierstange und 180 Meter Abenddämmerung darunter. ' +
  'Du kippst ständig zur Seite – fang die Neigung mit <b>A</b>/<b>D</b> oder der <b>Maus</b> ab, indem du die Stange neigst. ' +
  '<b>W</b> oder <b>Klick halten</b> = gehen. Schneller gehen = mehr Wackeln.<br><br>' +
  '💨 <b>Böen</b> kündigen sich mit Windlinien und Rauschen an. Das Seil schwingt in der Mitte am stärksten. ' +
  '🐦 <b>Tauben</b> landen auf der Stange – <b>Leertaste</b> schüttelt sie ab. Jedes Dach ist ein Checkpoint, ' +
  'Zeit in perfekter Balance gibt ✨ Stilpunkte.', 'Aufs Seil');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
