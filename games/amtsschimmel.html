<style>
:root { --wall:#d9d2bd; --ink:#2a2a24; --paper:#fbf8ef; --hud:#2f3a33; --g:#1f9a3a; --r:#c42b23; --y:#d08a0c; }
html, body { height:100%; overflow:hidden; }
body { margin:0; padding:0; text-align:left; background:var(--wall); color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; height:100dvh; min-height:0; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
.back { position:fixed; top:7px; left:8px; background:#1d2520; color:#fff; border-color:#ffffff33; min-height:34px; padding:6px 12px; }
button { font:inherit; cursor:pointer; touch-action:manipulation; }

/* HUD */
#hud { background:var(--hud); color:#f3efe2; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; padding:5px 10px 5px 92px; font-size:13px; min-height:48px; }
.hb { display:flex; flex-direction:column; line-height:1.15; }

.meter { width:88px; }
.bar { height:8px; background:#0006; border-radius:4px; overflow:hidden; margin-top:2px; }

#rugen { letter-spacing:2px; }
#mute { margin-left:auto; background:#ffffff18; color:#fff; border:1px solid #ffffff33; border-radius:8px; padding:4px 10px; }

/* Layout */
#main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(210px,24%) 1fr 172px; gap:8px; padding:8px; }
#schalter { background:linear-gradient(#cfc6ab,#bfb597); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; border:3px solid #9c9273; min-height:0; }
#window { position:relative; flex:0 0 auto; height:200px; background:linear-gradient(#b8d3df 0 58%, #9aa98f 58%); border-bottom:8px solid #7d6a4a; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }
#window .sign { position:absolute; top:6px; left:50%; transform:translateX(-50%); background:#234; color:#fff; font:700 11px "Courier New",monospace; padding:2px 8px; border-radius:3px; white-space:nowrap; }
#citizen { font-size:86px; line-height:1; transition:transform .55s ease, opacity .55s; transform:translateX(-170%); opacity:0; margin-bottom:-6px; }
#citizen.in { transform:none; opacity:1; }
#citizen.out { transform:translateX(170%); opacity:0; }
#citizen.angry { animation:shake .3s 3; }
#pruefer { position:absolute; right:6px; bottom:4px; font-size:34px; display:none; text-align:center; }
#pruefer b { display:block; font-size:10px; background:#b02; color:#fff; border-radius:4px; padding:0 3px; }
#side { flex:1; min-height:0; display:flex; flex-direction:column; padding:6px; gap:6px; }
#bubble { background:#fff; border-radius:12px; padding:7px 10px; font-size:13px; line-height:1.35; box-shadow:0 2px 0 #0003; min-height:3.2em; position:relative; }
#bubble:empty { visibility:hidden; }
#bubble i { color:#666; }
#cinfo { font-size:11.5px; color:#3a3424; line-height:1.3; }

#queuebox { flex:1; min-height:40px; position:relative; background:#0000000d; border-radius:8px; padding:4px 6px; overflow:hidden; }
#queuebox small { font-size:10px; text-transform:uppercase; letter-spacing:.05em; opacity:.65; }
#queue { display:flex; flex-wrap:wrap; gap:1px; font-size:26px; line-height:1.1; }
#queue.mad span { display:inline-block; animation:shake .4s infinite; }
.rant { position:absolute; background:#fff; border:2px solid #c42b23; color:#811; font-size:11px; font-weight:700; padding:3px 7px; border-radius:10px; max-width:85%; pointer-events:none; animation:rant 2.8s forwards; z-index:5; }
@keyframes rant { 0% { opacity:0; transform:translateY(8px) scale(.8); } 10%,80% { opacity:1; transform:none; } 100% { opacity:0; transform:translateY(-12px); } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-3px) rotate(-3deg); } 75% { transform:translateX(3px) rotate(3deg); } }

/* Desk */

.paper { position:absolute; background:var(--paper); color:#222; border-radius:3px; box-shadow:0 2px 0 #0002,0 4px 10px #0005; padding:.6em .75em; cursor:grab; touch-action:none; line-height:1.3; }

.paper.zoom { z-index:9001 !important; box-shadow:0 12px 30px #000a !important; cursor:zoom-out; }

.imprint { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) rotate(-13deg); border:.22em solid; border-radius:.3em; padding:.1em .45em; font:900 1.45em "Courier New",monospace; white-space:nowrap; opacity:.88; mix-blend-mode:multiply; pointer-events:none; animation:ink .18s ease-out; z-index:3; }

.miss { position:absolute; font:900 1.1em "Courier New",monospace; border:.2em solid; padding:.1em .4em; opacity:.8; pointer-events:none; transform:rotate(25deg); }
#rubber { position:absolute; width:5.5em; height:6.5em; margin:-6.5em 0 0 -2.75em; pointer-events:none; z-index:9500; display:none; }
#rubber .hd { width:2.2em; height:2.6em; margin:0 auto; background:radial-gradient(circle at 35% 30%,#c98a54,#6b3f1e); border-radius:1em 1em .4em .4em; }
#rubber .st { width:1em; height:1.4em; margin:0 auto; background:#5a3b1e; }

#rubber.go { display:block; animation:stamp var(--d) ease-in-out; }
@keyframes stamp { 0% { transform:translateY(-260%) scale(1.3); } 55% { transform:translateY(0) scale(1); } 65% { transform:translateY(4%) scale(1.04,.94); } 100% { transform:translateY(-260%) scale(1.3); } }

/* Tools */
#tools { display:flex; flex-direction:column; gap:6px; min-height:0; overflow:auto; }

#bG { background:var(--g); font-size:15px; } #bA { background:var(--r); font-size:15px; } #bF { background:var(--y); font-size:15px; }

#toasts { position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:700; display:flex; flex-direction:column; gap:6px; width:min(460px,94vw); pointer-events:none; }

.toast.boss { border-color:#c42b23; } .toast.good { border-color:#1f9a3a; } .toast.warn { border-color:#d08a0c; }

@keyframes tin { from { opacity:0; transform:translateY(-10px); } }
.fl { position:fixed; z-index:720; font-weight:900; font-size:22px; pointer-events:none; text-shadow:0 2px 0 #fff; animation:fl 1.2s forwards; }
@keyframes fl { to { transform:translateY(-50px); opacity:0; } }
#ov { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:1000; padding:14px; }
#ov.show { display:flex; }
.dlg { background:var(--paper); color:#222; border-radius:12px; max-width:580px; width:100%; max-height:92vh; overflow:auto; padding:18px 20px; border:4px solid #9c9273; box-shadow:0 10px 40px #000a; }
.dlg h1 { font-size:clamp(1.4rem,4.5vw,2rem); margin:0 0 4px; color:#222; }

.new { background:#ffe36b; border-radius:4px; padding:0 4px; font-size:11px; font-weight:800; margin-right:4px; }
.stats { display:grid; grid-template-columns:1fr auto; gap:2px 14px; font-size:14.5px; margin:8px 0; }

.prog { height:10px; background:#0002; border-radius:5px; overflow:hidden; } .prog i { display:block; height:100%; background:#2f6f3f; }
#drawer { position:fixed; top:52px; right:8px; bottom:8px; width:min(400px,96vw); z-index:600; background:var(--paper); color:#222; border:3px solid #9c9273; border-radius:12px; box-shadow:0 10px 40px #0008; transform:translateX(110%); transition:transform .25s; overflow:auto; padding:12px 14px; font-size:13.5px; }

@media (max-width:760px) {

}

<script>
'use strict';
// ================= Helpers =================
const AC = window.ArcadeCore || null;
function snd(name, ...a) { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} }
function tone(f, d, t, g) { snd('playTone', f, d, t, g); }

const pad = n => String(n).padStart(2, '0');
const DAY_MS = 864e5;
const mkDate = (y, m, d) => Math.round(Date.UTC(y, m, d) / DAY_MS);
const START = mkDate(2025, 5, 2); // Montag, 02.06.2025

function fmt(n) { const t = new Date(n * DAY_MS); return pad(t.getUTCDate()) + '.' + pad(t.getUTCMonth() + 1) + '.' + t.getUTCFullYear(); }
function md(n) { const t = new Date(n * DAY_MS); return t.getUTCMonth() * 100 + t.getUTCDate(); }
function dayInfo(day) { const i = day - 1; return { today: START + Math.floor(i / 5) * 7 + (i % 5), wd: i % 5 }; }
const LEAP = [1944, 1952, 1960, 1968, 1972, 1976, 1984, 1988, 1992, 1996, 2000, 2004, 2008];
const LEAP_PET = [2012, 2016, 2020, 2024];

// ================= Data =================

  LAST_SHORT.forEach(l => check(l.length <= 10, 'short name too long: ' + l));
  LAST_LONG.forEach(l => check(l.length > 10, 'long name too short: ' + l));
  for (let f = 0; f <= 60; f++) check(splitFee(f).reduce((a, b) => a + b, 0) === f, 'splitFee ' + f);
  for (let i = 0; i < 500; i++) { const s = pick(FIRST) + ' ' + pick(LAST_SHORT.concat(LAST_LONG)); check(typo(s) !== s, 'typo unchanged ' + s); }
  const allX = d => ({ ...makeCtx(d), rules: new Set(RULES.map(r => r.id)) });
  // each flaw on its own, all rules active, every weekday
  for (const f of FLAWS) for (let i = 0; i < 300; i++) {
    const x = allX(ri(1, 30)); const g = genCase(x, { force: [f.id] }); const r = validate(g.c, x);
    check(r.v === g.intended, `single ${f.id} day${x.day}: want ${g.intended} got ${r.v} (${r.reasons.join('; ')})`);
  }
  // random days/rules/flaw counts, including returning citizens and fax extras
  for (let i = 0; i < 20000; i++) {
    const day = ri(1, 25), extra = Math.random() < 0.3 ? [pick(DAY_RULES).id] : [];
    const x = makeCtx(day, extra);
    let g = genCase(x, { nFlaws: ri(0, 2) });
    if (Math.random() < 0.3) g = genCase(x, { citizen: g.c.citizen, req: g.c.req, nFlaws: ri(0, 2) });
    const r = validate(g.c, x);
    check(r.v === g.intended, `day${day} [${g.flaws}] want ${g.intended} got ${r.v} (${r.reasons.join('; ')})`);
    if (g.intended === 'G') check(r.reasons.length === 0, 'valid case has reasons');
  }
  // default generator (as used in play) never errors and gives a sane verdict mix
  const mix = { G: 0, A: 0, F: 0 };
  for (let i = 0; i < 3000; i++) { const x = makeCtx(ri(1, 20)); const g = genCase(x); const r = validate(g.c, x); mix[r.v]++; check(r.v === g.intended, 'default gen ' + g.flaws); }
  check(mix.G > 600 && mix.A > 600 && mix.F > 200, 'verdict mix ' + JSON.stringify(mix));
  check(dayInfo(2).wd === 1 && fmt(dayInfo(6).today) === '09.06.2025', 'calendar');
  log.unshift(`${fails ? 'SELFTEST FAIL' : 'SELFTEST PASS'}: ${n - fails}/${n} Checks · Verteilung ${JSON.stringify(mix)}`);
  return { fails, n, text: log.join('\n') };
}

  G.stack++;
  G.anger = Math.max(0, G.anger - 7);
  const react = v === 'F' ? '<i>Sie: ' + pick(CLERK_F) + '</i><br>„' + pick(REACT.F) + '“' : '„' + pick(REACT[v]) + '“';
  say(react);
  if (v === 'A') citizenEl.classList.add('angry');
  if (v === 'F') G.away.push({ citizen: c.citizen, req: c.req, at: G.t + rnd(25, 50) });
  const g0 = G;
  setTimeout(() => {
    if (G !== g0) return;
    clearCasePapers(true);
    citizenEl.className = 'out';
    G.cur = null;
    if (!G.over) { setTimeout(() => { if (G === g0 && !G.cur) { say(''); $('cinfo').textContent = ''; if (!desk.querySelector('.paper.case')) $('deskhint').style.display = ''; } }, 600); }
    renderQueue(); hud();
  }, 1100);
  hud();
}
function ruge(text) {
  if (!G || G.over) return;
  G.rugen++;
  toast(`<b>👔 Rüge von ${BOSS} (${G.rugen}/3)</b>${pick(BOSS_RUGE)} ${text}`, 'boss', 5200);
  tone(180, 0.35, 'sawtooth', 0.12);
  hud();
  if (G.rugen >= 3) { const g0 = G; G.over = true; setTimeout(() => { if (G === g0) endDay(false); }, 1600); }
}
function lunch() {
  G.lunch = true; G.paused = true;
  showOv(`<h1>🥪 Mittagspause!</h1><p>12:00 Uhr. Das Schild „Bin gleich zurück“ steht. Laut Dienstvorschrift 1a ist die Mittagspause <b>verpflichtend</b> – auch für Ihren Stempel.</p>
    <p>Die Warteschlange findet das weniger lustig. Ihr Kaffee wird währenddessen nachgefüllt.</p><div class="btns"><button id="endLunch" disabled>⏳ 3…</button></div>`);
  snd('powerup');
  let n = 3; const b = $('endLunch');
  const iv = setInterval(() => { n--; if (n > 0) b.textContent = '⏳ ' + n + '…'; else { clearInterval(iv); b.disabled = false; b.textContent = '🏢 Zurück an den Schalter (12:30)'; } }, 1000);
  b.onclick = () => { hideOv(); G.clock = 750; G.coffee = 100; G.anger = Math.min(95, G.anger + 15); G.paused = false; for (let i = 0; i < 2; i++) spawn(); hud(); };
}
function endDay(success) {
  G.over = true; G.paused = true;
  $('drawer').classList.remove('open');
  rubber.classList.remove('go');
  const before = S.points, rk0 = rankOf(before);
  let html;
  if (success) {
    S.points += Math.max(0, G.dayPts);
    S.day++;
    const fresh = UNLOCKS.filter(u => S.points >= u.p && !S.unlocked.includes(u.id));
    fresh.forEach(u => S.unlocked.push(u.id));
    save();
    if ((Number(AC && AC.getScore('amtsschimmel')) || 0) < S.points) snd('saveScore', 'amtsschimmel', S.points);
    const rk = rankOf(S.points), nxt = RANKS.find(r => r.p > S.points);
    const nextRule = DAY_RULES[S.day - 2];
    html = `<h1>🕓 Feierabend!</h1><p>16:00 Uhr – der Griffel fällt. ${G.queue.length ? `Die ${G.queue.length} Wartenden werden gebeten, morgen wiederzukommen. Sie nehmen es gefasst. Nein, tun sie nicht.` : 'Die Schlange ist leer. Ein historischer Moment.'}</p>
      <div class="stats"><span>Richtig bearbeitet</span><b>${G.ok}</b><span>Fehlentscheidungen</span><b>${G.bad}</b><span>Rügen</span><b>${G.rugen}/3</b><span>Beförderungspunkte heute</span><b>${G.dayPts >= 0 ? '+' : ''}${G.dayPts}${G.dayPts < 0 ? ' (zählt als 0)' : ''}</b><span>Gesamt</span><b>${S.points}</b></div>
      <p>${rk.e} <b>${rk.n}</b>${rk !== rk0 ? ' – <b>BEFÖRDERT!</b> 🎉' : ''}</p>
      ${nxt ? `<div class="prog"><i style="width:${(S.points - rk.p) / (nxt.p - rk.p) * 100}%"></i></div><p style="font-size:13px">Noch ${nxt.p - S.points} Punkte bis ${nxt.e} ${nxt.n}</p>` : '<p>Sie sind Amtsleiter. Ab jetzt rügen Sie sich selbst.</p>'}
      ${fresh.length ? '<h2>🎁 Neu freigeschaltet</h2><ul>' + fresh.map(u => `<li><b>${u.n}</b> – ${u.d}</li>`).join('') + '</ul>' : ''}
      ${nextRule ? `<p style="font-size:13px">📨 Gerücht aus dem Flur: Morgen kommt eine neue Vorschrift…</p>` : '<p style="font-size:13px">Alle Vorschriften sind in Kraft. Ab jetzt wird nur noch die Schlange länger.</p>'}
      <div class="btns"><button id="nextDay">☀️ Nächster Arbeitstag</button><button class="sec" id="toMenu">Menü</button></div>`;
    snd(fresh.length || rk !== rk0 ? 'powerup' : 'coin');
  } else {
    save();
    html = `<h1>📂 Disziplinarverfahren!</h1><p>Drei Rügen an einem Tag. ${BOSS} versetzt Sie für den Rest des Tages ins Kellerarchiv zum Sortieren von Büroklammern nach Biegung.</p>
      <div class="stats"><span>Richtig</span><b>${G.ok}</b><span>Falsch</span><b>${G.bad}</b><span>Punkte heute</span><b>verfallen</b></div>
      <p>Morgen dürfen Sie den Tag wiederholen. Also heute. Nochmal.</p>
      <div class="btns"><button id="nextDay">🔁 Tag ${S.day} wiederholen</button><button class="sec" id="toMenu">Menü</button></div>`;
    snd('gameOver');
  }
  showOv(html);
  $('nextDay').onclick = () => { hideOv(); startDay(); };
  $('toMenu').onclick = menu;
}

// ================= Events =================
function triggerEvent() {
  const opts = ['fax', 'kuchen'];
  if (!G.jam) opts.push('drucker', 'drucker');
  if (G.ctx.day >= 2 && !G.pruef) opts.push('pruefung');
  const e = pick(opts);
  if (e === 'drucker') {
    G.jam = 5;
    const p = document.createElement('div'); p.className = 'printer'; p.innerHTML = '<span class="pi">🖨️</span>STAU! Rütteln (5)';
    desk.appendChild(p);
    toast('🖨️ <b>Drucker-Stau!</b> Keine Bescheide → GENEHMIGT gesperrt. Drucker 5× antippen!', 'warn', 3500);
    snd('hit');
  } else if (e === 'fax') {
    const next = DAY_RULES.find(r => !G.ctx.rules.has(r.id));
    tone(1600, 0.12, 'square', 0.06); setTimeout(() => tone(1200, 0.12, 'square', 0.06), 160); setTimeout(() => tone(1600, 0.2, 'square', 0.06), 320);
    if (next) {
      G.extra.push(next.id); G.ctx.rules.add(next.id);
      addPaper('fax', `<span class="x" title="abheften">✕</span><b>FAX – EILERLASS</b><br>Ab sofort gilt:<br>${next.text}<div class="fine">Absender: Landesbehörde für Vorschriftenwesen</div>`, desk.clientWidth * 0.75, desk.clientHeight * 0.25);
      toast('📠 <b>Fax: Eilerlass!</b> Eine neue Vorschrift gilt ab SOFORT (siehe 📜).', 'warn', 4000);
      if ($('drawer').classList.contains('open')) rulesDrawer();
    } else {
      addPaper('fax', '<span class="x" title="abheften">✕</span><b>FAX</b><br>Sensationelle Kaffeefahrt! Heizdecken zum Sonderpreis! Nur heute!<div class="fine">Bitte nicht zurückfaxen.</div>', desk.clientWidth * 0.75, desk.clientHeight * 0.25);
      toast('📠 Fax eingegangen. Werbung. Wie immer.', '', 2500);
    }
  } else if (e === 'kuchen') {
    const k = pick(KOLLEGEN), who = pick(['Frau Schmidt aus der Poststelle', 'den Hausmeister', 'den Kopierer (10 Jahre im Dienst)', 'Herrn Dr. Pingelig']);
    const box = document.createElement('div'); box.className = 'kuchen';
    box.innerHTML = `<div class="big">🎂</div><b>${k}</b> steckt den Kopf herein: „Wir sammeln für ${who}. Fünf Euro für den Kuchen?“
      <div><button class="yes">💶 Na gut (−5 Pkt.)</button><button class="no">🙅 Bin auf Diät</button></div>`;
    desk.appendChild(box);
    const g0 = G;
    const close = () => { box.remove(); };
    box.querySelector('.yes').onclick = () => { close(); if (G !== g0) return; G.dayPts -= 5; G.coffee = 100; toast(`🎂 ${k} bringt Ihnen zum Dank einen frischen Kaffee. ☕ voll!`, 'good'); snd('coin'); hud(); };
    box.querySelector('.no').onclick = () => {
      close(); if (G !== g0) return;
      if (Math.random() < 0.35) ruge(`${k} hat Sie wegen „mangelnder Kollegialität beim Kuchengeld“ gemeldet.`);
      else toast(`${k} schaut Sie enttäuscht an und geht. Sie bekommen kein Stück.`, '', 2500);
    };
    setTimeout(() => { if (G === g0 && box.isConnected) { close(); toast(`${k} ist beleidigt abgezogen.`, '', 2000); } }, 14000);
    snd('pop');
  } else {
    G.pruef = 3;
    toast('🕵️ <b>Behördenprüfung!</b> Die nächsten 3 Fälle zählen doppelt – Punkte UND Abzüge.', 'warn', 3800);
    snd('powerup');
    if (G.stack > stackCap() / 2) setTimeout(() => ruge('Der Prüfer bemängelt Ihren Aktenstapel. „Das ist kein Schreibtisch, das ist ein Biotop.“'), 800);
  }
  hud();
}
function shakePrinter(pr) {
  if (!G || G.paused || G.jam <= 0) return;
  G.jam--;
  pr.classList.remove('shake'); void pr.offsetWidth; pr.classList.add('shake');
  snd('hit'); tone(200 + G.jam * 60, 0.08, 'square', 0.08);
  if (G.jam <= 0) { pr.remove(); toast('🖨️ Drucker läuft wieder. Er hasst Sie trotzdem.', 'good', 2200); snd('jump'); }
  else pr.innerHTML = `<span class="pi">🖨️</span>STAU! Rütteln (${G.jam})`;
  hud();
}
function coffee() {
  if (!G || G.paused || G.over || G.brew > 0) return;
  if (G.coffee > 90) { toast('☕ Becher ist noch voll. Noch voller geht nur mit Antrag.', '', 1600); return; }
  G.brew = 1.8; snd('pop', 0.6); hud();
}
function ablage() {
  if (!G || G.paused || G.over || G.busy > 0 || G.stamping) return;
  if (!G.stack) { toast('🗄️ Nichts abzulegen. Verdächtig effizient.', '', 1500); return; }
  G.busy = has('ablage') ? 0.5 : 2.2; snd('jump'); hud();
}

// ================= Main loop =================
let last = performance.now(), hudT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (G && !G.paused && !G.over) {
    G.t += dt;
    G.clock += dt * 2;
    if (!G.lunch && G.clock >= 720) { G.clock = 720; lunch(); }
    else if (G.clock >= 960) { G.clock = 960; endDay(true); }
    else {
      G.coffee = Math.max(0, G.coffee - dt * (has('becher') ? 0.65 : 1.3));
      G.anger = Math.min(100, G.anger + dt * (G.queue.length * 0.32 + (!G.cur && G.queue.length ? 1.2 : 0)));
      if (G.anger >= 100) { G.anger = 55; snd('explosion'); ruge('Tumult im Wartebereich! Jemand hat den Nummernautomaten umgeworfen.'); }
      if ((G.nextSpawn -= dt) <= 0) { spawn(); G.nextSpawn = Math.max(3.2, 9 - G.ctx.day * 0.45) * rnd(0.6, 1.4); }
      for (let i = G.away.length - 1; i >= 0; i--) if (G.t >= G.away[i].at) {
        const a = G.away.splice(i, 1)[0];
        if (G.queue.length < 12) { G.queue.push({ g: genCase(G.ctx, { citizen: a.citizen, req: a.req }), ret: true }); }
        renderQueue();
      }
      if ((G.nextRant -= dt) <= 0) { G.nextRant = rnd(2.5, 5.5) * (1.4 - G.anger / 100); if (G.anger > 35 && G.queue.length) rant(); }
      $('queue').classList.toggle('mad', G.anger > 70);
      if (G.t >= G.nextEvent) { G.nextEvent = G.t + rnd(32, 55); triggerEvent(); }
      if (G.brew > 0 && (G.brew -= dt) <= 0) { G.brew = 0; G.coffee = 100; snd('pop', 1.2); snd('pop', 1.5); toast('☕ Kaffee nachgefüllt. Das Leben hat wieder Sinn.', 'good', 1500); }
      if (G.busy > 0 && (G.busy -= dt) <= 0) { G.busy = 0; G.stack = 0; snd('coin'); toast('🗄️ Alles abgeheftet. Unter „Sonstiges“.', 'good', 1500); }
    }
    if ((hudT += dt) > 0.1) { hudT = 0; hud(); }
  }
  requestAnimationFrame(loop);
}

// ================= Menu / pause =================
function pause(on) {
  if (!G || G.over || $('ov').classList.contains('show') && !G.pauseOv) return;
  if (on && !G.paused) {
    G.paused = true; G.pauseOv = true;
    showOv('<h1>⏸ Pause</h1><p>Sie sind „kurz zu Tisch“. Die Uhr steht – ausnahmsweise.</p><div class="btns"><button id="resume">▶ Weiter</button><button class="sec" id="toMenu">Menü (Tag abbrechen)</button></div>');
    $('resume').onclick = () => pause(false);
    $('toMenu').onclick = menu;
  } else if (!on && G.pauseOv) { G.pauseOv = false; G.paused = false; hideOv(); }
}
function menu() {
  if (G) { G.over = true; G.paused = true; }
  $('drawer').classList.remove('open');
  const rk = rankOf(S.points);
  showOv(`<h1>🐴 Amtsschimmel</h1><p style="margin-top:0"><b>Behörden-Simulator</b> · Bürgeramt Amtshausen, Schalter 3</p>
    <p>Sie sind ${S.day === 1 && !S.points ? 'neu hier' : `${rk.e} <b>${rk.n}</b> mit ${S.points} Beförderungspunkten (Tag ${S.day})`}. Bürger kommen mit absurden Anliegen und einem Stapel Papier. Prüfen Sie alles gegen die <b>Dienstvorschriften</b>, die jeden Tag absurder werden – und stempeln Sie:</p>
    <ul><li>✅ <b>GENEHMIGT</b> – alles korrekt.</li><li>❌ <b>ABGELEHNT</b> – irgendein Verstoß (falscher Name, abgelaufen, falsche Gebühr…).</li><li>📋 <b>FORMULAR FEHLT</b> – etwas fehlt oder falsches Formular. Hat Vorrang! Der Bürger kommt später wieder.</li></ul>
    <p>Fehler = Rüge vom Amtsleiter (3 Rügen = Tag verloren). Halten Sie den ☕ Kaffee oben (sonst zittert die Hand), die 😡 Schlange ruhig und den 🗂️ Aktenstapel klein. Achtung: Drucker-Stau, Faxe mit Eilerlassen, Kuchengeld und Prüfer.</p>
    <p style="font-size:13px;opacity:.8">Tasten: 1/2/3 Stempel · N Nächster · R Vorschriften · L Lupe · K Kaffee · A Ablage · P Pause</p>
    <div class="btns"><button id="play">🏢 ${S.day > 1 ? `Weiter mit Tag ${S.day}` : 'Ersten Arbeitstag beginnen'}</button>${S.day > 1 || S.points ? '<button class="sec" id="reset">Neu anfangen</button>' : ''}</div>`);
  $('play').onclick = () => { hideOv(); startDay(); };
  if ($('reset')) $('reset').onclick = () => { if (confirm('Spielstand wirklich löschen? Ihre Personalakte wird geschreddert.')) { S = { v: 1, day: 1, points: 0, cases: 0, correct: 0, unlocked: [] }; save(); menu(); } };
}

// ================= Input =================
$('bNext').onclick = callNext;
$('bG').onclick = () => stamp('G');
$('bA').onclick = () => stamp('A');
$('bF').onclick = () => stamp('F');
$('bRules').onclick = toggleRules;
$('bLupe').onclick = () => { lupe = !lupe; if (!lupe) unzoom(); toast(lupe ? '🔍 Lupe an: Dokument antippen zum Vergrößern.' : '🔍 Lupe aus.', '', 1400); hud(); };
$('bCoffee').onclick = coffee;
$('bAblage').onclick = ablage;
function updMute() { $('mute').textContent = AC && AC.isMuted() ? '🔇' : '🔊'; }
$('mute').onclick = () => { if (AC) AC.toggleMute(); updMute(); };
updMute();
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'p' || k === 'escape') { if ($('drawer').classList.contains('open') && k === 'escape') { $('drawer').classList.remove('open'); return; } pause(!(G && G.paused)); return; }
  if (!G || G.paused || G.over) return;
  if (k === '1') stamp('G'); else if (k === '2') stamp('A'); else if (k === '3') stamp('F');
  else if (k === 'n' || k === ' ') { e.preventDefault(); callNext(); }
  else if (k === 'r') toggleRules();
  else if (k === 'l') $('bLupe').click();
  else if (k === 'k') coffee();
  else if (k === 'a') ablage();
});
// keep papers reachable after rotation / resize
window.addEventListener('resize', () => {
  unzoom();
  const W = desk.clientWidth, H = desk.clientHeight;
  desk.querySelectorAll('.paper').forEach(p => {
    p.style.left = Math.max(2, Math.min(W - p.offsetWidth - 2, p.offsetLeft)) + 'px';
    p.style.top = Math.max(2, Math.min(H - p.offsetHeight - 2, p.offsetTop)) + 'px';
  });
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

// ================= Boot =================
if (new URLSearchParams(location.search).has('selftest')) {
  const r = selftest();
  document.title = r.fails ? 'SELFTEST FAIL' : 'SELFTEST PASS';
  showOv(`<h1>🧪 Selbsttest</h1><pre id="selftest">${r.text}</pre><div class="btns"><button onclick="location.search=''">Zum Spiel</button></div>`);
  console.log(r.text);
} else {
  menu();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
