<script>
(() => {
'use strict';

// ============ ArcadeCore ============
const AC = window.ArcadeCore || null;
const snd = (name, ...a) => { try { if (AC && AC[name]) AC[name](...a); } catch (e) {} };
const GRADE_KEY = 'spickalarm_grades';

// ============ Helfer ============
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const wrapAngle = a => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const fmtGrade = g => g.toFixed(1).replace('.', ',');
const L = 'ABCD';

// ============ Reine Spiellogik ============
// Notenschlüssel nach Anteil richtiger Antworten (deutsche Uni-Skala)
const GRADES = [[0.95, 1.0], [0.9, 1.3], [0.85, 1.7], [0.8, 2.0], [0.75, 2.3], [0.7, 2.7], [0.65, 3.0], [0.6, 3.3], [0.55, 3.7], [0.5, 4.0]];
function gradeFor(correct, total) {
  const p = correct / total;
  for (const [t, g] of GRADES) if (p >= t - 1e-9) return g;
  return 5.0;
}
// Sichtkegel in der XZ-Ebene: yaw 0 = Blick nach +z
function inCone(ex, ez, yaw, tx, tz, half, range) {
  const dx = tx - ex, dz = tz - ez, d = Math.hypot(dx, dz);
  if (d > range) return false;
  if (d < 1e-6) return true;
  return Math.abs(wrapAngle(Math.atan2(dx, dz) - yaw)) <= half;
}
(function selfCheck() {
  const ok = (c, m) => { if (!c) throw new Error('Selbsttest fehlgeschlagen: ' + m); };
  ok(gradeFor(5, 5) === 1.0, '5/5'); ok(gradeFor(4, 5) === 2.0, '4/5'); ok(gradeFor(3, 5) === 3.3, '3/5');
  ok(gradeFor(2, 5) === 5.0, '2/5'); ok(gradeFor(0, 5) === 5.0, '0/5');
  ok(inCone(0, 0, 0, 0, 5, 0.5, 10), 'vorne'); ok(!inCone(0, 0, 0, 0, -5, 0.5, 10), 'hinten');
  ok(!inCone(0, 0, 0, 0, 11, 0.5, 10), 'zu weit'); ok(inCone(0, 0, Math.PI, 0.1, -5, 0.5, 10), 'Winkel-Umbruch');
  ok(!inCone(0, 0, Math.PI / 2, 0, 5, 0.5, 10), 'seitlich');
})();

// ============ Klausuren ============
// Erste Option = richtig (wird pro Versuch gemischt)
const EXAMS = [
  { title: 'Grundlagen der Quanten-BWL', time: 150, speed: 1.0, turn: 0.06, strict: 0.9, qs: [
    ['Was ist die kleinste unteilbare Einheit des Gewinns?', 'Das Profiton', 'Der Euro-Cent', 'Das Bonus-Quark', 'Die Kassenbon-Welle'],
    ['Wann ist eine Bilanz ausgeglichen?', 'Erst, wenn jemand hinschaut', 'Immer am Monatsende', 'Nie, aus Prinzip', 'Bei Vollmond'],
    ['Welches Teilchen überträgt die Kaufkraft?', 'Das Konsumon', 'Das Rabatton', 'Das Gluon', 'Der Gutschein'],
    ['Was misst die Planck-Konstante im Controlling?', 'Die kleinste Excel-Zelle', 'Den Kaffeeverbrauch', 'Die Länge von Meetings', 'Das Gehalt von Planck'],
    ['Was passiert bei einem Quantensprung der Aktie?', 'Sie ist hoch und tief zugleich', 'Sie springt zur Konkurrenz', 'Die BaFin ruft an', 'Nichts, Aktien springen nicht'],
  ] },
  { title: 'Schrödingers Buchhaltung', time: 140, speed: 1.15, turn: 0.09, strict: 1.0, qs: [
    ['Wo steht Schrödingers Katze in der Bilanz?', 'Sonstige Vermögenswerte', 'In der Kaffeekasse', 'Im Eigenkapital', 'Im Karton im Keller'],
    ['Ein Beleg ist verloren UND nicht verloren. Das nennt man …', 'Beleg-Superposition', 'Steuerhinterziehung', 'Montag', 'Ablage P'],
    ['Wer kollabiert die Wellenfunktion der Steuererklärung?', 'Das Finanzamt', 'Der Steuerberater', 'Die Katze', 'Niemand, sie ist ewig'],
    ['Doppelte Buchführung in der Quanten-BWL heißt …', 'Buchen in zwei Universen', 'Zwei Bleistifte zugleich', 'Soll und Haben tanzen', 'Doppelt so viel Kaffee'],
    ['Was ist ein verschränktes Konto?', 'Ich buche ab, Chef ist im Minus', 'Ein Konto mit Kette', 'Ein Konto im Schrank', 'Das Sparschwein der Uni'],
  ] },
  { title: 'Unschärfe-Marketing', time: 135, speed: 1.3, turn: 0.12, strict: 1.1, qs: [
    ['Heisenbergs Unschärferelation im Vertrieb besagt:', 'Preis ODER Umsatz, nie beides', 'Der Kunde ist König', 'Rabatt ist Pflicht', 'Unscharfe Fotos verkaufen'],
    ['Welche Farbe hat ein Quanten-Logo?', 'Alle, bis es gedruckt wird', 'Corporate-Blau', 'Beige', 'Durchsichtig'],
    ['Der Tunneleffekt beim Kunden bedeutet …', 'Er kommt durch die Wand', 'Er steht im Stau', 'Er sieht nur Angebote', 'Er kauft im U-Bahn-Tunnel'],
    ['Was ist eine Quanten-Zielgruppe?', 'Alle und niemand zugleich', 'Physikstudierende', 'Rentner mit Smartphone', 'Katzenbesitzer'],
    ['Wie misst man Markenbekanntheit, ohne sie zu ändern?', 'Gar nicht', 'Mit einer Umfrage', 'Mit einem Thermometer', 'Durch Wegschauen'],
  ] },
  { title: 'Verschränktes Controlling', time: 130, speed: 1.4, turn: 0.14, strict: 1.15, assist: true, qs: [
    ['Zwei verschränkte Abteilungen: Eine spart, die andere …', '… gibt sofort alles aus', '… merkt nichts', '… macht Betriebsausflug', '… kündigt'],
    ['Was ist der Erwartungswert eines Meetings?', 'Ein weiteres Meeting', 'Ein Ergebnis', 'Kekse', 'Null Komma nichts'],
    ['Welcher Operator erzeugt Boni aus dem Nichts?', 'Der Erzeugungsoperator', 'Der Betriebsrat', 'Strg + C', 'Der Weihnachtsmann'],
    ['Dekohärenz im Unternehmen entsteht durch …', 'Zu viele Mails in CC', 'Zu wenig Kaffee', 'Gute Kommunikation', 'Kalte Fusion'],
    ['Wie heißt die Quanten-Version der Kostenrechnung?', 'Kosten-Nutzen-Vielleicht', 'Kostenstellen-Kater', 'Plus-Minus-Null-Eins', 'Kassensturz im Vakuum'],
  ] },
  { title: 'Knurrs Endgegner-Klausur', time: 125, speed: 1.5, turn: 0.17, strict: 1.25, assist: true, pascal: true, qs: [
    ['Was ist Prof. Knurrs Lieblingsteilchen?', 'Das Spickon', 'Das Kreide-Quark', 'Das Mensa-Schnitzel', 'Das Neutrino'],
    ['Wie viele Zustände hat ein Prüfling in der Klausur?', 'Wissen und Panik zugleich', 'Genau einen', 'Hunger', 'Zwölf'],
    ['Ab wann gilt ein Spicker als bewiesen?', 'Sobald Knurr hinschaut', 'Ab 50 Prozent', 'Nie', 'Ab Vollmond'],
    ['Was erhält man, wenn man BWL quantisiert?', 'Diskrete Gehaltsstufen', 'Stetige Kaffeepausen', 'Einen Nobelpreis', 'Kopfschmerzen'],
    ['Was ist das Pauli-Prinzip im Hörsaal?', 'Nie zwei auf einem Platz', 'Pauli zahlt die Mensa', 'Ruhe bitte', 'Handy aus'],
  ] },
];
const STARE_LINES = ['Prof. Knurr: »Ich sehe alles.«', 'Prof. Knurr: »Augen aufs eigene Blatt!«', 'Prof. Knurr: »Hmm …«', 'Prof. Knurr: »Noch 5 Minuten. Gefühlt.«', 'Prof. Knurr: »Die Quanten verraten mir alles.«'];

// ============ Renderer & Szene ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('canvas-container').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4a3f33);
scene.fog = new THREE.Fog(0x4a3f33, 22, 42);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 60);
camera.rotation.order = 'YXZ';

// Ansteigender Hörsaal: jede Reihe steht eine Stufe höher als die davor
const ROWS = [-5.4, -3.0, -0.6, 1.8, 4.2, 6.6], PLAYER_ROW = 2, SEAT_DZ = 0.75, RISE = 0.32;
const rowY = i => i * RISE;
const floorAt = z => { for (let i = ROWS.length - 1; i >= 0; i--) if (z >= ROWS[i] - 1.2) return rowY(i); return 0; };
const RY = rowY(PLAYER_ROW);
const EYE = new THREE.Vector3(0, 1.2 + RY, 0.15);
camera.position.copy(EYE);

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x8a7056, 0.72));
const sun = new THREE.DirectionalLight(0xffe0b0, 0.6); // warmes Fensterlicht von links
sun.position.set(-9, 11, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
scene.add(sun);

// Laufweg = Rechteck-Ring um die Bankreihen (vorne, rechter Gang, hinten, linker Gang)
const RING = [[-5, -8.3], [5, -8.3], [5, 7.8], [-5, 7.8]];
const SEG = RING.map((p, i) => { const q = RING[(i + 1) % 4]; return Math.hypot(q[0] - p[0], q[1] - p[1]); });
const RING_P = SEG.reduce((a, b) => a + b, 0);
function ringPos(s) {
  s = ((s % RING_P) + RING_P) % RING_P;
  for (let i = 0; i < 4; i++) {
    if (s <= SEG[i]) { const p = RING[i], q = RING[(i + 1) % 4], t = s / SEG[i]; return { x: p[0] + (q[0] - p[0]) * t, z: p[1] + (q[1] - p[1]) * t }; }
    s -= SEG[i];
  }
  return { x: RING[0][0], z: RING[0][1] };
}
function ringS(x, z) {
  let best = 0, bd = Infinity, acc = 0;
  for (let i = 0; i < 4; i++) {
    const p = RING[i], q = RING[(i + 1) % 4], dx = q[0] - p[0], dz = q[1] - p[1];
    const t = clamp(((x - p[0]) * dx + (z - p[1]) * dz) / (SEG[i] * SEG[i]), 0, 1);
    const d = Math.hypot(p[0] + dx * t - x, p[1] + dz * t - z);
    if (d < bd) { bd = d; best = acc + t * SEG[i]; }
    acc += SEG[i];
  }
  return best;
}

  let next = 0; while (next < EXAMS.length - 1 && all[next] !== undefined && all[next] <= 4) next++;
  const touch = document.body.classList.contains('touch');
  showModal({ title: 'Spick-Alarm 3D', sub: 'Quanten-BWL bei Prof. Knurr. Keine Ahnung vom Stoff? Egal. Die Antworten stehen im <b>Mäppchen</b>, auf <b>Kevins Blatt</b> und an der <b>Tafel</b> – unscharf, bis du ranzoomst. Schau nur hin, wenn Knurr nicht herschaut, sonst steigt der Verdacht. Bei 100 % fliegst du raus.<br><br>' +
    (touch ? 'Wischen: umsehen · Tippen: ankreuzen/Flieger fangen · 🔍 halten: Zoom · 😇 halten: brav aufs Blatt schauen · 🧽 Radierer an die Heizung werfen'
      : '<kbd>Maus</kbd> umsehen · <kbd>Rechtsklick</kbd>/<kbd>Shift</kbd> halten: Zoom · <kbd>Klick</kbd> ankreuzen / Papierflieger fangen<br><kbd>Leertaste</kbd> halten: brav aufs Blatt · <kbd>Q</kbd> Radierer an die Heizung · <kbd>E</kbd> Zettel zu Pascal · <kbd>Enter</kbd> abgeben'),
    stats: EXAMS.map((ex, i) => [`K${i + 1}: ${ex.title}`, all[i] !== undefined ? fmtGrade(all[i]) : '–']),
    primary: [`Klausur ${next + 1} schreiben (Enter)`, () => startExam(next)],
    secondary: next > 0 ? ['Von vorn (Klausur 1)', () => startExam(0)] : null });
}

// ============ UI ============
let modalOpts = null;
function showModal(o) {
  modalOpts = o;
  $('mTitle').textContent = o.title; $('mSub').innerHTML = o.sub;
  $('mStats').innerHTML = (o.stats || []).map(([l, v]) => `<div class="stat-box"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');
  $('mPrimary').textContent = o.primary[0];
  $('mSecondary').hidden = !o.secondary;
  if (o.secondary) $('mSecondary').textContent = o.secondary[0];
  $('modal').style.display = 'flex';
}
function hideModal() { $('modal').style.display = 'none'; modalOpts = null; }
$('mPrimary').addEventListener('click', () => modalOpts && modalOpts.primary[1]());
$('mSecondary').addEventListener('click', () => modalOpts && modalOpts.secondary && modalOpts.secondary[1]());
function showMsg(title, sub, color) {
  const el = $('msg');
  el.innerHTML = `<span style="color:${color}">${title}</span><small>${sub || ''}</small>`;
  el.classList.add('show'); S.msgT = 1.8;
}
function showLine(t) { $('task').textContent = t; S.lineT = 4; }
const fmtTime = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function profDir() {
  const a = Math.atan2(prof.x - EYE.x, -(prof.z - EYE.z)), m = Math.abs(a), side = a > 0 ? 'rechts' : 'links';
  return m < 0.45 ? 'vorne' : m < 1.2 ? 'vorne ' + side : m < 2.1 ? side : m < 2.8 ? 'hinten ' + side : 'hinter dir!';
}
function updateHUD(tip) {
  setText('hExam', String(S.exam + 1));
  setText('hTime', fmtTime(Math.max(0, S.time)));
  $('hTimePill').classList.toggle('warn', S.time < 20);
  setText('hKnown', S.known.some(k => k) ? S.known.map((k, i) => k ? `${i + 1}${L[S.qs[i].correct]}` : '').filter(Boolean).join(' ') : '–');
  setText('hEraser', String(S.erasers)); setText('hNotes', String(S.notes));
  setText('hProf', profDir());
  const eye = prof.sees ? 'Knurr sieht dich!' : assist.sees ? 'Assistentin sieht dich!' : S.pascalOn && pas.state !== 'idle' ? 'Pascal schielt!' : 'unbeobachtet';
  setText('hEye', eye);
  $('hEyePill').classList.toggle('warn', eye !== 'unbeobachtet'); $('hEyePill').classList.toggle('good', eye === 'unbeobachtet');
  $('suspFill').style.width = S.susp.toFixed(1) + '%';
  setText('suspTxt', `Verdacht ${Math.round(S.susp)} %`);
  $('vig').style.opacity = (S.susp / 100 * 0.9).toFixed(2);
  setText('tip', tip);
  $('btnZoom').classList.toggle('active', held.zoom); $('btnHide').classList.toggle('active', held.hide);
}
function updateSoundBtn() { $('soundBtn').innerHTML = AC && AC.isMuted() ? '🔇<span class="lbl"> Sound: Aus</span>' : '🔊<span class="lbl"> Sound: An</span>'; }
$('soundBtn').addEventListener('click', () => { if (AC) AC.toggleMute(); updateSoundBtn(); });
window.addEventListener('arcade_mute_changed', updateSoundBtn);
updateSoundBtn();
$('pauseBtn').addEventListener('click', () => S.mode === 'pause' ? resumeGame() : pauseGame());
$('handBtn').addEventListener('click', requestHandIn);

// ============ Eingabe ============
const keys = new Set(), held = { zoom: false, hide: false, mouseZoom: false };
const look = { yaw: 0, pitch: -0.55 };
const isTouch = () => document.body.classList.contains('touch');
function lockPointer() {
  if (isTouch() || !canvas.requestPointerLock) return;
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function unlockPointer() { if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock(); }
document.addEventListener('pointerlockchange', () => {
  const now = document.pointerLockElement === canvas;
  if (S.locked && !now && S.mode === 'play') pauseGame();
  S.locked = now;
});
function lookBy(dx, dy, sens) {
  const k = sens * camera.fov / 70;
  look.yaw -= dx * k; look.pitch -= dy * k;
}
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function clickAt(nx, ny) {
  if (S.mode !== 'play') return;
  ndc.set(nx, ny); raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([sheetMesh, ...planes.map(p => p.hit)], false)[0];
  if (!hit) return;
  if (hit.object === sheetMesh) answerAt(hit.uv); else catchPlane(hit.object.userData.plane);
}
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') document.body.classList.add('touch');
  if (S.mode !== 'play') return;
  if (S.locked) { if (e.button === 0) clickAt(0, 0); return; }
  if (e.button !== 0) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0 };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (S.mode !== 'play') return;
  if (S.locked) { lookBy(e.movementX || 0, e.movementY || 0, 0.0022); return; }
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
  lookBy(dx, dy, 0.005);
});
const endDrag = e => {
  if (!drag || drag.id !== e.pointerId) return;
  if (e.type === 'pointerup' && drag.moved < 8) clickAt(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  drag = null;
  if (e.type === 'pointerup' && !isTouch()) lockPointer();
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('mousedown', e => { if (e.button === 2) held.mouseZoom = true; });
window.addEventListener('mouseup', e => { if (e.button === 2) held.mouseZoom = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

const GAME_KEYS = ['KeyA', 'KeyD', 'KeyW', 'KeyS', 'KeyQ', 'KeyE', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'];
window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if ($('modal').style.display === 'flex') {
    if (e.repeat) return;
    if (e.code === 'Enter' && modalOpts) modalOpts.primary[1]();
    else if (e.code === 'Escape' && S.mode === 'pause') resumeGame();
    return;
  }
  if (S.mode !== 'play') return;
  keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'KeyQ') throwEraser();
  else if (e.code === 'KeyE') flickNote();
  else if (e.code === 'Enter') requestHandIn();
  else if (e.code === 'Escape' || e.code === 'KeyP') pauseGame();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); held.mouseZoom = false; pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function holdBtn(id, prop) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); document.body.classList.add('touch'); held[prop] = true; el.setPointerCapture(e.pointerId); });
  const up = () => { held[prop] = false; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
holdBtn('btnZoom', 'zoom'); holdBtn('btnHide', 'hide');
$('btnThrow').addEventListener('pointerdown', e => { e.preventDefault(); throwEraser(); });
$('btnFlick').addEventListener('pointerdown', e => { e.preventDefault(); flickNote(); });
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

// ============ Hauptschleife ============
const fwd = new THREE.Vector3(), _v = new THREE.Vector3(), sheetCenter = sheetMesh.position.clone();
let zoomAmt = 0;
function angleTo(p) { _v.copy(p).sub(camera.position).normalize(); return Math.acos(clamp(_v.dot(fwd), -1, 1)); }

function update(dt, time) {
  const E = EX();
  const k = c => keys.has(c) ? 1 : 0;
  const zoom = held.zoom || held.mouseZoom || keys.has('ShiftLeft') || keys.has('ShiftRight');
  const hiding = held.hide || keys.has('Space');
  look.yaw += (k('KeyA') + k('ArrowLeft') - k('KeyD') - k('ArrowRight')) * 1.4 * dt * camera.fov / 70;
  look.pitch += (k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown')) * 1.1 * dt * camera.fov / 70;
  if (hiding) { // brav: Blick wird auf das eigene Blatt gezogen
    const ty = clamp(look.yaw, -0.2, 0.2), tp = clamp(look.pitch, -0.8, -0.35), f = Math.min(1, dt * 10);
    look.yaw += (ty - look.yaw) * f; look.pitch += (tp - look.pitch) * f;
  }
  look.yaw = clamp(look.yaw, -1.45, 1.45); look.pitch = clamp(look.pitch, -1.15, 0.55);
  zoomAmt += ((zoom && !hiding ? 1 : 0) - zoomAmt) * Math.min(1, dt * 8);
  lidPivot.rotation.x += ((hiding ? 0 : -1.9) - lidPivot.rotation.x) * Math.min(1, dt * 10);

  S.time -= dt; S.handT -= dt;
  if (S.time < 20 && (S.tickT2 -= dt) <= 0) { snd('playTone', 1000, 0.03, 'square', 0.03); S.tickT2 = 1; }
  if (S.time <= 0) { handIn(true); return; }

  wUpdate(prof, dt, time);
  if (assist.g.visible) wUpdate(assist, dt, time);
  prof.sees = canSee(prof); assist.sees = canSee(assist);
  pascalUpdate(dt);
  laser.visible = laserDot.visible = prof.state === 'laser';
  if (laser.visible) {
    const pos = laser.geometry.attributes.position;
    prof.hand.getWorldPosition(_v); pos.setXYZ(0, _v.x, _v.y, _v.z);
    pos.setXYZ(1, laserPt.x, laserPt.y, laserPt.z); pos.needsUpdate = true;
    laserDot.position.copy(laserPt);
  }

  // Wohin schaut der Spieler?
  camera.getWorldDirection(fwd);
  let src = null, best = 1;
  for (const s of sources) {
    if (s.id === 'crib' && lidPivot.rotation.x > -1.4) continue;
    const r = angleTo(s.mesh.position) / s.cone;
    if (r < best) { best = r; src = s; }
  }
  const onSheet = !src && angleTo(sheetCenter) < 0.25;
  let tip = '';
  if (src) {
    if (zoomAmt > 0.6 && src.clarity < 1) {
      src.clarity = Math.min(1, src.clarity + dt / 2.2);
      if (src.clarity >= 1) learn(src.qs, src.name);
    }
    const st = Math.floor(src.clarity * 12);
    if (st !== src.step) { src.step = st; drawSource(src); }
    tip = src.clarity >= 1 ? `${src.name} ✓` : `${src.name}: ${Math.round(src.clarity * 100)} %` + (zoomAmt < 0.6 ? (isTouch() ? ' – 🔍 halten' : ' – Zoom halten') : '');
  } else if (onSheet) tip = 'Eigenes Blatt – ankreuzen per Klick';

  // Verdacht
  if (src) {
    let rate = 0;
    for (const w of [prof, assist]) if (w.sees) {
      const near = clamp(1.4 - Math.hypot(w.x - EYE.x, w.z - EYE.z) / 20, 0.7, 1.4);
      rate += 22 * E.strict * (zoomAmt > 0.5 ? 1.7 : 1) * (w.prof && S.laserRow ? 1.5 : 1) * near;
    }
    if (S.pascalOn && pas.state === 'watch') rate += 20;
    if (rate > 0) addSusp(rate * dt); else S.susp = Math.max(0, S.susp - 2 * dt);
  } else S.susp = Math.max(0, S.susp - (hiding ? 18 : onSheet ? 10 : 2.5) * dt);
  if (S.mode !== 'play') return;

  flyerUpdate(eraser, dt, 0.9, 1.4);
  flyerUpdate(note, dt, 0.45, 0.25);
  if ((S.planeT -= dt) <= 0) { spawnPlane(); S.planeT = rnd(16, 28); }
  planesUpdate(dt);
  students.forEach(s => { s.head.rotation.x = Math.sin(time * 0.7 + s.bob) * 0.12 - 0.2; });
  kevin.head.rotation.x = -0.45 + Math.sin(time * 2) * 0.05;
  updateHUD(tip);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.mode === 'play') update(dt, now / 1000);
  // Hochformat: vertikales FOV so weit öffnen, dass horizontal ~60° sichtbar bleiben
  const baseFov = clamp(2 * Math.atan(Math.tan(Math.PI / 6) / camera.aspect) * 180 / Math.PI, 70, 95);
  camera.fov = baseFov * (1 - zoomAmt * 0.66); camera.updateProjectionMatrix();
  camera.rotation.set(look.pitch + Math.sin(now / 1400) * 0.004, look.yaw, 0);
  if (S.msgT > 0 && (S.msgT -= dt) <= 0) $('msg').classList.remove('show');
  if (S.lineT > 0 && (S.lineT -= dt) <= 0) $('task').textContent = '';
  renderer.render(scene, camera);
}

// Startbildschirm: Hörsaal im Hintergrund
S.qs = EXAMS[0].qs.map(([text, ...opts]) => ({ text, opts, correct: 0 }));
S.answers = [-1, -1, -1, -1, -1];
drawSheet(); sources.forEach(drawSource);
prof.s = ringS(0, -8.3); prof.yaw = Math.PI; const p0 = ringPos(prof.s); prof.g.position.set(p0.x, 0, p0.z); prof.g.rotation.y = Math.PI;
assist.g.visible = false; pascal.g.visible = false;
showStart();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
