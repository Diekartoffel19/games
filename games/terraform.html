<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insel-Schmiede 3D</title>
<style>
  :root {
    --panel: rgba(18, 32, 40, 0.82);
    --text: #eef6f2;
    --muted: #9fb8b0;
    --accent: #7fd36b;
    --line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fcfee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
  canvas { display: block; touch-action: none; }
  #ui {
    position: fixed; top: 12px; left: 12px; width: 250px; max-width: calc(100vw - 24px);
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); user-select: none; z-index: 10;
  }
  #ui h1 { font-size: 17px; margin: 2px 0 10px; letter-spacing: 0.3px; }
  .back { color: var(--muted); text-decoration: none; font-size: 12px; }
  .back:hover { color: var(--text); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  button {
    font: inherit; font-size: 13px; color: var(--text); background: rgba(255,255,255,0.07);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 6px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  button.active { background: rgba(127, 211, 107, 0.25); border-color: var(--accent); }
  button kbd { font-size: 10px; color: var(--muted); margin-left: 3px; font-family: inherit; }
  #camBtn { width: 100%; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  label span { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .stats { margin: 10px 0; padding: 8px 10px; border-radius: 9px; background: rgba(0,0,0,0.22); font-size: 14px; }
  .stats small { color: var(--muted); }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; }
  .help { margin-top: 10px; font-size: 11px; line-height: 1.5; color: var(--muted); }
  #toggleUi { display: none; }
  @media (max-width: 560px) {
    #ui { width: 220px; padding: 10px; }
    #ui.collapsed > *:not(#toggleUi):not(h1) { display: none; }
    #toggleUi { display: inline-block; float: right; padding: 2px 8px; font-size: 12px; }
    .help { display: none; }
  }
</style>
</head>
<body>
<div id="ui">
  <a href="../index.html" class="back">← Zurück zum Hub</a>
  <h1>🏝️ Insel-Schmiede <button id="toggleUi">☰</button></h1>
  <div class="modes">
    <button data-mode="raise" class="active">⛰️ Heben<kbd>1</kbd></button>
    <button data-mode="lower">🕳️ Senken<kbd>2</kbd></button>
    <button data-mode="smooth">〰️ Glätten<kbd>3</kbd></button>
    <button data-mode="plant">🌱 Baum<kbd>4</kbd></button>
  </div>
  <button id="camBtn">🎥 Kamera-Modus: aus</button>
  <label>Pinselgröße <span id="radiusVal">12</span></label>
  <input type="range" id="radius" min="3" max="35" value="12">
  <label>Pinselstärke <span id="strengthVal">8</span></label>
  <input type="range" id="strength" min="1" max="20" value="8">
  <div class="stats">🌲 Bäume: <b id="treeCount">0</b> <small>(<span id="growing">0</span> wachsen)</small></div>
  <div class="row">
    <button id="reset">Insel zurücksetzen</button>
    <button id="newIsland">Neue Insel</button>
  </div>
  <div class="help">
    <b>Links</b>: Werkzeug · <b>Rechts</b>/<b>Shift</b>: Senken · <b>Mitte</b>: Glätten<br>
    <b>Leertaste + Ziehen</b>: Drehen (rechts: Schwenken)<br>
    <b>Mausrad</b>: Zoom · <b>1–4</b>: Modus · <b>[ ]</b>: Größe
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.js"></script>
<script>
'use strict';

// ---------- Constants ----------
const SIZE = 200, SEG = 160, N = SEG + 1, STEP = SIZE / SEG, HALF = SIZE / 2;
const H_MIN = -16, H_MAX = 40;
const MAX_TREES = 3500, NATURAL_CAP = 2200;
const CELL = 2.6, GW = Math.ceil(SIZE / CELL);
const START_SEED = 1337;

// ---------- Helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function smooth(a, b, x) { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Fallback gradient noise in case the SimplexNoise CDN fails to load
function fallbackNoise(rnd) {
  const a = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = a[i & 255];
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  const f = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const fx = Math.floor(x), fy = Math.floor(y);
    const X = fx & 255, Y = fy & 255; x -= fx; y -= fy;
    const u = f(x), v = f(y);
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1], ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    const l1 = g(aa, x, y) + (g(ba, x - 1, y) - g(aa, x, y)) * u;
    const l2 = g(ab, x, y - 1) + (g(bb, x - 1, y - 1) - g(ab, x, y - 1)) * u;
    return (l1 + (l2 - l1) * v) * 0.7;
  };
}
function makeNoise(seed) {
  if (window.SimplexNoise) {
    const sn = new SimplexNoise(mulberry32(seed));
    return (x, y) => sn.noise2D(x, y);
  }
  return fallbackNoise(mulberry32(seed));
}

// ---------- Renderer / Scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const SKY = 0x9fcfee;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.FogExp2(SKY, 0.0032);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 2000);
camera.position.set(0, 115, 155);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.32));
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x4a5a3a, 0.35));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.05);
sun.position.set(90, 130, 55);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -125; sc.right = 125; sc.top = 125; sc.bottom = -125; sc.near = 10; sc.far = 400;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.4;
scene.add(sun);

// ---------- Terrain ----------
const H = new Float32Array(N * N);       // heights
const VAR = new Float32Array(N * N);     // static grass color variation
let noise, detail;

const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
terrainGeo.rotateX(-Math.PI / 2); // vertex i = iz * N + ix, x = -HALF + ix*STEP, z = -HALF + iz*STEP
const tPos = terrainGeo.attributes.position;
const tCol = new THREE.BufferAttribute(new Float32Array(N * N * 3), 3);
terrainGeo.setAttribute('color', tCol);
const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
terrain.castShadow = true;
scene.add(terrain);

// Ocean floor beyond the terrain edges
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.MeshStandardMaterial({ color: 0x8a7d55, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -9.2;
floor.receiveShadow = true;
scene.add(floor);

function fbm(x, z, oct) {
  let sum = 0, amp = 1, freq = 1, norm = 0;
  for (let o = 0; o < oct; o++) { sum += noise(x * freq, z * freq) * amp; norm += amp; amp *= 0.5; freq *= 2.03; }
  return sum / norm;
}

function generate(seed) {
  noise = makeNoise(seed);
  detail = makeNoise(seed + 977);
  for (let iz = 0; iz < N; iz++) {
    for (let ix = 0; ix < N; ix++) {
      const i = iz * N + ix;
      const x = -HALF + ix * STEP, z = -HALF + iz * STEP;
      // Radial falloff, warped by noise for an irregular coastline
      let d = Math.hypot(x, z) / HALF;
      d += noise(x * 0.013 + 50, z * 0.013 - 30) * 0.2;
      const mask = 1 - smooth(0.32, 0.95, d);
      const e = fbm(x * 0.011, z * 0.011, 5) * 0.5 + 0.5;
      let ridge = 1 - Math.abs(noise(x * 0.021 + 10, z * 0.021 + 10));
      ridge = ridge * ridge * ridge;
      const land = e * 12 + ridge * 15 * smooth(0.35, 0.75, e) + 2.5;
      H[i] = clamp(land * mask - 9 * (1 - mask), H_MIN, H_MAX);
      VAR[i] = detail(x * 0.07, z * 0.07) * 0.5 + 0.5;
    }
  }
  for (let i = 0; i < N * N; i++) tPos.setY(i, H[i]);
  tPos.needsUpdate = true;
  terrainGeo.computeVertexNormals();
  updateColors(0, SEG, 0, SEG);
  terrainGeo.computeBoundingSphere();
}

const C = {
  deep: new THREE.Color(0x8a7d55), mud: new THREE.Color(0xc2b280), beach: new THREE.Color(0xe0d8a8),
  grass: new THREE.Color(0x4a8505), grass2: new THREE.Color(0x3b6d06), rock: new THREE.Color(0x6b705c),
  snow: new THREE.Color(0xffffff)
};
const _c = new THREE.Color(), _g = new THREE.Color();

function updateColors(ix0, ix1, iz0, iz1) {
  const nrm = terrainGeo.attributes.normal;
  const arr = tCol.array;
  for (let iz = iz0; iz <= iz1; iz++) {
    for (let ix = ix0; ix <= ix1; ix++) {
      const i = iz * N + ix;
      const h = H[i], ny = nrm.getY(i);
      if (h < 0) {
        _c.copy(C.beach).lerp(C.mud, smooth(-0.1, -1.4, h)).lerp(C.deep, clamp(-h / 13));
      } else {
        _g.copy(C.grass).lerp(C.grass2, VAR[i]);
        _c.copy(C.beach).lerp(_g, smooth(1.3, 2.5, h));
        _c.lerp(C.rock, smooth(14, 18, h));
        _c.lerp(C.snow, smooth(21.5, 24.5, h));
        if (h > 0.6) _c.lerp(C.rock, smooth(0.8, 0.66, ny) * (h > 23 ? 0.6 : 1));
      }
      arr[i * 3] = _c.r; arr[i * 3 + 1] = _c.g; arr[i * 3 + 2] = _c.b;
    }
  }
  tCol.needsUpdate = true;
}

function heightAt(x, z) {
  if (x < -HALF || x > HALF || z < -HALF || z > HALF) return -9.2;
  const gx = clamp((x + HALF) / STEP, 0, SEG - 0.0001), gz = clamp((z + HALF) / STEP, 0, SEG - 0.0001);
  const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  const i = iz * N + ix;
  const a = H[i], b = H[i + 1], c = H[i + N], d = H[i + N + 1];
  return (a + (b - a) * fx) * (1 - fz) + (c + (d - c) * fx) * fz;
}
function normalYAt(x, z) {
  const ix = Math.round(clamp((x + HALF) / STEP, 0, SEG)), iz = Math.round(clamp((z + HALF) / STEP, 0, SEG));
  return terrainGeo.attributes.normal.getY(iz * N + ix);
}

// ---------- Water ----------
const WATER_SEG = 140;
const waterGeo = new THREE.PlaneGeometry(700, 700, WATER_SEG, WATER_SEG);
waterGeo.rotateX(-Math.PI / 2);
const wPos = waterGeo.attributes.position;
const wBase = Float32Array.from(wPos.array);
const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x2b8cc4, transparent: true, opacity: 0.76, roughness: 0.12, metalness: 0.05,
  clearcoat: 1, clearcoatRoughness: 0.1, depthWrite: false
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.receiveShadow = true;
water.renderOrder = 1;
scene.add(water);

function animateWater(t) {
  const a = wPos.array;
  for (let i = 0; i < a.length; i += 3) {
    const x = wBase[i], z = wBase[i + 2];
    a[i + 1] = Math.sin(x * 0.08 + t * 1.2) * 0.22 + Math.sin(z * 0.11 + t * 0.9) * 0.18
             + Math.sin((x + z) * 0.045 + t * 0.6) * 0.14;
  }
  wPos.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

// ---------- Trees (InstancedMesh) ----------
const trunkGeo = new THREE.CylinderGeometry(0.22, 0.34, 1.7, 6); trunkGeo.translate(0, 0.85, 0);
const crown1Geo = new THREE.ConeGeometry(1.45, 2.7, 7); crown1Geo.translate(0, 2.75, 0);
const crown2Geo = new THREE.ConeGeometry(1.0, 2.1, 7); crown2Geo.translate(0, 3.9, 0);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.9, flatShading: true });
const crownMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, flatShading: true });
const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, MAX_TREES);
const crowns1 = new THREE.InstancedMesh(crown1Geo, crownMat, MAX_TREES);
const crowns2 = new THREE.InstancedMesh(crown2Geo, crownMat, MAX_TREES);
const DEAD = new THREE.Color(0x7a5a2a);
for (const m of [trunks, crowns1, crowns2]) {
  m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; m.count = 0;
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(m);
}
for (let i = 0; i < MAX_TREES; i++) { crowns1.setColorAt(i, C.grass); crowns2.setColorAt(i, C.grass); }

let trees = [];
const occ = new Uint8Array(GW * GW);
const rnd = Math.random;

function cellOf(x, z) {
  const cx = clamp(Math.floor((x + HALF) / CELL), 0, GW - 1), cz = clamp(Math.floor((z + HALF) / CELL), 0, GW - 1);
  return cz * GW + cx;
}
function groundOK(x, z) {
  if (Math.abs(x) > HALF - 1 || Math.abs(z) > HALF - 1) return false;
  const h = heightAt(x, z);
  if (h < 1.4 || h > 16.5) return false;
  return normalYAt(x, z) >= 0.8;
}
function spawnTree(x, z, growth, cap = MAX_TREES) {
  if (trees.length >= cap) return false;
  const cell = cellOf(x, z);
  if (occ[cell] || !groundOK(x, z)) return false;
  occ[cell] = 1;
  const col = new THREE.Color().setHSL(0.24 + rnd() * 0.08, 0.55 + rnd() * 0.25, 0.22 + rnd() * 0.1);
  trees.push({
    x, z, cell, s: growth, grow: 0.035 + rnd() * 0.045, max: 0.65 + rnd() * 0.6,
    rot: rnd() * Math.PI * 2, lean: rnd() * Math.PI * 2, dying: 0, col, tint: new THREE.Color()
  });
  return true;
}
function clearTrees() { trees = []; occ.fill(0); }
function initialForest() {
  let tries = 0;
  while (trees.length < 450 && tries++ < 20000) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * HALF * 0.85;
    spawnTree(Math.cos(a) * r, Math.sin(a) * r, 0.1 + rnd() * 0.9);
  }
}

const dummy = new THREE.Object3D();
let spawnAcc = 0;

function updateTrees(dt) {
  // Natural spreading: seeds near mature trees, plus occasional random colonisation
  spawnAcc += dt * 18;
  while (spawnAcc >= 1) {
    spawnAcc--;
    if (trees.length && rnd() < 0.7) {
      const p = trees[(rnd() * trees.length) | 0];
      if (p.s > 0.6 && !p.dying) {
        const a = rnd() * Math.PI * 2, r = 2.6 + rnd() * 5;
        spawnTree(p.x + Math.cos(a) * r, p.z + Math.sin(a) * r, 0.1, NATURAL_CAP);
      }
    } else {
      spawnTree((rnd() * 2 - 1) * HALF, (rnd() * 2 - 1) * HALF, 0.1, NATURAL_CAP);
    }
  }

  for (let i = trees.length - 1; i >= 0; i--) {
    const t = trees[i];
    const h = heightAt(t.x, t.z), ny = normalYAt(t.x, t.z);
    t.y = h;
    if (h < 0.1) t.dying += dt * 2.2;                                    // drowned
    else if (h < 0.9 || h > 18 || ny < 0.7) t.dying += dt * 0.45;        // bad ground
    else if (!t.dying) t.s = Math.min(1, t.s + t.grow * dt);             // growth 0.1 -> 1.0
    else t.dying += dt * 0.3;                                            // dead tree keeps decaying
    if (t.dying >= 1) {
      occ[t.cell] = 0;
      trees[i] = trees[trees.length - 1];
      trees.pop();
    }
  }

  for (let i = 0; i < trees.length; i++) {
    const t = trees[i];
    const k = t.s * t.max * (1 - t.dying * 0.85);
    dummy.position.set(t.x, t.y - 0.15, t.z);
    dummy.rotation.set(Math.cos(t.lean) * t.dying * 0.7, t.rot, Math.sin(t.lean) * t.dying * 0.7);
    dummy.scale.set(k, k, k);
    dummy.updateMatrix();
    trunks.setMatrixAt(i, dummy.matrix);
    crowns1.setMatrixAt(i, dummy.matrix);
    crowns2.setMatrixAt(i, dummy.matrix);
    t.tint.copy(t.col).lerp(DEAD, clamp(t.dying * 2));
    crowns1.setColorAt(i, t.tint);
    t.tint.multiplyScalar(1.18);
    crowns2.setColorAt(i, t.tint);
  }
  for (const m of [trunks, crowns1, crowns2]) { m.count = trees.length; m.instanceMatrix.needsUpdate = true; }
  crowns1.instanceColor.needsUpdate = true;
  crowns2.instanceColor.needsUpdate = true;
}

// ---------- Brush ----------
const brush = { radius: 12, strength: 8 };
let mode = 'raise';
let hit = null;
let plantAcc = 0;

function applyBrush(op, dt) {
  const r = brush.radius, s = brush.strength;
  if (op === 'plant') {
    plantAcc += dt * s * 2.5;
    while (plantAcc >= 1) {
      plantAcc--;
      for (let k = 0; k < 6; k++) {
        const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * r;
        if (spawnTree(hit.x + Math.cos(a) * rr, hit.z + Math.sin(a) * rr, 0.1)) break;
      }
    }
    return;
  }
  const ix0 = Math.max(0, Math.floor((hit.x - r + HALF) / STEP)), ix1 = Math.min(SEG, Math.ceil((hit.x + r + HALF) / STEP));
  const iz0 = Math.max(0, Math.floor((hit.z - r + HALF) / STEP)), iz1 = Math.min(SEG, Math.ceil((hit.z + r + HALF) / STEP));
  if (ix0 > ix1 || iz0 > iz1) return;
  const snap = op === 'smooth' ? H.slice() : null;
  for (let iz = iz0; iz <= iz1; iz++) {
    for (let ix = ix0; ix <= ix1; ix++) {
      const x = -HALF + ix * STEP, z = -HALF + iz * STEP;
      const d = Math.hypot(x - hit.x, z - hit.z);
      if (d > r) continue;
      let f = 1 - (d / r) * (d / r); f *= f;
      const i = iz * N + ix;
      if (op === 'raise' || op === 'lower') {
        // Noise-textured brush: produces lumpy, natural shapes instead of a smooth cone
        const tex = 0.35 + 1.3 * (noise(x * 0.17 + 300, z * 0.17) * 0.5 + 0.5) + 0.25 * detail(x * 0.45, z * 0.45);
        const delta = s * 1.25 * dt * f * Math.max(0.1, tex);
        H[i] += op === 'raise' ? delta : -delta;
      } else {
        let sum = 0, cnt = 0;
        for (let oz = -1; oz <= 1; oz++) for (let ox = -1; ox <= 1; ox++) {
          const jx = ix + ox, jz = iz + oz;
          if (jx < 0 || jz < 0 || jx > SEG || jz > SEG) continue;
          sum += snap[jz * N + jx]; cnt++;
        }
        H[i] += (sum / cnt - H[i]) * Math.min(1, f * s * dt * 0.7);
      }
      H[i] = clamp(H[i], H_MIN, H_MAX);
      tPos.setY(i, H[i]);
    }
  }
  tPos.needsUpdate = true;
  terrainGeo.computeVertexNormals();
  updateColors(Math.max(0, ix0 - 1), Math.min(SEG, ix1 + 1), Math.max(0, iz0 - 1), Math.min(SEG, iz1 + 1));
  boundsDirty = true;
}
let boundsDirty = false;

// Brush cursor: ring that hugs the terrain
const RING_SEG = 72;
const ringGeo = new THREE.BufferGeometry();
const ringPos = new Float32Array((RING_SEG + 1) * 2 * 3);
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
const ringIdx = [];
for (let k = 0; k < RING_SEG; k++) {
  const a = k * 2, b = a + 1, c = a + 2, d = a + 3;
  ringIdx.push(a, c, b, b, c, d);
}
ringGeo.setIndex(ringIdx);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, depthTest: false, side: THREE.DoubleSide, fog: false });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.renderOrder = 10;
ring.frustumCulled = false;
ring.visible = false;
scene.add(ring);
const RING_COLORS = { raise: 0xffe066, lower: 0xff6b5b, smooth: 0x6bc8ff, plant: 0x8cff6b };

function updateRing(op) {
  if (!hit || camMode) { ring.visible = false; return; }
  ring.visible = true;
  ringMat.color.setHex(RING_COLORS[op] || 0xffffff);
  const r = brush.radius, w = Math.max(0.35, r * 0.06);
  for (let k = 0; k <= RING_SEG; k++) {
    const a = k / RING_SEG * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    for (let j = 0; j < 2; j++) {
      const rr = j ? r : r - w;
      const x = hit.x + ca * rr, z = hit.z + sa * rr;
      const o = (k * 2 + j) * 3;
      ringPos[o] = x; ringPos[o + 1] = Math.max(heightAt(x, z), 0.25) + 0.35; ringPos[o + 2] = z;
    }
  }
  ringGeo.attributes.position.needsUpdate = true;
}

// Ray march along the mouse ray against the heightfield
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hasMouse = false;
const _p = new THREE.Vector3();
function pickTerrain() {
  if (!hasMouse) return null;
  raycaster.setFromCamera(mouse, camera);
  const { origin, direction } = raycaster.ray;
  let prev = 0, stepLen = 0.6;
  for (let t = 0; t < 900; t += stepLen) {
    _p.copy(direction).multiplyScalar(t).add(origin);
    if (_p.y < H_MIN - 1) break;
    if (_p.y <= heightAt(_p.x, _p.z)) {
      let lo = prev, hi = t;
      for (let k = 0; k < 10; k++) {
        const m = (lo + hi) / 2;
        _p.copy(direction).multiplyScalar(m).add(origin);
        if (_p.y <= heightAt(_p.x, _p.z)) hi = m; else lo = m;
      }
      _p.copy(direction).multiplyScalar(hi).add(origin);
      if (Math.abs(_p.x) > HALF || Math.abs(_p.z) > HALF) return null;
      return { x: _p.x, z: _p.z };
    }
    prev = t;
    stepLen = 0.6 + t * 0.002;
  }
  return null;
}

// ---------- Input ----------
let painting = null, spaceDown = false, camMode = false;

canvas.addEventListener('pointerdown', e => {
  const nav = camMode || spaceDown || e.pointerType === 'touch' && !e.isPrimary;
  controls.enableRotate = nav;
  controls.enablePan = nav;
  if (nav) { painting = null; return; }
  updateMouse(e);
  if (e.button === 0) painting = e.shiftKey ? 'lower' : mode;
  else if (e.button === 2) painting = 'lower';
  else if (e.button === 1) { painting = 'smooth'; e.preventDefault(); }
  plantAcc = mode === 'plant' ? 1 : 0;
});
function updateMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  hasMouse = true;
}
canvas.addEventListener('pointermove', updateMouse);
canvas.addEventListener('pointerleave', () => { if (!painting) hasMouse = false; });
window.addEventListener('pointerup', () => { painting = null; });
window.addEventListener('pointercancel', () => { painting = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('auxclick', e => e.preventDefault());

// Controls are created after our pointerdown listener so we can toggle rotate/pan first
const controls = new THREE.OrbitControls(camera, canvas);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: -1, RIGHT: THREE.MOUSE.PAN };
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.45;
controls.minDistance = 25;
controls.maxDistance = 420;
controls.enableRotate = false;
controls.enablePan = false;

// ---------- UI ----------
const $ = id => document.getElementById(id);
const modeBtns = document.querySelectorAll('[data-mode]');
function setMode(m) {
  mode = m;
  modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === m));
}
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
function setCamMode(on) {
  camMode = on;
  $('camBtn').classList.toggle('active', on);
  $('camBtn').textContent = '🎥 Kamera-Modus: ' + (on ? 'an' : 'aus');
}
$('camBtn').addEventListener('click', () => setCamMode(!camMode));
function setRadius(v) { brush.radius = clamp(+v, 3, 35); $('radius').value = brush.radius; $('radiusVal').textContent = brush.radius; }
$('radius').addEventListener('input', e => setRadius(e.target.value));
$('strength').addEventListener('input', e => { brush.strength = +e.target.value; $('strengthVal').textContent = e.target.value; });
$('toggleUi').addEventListener('click', () => $('ui').classList.toggle('collapsed'));

let currentSeed = START_SEED;
function resetIsland(seed) {
  currentSeed = seed;
  generate(seed);
  clearTrees();
  initialForest();
}
$('reset').addEventListener('click', () => resetIsland(currentSeed));
$('newIsland').addEventListener('click', () => resetIsland((Math.random() * 1e9) | 0));

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); }
  else if (e.key === '1') setMode('raise');
  else if (e.key === '2') setMode('lower');
  else if (e.key === '3') setMode('smooth');
  else if (e.key === '4') setMode('plant');
  else if (e.key === '[') setRadius(brush.radius - 1);
  else if (e.key === ']') setRadius(brush.radius + 1);
});
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });
window.addEventListener('blur', () => { spaceDown = false; painting = null; });

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Loop ----------
resetIsland(START_SEED);
const clock = new THREE.Clock();
let time = 0, uiAcc = 0;

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  hit = camMode ? null : pickTerrain();
  if (painting && hit) applyBrush(painting, dt);
  if (boundsDirty && !painting) { terrainGeo.computeBoundingSphere(); boundsDirty = false; }
  updateRing(painting || (spaceDown ? null : mode));
  if (spaceDown) ring.visible = false;

  updateTrees(dt);
  animateWater(time);

  uiAcc += dt;
  if (uiAcc > 0.25) {
    uiAcc = 0;
    $('treeCount').textContent = trees.length;
    $('growing').textContent = trees.reduce((n, t) => n + (t.s < 1 && !t.dying ? 1 : 0), 0);
  }

  controls.update();
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
