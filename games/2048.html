<style>
body { touch-action: manipulation; }
.top { display:flex; gap:10px; justify-content:center; align-items:center; margin:10px auto; flex-wrap:wrap; }
.box { background:#312e81; padding:6px 14px; border-radius:10px; min-width:80px; }
.box small { display:block; color:#a5b4fc; font-size:.7rem; }
.box b { font-size:1.25rem; }
button { background:#f59e0b; border:0; color:#fff; font-weight:bold; padding:10px 16px; border-radius:10px; cursor:pointer; font-size:0.95rem; touch-action:manipulation; transition: transform 0.1s, opacity 0.2s; }
button:hover { background:#d97706; }
button:disabled { opacity:0.4; cursor:not-allowed; }
#board { position:relative; width:min(90vw, 380px); height:min(90vw, 380px); margin:15px auto; background:#1e1b4b; border-radius:14px; padding:2.5%; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden; }
.cell, .tile { position:absolute; width:21.875%; height:21.875%; border-radius:8px; }
.cell { background:#2e2a6b; }
.tile { display:flex; align-items:center; justify-content:center; font-weight:900; font-size:clamp(1.1rem, 5vw, 1.9rem); transition:left .11s cubic-bezier(0.2, 0.8, 0.4, 1), top .11s cubic-bezier(0.2, 0.8, 0.4, 1); color:#fff; z-index:2; will-change:left, top, transform; }
.tile.new { animation:pop .2s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
.tile.merged { animation:bump .22s ease-in-out; z-index:3; }
@keyframes pop { from { transform:scale(0); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes bump { 0% { transform:scale(1); } 50% { transform:scale(1.18); } 100% { transform:scale(1); } }

<body>
<a class="back" href="../index.html">← Arcade</a>
<h1>🔢 2048</h1>
<div class="top">
  <div class="box"><small>SCORE</small><b id="score">0</b></div>
  <div class="box"><small>BEST</small><b id="best">0</b></div>
  <button id="undoBtn" onclick="undo()" disabled style="background:#6366f1;">↶ Undo</button>
  <button onclick="reset()">New</button>
</div>
<div id="board"><div id="msg"><h2 id="msgText"></h2><div style="display:flex;gap:10px;"><button id="keepBtn" style="display:none;background:#4f46e5;" onclick="keepPlaying()">Continue</button><button onclick="reset()">Again</button></div></div></div>

<div class="arrows-pad">
  <div class="arow">
    <button class="abtn" onclick="move(-1,0)" aria-label="Up">▲</button>
  </div>
  <div class="arow">
    <button class="abtn" onclick="move(0,-1)" aria-label="Left">◀</button>
    <button class="abtn" onclick="move(1,0)" aria-label="Down">▼</button>
    <button class="abtn" onclick="move(0,1)" aria-label="Right">▶</button>
  </div>
</div>

<p class="info">Swipe / buttons / arrow keys: slide tiles together to reach 2048!</p>
<script>
const boardEl = document.getElementById("board");
const COLORS = { 2:"#64748b", 4:"#7c3aed", 8:"#db2777", 16:"#ea580c", 32:"#dc2626", 64:"#e11d48", 128:"#ca8a04", 256:"#16a34a", 512:"#0891b2", 1024:"#2563eb", 2048:"#f59e0b" };
let grid, score, best = +localStorage.best2048 || 0, won, over = false, msgTimer = null, id = 0;
let historyState = null;
const pos = i => (2.5 + i * 24.375) + "%";

for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
  const d = document.createElement("div"); d.className = "cell";
  d.style.left = pos(c); d.style.top = pos(r); boardEl.appendChild(d);
}

function playSound(type, val = 2) {
  if (window.ArcadeCore) {
    if (type === 'merge') ArcadeCore.sounds.merge(Math.log2(val));
    else if (type === 'slide') ArcadeCore.sounds.pop(1);
    else if (type === 'win') ArcadeCore.sounds.powerup();
    else if (type === 'over') ArcadeCore.sounds.gameOver();
  }
}

function updateUndoBtn() {
  const btn = document.getElementById("undoBtn");
  if (btn) btn.disabled = !historyState || over;
}

function reset() {
  clearTimeout(msgTimer);
  boardEl.querySelectorAll(".tile").forEach(t => t.remove());
  grid = [...Array(4)].map(() => Array(4).fill(null));
  score = 0; won = false; over = false; historyState = null;
  updateUndoBtn();
  document.getElementById("msg").style.display = "none";
  document.getElementById("keepBtn").style.display = "none";
  add(); add(); render();
}

function keepPlaying() {
  document.getElementById("msg").style.display = "none";
  document.getElementById("keepBtn").style.display = "none";
}

function saveHistory() {
  const clonedGrid = grid.map(row => row.map(cell => cell ? { v: cell.v, id: cell.id } : null));
  historyState = { grid: clonedGrid, score, won };
  updateUndoBtn();
}

function undo() {
  if (!historyState || over) return;
  boardEl.querySelectorAll(".tile").forEach(t => t.remove());
  grid = historyState.grid.map(row => row.map(cell => cell ? { v: cell.v, id: cell.id, isNew: false, merged: false } : null));
  score = historyState.score;
  won = historyState.won;
  historyState = null;
  updateUndoBtn();
  if (window.ArcadeCore) ArcadeCore.sounds.pop(0.8);
  render();
}

function add() {
  const empty = [];
  grid.forEach((row, r) => row.forEach((v, c) => !v && empty.push([r, c])));
  if (!empty.length) return;
  const [r, c] = empty[Math.random() * empty.length | 0];
  grid[r][c] = { v: Math.random() < 0.9 ? 2 : 4, id: id++, isNew: true };
}

function move(dr, dc) {
  if (over || document.getElementById("msg").style.display === "flex") return;
  
  // Clone current state for potential history save
  const preMoveSnapshot = {
    grid: grid.map(row => row.map(cell => cell ? { v: cell.v, id: cell.id } : null)),
    score,
    won
  };

  let moved = false;
  let maxMergedVal = 0;
  const order = [0, 1, 2, 3]; if (dr > 0 || dc > 0) order.reverse();
  grid.flat().forEach(t => t && (t.merged = t.isNew = false));

  for (const r of order) for (const c of order) {
    const t = grid[r][c]; if (!t) continue;
    let nr = r, nc = c;
    while (true) {
      const tr = nr + dr, tc = nc + dc;
      if (tr < 0 || tr > 3 || tc < 0 || tc > 3) break;
      const o = grid[tr][tc];
      if (!o) { nr = tr; nc = tc; continue; }
      if (o.v === t.v && !o.merged) {
        o.v *= 2; o.merged = true; score += o.v; grid[r][c] = null;
        if (o.v > maxMergedVal) maxMergedVal = o.v;
        if (t.el) {
          slide(t.el, tr, tc);
          setTimeout(() => t.el && t.el.remove(), 110);
        }
        if (o.v === 2048 && !won) {
          won = true;
          playSound('win');
          msgTimer = setTimeout(() => {
            document.getElementById("keepBtn").style.display = "inline-block";
            show("You win! 🎉");
          }, 300);
        }
        moved = true; nr = null; break;
      }
      break;
    }
    if (nr !== null && (nr !== r || nc !== c)) {
      grid[nr][nc] = t;
      grid[r][c] = null;
      moved = true;
    }
  }

  if (moved) {
    historyState = preMoveSnapshot;
    updateUndoBtn();
    if (maxMergedVal > 0) playSound('merge', maxMergedVal);
    else playSound('slide');

    add();
    render();
    if (!canMove()) {
      over = true;
      updateUndoBtn();
      playSound('over');
      msgTimer = setTimeout(() => {
        document.getElementById("keepBtn").style.display = "none";
        show("No moves left!");
      }, 350);
    }
  }
}

function canMove() {
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    if (!grid[r][c]) return true;
    if (c < 3 && grid[r][c+1] && grid[r][c+1].v === grid[r][c].v) return true;
    if (r < 3 && grid[r+1][c] && grid[r+1][c].v === grid[r][c].v) return true;
  }
  return false;
}

function slide(el, r, c) {
  el.style.left = pos(c);
  el.style.top = pos(r);
}

function render() {
  grid.forEach((row, r) => row.forEach((t, c) => {
    if (!t) return;
    if (!t.el) {
      t.el = document.createElement("div");
      boardEl.appendChild(t.el);
    }
    t.el.className = "tile" + (t.isNew ? " new" : "") + (t.merged ? " merged" : "");
    t.el.textContent = t.v;
    t.el.style.background = COLORS[t.v] || "#111";
    t.el.style.boxShadow = t.v >= 128 ? `0 0 20px ${COLORS[t.v] || "#fff"}` : "none";
    t.el.style.fontSize = t.v >= 1024 ? "clamp(0.95rem, 3.8vw, 1.35rem)" : t.v >= 128 ? "clamp(1.1rem, 4.5vw, 1.6rem)" : "clamp(1.3rem, 5.5vw, 2rem)";
    slide(t.el, r, c);
  }));

  document.getElementById("score").textContent = score;
  if (score > best) {
    best = score;
    localStorage.best2048 = best;
    if (window.ArcadeCore) ArcadeCore.saveScore('2048', best);
  }
  document.getElementById("best").textContent = best;
}

function show(text) {
  document.getElementById("msgText").textContent = text;
  document.getElementById("msg").style.display = "flex";
}

const KEYS = { ArrowUp:[-1,0], KeyW:[-1,0], ArrowDown:[1,0], KeyS:[1,0], ArrowLeft:[0,-1], KeyA:[0,-1], ArrowRight:[0,1], KeyD:[0,1] };
addEventListener("keydown", e => {
  if (KEYS[e.code]) {
    e.preventDefault();
    move(...KEYS[e.code]);
  } else if ((e.code === 'KeyZ' && (e.ctrlKey || e.metaKey)) || e.code === 'Backspace') {
    e.preventDefault();
    undo();
  }
});

let sx = null, sy = null;
boardEl.addEventListener("pointerdown", e => {
  if (e.target.closest("#msg")) return;
  sx = e.clientX; sy = e.clientY;
  try { boardEl.setPointerCapture(e.pointerId); } catch(err) {}
});
boardEl.addEventListener("pointerup", e => {
  if (sx === null || sy === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  sx = sy = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  Math.abs(dx) > Math.abs(dy) ? move(0, Math.sign(dx)) : move(Math.sign(dy), 0);
});
boardEl.addEventListener("pointercancel", () => { sx = sy = null; });
reset();
</script>
