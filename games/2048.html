<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>2048</title><link rel="stylesheet" href="../style.css">
<style>
.top { display:flex; gap:12px; justify-content:center; align-items:center; margin:10px; }
.box { background:#312e81; padding:8px 18px; border-radius:10px; min-width:90px; }
.box small { display:block; color:#a5b4fc; font-size:.75rem; }
.box b { font-size:1.4rem; }
button { background:#f59e0b; border:0; color:#fff; font-weight:bold; padding:12px 18px; border-radius:10px; cursor:pointer; font-size:1rem; }
button:hover { background:#d97706; }
#board { position:relative; width:400px; height:400px; margin:20px auto; background:#1e1b4b; border-radius:14px; padding:10px; touch-action:none; }
.cell, .tile { position:absolute; width:85px; height:85px; border-radius:10px; }
.cell { background:#2e2a6b; }
.tile { display:flex; align-items:center; justify-content:center; font-weight:900; font-size:2rem; transition:left .1s, top .1s; color:#fff; }
.tile.new { animation:pop .2s; }
.tile.merged { animation:bump .2s; }
@keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
@keyframes bump { 50% { transform:scale(1.15); } }
#msg { position:absolute; inset:0; background:rgba(15,23,42,.8); border-radius:14px; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
#msg h2 { font-size:2.5rem; margin:0 0 15px; }
</style></head>
<body>
<a class="back" href="../index.html">← Back</a>
<h1>🔢 2048</h1>
<div class="top">
  <div class="box"><small>SCORE</small><b id="score">0</b></div>
  <div class="box"><small>BEST</small><b id="best">0</b></div>
  <button onclick="reset()">New Game</button>
</div>
<div id="board"><div id="msg"><h2 id="msgText"></h2><button onclick="reset()">Play Again</button></div></div>
<p class="info">Arrow keys / WASD or swipe to slide tiles. Join the numbers to reach 2048!</p>
<script>
const boardEl = document.getElementById("board");
const COLORS = { 2:"#64748b", 4:"#7c3aed", 8:"#db2777", 16:"#ea580c", 32:"#dc2626", 64:"#e11d48", 128:"#ca8a04", 256:"#16a34a", 512:"#0891b2", 1024:"#2563eb", 2048:"#f59e0b" };
let grid, score, best = +localStorage.best2048 || 0, won, id = 0;
const pos = i => 10 + i * 97.5;
for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
  const d = document.createElement("div"); d.className = "cell";
  d.style.left = pos(c) + "px"; d.style.top = pos(r) + "px"; boardEl.appendChild(d);
}
function reset() {
  boardEl.querySelectorAll(".tile").forEach(t => t.remove());
  grid = [...Array(4)].map(() => Array(4).fill(null));
  score = 0; won = false; document.getElementById("msg").style.display = "none";
  add(); add(); render();
}
function add() {
  const empty = [];
  grid.forEach((row, r) => row.forEach((v, c) => !v && empty.push([r, c])));
  if (!empty.length) return;
  const [r, c] = empty[Math.random() * empty.length | 0];
  grid[r][c] = { v: Math.random() < 0.9 ? 2 : 4, id: id++, isNew: true };
}
function move(dr, dc) {
  let moved = false;
  const order = [0, 1, 2, 3]; if (dr > 0 || dc > 0) order.reverse();
  grid.flat().forEach(t => t && (t.merged = t.isNew = false));
  for (const r of order) for (const c of order) {
    const t = grid[r][c]; if (!t) continue;
    let nr = r, nc = c;
    while (true) {
      const tr = nr + dr, tc = nc + dc;
      if (tr < 0 || tr > 3 || tc < 0 || tc > 3) break;
      const o = grid[tr][tc];
      if (!o) { nr = tr; nc = tc; continue; }
      if (o.v === t.v && !o.merged) {
        o.v *= 2; o.merged = true; score += o.v; grid[r][c] = null;
        t.dead = { r: tr, c: tc }; t.el && slide(t.el, tr, tc); setTimeout(() => t.el && t.el.remove(), 100);
        if (o.v === 2048 && !won) { won = true; setTimeout(() => show("You win! 🎉"), 300); }
        moved = true; nr = null; break;
      }
      break;
    }
    if (nr !== null && (nr !== r || nc !== c)) { grid[nr][nc] = t; grid[r][c] = null; moved = true; }
  }
  if (moved) { add(); render(); if (!canMove()) setTimeout(() => show("Game Over"), 300); }
}
function canMove() {
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    if (!grid[r][c]) return true;
    if (c < 3 && grid[r][c+1] && grid[r][c+1].v === grid[r][c].v) return true;
    if (r < 3 && grid[r+1][c] && grid[r+1][c].v === grid[r][c].v) return true;
  }
  return false;
}
function slide(el, r, c) { el.style.left = pos(c) + "px"; el.style.top = pos(r) + "px"; }
function render() {
  grid.forEach((row, r) => row.forEach((t, c) => {
    if (!t) return;
    if (!t.el) { t.el = document.createElement("div"); boardEl.appendChild(t.el); }
    t.el.className = "tile" + (t.isNew ? " new" : "") + (t.merged ? " merged" : "");
    t.el.textContent = t.v;
    t.el.style.background = COLORS[t.v] || "#111";
    t.el.style.boxShadow = t.v >= 128 ? `0 0 20px ${COLORS[t.v] || "#fff"}` : "none";
    t.el.style.fontSize = t.v >= 1024 ? "1.5rem" : t.v >= 128 ? "1.8rem" : "2rem";
    slide(t.el, r, c);
  }));
  document.getElementById("score").textContent = score;
  if (score > best) { best = score; localStorage.best2048 = best; }
  document.getElementById("best").textContent = best;
}
function show(text) { document.getElementById("msgText").textContent = text; document.getElementById("msg").style.display = "flex"; }
const KEYS = { ArrowUp:[-1,0], KeyW:[-1,0], ArrowDown:[1,0], KeyS:[1,0], ArrowLeft:[0,-1], KeyA:[0,-1], ArrowRight:[0,1], KeyD:[0,1] };
addEventListener("keydown", e => { if (KEYS[e.code]) { e.preventDefault(); move(...KEYS[e.code]); } });
let sx, sy;
boardEl.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
boardEl.addEventListener("pointerup", e => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  Math.abs(dx) > Math.abs(dy) ? move(0, Math.sign(dx)) : move(Math.sign(dy), 0);
});
reset();
</script>
</body>
</html>
